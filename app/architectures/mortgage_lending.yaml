agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Production & Pipeline Agent
        icon: genie
        summary: Ask about origination volume, margin and pull-through by channel in plain language.
        feeds:
          - ICE Encompass LOS
          - Optimal Blue PPE
          - Margin, delinquency, prepayment risk
        teams:
          - Origination
          - Production leaders
          - Lending Exec
        questions:
          - What did each channel originate last month?
          - Where has gain-on-sale margin compressed this quarter?
          - What is pull-through by loan officer and product?
          - Which loans are stuck in the pipeline and why?
          - How does cycle time to clear-to-close compare across branches?
      - name: Credit & Underwriting Agent
        icon: genie
        summary: Ask about credit decisions, findings and conditions across the book in plain language.
        feeds:
          - Fannie Mae DU
          - Tri-Merge Credit
          - Conformed loan, borrower, property
        teams:
          - Underwriting
          - Underwriters
          - Credit policy
        questions:
          - What is our approval rate by product and channel this month?
          - Which conditions most often delay a clear-to-close?
          - How do DU and LPA findings differ on our applications?
          - Where are overlays above the agency systems costing volume?
          - Which applications were denied and for what reason codes?
      - name: Servicing & Default Agent
        icon: genie
        summary: Ask about delinquency, roll rates and workouts across the servicing book in plain language.
        feeds:
          - Black Knight MSP
          - Default & Collections
          - Margin, delinquency, prepayment risk
        teams:
          - Servicing Ops
          - Default & loss mitigation
          - Retention
        questions:
          - What is delinquency and roll rate by vintage right now?
          - Which loans are most likely to roll to foreclosure this month?
          - What is our cure rate by workout type?
          - Which borrowers are at highest payoff and refinance risk?
          - Where are escrow shortfalls concentrated across the book?
      - name: Secondary & MSR Agent
        icon: genie
        summary: Ask about the lock pipeline, best execution and MSR valuation in plain language.
        feeds:
          - MCT Secondary
          - Optimal Blue PPE
          - Margin, delinquency, prepayment risk
        teams:
          - Secondary Desk
          - Secondary marketing
          - MSR & portfolio
        questions:
          - What is our current rate-lock pipeline and pull-through?
          - Where is best execution strongest across investors today?
          - What is our hedge position against the pipeline right now?
          - How have prepayment speeds moved on the MSR book?
          - What is the MSR valuation by investor and vintage?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Automated Underwriting
        short: Underwriting
        icon: gauge
        summary: Assembling the full loan file, running it against DU and LPA and a scored recommendation, and surfacing only the exceptions that need human judgment.
        problem: Underwriters re-key data from pay stubs, bank statements and bureau pulls across five systems, so files sit in queues and straight-through cases still wait behind manual review.
        who_benefits: Underwriting
        how_built: Documents are extracted with AI Functions and joined to DU and LPA findings in the lakehouse; a scored recommendation and reason codes are served to the Underwriting Copilot for exception-only review under lender-approved straight-through rules.
        components:
          - Underwriting Copilot
          - Fannie Mae DU
          - Freddie Mac LPA
          - AI Functions
          - Model Serving
        stories:
          - title: Vantage Bank Texas accelerates loan processing with AI
            url: https://www.databricks.com/blog/accelerating-loan-processing-ai-databricks-how-vantage-bank-texas-transformed-lending
          - title: 'AI applications in finance: credit and underwriting'
            url: https://www.databricks.com/blog/ai-applications-in-finance
      - name: Credit Decisioning
        short: Credit risk
        icon: identity
        summary: Scoring creditworthiness on bureau, income, asset and alternative data with models evaluated for predictive quality, explainability and policy compliance.
        problem: Traditional scorecards decline thin-file and non-traditional borrowers a lender could safely approve, and the models are hard to explain when the decision is challenged.
        who_benefits: Underwriting
        how_built: Bureau, income and cash-flow data are conformed and engineered in Feature Store; credit models are trained and versioned in MLflow and scored in Model Serving with Unity Catalog lineage.
        components:
          - Tri-Merge Credit
          - Model Serving
          - Feature Store
          - MLflow
          - Unity Catalog
        stories:
          - title: Finda delivers faster, informed loans on Databricks
            url: https://www.databricks.com/customers/finda
          - title: Vivriti Capital scales real-time lending and credit
            url: https://www.databricks.com/customers/vivriti-capital
      - name: Fair Lending & HMDA
        short: Compliance
        icon: gavel
        summary: Monitoring approval, pricing and denial outcomes for disparate impact and producing HMDA and adverse-action evidence that supports examiner review.
        problem: Fair-lending testing runs quarterly on extracts in spreadsheets, so disparate impact is found after loans are booked and completeness is hard to prove to the CFPB.
        who_benefits: Underwriting
        how_built: Decision, pricing and HMDA fields are conformed to Gold with Unity Catalog lineage; defined statistical fairness metrics and reason codes derived from actual decisions are computed, with AI Functions assisting narrative preparation, and read in the Fair Lending Monitor.
        components:
          - Fair Lending Monitor
          - HMDA / LAR
          - AI/BI
          - Unity Catalog
          - AI Functions
        stories:
          - title: 'Databricks for Financial Services: lending and risk'
            url: https://www.databricks.com/solutions/industries/financial-services
      - name: Loan Document Processing
        short: Docs
        icon: docs
        summary: Classifying and extracting income, asset, title and closing documents into structured loan data as soon as they arrive, instead of a stipulation queue.
        problem: Borrower documents arrive as phone photos and mixed-quality scans in the POS, and manual indexing and re-keying is the slowest, most error-prone step in the file.
        who_benefits: Origination
        how_built: Documents stream in from Blend and the POS and are classified and extracted with Document Intelligence, then written back into Encompass as structured, extracted fields, marked verified only after the income and asset verification step.
        components:
          - Doc & OCR Stream
          - Document Intelligence
          - AI Functions
          - Blend POS
          - ICE Encompass LOS
        stories:
          - title: Vantage Bank Texas accelerates loan processing with AI
            url: https://www.databricks.com/blog/accelerating-loan-processing-ai-databricks-how-vantage-bank-texas-transformed-lending
      - name: Lead & Pull-Through
        short: Production
        icon: aisvc
        summary: Scoring which leads convert and which locked loans actually fund, so loan officers and marketing spend on the applications that will close.
        problem: Leads and locked pipeline are worked on gut feel, so marketing dollars chase applications that never fund and pull-through is only known after the month closes.
        who_benefits: Origination
        how_built: Lead, application and lock data are activated through CustomerLake; conversion and pull-through models are scored in Model Serving and read against pricing in AI/BI.
        components:
          - CustomerLake
          - Model Serving
          - AI/BI
          - ICE Encompass LOS
          - Optimal Blue PPE
      - name: Prepayment & MSR
        short: Servicing rights
        icon: chart
        summary: Modelling prepayment behaviour from loan, rate and borrower data so mortgage servicing rights are valued and hedged rather than marked to a vendor curve.
        problem: MSR value swings with prepayment speeds a lender models on stale vendor assumptions, so hedges lag the rate move and the balance-sheet mark is late.
        who_benefits: Secondary Desk
        how_built: Servicing, rate and borrower data are conformed to Gold; prepayment and CPR models are tracked in MLflow and scored in Model Serving to value and hedge the MSR book.
        components:
          - MCT Secondary
          - Model Serving
          - MLflow
          - Black Knight MSP
          - AI/BI
        stories:
          - title: Credit loss forecasting reference architecture (CECL)
            url: https://www.databricks.com/resources/architectures/credit-loss-forecasting-reference-architecture
      - name: Pipeline Hedging
        short: Secondary
        icon: market
        summary: Hedging the rate-lock pipeline to the TBA market against pull-through risk so gain-on-sale margin survives the move between lock and sale.
        problem: Locks are hedged on a spreadsheet snapshot of pull-through, so a rate move between lock and delivery erodes margin before the desk can adjust the position.
        who_benefits: Secondary Desk
        how_built: Lock, pricing and market data land in Lakehouse//RT; pull-through models score each lock in Model Serving and the net position is sized in the Hedge & Lock Desk.
        components:
          - Hedge & Lock Desk
          - Optimal Blue PPE
          - MCT Secondary
          - Model Serving
          - Lakehouse//RT
      - name: Default & Loss Mit
        short: Servicing
        icon: opdb
        summary: Predicting which loans will roll to delinquency and matching each borrower to the right workout before a cure becomes a foreclosure.
        problem: Default teams react to missed payments after the roll, so the cheapest workout window is gone and foreclosure timelines and losses run up.
        who_benefits: Servicing Ops
        how_built: Payment, escrow and borrower data land in Lakehouse//RT; delinquency and loss-mitigation models are scored in Model Serving and worked from the Loss Mit Console.
        components:
          - Loss Mit Console
          - Black Knight MSP
          - Model Serving
          - Default & Collections
          - Lakehouse//RT
        stories:
          - title: HDFC Bank modernizes credit risk analytics
            url: https://www.databricks.com/customers/hdfc-bank
      - name: Borrower Retention
        short: Personalisation
        icon: custlake
        summary: Spotting the borrowers most likely to refinance or pay off, and recapturing them with the right offer before they leave for another lender.
        problem: Payoff risk is only visible when the payoff request arrives, by which point the borrower has already locked with a competitor and the servicing asset is lost.
        who_benefits: Servicing Ops
        how_built: Servicing, rate and behaviour data are activated through CustomerLake; recapture models are scored in Model Serving and offers surfaced in Servicing Digital and AI/BI.
        components:
          - CustomerLake
          - Model Serving
          - Servicing Digital
          - AI/BI
          - Genie One
        stories:
          - title: Discovery Bank personalizes banking with data and ML
            url: https://www.databricks.com/customers/discovery-bank
      - name: Portfolio Credit Risk
        short: Risk
        icon: gauge
        summary: Loan-level credit loss, CECL reserves and stress across the whole book on one governed set of loans, so risk and finance argue about the scenario, not the numbers.
        problem: CECL and stress are stitched from servicing, GL and macro extracts that never agree, so reserves are assembled under deadline and lineage back to the loan is hard to prove.
        who_benefits: Lending Exec
        how_built: Loan, GL and macro-scenario data are conformed to Gold; credit-loss and stress models are scored in Model Serving and read in AI/BI and Genie One with full lineage.
        components:
          - AI/BI
          - Genie One
          - Unity Catalog
          - Investor Accounting
          - Model Serving
        stories:
          - title: Credit loss forecasting reference architecture (CECL)
            url: https://www.databricks.com/resources/architectures/credit-loss-forecasting-reference-architecture
          - title: 'Databricks for Financial Services: lending and risk'
            url: https://www.databricks.com/solutions/industries/financial-services
medallion:
  Bronze:
    short: Raw loan and servicing feeds
    summary: Loan files and conditions from Encompass, MSP servicing and payment records, DU and Loan Product Advisor findings, tri-merge credit pulls and Optimal Blue lock data, landed exactly as received so a rate lock or a decision can always be replayed as it stood.
  Silver:
    short: Conformed loan, borrower, property
    summary: Loans, borrowers, properties and investors resolved into single conformed entities across the origination, servicing and secondary estates, with loan numbers, MERS MINs and borrower identity reconciled and each loan stitched to one lifecycle.
  Gold:
    short: Margin, delinquency, prepayment risk
    summary: 'Contracted products the production, servicing and secondary teams run on: gain-on-sale margin by channel and product, delinquency and roll-rate by vintage, prepayment and MSR valuation, and HMDA and fair-lending fields.'
