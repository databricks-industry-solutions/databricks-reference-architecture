name: Mortgage & Lending
description: 'Mortgage origination, servicing and consumer lending: point-of-sale and underwriting, secondary marketing and GSE delivery, servicing and default, and HMDA fair-lending compliance.'
sources:
  - name: Origination & POS
    icon: erp
    tiles:
      - name: ICE Encompass LOS
        icon: erp
        summary: ICE Mortgage Technology Encompass, the dominant loan origination system and the system of record for loan files, borrower data, conditions and the origination workflow from application to closing.
        citations:
          - encompass
        category: Loan Origination System (LOS)
        what_it_is: The dominant loan origination system and the system of record for loan files, borrower data, conditions and the origination workflow from application to closing.
        who_uses_it: Loan officers, processors and underwriters.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 20-80 GB/day loan files + conditions
            interval: Continuous CDC (near real-time)
      - name: Blend POS
        icon: appbuilder
        summary: Consumer point-of-sale front end capturing the application, document upload and status, and feeding the loan file into the origination system.
        citations:
          - blend
        category: Mortgage Point-of-Sale (POS)
        what_it_is: Consumer point-of-sale front end capturing the application, document upload and status, and feeding the loan file into the origination system.
        who_uses_it: POS and channel teams, loan officers and borrowers.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: 5-20 GB/day applications + docs
            interval: Nightly batch
          stream:
            types:
              - semi-structured
            volume: Application + status events
            interval: Continuous (events)
      - name: nCino Mortgage
        icon: product
        summary: nCino Mortgage Suite (SimpleNexus) point-of-sale and origination, capturing borrower intent, disclosures and closing collaboration across the loan team.
        citations:
          - ncino
        category: Mortgage Point-of-Sale / Origination
        what_it_is: Point-of-sale and origination suite capturing borrower intent, disclosures and closing collaboration across the loan team.
        who_uses_it: Loan officers, processors and POS teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 5-20 GB/day applications + disclosures
            interval: Nightly batch
      - name: MeridianLink LOS
        icon: erp
        summary: Consumer and mortgage loan origination for banks and credit unions, the system of record for applications, decisions and funding on the consumer-lending side.
        citations:
          - meridianlink
        category: Loan Origination System (LOS)
        what_it_is: Consumer and mortgage loan origination for banks and credit unions, the system of record for applications, decisions and funding on the consumer-lending side.
        who_uses_it: Loan officers, processors and consumer lending teams.
        data_out:
          batch:
            types:
              - structured
            volume: 5-20 GB/day applications + decisions
            interval: Nightly batch
  - name: Servicing Platforms
    icon: db
    simplified: 2
    tiles:
      - name: Black Knight MSP
        icon: erp
        summary: 'The ICE Black Knight MSP servicing system of record: loan boarding, payment processing, escrow administration, investor accounting and default across the servicing book.'
        citations:
          - bkmsp
        category: Mortgage Servicing System
        what_it_is: The servicing system of record covering loan boarding, payment processing, escrow administration, investor accounting and default across the servicing book.
        who_uses_it: Servicing operations, default and investor accounting.
        data_out:
          batch:
            types:
              - structured
            volume: 50-200 GB/day payments + escrow
            interval: Nightly batch + intraday CDC
      - name: Sagent LoanServ
        icon: db
        summary: 'Sagent''s real-time servicing platform for banks and non-banks: payment, escrow and default servicing with a consumer-grade experience.'
        citations:
          - sagent
        category: Mortgage Servicing System
        what_it_is: Real-time servicing platform for banks and non-banks covering payment, escrow and default servicing with a consumer-grade experience.
        who_uses_it: Servicing operations, default and retention.
        data_out:
          batch:
            types:
              - structured
            volume: 20-80 GB/day payments + escrow
            interval: Continuous CDC (near real-time)
      - name: Servicing Digital
        icon: apps
        summary: Borrower self-service channel for statements, payments, payoff and escrow, the servicing-side customer front end joined to the loan of record.
        category: Borrower Self-Service Portal
        what_it_is: Borrower self-service channel for statements, payments, payoff and escrow, the servicing-side customer front end joined to the loan of record.
        who_uses_it: Retention, servicing operations and borrowers.
        data_out:
          stream:
            types:
              - semi-structured
            volume: Portal + payment events
            interval: Continuous (events)
      - name: Investor Accounting
        icon: sheet
        summary: Investor remittance and loan-level reporting to Fannie Mae, Freddie Mac and Ginnie Mae, cash and accounting against each pool and custodial account.
        category: Investor Accounting / Remittance
        what_it_is: Investor remittance and loan-level reporting to Fannie Mae, Freddie Mac and Ginnie Mae, cash and accounting against each pool and custodial account.
        who_uses_it: Investor accounting, finance and servicing operations.
        data_out:
          batch:
            types:
              - structured
            volume: Remittance + loan-level reporting
            interval: Multiple remittance cycles monthly
  - name: Underwriting & Credit
    icon: gavel
    simplified: 2
    tiles:
      - name: Fannie Mae DU
        icon: govcat
        summary: Desktop Underwriter, Fannie Mae's automated underwriting system, returning eligibility and findings against the selling guide for each application.
        citations:
          - du
        category: Automated Underwriting System (AUS)
        what_it_is: Automated underwriting system returning eligibility and findings against the selling guide for each application.
        who_uses_it: Underwriters, credit policy and processors.
        data_out:
          stream:
            types:
              - semi-structured
            volume: Findings responses
            interval: Continuous (API, per application)
      - name: Freddie Mac LPA
        icon: govcat
        summary: Loan Product Advisor, Freddie Mac's automated underwriting engine, returning risk and eligibility assessments used to make and support the credit decision.
        citations:
          - lpa
        category: Automated Underwriting System (AUS)
        what_it_is: Automated underwriting engine returning risk and eligibility assessments used to make and support the credit decision.
        who_uses_it: Underwriters, credit policy and processors.
        data_out:
          stream:
            types:
              - semi-structured
            volume: Assessment responses
            interval: Continuous (API, per application)
      - name: Tri-Merge Credit
        core: true
        icon: identity
        summary: Merged Experian, Equifax and TransUnion credit reports and scores pulled at application and re-pulled before closing, the basis of the credit decision.
        citations:
          - bureaus
        category: Credit Bureau Data (Tri-Merge)
        what_it_is: Merged Experian, Equifax and TransUnion credit reports and scores pulled at application and re-pulled before closing, the basis of the credit decision.
        who_uses_it: Underwriters, credit risk ML and credit policy.
        data_out:
          stream:
            types:
              - semi-structured
            volume: Credit report + score pulls
            interval: Continuous (API, per pull)
      - name: Income & Asset Verif
        icon: file
        summary: The Work Number and asset-verification services confirming employment, income and deposits so underwriting works from verified rather than stated figures.
        citations:
          - twn
        category: Income & Asset Verification Service
        what_it_is: Employment, income and deposit verification services so underwriting works from verified rather than stated figures.
        who_uses_it: Underwriters, processors and credit policy.
        data_out:
          stream:
            types:
              - semi-structured
            volume: Verification responses
            interval: Continuous (API, per request)
  - name: Pricing & Secondary
    icon: market
    tiles:
      - name: Optimal Blue PPE
        icon: market
        summary: The product and pricing engine returning eligible products and locked rates against investor guidelines and margin, the source of the rate lock.
        citations:
          - ob
        category: Product & Pricing Engine (PPE)
        what_it_is: Product and pricing engine returning eligible products and locked rates against investor guidelines and margin, the source of the rate lock.
        who_uses_it: Secondary marketing, loan officers and pricing.
        data_out:
          stream:
            types:
              - semi-structured
            volume: Lock + pricing events
            interval: Continuous (real-time)
      - name: MCT Secondary
        icon: chart
        summary: Mortgage Capital Trading pipeline hedging and best-execution analytics for the secondary desk, sizing loan sales and TBA positions.
        citations:
          - mct
        category: Secondary / Hedging Platform
        what_it_is: Pipeline hedging and best-execution analytics for the secondary desk, sizing loan sales and TBA positions.
        who_uses_it: Secondary marketing, hedging desk and MSR managers.
        data_out:
          batch:
            types:
              - structured
            volume: Hedge positions + best-ex analytics
            interval: Intraday + end-of-day
      - name: GSE Loan Delivery
        core: true
        icon: partner
        summary: 'Fannie Mae Loan Delivery and Freddie Mac Loan Selling Advisor: loan delivery, pooling and commitment against agency programs and pricing.'
        citations:
          - gse
        category: GSE Loan Delivery System
        what_it_is: Loan delivery, pooling and commitment against agency programs and pricing for Fannie Mae and Freddie Mac.
        who_uses_it: Secondary marketing, investor delivery and finance.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: Delivery + pool + commitment files
            interval: Multiple delivery cycles daily
      - name: MERS Registry
        core: true
        icon: govcat
        summary: Mortgage Electronic Registration Systems tracking servicing rights and note ownership as loans and MSRs transfer between parties.
        citations:
          - mers
        category: Mortgage Registry (MERS)
        what_it_is: Electronic registry tracking servicing rights and note ownership as loans and MSRs transfer between parties.
        who_uses_it: Secondary marketing, servicing operations and MSR managers.
        data_out:
          batch:
            types:
              - structured
            volume: MIN + transfer records
            interval: Daily batch
  - name: Default & Compliance
    icon: gavel
    tiles:
      - name: Default & Collections
        icon: opdb
        summary: Loss mitigation, collections and foreclosure workflow for delinquent loans, the servicing-side default estate with borrower outreach and workout state.
        category: Default & Collections System
        what_it_is: Loss mitigation, collections and foreclosure workflow for delinquent loans, the servicing-side default estate with borrower outreach and workout state.
        who_uses_it: Default and loss mitigation, collections and servicing operations.
        data_out:
          batch:
            types:
              - structured
            volume: Delinquency + workout state
            interval: Nightly batch
      - name: HMDA / LAR
        icon: gavel
        summary: 'The Home Mortgage Disclosure Act loan application register: the fields and reporting that expose fair-lending and disparate-impact exposure.'
        citations:
          - hmda
        category: Regulatory Reporting Register (HMDA)
        what_it_is: The Home Mortgage Disclosure Act loan application register, the fields and reporting that expose fair-lending and disparate-impact exposure.
        who_uses_it: Fair lending and compliance, credit policy and legal.
        data_out:
          batch:
            types:
              - structured
            volume: LAR records
            interval: Periodic (regulatory cycle)
      - name: CoreLogic Property
        core: true
        icon: globe
        summary: CoreLogic (Cotality) property, valuation and AVM data plus flood and hazard, joined to the collateral behind every loan.
        citations:
          - corelogic
        category: Property & Valuation Data Provider
        what_it_is: Property, valuation and AVM data plus flood and hazard, joined to the collateral behind every loan.
        who_uses_it: Underwriters, collateral risk and secondary marketing.
        data_out:
          batch:
            types:
              - structured
            volume: Property + AVM + hazard data
            interval: Daily/weekly updates
      - name: Title & Closing
        core: true
        icon: docs
        summary: Qualia and ICE closing systems producing title, settlement and closing-disclosure documents at the end of the origination workflow.
        citations:
          - qualia
        category: Title & Closing Platform
        what_it_is: Title, settlement and closing-disclosure documents produced at the end of the origination workflow.
        who_uses_it: Closing teams, processors and compliance.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: Title + settlement + CD documents
            interval: Nightly batch
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Loan & Finance Marts
        icon: fed
        summary: Enterprise loan, servicing and general-ledger marts left where they are and queried in place under Unity Catalog, which avoids a second copy of the audited book of record.
        category: Loan & Finance Data Mart
        what_it_is: Enterprise loan, servicing and general-ledger marts kept in the incumbent warehouses and queried in place, avoiding a second copy of the audited book of record.
        who_uses_it: Finance, risk and servicing operations.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale loan + GL history
            interval: Queried on demand (federated)
  - name: Data Formats
    icon: zbraces
    simplified: 2
    tiles:
      - name: 'MISMO'
        icon: zbraces
        fmt: 'MISMO'
        summary: 'MISMO XML data standard for the US mortgage origination and servicing lifecycle.'
        spec_url: https://www.mismo.org/
        spark_connector: 'spark-xml'
        spark_repo: https://github.com/databricks/spark-xml
        databricks_resource: https://docs.databricks.com/aws/en/query/formats/xml
        source_systems:
          - 'ICE Mortgage Technology'
          - 'Blend'
          - 'Fannie Mae'
      - name: 'iLAD'
        icon: zbraces
        fmt: 'iLAD'
        summary: 'MISMO Industry Loan Application Dataset for standardised loan application data.'
        spec_url: https://www.mismo.org/
      - name: 'UCD'
        icon: zbraces
        fmt: 'UCD'
        summary: 'Uniform Closing Dataset for delivering Closing Disclosure data to the GSEs.'
        spec_url: https://singlefamily.fanniemae.com/
      - name: 'ULDD'
        icon: zbraces
        fmt: 'ULDD'
        summary: 'Uniform Loan Delivery Dataset for loan delivery to Fannie Mae and Freddie Mac.'
        spec_url: https://singlefamily.fanniemae.com/
