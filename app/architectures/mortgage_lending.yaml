pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Lending Exec
        mark: Genie One
        summary: The CEO and Chief Lending Officer on origination volume, gain-on-sale margin and the balance between production and credit quality; the CFO on funding cost, MSR value and cost-to-originate; the Chief Risk Officer on portfolio credit and fair-lending exposure.
        uses:
          - - Genie One
            - Ask what a channel originated last month, or where margin compressed, without booking analyst time.
          - - AI/BI
            - Volume, margin, delinquency and fair-lending exposure on one certified set of Metric Views.
          - - Unity Catalog
            - Certification and the business glossary, so "margin" and "delinquency" mean one thing across origination and servicing.
        sub:
          - name: CEO & CLO
            cares: origination volume, gain-on-sale margin and the production-versus-quality trade.
          - name: CFO
            cares: funding cost, MSR valuation and cost-to-originate across channels.
          - name: Chief Risk Officer
            cares: portfolio credit risk and fair-lending exposure across the book.
        ucs:
          - Portfolio Credit Risk
          - Fair Lending & HMDA
          - Pipeline Hedging
      - name: Origination
        mark: AI/BI
        summary: Retail and wholesale production leaders on lead conversion and pull-through; loan officers and processors moving files from application to clear-to-close; the POS and channel team on borrower experience and time-to-close.
        uses:
          - - AI/BI
            - Pull-through, cycle time and cost per funded loan on the definitions production defends.
          - - Model Serving
            - Lead, conversion and pull-through models scored inside the origination path.
          - - CustomerLake
            - Borrower and lead profile activated for outreach without a separate CDP.
        sub:
          - name: Production leaders
            cares: lead conversion and pull-through by channel and loan officer.
          - name: Loan officers & processors
            cares: moving files from application to clear-to-close.
          - name: POS & channel
            cares: borrower experience and time-to-close across the funnel.
        ucs:
          - Loan Document Processing
          - Lead & Pull-Through
          - Automated Underwriting
      - name: Underwriting
        core: true
        mark: AI Functions
        summary: Underwriters clearing conditions and rendering the credit decision; credit-policy owners setting overlays above DU and LPA; the fair-lending and compliance team proving decisions are consistent and defensible under ECOA and HMDA.
        uses:
          - - AI Functions
            - Income, asset and condition documents classified and extracted at scale.
          - - Model Serving
            - Credit and eligibility models scored alongside DU and LPA findings.
          - - Unity Catalog
            - Auditable decision lineage and reason codes that support compliance review.
        sub:
          - name: Underwriters
            cares: clearing conditions and rendering the credit decision.
          - name: Credit policy
            cares: overlays and eligibility rules above the automated systems.
          - name: Fair lending & compliance
            cares: consistency, adverse-action reason codes and HMDA exposure.
        ucs:
          - Automated Underwriting
          - Credit Decisioning
          - Fair Lending & HMDA
      - name: Servicing Ops
        mark: Lakehouse//RT
        summary: Servicing operations on payment, escrow and investor accounting; the default and loss-mitigation team on delinquency, workouts and foreclosure; the retention team on payoff risk and recapture before a borrower refinances away.
        uses:
          - - Lakehouse//RT
            - Payment, escrow and delinquency state at the latency servicing acts on.
          - - Model Serving
            - Delinquency, loss-mitigation and recapture models scored in the servicing path.
          - - AI/BI
            - Roll rate, cure rate and retention on the servicing team's own definitions.
        sub:
          - name: Servicing operations
            cares: payment, escrow and investor accounting on the book.
          - name: Default & loss mitigation
            cares: delinquency, workouts and foreclosure timelines.
          - name: Retention
            cares: payoff risk and recapture before a refinance leaves.
        ucs:
          - Default & Loss Mit
          - Borrower Retention
          - Portfolio Credit Risk
      - name: Secondary Desk
        mark: Model Serving
        summary: Secondary marketing on rate-lock pipeline and best execution; the hedging desk managing TBA and pull-through risk to the trade; MSR and portfolio managers on prepayment behaviour and servicing-rights valuation.
        uses:
          - - Model Serving
            - Prepayment and pull-through models scored into hedge and lock decisions.
          - - Lakehouse//RT
            - Lock pipeline and market state at the latency the desk hedges at.
          - - AI/BI
            - Best execution, hedge P&L and MSR value on certified Metric Views.
        sub:
          - name: Secondary marketing
            cares: rate-lock pipeline and best-execution loan sale.
          - name: Hedging desk
            cares: TBA and pull-through risk managed to the trade.
          - name: MSR & portfolio
            cares: prepayment behaviour and servicing-rights valuation.
        ucs:
          - Prepayment & MSR
          - Pipeline Hedging
          - Portfolio Credit Risk
  - name: Technical
    icon: code
    tiles:
      - name: Loan Data Eng
        mark: Lakeflow
        summary: Land Encompass loan files, Black Knight MSP servicing feeds, DU and LPA findings and Optimal Blue locks, parse MISMO, and own the Bronze to Silver path and the pager when a feed breaks.
        uses:
          - - Lakeflow Connect
            - Managed connectors for the LOS, servicing and vendor sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on loan, credit and lock feeds.
          - - Lakewatch
            - Freshness on the tables underwriting and the secondary desk read every morning.
      - name: Risk & Credit ML
        mark: MLflow
        summary: Build credit, prepayment, default and pull-through models on borrower, bureau and performance data, and prove they still hold and stay fair after deployment.
        uses:
          - - Feature Store
            - Borrower and loan features defined once and read identically in training and serving.
          - - MLflow
            - Every run and model card tracked for audit, reproduction and fair-lending review.
          - - Model Serving
            - Credit, prepayment and default models scored in the decision path.
      - name: Lending App Dev
        mark: Apps
        summary: Ship the underwriting, loss-mitigation, lock-desk and monitoring applications the lender works in, hosted next to governed loan data.
        uses:
          - - Apps
            - Underwriting and servicing screens with no separate web tier to run or secure.
          - - Lakebase
            - Serverless Postgres for decision, workout and lock state with governed writes.
          - - Agent Bricks
            - Agents that draft a condition set or a workout plan against governed tools.
