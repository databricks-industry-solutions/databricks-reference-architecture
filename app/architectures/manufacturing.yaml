name: Manufacturing
description: 'Discrete and process manufacturers: ERP and MES shop-floor execution, machine-vision quality and serial traceability, demand and supply chain planning, and asset maintenance across every plant.'
sources:
  - name: ERP & Planning
    icon: erp
    simplified: 4
    tiles:
      - name: SAP S/4HANA
        icon: erp
        summary: Manufacturing orders, BOMs, routings, inventory and financial postings. The system of record for what was planned to be made and what was consumed.
        citations:
          - sap-s4
        category: Manufacturing ERP
        what_it_is: Holds the production orders, bills of material, routings, inventory and financial postings that define what was planned, made and consumed across plants.
        who_uses_it: Production planning, plant controllers and Finance.
        data_out:
          batch:
            types:
              - structured
            volume: 20-100 GB/day
            interval: Nightly batch + hourly deltas
          stream:
            types:
              - semi-structured
            volume: hundreds of postings/sec
            interval: Continuous CDC
      - name: Oracle SCM Cloud
        icon: erp
        summary: Supply planning, work definitions and costed transactions for plants on the Oracle manufacturing estate.
        citations:
          - oracle-scm
        category: Supply Chain Management (SCM) Cloud
        what_it_is: Runs supply planning, work definitions and costed manufacturing transactions for plants standardized on the Oracle cloud estate.
        who_uses_it: Supply planners, manufacturing engineering and Cost accounting.
        data_out:
          batch:
            types:
              - structured
            volume: 10-50 GB/day
            interval: Nightly batch
      - name: Kinaxis Maestro
        core: true
        icon: sheet
        summary: Concurrent S&OP scenarios, constraint-based planning and what-if responses when a supplier or line goes down.
        citations:
          - kinaxis
        category: Supply Chain Planning (S&OP/IBP)
        what_it_is: Runs concurrent constraint-based S&OP scenarios and what-if replanning when a supplier or line goes down.
        who_uses_it: S&OP planners, demand planning and Supply Chain leadership.
        data_out:
          batch:
            types:
              - structured
            volume: 5-20 GB/day scenarios
            interval: Planning cycles + on-demand what-if
      - name: S&P Global Commodity Insights
        icon: market
        summary: Metals, energy and chemical commodity prices and market indices that drive raw-material cost, S&OP assumptions and supplier risk exposure.
        category: Commodities & Market Data
        what_it_is: External commodity price benchmarks and market indices (metals, energy, chemicals) used to set raw-material cost assumptions, S&OP scenarios and supplier exposure.
        who_uses_it: S&OP planning, procurement and Cost accounting.
        data_out:
          batch:
            types:
              - structured
            volume: MBs-GBs/day price feeds
            interval: Intraday to daily benchmarks
  - name: MES & Shop Floor
    icon: stream
    simplified: 3
    tiles:
      - name: Siemens Opcenter
        icon: stream
        summary: Work instructions, cycle counts, downtime reason codes and WIP status from the MES the operators work in.
        citations:
          - opcenter
        category: Manufacturing Execution System (MES)
        what_it_is: Executes work instructions and captures cycle counts, downtime reason codes and WIP status from the shop floor the operators work in.
        who_uses_it: Line operators, shift supervisors and Manufacturing engineering.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 1-5k events/sec at peak
            interval: Continuous shop-floor events
      - name: Rockwell FactoryTalk
        icon: iot
        summary: Line state, OEE counters and recipe execution from Allen-Bradley controlled assets.
        citations:
          - factorytalk
        category: Industrial Automation / SCADA
        what_it_is: Streams line state, OEE counters and recipe execution from Allen-Bradley PLC-controlled assets on the plant network.
        who_uses_it: Controls engineers, plant operations and Continuous improvement.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 2-10k tags/sec
            interval: Continuous high-frequency telemetry
      - name: AVEVA MES
        icon: db
        summary: Batch records, electronic batch tickets and equipment logbooks for process manufacturing sites.
        citations:
          - aveva-mes
        category: Process MES / Electronic Batch Records
        what_it_is: Captures electronic batch records, batch tickets and equipment logbooks for process and hybrid manufacturing sites.
        who_uses_it: Process operators, Quality and Regulatory affairs.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 2-10 GB/day batch records
            interval: Per-batch + hourly
  - name: Quality & PLM
    icon: gavel
    simplified: 3
    tiles:
      - name: PTC Windchill
        icon: product
        summary: Engineering BOMs, change orders and approved drawings the shop floor must build to.
        citations:
          - windchill
        category: PLM System
        what_it_is: Manages engineering BOMs, change orders and released drawings and revisions the shop floor must build to.
        who_uses_it: Design engineering, change management and Manufacturing engineering.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 1-5 GB/day
            interval: On change release + nightly
      - name: MasterControl QMS
        core: true
        icon: gavel
        summary: Non-conformance, CAPA and audit findings tied to lots and suppliers.
        citations:
          - mastercontrol
        category: Quality Management System (QMS)
        what_it_is: Manages non-conformances, CAPA and audit findings tied back to the lots, suppliers and processes that caused them.
        who_uses_it: Quality managers, Regulatory affairs and Supplier quality.
        data_out:
          batch:
            types:
              - structured
            volume: 1-3 GB/day
            interval: Hourly / event-driven
      - name: ETQ Reliance
        icon: gavel
        summary: Inspection plans, SPC results and supplier quality scorecards for regulated industries.
        citations:
          - etq
        category: Quality Management System (QMS)
        what_it_is: Runs inspection plans, SPC results and supplier quality scorecards for regulated and safety-critical industries.
        who_uses_it: Quality engineers, SPC analysts and Supplier quality.
        data_out:
          batch:
            types:
              - structured
            volume: GBs (inspection + SPC)
            interval: Hourly / per-inspection
  - name: IoT & Historians
    icon: iot
    simplified: 2
    tiles:
      - name: AVEVA PI System
        icon: iot
        summary: High-frequency sensor and actuator tags from lines, utilities and environmental systems.
        citations:
          - aveva-pi
        category: Process / Time-Series Historian
        what_it_is: Collects high-frequency sensor and actuator tags from lines, utilities and environmental systems for OEE, energy and anomaly analytics.
        who_uses_it: Reliability engineers, Process engineering and Energy management.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 10-100k tags/sec
            interval: Continuous historian stream
      - name: AspenTech IP.21
        icon: stream
        summary: Process historian data for batch analytics, energy intensity and abnormal event detection.
        citations:
          - aspen-ip21
        category: Process / Time-Series Historian
        what_it_is: Stores process historian time-series for batch analytics, energy intensity and abnormal-event detection at process sites.
        who_uses_it: Process engineers, batch analytics and Energy teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 5-50k tags/sec
            interval: Continuous historian stream
      - name: Machine Vision QC
        icon: observ
        summary: Inline defect images and measurement vectors joined to lot and serial for root-cause analysis.
        category: Machine Vision Inspection
        what_it_is: Captures inline defect images and measurement vectors and joins them to lot and serial for defect classification and root-cause analysis.
        who_uses_it: Quality engineers, Vision/ML teams and Manufacturing engineering.
        data_out:
          stream:
            types:
              - unstructured
              - structured
            volume: 100s of images/sec + vectors
            interval: Continuous inline capture
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Corporate Data Warehouse
        icon: fed
        summary: Finance and HR marts left where they are and queried in place under Unity Catalog, avoiding a second copy of audited cost allocations.
        category: Enterprise Data Warehouse
        what_it_is: Legacy finance and HR marts kept in the incumbent warehouse and queried in place through federation instead of being copied for audited cost allocations.
        who_uses_it: Finance, HR analytics and Cost accounting.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale historical marts
            interval: Queried on demand (federated)
  - name: Data Formats
    icon: zbraces
    simplified: 2
    tiles:
      - name: 'MTConnect'
        icon: zbraces
        fmt: 'MTC'
        summary: 'Open standard for streaming machine-tool and shop-floor equipment data.'
        spec_url: https://www.mtconnect.org/
      - name: 'OPC UA'
        icon: zbraces
        fmt: 'OPCUA'
        summary: 'OPC Unified Architecture, the backbone protocol for Industry 4.0 data exchange.'
        spec_url: https://opcfoundation.org/about/opc-technologies/opc-ua/
      - name: 'B2MML'
        icon: zbraces
        fmt: 'B2MML'
        summary: 'Business To Manufacturing Markup Language implementing ISA-95 integration.'
        spec_url: https://www.mesa.org/topics-resources/b2mml-batchml/
        spark_connector: 'spark-xml'
        spark_repo: https://github.com/databricks/spark-xml
        databricks_resource: https://docs.databricks.com/aws/en/query/formats/xml
        source_systems:
          - 'Rockwell FactoryTalk'
          - 'Siemens Opcenter'
          - 'AVEVA MES'
      - name: 'Sparkplug'
        icon: zbraces
        fmt: 'SPKP'
        summary: 'Eclipse MQTT topic/payload spec for interoperable IIoT device data.'
        spec_url: https://sparkplug.eclipse.org/
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    simplified: 2
    tiles:
      - name: OPC-UA Plant Gateway
        icon: iot
        summary: Shop-floor protocol bridges normalising PLC and robot telemetry on ingest before historian landing.
        citations:
          - opc-ua
        category: OT Protocol Gateway
        what_it_is: Bridges shop-floor OPC-UA and PLC/robot protocols, normalizing controller telemetry on ingest before historian landing.
        who_uses_it: Controls engineers, OT/IT integration and Streaming data engineers.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 5-50k tags/sec
            interval: Continuous OT telemetry
      - name: EDI ASN / DESADV
        icon: api
        summary: Supplier advance ship notices and delivery confirmations parsed into structured receipt events.
        citations:
          - edi-asn
        category: Supplier EDI
        what_it_is: Parses supplier advance ship notices and delivery confirmations (DESADV) into structured inbound receipt events.
        who_uses_it: Inbound logistics, Procurement and Materials planning.
        data_out:
          batch:
            types:
              - semi-structured
              - structured
            volume: 100s of MB/day
            interval: Continuous EDI messages
      - name: GS1 EPCIS Events
        icon: stream
        summary: Serialised product movement events for track-and-trace across plants, DCs and customers.
        citations:
          - gs1-epcis
        category: Track & Trace Events (EPCIS)
        what_it_is: Streams serialized product movement (commissioning, aggregation, shipping) events for track-and-trace across plants, DCs and customers.
        who_uses_it: Traceability, Serialization and Supply chain teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 1-10k events/sec
            interval: Continuous serialization events
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Plant Leadership
        mark: Genie One
        summary: The plant manager and VP operations on OEE by line, cost per unit produced and OTIF service level when a line stalls or a key supplier slips.
        uses:
          - - Genie One
            - Ask what yesterday's scrap cost or which customer orders are at risk without waiting on manufacturing IT.
          - - AI/BI
            - OEE, yield and OTIF on one certified set of Metric Views.
          - - Unity Catalog
            - Certification and the business glossary, so "downtime" means one thing across plants.
        sub:
          - name: Plant Manager
            cares: daily OEE, downtime cost and hitting the production plan across every line.
          - name: VP Operations
            cares: cost per unit, safety and the capital case for new capacity.
          - name: Continuous Improvement
            cares: the loss buckets and the Kaizen backlog that lift throughput.
        ucs:
          - Quality Event Root Cause Analysis
          - Design Space Simulation & Exploration
      - name: Production & Scheduling
        mark: AI/BI
        summary: Finite scheduling, changeover sequencing and labour loading against orders commercial already promised, watched on schedule adherence and WIP ageing.
        uses:
          - - Plant Performance
            - Sequence and changeover plans scored before the shift board posts.
          - - AI/BI
            - Schedule adherence and WIP ageing on governed definitions.
          - - Lakehouse//RT
            - Live line state at the latency a bottleneck moves at.
        sub:
          - name: Master Scheduler
            cares: finite sequencing and changeover order against the dates commercial promised.
          - name: Shift Supervisor
            cares: the shift board, labour loading and WIP ageing on the floor.
          - name: Production Planner
            cares: the NPI ramp and cut-over from pilot to volume.
        ucs:
          - Design Space Simulation & Exploration
      - name: Quality & Compliance
        core: true
        mark: Model Serving
        summary: Lot release, SPC violations and supplier corrective actions scored on first-pass yield and non-conformance rate before product leaves the site.
        uses:
          - - Quality Cockpit
            - Hold and release decisions with genealogy back to supplier lot.
          - - Model Serving
            - Defect and drift models scored on inline vision and SPC signals.
          - - Unity Catalog
            - One definition of non-conformance across MES and QMS.
        sub:
          - name: Quality Manager
            cares: first-pass yield, SPC violations and lot release before shipment.
          - name: Regulatory Affairs
            cares: FDA and ISO lot genealogy and the audit trail behind a recall.
          - name: Supplier Quality
            cares: non-conformance and corrective action across the supplier base.
        ucs:
          - Quality Event Root Cause Analysis
          - Design Space Simulation & Exploration
      - name: Supply Chain
        mark: AI/BI
        summary: S&OP, inventory positioning and supplier OTIF when lead times stretch, balancing inventory turns against the customer service level finance commits.
        uses:
          - - Supply Control Tower
            - Shortages and expedites costed across alternate BOMs and sites.
          - - AI/BI
            - Inventory turns and supplier OTIF on certified Metric Views.
          - - Genie One
            - Ask which SKUs will stock out before the next planning cycle.
        sub:
          - name: S&OP Lead
            cares: the demand-supply balance and the plan when a plant goes offline.
          - name: Inventory Planner
            cares: safety stock and reorder points against real lead-time variability.
          - name: Procurement
            cares: supplier OTIF and single-source concentration risk.
        ucs:
          - Supply & Materials Planning
          - Demand Forecasting
      - name: Maintenance & Reliability
        mark: Lakeflow
        summary: Planned downtime, spare parts and technician capacity tracked on MTBF and maintenance cost per unit so failures become scheduled work not line stops.
        uses:
          - - Maintenance Hub
            - Work orders raised from predicted failures before the line stops.
          - - Lakeflow
            - Historian and CMMS feeds conformed for reliability analytics.
          - - MLflow
            - Remaining-useful-life models tracked for audit and reproduction.
        sub:
          - name: Reliability Engineer
            cares: MTBF, failure modes and the remaining-life models per asset.
          - name: Maintenance Planner
            cares: spare parts, technician capacity and the planned-downtime window.
          - name: Asset Manager
            cares: maintenance cost per unit and the capital-repair decision.
        ucs:
          - Predictive Maintenance & Asset Health
          - Demand Forecasting
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land the ERP order, MES cycle, SCADA historian and supplier ASN feeds; own the Bronze to Silver path and the pager when a plant pipeline breaks.
        uses:
          - - Lakeflow Connect
            - Managed connectors for SAP, Opcenter MES and quality sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on downtime and inspection feeds.
          - - Lakewatch
            - Freshness on the OEE and inventory tables the shift board reads each morning.
        sub:
          - name: Platform Data Engineer
            cares: the Bronze-to-Silver path for ERP, MES and historian feeds.
          - name: Streaming Engineer
            cares: OPC-UA and SCADA telemetry landed at line latency.
          - name: Pipeline On-call
            cares: freshness on the OEE and inventory tables the shift board reads.
        ucs:
          - Predictive Maintenance & Asset Health
      - name: Data Scientists
        mark: MLflow
        summary: First-pass yield, remaining-useful-life, demand and defect-vision models, and whether they still hold six months after deployment on the floor.
        uses:
          - - Feature Store
            - Historian and SPC features read identically in training and serving.
          - - MLflow
            - Every yield and RUL run tracked for audit and reproduction.
          - - Model Serving
            - Defect and failure models scored on inline vision and SPC signals.
        sub:
          - name: Reliability Data Scientist
            cares: remaining-useful-life and anomaly models on historian data.
          - name: Quality Data Scientist
            cares: defect-vision and first-pass-yield models on inline signals.
          - name: Demand Scientist
            cares: demand and inventory models across plants and SKUs.
        ucs:
          - Predictive Maintenance & Asset Health
          - Quality Event Root Cause Analysis
          - Demand Forecasting
      - name: App Developers
        mark: Apps
        summary: Ship the plant performance, quality cockpit and maintenance applications operators and planners work in, hosted next to governed shop-floor data.
        uses:
          - - Apps
            - Operational screens with no separate web tier to run or secure.
          - - Lakebase
            - Serverless Postgres for work-order state and governed writes.
          - - Agent Bricks
            - Agents that draft a maintenance work order against governed tools.
        sub:
          - name: Apps Developer
            cares: the plant, quality and maintenance screens over governed data.
          - name: Lakebase Engineer
            cares: work-order and hold-release state with governed writes.
          - name: Agent Developer
            cares: agents that draft a work order against governed tools.
        ucs:
          - Predictive Maintenance & Asset Health
consumers:
  - name: BI & Productivity
    icon: chart
    from: bi
    simplified: 2
    tiles:
      - name: Tableau / Qlik / ThoughtSpot
        icon: chart
        summary: External BI against SQL warehouses, with Unity Catalog permissions enforced end to end.
      - name: Microsoft Teams
        icon: chat
        summary: Genie in Teams for Unity Catalog-governed answers from the lakehouse and floor andon updates in the channel the plant already works in.
      - name: Notebooks & IDEs
        icon: notebook
        summary: Notebooks, VS Code and JetBrains against governed data and Genie Code.
  - name: Plant & ERP
    icon: opdb
    tiles:
      - name: SAP Order Confirmation
        icon: db
        summary: Production confirmations and component backflush written back into ERP so finance sees reality.
        citations:
          - sap-s4
      - name: MES Recipe Download
        icon: stream
        summary: Approved recipes and work instructions pushed to lines after engineering change release.
        citations:
          - opcenter
      - name: CMMS Work Orders
        core: true
        icon: erp
        summary: Predicted failures raised as maintenance work orders the technician crew already schedules.
  - name: Customers & Suppliers
    icon: partner
    tiles:
      - name: Customer ASN Portal
        icon: api
        summary: Shipment and lot certificates served to OEM customers from governed genealogy rather than emailed spreadsheets.
        citations:
          - gs1-epcis
      - name: Supplier Scorecards
        icon: share
        summary: OTIF and quality metrics shared to tier-one suppliers over Delta Sharing.
        citations:
          - edi-asn
      - name: Contract Manufacturer
        icon: globe
        summary: Co-man sites reading BOM and quality limits live instead of nightly flat files.
  - name: Regulatory & Reporting
    icon: gavel
    tiles:
      - name: FDA / ISO Lot Trace
        icon: gavel
        summary: Lot genealogy and deviation records produced from the same governed tables production runs on.
        citations:
          - mastercontrol
      - name: Carbon & ESG Reporting
        icon: share
        summary: Scope 1 and 2 intensity filed from contracted Gold products for buyer sustainability programs.
  - name: Published Products
    icon: product
    tiles:
      - name: Data Products
        icon: product
        summary: Published, contracted products discoverable in Unity Catalog Domains and shared over OpenSharing.
      - name: Sharing Recipients
        core: true
        icon: share
        summary: Customers, co-mans and auditors reading live tables with no copy and no egress duplication.
  - name: Databricks Apps
    icon: apps
    simplified: 2
    tiles:
      - name: Plant Performance
        icon: gauge
        short: Live OEE
        summary: 'The screen the shift supervisor runs the day from: downtime pareto, scrap by reason and orders at risk, on Databricks Apps over Lakebase.'
      - name: Quality Cockpit
        icon: gavel
        short: Hold and release
        summary: Lot status, SPC violations and supplier genealogy on one surface before product ships.
      - name: Supply Control Tower
        icon: sheet
        short: Shortage response
        summary: Component shortages and alternate sourcing costed before customer OTIF is missed.
      - name: Maintenance Hub
        icon: iot
        short: Asset health
        summary: Predicted failures and spare parts by line so downtime becomes a planned window.
  - name: AI/BI Dashboards
    icon: aibi
    tiles:
      - name: Plant OEE & Downtime
        icon: aibi
        summary: Line and shift OEE, downtime pareto and throughput on certified Metric Views.
        kpis:
          - OEE
          - Availability
          - Performance
          - Quality rate
          - Downtime by reason
        teams:
          - Plant Leadership
          - Production & Scheduling
          - Continuous Improvement
      - name: Quality & Yield
        icon: aibi
        summary: First-pass yield, scrap, non-conformance and supplier quality trends.
        kpis:
          - First-pass yield
          - Scrap rate
          - Non-conformance rate
          - CAPA cycle time
          - Supplier PPM
        teams:
          - Quality & Compliance
          - Supplier Quality
          - Manufacturing Engineering
      - name: Supply Chain & OTIF
        icon: aibi
        summary: Inventory turns, supplier OTIF and S&OP plan attainment across plants.
        kpis:
          - OTIF
          - Inventory turns
          - Days of supply
          - Forecast accuracy
          - Plan attainment
        teams:
          - Supply Chain
          - S&OP Lead
          - Procurement
      - name: Reliability & Maintenance
        icon: aibi
        summary: Asset MTBF, predicted failures and maintenance cost per unit.
        kpis:
          - MTBF
          - Unplanned downtime
          - Maintenance cost per unit
          - PM compliance
          - Predicted failures
        teams:
          - Maintenance & Reliability
          - Reliability Engineer
          - Asset Manager
  - name: Agent Harnesses
    icon: agents
    tiles:
      - name: Omnigent OSS
        icon: omni
        short: Databricks, open source
        summary: Open-source meta-harness above existing agent frameworks, enabling agent composition, collaboration and centralised governance from one interface.
        capabilities:
          - Build
          - Deploy
          - Optimize
          - Govern
        related:
          - Agent Bricks
          - Unity Gateway
      - name: Claude Code
        core: true
        icon: code
        short: 3rd-party harness
        summary: Anthropic's coding harness working against the platform through MCP, with spend, routing and policy governed by Unity Gateway.
      - name: OpenAI Codex
        core: true
        icon: code
        short: 3rd-party harness
        summary: OpenAI's coding harness connected over MCP, governed at runtime by Unity Gateway rather than trusted by configuration.
      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Plant Performance Agent
        icon: genie
        summary: Ask about plant safety, design simulation, engineering programs and machine run-mode usage across the plant in plain language.
        feeds:
          - Siemens Opcenter
          - Rockwell FactoryTalk
          - AVEVA PI System
          - PTC Windchill
        teams:
          - Plant Leadership
          - Production & Scheduling
          - Continuous Improvement
        questions:
          - Which lines show the most machine-state safety and stoppage signals this month, and where?
          - Where are machine-state safety hazards concentrated on the floor right now?
          - What do approved simulation models estimate a line-rate or changeover change would do to throughput?
          - Which engineering programs and new-product bids are at risk on cost or schedule?
          - How did the last design change affect yield and cost once it ran on the line?
          - Which run modes, recipes and line configurations are used most across the plant, and which drive the most wear and downtime?
      - name: Quality & Traceability Agent
        icon: genie
        summary: Explore defect root cause, warranty cost and lot and serial traceability across quality, vision and traceability data.
        feeds:
          - MasterControl QMS
          - ETQ Reliance
          - Machine Vision QC
          - GS1 EPCIS Events
        teams:
          - Quality & Compliance
          - Quality Manager
          - Supplier Quality
        questions:
          - What is the root cause behind the top defect types this month?
          - Which suppliers and lots drive the most non-conformances and CAPA?
          - Which warranty claims trace back to a common build, lot or supplier?
          - What is warranty cost by product and failure mode this quarter?
          - Which lots and serials can we trace across plants, DCs and customers for a recall?
      - name: Supply Chain & Inventory Agent
        icon: genie
        summary: Answer demand forecast and supply and materials planning questions across plants.
        feeds:
          - Kinaxis Maestro
          - SAP S/4HANA
          - EDI ASN / DESADV
          - Oracle SCM Cloud
        teams:
          - Supply Chain
          - S&OP Lead
          - Procurement
        questions:
          - What is the SKU-level demand forecast versus the current S&OP plan?
          - Where is forecast error highest and inflating safety stock?
          - Which parts and materials will stock out before the next planning cycle?
          - Which parts are single-source and exposed to disruption?
          - What is supplier OTIF by supplier and plant this quarter?
      - name: Maintenance & Reliability Agent
        icon: genie
        summary: Ask about predicted failures, asset health and field-service incidents across the plant.
        feeds:
          - AVEVA PI System
          - AspenTech IP.21
          - Rockwell FactoryTalk
        teams:
          - Maintenance & Reliability
          - Reliability Engineer
          - Maintenance Planner
        questions:
          - Which assets are predicted to fail in the next two weeks?
          - Which assets have the worst MTBF this quarter?
          - What is the fastest resolution for the incident open on this asset, given similar past failures?
          - Which open field-service incidents are waiting on parts or a technician?
          - What is maintenance cost per unit by line and asset?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Predictive Maintenance & Asset Health
        short: Asset reliability
        icon: iot
        summary: Component failure predicted from historian and vibration signals before the line stops.
