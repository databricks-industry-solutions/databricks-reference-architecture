        short: Warranty cost
        icon: product
        summary: Warranty claims traced back to build, lot and supplier so recurring failure modes are priced and designed out.
        problem: Warranty spend is booked as a lump cost with no line of sight from a field claim back to the build, lot or supplier that caused it, so the same failure modes keep shipping and keep paying out.
