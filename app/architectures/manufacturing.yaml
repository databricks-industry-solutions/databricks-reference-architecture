        short: Defect root cause
        icon: chart
        summary: Defect and scrap events traced to the recipe, parameter and inspection history that caused them.
        problem: When a quality event hits, the recipe, parameter and inline-inspection history that would explain it sits scattered across historians and quality tools, so root cause is argued after the fact and the same defects recur.
