medallion:
  Bronze:
    short: Raw plant feeds
    summary: ERP production orders, MES cycle and downtime events, SCADA historian tags, quality inspection results and supplier ASNs, landed exactly as received so a lot or a downtime code can always be replayed as it stood.
  Silver:
    short: Conformed order, lot
    summary: Work orders, lots, equipment and materials resolved into single conformed entities across ERP, MES and quality estates, with serial and batch genealogy reconciled and multi-site BOM revisions stitched to one product definition.
  Gold:
    short: OEE, yield, OTIF
    summary: 'Contracted products operations and supply chain leaders run on: overall equipment effectiveness by line, first-pass yield and scrap, on-time-in-full to customer promise, and maintenance cost per unit produced.'
