        how_built: Historian, MES and quality signals are conformed on Delta Lake and mirrored in Lakehouse//RT, and physics-plus-ML models in Model Serving tracked in MLflow explore throughput, quality and failure effects across the design space for engineering review before a change runs on the line.
        components:
