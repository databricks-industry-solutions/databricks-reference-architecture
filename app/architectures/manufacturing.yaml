        short: Plant safety
        icon: gauge
        summary: Machine-state and environmental hazard signals from the floor surfaced before an incident, not investigated after one.
        problem: Safety is managed from lagging incident reports filed after someone is hurt, while the environmental, machine-state and stoppage signals that precede an unsafe condition sit unused across the historian and MES, with no dedicated EHS system on the platform to join them.
