        who_benefits: Maintenance & Reliability
        how_built: Historian telemetry and work-order history are conformed on Delta Lake and mirrored in Lakehouse//RT, and an agent built on Agent Bricks, calling models on Model Serving, drafts diagnosis and next steps from the Maintenance Hub against governed asset history.
