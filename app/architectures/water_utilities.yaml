        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Network & NRW Agent
        icon: genie
        summary: Ask about pressure, non-revenue water from district inflow and authorized consumption, leaks and demand across the network in plain language.
        feeds:
          - AVEVA PI System
          - Itron OpenWay
          - Schneider EcoStruxure
          - NRW, pressure, compliance
        teams:
          - Distribution Ops
          - Leak & NRW Team
          - Pump & Energy Lead
        questions:
          - What was non-revenue water by district last month?
          - Which zones show the largest night-flow anomalies right now?
          - Where is pressure out of compliance across the network?
          - Which areas should crews investigate first for leaks?
          - What is next week's demand forecast by district against storage?
      - name: Asset & Reliability Agent
        icon: genie
        summary: Answer questions on main-break risk, pump and plant health and replacement priority.
        feeds:
          - Esri ArcGIS Utility
          - IBM Maximo
          - AVEVA PI System
          - Conformed meter, asset, account
        teams:
          - Asset Management
          - Reliability Engineers
          - Capital Planning
        questions:
          - Which mains exceed our break-rate threshold this year?
          - Where is main-break risk highest by material and soil type?
          - Which pumps and motors are predicted to fail this quarter?
          - What replacement candidates give the most risk reduction per dollar?
          - What is remaining life on our aging cast-iron mains?
      - name: Customer & Field Agent
        icon: genie
        summary: Explore accounts, high-bill questions, outages and field work in plain language.
        feeds:
          - Oracle Utilities C2M
          - Itron OpenWay
          - Cityworks AMS
          - Conformed meter, asset, account
        teams:
          - Customer Operations
          - Call Centre Agents
          - Field Service Dispatch
        questions:
          - Which accounts have open high-bill disputes right now?
          - Which premises show consumption spikes that look like private-side leaks?
          - What is first-call resolution in the contact centre this week?
          - How many field work orders are open past their SLA?
          - Which crews are closest to the next priority work order?
      - name: Quality & Sustainability Agent
        icon: genie
        summary: Ask about sample results, exceedances, pump energy and emissions against regulatory limits.
        feeds:
          - Hach WIMS
          - KISTERS WISKI
          - EPA SDWIS Feed
          - NRW, pressure, compliance
          - Pumping energy, tariff, emissions factors
        teams:
          - Water Quality
          - Compliance Officers
          - Source Water Team
        questions:
          - Which sample results are approaching a regulatory limit right now?
          - Are there any exceedances that need public notification today?
          - How much pumping energy did we use against tariff windows this week?
          - What is our greenhouse-gas intensity trend across the network?
          - Which sites are behind on their sampling schedule?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Leak Detection
        short: NRW
        icon: iot
        summary: Distribution loss localized from district inflow and authorized consumption, with AMI night-flow and pressure anomalies prioritising where to investigate.
        problem: Distribution leaks hide as background loss until a main bursts, and crews chase them across thousands of miles of buried pipe with little night-flow evidence to say where to dig first.
        who_benefits: Distribution Ops
        how_built: District inflow and authorized consumption establish the network balance while AMI night-flow and PI pressure transients land in Lakehouse//RT and score against leak models in Model Serving, so distribution-loss anomalies surface on the Network Control Center for crew dispatch, separate from private-side meter alerts.
        components:
          - Network Control Center
          - Itron OpenWay
          - AVEVA PI System
          - Model Serving
          - Lakehouse//RT
          - Delta Lake
        stories:
          - title: Turning smart digital water meter data into autonomous actions
            url: https://www.databricks.com/customers/water-link
          - title: Pipeline Flow Monitoring
            url: https://www.databricks.com/blog/pipeline-flow-monitoring
      - name: Demand Forecasting
        short: Planning
        icon: chart
        summary: Consumption forecast by district, weather and season.
        problem: Demand is planned off last year's averages, so pumping, storage and purchases are set blind to weather, growth and seasonal swings, and the utility over-pumps or runs storage too low.
        who_benefits: Distribution Ops
        how_built: AMI intervals, weather and calendar features are engineered in Feature Store and forecast per district through Model Serving, published to planners on certified AI/BI Metric Views.
        components:
          - AI/BI
          - Weather Forecast API
          - Itron OpenWay
          - Model Serving
          - Feature Store
          - Delta Lake
        stories:
          - title: Sabesp Transforms Water Utility Operations with Lakehouse
            url: https://www.databricks.com/customers/sabesp
      - name: Main Break Prediction
        short: Assets
        icon: db
        summary: Pipe material, age and soil corrosivity scored for break risk.
        problem: Mains are replaced on age alone, so sound pipe is dug up while corrosive-soil segments fail without warning, flooding streets and cutting service before any renewal budget reaches them.
        who_benefits: Asset Management
        how_built: Pipe material, age, break history and soil corrosivity from GIS and Maximo feed break-risk models in Model Serving tracked in MLflow, ranking segments in the Main Replacement Planner.
        components:
          - Main Replacement Planner
          - Esri ArcGIS Utility
          - IBM Maximo
          - Model Serving
          - MLflow
          - Feature Store
        stories:
          - title: What is Predictive Maintenance?
            url: https://www.databricks.com/blog/what-is-predictive-maintenance
          - title: Pipeline Flow Monitoring
            url: https://www.databricks.com/blog/pipeline-flow-monitoring
      - name: Pump & Plant Reliability
        short: Assets
        icon: iot
        summary: Pump, motor and treatment-plant failures predicted from condition and SCADA telemetry so equipment is serviced before it stops a plant.
        problem: Pumps, motors and treatment plant are maintained on a calendar, so a failing pump is found when it trips a station, not on a planned window, and crews chase symptoms across systems.
        who_benefits: Asset Management
        how_built: PI historian and Maximo condition data feed remaining-life and anomaly models tracked in MLflow and scored in Model Serving, raising work orders for maintenance planning.
        components:
          - IBM Maximo
          - AVEVA PI System
          - Model Serving
          - MLflow
          - Feature Store
        stories:
          - title: What is Predictive Maintenance?
            url: https://www.databricks.com/blog/what-is-predictive-maintenance
      - name: Pressure Management
        short: Operations
        icon: stream
        summary: Pressure zones optimised for compliance and energy cost.
        problem: Pressure zones are tuned by hand to avoid low-pressure complaints, so the network runs over-pressured, wasting pump energy and driving the main breaks and leakage it was meant to prevent.
        who_benefits: Distribution Ops
        how_built: PI pressure and Schneider PRV telemetry land in Lakehouse//RT and feed optimisation models in Model Serving, so the Network Control Center recommends authorized pressure setpoints subject to hydraulic and existing SCADA control limits.
        components:
          - Network Control Center
          - AVEVA PI System
          - Schneider EcoStruxure
          - Model Serving
          - Lakehouse//RT
      - name: Customer 360
        short: Customer
        icon: custlake
        summary: A single governed view of every account, joining billing, AMI usage, outages and interactions so the contact centre acts on one profile.
        problem: Customer data is split across CIS, AMI and work management, so agents answer high-bill and outage questions from partial records and cannot see the account's own consumption.
        who_benefits: Customer Operations
        how_built: Oracle C2M billing, Itron AMI usage and work orders conform under Unity Catalog in the Customer Impact Console, so agents and Genie explain a bill or an outage from one governed account.
        components:
          - Customer Impact Console
          - Oracle Utilities C2M
          - Itron OpenWay
          - Unity Catalog
          - AI/BI
        stories:
          - title: Turning smart digital water meter data into autonomous actions
            url: https://www.databricks.com/customers/water-link
          - title: Sabesp Transforms Water Utility Operations with Lakehouse
            url: https://www.databricks.com/customers/sabesp
      - name: Water Quality Compliance
        short: Compliance
        icon: gavel
        summary: Lab and online sensor results checked against regulatory limits so exceedances are caught and reported before the deadline.
        problem: Lab results and online sensor readings sit in separate systems, so a chlorine or turbidity exceedance can be missed until a reporting deadline or notification clock has already started.
        who_benefits: Water Quality
        how_built: Hach WIMS lab results and WISKI sensor series are conformed through Lakeflow under Unity Catalog and checked against limits, flagging exceedances early in the Quality Compliance Hub.
        components:
          - Quality Compliance Hub
          - Hach WIMS
          - KISTERS WISKI
          - Lakeflow
          - Unity Catalog
        stories:
          - title: Turning smart digital water meter data into autonomous actions
            url: https://www.databricks.com/customers/water-link
      - name: Field Crew Assistant
        short: Field ops
        icon: apps
        summary: An assistant that gives field crews the work order, asset history and network context for the job, and closes it on mobile.
        problem: Crews arrive with a printed work order and no asset or network context, so jobs stall on missing information and completions are keyed in later, leaving work and network records stale.
        who_benefits: Customer Operations
        how_built: Cityworks work orders, the GIS network model and asset history conform under Unity Catalog; an assistant on Agent Bricks serves crews from Databricks Apps over Lakebase, writing completions back as Field Work Orders.
        components:
          - Field Work Orders
          - Cityworks AMS
          - Esri ArcGIS Utility
          - Agent Bricks
          - Lakebase
      - name: Sustainability
        short: Energy & carbon
        icon: globe
        summary: Pump energy and greenhouse-gas intensity optimised across the network for cost and carbon.
        problem: Pumping is the utility's biggest energy cost and its largest controllable emissions, but energy, tariff and flow data sit apart from operations, so neither cost nor carbon is actually managed.
        who_benefits: Distribution Ops
        how_built: Pump, tank and tariff data feed optimisation models tracked in MLflow and scored in Model Serving, so energy and emissions are cut from the Network Control Center within hydraulic limits. The Vattenfall reference is a pumped-storage energy and carbon analogy, with water-network optimisation the proposed application.
        components:
          - Network Control Center
          - AVEVA PI System
          - Model Serving
          - MLflow
          - Lakehouse//RT
        stories:
          - title: Vattenfall Builds Real-Time Energy Intelligence
            url: https://www.databricks.com/customers/vattenfall/genie
      - name: Financial Analytics
        short: Finance
        icon: sheet
        summary: Cost per thousand gallons, collections and capital tracked on governed ledgers so finance, rates and operations work from one set of numbers.
        problem: Cost-of-service, collections and capital numbers are spread across CIS, work management and finance systems, so each rate filing and board pack rebuilds them and the numbers rarely reconcile.
        who_benefits: Asset Management
        how_built: CIS, work-management and asset ledgers conform under Unity Catalog and are modelled in AI/BI with Genie One, so cost per thousand gallons, collections and capital are read from one governed set for rate cases and the board.
        components:
          - Oracle Utilities C2M
          - AI/BI
          - Unity Catalog
          - Genie One
          - Main Replacement Planner
        stories:
          - title: How Scottish Water Made Its Capital Investment Data Conversational
            url: https://www.databricks.com/blog/how-scottish-water-made-its-capital-investment-data-conversational-databricks-genie
medallion:
  Bronze:
    short: Raw network and meter feeds
    summary: SCADA historian tags, AMI interval reads, work orders, billing cycles and lab sample results, landed exactly as received so a leak alert or a quality exceedance can always be replayed.
  Silver:
    short: Conformed meter, asset, account
    summary: Meters, assets, service accounts and pressure zones resolved into single conformed entities across CIS, SCADA and GIS, with consumption intervals stitched to one account.
  Gold:
    short: NRW, pressure, compliance
    summary: 'Contracted products operations and regulators run on: non-revenue water, pressure compliance, boil-water event response, and cost per thousand gallons by district.'
