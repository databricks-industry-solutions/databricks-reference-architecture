name: Electric Power Generation
description: 'Power generators operating nuclear, gas and renewable-plus-storage fleets: plant control and historians, nuclear I&C and safety systems, emissions monitoring, wholesale market participation, generation-asset management and regulatory reporting.'
sources:
  - name: Plant Control & Historian
    icon: iot
    tiles:
      - name: AVEVA PI System
        icon: iot
        summary: High-frequency turbine, boiler and balance-of-plant time-series across the fleet, the operational system of record for output and condition.
        citations:
          - pi
        category: Process / Time-Series Historian
        what_it_is: Stores high-frequency turbine, boiler and balance-of-plant tags across every unit as the operational time-series system of record for output, availability and condition.
        who_uses_it: Performance engineers, reliability engineers and control-room operators.
        data_out:
          batch:
            types:
              - structured
            volume: 20-100 GB/day tag history
            interval: Hourly / daily aggregates
          stream:
            types:
              - semi-structured
            volume: 50-500k tags/sec at peak
            interval: Continuous (sub-second sampling)
      - name: Emerson Ovation DCS
        core: true
        icon: gauge
        summary: Distributed control system for gas, steam and nuclear balance-of-plant, publishing setpoints, states and alarms the floor operates on.
        citations:
          - ovation
        category: Distributed Control System (DCS)
        what_it_is: Runs unit control for gas, steam and balance-of-plant, publishing the setpoints, states and alarms operators act on across the fleet.
        who_uses_it: Control-room operators, controls engineers and performance engineers.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 10-100k points/sec
            interval: Continuous (sub-second)
      - name: GE Mark VIe Controls
        icon: stream
        summary: 'Gas and steam turbine control and protection: combustion, speed and load telemetry, trips and start sequences per unit.'
        citations:
          - mark-vie
        category: Turbine Control System
        what_it_is: Gas and steam turbine control and protection emitting combustion, speed and load telemetry, trip records and start sequences per unit.
        who_uses_it: Controls engineers, performance engineers and reliability engineers.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 10-100k signals/sec
            interval: Continuous (sub-second)
  - name: Nuclear & Safety
    icon: zshield
    tiles:
      - name: Framatome Teleperm XS
        icon: zshield
        summary: 'Nuclear safety instrumentation and control: reactor protection and engineered-safety-feature actuation with the qualified pedigree the licensing basis rests on.'
        citations:
          - framatome
        category: Nuclear Safety I&C
        what_it_is: Provides reactor protection and engineered-safety-feature actuation with the safety-qualified pedigree the plant licensing basis rests on.
        who_uses_it: Reactor engineering, I&C engineering and licensing teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 1000s of safety signals/sec
            interval: Continuous (safety-qualified)
      - name: GE Hitachi Nuclear I&C
        icon: iot
        summary: Reactor and turbine-island control and monitoring for BWR and ABWR units where GE Hitachi is the incumbent, feeding the same reliability view.
        citations:
          - ge-hitachi
        category: Nuclear Control & Monitoring
        what_it_is: Reactor and turbine-island control and monitoring for boiling-water units where GE Hitachi is the incumbent, feeding the same equipment-reliability view.
        who_uses_it: Reactor engineering, control-room operators and reliability engineers.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 1000s of signals/sec
            interval: Continuous
      - name: Nuclear Plant Computer
        icon: db
        summary: 'Plant process computer and safety-parameter display: core, coolant and effluent parameters aggregated for operators and engineering.'
        category: Plant Process Computer / SPDS
        what_it_is: Aggregates core, coolant, dose and effluent parameters into the plant process computer and safety-parameter display operators and engineering monitor.
        who_uses_it: Control-room operators, reactor engineering and radiation protection.
        data_out:
          batch:
            types:
              - structured
            volume: 5-20 GB/day parameter logs
            interval: Continuous logging + daily
          stream:
            types:
              - semi-structured
            volume: 1000s of parameters/sec
            interval: Continuous
  - name: Fuel & Emissions
    icon: stream
    tiles:
      - name: CEMS Analyzers
        icon: observ
        summary: 'Continuous emissions monitoring: stack CO2, NOx, SOx and particulate concentrations and flow, the regulated basis for emissions reporting.'
        category: Continuous Emissions Monitoring (CEMS)
        what_it_is: Measures stack CO2, NOx, SOx and particulate concentrations and flow continuously as the regulated basis for emissions accounting and reporting.
        who_uses_it: Environmental compliance, performance engineers and sustainability teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 100s of readings/sec
            interval: Continuous (regulated)
      - name: Gas Nomination System
        icon: api
        summary: 'Fuel supply and pipeline nominations: gas scheduling, confirmations and burn reconciliation against unit dispatch.'
        category: Fuel Supply / Nominations
        what_it_is: Manages gas scheduling, pipeline nominations and confirmations and reconciles fuel burn against unit dispatch across the fleet.
        who_uses_it: Fuel management, trading and plant operations teams.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-2 GB/day
            interval: Nomination cycles + daily reconciliation
      - name: Weather & Generation Forecast
        core: true
        icon: globe
        summary: Irradiance, wind and temperature forecasts and load signals, the exogenous driver behind renewable output and net-load forecasting.
        category: Weather & Forecast Provider
        what_it_is: Irradiance, wind-speed, temperature and load forecasts consumed as the exogenous driver behind renewable generation and net-load forecasting.
        who_uses_it: Forecasting science, performance engineers and traders.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: GBs/day gridded forecasts
            interval: Multiple forecast cycles daily
  - name: Market & Trading
    icon: market
    tiles:
      - name: ISO/RTO Markets
        icon: market
        summary: 'Wholesale market participation: locational prices, dispatch instructions and settlement that bids, schedules and imbalance clear against.'
        citations:
          - iso
        category: ISO/RTO Market Operator
        what_it_is: Wholesale market participation feeds carrying locational prices, dispatch instructions and settlement that fleet bids, schedules and imbalance clear against.
        who_uses_it: Power traders, schedulers and settlement teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day price + settlement
            interval: Settlement cycles daily
          stream:
            types:
              - semi-structured
            volume: 100s-1000s of signals/sec
            interval: Continuous (5-minute dispatch)
      - name: ION Commodities ETRM
        core: true
        icon: erp
        summary: 'Energy trading and risk management for power, gas and PPA positions: deal capture, position, mark-to-market and settlement across the book.'
        citations:
          - ion
        category: Energy Trading & Risk Management (ETRM)
        what_it_is: Captures power, gas and PPA deals, positions, mark-to-market and settlement across the trading book.
        who_uses_it: Power traders, PPA origination and risk/middle office.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day deals + positions
            interval: Intraday + end-of-day marks
      - name: ICE Power Markets
        icon: market
        summary: Forward power, gas and carbon curves and exchange-traded prices, the market reference generation and PPA valuation are marked against.
        citations:
          - ice
        category: Commodity Exchange & Price Reference
        what_it_is: Forward power, gas and carbon curves and exchange-traded prices used as the market reference for generation, spread and PPA valuation.
        who_uses_it: Traders, PPA origination and risk teams.
        data_out:
          batch:
            types:
              - structured
            volume: MBs-GBs reference curves
            interval: Daily settlement + intraday
  - name: Asset & Outage Mgmt
    icon: erp
    simplified: 2
    tiles:
      - name: IBM Maximo EAM
        icon: erp
        summary: 'Enterprise asset management: work orders, component lifing, spares and preventive-maintenance schedules against every unit and major asset.'
        citations:
          - maximo
        category: Enterprise Asset Management (EAM)
        what_it_is: Manages work orders, component lifing, spares and preventive-maintenance schedules against every generating unit and major asset.
        who_uses_it: Reliability engineering, maintenance planning and asset management.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Nightly batch + intraday work orders
      - name: SAP Plant Maintenance
        icon: erp
        summary: Plant maintenance and enterprise asset management where SAP is the incumbent core, feeding the same work-order and asset-register entities.
        citations:
          - sap-pm
        category: Enterprise Asset Management (EAM)
        what_it_is: Plant maintenance and enterprise asset management on the incumbent SAP core, feeding the same work-order and asset-register entities.
        who_uses_it: Maintenance planning, asset management and Finance.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Nightly batch
      - name: Oracle Primavera P6
        core: true
        icon: sheet
        summary: 'Outage and project scheduling: the critical-path plan a major overhaul or refuelling outage is scoped, sequenced and tracked against.'
        citations:
          - primavera
        category: Outage & Project Scheduling
        what_it_is: Holds the critical-path plan a major overhaul or refuelling outage is scoped, sequenced and tracked against across the fleet.
        who_uses_it: Maintenance planning, outage management and project controls.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-2 GB/day schedules
            interval: Outage cycles + daily updates
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Corporate Finance Warehouse
        icon: fed
        summary: Fuel cost, project-finance and asset ledgers left where they are and queried in place under Unity Catalog, avoiding a second copy of the audited numbers.
        category: Enterprise Data Warehouse
        what_it_is: Fuel cost, project-finance and asset ledgers kept in the incumbent finance warehouse and queried in place through federation rather than copied.
        who_uses_it: CFO & treasury, fuel management and portfolio analysts.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale historical ledgers
            interval: Queried on demand (federated)
  - name: Data Formats
    icon: zbraces
    simplified: 2
    tiles:
      - name: 'IEC 61850'
        icon: zbraces
        fmt: '61850'
        summary: 'IEC standard for substation and plant automation communications.'
        spec_url: https://webstore.iec.ch/en/publication/6028
      - name: 'COMTRADE'
        icon: zbraces
        fmt: 'CTR'
        summary: 'IEC Common format for Transient Data Exchange from protection relays and recorders.'
        spec_url: https://webstore.iec.ch/en/publication/24421
      - name: 'IEC 61400-25'
        icon: zbraces
        fmt: '61400'
        summary: 'IEC standard for monitoring and control communications of wind power plants.'
        spec_url: https://webstore.iec.ch/en/publication/5433
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    simplified: 2
    tiles:
      - name: ISO Dispatch Signals
        icon: stream
        summary: Real-time dispatch and, where applicable, AGC and curtailment instructions from the ISO, streamed in so the plant and traders react at grid latency; cadence is market- and service-specific.
        citations:
          - iso
        category: ISO Dispatch & AGC Feed
        what_it_is: Real-time dispatch, AGC and curtailment instructions from the ISO, streamed in so plant controls and traders react at grid latency.
        who_uses_it: Schedulers, control-room operators and grid compliance.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 100s-1000s of signals/sec
            interval: Continuous (4-second AGC / dispatch)
      - name: Plant Sensor Stream
        icon: eventbus
        summary: High-frequency turbine, boiler and inverter telemetry landed as structured events over Zerobus and existing Kafka topics for real-time analytics.
        category: Streaming Telemetry Bus
        what_it_is: High-frequency turbine, boiler and inverter telemetry landed as events over Zerobus and existing Kafka topics for real-time performance and reliability analytics.
        who_uses_it: Performance engineers, forecasting science and reliability teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 50-500k events/sec at peak
            interval: Continuous (sub-second)
      - name: Environmental & Grid Data
        icon: globe
        summary: Ambient conditions, water-temperature and grid-frequency feeds consumed inbound as constraints on dispatch and cooling.
        category: Environmental & Grid Data Provider
        what_it_is: Ambient conditions, cooling-water temperature and grid-frequency feeds consumed inbound as constraints on unit dispatch, derates and cooling.
        who_uses_it: Performance engineers, environmental compliance and schedulers.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: GBs/day
            interval: Hourly / daily updates
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Executive Office
        mark: Genie One
        summary: The CEO on fleet margin and the build-and-retire plan; the CFO on capital, fuel cost and return on every megawatt; the Chief Sustainability Officer on emissions and the disclosure the board signs.
        uses:
          - - Genie One
            - Ask what last month's fleet margin was without booking analyst time.
          - - AI/BI
            - Margin, availability and emissions on one certified set of Metric Views.
          - - Unity Catalog
            - Certification and the glossary, so "availability" and "heat rate" mean one thing across the fleet.
        sub:
          - name: CEO
            cares: fleet margin and the build-and-retire plan.
          - name: CFO & Treasury
            cares: capital, fuel cost and return on every megawatt.
          - name: Chief Sustainability
            cares: emissions and audited disclosure.
        ucs:
          - Sustainability & Circular Economy
          - Capital Investment Simulation
          - Production Monitoring
      - name: Plant Operations
        mark: Lakehouse//RT
        summary: Control-room operators and performance engineers on availability, output and heat rate across gas, nuclear and renewable units on blue-sky and peak days.
        uses:
          - - Plant Performance Cockpit
            - Unit output, availability and heat rate on one live screen.
          - - Lakehouse//RT
            - DCS and historian telemetry at the latency a trip moves at.
          - - AI/BI
            - Forced-outage and efficiency KPIs on governed definitions.
        sub:
          - name: Control-Room Operators
            cares: unit output, alarms and dispatch compliance each shift.
          - name: Performance Engineers
            cares: heat rate and the gap to the unit performance case.
          - name: Shift Managers
            cares: forced-outage risk and start reliability.
        ucs:
          - Production Monitoring
          - Operations Resource Efficiency
          - Predictive Maintenance & Asset Health
          - Demand Forecasting
      - name: Trading & Commercial
        core: true
        mark: Model Serving
        summary: Power traders scheduling and hedging fleet generation into the ISO; originators structuring PPAs and offtake; schedulers arbitraging storage and ancillary markets.
        uses:
          - - Trading & Dispatch Desk
            - Position, forecast and margin on a unit before a bid is placed.
          - - Model Serving
            - Price and generation forecasts scored inside the bidding path.
          - - Lakehouse//RT
            - Live price and dispatch at the latency the market clears at.
        sub:
          - name: Power Traders
            cares: scheduling and hedging generation into the ISO.
          - name: PPA Origination
            cares: offtake structure, shape and imbalance risk.
          - name: Schedulers
            cares: storage and ancillary-market arbitrage.
        ucs:
          - Commodity & Energy Trading
          - Demand Forecasting
          - Sustainability & Circular Economy
      - name: Nuclear & Safety
        mark: MLflow
        summary: Reactor engineers on core and safety-system margins; licensing on technical specifications and the regulatory record; radiation protection on dose and effluent within limits.
        uses:
          - - Unity Catalog
            - One governed record for the licensing basis and equipment reliability.
          - - MLflow
            - Safety and reliability models tracked for audit and reproduction.
          - - AI/BI
            - Safety-system margin and reliability KPIs on governed definitions.
        sub:
          - name: Reactor Engineering
            cares: core and safety-system margins and fuel-cycle performance.
          - name: Licensing & Compliance
            cares: technical specifications and the regulatory record.
          - name: Radiation Protection
            cares: dose and effluent held within limits.
        ucs:
          - Regulation Compliance, & External Reporting
          - Predictive Maintenance & Asset Health
      - name: Reliability & Outages
        mark: Lakeflow
        summary: Reliability engineers on forced-outage risk across the fleet; maintenance planning on the outage window and spares; asset management on which units to overhaul, life-extend or retire.
        uses:
          - - Outage Planner
            - Predicted failures turned into scoped, scheduled outage work.
          - - Lakeflow
            - Historian, DCS and EAM feeds conformed for reliability analytics.
          - - MLflow
            - Remaining-life models tracked for audit and reproduction.
        sub:
          - name: Reliability Engineering
            cares: forced-outage risk and failure modes across the fleet.
          - name: Maintenance Planning
            cares: the outage window, spares and crews.
          - name: Asset Management
            cares: overhaul, life-extension and retire decisions.
        ucs:
          - Predictive Maintenance & Asset Health
          - Production Monitoring
          - Capital Investment Simulation
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land the PI historian, Ovation DCS, market and EAM feeds; own the Bronze to Silver path and the pager when a performance table stalls before the morning call.
        uses:
          - - Lakeflow Connect
            - Managed connectors for the historian, EAM and market sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on DCS and CEMS feeds.
          - - Lakewatch
            - Freshness on the availability and heat-rate tables ops reads each morning.
        sub:
          - name: Plant Data Pipelines
            cares: historian, DCS and CEMS feeds landed reliably.
          - name: Market & EAM Integration
            cares: trade, settlement and work-order reconciliation.
          - name: Streaming Platform
            cares: plant telemetry landed at control-room latency.
        ucs:
          - Production Monitoring
          - Demand Forecasting
          - Predictive Maintenance & Asset Health
      - name: Data Scientists
        mark: MLflow
        summary: Heat-rate, remaining-life, generation and price models, and whether they still hold a season after deployment across the fleet.
        uses:
          - - Feature Store
            - Unit and market features read identically in training and serving.
          - - MLflow
            - Every forecast and remaining-life run tracked for audit and reproduction.
          - - Model Serving
            - Heat-rate and price models scored in the operational path.
        sub:
          - name: Reliability Science
            cares: remaining-life and anomaly models on plant data.
          - name: Efficiency Science
            cares: heat-rate and combustion optimisation models.
          - name: Market Science
            cares: generation and price forecasting.
        ucs:
          - Operations Resource Efficiency
          - Predictive Maintenance & Asset Health
          - Demand Forecasting
          - Commodity & Energy Trading
      - name: App Developers
        mark: Apps
        summary: Ship the plant-performance, trading and outage-planning apps the fleet works in, hosted next to governed plant data with governed writes back to DCS and EAM.
        uses:
          - - Apps
            - Operational screens with no separate web tier to run or secure.
          - - Lakebase
            - Serverless Postgres for dispatch and work-order state.
          - - Agent Bricks
            - Agents that draft a work order or a dispatch note against governed tools.
        sub:
          - name: Ops Apps
            cares: plant, trading and outage screens over governed data.
          - name: Lakebase Engineering
            cares: dispatch and work-order state with governed writes.
          - name: Agent Developers
            cares: agents that draft against governed tools.
        ucs:
          - Production Monitoring
          - Commodity & Energy Trading
          - Predictive Maintenance & Asset Health
consumers:
  - name: BI & Productivity
    icon: chart
    from: bi
    tiles:
      - name: Tableau / Power BI
        icon: chart
        summary: Operations, commercial and finance dashboards against SQL warehouses, with Unity Catalog permissions enforced end to end.
      - name: Microsoft Teams
        icon: chat
        summary: Genie in Teams for governed answers on availability, heat rate and margin, and dispatch updates in the channel the fleet already works in.
      - name: Notebooks & IDEs
        icon: notebook
        summary: Performance and data-science notebooks, VS Code and JetBrains against governed plant, market data and Genie Code.
  - name: Operational Writeback
    icon: opdb
    tiles:
      - name: DCS Setpoint Advisories
        icon: gauge
        summary: Heat-rate and combustion setpoint recommendations delivered as advisories to controls engineers, who apply them in the DCS rather than a model driving plant directly.
        citations:
          - ovation
      - name: Maximo Work Orders
        core: true
        icon: erp
        summary: Predicted failures and corrective actions raised as work orders against the unit, in the system maintenance already runs.
        citations:
          - maximo
      - name: Outage Schedule Updates
        icon: sheet
        summary: Predicted scope and duration written back into the Primavera outage plan so the schedule reflects real condition.
        citations:
          - primavera
  - name: Grid & Market Partners
    icon: partner
    tiles:
      - name: ISO Market Bids
        icon: api
        summary: Bids, schedules and imbalance positions served back to the ISO and market platforms through governed offer APIs.
        citations:
          - iso
      - name: Fuel & Gas Suppliers
        icon: share
        summary: Gas nominations and delivery confirmations exchanged with pipeline and fuel suppliers against unit dispatch.
      - name: Grid Operator Sharing
        icon: partner
        summary: Availability, dispatch and telemetry shared live to the grid operator over Delta Sharing with no copy and no egress duplication.
  - name: Regulatory & Reporting
    icon: gavel
    tiles:
      - name: Emissions Reporting
        icon: gavel
        summary: CEMS and Scope 1 emissions filings produced from the same governed tables the fleet runs on.
      - name: Reliability & Nuclear Filings
        core: true
        icon: share
        summary: Reliability and nuclear regulatory filings produced from contracted Gold products rather than reassembled by hand under deadline.
  - name: Published Products
    icon: product
    tiles:
      - name: Data Products
        icon: product
        summary: Published, contracted products discoverable in Unity Catalog Domains and shared over OpenSharing.
      - name: Sharing Recipients
        core: true
        icon: share
        summary: Regulators, grid operators, lenders and partners reading live tables with no copy and no egress duplication.
  - name: Databricks Apps
    icon: apps
    tiles:
      - name: Plant Performance Cockpit
        icon: gauge
        short: Live plant state
        summary: 'The screen operations runs the fleet from: unit output, availability and heat rate against the performance case, on Databricks Apps over Lakebase.'
      - name: Trading & Dispatch Desk
        icon: market
        short: Market & PPA
        summary: Where traders and schedulers see forecast generation, position and margin against live ISO prices, and place bids and storage schedules with the spread and hedge in one view.
      - name: Outage Planner
        icon: sheet
        short: Reliability
        summary: Predicted failures and corrective actions turned into scoped, scheduled outage work, sequenced against crews, spares and the Primavera plan and written back to Maximo.
      - name: Emissions & Compliance Ledger
        icon: gavel
        short: Carbon & regulatory
        summary: CEMS and fuel data reconciled to CO2, NOx and SOx intensity by unit, audit-ready for regulators and the board.
  - name: AI/BI Dashboards
    icon: aibi
    tiles:
      - name: Plant Performance
        icon: aibi
        summary: Availability, capacity factor, heat rate and start reliability on certified Metric Views.
        kpis:
          - Availability
          - Capacity factor
          - Heat rate (thermal units)
          - Forced outage rate
          - Start reliability
        teams:
          - Plant Operations
          - Performance Engineers
          - Executive Office
      - name: Trading & Settlement
        icon: aibi
        summary: Positions, forecast accuracy, spreads, imbalance and ancillary revenue.
        kpis:
          - Open position
          - Forecast accuracy
          - Spark spread (dark where applicable)
          - Imbalance cost
          - Ancillary revenue
        teams:
          - Trading & Commercial
          - Power Traders
          - Schedulers
      - name: Reliability & Outage
        icon: aibi
        summary: Forced-outage risk, remaining life, outage adherence and maintenance cost.
        kpis:
          - Forced outage rate
          - Mean-time-between-failures
          - Outage schedule adherence
          - Predicted failures
          - Maintenance cost per MWh
        teams:
          - Reliability & Outages
          - Reliability Engineering
          - Maintenance Planning
      - name: Emissions & Compliance
        icon: aibi
        summary: CO2, NOx and SOx intensity, Scope 1 emissions and compliance margins.
        kpis:
          - CO2 intensity
          - NOx / SOx
          - Scope 1 emissions
          - Compliance exceedances
          - Effluent / dose margin
        teams:
          - Nuclear & Safety
          - Chief Sustainability
          - Licensing & Compliance
  - name: Agent Harnesses
    icon: agents
    tiles:
      - name: Omnigent OSS
        icon: omni
        short: Databricks, open source
        summary: Open-source meta-harness above existing agent frameworks, enabling agent composition, collaboration and centralised governance from one interface.
        capabilities:
          - Build
          - Deploy
          - Optimize
          - Govern
        related:
          - Agent Bricks
          - Unity Gateway
      - name: Claude Code
        core: true
        icon: code
        short: 3rd-party harness
        summary: Anthropic's coding harness working against the platform through MCP, with spend, routing and policy governed by Unity Gateway.
      - name: OpenAI Codex
        core: true
        icon: code
        short: 3rd-party harness
        summary: OpenAI's coding harness connected over MCP, governed at runtime by Unity Gateway rather than trusted by configuration.
      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Plant & Reliability Agent
        icon: genie
        summary: Ask about unit output, availability, heat rate and forced-outage risk in plain language.
        feeds:
          - AVEVA PI System
          - Emerson Ovation DCS
          - IBM Maximo EAM
          - Availability, heat rate, margin
        teams:
          - Plant Operations
          - Reliability & Outages
          - Performance Engineers
        questions:
          - What was availability and capacity factor by unit yesterday versus plan?
          - Which units are running the worst heat rate this week?
          - Which assets are predicted to fail before the next outage window?
          - What corrective action and outage window is recommended for the units most at risk?
          - What drove the forced outages on the fleet this month?
          - Which units have the poorest start reliability this quarter?
      - name: Nuclear & Safety Agent
        icon: genie
        summary: Answer questions on safety-system margins, equipment reliability and the licensing basis from as-of observational analytics, with licensed systems and engineers authoritative.
        feeds:
          - Framatome Teleperm XS
          - Nuclear Plant Computer
          - GE Hitachi Nuclear I&C
          - Conformed unit, asset, trade
        teams:
          - Nuclear & Safety
          - Reactor Engineering
          - Licensing & Compliance
        questions:
          - Which safety-system margins are trending toward their limits?
          - What is equipment reliability on safety-related systems this cycle?
          - Where do observed parameters stand against approved limits as of the latest data?
          - How is fuel-cycle performance tracking against the plan?
          - What is our dose and effluent margin this period?
      - name: Trading & Dispatch Agent
        icon: genie
        summary: Explore positions, forecast generation, spreads and settlement across the portfolio.
        feeds:
          - ION Commodities ETRM
          - ICE Power Markets
          - ISO/RTO Markets
          - ISO Dispatch Signals
        teams:
