      - name: Staffing & Bench
        short: Resourcing
        icon: people
        summary: Open engagement demand matched to available skills and bench, so the right consultant is staffed instead of the first one free.
        problem: Staffing runs on who a resource manager happens to remember, so the bench sits idle while roles go to the nearest name rather than the best fit.
        who_benefits: Delivery & PMO
        how_built: Skills, availability and demand are conformed in the lakehouse; best-fit staffing is scored in Model Serving and confirmed from the Staffing & Bench Board.
