      - name: Talent Attrition
        short: Retention
        icon: people
        summary: Attrition risk scored per consultant so the firm intervenes on its best people before the resignation, not after.
        problem: The firm learns a consultant is leaving when the notice lands, after the knowledge, the client relationship and the utilization have already walked out the door.
        who_benefits: Talent & HR
        how_built: HR, utilization and engagement signals feed an attrition model tracked in MLflow and scored in Model Serving, with at-risk consultants flagged to people leaders.
