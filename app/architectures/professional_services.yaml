      - name: Skills-to-Demand Match
        short: Capability
        icon: ztarget
        summary: The skills the firm has matched against the demand it has sold, so hiring and reskilling close the gap that would otherwise be subcontracted.
        problem: Firms sell skills they are short of and bench skills they oversold, because the supply of capability and the demand in the pipeline are never compared on one picture.
        who_benefits: Talent & HR
        how_built: Skills from HR and delivery are matched semantically to pipeline demand with AI Search; gaps are scored in Model Serving to steer hiring and L&D.
