pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Firm Leadership
        mark: Genie One
        summary: The Managing Partner and CEO on growth, utilization and firm profitability; the COO on delivery health and risk across the portfolio of engagements.
        uses:
          - - Genie One
            - Ask what utilization and margin ran last month across practices without booking analyst time.
          - - AI/BI
            - Utilization, margin, pipeline and win-rate on one certified set of Metric Views.
          - - Unity Catalog
            - Certification and the glossary, so "utilization" and "margin" mean one thing firm-wide.
        sub:
          - name: Managing Partner / CEO
            cares: growth, firm profitability and the trade between hiring and utilization.
          - name: Chief Operating Officer
            cares: delivery health, engagement risk and quality across the portfolio.
          - name: Board & Partners
            cares: partner economics, distributions and the firm-wide scorecard.
        ucs:
          - Engagement Margin
          - Consultant Utilization
          - Pipeline & Win-Rate
          - Knowledge & GenAI
      - name: Practice Leaders
        mark: AI/BI
        summary: 'Practice and sector leads owning a book of business: the pipeline they must win, the engagements they deliver and the margin those engagements return.'
        uses:
          - - AI/BI
            - Practice margin, backlog and win-rate on governed data the leadership team also reads.
          - - Genie One
            - Ask which engagements are slipping on margin without a finance pull.
          - - Model Serving
            - Win probability scored on the pipeline behind proposal decisions.
        sub:
          - name: Practice leads
            cares: 'the practice P&L: pipeline, utilization and margin by engagement.'
          - name: Sector leads
            cares: the book of business and the win rate in their industry vertical.
          - name: Engagement partners
            cares: delivery quality, scope and profitability on live engagements.
        ucs:
          - Engagement Margin
          - Pipeline & Win-Rate
          - Proposal Analytics
          - Consultant Utilization
      - name: CFO & Finance
        mark: AI/BI
        summary: The CFO and finance team on revenue recognition, days sales outstanding, subcontractor spend and the month-end close across a book of concurrent engagements.
        uses:
          - - AI/BI
            - Revenue, DSO, WIP and margin variance to plan on certified numbers.
          - - Lakeflow
            - Time, rate and contract feeds reconciled to the general ledger continuously.
          - - Unity Catalog
            - Audit-supporting lineage and access across the finance and delivery estate.
        sub:
          - name: CFO
            cares: revenue recognition, cash and firm margin under pressure.
          - name: Controller
            cares: the close, WIP and unbilled revenue across engagements.
          - name: Billing & AR
            cares: invoicing accuracy, DSO and dispute reduction.
        ucs:
          - Revenue Recognition
          - Subcontractor Spend
          - Engagement Margin
      - name: Talent & HR
        mark: Model Serving
        summary: Talent and HR leadership on attrition, skills coverage and the match between the people the firm has and the demand it has sold.
        uses:
          - - Model Serving
            - Attrition risk and skills-to-demand gaps scored per consultant.
          - - AI/BI
            - Headcount, attrition and skills coverage on governed HR data.
          - - AI Search
            - Skills and experience matched semantically to open engagement roles.
        sub:
          - name: Chief People Officer
            cares: attrition, engagement and the talent brand.
          - name: Talent acquisition
            cares: hiring against the demand the firm has sold.
          - name: L&D / capability
            cares: reskilling to close skills-to-demand gaps.
        ucs:
          - Talent Attrition
          - Skills-to-Demand Match
          - Staffing & Bench
      - name: Delivery & PMO
        core: true
        mark: Lakehouse//RT
        summary: Resource managers and the PMO on staffing the bench against demand, protecting utilization and keeping engagements on scope and on margin.
        uses:
          - - Lakehouse//RT
            - Live utilization, bench and staffing state at the cadence resourcing moves at.
          - - Model Serving
            - Best-fit staffing recommendations scored against skills and availability.
          - - Apps
            - Resourcing and utilization screens hosted next to governed delivery data.
        sub:
          - name: Resource managers
            cares: matching the bench to demand week by week.
          - name: PMO
            cares: engagement health, scope and delivery risk across the portfolio.
          - name: Delivery leads
            cares: utilization and burn on their own engagements.
        ucs:
          - Consultant Utilization
          - Staffing & Bench
          - Knowledge & GenAI
  - name: Technical
    icon: code
    tiles:
      - name: Delivery Engineers
        mark: Lakeflow
        summary: Land the PSA, CRM, finance and HR feeds from Kantata, Salesforce, Workday and NetSuite; own the Bronze to Silver path and the pager when a utilization table stalls.
        uses:
          - - Lakeflow Connect
            - Managed connectors for the PSA, CRM, ERP and HR sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on time, rate and contract feeds.
          - - Lakewatch
            - Freshness on the utilization and margin tables leadership reads every Monday.
      - name: Insights & Analytics
        mark: MLflow
        summary: Build the utilization, margin, attrition and win-rate models on top of governed engagement data, and prove they still hold as the book of business shifts.
        uses:
          - - Feature Store
            - Consultant, engagement and client features read identically in training and serving.
          - - MLflow
            - Every attrition and win-rate experiment tracked for audit and reproduction.
          - - Model Serving
            - Staffing, attrition and win models scored in the resourcing and pipeline path.
      - name: Knowledge & GenAI
        mark: Agent Bricks
        summary: Ground a firm-wide assistant on deliverables, methods and prior work in iManage, SharePoint and Confluence, governed so an answer never crosses an engagement wall it should not.
        uses:
          - - Agent Bricks
            - Retrieval agents over deliverables and methods with governed tools.
          - - AI Search
            - Semantic search across prior engagements and knowledge assets.
          - - Unity Catalog
            - Fine-grained access so client and engagement walls hold inside the assistant.
