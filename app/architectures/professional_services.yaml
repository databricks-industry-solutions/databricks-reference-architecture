            url: https://www.databricks.com/blog/beyond-spreadsheet-how-databricks-delivering-modern-cfo-financial-services
      - name: Subcontractor Spend
        short: Procurement
        icon: docs
        summary: Subcontractor and supplier spend joined to engagements so pass-through cost and margin leakage are seen per project.
        problem: Subcontractor cost sits in procurement, disconnected from the engagement it was bought for, so margin leakage and off-contract spend hide until the project is underwater.
        who_benefits: CFO & Finance
        how_built: Coupa purchase orders and invoices are conformed and joined to engagement actuals in the lakehouse, surfacing spend and leakage by project in AI/BI.
        components:
          - Coupa Procurement
          - AI/BI
          - Workday Financials
          - Lakeflow
        stories:
          - title: How CFOs in consulting can recover margin with Databricks
            url: https://www.databricks.com/blog/how-cfos-consulting-can-recover-margin-databricks
      - name: Knowledge & GenAI
        short: Assistant
        icon: genie
        summary: A governed assistant over the firm's deliverables and methods so consultants reuse prior work instead of rebuilding it.
        problem: The firm's best thinking is buried in past deliverables no one can find, so every engagement rebuilds work that already exists somewhere in the practice.
        who_benefits: Firm Leadership
        how_built: Deliverables and methods in iManage and Confluence are indexed for AI Search, and a retrieval agent built on Agent Bricks answers within Unity Catalog access walls from the Deliverables Assistant.
        components:
