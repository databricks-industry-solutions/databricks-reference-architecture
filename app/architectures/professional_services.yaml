      - name: Proposal Analytics
        short: Bidding
        icon: product
        summary: Proposals and bids analysed against past wins so pricing, staffing and scope reflect what actually closes.
        problem: Every proposal is priced from scratch, so the firm repeats the pricing and staffing mistakes of the last lost bid instead of learning from the won ones.
        who_benefits: Practice Leaders
        how_built: Won and lost proposals, rates and outcomes are conformed in the lakehouse; win drivers are analysed in AI/BI and surfaced against new bids.
