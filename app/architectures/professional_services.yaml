      - name: Pipeline & Win-Rate
        short: Growth
        icon: market
        summary: Pipeline health and win probability scored across the opportunity book so partners chase the deals the firm can actually win.
        problem: Pipeline is judged on gut and stage, so effort goes to deals that will not close while the winnable ones get too little partner attention.
        who_benefits: Practice Leaders
        how_built: Salesforce and PSA opportunity data are conformed; win probability is scored in Model Serving and read alongside backlog in AI/BI.
