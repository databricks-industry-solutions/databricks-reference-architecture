agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Utilization & Delivery Agent
        icon: genie
        summary: Ask about billable utilization, bench and engagement health across practices in plain language.
        feeds:
          - Kantata PSA
          - Replicon Time
          - NetSuite OpenAir
          - Utilization, margin, win-rate
        teams:
          - Delivery & PMO
          - Firm Leadership
          - Resource managers
        questions:
          - What was billable utilization last month by practice and consultant?
          - Who is on the bench this week and for how long?
          - Which engagements are burning ahead of plan?
          - Where is idle capacity likely next week?
          - How does utilization compare to target by sector?
      - name: Engagement Margin Agent
        icon: genie
        summary: Explore realised margin, rate-versus-cost and leakage across engagements and practices.
        feeds:
          - Workday Financials
          - DocuSign CLM
          - Revenue & GL Mart
          - Utilization, margin, win-rate
        teams:
          - Practice Leaders
          - CFO & Finance
          - Engagement partners
        questions:
          - Which engagements are slipping on margin this quarter?
          - What is realised margin by practice against the rate card?
          - Where is scope creep eroding margin the most?
          - How does margin compare across fixed-fee and T&M engagements?
          - Which clients consistently deliver below target margin?
      - name: Pipeline & Win-Rate Agent
        icon: genie
        summary: Answer questions on pipeline health, win probability and proposal outcomes across the book.
        feeds:
          - Salesforce Sales Cloud
          - Dynamics 365 Sales
          - HubSpot CRM
          - Utilization, margin, win-rate
        teams:
          - Practice Leaders
          - Firm Leadership
          - Sector leads
        questions:
          - What is our weighted pipeline by practice and sector?
          - Which open opportunities have the highest win probability?
          - What is our win rate by sector this year versus last?
          - Which proposals stalled and at what stage?
          - Which deals should partners prioritise this week?
      - name: Talent & Skills Agent
        icon: genie
        summary: Ask about attrition risk, skills coverage and staffing fit across the workforce.
        feeds:
          - Workday HCM
          - Jira & Confluence
          - iManage Knowledge
          - Conformed engagement, person, client
        teams:
          - Talent & HR
          - Delivery & PMO
          - L&D / capability
        questions:
          - Which consultants are at highest attrition risk right now?
          - Where are our biggest skills-to-demand gaps?
          - Who is the best-fit staffing for this open role?
          - Which skills are we overselling versus our bench?
          - How is attrition trending by practice and level?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Consultant Utilization
        short: Billable rate
        icon: gauge
        summary: Billable utilization and bench tracked live across consultants and practices so idle capacity is seen and filled before it is lost.
        problem: Utilization is the number the firm lives on, yet it is stitched together from timesheets days late, so idle capacity is only seen after the week it was lost.
        who_benefits: Delivery & PMO
