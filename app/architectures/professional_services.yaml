  Silver:
    short: Conformed engagement, person, client
    summary: Engagements, consultants and clients resolved into single conformed entities across the PSA, CRM, finance and HR systems, with rate cards, cost rates and skills reconciled to one record.
  Gold:
    short: Utilization, margin, win-rate
    summary: 'Contracted products leadership runs on: billable utilization and bench, engagement and practice margin, pipeline and win-rate, attrition and skills-to-demand coverage.'
