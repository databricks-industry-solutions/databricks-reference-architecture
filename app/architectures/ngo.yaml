agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Donor & Fundraising Agent
        icon: genie
        summary: Ask about funds raised, retention and campaign performance across donors in plain language.
        feeds:
          - Salesforce Nonprofit Cloud
          - Blackbaud Raiser's Edge
          - Classy Donation Pages
          - Reach, cost, compliance
        teams:
          - Development & Marketing
          - Executive Directors
          - Major Gifts
        questions:
          - What did we raise this quarter versus last, by campaign and channel?
          - Which major-gift prospects are ready for an ask now?
          - What is our donor retention rate and how is it trending?
          - Which lapsed donors are the best win-back candidates?
          - What is cost per dollar raised by acquisition channel?
      - name: Program & M&E Agent
        icon: genie
        summary: Explore indicator progress, beneficiary reach and cost per outcome across the portfolio.
        feeds:
          - DevResults M&E
          - CommCare Mobile
          - KoBoToolbox
          - Conformed donor, grant
        teams:
          - Programs & M&E
          - Executive Directors
          - M&E Advisors
        questions:
          - Which sites missed their targets last month and by how much?
          - What is cost per outcome by program and geography?
          - How complete is field survey data across active projects?
          - Which cohorts are falling behind on program outcomes?
          - What is beneficiary reach this quarter versus plan?
      - name: Grants & Compliance Agent
        icon: genie
        summary: Answer questions on grant spend, restricted-fund exceptions and reporting deadlines.
        feeds:
          - Fluxx Grantmaker
          - Blackbaud Financial Edge
          - SAP Public Sector
          - Reach, cost, compliance
        teams:
          - Grants & Compliance
          - Executive Directors
          - Compliance & Audit
        questions:
          - Which grants are near closeout or reporting deadlines?
          - Where is spend running ahead of or behind budget by award?
          - What is our compliance exception rate across active grants?
          - Which restricted funds are at risk of misallocation?
          - Which sub-grantees are behind on milestone reporting?
      - name: Field & Logistics Agent
        icon: genie
        summary: Ask about stock positions, dispatch and duty of care during emergency responses.
        feeds:
          - RITA (Logistics Cluster)
          - Workday HCM
          - IATI d-portal / HXL (HDX)
          - Conformed donor, grant
        teams:
          - Field Operations
          - Logistics & Supply
          - Security & Duty of Care
        questions:
          - What is current relief-item stock by warehouse and item?
          - Which distribution points are short of supply right now?
          - How many field staff have outstanding security check-ins?
          - What is dispatch lead time during the current response?
          - Where is need concentrating based on the latest activity data?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Donor Propensity
        short: Fundraising
        icon: custlake
        summary: Major-gift and upgrade likelihood scored from engagement and giving history.
        problem: Major-gift and upgrade potential is buried in years of gifts, events and email history, so gift officers chase warm names by instinct and the best prospects go unworked before the ask.
        who_benefits: Development & Marketing
        how_built: Engagement and giving history are engineered in Feature Store and scored through Model Serving, surfacing ranked prospects into the Donor Journey Hub before the ask.
        components:
          - Donor Journey Hub
          - Model Serving
          - Feature Store
          - Salesforce Nonprofit Cloud
          - MLflow
        stories:
          - title: MissionWired drives strong donor campaigns through predictive data
            url: https://www.databricks.com/customers/missionwired
      - name: Donor Churn
        short: Retention
        icon: people
        summary: Lapsed and downgraded donors surfaced before renewal campaigns launch.
        problem: Lapsed and downgraded donors are noticed only after the renewal fails, when reactivation costs far more than the retention touch that would have kept the relationship alive.
        who_benefits: Development & Marketing
        how_built: Giving cadence and engagement signals feed churn models scored in Model Serving, pushing at-risk and win-back segments into the Donor Journey Hub before renewal campaigns launch.
        components:
          - Donor Journey Hub
          - Model Serving
          - MLflow
          - CustomerLake
          - Feature Store
        stories:
          - title: MissionWired drives strong donor campaigns through predictive data
            url: https://www.databricks.com/customers/missionwired
          - title: Australian Red Cross Lifeblood boosts blood-donor engagement and donation frequency
            url: https://www.databricks.com/blog/announcing-winners-2023-databricks-data-team-awards
      - name: Grant Compliance
        short: Audit
        icon: gavel
        summary: Restricted-fund exceptions flagged before funder and board review.
        problem: Restricted-fund rules, milestones and budgets live in separate finance, grants and field systems, so exceptions surface in the funder audit rather than before the report is filed.
        who_benefits: Grants & Compliance
        how_built: Grant ledger, budget and milestone data are conformed under Unity Catalog and checked in the Grant Compliance Desk, flagging restricted-fund exceptions before funder and board review.
        components:
          - Grant Compliance Desk
          - Unity Catalog
          - Blackbaud Financial Edge
          - Fluxx Grantmaker
          - AI/BI
      - name: Program Outcomes
        short: M&E
        icon: chart
        summary: Indicator attainment linked to spend and geography for portfolio reviews.
        problem: Indicator results sit in mobile survey tools while spend sits in finance, so no one can show whether a program actually moved its outcomes for the money it consumed.
        who_benefits: Programs & M&E
        how_built: Survey and grant data are conformed on Delta Lake and served through the Program Portfolio and AI/BI, linking indicator attainment to spend and geography for portfolio reviews.
        components:
          - Program Portfolio
          - AI/BI
          - Unity Catalog
          - DevResults M&E
          - Delta Lake
        stories:
          - title: Turning insight into impact with Databricks and Global Orphan Project
            url: https://www.databricks.com/blog/turning-insight-impact-databricks-and-global-orphan-go-project
          - title: How World Bank Group uses Databricks to eradicate poverty through shared knowledge
            url: https://www.databricks.com/blog/how-world-bank-group-uses-databricks-eradicate-poverty-through-shared-knowledge
      - name: Beneficiary Targeting
        short: Equity
        icon: globe
        summary: Underserved communities identified from field and census overlays.
        problem: Aid is allocated on last year's caseload and gut feel, so underserved households are missed while served areas get revisited and equity claims cannot be evidenced.
        who_benefits: Programs & M&E
        how_built: Field survey and census overlays are scored in Model Serving against a conformed beneficiary model, surfacing underserved communities into program planning.
        components:
          - Model Serving
          - CommCare Mobile
          - Unity Catalog
          - AI/BI
          - Feature Store
        stories:
          - title: Virtue Foundation scales global health with data and AI
            url: https://www.databricks.com/customers/virtue-foundation
      - name: Emergency Surge
        short: Humanitarian
        icon: stream
        summary: Logistics and staffing scaled from early signals before peaks hit.
        problem: When a crisis breaks, stock, staff and cash are mobilised from spreadsheets and phone calls, so the response lags the need and pre-positioning decisions are made blind.
        who_benefits: Field Operations
        how_built: Hazard, logistics and roster feeds land in Lakehouse//RT and drive anticipatory-action triggers in the Field Ops Console, scaling supply and staffing before peaks hit.
        components:
          - Field Ops Console
          - Lakehouse//RT
          - IATI d-portal / HXL (HDX)
          - RITA (Logistics Cluster)
          - Model Serving
        stories:
          - title: Zipline delivers critical medical supplies with data and AI
            url: https://www.databricks.com/customers/zipline
      - name: Sanctions Screening
        short: Risk
        icon: gavel
        summary: Donor and vendor names screened against applicable watchlists, generating candidate matches for review.
        problem: Applicable screening policy requires donors and vendors to be checked against watchlists, yet manual name matching against sanctions lists is slow and error-prone, leaving the organisation exposed on the matches it misses.
        who_benefits: Grants & Compliance
        how_built: Donor and vendor records are screened against parsed OFAC and applicable watchlists with AI Functions under Unity Catalog, generating candidate matches resolved through authorized policy or reviewer adjudication with a lineage trail for audit.
        components:
          - OFAC Sanctions Lists
          - AI Functions
          - Unity Catalog
          - Salesforce Nonprofit Cloud
          - Model Serving
      - name: Cost per Outcome
        short: Efficiency
        icon: sheet
        summary: Program economics compared across interventions and geographies.
        problem: Comparing what an outcome costs across programs and countries means reconciling incompatible budgets and indicators by hand, so leadership debates anecdotes instead of unit economics.
        who_benefits: Executive Directors
        how_built: Conformed spend and outcome products are exposed as certified Metric Views in AI/BI and the Program Portfolio, comparing cost per outcome across interventions and geographies.
        components:
          - Program Portfolio
          - AI/BI
          - Unity Catalog
          - Blackbaud Financial Edge
          - Data Products
        stories:
          - title: Turning insight into impact with Databricks and Global Orphan Project
            url: https://www.databricks.com/blog/turning-insight-impact-databricks-and-global-orphan-go-project
      - name: Volunteer Mobilisation
        short: Community
        icon: people
        summary: Volunteer capacity matched to campaigns and field events by region.
        problem: Volunteer availability, skills and history are scattered across events and offices, so campaigns and field surges are staffed late and willing volunteers are never asked.
        who_benefits: Field Operations
        how_built: Volunteer and campaign data are conformed under Unity Catalog and matched in an Apps console on Lakebase, aligning volunteer capacity to campaigns and field events by region.
        components:
          - Apps
          - Lakebase
          - Unity Catalog
          - Workday HCM
          - AI/BI
        stories:
          - title: Crisis Text Line supports people in crisis with data and AI
            url: https://www.databricks.com/customers/crisis-text-line
      - name: Impact Storytelling
        short: Communications
        icon: notebook
        summary: Outcome evidence assembled for appeals without manual spreadsheet chases.
        problem: Appeals and funder narratives are assembled by chasing outcome numbers across spreadsheets and inboxes, so the story lands late and rarely reflects the latest governed evidence.
        who_benefits: Development & Marketing
        how_built: Agent Bricks drafts appeal and funder narratives with AI Functions against governed Gold outcome products, so evidence-backed stories assemble without manual spreadsheet chases.
        components:
          - Agent Bricks
          - AI Functions
          - Genie One
          - Data Products
          - AI/BI
        stories:
          - title: Turning insight into impact with Databricks and Global Orphan Project
            url: https://www.databricks.com/blog/turning-insight-impact-databricks-and-global-orphan-go-project
medallion:
  Bronze:
    short: Raw donor and field
    summary: CRM gifts, grant ledger entries, mobile survey responses, logistics waybills and banking settlements, landed exactly as received so a donation or a beneficiary visit can always be replayed as it stood.
  Silver:
    short: Conformed donor, grant
    summary: Donors, households, grants, projects and beneficiaries resolved into single conformed entities across CRM, ERP and field systems, with restricted-fund balances reconciled and program outcomes stitched to one intervention record.
  Gold:
    short: Reach, cost, compliance
    summary: 'Contracted products leadership and boards run on: funds raised and donor retention, cost per outcome by program, grant spend against budget and compliance exception rates.'
