name: NGO & Non-Profit
description: Donor stewardship, grant compliance, program delivery and field operations for humanitarian, development and advocacy organisations operating across borders.
sources:
  - name: CRM & Fundraising
    icon: custlake
    simplified: 2
    tiles:
      - name: Salesforce Nonprofit Cloud
        icon: custlake
        summary: Donor profiles, campaigns, pledges and recurring gifts from the CRM fundraisers work in.
        citations:
          - sf-nonprofit
        category: Nonprofit CRM / Fundraising
        what_it_is: Holds donor profiles, campaigns, pledges and recurring gifts as the CRM fundraisers and development teams work in.
        who_uses_it: Development, digital fundraising and donor care teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Hourly / nightly sync
          stream:
            types:
              - semi-structured
            volume: tens of gift and engagement events/sec
            interval: Continuous CDC
      - name: Blackbaud Raiser's Edge
        icon: people
        summary: Major-gift pipelines, events and acknowledgment history for development teams.
        citations:
          - blackbaud-re
        category: Fundraising / Donor Management
        what_it_is: Manages major-gift pipelines, events and acknowledgment history for development teams.
        who_uses_it: Major gifts, events and donor stewardship teams.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-3 GB/day
            interval: Nightly batch
      - name: Classy Donation Pages
        icon: partner
        summary: Peer-to-peer and crowdfunding transactions with UTM and appeal codes.
        citations:
          - classy
        category: Online Giving Platform
        what_it_is: Processes peer-to-peer and crowdfunding donations and carries UTM and appeal codes for campaign attribution.
        who_uses_it: Digital fundraising and campaign analytics teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds of transactions/hour at peak
            interval: Continuous (API / webhook)
  - name: Grants & Finance
    icon: erp
    simplified: 3
    tiles:
      - name: Blackbaud Financial Edge
        icon: erp
        summary: Restricted and unrestricted funds, allocations and grant drawdowns.
        citations:
          - blackbaud-fe
        category: Fund Accounting System
        what_it_is: Fund accounting system of record for restricted and unrestricted funds, allocations and grant drawdowns.
        who_uses_it: Finance, fund accounting and grant compliance teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-4 GB/day
            interval: Nightly batch + close cycles
      - name: Fluxx Grantmaker
        core: true
        icon: sheet
        summary: Sub-grant applications, awards and milestone reporting to institutional donors.
        citations:
          - fluxx
        category: Grants Management System
        what_it_is: Manages sub-grant applications, awards and milestone reporting to and from institutional donors.
        who_uses_it: Grant managers, program teams and compliance staff.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 0.5-2 GB/day
            interval: Daily + reporting cycles
      - name: SAP Public Sector
        icon: erp
        summary: Project accounting, procurement and audit-ready financial close for large NGOs.
        citations:
          - sap-public
        category: ERP / Financials Suite
        what_it_is: Runs project accounting, procurement and audit-ready financial close for large NGOs.
        who_uses_it: Finance, procurement and controllership teams.
        data_out:
          batch:
            types:
              - structured
            volume: 5-20 GB/day
            interval: Nightly batch + monthly close
  - name: Program & Field M&E
    icon: globe
    simplified: 2
    tiles:
      - name: CommCare Mobile
        icon: api
        summary: Field surveys, case management and visit logs from community health and protection programs.
        citations:
          - commcare
        category: Field Case Management / Mobile Data
        what_it_is: Captures field surveys, case management and visit logs from community health and protection programs, often offline-first.
        who_uses_it: Field workers, program officers and M&E advisors.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 0.2-2 GB/day
            interval: Sync on connectivity (batched)
          stream:
            types:
              - semi-structured
            volume: tens of submissions/min at peak
            interval: Continuous when online
      - name: KoBoToolbox
        icon: notebook
        summary: Rapid assessments and baseline surveys deployed in low-connectivity settings.
        citations:
          - kobo
        category: Mobile Survey / Data Collection
        what_it_is: Collects rapid assessments and baseline surveys in low-connectivity field settings for program teams.
        who_uses_it: M&E advisors, assessment teams and field enumerators.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 0.1-1 GB/day
            interval: Sync on connectivity (batched)
      - name: DevResults M&E
        core: true
        icon: chart
        summary: Indicator frameworks, results chains and portfolio dashboards for program teams.
        citations:
          - devresults
        category: Monitoring & Evaluation (M&E) System
        what_it_is: Holds indicator frameworks, results chains and portfolio dashboards program teams manage outcomes against.
        who_uses_it: M&E advisors, program directors and country teams.
        data_out:
          batch:
            types:
              - structured
            volume: 0.2-1 GB/day
            interval: Daily + reporting cycles
  - name: Logistics & HR
    icon: stream
    simplified: 2
    tiles:
      - name: RITA (Logistics Cluster)
        icon: stream
        summary: 'WFP and Logistics Cluster relief-item tracking: warehouse stock and dispatch to distribution points.'
        citations:
          - logistics-cluster
        category: Humanitarian Logistics / Supply Chain
        what_it_is: Tracks relief-item warehouse stock and dispatch to distribution points across the humanitarian supply chain.
        who_uses_it: Logistics, supply chain and field operations teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 0.2-1 GB/day
            interval: Daily + surge cadence
          stream:
            types:
              - semi-structured
            volume: dispatch events during surges
            interval: Continuous during response
      - name: Workday HCM
        icon: people
        summary: Staff roster, payroll and duty-of-care records across country offices.
        citations:
          - workday
        category: HCM / Payroll Suite
        what_it_is: Holds the staff roster, payroll and duty-of-care records across country offices.
        who_uses_it: Human resources, payroll and security/duty-of-care teams.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-3 GB/day
            interval: Nightly batch + payroll cycles
      - name: International SOS
        icon: gavel
        summary: Travel risk approvals, incident reports and security check-ins for field staff.
        category: Travel Risk & Security Platform
        what_it_is: Manages travel risk approvals, incident reports and security check-ins for field staff duty of care.
        who_uses_it: Security, duty-of-care and country management teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: check-in and incident events
            interval: Continuous (event-driven)
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: UN Agency Data Mart
        icon: fed
        summary: OCHA and cluster reference datasets left at partners and queried in place under Unity Catalog.
        category: Partner Data Warehouse / Marts
        what_it_is: OCHA and cluster reference datasets kept at partner agencies and queried in place through federation instead of being copied.
        who_uses_it: Program, coordination and M&E analysts.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: GB-scale reference marts
            interval: Queried on demand (federated)
  - name: Data Formats
    icon: zbraces
    tiles:
      - name: 'IATI'
        icon: zbraces
        fmt: 'IATI'
        summary: 'International Aid Transparency Initiative XML standard for publishing aid activity data.'
        spec_url: https://iatistandard.org/
        spark_connector: 'spark-xml'
        spark_repo: https://github.com/databricks/spark-xml
        databricks_resource: https://docs.databricks.com/aws/en/query/formats/xml
        source_systems:
          - 'IATI Registry'
          - 'AidStream'
          - 'DevResults'
      - name: 'HXL'
        core: true
        icon: zbraces
        fmt: 'HXL'
        summary: 'Humanitarian Exchange Language, lightweight hashtags added to humanitarian datasets.'
        spec_url: https://hxlstandard.org/
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    tiles:
      - name: Guidestar / Candid
        icon: partner
        summary: Charity registry and 990 filings consumed inbound for due diligence on partners.
        citations:
          - candid
        category: Charity Registry / Nonprofit Data
        what_it_is: Provides charity registry profiles and 990 filings consumed inbound for due diligence on partners and grantees.
        who_uses_it: Grants compliance, partnerships and due-diligence teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: MBs-GBs reference
            interval: Periodic + on-demand API
      - name: OFAC Sanctions Lists
        core: true
        icon: gavel
        summary: Watchlist updates parsed on arrival for donor and vendor screening.
        citations:
          - ofac
        category: Sanctions & Watchlist Provider
        what_it_is: Publishes sanctions and watchlist updates parsed on arrival for donor, vendor and partner screening.
        who_uses_it: Compliance, sub-grantee risk and finance teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: MBs per update
            interval: Daily + on-change
      - name: IATI d-portal / HXL (HDX)
        icon: globe
        summary: Aid-flow (IATI) and 3W activity data on HDX parsed on arrival for coordination and targeting.
        citations:
          - iati
        category: Aid-Flow & Coordination Data
        what_it_is: Carries aid-flow (IATI) and 3W (who-does-what-where) activity data on HDX parsed on arrival for coordination and targeting.
        who_uses_it: Program coordination, M&E and targeting teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: GB-scale activity data
            interval: Periodic + on-demand
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Executive Directors
        mark: Genie One
        summary: The CEO on funds raised and program reach; the CFO on restricted-fund compliance and audit readiness when a major institutional grant closes out.
        uses:
          - - Genie One
            - Ask what unrestricted reserves are after last quarter's campaigns without waiting on finance.
          - - AI/BI
            - Fundraising, program cost and compliance on one certified set of Metric Views.
          - - Unity Catalog
            - Certification so "restricted" means one thing across CRM and ERP.
        sub:
          - name: CEO & Board
            cares: funds raised, program reach and whether the mission is moving for the money spent.
          - name: CFO & Finance
            cares: restricted-fund compliance, reserves and a clean audit when a major grant closes out.
          - name: Country Directors
            cares: portfolio delivery and cost per outcome across programs and geographies.
        ucs:
          - Cost per Outcome
          - Program Outcomes
          - Grant Compliance
          - Donor Churn
      - name: Development & Marketing
        mark: CustomerLake
        summary: Major gifts, digital campaigns and donor journeys when appeal season peaks, tracked on donor retention and cost per dollar raised.
        uses:
          - - Donor Journey Hub
            - Lapsed and upgrade segments before year-end mail drops.
          - - CustomerLake
            - Household segments without copying CRM into a separate CDP.
          - - AI/BI
            - Retention and cost per dollar raised on governed definitions.
        sub:
          - name: Major Gifts
            cares: the major-gift pipeline and which prospects are ready for the ask this quarter.
          - name: Digital Fundraising
            cares: appeal performance, cost per dollar raised and donor acquisition channels.
          - name: Donor Care
            cares: stewardship, retention and the lapsed and upgrade journeys before year-end.
        ucs:
          - Donor Propensity
          - Donor Churn
          - Impact Storytelling
          - Volunteer Mobilisation
      - name: Programs & M&E
        core: true
        mark: AI/BI
        summary: Country directors on indicator progress, beneficiary reach and field data quality, and cost per outcome compared across programs and geographies.
        uses:
          - - Program Portfolio
            - Outcome indicators by grant and geography on one surface.
          - - Genie One
            - Ask which sites missed their vaccination target last month.
          - - Unity Catalog
            - One beneficiary definition across mobile and grant systems.
        sub:
          - name: Country Directors
            cares: indicator progress and beneficiary reach across the country portfolio.
          - name: M&E Advisors
            cares: results chains, indicator definitions and the evidence behind outcome claims.
          - name: Field Data Quality
            cares: survey completeness and one beneficiary definition across mobile and grant systems.
        ucs:
          - Program Outcomes
          - Beneficiary Targeting
          - Cost per Outcome
      - name: Grants & Compliance
        mark: Unity Catalog
        summary: Grant managers on eligibility, reporting deadlines and sub-grantee risk, watching spend against budget and the compliance exception rate.
        uses:
          - - Grant Compliance Desk
            - Milestone and budget exceptions before funder reports lock.
          - - Unity Catalog
            - Lineage from field survey to funder disclosure.
          - - AI/BI
            - Spend against budget on certified Metric Views.
        sub:
          - name: Grant Managers
            cares: eligibility, reporting deadlines and spend against budget on every award.
          - name: Compliance & Audit
            cares: restricted-fund rules, audit readiness and the exception rate funders see.
          - name: Sub-grantee Risk
            cares: due diligence, sanctions screening and sub-grantee monitoring.
        ucs:
          - Grant Compliance
          - Sanctions Screening
          - Cost per Outcome
      - name: Field Operations
        mark: Apps
        summary: Logistics and security on stock positions, convoy movements and duty of care, tracked on distribution reach and lead time during emergency surges.
        uses:
          - - Field Ops Console
            - Stock and distribution status during emergency surges.
          - - Apps
            - Approval workflows hosted next to governed data.
          - - Lakehouse//RT
            - Dispatch updates at the latency a crisis moves at.
        sub:
          - name: Logistics & Supply
            cares: stock positions, in-kind donations and dispatch to distribution points.
          - name: Security & Duty of Care
            cares: travel approvals, incident reports and staff check-ins in the field.
          - name: Volunteer Coordination
            cares: volunteer capacity and rostering for campaigns and emergency surges.
        ucs:
          - Emergency Surge
          - Volunteer Mobilisation
          - Beneficiary Targeting
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land the CRM gift, grant ledger, mobile survey and logistics feeds; own the Bronze to Silver path and the pager when a field pipeline breaks.
        uses:
          - - Lakeflow Connect
            - Managed connectors for CRM, ERP and mobile M&E sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on gift and survey feeds.
          - - Lakewatch
            - Freshness on the fundraising and indicator tables leadership reads.
        sub:
          - name: Ingestion
            cares: managed connectors for CRM, grant ledger, mobile M&E and logistics feeds.
          - name: Pipeline Reliability
            cares: Bronze-to-Silver expectations and the pager when a field feed breaks.
          - name: Governance
            cares: lineage and freshness on the fundraising and indicator tables leadership reads.
        ucs:
          - Grant Compliance
          - Program Outcomes
          - Emergency Surge
      - name: Data Scientists
        mark: MLflow
        summary: Donor propensity, churn, beneficiary-targeting and anticipatory-action models, and whether they still hold six months after deployment in the field.
        uses:
          - - Feature Store
            - Giving and field features read identically in training and serving.
          - - MLflow
            - Every propensity and churn run tracked for audit and reproduction.
          - - Model Serving
            - Donor and targeting models scored in the campaign and field path.
        sub:
          - name: Donor Modeling
            cares: propensity and churn models on giving and engagement history.
          - name: Targeting & Anticipatory
            cares: beneficiary-targeting and anticipatory-action models for the field.
          - name: Model Ops
            cares: whether a model still holds six months after deployment in the field.
        ucs:
          - Donor Propensity
          - Donor Churn
          - Beneficiary Targeting
          - Emergency Surge
      - name: App Developers
        mark: Apps
        summary: Ship the donor journey, grant compliance and field-ops applications development and program teams work in, hosted next to governed data.
        uses:
          - - Apps
            - Operational screens with no separate web tier to run or secure.
          - - Lakebase
            - Serverless Postgres for case and approval state and governed writes.
          - - Agent Bricks
            - Agents that draft a funder narrative against governed tools.
        sub:
          - name: Donor & Marketing Apps
            cares: the donor journey and stewardship screens fundraisers work in.
          - name: Field & Grant Apps
            cares: grant compliance and field-ops apps hosted next to governed data.
          - name: Agents
            cares: agents that draft a funder narrative against governed tools.
        ucs:
          - Impact Storytelling
          - Volunteer Mobilisation
          - Grant Compliance
