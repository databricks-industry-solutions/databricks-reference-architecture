        icon: market
        short: Execution quality
        summary: Where execution traders see slippage, venue performance and cost against benchmark before and after every fill, on Databricks Apps over Lakebase.
      - name: Risk Cockpit
        icon: gauge
        short: Firm-wide exposure
        summary: VaR, stress and limit usage across every book on one screen, re-run intraday instead of waiting for the overnight batch.
      - name: Surveillance Console
        icon: gavel
        short: Market abuse alerts
        summary: Manipulation, spoofing and wash-trade alerts triaged with the trader's full order and comms context in one investigation view.
      - name: Quant Research Lab
        icon: notebook
        short: Backtesting
        summary: Where quants build, backtest and promote signals from notebook to monitored pipeline against governed tick and factor data.
  - name: AI/BI Dashboards
    icon: aibi
    tiles:
      - name: Revenue & Inventory
        icon: aibi
        summary: Trading revenue, spread capture and inventory across every desk on certified Metric Views.
        kpis:
          - Trading revenue
          - Spread capture
          - Inventory
          - Return on balance sheet
          - Desk P&L
        teams:
          - Markets Leadership
          - Trading Desks
          - Strats & Banking
      - name: Firm Risk & Exposure
        icon: aibi
        summary: VaR, stress, limit usage and counterparty exposure across the firm.
        kpis:
          - VaR
          - Stress loss
          - Limit utilization
          - Counterparty exposure
          - Sensitivities
        teams:
          - Risk Management
          - Chief Risk Officer
          - Credit risk
      - name: Execution Quality (TCA)
        icon: aibi
        summary: Slippage, venue performance and market impact against benchmark.
        kpis:
          - Implementation shortfall
          - Slippage vs benchmark
          - Venue fill rate
          - Market impact
          - Spread capture
        teams:
          - Trading Desks
          - Execution traders
          - Desk heads
      - name: Surveillance & Regulatory
        icon: aibi
        summary: Alert quality, case backlog and regulatory reporting timeliness.
        kpis:
          - Alert volume
          - False-positive rate
          - Case backlog
          - Report timeliness
          - Reporting completeness
        teams:
          - Compliance & Surveil
          - Surveillance
          - Regulatory reporting
  - name: Agent Harnesses
    icon: agents
    tiles:
      - name: Omnigent OSS
        icon: omni
