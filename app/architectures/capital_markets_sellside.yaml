agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Pricing & Trading Agent
        icon: genie
        summary: Ask about spreads, inventory, flow and client profitability across every desk in plain language.
        feeds:
          - ION Fidessa
          - Security Master
          - Murex MX.3
          - Conformed trades, positions, instruments
        teams:
          - Markets Leadership
          - Trading Desks
          - Strats & Banking
        questions:
          - What is our spread capture by desk and product this week?
          - Which inventory positions are stale or over funding cost?
          - Which clients drove the most flow and revenue this quarter?
          - Where are we quoting off-market versus the axe?
          - What is return on balance sheet by desk right now?
      - name: Execution & TCA Agent
        icon: genie
        summary: Explore slippage, venue performance and transaction cost against benchmark.
        feeds:
          - FIX Gateways
          - ION Fidessa
          - Bloomberg B-PIPE
          - P&L, risk, TCA, exposure
        teams:
          - Trading Desks
          - Execution traders
          - Desk heads
        questions:
          - What was our implementation shortfall by desk this week?
          - Which venues delivered the best fill quality for large orders?
          - How does slippage compare against arrival-price benchmark by asset class?
          - Which algos are underperforming on market impact right now?
          - Where are we paying the most in spread by symbol?
      - name: Market & Credit Risk Agent
        icon: genie
        summary: Ask about VaR, stress, sensitivities and counterparty exposure across books.
        feeds:
          - Murex MX.3
          - Nasdaq Calypso
          - MSCI Barra
          - P&L, risk, TCA, exposure
        teams:
          - Risk Management
          - Chief Risk Officer
          - Market risk
        questions:
          - What is our firm-wide VaR today, and the trend this month?
          - How does the book behave under a rates +200bp stress scenario?
          - Which counterparties carry the largest exposure right now?
          - Which books are closest to a limit breach?
          - What are our largest factor sensitivities across the portfolio?
      - name: Surveillance & Conduct Agent
        icon: genie
        summary: Investigate manipulation, off-channel conduct and completeness across orders and trades.
        feeds:
          - FIX Gateways
          - DTCC
          - Conformed trades, positions, instruments
        teams:
          - Compliance & Surveil
          - Surveillance
          - Regulatory reporting
        questions:
          - Which traders showed spoofing-like order patterns this week?
          - Which desks show off-channel or conduct exceptions this month?
          - Which alert types have the worst false-positive rate?
          - How many surveillance cases are open past their SLA?
          - Is our order and trade data complete for the reporting period?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Research Augmentation
        short: Research
        icon: notebook
        summary: Augmenting analysts and strats with governed access to filings, estimates, market and internal data plus LLMs, so a research note or a pricing model is built in hours against one source rather than assembled by hand.
        problem: Analysts stitch research from filings, vendor terminals and internal spreadsheets by hand, so notes are slow, coverage is thin, and the same numbers are re-derived on every desk.
        who_benefits: Strats & Banking
        how_built: Filings, estimates and market data are conformed in the lakehouse; Agent Bricks and AI Functions ground research assistants on governed data and code, tracked in MLflow.
        components:
          - Quant Research Lab
          - Agent Bricks
          - AI Functions
          - FactSet
          - MLflow
        stories:
          - title: Jefferies modernizes equity research with agentic analytics
            url: https://www.databricks.com/blog/jefferies-modernizes-equity-research-scale-databricks-and-agentic-analytics
          - title: MCP-powered financial AI workflows on Databricks
            url: https://www.databricks.com/blog/mcp-powered-financial-ai-workflows-databricks
      - name: Pricing & Spreads
        short: Pricing
        icon: market
        summary: Pricing risk, quoting spreads and routing flow with market data and inventory in one place, so quotes reflect real axes and cost and the desk defends its spread capture.
        problem: Pricing sits in desk spreadsheets and the EMS while inventory and cost sit elsewhere, so quotes lag the market, spread capture is measured days later, and axes are missed.
        who_benefits: Trading Desks
        how_built: FIX order and execution events are joined to market data and inventory in Lakehouse//RT; pricing and spread analytics are computed to Gold and read in the TCA Workbench and AI/BI on the desk's own definitions.
        components:
          - TCA Workbench
          - FIX Gateways
          - Bloomberg B-PIPE
          - AI/BI
          - Lakehouse//RT
      - name: Market & Credit Risk
        short: Risk
        icon: gauge
        summary: VaR, stress, sensitivities and counterparty exposure across every book, re-run intraday instead of waiting for an overnight batch that is stale by the open.
        problem: Risk is aggregated overnight in engines that cannot be re-run intraday, so a shock is seen the next morning and limit breaches are explained after the loss.
        who_benefits: Risk Management
        how_built: Murex and Nasdaq Calypso valuations and position feeds are conformed to Gold; VaR, stress and counterparty models are scored in Model Serving and read in the Risk Cockpit and AI/BI.
        components:
          - Risk Cockpit
          - Murex MX.3
          - Model Serving
          - MSCI Barra
          - AI/BI
        stories:
          - title: S&P Global unifies data intelligence
            url: https://www.databricks.com/customers/sp-global
          - title: MCP-powered financial AI workflows on Databricks
            url: https://www.databricks.com/blog/mcp-powered-financial-ai-workflows-databricks
      - name: Surveillance & Conduct
        short: Conduct
        icon: gavel
        summary: Detecting spoofing, layering, wash trades and off-channel conduct across captured orders, executions and communications, with an audit trail that supports regulatory examination.
        problem: Surveillance and e-comms conduct run across siloed vendor systems with gappy data, so alerts are noisy, investigations are slow, and completeness cannot be proven to an examiner.
        who_benefits: Compliance & Surveil
        how_built: Orders, executions and communications are unified in the lakehouse with Unity Catalog completeness checks; detectors and AI Functions score patterns and cases open in the Surveillance Console.
        components:
          - Surveillance Console
          - AI Functions
          - Unity Catalog
          - Model Serving
          - Lakehouse//RT
        stories:
          - title: 'FINRA: predictive fraud detection at scale'
            url: https://www.databricks.com/blog/2019/06/05/customer-spotlight-finra.html
          - title: Coinbase scales real-time security
            url: https://www.databricks.com/customers/coinbase/lakeflow
      - name: Client Analytics
        short: Coverage
        icon: chart
        summary: Ranking clients by revenue, flow and profitability across products so coverage and pricing target the accounts that matter and no franchise client is under-served.
        problem: Client revenue and flow live in separate desk, product and CRM systems, so coverage cannot see a client's whole relationship and pricing and resourcing decisions are made blind.
        who_benefits: Markets Leadership
        how_built: Trade, flow and revenue data are conformed under Unity Catalog; profitability and wallet analytics are served to certified Metric Views coverage and sales read in AI/BI and Genie One.
        components:
          - AI/BI
          - Genie One
          - S&P Capital IQ
          - FactSet
          - Unity Catalog
        stories:
          - title: S&P Global unifies data intelligence
            url: https://www.databricks.com/customers/sp-global
      - name: Deal Screening
        short: Pitchbooks
        icon: aisvc
        summary: Screening companies, comparables and market data for banking coverage so pitch ideas, comps and deal targets are generated from one governed source instead of manual terminal pulls.
        problem: Bankers assemble comps, precedents and pitch materials by pulling from terminals and spreadsheets, so ideas are slow, comps are inconsistent, and coverage misses timely targets.
        who_benefits: Strats & Banking
        how_built: Company, deal and market data are conformed in the lakehouse and joined to comparables; Agent Bricks drafts screens and comps against governed data, tracked in MLflow.
        components:
          - S&P Capital IQ
          - PitchBook
          - Dealogic
          - Agent Bricks
          - MLflow
        stories:
          - title: Jefferies modernizes equity research with agentic analytics
            url: https://www.databricks.com/blog/jefferies-modernizes-equity-research-scale-databricks-and-agentic-analytics
          - title: Nasdaq reinvents finance with Databricks
            url: https://www.databricks.com/customers/nasdaq
      - name: Regulatory Reporting
        short: Reporting
        icon: gavel
        summary: Producing MiFID II, CAT, EMIR and transaction reports from the same governed data the firm trades on, targeting complete, on-time submissions under applicable regimes.
        problem: Regulatory reports are assembled from reconciled extracts under deadline, so late fixes and re-submissions are routine and lineage back to the source is hard to prove.
        who_benefits: Compliance & Surveil
        how_built: Trade, order and reference data are conformed to Gold with Unity Catalog lineage; MiFID II and CAT submissions are generated and filed from contracted products with a full audit trail.
        components:
          - Regulatory Reporting
          - Unity Catalog
          - MiFID II / CAT Filings
          - DTCC
          - FIX Gateways
        stories:
          - title: 'FINRA: predictive fraud detection at scale'
            url: https://www.databricks.com/blog/2019/06/05/customer-spotlight-finra.html
          - title: Nasdaq reinvents finance with Databricks
            url: https://www.databricks.com/customers/nasdaq
      - name: Trade Lifecycle
        short: Settlement
        icon: cdc
        summary: Automating the trade lifecycle from execution to confirmation and settlement across OMS, clearing and custody so breaks and fails are caught at T+0 rather than discovered at settlement.
        problem: Executions, confirms and settlement records are reconciled in batch across OMS, clearing and custody, so breaks and fails surface late when they are expensive and slow to resolve.
        who_benefits: Trading Desks
        how_built: FIX fills, DTCC confirms and Broadridge settlement feeds stream into the lakehouse; matching runs continuously and breaks and fails are flagged against the firm ledger before settlement.
        components:
          - FIX Gateways
          - DTCC
          - Custodian Feeds
          - Broadridge
          - Lakeflow
        stories:
          - title: Investment management reference architecture
            url: https://www.databricks.com/resources/architectures/financial-services-investment-management-reference-architecture
      - name: Margin & Collateral
        short: Collateral
        icon: gauge
        summary: Optimizing margin and collateral across CCPs, clients and financing so the firm posts the cheapest eligible collateral and sees funding cost and exposure intraday.
        problem: Margin calls and collateral eligibility live across clearing, treasury and prime-brokerage systems reconciled in batch, so the firm over-posts collateral and sees funding cost only after the fact.
        who_benefits: Risk Management
        how_built: Clearing, collateral and financing feeds are conformed to Gold; optimization and exposure models are scored in Model Serving and read in the Risk Cockpit and AI/BI.
        components:
          - Risk Cockpit
          - Nasdaq Calypso
          - Model Serving
          - DTCC
          - AI/BI
        stories:
          - title: S&P Global unifies data intelligence
            url: https://www.databricks.com/customers/sp-global
      - name: Inventory & Balance Sheet
        short: Balance sheet
        icon: market
        summary: Analyzing inventory, positions and balance-sheet usage across desks so capital, funding and RWA are allocated to the flow that earns and stale inventory is worked down.
        problem: Inventory and balance-sheet usage are stitched from desk, treasury and risk extracts that never agree, so capital and funding sit against stale positions and the return on balance sheet is unclear.
        who_benefits: Markets Leadership
        how_built: Positions, funding and capital data are conformed against the firm ledger; inventory and balance-sheet metrics are served to certified Metric Views the desk and treasury read in AI/BI and Genie One.
        components:
          - Firm Balance Sheet
          - AI/BI
          - Genie One
          - Murex MX.3
          - Data Products
        stories:
          - title: Nasdaq reinvents finance with Databricks
            url: https://www.databricks.com/customers/nasdaq
          - title: MCP-powered financial AI workflows on Databricks
            url: https://www.databricks.com/blog/mcp-powered-financial-ai-workflows-databricks
medallion:
  Bronze:
    short: Raw trade and market feeds
    summary: FIX order and execution messages, Bloomberg and LSEG market-data ticks, position and risk extracts from Fidessa, Broadridge and Murex, and DTCC confirms, landed exactly as received so a fill or a price can always be replayed as it stood.
  Silver:
    short: Conformed trades, positions, instruments
    summary: Orders, executions, positions and instruments resolved into single conformed entities across the OMS, risk and custody estates, with the security master and legal-entity identifiers reconciled and trades stitched to one lifecycle.
  Gold:
    short: P&L, risk, TCA, exposure
    summary: 'Contracted products the desk, risk and compliance teams run on: P&L and spread capture by desk, VaR and exposure by factor and counterparty, margin and collateral, and regulatory positions.'
