name: Capital Markets (Sell-Side)
description: 'Banks and broker-dealers: pricing and spread optimization, inventory and balance-sheet analytics, research augmentation, trade lifecycle and settlement, market and credit risk, margin and collateral, trade surveillance and conduct, deal screening, client analytics, and regulatory reporting.'
sources:
  - name: Order & Execution
    icon: market
    tiles:
      - name: ION Fidessa
        icon: market
        summary: 'Sell-side order and execution management: order flow, algos and venue connectivity, the system of record for the order lifecycle on the desk.'
        citations:
          - fidessa
        category: Sell-Side OMS / Trading Platform
        what_it_is: ION Fidessa's sell-side order and execution management, holding order flow, algos and venue connectivity across the trading lifecycle.
        who_uses_it: Sell-side traders, desk operations and execution teams.
        data_out:
          batch:
            types:
              - structured
            volume: 10-40 GB/day orders + executions
            interval: End-of-day batch
          stream:
            types:
              - semi-structured
            volume: 1-10k order/exec events/sec at peak
            interval: Continuous CDC (near real-time)
      - name: Broadridge
        core: true
        icon: erp
        summary: Post-trade processing, books-and-records and settlement management across asset classes for the broker-dealer.
        citations:
          - broadridge
        category: Post-Trade Processing Platform
        what_it_is: Broadridge post-trade processing holding books-and-records, confirmations and settlement state across asset classes for the broker-dealer.
        who_uses_it: Operations, settlements and middle office.
        data_out:
          batch:
            types:
              - structured
            volume: 20-80 GB/day trades + settlement
            interval: Multiple cycles daily
          stream:
            types:
              - semi-structured
            volume: hundreds of lifecycle events/sec
            interval: Continuous CDC
      - name: FIS Front Arena
        icon: gauge
        summary: Cross-asset trading and position management for the sell-side book, feeding trades, positions and P&L into the estate.
        citations:
          - fis
        category: Sell-Side Trading & Position Platform
        what_it_is: FIS Front Arena cross-asset trading and position management, feeding trades, positions and P&L for the sell-side book.
        who_uses_it: Traders, product control and middle office.
        data_out:
          batch:
            types:
              - structured
            volume: 5-20 GB/day positions + P&L
            interval: End-of-day + intraday snapshots
          stream:
            types:
              - semi-structured
            volume: hundreds of trade events/sec
            interval: Continuous CDC
      - name: Trading Technologies
        icon: stream
        summary: 'Multi-asset derivatives execution: order routing, algos and exchange gateways, the source of the child-order and fill stream.'
        citations:
          - tradingtech
        category: Execution Management System (EMS)
        what_it_is: Trading Technologies multi-asset derivatives execution with order routing, algos and exchange gateways, the source of the child-order and fill stream.
        who_uses_it: Execution traders and desk heads.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 1-10k child orders + fills/sec at peak
            interval: Continuous (sub-second)
  - name: Market & Reference Data
    icon: market
    tiles:
      - name: Bloomberg B-PIPE
        icon: market
        summary: 'Consolidated real-time market-data feed: prices, quotes and corporate actions across venues and asset classes.'
        citations:
          - bloomberg-bpipe
        category: Consolidated Market Data Feed
        what_it_is: Bloomberg's consolidated real-time market-data feed carrying prices, quotes and corporate actions across venues and asset classes.
        who_uses_it: Trading desks, quant research and market-data engineering.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 50k-500k ticks/sec at peak
            interval: Continuous streaming
      - name: LSEG Refinitiv
        icon: market
        summary: Real-time and historical pricing, tick history, fundamentals and reference data feeding valuation and analytics.
        citations:
          - refinitiv
        category: Market Data & Analytics Platform
        what_it_is: Real-time and historical pricing, tick history, fundamentals and reference data feeding valuation and analytics.
        who_uses_it: Trading desks, quant research and valuation teams.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale tick history
            interval: Daily history loads
          stream:
            types:
              - semi-structured
            volume: 10k-100k ticks/sec
            interval: Continuous streaming
      - name: ICE Data Services
        icon: market
        summary: Evaluated pricing, reference data and end-of-day feeds for fixed income and cross-asset valuation.
        citations:
          - ice-data
        category: Evaluated Pricing & Reference Data
        what_it_is: Evaluated pricing, reference data and end-of-day feeds for fixed income and cross-asset valuation.
        who_uses_it: Valuation, fixed-income desks and risk teams.
        data_out:
          batch:
            types:
              - structured
            volume: 5-20 GB/day evaluated prices
            interval: End-of-day + intraday snaps
      - name: Security Master
        core: true
        icon: db
        summary: 'The golden instrument and issuer record: identifiers, terms and corporate actions every position and trade resolves against.'
        category: Security Master / Reference Data
        what_it_is: The golden instrument and issuer record holding identifiers, terms and corporate actions that every position and trade resolves against.
        who_uses_it: Reference-data engineers, operations and every downstream desk.
        data_out:
          batch:
            types:
              - structured
            volume: GBs of reference + corporate actions
            interval: Daily refresh + intraday updates
  - name: Risk & Pricing
    icon: gauge
    tiles:
      - name: Murex MX.3
        icon: gauge
        summary: 'Cross-asset trading, valuation and risk platform: pricing, sensitivities and limit state for the trading book.'
        citations:
          - murex
        category: Cross-Asset Trading & Risk Platform
        what_it_is: Cross-asset trading, valuation and risk platform providing pricing, sensitivities and limit state for the trading book.
        who_uses_it: Market risk, the trading desk and product control.
        data_out:
          batch:
            types:
              - structured
            volume: 5-20 GB/day positions + sensitivities
            interval: Daily + scenario runs
      - name: Nasdaq Calypso
        icon: gauge
        summary: Capital-markets and treasury platform for derivatives pricing, collateral and risk on the sell side.
        citations:
          - calypso
        category: Capital Markets Trading & Risk Platform
        what_it_is: Capital-markets and treasury platform for derivatives pricing, collateral and risk on the sell side.
        who_uses_it: Sell-side trading, collateral management and risk.
        data_out:
          batch:
            types:
              - structured
            volume: 5-15 GB/day valuations + collateral
            interval: Daily + intraday runs
          stream:
            types:
              - semi-structured
            volume: tens of trade events/sec
            interval: Continuous CDC
      - name: MSCI Barra
        icon: chart
        summary: 'Multi-asset factor models and risk analytics: factor exposures, attribution and portfolio risk decomposition.'
        citations:
          - msci-barra
        category: Factor Risk Model Library
        what_it_is: 'Multi-asset factor models and risk analytics: factor exposures, attribution and portfolio risk decomposition.'
        who_uses_it: Quant research, risk and portfolio managers.
        data_out:
          batch:
            types:
              - structured
            volume: GBs of factor exposures + models
            interval: Daily / monthly refresh
      - name: Numerix
        icon: market
        summary: Derivatives pricing and analytics library for structured products, curves and Monte Carlo valuation.
        citations:
          - numerix
        category: Derivatives Pricing & Analytics Library
        what_it_is: Derivatives pricing and analytics library for structured products, curves and Monte Carlo valuation.
        who_uses_it: Quant developers, structuring and valuation teams.
        data_out:
          batch:
            types:
              - structured
            volume: GBs of curves + valuations
            interval: On demand + end-of-day
  - name: Post-Trade & Custody
    icon: partner
    tiles:
      - name: DTCC
        icon: partner
        summary: 'Central clearing, settlement and trade-confirmation infrastructure: matched trades, affirmations and settlement status.'
        citations:
          - dtcc
        category: Clearing & Settlement Utility
        what_it_is: Central clearing, settlement and trade-confirmation infrastructure carrying matched trades, affirmations and settlement status.
        who_uses_it: Post-trade operations, settlements and clearing teams.
        data_out:
          batch:
            types:
              - structured
            volume: 5-25 GB/day confirms + settlement
            interval: Multiple settlement cycles daily
          stream:
            types:
              - semi-structured
            volume: tens of status events/sec
            interval: Continuous status flow
      - name: SWIFT Network
        core: true
        icon: stream
        summary: Interbank messaging for settlement, confirmations and custody instructions across counterparties and agents.
        citations:
          - swift
        category: Interbank Messaging Network
        what_it_is: Interbank messaging for settlement, confirmations and custody instructions across counterparties and agents.
        who_uses_it: Settlements, custody operations and treasury.
        data_out:
          stream:
            types:
              - semi-structured
            volume: tens-hundreds of messages/sec
            interval: Continuous message flow
      - name: FIX Gateways
        icon: api
        summary: The FIX order and execution message bus with venues, brokers and counterparties, the ground truth for orders and fills.
        citations:
          - fix
        category: Order Routing Protocol Gateway
        what_it_is: The FIX order and execution message bus with venues, brokers and counterparties, the ground truth for orders and fills.
        who_uses_it: Execution traders, desk operations and market-data engineering.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 1-10k order/exec messages/sec at peak
            interval: Continuous (sub-second)
      - name: Custodian Feeds
        icon: db
        summary: Position, cash and settlement records from the custodian, reconciled against the internal book of record.
        category: Custodian Book of Record
        what_it_is: Position, cash and settlement records from the custodian, reconciled against the internal book of record.
        who_uses_it: Investment operations, reconciliation and fund accounting.
        data_out:
          batch:
            types:
              - structured
            volume: 1-10 GB/day positions + cash
            interval: Daily custodian files
  - name: Research & Deal Data
    icon: chart
    tiles:
      - name: FactSet
        icon: chart
        summary: Fundamentals, estimates, ownership and analytics feeding research, screening and client analysis.
        citations:
          - factset
        category: Financial Data & Analytics Platform
        what_it_is: Fundamentals, estimates, ownership and analytics feeding research, screening and client analysis.
        who_uses_it: Research analysts, strats and coverage banking.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day fundamentals + estimates
            interval: Daily feed
      - name: S&P Capital IQ
        icon: chart
        summary: Company financials, comparables and market intelligence feeding research notes, comps and deal screening.
        citations:
          - capitaliq
        category: Market Intelligence Platform
        what_it_is: S&P Capital IQ company financials, comparables and market intelligence feeding research, comps and deal screening.
        who_uses_it: Research, coverage banking and strats.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day financials + comps
            interval: Daily feed
      - name: PitchBook
        icon: product
        summary: Private-market, deal and comparable data for coverage screening and pipeline analysis.
        citations:
          - pitchbook
        category: Private Market & Deal Data
        what_it_is: PitchBook private-market, deal and comparable data for coverage screening and pipeline analysis.
        who_uses_it: Coverage banking, research and strategy.
        data_out:
          batch:
            types:
              - structured
            volume: GBs of deal + company data
            interval: Daily + on-demand
      - name: Dealogic
        icon: partner
        summary: Deal, league-table and capital-markets activity data for ECM, DCM and M&A coverage.
        citations:
          - dealogic
        category: Capital Markets Deal Data
        what_it_is: Dealogic deal, league-table and capital-markets activity data for ECM, DCM and M&A coverage.
        who_uses_it: Coverage banking, syndicate and strategy.
        data_out:
          batch:
            types:
              - structured
            volume: GBs of deal + league-table data
            interval: Daily + on-demand
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Firm Balance Sheet
        icon: fed
        summary: The firm ledger, funding and balance-sheet mart left where it is and queried in place under Unity Catalog, which avoids a second copy of the audited positions and capital.
        category: Firm Ledger / Balance-Sheet Mart
        what_it_is: The firm ledger, funding and balance-sheet mart kept in the incumbent system and queried in place, giving one audited view of positions, funding and capital.
        who_uses_it: Product control, treasury and finance.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale historical positions
            interval: Queried on demand (federated)
  - name: Data Formats
    icon: zbraces
    tiles:
      - name: 'FIX'
        icon: zbraces
        fmt: 'FIX'
        summary: 'Financial Information eXchange protocol for order management and execution reporting.'
        spec_url: https://www.fixtrading.org/standards/fix-protocol/
      - name: 'FpML'
        core: true
        icon: zbraces
        fmt: 'FpML'
        summary: 'XML standard for OTC derivatives trade representation and lifecycle processing.'
        spec_url: https://www.fpml.org/
        spark_connector: 'spark-xml'
        spark_repo: https://github.com/databricks/spark-xml
        databricks_resource: https://docs.databricks.com/aws/en/query/formats/xml
        source_systems:
          - 'Murex'
          - 'Calypso'
          - 'DTCC'
      - name: 'ISO 20022'
        icon: zbraces
        fmt: '20022'
        summary: 'Rich financial messaging across payments, securities and cash reporting.'
        spec_url: https://www.iso20022.org/
      - name: 'CDM'
        icon: zbraces
        fmt: 'CDM'
        summary: 'ISDA/FINOS Common Domain Model standardising trade and lifecycle event data.'
        spec_url: https://www.finos.org/common-domain-model
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    tiles:
      - name: Market Data Bus
        icon: stream
        summary: Existing Kafka and multicast market-data topics carrying ticks, quotes and reference updates land here and are drawn generically on the reference board.
        category: Streaming Market Data Bus
        what_it_is: Existing Kafka and multicast market-data topics carrying ticks, quotes and reference updates consumed into the lakehouse.
        who_uses_it: Market-data engineering and quant research.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 50k-500k ticks/sec at peak
            interval: Continuous streaming
      - name: FIX Protocol Feeds
        icon: stream
        summary: Streaming FIX order, execution and market-data sessions parsed on arrival and landed as structured events.
        citations:
          - fix
        category: FIX Messaging Feed
        what_it_is: Streaming FIX order, execution and market-data sessions parsed on arrival and landed as structured events.
        who_uses_it: Market-data engineering and execution operations.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 1-10k messages/sec at peak
            interval: Continuous (sub-second)
      - name: Vendor Data APIs
        icon: api
        summary: Bloomberg, LSEG and FactSet request/response and file APIs consumed inbound through managed ELT connectors.
        category: Market Data Vendor API
        what_it_is: Bloomberg, LSEG and FactSet request/response and file APIs consumed inbound through managed ELT connectors.
        who_uses_it: Market-data engineering and research.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 1-5 GB/day
            interval: Daily + on-demand pulls
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Markets Leadership
        mark: Genie One
        summary: The Head of Markets on trading revenue and the client franchise; the markets COO on desk P&L, cost and balance-sheet usage; the CFO on return on balance sheet across the sales-and-trading business.
        uses:
          - - Genie One
            - Ask what a desk earned, or which clients drove flow last quarter, without waiting on an analyst.
          - - AI/BI
            - Revenue, spread capture, inventory and balance-sheet usage on one certified set of Metric Views.
          - - Unity Catalog
            - One governed client and security master, so "revenue" and "flow" mean one thing across the firm.
        sub:
          - name: Head of Markets
            cares: trading revenue, spread capture and the client franchise.
          - name: Markets COO
            cares: desk P&L, cost and balance-sheet usage across products.
          - name: CFO
            cares: return on balance sheet across sales and trading.
        ucs:
          - Pricing & Spreads
          - Inventory & Balance Sheet
          - Client Analytics
      - name: Trading Desks
        mark: Lakehouse//RT
        summary: Desk heads on spread capture, inventory and desk P&L; market makers quoting two-way prices against risk and axes; execution traders working client flow and proving best execution after the fill.
        uses:
          - - Lakehouse//RT
            - Order, execution, market and inventory state at the latency a desk actually trades at.
          - - Model Serving
            - Pricing, hedging and venue models scored inside the quoting decision.
          - - AI/BI
            - Spread capture, inventory and fill quality on the same definitions the desk defends.
        sub:
          - name: Desk heads
            cares: spread capture, inventory and desk P&L.
          - name: Market makers
            cares: quoting two-way prices against risk and axes.
          - name: Execution traders
            cares: client flow and best execution after the fill.
        ucs:
          - Pricing & Spreads
          - Trade Lifecycle
          - Market & Credit Risk
      - name: Risk Management
        core: true
        mark: AI/BI
        summary: The CRO and market risk on VaR, stress and limit usage across books; credit risk on counterparty and issuer exposure; treasury and collateral on margin and funding under stress.
        uses:
          - - AI/BI
            - VaR, exposure, margin and limit usage across every book on certified Metric Views.
          - - Model Serving
            - Stress, VaR and collateral models scored on demand rather than overnight.
          - - Unity Catalog
            - Governed, auditable risk numbers with lineage from feed to report.
        sub:
          - name: Chief Risk Officer
            cares: VaR, stress and limit usage across the firm.
          - name: Market risk
            cares: exposure and sensitivities by book and factor.
          - name: Credit risk
            cares: counterparty and issuer exposure under stress.
        ucs:
          - Market & Credit Risk
          - Margin & Collateral
          - Regulatory Reporting
      - name: Strats & Banking
        mark: MLflow
        summary: Pricing quants and structurers building pricing and hedging models; research analysts producing notes and estimates at scale; coverage bankers screening companies and comparables for the next deal.
        uses:
          - - Feature Store
            - Pricing and research features defined once and read identically in research and production.
          - - MLflow
            - Every pricing model and research run tracked for audit and reproduction.
          - - Agent Bricks
            - Research and deal-screening agents grounded on governed filings, estimates and market data.
        sub:
          - name: Strats & Structuring
            cares: pricing and hedging models the desk quotes against.
          - name: Research
            cares: notes and estimates produced at scale on governed data.
          - name: Coverage Banking
            cares: screening companies and comparables for the next deal.
        ucs:
          - Research Augmentation
          - Deal Screening
          - Pricing & Spreads
      - name: Compliance & Surveil
        mark: AI Functions
        summary: Trade surveillance analysts investigating manipulation and spoofing alerts; conduct and compliance officers on off-channel communications and personal-account dealing; the regulatory reporting team filing MiFID II, CAT and transaction reports on time.
        uses:
          - - AI Functions
            - Communications and trade data screened for manipulation and conduct patterns at scale.
          - - Genie One
            - Investigators ask for a trader's activity around an event in plain language.
          - - Unity Catalog
            - Audit trails and lineage that satisfy a regulatory examination.
        sub:
          - name: Surveillance
            cares: manipulation, spoofing and wash-trade investigations.
          - name: Conduct & Compliance
            cares: off-channel communications and personal-account dealing.
          - name: Regulatory reporting
            cares: MiFID II, CAT and transaction reporting on time.
        ucs:
          - Surveillance & Conduct
          - Regulatory Reporting
          - Client Analytics
  - name: Technical
    icon: code
    tiles:
      - name: Quant Developers
        mark: MLflow
        summary: Turn research notebooks in Python, R and kdb+/q into production signals and backtests, and own the libraries the desk and PMs run against.
        uses:
          - - Notebooks & IDEs
            - Python, R and VS Code against governed tick and reference data.
          - - MLflow
            - Backtests and models versioned, tracked and reproducible for audit.
          - - Feature Store
            - Factor and signal libraries shared across research and production.
        sub:
          - name: Signal Developers
            cares: research notebooks turned into production signals the desk trades on.
          - name: Backtest Engineers
            cares: reproducible backtests and versioned models for audit.
          - name: Quant Library Owners
            cares: the factor and pricing libraries PMs and the desk run against.
      - name: Market Data Engineers
        mark: Lakeflow
        summary: Land Bloomberg B-PIPE, LSEG and ICE feeds and FIX order flow, curate the security master, and keep tick and reference tables fresh for every desk.
        uses:
          - - Lakeflow Connect
            - Managed connectors for market-data, OMS and custody sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on price and reference feeds.
          - - Lakewatch
            - Freshness on the tick and reference tables the desks open at the bell.
        sub:
          - name: Ingestion Engineers
            cares: Bloomberg, LSEG and ICE feeds and FIX order flow landed on time.
          - name: Pipeline Engineers
            cares: Bronze-to-Silver conforming and expectations on price and reference feeds.
          - name: Platform Reliability
            cares: freshness of the tick and reference tables the desks open at the bell.
      - name: Risk Systems Engineers
        mark: Model Serving
        summary: Wire Murex and Nasdaq Calypso valuations, Monte Carlo VaR and stress engines into governed pipelines so risk numbers are timely, explainable and reproducible.
        uses:
          - - Model Serving
            - VaR, stress and pricing models scored on demand at book scale.
          - - Apache Spark
            - Distributed Monte Carlo and revaluation across the full position set.
          - - Unity Catalog
            - Lineage from raw feed to reported risk number for the regulator.
        sub:
          - name: Risk Platform Engineers
            cares: pricing and valuation engines wired into governed pipelines.
          - name: Compute Engineers
            cares: distributed Monte Carlo VaR and revaluation across the full position set.
          - name: Model Ops
            cares: risk numbers timely, explainable and reproducible for the regulator.
consumers:
  - name: BI & Productivity
    icon: chart
    from: bi
    tiles:
      - name: Tableau / Power BI
        icon: chart
        summary: External BI against SQL warehouses, with Unity Catalog permissions enforced end to end.
      - name: Microsoft Teams
        icon: chat
        summary: Genie in Teams for governed answers, and risk and surveillance alerts in the channel desks already work in.
      - name: Notebooks & IDEs
        icon: notebook
        summary: Notebooks, VS Code and JetBrains against governed data and Genie Code.
  - name: Distribution & Partners
    icon: partner
    tiles:
      - name: Client Data Sharing
        icon: share
        summary: Research, axes and post-trade data shared to clients and counterparties over Delta Sharing rather than file exchange.
      - name: Prime Brokers
        icon: partner
        summary: Positions, margin and financing state exchanged with prime brokers and counterparties on live tables.
      - name: Data Marketplace
        icon: market
        summary: Curated market and reference datasets consumed and published through Databricks Marketplace.
  - name: Operational Writeback
    icon: opdb
    tiles:
      - name: OMS / EMS Writeback
        icon: db
        summary: Orders and trading restrictions written back into ION Fidessa, while settlement and books-and-records updates return to Broadridge, so each decision reaches the right path.
      - name: Risk Limit Writeback
        core: true
        icon: gauge
        summary: Updated limits and exposure flags pushed back into the risk and OMS systems the desk trades against.
      - name: Alert & Case Queue
        icon: gavel
        summary: Surveillance alerts and cases pushed to the investigation queue analysts already work.
  - name: Regulatory & Reporting
    icon: gavel
    tiles:
      - name: MiFID II / CAT Filings
        icon: gavel
        summary: Transaction and order-event reporting to the regulator produced from the same governed tables the firm trades on.
        citations:
          - mifid2
          - cat
      - name: Regulatory Reporting
        icon: share
        summary: EMIR, SFTR and prudential submissions filed from contracted Gold products.
  - name: Published Products
    icon: product
    tiles:
      - name: Data Products
        icon: product
        summary: Published, contracted products discoverable in Unity Catalog Domains and shared over OpenSharing.
      - name: Sharing Recipients
        core: true
        icon: share
        summary: Allocators, administrators and partners reading live tables through governed sharing that reduces separately maintained extracts.
  - name: Databricks Apps
