      - name: Review Command Centre
        icon: gauge
        short: E-discovery ops
        summary: Custodian completeness, reviewer throughput and production deadlines on one litigation ops screen.
      - name: Contract Intelligence Hub
        icon: product
        short: CLM analytics
        summary: Non-standard clauses, renewal risk and obligation calendars scored against the firm playbook.
      - name: Conflicts Clearance
        icon: gavel
        short: New business
        summary: Party and relationship hits surfaced before engagement letters and ethical walls are set.
  - name: AI/BI Dashboards
    icon: aibi
    tiles:
      - name: Practice Economics
        icon: aibi
        summary: Realization, leverage, matter margin and WIP across practice groups on certified views.
        kpis:
          - Realization rate
          - Leverage
          - Matter margin
          - WIP ageing
          - Collections rate
        teams:
          - Managing Partner & GC
          - Practice Management
          - Firm CFO
      - name: Litigation Operations
        icon: aibi
        summary: Reviewer throughput, custodian completeness, review cost and docket-deadline risk.
        kpis:
          - Review throughput
          - Custodian completeness
          - Review cost per matter
          - Privilege call rate
          - Deadline risk
        teams:
          - Litigation Support
          - E-Discovery Manager
          - Litigation Paralegal
