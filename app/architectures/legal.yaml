name: Legal
description: 'Law firms and corporate legal departments: matter management, e-discovery, contract lifecycle, time and billing, and regulatory compliance.'
sources:
  - name: Document & DMS
    icon: db
    simplified: 3
    tiles:
      - name: iManage Work
        icon: db
        summary: Matter workspaces, document versions, metadata and ethical wall enforcement.
        citations:
          - imanage
        category: Document Management System (DMS)
        what_it_is: Holds matter workspaces, document versions and metadata and enforces ethical walls as the DMS of record.
        who_uses_it: Attorneys, paralegals and knowledge management teams.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: 10-50 GB/day docs + metadata
            interval: Nightly batch + hourly deltas
          stream:
            types:
              - semi-structured
            volume: tens of document events/sec
            interval: Continuous CDC
      - name: NetDocuments
        icon: sheet
        summary: Cloud DMS profiles, collaboration and client matter security.
        citations:
          - netdocuments
        category: Document Management System (DMS)
        what_it_is: Cloud DMS holding document profiles, collaboration and client-matter security across the firm.
        who_uses_it: Attorneys, paralegals and records teams.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: 5-30 GB/day
            interval: Nightly batch + hourly deltas
      - name: Microsoft Purview
        icon: gavel
        summary: Records classification, retention labels and legal hold across M365 estates.
        citations:
          - purview
        category: Information Governance / Records Platform
        what_it_is: Classifies records, applies retention labels and manages legal hold across the M365 estate.
        who_uses_it: Records, compliance and information governance teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 1-8 GB/day classification + labels
            interval: Nightly batch
  - name: Practice & Billing
    icon: erp
    simplified: 2
    tiles:
      - name: Elite 3E
        icon: erp
        summary: Time entries, disbursements, WIP and matter accounting for large firms.
        citations:
          - elite-3e
        category: Legal Practice Management / Billing
        what_it_is: System of record for time entries, disbursements, WIP and matter accounting at large firms.
        who_uses_it: Billing, finance and practice management teams.
        data_out:
          batch:
            types:
              - structured
            volume: 3-15 GB/day
            interval: Nightly batch + billing cycles
      - name: Aderant Expert
        icon: market
        summary: Billing, collections and financial reporting across practice groups.
        citations:
          - aderant
        category: Legal Practice Management / Billing
        what_it_is: Runs billing, collections and financial reporting across practice groups for the firm.
        who_uses_it: Billing, collections and practice finance teams.
        data_out:
          batch:
            types:
              - structured
            volume: 2-10 GB/day
            interval: Nightly batch + billing cycles
      - name: Intapp
        core: true
        icon: apps
        summary: Client and matter intake, conflicts clearance, time capture and risk management across the firm.
        citations:
          - clio
        category: Intake, Conflicts & Risk Platform
        what_it_is: Manages client and matter intake, conflicts clearance, time capture and risk across the firm.
        who_uses_it: New business intake, conflicts counsel and risk teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 1-5 GB/day
            interval: Hourly / nightly sync
  - name: E-Discovery
    icon: gavel
    simplified: 2
    tiles:
      - name: RelativityOne
        icon: gavel
        summary: Processing, review, analytics and production for litigation and investigations.
        citations:
          - relativity
        category: E-Discovery Platform
        what_it_is: Handles processing, review, analytics and production for litigation and investigations across custodians.
        who_uses_it: E-discovery managers, review teams and litigation paralegals.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: TB-scale per matter
            interval: Per-matter loads + nightly batch
      - name: Everlaw
        icon: partner
        summary: Collaborative review, storybuilder and deposition preparation workflows.
        citations:
          - everlaw
        category: E-Discovery Platform
        what_it_is: Provides collaborative review, storybuilder and deposition-preparation workflows for litigation teams.
        who_uses_it: Review teams, litigation associates and paralegals.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: GB-TB per matter
            interval: Per-matter loads + nightly batch
      - name: PACER Court Records
        icon: api
        summary: Federal docket filings, orders and party events from public court systems.
        citations:
          - pacer
        category: Court Docket / Public Records
        what_it_is: Carries federal docket filings, orders and party events from public court systems for docket monitoring.
        who_uses_it: Litigation paralegals, docketing and case teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: docket events on filing
            interval: Continuous (API polling)
  - name: Contracts & Research
    icon: sheet
    simplified: 3
    tiles:
      - name: Ironclad CLM
        icon: product
        summary: 'Contract lifecycle management: intake, negotiation workflow and obligation tracking.'
        citations:
          - ironclad
        category: Contract Lifecycle Management (CLM)
        what_it_is: Manages contract intake, negotiation workflow and obligation tracking across the contract lifecycle.
        who_uses_it: Practice management, contract owners and knowledge management.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: 1-6 GB/day contracts + metadata
            interval: Nightly batch + hourly deltas
      - name: Thomson Reuters Westlaw
        core: true
        icon: globe
        summary: 'Legal research corpus: case law, statutes and citator research with usage telemetry.'
        citations:
          - westlaw
        category: Legal Research Platform
        what_it_is: Legal research corpus of case law, statutes and citator research, emitting usage telemetry per timekeeper and matter.
        who_uses_it: Attorneys, knowledge management and research analysts.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 0.5-3 GB/day usage telemetry
            interval: Daily feed
      - name: LexisNexis Guidance
        icon: notebook
        summary: 'Legal knowledge: practice notes, checklists and standard clauses referenced at drafting.'
        citations:
          - lexis
        category: Legal Knowledge / Practical Guidance
        what_it_is: Legal knowledge base of practice notes, checklists and standard clauses referenced at drafting.
        who_uses_it: Attorneys, knowledge management and drafting teams.
        data_out:
          batch:
            types:
              - semi-structured
              - unstructured
            volume: GB-scale reference + usage
            interval: Periodic + on-demand
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Client ERP Contract Mart
        icon: fed
        summary: Corporate customer contract and vendor obligation marts left in place and queried under Unity Catalog.
        category: Corporate Contract / Obligation Mart
        what_it_is: Corporate customer contract and vendor-obligation marts queried in place through federation instead of being copied.
        who_uses_it: Corporate legal, contract management and finance analysts.
        data_out:
          batch:
            types:
              - structured
            volume: GB-scale contract marts
            interval: Queried on demand (federated)
  - name: Data Formats
    icon: zbraces
    simplified: 3
    tiles:
      - name: 'LEDES'
        icon: zbraces
        fmt: 'LEDES'
        summary: 'Legal Electronic Data Exchange Standard for e-billing between firms and clients.'
        spec_url: https://ledes.org/
      - name: 'LegalDocML'
        icon: zbraces
        fmt: 'LDML'
        summary: 'OASIS Akoma Ntoso XML for legislative, judicial and legal documents.'
        spec_url: https://www.oasis-open.org/committees/legaldocml/
        spark_connector: 'spark-xml'
        spark_repo: https://github.com/databricks/spark-xml
        databricks_resource: https://docs.databricks.com/aws/en/query/formats/xml
        source_systems:
          - 'Tyler Technologies'
          - 'iManage'
          - 'NetDocuments'
      - name: 'LegalXML ECF'
        icon: zbraces
        fmt: 'ECF'
        summary: 'OASIS Electronic Court Filing standard for exchanging court documents.'
        spec_url: https://docs.oasis-open.org/legalxml-courtfiling/ecf/v5.0/ecf-v5.0.html
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    simplified: 2
    tiles:
      - name: EDRM XML Load Files
        icon: api
        summary: Standardised processing and review metadata consumed inbound for cross-tool portability.
        citations:
          - edrm
        category: E-Discovery Interchange Format
        what_it_is: Standardised processing and review metadata consumed inbound so evidence moves between e-discovery tools without loss.
        who_uses_it: E-discovery managers and litigation support engineers.
        data_out:
          batch:
            types:
              - semi-structured
            volume: GBs per production
            interval: Per-production loads
      - name: LEDES Billing
        icon: market
        summary: Outside counsel invoice formats validated before accrual and payment.
        citations:
          - ledes
        category: Legal E-Billing Format
        what_it_is: Standardised outside-counsel invoice files validated before accrual and payment against matter budgets.
        who_uses_it: Billing, accounts payable and corporate legal operations.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: MBs-GBs per cycle
            interval: Billing cycles + on-receipt
      - name: Sanctions & PEP Lists
        icon: gavel
        summary: Watchlist updates consumed inbound for client intake screening.
        citations:
          - worldcheck
        category: Sanctions & PEP Screening Provider
        what_it_is: Sanctions and politically-exposed-person watchlist updates consumed inbound for client-intake and conflicts screening.
        who_uses_it: Conflicts counsel, KYC/intake and risk teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: MBs per update
            interval: Daily + on-change
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Managing Partner & GC
        mark: Genie One
        summary: The managing partner on firm realization, leverage and matter profitability by practice group; the general counsel on outside-counsel invoices, accruals and budgets.
        uses:
          - - Genie One
            - Ask firm-wide realization this quarter without waiting on finance.
          - - AI/BI
            - Realization, leverage and WIP on one certified set of Metric Views.
          - - Unity Catalog
            - Certification and the business glossary, so "realization" means one thing across practices.
        sub:
          - name: Managing Partner
            cares: firm-wide realization, leverage and the trade between growth and profit per equity partner.
          - name: General Counsel
            cares: outside-counsel spend against budget and matter profitability by practice group.
          - name: Firm CFO
            cares: WIP, collections and the gap between billed and collected across the firm.
        ucs:
          - Matter Profitability
          - Outside Counsel Spend
          - Time Entry Compliance
      - name: Practice Management
        mark: AI/BI
        summary: Practice leaders on matter staffing and leverage, budget burn by phase and whether contracts hold to the firm playbook before write-offs pile up.
        uses:
          - - Matter Profitability Console
            - Budget versus actual by matter phase and timekeeper.
          - - Contract Intelligence Hub
            - Non-standard clauses flagged at intake against the playbook.
          - - AI/BI
            - Matter margin and leverage on certified Metric Views.
        sub:
          - name: Practice Group Leader
            cares: staffing, leverage and budget burn by matter phase before write-offs pile up.
          - name: Matter Pricing
            cares: alternative fee arrangements and whether a matter holds to its budget.
          - name: Knowledge Management
            cares: the firm playbook and standard clauses reused across the practice.
        ucs:
          - Matter Profitability
          - Contract Playbook Compliance
          - Legal Research Analytics
          - Time Entry Compliance
      - name: Litigation Support
        core: true
        mark: Lakehouse//RT
        summary: E-discovery managers on custodian completeness, processing queues and reviewer throughput against the court deadline that will not move.
        uses:
          - - Review Command Centre
            - Reviewer throughput and custodian completeness before court deadlines.
          - - Lakehouse//RT
            - Live review progress at case latency.
          - - AI/BI
            - Review cost and pace per matter on governed definitions.
        sub:
          - name: E-Discovery Manager
            cares: custodian completeness, processing queues and throughput against the deadline.
          - name: Review Team Lead
            cares: reviewer quality, privilege calls and the pace and cost per matter.
          - name: Litigation Paralegal
            cares: docket deadlines, production sets and certificates of service.
        ucs:
          - E-Discovery Review
          - Privilege Prediction
          - Docket Monitoring
      - name: Compliance
        mark: AI/BI
        summary: Conflicts, KYC and ethics on new-business intake and ongoing matter monitoring, clearing party hits before an engagement letter releases.
        uses:
          - - Conflicts Clearance
            - Party and relationship hits before engagement letters release.
          - - AI/BI
            - Sanctions and PEP screening on certified views.
          - - Unity Catalog
            - One definition of party and matter across DMS and billing.
        sub:
          - name: Conflicts Counsel
            cares: party and relationship hits cleared before an engagement letter releases.
          - name: Ethics & Risk
            cares: ethical walls, privilege logs and the firm's professional-responsibility record.
          - name: KYC & Intake
            cares: client screening against sanctions and PEP watchlists at new business.
        ucs:
          - Conflicts Screening
          - Records Retention
          - Privilege Prediction
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land the DMS, billing, docket and CLM feeds; own the Bronze to Silver path and the pager when a review or billing load breaks.
        uses:
          - - Lakeflow Connect
            - Managed connectors for iManage, Elite 3E and Relativity sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on billing and review feeds.
          - - Lakewatch
            - Freshness on the tables practice and finance leaders read every morning.
        sub:
          - name: Ingestion Engineering
            cares: the iManage, Elite 3E, Relativity and docket connectors and the Bronze-to-Silver path.
          - name: Pipeline Reliability
            cares: the pager when a review or billing load breaks before the morning read.
          - name: Data Quality
            cares: expectations on billing and review feeds so matter numbers reconcile.
        ucs:
          - E-Discovery Review
          - Matter Profitability
          - Docket Monitoring
      - name: Data Scientists
        mark: MLflow
        summary: Privilege-prediction, realization and clause-risk models, and whether they still hold six months after deployment.
        uses:
          - - Feature Store
            - Matter and document features defined once for training and serving.
          - - MLflow
            - Every review model run tracked for audit and reproduction.
          - - Model Serving
            - Privilege and clause models scored in the review path.
        sub:
          - name: ML Engineering
            cares: privilege, realization and clause-risk models from features to serving.
          - name: Model Governance
            cares: whether a model still holds six months on, tracked in MLflow for audit.
          - name: NLP & Documents
            cares: clause extraction and time-narrative scoring over legal text.
        ucs:
          - Privilege Prediction
          - Contract Playbook Compliance
          - Matter Profitability
      - name: App Developers
        mark: Apps
        summary: Ship the matter-profitability, review and conflicts applications the firm works in, hosted next to governed data.
        uses:
          - - Apps
            - Matter and review screens with no separate web tier to run or secure.
          - - Lakebase
            - Serverless Postgres for review assignments and pre-bill writes.
          - - Agent Bricks
            - Agents that draft a clause review or conflicts check against governed tools.
        sub:
          - name: Application Engineering
            cares: the matter-profitability, review and conflicts screens the firm works in.
          - name: Platform & Lakebase
            cares: serverless Postgres for review assignments and pre-bill writes.
          - name: Agent Engineering
            cares: agents that draft a clause review or conflicts check against governed tools.
        ucs:
          - Matter Profitability
          - E-Discovery Review
          - Conflicts Screening
consumers:
