        core: true
        icon: code
        short: 3rd-party harness
        summary: Anthropic's coding harness working against the platform through MCP, with spend, routing and policy governed by Unity Gateway.
      - name: OpenAI Codex
        core: true
        icon: code
        short: 3rd-party harness
        summary: OpenAI's coding harness connected over MCP, governed at runtime by Unity Gateway rather than trusted by configuration.
      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Matter Profitability Agent
        icon: genie
        summary: Ask about firm realization, leverage and matter margin, and corporate outside-counsel invoices, accruals and budgets, with role-scoped views.
        feeds:
          - Elite 3E
          - Aderant Expert
          - LEDES Billing
          - Realization, risk, compliance
        teams:
          - Managing Partner & GC
          - Practice Management
          - Firm CFO
        questions:
          - What is firm-wide realization this quarter versus last?
          - Which matters are running over budget by phase?
          - What is leverage and margin by practice group?
          - Where is WIP ageing beyond target across matters?
          - How does outside-counsel spend compare to budget by matter?
      - name: E-Discovery & Litigation Agent
        icon: genie
        summary: Explore review throughput, custodian completeness and docket deadlines across matters.
        feeds:
          - RelativityOne
          - Everlaw
          - PACER Court Records
          - Conformed matter, client
        teams:
          - Litigation Support
          - E-Discovery Manager
          - Litigation Paralegal
        questions:
          - What is reviewer throughput and cost per matter this week?
          - Which custodians are still incomplete against the collection plan?
          - Which matters have upcoming court deadlines from recent orders?
          - How much data remains to review against the deadline?
          - Which documents are flagged as likely privileged?
      - name: Contracts & Knowledge Agent
        icon: genie
        summary: Answer questions on clause risk, obligations and research usage across the practice.
        feeds:
          - Ironclad CLM
          - Thomson Reuters Westlaw
          - LexisNexis Guidance
          - Conformed matter, client
        teams:
          - Practice Management
          - Knowledge Management
          - Matter Pricing
        questions:
          - Which contracts contain non-standard clauses against the playbook?
          - Which obligations and renewals are due in the next 30 days?
          - Which precedent work is most reused across the practice?
          - Where does research spend not tie to a matter outcome?
          - Which clauses drive the most negotiation cycles?
      - name: Conflicts & Compliance Agent
        icon: genie
        summary: Ask about conflicts hits, sanctions screening and records retention at intake and beyond.
        feeds:
          - Intapp
          - Sanctions & PEP Lists
          - Microsoft Purview
          - Realization, risk, compliance
        teams:
          - Compliance
          - Conflicts Counsel
          - Ethics & Risk
        questions:
          - Which new-business intakes have unresolved conflicts hits?
          - Which parties match a sanctions or PEP watchlist?
          - Which documents are past their retention policy?
          - Which matters have active legal holds right now?
          - Where are ethical walls required but not yet set?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Matter Profitability
        short: Finance
        icon: market
        summary: Realization, leverage and matter margin tracked before year-end write-offs.
        problem: Realization and matter margin surface only at year-end, when write-offs are already booked, because WIP, billing and staffing live in separate systems no partner can reconcile in time.
        who_benefits: Managing Partner & GC
        how_built: Billing, WIP and timekeeper feeds land through Lakeflow and conform on Delta Lake, so the Matter Profitability Console shows budget-versus-actual by phase on certified Metric Views in AI/BI.
        components:
          - Matter Profitability Console
          - Elite 3E
          - Lakeflow
          - Delta Lake
          - AI/BI
        stories:
          - title: How CFOs in consulting can recover margin with Databricks
            url: https://www.databricks.com/blog/how-cfos-consulting-can-recover-margin-databricks
      - name: E-Discovery Review
        short: Litigation
        icon: gauge
        summary: Processing, prioritisation and reviewer throughput optimised against court deadlines.
        problem: Review runs against a court deadline that will not move, yet custodian completeness, processing queues and reviewer throughput sit in the e-discovery tool with no governed view of cost.
        who_benefits: Litigation Support
        how_built: Relativity load files and review metadata land through Lakeflow into Lakehouse//RT, so the Review Command Centre tracks reviewer throughput live against the court deadline.
        components:
          - Review Command Centre
          - RelativityOne
          - Lakeflow
          - Lakehouse//RT
          - AI/BI
        stories:
          - title: How Clifford Chance improves legal document review with data science
            url: https://www.databricks.com/blog/2020/03/31/data-science-with-azure-databricks-at-clifford-chance.html
      - name: Privilege Prediction
        short: Risk
        icon: gavel
        summary: Attorney-client and work-product calls assisted with reproducible model evidence.
        problem: Privilege review is manual and inconsistent across reviewers, so attorney-client and work-product calls vary by matter and a missed call risks waiver or an over-broad, costly withholding.
        who_benefits: Litigation Support
        how_built: Document and matter features are engineered in Feature Store and scored through Model Serving in the review path, with every run tracked in MLflow for defensible, reproducible evidence.
        components:
          - Review Command Centre
          - Model Serving
          - MLflow
          - Feature Store
          - RelativityOne
        stories:
          - title: How Clifford Chance improves legal document review with data science
            url: https://www.databricks.com/blog/2020/03/31/data-science-with-azure-databricks-at-clifford-chance.html
      - name: Contract Playbook Compliance
        short: Commercial
        icon: product
        summary: Clause deviations flagged at intake before negotiation cycles expand.
        problem: Non-standard clauses are caught late in negotiation, if at all, because contract terms sit in the CLM while the firm playbook lives in checklists no one opens at intake.
        who_benefits: Practice Management
        how_built: Ironclad contract text is parsed with AI Functions and scored against the playbook in the Contract Intelligence Hub, flagging clause deviations at intake before negotiation cycles expand.
        components:
          - Contract Intelligence Hub
          - Ironclad CLM
          - AI Functions
          - Unity Catalog
          - AI/BI
        stories:
          - title: Cracking complex contracts with GenAI on Databricks
            url: https://www.databricks.com/blog/cracking-complex-contracts-genai-azure-databricks
          - title: EY-Parthenon turns unstructured M&A data into strategy
            url: https://www.databricks.com/customers/ey-parthenon
          - title: JLL turns lease data into governed, queryable knowledge
            url: https://www.databricks.com/customers/jll/dealsumm
      - name: Conflicts Screening
        short: Ethics
        icon: people
        summary: New business intake screened against parties, matters and watchlists in one governed graph.
        problem: New business intake is screened against parties, matters and watchlists held in DMS, billing and CLM silos, so a conflict hit can slip through before an engagement letter releases.
        who_benefits: Compliance
        how_built: Party and matter data conform under Unity Catalog into one governed graph, and the Conflicts Clearance app surfaces relationship and watchlist hits before an engagement letter releases.
        components:
          - Conflicts Clearance
          - Sanctions & PEP Lists
          - Unity Catalog
          - Delta Lake
          - AI/BI
      - name: Outside Counsel Spend
        short: Corporate
        icon: chart
        summary: Panel firm invoices reconciled to matter budgets and LEDES guidelines.
        problem: In-house teams accrue panel-firm invoices against budgets they cannot see line by line, because LEDES files and matter budgets never meet in one place until the bill is already paid.
        who_benefits: Managing Partner & GC
        how_built: LEDES invoices are validated on ingest and reconciled to matter budgets on Delta Lake, so outside-counsel spend against guidelines shows in the Matter Profitability Console and AI/BI.
        components:
          - Matter Profitability Console
          - LEDES Billing
          - Delta Lake
          - Unity Catalog
          - AI/BI
      - name: Legal Research Analytics
        short: Knowledge
        icon: notebook
        summary: Precedent and research usage tied to matter outcomes and staffing decisions.
        problem: Research spend on Westlaw and Lexis is untethered from matter outcomes and staffing, so no one knows which precedent work actually moved a matter or justified the hours it cost.
        who_benefits: Practice Management
        how_built: Research usage telemetry conforms with matter and billing data under Unity Catalog and is explored in AI/BI and Genie, tying precedent work to outcomes and staffing decisions.
        components:
          - Thomson Reuters Westlaw
          - LexisNexis Guidance
          - Unity Catalog
          - AI/BI
          - Genie One
      - name: Docket Monitoring
        short: Litigation
        icon: api
        summary: Court filings and orders tracked across matters without manual PACER pulls.
        problem: Court filings and orders are tracked by manual PACER pulls per matter, so a deadline-setting order can land unseen for days across a large litigation portfolio.
        who_benefits: Litigation Support
        how_built: PACER docket events land through Lakeflow onto Delta Lake and stream into Lakehouse//RT, so new filings raise alerts across matters in the Review Command Centre without manual pulls.
        components:
          - Review Command Centre
          - PACER Court Records
          - Lakeflow
          - Lakehouse//RT
          - Delta Lake
      - name: Records Retention
        short: Compliance
        icon: db
        summary: Legal holds and disposition executed through authorized records systems from governed retention policies, with hold precedence.
        problem: Legal holds and disposition depend on retention rules scattered across the DMS and records tools, so holds are missed and documents kept long past policy, raising cost and discovery risk.
        who_benefits: Compliance
        how_built: Retention labels from Microsoft Purview conform under Unity Catalog, so approved holds and disposition execute in authorized records systems with legal-hold precedence over disposition and auditable lineage from rule to document; Unity Catalog governs analytical policy and evidence rather than universal DMS control.
        components:
          - Microsoft Purview
          - Unity Catalog
          - Delta Lake
          - iManage Work
          - AI/BI
        stories:
          - title: Building document intelligence pipelines with Lakeflow
            url: https://www.databricks.com/blog/building-databricks-document-intelligence-and-lakeflow
      - name: Time Entry Compliance
        short: Billing
        icon: erp
        summary: Narrative and UTBMS code quality scored before invoices reach clients.
        problem: Time narratives and UTBMS codes are corrected only after a client rejects the bill, so realization leaks to write-downs and pre-bill review eats partner hours late in the cycle.
        who_benefits: Practice Management
        how_built: Time entries are scored for narrative and UTBMS code quality with AI Functions on Delta Lake, flagging weak entries in the Matter Profitability Console before invoices reach clients.
        components:
          - Matter Profitability Console
          - Elite 3E
          - AI Functions
          - Delta Lake
          - AI/BI
medallion:
  Bronze:
    short: Raw matter and document feeds
    summary: DMS documents, billing entries, court docket events, contract repository versions and e-discovery load files, landed exactly as received so a privilege call or a time entry can always be replayed.
  Silver:
    short: Conformed matter, client
    summary: Clients, matters, documents and timekeepers resolved into single conformed entities across DMS, billing and CLM systems, with matter IDs reconciled and related-party conflicts stitched to one engagement.
  Gold:
    short: Realization, risk, compliance
    summary: 'Contracted products practice and finance leaders run on: realization rate and leverage, matter profitability, e-discovery review throughput, and outside counsel spend against budget.'
