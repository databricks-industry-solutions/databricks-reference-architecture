agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Authorisation & Volume Agent
        icon: genie
        summary: Ask about payment volume, take rate and authorisation performance by product in plain language.
        feeds:
          - Adyen Platform
          - Stripe Payments
          - Volume, loss, NIM
        teams:
          - Payments Leadership
          - Product & Payments
          - Chief Payments Officer
        questions:
          - What was net payment volume by product yesterday?
          - How has authorisation success rate moved this week by route?
          - Where is take rate strongest and weakest across products?
          - Which BINs or networks are driving the most declines?
          - How does volume growth compare to last quarter by segment?
      - name: Fraud & Chargebacks Agent
        icon: genie
        summary: Ask about fraud loss, chargebacks and alert queues across the book in plain language.
        feeds:
          - NICE Actimize
          - Adyen Platform
          - Conformed account, txn
        teams:
          - Risk & Fraud
          - Head of Fraud
          - Dispute & Chargeback
        questions:
          - Which merchants spiked chargebacks last week?
          - What is our fraud loss and false-positive rate today?
          - Where are device clusters or mule patterns concentrated right now?
          - How large is the AML alert backlog and what is ageing?
          - What is our representment win rate before scheme deadlines?
      - name: Merchant Growth Agent
        icon: genie
        summary: Ask about the onboarding funnel, merchant revenue and churn signals in plain language.
        feeds:
          - Salesforce Fintech CRM
          - Zendesk Merchant Care
          - Conformed account, txn
        teams:
          - Merchant Growth
          - Merchant Sales
          - Merchant Success
        questions:
          - Where do merchants drop off in the onboarding funnel?
          - Which merchants are quietly routing volume elsewhere?
          - What is revenue per merchant by segment this quarter?
          - Which merchants have rising support load and disputes?
          - What is time-to-first-transaction for new signups?
      - name: Settlement & Treasury Agent
        icon: genie
        summary: Ask about settlement floats, funding, and interchange revenue and cost in plain language.
        feeds:
          - SWIFT ISO 20022
          - Card Network Mart
          - Volume, loss, NIM
        teams:
          - Finance & Treasury
          - Group Treasurer
          - Head of Settlement
        questions:
          - What is our expected settlement float before the next window?
          - How much issuer interchange revenue did each program earn, and what acquirer scheme costs applied this month?
          - Where are scheme fees diverging from reconciliation?
          - What funding do we need before month-end close?
          - How has net interest margin moved with rates this quarter?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Real-Time Fraud
        short: Authorisation
        icon: gauge
        summary: Card-testing and mule patterns scored on authorisation and payout paths for fast action.
        problem: Card-testing and mule networks move funds inside the authorisation window, but rules engines score in isolation and by the time a batch flags the pattern the payout has already settled.
        who_benefits: Risk & Fraud
        how_built: Authorisation events land in Lakehouse//RT and device and velocity features are read from Lakebase. Model Serving scores authorisation and payout risk, the acquirer enforces declines and holds, and the Fraud Command Centre monitors patterns and initiates authorised action.
        components:
          - Fraud Command Centre
          - Adyen Platform
          - Lakehouse//RT
          - Model Serving
          - Feature Store
          - Lakebase
        stories:
          - title: Coinbase scales real-time fraud detection on Databricks
            url: https://www.databricks.com/customers/coinbase/lakeflow
          - title: Building real-time fraud detection with Spark Real-Time Mode and Lakebase
            url: https://www.databricks.com/blog/how-build-real-time-fraud-detection-using-spark-real-time-mode-and-lakebase
          - title: Coins.ph delivers ML-powered fraud detection in real time
            url: https://www.databricks.com/customers/coins-ph
      - name: Chargeback Prevention
        short: Disputes
        icon: gavel
        summary: Dispute-prone merchants and instruments surfaced before scheme deadlines.
        problem: Disputes surface weeks after the sale, so chargeback-prone merchants and instruments are only caught once scheme fees, fines and write-offs have already hit the acquiring book.
        who_benefits: Risk & Fraud
        how_built: Adyen dispute and settlement events are conformed on the platform and scored in Model Serving. At-risk merchants surface in the Fraud Command Centre for representment before scheme deadlines, and remediation feedback goes to merchants to prevent future disputes.
        components:
          - Fraud Command Centre
          - Adyen Platform
          - AI/BI
          - Model Serving
          - Unity Catalog
        stories:
          - title: Block prevents fraud and payment risk in real time
            url: https://www.databricks.com/customers/block/lakeflow-declarative-pipelines
      - name: Modernized Acquiring
        short: Acquiring
        icon: partner
        summary: A unified acquiring platform where authorization, settlement and dispute data land in one governed lakehouse.
        problem: Acquiring runs across processor silos with nightly files, so settlement, authorization and dispute data never reconcile in one place and launching new payment methods or geographies is slow.
        who_benefits: Payments Leadership
        how_built: Adyen and Stripe authorization, settlement and dispute events land through Lakeflow onto Delta Lake under Unity Catalog, conformed once and served to AI/BI and the Payments Console.
        components:
          - Payments Console
          - Adyen Platform
          - Stripe Payments
          - Lakeflow
          - Delta Lake
          - AI/BI
        stories:
          - title: Airwallex powers global banking with data and AI
            url: https://www.databricks.com/customers/airwallex/gcp
      - name: Credit Underwriting
        short: Lending
        icon: sheet
        summary: Cash-flow and behaviour models for BNPL and working-capital products.
        problem: BNPL and working-capital limits are set from thin bureau files and stale statements, so thin-file merchants are declined and cash-flow risk is only seen after the loan is drawn.
        who_benefits: Product & Payments
        how_built: Open Banking and transaction features are engineered in Feature Store and scored through Model Serving, with every underwriting run tracked in MLflow for audit and reproduction.
        components:
          - Merchant 360
          - Open Banking Feeds
          - Feature Store
          - Model Serving
          - MLflow
        stories:
          - title: Vivriti Capital scales real-time lending and underwriting
            url: https://www.databricks.com/customers/vivriti-capital
          - title: Maya's ML-powered lending disbursed $2.1B in loans
            url: https://www.databricks.com/customers/maya
      - name: Payment Routing
        short: Optimisation
        icon: market
        summary: Auth routes chosen for success rate and cost not static BIN tables.
        problem: Authorisation routes are chosen from static BIN tables, so declines and scheme costs pile up while nobody sees which acquirer or network path actually wins on a given transaction.
        who_benefits: Product & Payments
        how_built: Live auth outcomes stream into Lakehouse//RT, routing models score each attempt in Model Serving, and the Payments Console shows success and cost by route before a scheme change.
        components:
          - Payments Console
          - Visa / Mastercard BIN
          - Model Serving
          - Lakehouse//RT
          - AI/BI
      - name: AML Monitoring
        short: Compliance
        icon: gavel
        summary: Transaction monitoring tuned to reduce false positives while tracking detection coverage and SAR timeliness.
        problem: Legacy transaction-monitoring rules fire on thresholds, burying analysts under false positives while genuinely suspicious structuring slips through and SAR deadlines are missed.
        who_benefits: Risk & Fraud
        how_built: NICE Actimize alerts and AML Screening signals are enriched and scored in Model Serving, so the Fraud Command Centre ranks true risk on certified data under Unity Catalog lineage.
        components:
          - Fraud Command Centre
          - NICE Actimize
          - AML Screening
          - Model Serving
          - Unity Catalog
          - AI/BI
        stories:
          - title: Modern BSA/AML compliance on Databricks
            url: https://www.databricks.com/blog/modern-bsaaml-compliance-databricks
          - title: Coins.ph powers anti-money-laundering with Databricks
            url: https://www.databricks.com/customers/coins-ph
      - name: Merchant 360
        short: Merchant view
        icon: custlake
        summary: One governed view of every merchant across payments, support and risk, so retention and cross-sell are proactive.
        problem: A merchant's volume, support tickets, disputes and risk signals live in systems that never meet, so churn is seen only after volume walks and cross-sell is guesswork.
        who_benefits: Merchant Growth
        how_built: CRM, support and volume signals are unified in CustomerLake under Unity Catalog and scored for churn and cross-sell in Model Serving, surfacing the whole relationship in Merchant 360.
        components:
          - Merchant 360
          - Salesforce Fintech CRM
          - Zendesk Merchant Care
          - CustomerLake
          - Model Serving
        stories:
          - title: PicPay unifies data to lift engagement and cut cash-back waste
            url: https://www.databricks.com/customers/picpay
          - title: Grab builds a single consumer view with C360
            url: https://www.databricks.com/customers/grab
      - name: Interchange Optimisation
        short: Revenue
        icon: chart
        summary: Legitimate MCC corrections and rate qualification, issuer revenue separate from acquirer cost.
        problem: Interchange leaks through wrong MCC coding, missed rate qualifications and suboptimal routing, and the scheme mart is too slow and siloed to show where take rate is being lost.
        who_benefits: Finance & Treasury
        how_built: Settlement and scheme data from the Card Network Mart are modelled in AI/BI as governed Data Products, separating issuer interchange revenue from acquirer interchange and scheme cost and exposing legitimate MCC corrections and eligible rate qualification within scheme rules.
        components:
          - Treasury Workbench
          - Card Network Mart
          - AI/BI
          - Unity Catalog
          - Data Products
      - name: Transaction Enrichment
        short: Data
        icon: api
        summary: Raw card and account transactions enriched with clean merchant name, category and location for every downstream use.
        problem: Raw transaction descriptors are cryptic, so cardholders dispute charges they do not recognise, categorisation is inconsistent and every fraud, lending and insight use case rebuilds the same enrichment.
        who_benefits: Product & Payments
        how_built: Card-network BIN and acquirer transaction feeds conform on Delta Lake under Unity Catalog, and AI Functions resolve clean merchant name, category and location once for every downstream consumer.
        components:
          - Adyen Platform
          - Visa / Mastercard BIN
          - AI Functions
          - Delta Lake
          - Unity Catalog
      - name: Agentic Commerce
        short: AI commerce
        icon: market
        summary: AI agents that transact on a consumer's behalf, authenticated and authorized through governed payment rails.
        problem: Agent-initiated purchases break assumptions built for human checkout, so intent, authorization and spend controls for AI shopping agents have no governed place to run or be audited.
        who_benefits: Product & Payments
        how_built: Marqeta issuing and Stripe intents are orchestrated by agents built on Agent Bricks and scored for risk in Model Serving. Spend controls are enforced by consumer mandates and Marqeta card controls, while Unity Catalog governs and audits agent activity.
        components:
          - Stripe Payments
          - Marqeta Card Issuing
          - Agent Bricks
          - Model Serving
          - Databricks Apps
medallion:
  Bronze:
    short: Raw auth streams
    summary: Authorisation requests, settlement files, core postings, KYC decisions and merchant onboarding events, landed exactly as received so a transaction or an account opening can always be replayed as it stood.
  Silver:
    short: Conformed account, txn
    summary: Accounts, merchants, instruments and transactions resolved into single conformed entities across core, acquirer and fraud systems, with settlement batches reconciled and device fingerprints stitched to one identity graph.
  Gold:
    short: Volume, loss, NIM
    summary: 'Contracted products product and risk run on: payment volume and take rate, fraud loss and chargeback rate, and net interest margin by product.'
