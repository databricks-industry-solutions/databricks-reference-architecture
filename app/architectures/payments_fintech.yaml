name: Payments & Fintech
description: 'Card acquiring, digital wallets, lending and banking cores: authorisation streams, fraud, KYC and merchant lifecycle across regulated payment institutions.'
sources:
  - name: Core & Ledger
    icon: erp
    simplified: 3
    tiles:
      - name: Temenos Transact
        icon: erp
        summary: Deposits, loans, GL and end-of-day across retail and commercial banking.
        citations:
          - temenos
        category: Core Banking System
        what_it_is: Deposits, loans, general ledger and end-of-day processing across retail and commercial banking.
        who_uses_it: Core banking operations, finance and product.
        data_out:
          batch:
            types:
              - structured
            volume: 50-200 GB/day postings + EOD
            interval: Nightly batch + intraday CDC
      - name: Mambu Core Banking
        icon: db
        summary: Cloud-native accounts, products and interest accrual for digital banks.
        citations:
          - mambu
        category: Core Banking System
        what_it_is: Cloud-native accounts, product definitions and interest accrual for digital banks.
        who_uses_it: Digital banking product, core operations and finance.
        data_out:
          batch:
            types:
              - structured
            volume: 10-50 GB/day accounts + accruals
            interval: Continuous CDC (near real-time)
      - name: FIS Modern Banking
        icon: erp
        summary: Legacy core postings, statements and regulatory extracts.
        citations:
          - fis-core
        category: Core Banking System
        what_it_is: Legacy core postings, statements and regulatory extracts across the deposit and loan book.
        who_uses_it: Core banking operations, finance and regulatory reporting.
        data_out:
          batch:
            types:
              - structured
            volume: 50-200 GB/day postings + extracts
            interval: Nightly batch
  - name: Acquiring & Issuing
    icon: market
    simplified: 2
    tiles:
      - name: Adyen Platform
        icon: market
        summary: Unified acquiring authorisations, settlements and dispute events.
        citations:
          - adyen
        category: Payment Acquiring / PSP
        what_it_is: Unified acquiring platform carrying authorisation, settlement and dispute events across channels.
        who_uses_it: Payments product, fraud and settlement operations.
        data_out:
          batch:
            types:
              - structured
            volume: Settlement + dispute files
            interval: Multiple settlement cycles daily
          stream:
            types:
              - semi-structured
            volume: 5-50k auth events/sec at peak
            interval: Continuous (real-time)
      - name: Stripe Payments
        icon: partner
        summary: Merchant payment intents, connect payouts and radar fraud signals.
        citations:
          - stripe
        category: Payment Gateway / PSP
        what_it_is: Merchant payment intents, Connect payouts and Radar fraud signals across online payments.
        who_uses_it: Payments product, growth and fraud.
        data_out:
          batch:
            types:
              - structured
            volume: Payout + reconciliation files
            interval: Daily batch
          stream:
            types:
              - semi-structured
            volume: Payment + payout events
            interval: Continuous (webhooks)
      - name: Marqeta Card Issuing
        core: true
        icon: api
        summary: Card programmes, spend controls and tokenisation lifecycle.
        citations:
          - marqeta
        category: Card Issuing Processor
        what_it_is: Card programme management, spend controls and tokenisation lifecycle for issued cards.
        who_uses_it: Card product, issuing operations and fraud.
        data_out:
          batch:
            types:
              - structured
            volume: Programme + spend files
            interval: Daily batch
          stream:
            types:
              - semi-structured
            volume: Card auth + token events
            interval: Continuous (real-time)
  - name: Fraud & Compliance
    icon: gavel
    tiles:
      - name: NICE Actimize
        icon: gauge
        summary: AML alerts, SAR workflows and transaction monitoring rules.
        citations:
          - actimize
        category: Financial Crime / AML Platform
        what_it_is: AML alert generation, SAR workflows and transaction-monitoring rules across the book.
        who_uses_it: AML and financial crime, compliance and investigations.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: Alerts + case records
            interval: Intraday batch
          stream:
            types:
              - semi-structured
            volume: Alert events
            interval: Continuous (near real-time)
      - name: Onfido Identity
        core: true
        icon: people
        summary: Document verification and biometric checks at onboarding.
        citations:
          - onfido
        category: Identity Verification (KYC)
        what_it_is: Document verification and biometric identity checks performed at customer and merchant onboarding.
        who_uses_it: Onboarding, KYB and financial crime.
        data_out:
          stream:
            types:
              - semi-structured
              - unstructured
            volume: Verification results + documents
            interval: Continuous (API)
      - name: AML Screening
        icon: gavel
        summary: Sanctions, PEP and adverse media screening on parties and merchants.
        citations:
          - complyadvantage
        category: Sanctions & Screening Provider
        what_it_is: Sanctions, PEP and adverse-media screening on parties and merchants at onboarding and monitoring.
        who_uses_it: Financial crime, compliance and onboarding.
        data_out:
          batch:
            types:
              - structured
            volume: Watchlist deltas
            interval: Daily refresh
          stream:
            types:
              - semi-structured
            volume: Screening API responses
            interval: Continuous (API)
  - name: Merchant & CRM
    icon: custlake
    simplified: 3
    tiles:
      - name: Salesforce Fintech CRM
        icon: custlake
        summary: Merchant sales pipeline, onboarding cases and support history.
        citations:
          - sf-fintech
        category: CRM Platform
        what_it_is: Merchant sales pipeline, onboarding cases and support history across the commercial relationship.
        who_uses_it: Merchant sales, merchant success and onboarding.
        data_out:
          batch:
            types:
              - structured
            volume: 5-20 GB/day accounts + cases
            interval: Nightly CDC
          stream:
            types:
              - semi-structured
            volume: Activity + case events
            interval: Continuous (API/events)
      - name: Zendesk Merchant Care
        icon: chat
        summary: Tickets, chat transcripts and refund disputes tied to merchant accounts.
        citations:
          - zendesk
        category: Customer Support Platform
        what_it_is: Support tickets, chat transcripts and refund disputes tied to merchant accounts.
        who_uses_it: Merchant success, support and dispute teams.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: Tickets + transcripts
            interval: Nightly batch
          stream:
            types:
              - semi-structured
            volume: Ticket events
            interval: Continuous (webhooks)
      - name: Braze Lifecycle
        icon: partner
        summary: Activation and retention campaigns with delivery and conversion events.
        citations:
          - braze
        category: Customer Engagement Platform
        what_it_is: Activation and retention campaigns with delivery, open and conversion events across channels.
        who_uses_it: Growth marketing and merchant success.
        data_out:
          stream:
            types:
              - semi-structured
            volume: Campaign + engagement events
            interval: Continuous (events)
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Card Network Mart
        icon: fed
        summary: Scheme reporting and interchange marts queried in place under Unity Catalog.
        category: Scheme / Interchange Data Mart
        what_it_is: Scheme reporting and interchange marts kept in the incumbent warehouse and queried in place, giving one view of interchange and settlement.
        who_uses_it: Settlement operations, finance and the payments business.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale interchange + settlement history
            interval: Queried on demand (federated)
  - name: Data Formats
    icon: zbraces
    simplified: 4
    tiles:
      - name: 'ISO 20022'
        icon: zbraces
        fmt: '20022'
        summary: 'Rich financial messaging standard now the global rail for modern payments.'
        spec_url: https://www.iso20022.org/
        spark_connector: 'spark-xml'
        spark_repo: https://github.com/databricks/spark-xml
        databricks_resource: https://docs.databricks.com/aws/en/query/formats/xml
        source_systems:
          - 'SWIFT'
          - 'Volante'
          - 'Form3'
      - name: 'ISO 8583'
        core: true
        icon: zbraces
        fmt: '8583'
        summary: 'Card transaction message standard behind ATM and POS authorisation flows.'
        spec_url: https://www.iso.org/standard/31628.html
      - name: 'Nacha ACH'
        icon: zbraces
        fmt: 'ACH'
        summary: 'US automated clearing house file format for batch electronic transfers.'
        spec_url: https://achdevguide.nacha.org/ach-file-details
      - name: 'nexo Acquirer'
        icon: zbraces
        fmt: 'nexo'
        summary: 'nexo standards for interoperable card acceptance between terminals and acquirers.'
        spec_url: https://www.nexo-standards.org/
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    simplified: 2
    tiles:
      - name: Visa / Mastercard BIN
        icon: partner
        summary: Issuer and product metadata consumed inbound for routing and fraud.
        citations:
          - visa-developer
        category: Card Network Reference Data
        what_it_is: Issuer identification and product metadata consumed inbound for routing decisions and fraud enrichment.
        who_uses_it: Payments product, routing engineering and fraud.
        data_out:
          batch:
            types:
              - structured
            volume: BIN + product reference
            interval: Daily/weekly updates
      - name: SWIFT ISO 20022
        icon: api
        summary: Cross-border payment messages parsed into structured settlement events.
        citations:
          - swift-iso
        category: Payment Messaging Standard
        what_it_is: Cross-border payment messages parsed on arrival into structured settlement events.
        who_uses_it: Settlement operations, treasury and data engineering.
        data_out:
          batch:
            types:
              - structured
            volume: Settlement message batches
            interval: Multiple settlement cycles daily
          stream:
            types:
              - semi-structured
            volume: Payment messages
            interval: Continuous (message queue)
      - name: Open Banking Feeds
        icon: stream
        summary: Account aggregation and consent-based transaction imports for lending.
        citations:
          - open-banking
        category: Open Banking Aggregation API
        what_it_is: Consent-based account aggregation and transaction imports used for lending and affordability.
        who_uses_it: Lending product, credit data science and data engineering.
        data_out:
          stream:
            types:
              - semi-structured
            volume: Account + transaction events
            interval: Continuous (consent-based)
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Payments Leadership
        mark: Genie One
        summary: The CEO on payment volume growth and take rate; the CFO on fraud loss and funding cost when interest rates and scheme fees move against the book.
        uses:
          - - Genie One
            - Ask what yesterday's net payment volume was by product without waiting on finance.
          - - AI/BI
            - Volume, loss and margin on one certified set of Metric Views.
          - - Unity Catalog
            - Certification so "volume" means one thing across core and acquirer.
        sub:
          - name: CEO
            cares: payment volume growth, take rate and the bet across acquiring, issuing and banking.
          - name: CFO
            cares: fraud loss, funding cost and net interest margin when rates and scheme fees move.
          - name: Chief Payments Officer
            cares: authorisation performance, scheme relationships and the cost of every basis point of decline.
        ucs:
          - Real-Time Fraud
          - Interchange Optimisation
          - Modernized Acquiring
          - Payment Routing
      - name: Product & Payments
        mark: Model Serving
        summary: Product managers on authorisation rates, routing cost and feature adoption, tracking take rate and activation across the payment products they own.
        uses:
          - - Payments Console
            - Auth success and latency by route before a scheme change.
          - - Model Serving
            - Routing and fraud models scored in the auth path.
          - - AI/BI
            - Take rate and activation on governed definitions.
        sub:
          - name: Head of Payments Product
            cares: authorisation success, routing cost and the roadmap for each payment product.
          - name: Lending Product
            cares: BNPL and working-capital limits, approval rates and portfolio risk.
          - name: Growth PM
            cares: activation, feature adoption and take rate across the products they own.
        ucs:
          - Payment Routing
          - Credit Underwriting
          - Transaction Enrichment
          - Agentic Commerce
      - name: Risk & Fraud
        core: true
        mark: AI/BI
        summary: Fraud analysts on velocity rules, chargeback rate and AML alert queues, balancing fraud loss against the false-positive decline rate on good volume.
        uses:
          - - Fraud Command Centre
            - Device clusters and mule patterns before payouts release.
          - - AI/BI
            - Loss and false-positive rates on certified Metric Views.
          - - Unity Catalog
            - One transaction definition across acquirer and core.
        sub:
          - name: Head of Fraud
            cares: velocity rules, fraud loss and the false-positive decline rate on good volume.
          - name: AML / Financial Crime
            cares: transaction monitoring, sanctions screening and the SAR filing backlog.
          - name: Dispute & Chargeback
            cares: representment win rate and chargeback exposure before scheme deadlines.
        ucs:
          - Real-Time Fraud
          - AML Monitoring
          - Chargeback Prevention
          - Merchant 360
      - name: Merchant Growth
        mark: CustomerLake
        summary: Sales and success on the onboarding funnel, merchant churn and support load, tracking activation and revenue per merchant account.
        uses:
          - - Merchant 360
            - Onboarding status and revenue in one view.
          - - CustomerLake
            - Merchant segments without copying CRM elsewhere.
          - - Genie One
            - Ask which merchants spiked chargebacks last week.
        sub:
          - name: Merchant Sales
            cares: the onboarding funnel, activation and revenue per merchant account.
          - name: Merchant Success
            cares: retention, support load and the merchants quietly routing volume elsewhere.
          - name: Onboarding & KYB
            cares: time-to-first-transaction and keeping bad actors out at signup.
        ucs:
          - Modernized Acquiring
          - Merchant 360
          - Chargeback Prevention
      - name: Finance & Treasury
        mark: AI/BI
        summary: Treasury on settlement floats, liquidity and scheme fee reconciliation, watching net interest margin and interchange revenue by product.
        uses:
          - - Treasury Workbench
            - Float and funding scenarios before month-end close.
          - - AI/BI
            - NIM and interchange on certified Metric Views.
          - - Unity Catalog
            - One settlement definition across processors.
        sub:
          - name: Group Treasurer
            cares: settlement floats, liquidity buffers and funding cost before settlement windows.
          - name: Head of Settlement
            cares: scheme fee reconciliation and interchange revenue by product.
          - name: FP&A
            cares: net interest margin, take rate and the numbers behind the forward book.
        ucs:
          - Modernized Acquiring
          - Interchange Optimisation
          - Credit Underwriting
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land the core, acquirer, fraud and KYC feeds; own the Bronze to Silver path and the pager when an authorisation or settlement pipeline breaks.
        uses:
          - - Lakeflow Connect
            - Managed connectors for core banking, acquirer and CRM sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on auth and settlement feeds.
          - - Lakewatch
            - Freshness on the volume and loss tables risk reads every morning.
        sub:
          - name: Core & Ledger Eng
            cares: the core banking, GL and settlement feeds and the pager when a posting pipeline breaks.
          - name: Streaming Eng
            cares: authorisation and acquirer event streams landed at the latency fraud reads at.
          - name: Compliance Data Eng
            cares: KYC, sanctions and monitoring feeds under audit-grade lineage.
        ucs:
          - Real-Time Fraud
          - AML Monitoring
          - Payment Routing
      - name: Data Scientists
        mark: MLflow
        summary: Real-time fraud, credit-underwriting, routing and merchant-churn models, and whether they still hold six months after deployment in the auth path.
        uses:
          - - Feature Store
            - Transaction and device features read identically in training and serving.
          - - MLflow
            - Every fraud and credit run tracked for audit and reproduction.
          - - Model Serving
            - Fraud and routing models scored inside the authorisation path.
        sub:
          - name: Fraud & Risk DS
            cares: real-time fraud and velocity models and whether they hold in the auth path.
          - name: Credit DS
            cares: cash-flow underwriting and affordability models for lending products.
          - name: Merchant DS
            cares: churn, routing and interchange models scored into the commercial workflow.
        ucs:
          - Real-Time Fraud
          - Credit Underwriting
          - Merchant 360
          - Transaction Enrichment
      - name: App Developers
        mark: Apps
        summary: Ship the payments console, fraud command and merchant applications product and risk teams work in, hosted next to governed transaction data.
        uses:
          - - Apps
            - Operational screens with no separate web tier to run or secure.
          - - Lakebase
            - Serverless Postgres for case state and governed writes.
          - - Agent Bricks
            - Agents that draft a dispute response against governed tools.
        sub:
          - name: Payments App Eng
            cares: the Payments Console and auth-health screens over governed transaction data.
          - name: Fraud App Eng
            cares: the Fraud Command Centre case and blocklist workflows on Lakebase.
          - name: Merchant App Eng
            cares: Merchant 360 onboarding and revenue screens next to governed data.
        ucs:
          - Real-Time Fraud
          - Chargeback Prevention
          - Agentic Commerce
