name: Airlines
description: 'For an airline: reservations and revenue management, network and crew planning, airport turnaround and line maintenance across the passenger operation.'
sources:
  - name: Reservations & Revenue
    icon: erp
    tiles:
      - name: Amadeus Altéa PSS
        icon: erp
        summary: Reservation, Inventory and Departure Control. The system of record for PNRs, seat inventory, fare classes and check-in, and the source of the passenger journey.
        citations:
          - amadeus-altea
        category: Passenger Service System (PSS)
        what_it_is: Holds the system of record for reservations, seat inventory and fare classes and runs departure control at check-in, emitting PNR, ticketing and boarding events across the passenger journey.
        who_uses_it: Reservations and revenue management, airport check-in and ground staff, and commercial analytics teams.
        data_out:
          batch:
            types:
              - structured
            volume: 50-150 GB/day
            interval: Multiple daily cycles + nightly extract
          stream:
            types:
              - semi-structured
            volume: 1-5k events/sec at peak
            interval: Continuous (near real-time)
      - name: Sabre / Travelport GDS
        core: true
        icon: globe
        summary: Global distribution systems carrying agency and OTA bookings, ticket coupons and schedule feeds into the airline estate.
        citations:
          - sabre-gds
        category: Global Distribution System (GDS)
        what_it_is: Carries agency and OTA bookings, ticket coupons, MCOs and schedule feeds between travel sellers and the airline, the indirect-channel counterpart to the PSS.
        who_uses_it: Distribution and sales teams, revenue management, and the finance teams reconciling agency sales.
        data_out:
          batch:
            types:
              - structured
            volume: 5-20 GB/day booking + coupon files
            interval: Multiple daily cycles
          stream:
            types:
              - semi-structured
            volume: hundreds of messages/sec
            interval: Continuous message flow
      - name: PROS Revenue Management
        core: true
        icon: market
        summary: Origin and destination forecasting, bid price and availability control. Supplies the demand forecasts and fare class recommendations the commercial team prices against.
        citations:
          - pros-rm
        category: Airline Revenue Management System
        what_it_is: Forecasts origin-and-destination demand and sets bid prices and fare-class availability, producing the recommendations the commercial team prices and merchandises against.
        who_uses_it: Revenue management analysts, pricing and fares teams, and commercial planning.
        data_out:
          batch:
            types:
              - structured
            volume: 10-40 GB/day forecasts + bid prices
            interval: Multiple daily optimisation runs
      - name: ATPCO Fare Filings
        icon: market
        summary: Industry fare, rule and surcharge filings, the reference against which published pricing and NDC offers are validated.
        citations:
          - atpco
        category: Airline Fare Filing / Pricing Data
        what_it_is: Distributes industry fare, rule, footnote and surcharge filings, the reference dataset against which published pricing and NDC offers are constructed and validated.
        who_uses_it: Pricing and fares teams, revenue management, and offer-management engineering.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day filings
            interval: Multiple daily filing cycles
  - name: Network & Crew
    icon: sheet
    tiles:
      - name: NetLine/Sched
        icon: sheet
        summary: 'Lufthansa Systems schedule and network planning: rotations, slot compliance and fleet assignment across the season.'
        citations:
          - netline
        category: Airline Schedule & Network Planning
        what_it_is: Builds and maintains the published schedule, aircraft rotations, slot compliance and fleet assignment across the season, the source of planned flying.
        who_uses_it: Network planning, fleet assignment and slot coordination teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day schedule + rotation data
            interval: Nightly batch + planning-cycle refresh
      - name: AIMS Crew Management
        core: true
        icon: people
        summary: Crew pairing, rostering, qualifications and flight time limitation tracking, the source of legality and standby state.
        citations:
          - aims
        category: Crew Management System
        what_it_is: Manages crew pairings, rosters, qualifications and flight-time-limitation tracking, the authoritative source of crew legality, standby and duty state.
        who_uses_it: Crew planning and rostering, crew control, and operations control on a disrupted day.
        data_out:
          batch:
            types:
              - structured
            volume: 2-8 GB/day rosters + pairings
            interval: Nightly batch + intraday updates
          stream:
            types:
              - semi-structured
            volume: tens of events/sec
            interval: Continuous roster-change events
      - name: Jeppesen Crew & Ops
        icon: people
        summary: Crew planning and operations optimisation used where AIMS is not the incumbent, feeding the same pairing and roster entities.
        citations:
          - jeppesen
        category: Crew Planning & Ops Optimisation
        what_it_is: Optimises crew pairings, rosters and operational recovery where it is the incumbent, feeding the same crew legality, pairing and roster entities as AIMS.
        who_uses_it: Crew planning, crew control and operations control teams.
        data_out:
          batch:
            types:
              - structured
            volume: 2-8 GB/day rosters + pairings
            interval: Nightly batch + intraday updates
  - name: Airport & Operations
    icon: stream
    tiles:
      - name: Airport Operational Database
        icon: db
        summary: 'The AODB: stand and gate allocation, actual movement times and turnaround milestones, shared with the airport under A-CDM.'
        citations:
          - aodb
        category: Airport Operational Database (AODB)
        what_it_is: The airport's operational record of stand and gate allocation, actual movement times and turnaround milestones, shared with the airline under A-CDM.
        who_uses_it: Operations control, ground and ramp teams, and turnaround management.
        data_out:
          batch:
            types:
              - structured
            volume: 5-20 GB/day movement + stand history
            interval: Hourly extracts + nightly batch
          stream:
            types:
              - semi-structured
            volume: hundreds of milestone events/sec
            interval: Continuous (near real-time)
      - name: ACARS / OOOI Messages
        core: true
        icon: stream
        summary: Out, Off, On and In movement messages from the aircraft, the ground truth for block and air times and for delay attribution.
        citations:
          - acars
        category: Aircraft Datalink Messaging (ACARS)
        what_it_is: Datalink Out, Off, On and In movement messages sent from the aircraft, the ground truth for block and air times and the anchor for delay attribution.
        who_uses_it: Operations control, on-time-performance analytics, and engineering condition monitoring.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 1-5k messages/sec at peak
            interval: Continuous (sub-second)
      - name: ADS-B Surveillance
        icon: iot
        summary: Broadcast position, altitude and velocity from every airframe, used for airspace and taxi analysis independent of the airline's own reporting.
        citations:
          - adsb
        category: Flight Surveillance Data (ADS-B)
        what_it_is: Broadcast position, altitude and velocity telemetry from every airframe, used for airspace, taxi and turnaround analysis independent of the airline's own reporting.
        who_uses_it: Operations analytics, flight operations engineering, and network performance teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 10-30k position reports/sec
            interval: Continuous (sub-second)
      - name: SITA WorldTracer
        icon: partner
        summary: 'Industry baggage tracing: mishandling reports, file matching and delivery status across carriers.'
        citations:
          - worldtracer
        category: Baggage Tracing System
        what_it_is: Industry baggage tracing platform holding mishandling reports, file matching and delivery status across carriers, the source for mishandled-bag analysis.
        who_uses_it: Baggage services, customer operations, and ground handling teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-3 GB/day tracing files
            interval: Hourly + on-demand
          stream:
            types:
              - semi-structured
            volume: tens of events/sec
            interval: Continuous status events
  - name: Engineering & Cargo
    icon: zplug
    tiles:
      - name: Swiss-AS AMOS
        icon: erp
        summary: 'Maintenance, repair and overhaul: work orders, component lifing, defect history and AOG events against each tail.'
        citations:
          - amos
        category: Aircraft MRO / M&E System
        what_it_is: Maintenance, repair and overhaul system of record holding work orders, component lifing, defect history and AOG events against each tail.
        who_uses_it: Maintenance planning, reliability engineering, and line and base maintenance teams.
        data_out:
          batch:
            types:
              - structured
            volume: 5-20 GB/day work orders + lifing
            interval: Nightly batch + intraday updates
      - name: Aircraft Sensor & QAR
        icon: iot
        summary: Quick access recorder and engine condition monitoring data, the basis for fuel burn analysis and predictive component removal.
        category: Flight Data / Condition Monitoring
        what_it_is: Quick access recorder and engine condition-monitoring telemetry offloaded from the aircraft, the basis for fuel-burn analysis and predictive component removal.
        who_uses_it: Reliability engineering, flight data monitoring, and fuel-efficiency teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 20-80 GB/day per fleet
            interval: Per-flight offload + nightly batch
          stream:
            types:
              - semi-structured
            volume: 1-10k parameters/sec in flight
            interval: Continuous during flight
      - name: CHAMP Cargospot
        core: true
        icon: product
        summary: 'Air cargo management: air waybills, ULD build-up, capacity and revenue for the freight side of the operation.'
        citations:
          - cargospot
        category: Air Cargo Management System
        what_it_is: Air cargo management system holding air waybills, ULD build-up, capacity allocation and revenue for the freight side of the operation.
        who_uses_it: Cargo operations, cargo revenue management, and capacity planning teams.
        data_out:
          batch:
            types:
              - structured
            volume: 2-8 GB/day waybills + capacity
            interval: Multiple daily cycles
          stream:
            types:
              - semi-structured
            volume: tens of events/sec
            interval: Continuous shipment events
  - name: Commercial & Loyalty
    icon: partner
    tiles:
      - name: IATA BSP Settlement
        icon: market
        summary: 'Billing and Settlement Plan files: agency sales, refunds and commissions, reconciled against revenue accounting.'
        citations:
          - iata-bsp
        category: Airline Sales Settlement (BSP)
        what_it_is: IATA Billing and Settlement Plan files covering agency sales, refunds and commissions, reconciled against the airline's revenue accounting.
        who_uses_it: Revenue accounting, sales finance, and distribution reconciliation teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB per settlement cycle
            interval: Scheduled BSP settlement cycles
      - name: Loyalty & FFP
        core: true
        icon: custlake
        summary: Frequent flyer accruals, redemptions, tier status and partner earn, the profile every personalised offer is scored against.
        category: Frequent Flyer / Loyalty Platform
        what_it_is: Frequent-flyer platform holding accruals, redemptions, tier status and partner earn, the customer profile every personalised offer is scored against.
        who_uses_it: Loyalty and ancillary teams, marketing, and customer analytics.
        data_out:
          batch:
            types:
              - structured
            volume: 2-8 GB/day accruals + redemptions
            interval: Nightly batch + intraday sync
          stream:
            types:
              - semi-structured
            volume: tens of events/sec
            interval: Continuous earn/burn events
      - name: Web & App Clickstream
        icon: observ
        summary: Search, shop and book events from the airline's own channels, joined to bookings for look-to-book and abandonment analysis.
        category: Digital Channel Clickstream
        what_it_is: Search, shop and book events from the airline's own web and mobile channels, joined to bookings for look-to-book, conversion and abandonment analysis.
        who_uses_it: Digital, ecommerce and marketing analytics, and revenue management.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 5-20k events/sec at peak
            interval: Continuous clickstream
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Revenue Accounting
        icon: fed
        summary: Revenue accounting and proration marts left where they are and queried in place under Unity Catalog, which avoids a second copy of the audited numbers.
        category: Airline Revenue Accounting
        what_it_is: Passenger revenue accounting and proration marts holding the audited flown-revenue numbers, kept in the incumbent warehouse and queried in place through federation rather than copied.
        who_uses_it: Revenue accounting, commercial finance, and financial reporting analysts.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale historical marts
            interval: Queried on demand (federated)
  - name: Data Formats
    icon: zbraces
    tiles:
      - name: 'PNR'
        icon: zbraces
        fmt: 'PNR'
        summary: 'Passenger Name Record, the reservation system-of-record for itineraries, fares and passenger data.'
        spec_url: https://www.iata.org/en/programs/passenger/
      - name: 'IATA NDC'
        icon: zbraces
        fmt: 'NDC'
        summary: 'New Distribution Capability XML for rich, retail-style airline offers and orders across channels.'
        spec_url: https://www.iata.org/en/programs/airline-distribution/retailing/ndc/
      - name: 'AIDX'
        icon: zbraces
        fmt: 'AIDX'
        summary: 'IATA Aviation Information Data Exchange for real-time flight status and movement messaging.'
        spec_url: https://www.iata.org/en/publications/info-data-exchange/
      - name: 'SSIM'
        core: true
        icon: zbraces
        fmt: 'SSIM'
        summary: 'IATA Standard Schedules Information Manual format for exchanging flight schedules.'
        spec_url: https://www.iata.org/en/publications/manuals/standard-schedules-information
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    tiles:
      - name: SITA Type-B Messaging
        icon: stream
        summary: 'The teletype-era message bus the industry still runs on: PNL, ADL, MVT and LDM messages parsed on arrival and landed as structured events.'
        citations:
          - sita-typeb
        category: Industry Type-B Messaging
        what_it_is: The teletype-era industry message bus still in daily use, carrying PNL, ADL, MVT and LDM messages that are parsed on arrival and landed as structured events.
        who_uses_it: Operations control, load control, and airport and passenger handling teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 500-2k messages/sec at peak
            interval: Continuous message flow
      - name: A-CDM Message Bus
        icon: stream
        summary: Airport Collaborative Decision Making milestones exchanged with the airport operator, the shared clock for turnaround performance.
        citations:
          - acdm
        category: Airport Collaborative Decision Making Bus
        what_it_is: Airport Collaborative Decision Making milestone messages exchanged with the airport operator, the shared clock that both sides measure turnaround performance against.
        who_uses_it: Operations control, turnaround management, and ground handling teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds of milestone events/sec
            interval: Continuous (near real-time)
      - name: IATA NDC / ONE Order APIs
        icon: api
        summary: Offer and order APIs replacing the filed-fare and coupon model, consumed inbound for partner shopping traffic.
        citations:
          - ndc
        category: Airline Retailing APIs (NDC / ONE Order)
        what_it_is: Offer and order APIs replacing the filed-fare and coupon model, consumed inbound for partner shopping and booking traffic across agencies, OTAs and metasearch.
        who_uses_it: Offer-management engineering, distribution, and revenue management teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds-thousands of API calls/sec
            interval: Continuous (API)
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Executive Team
        mark: Genie One
        summary: The CEO on network profitability, fleet commitments and the trade between growth and margin; the CFO and treasury on unit cost, cash and fuel and FX exposure; the Chief Operating Officer on on-time performance, disruption cost and the safety record.
        uses:
          - - Genie One
            - Ask what yesterday's operation cost, or what a route made last month, without booking analyst time.
          - - AI/BI
            - Network profitability, unit cost, load factor and on-time performance on one certified set of Metric Views.
          - - Unity Catalog
            - Certification and the business glossary, so "on time" and "unit cost" mean one thing across the airline.
        sub:
          - - CEO
            - network profitability, fleet commitments and the trade between growth and margin.
          - - CFO & Treasury
            - unit cost, cash, and fuel and FX exposure across the forward book.
          - - Chief Operating Officer
            - on-time performance, disruption cost and the safety and compliance record.
        ucs:
          - Network & Fleet Planning
          - IROPS Recovery
          - Continuous Pricing & NDC
          - Unified Ops Control
      - name: Revenue & Pricing
        mark: Model Serving
        summary: Revenue management analysts setting bid prices and fare class availability, pricing teams filing fares against ATPCO rules and the NDC offer catalogue, and the loyalty and ancillary team merchandising seats, bags and partner earn.
        uses:
          - - RM Analyst Workbench
            - The forecast, override history and revenue at risk on a flight before a bid price is touched.
          - - Continuous Pricing & NDC
            - Offers priced per shopping request rather than against a filed fare ladder.
          - - Ancillary Merchandising
            - Seats, bags and lounge access merchandised per passenger against the loyalty profile.
          - - Model Serving
            - Demand and willingness-to-pay models scored inside the offer path.
        sub:
          - - Revenue management analysts
            - bid prices and fare-class availability, flight by flight.
          - - Pricing & fares
            - filing and matching fares against ATPCO rules and the NDC catalogue.
          - - Loyalty & ancillary
            - tier economics, partner earn and the merchandising of seats, bags and lounge access.
        ucs:
          - Continuous Pricing & NDC
          - Ancillary Merchandising
          - Loyalty & FFP
          - Passenger 360
      - name: Network Planning
        mark: AI/BI
        summary: Which routes are flown, at what frequency and with which aircraft, season by season, against slots and maintenance windows.
        uses:
          - - Network & Fleet Planning
            - Route and fleet scenarios scored on profitability rather than load factor alone.
          - - AI/BI
            - Route profitability, RASK and CASK on the same definitions the executive team reads.
        sub:
          - - Network planners
            - which routes are flown and at what frequency, season by season.
          - - Fleet assignment
            - which aircraft flies which rotation against slots and maintenance.
        ucs:
          - Network & Fleet Planning
      - name: Operations Control
        core: true
        mark: Lakehouse//RT
        summary: Duty managers in the operations control centre on a disrupted day; ground and ramp teams on turnaround and baggage milestones; customer operations on IROPS rebooking and compensation.
        uses:
          - - OCC Recovery Cockpit
            - Recovery options costed across aircraft, crew and passengers together.
          - - Turnaround Manager
            - Stand-side milestones flagged before target off-block is missed.
          - - IROPS Recovery
            - Passenger reaccommodation options costed before agents start dialling.
          - - Lakehouse//RT
            - Live operational state at the latency a turnaround moves at.
        sub:
          - - Duty managers
            - the disrupted day from the operations control centre.
          - - Ground & ramp
            - turnaround and baggage milestones at the stand.
          - - Customer operations
            - IROPS reaccommodation and compensation.
        ucs:
          - IROPS Recovery
          - Turnaround & OTP
          - Crew Pairing & Rostering
          - Unified Ops Control
      - name: Engineering & MRO
        mark: Lakeflow
        summary: Engineering and maintenance planning on predicted removals, tail health and AMOS work orders raised against the aircraft the airline already flies.
        uses:
          - - AMOS Work Orders
            - Predicted component removals raised as maintenance work orders against the tail.
          - - Lakeflow
            - Aircraft, component and flight-hour feeds conformed for engineering analytics.
          - - MLflow
            - Remaining-useful-life models tracked for audit and reproduction.
        sub:
          - - Maintenance planning
            - predicted removals and base-visit scheduling.
          - - Reliability engineering
            - component lifing and AOG root-cause analysis.
        ucs:
          - Predictive Maintenance
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land the PSS, movement, crew, cargo and engineering feeds; own the Bronze to Silver path and the pager when a pipeline breaks.
        uses:
          - - Lakeflow Connect
            - Managed connectors for the PSS, ERP and SaaS sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on movement and booking feeds.
          - - Lakewatch
            - Freshness on the tables the OCC and revenue teams read every morning.
        sub:
          - - Ingestion engineers
            - PSS, movement, crew and cargo feeds into Bronze.
          - - Streaming engineers
            - A-CDM and ACARS events into Lakehouse//RT.
          - - Platform & governance
            - Unity Catalog permissions and the pipeline SLAs.
        ucs:
          - IROPS Recovery
          - Turnaround & OTP
          - Predictive Maintenance
      - name: Data Scientists
        mark: MLflow
        summary: Demand, willingness-to-pay, disruption recovery and remaining-useful-life models, and whether they still hold six months after deployment.
        uses:
          - - Feature Store
            - Features defined once from tables, streams or request-time data, and read identically in training and serving.
          - - MLflow
            - Every run tracked for audit and reproduction.
          - - Model Serving
            - Bid price, recovery and maintenance models scored in the operational path.
        sub:
          - - Demand & pricing modelers
            - willingness-to-pay and bid-price models.
          - - Reliability modelers
            - remaining-useful-life on QAR and defect history.
          - - MLOps
            - tracking and serving models in the operational path.
        ucs:
          - Continuous Pricing & NDC
          - Predictive Maintenance
          - IROPS Recovery
      - name: App Developers
        mark: Apps
        summary: Ship the OCC, turnaround, crew and engineering applications the airline works in, hosted next to governed data.
        uses:
          - - Apps
            - Operational screens with no separate web tier to run or secure.
          - - Lakebase
            - Serverless Postgres for recovery decisions and roster writes.
          - - Agent Bricks
            - Agents that draft a recovery plan or work order against governed tools.
        sub:
          - - Operational app developers
            - OCC, turnaround and crew screens.
          - - Backend & Lakebase
            - recovery and roster state with governed writes.
          - - Agent developers
            - recovery-plan and work-order drafting agents.
        ucs:
          - IROPS Recovery
          - Turnaround & OTP
consumers:
  - name: BI & Productivity
    icon: chart
    from: bi
    simplified: 2
    tiles:
      - name: Tableau / Qlik / ThoughtSpot
        icon: chart
        summary: External BI against SQL warehouses, with Unity Catalog permissions enforced end to end.
      - name: Microsoft Teams
        icon: chat
        summary: Genie in Teams for Unity Catalog-governed answers from the lakehouse, and IROPS and turnaround updates in the channel the operation already works in.
      - name: Notebooks & IDEs
        icon: notebook
        summary: Notebooks, VS Code and JetBrains against governed data and Genie Code.
  - name: Distribution & Partners
    icon: partner
    simplified: 3
    tiles:
      - name: NDC Offer & Order API
        icon: api
        summary: Continuous pricing and merchandised offers served to agencies, OTAs and metasearch through the airline's offer and order engine.
        citations:
          - ndc
      - name: Interline & Codeshare
        core: true
        icon: partner
        summary: Partner carriers reading schedule, availability and disruption state over Delta Sharing rather than nightly file exchange.
      - name: Airport A-CDM Partners
        icon: globe
        summary: Turnaround milestones and stand demand shared back to airport operators and ground handlers under the A-CDM agreement.
        citations:
          - acdm
  - name: Operational Writeback
    icon: opdb
    tiles:
      - name: Altéa Inventory Writeback
        icon: db
        summary: Availability, bid prices and reaccommodation decisions written back into the passenger service system so the answer reaches the booking path.
        citations:
          - amadeus-altea
      - name: AMOS Work Orders
        core: true
        icon: erp
        summary: Predicted component removals raised as maintenance work orders against the tail, in the system engineering already works in.
        citations:
          - amos
      - name: Crew & Ground Mobile
        icon: apps
        summary: Roster changes, standby calls and turnaround tasks pushed to the devices crew and ramp teams actually carry.
  - name: Regulatory & Reporting
    icon: gavel
    tiles:
      - name: Regulatory Submissions
        icon: gavel
        summary: Punctuality, safety and emissions reporting to the regulator, and CORSIA and EU ETS emissions accounting, produced from the same governed tables the airline runs on.
        citations:
          - corsia
      - name: IATA Industry Reporting
        icon: share
        summary: Settlement, interline and industry benchmark submissions filed from contracted Gold products.
  - name: Published Products
    icon: product
    tiles:
      - name: Data Products
        icon: product
        summary: Published, contracted products discoverable in Unity Catalog Domains and shared over OpenSharing.
      - name: Sharing Recipients
        core: true
        icon: share
        summary: Lessors, maintenance partners and alliance members reading live tables, reducing separately maintained extracts and duplication, with recipient access and reuse scoped by agreements.
  - name: Databricks Apps
    icon: apps
    tiles:
      - name: OCC Recovery Cockpit
        short: Disruption management
        icon: gauge
        summary: 'The screen the duty manager runs a disrupted day from: cancel and delay options costed against passenger reaccommodation, crew legality and downline aircraft rotation, on Databricks Apps over Lakebase.'
      - name: Turnaround Manager
        short: Stand-side milestones
        icon: stream
        summary: Live turnaround state against the A-CDM clock, flagging the stands that will miss target off-block so the ramp can be moved before the delay is booked.
      - name: RM Analyst Workbench
        short: Pricing decisions
        icon: market
        summary: Where revenue management analysts see the forecast, the override history and the revenue at risk on a flight before they touch a bid price.
      - name: AOG Watchtower
        short: Fleet health
        icon: iot
        summary: Component health and predicted removals by tail, so engineering plans the change at a base overnight instead of discovering it at a gate.
  - name: AI/BI Dashboards
    icon: aibi
    tiles:
      - name: On-Time Performance
        icon: aibi
        summary: Punctuality, delay attribution and turnaround compliance on certified operational Metric Views.
        kpis:
          - On-time performance
          - Departure punctuality
          - Turnaround compliance
          - Delay minutes by cause
          - Cancellation rate
        teams:
          - Operations Control
          - Network Planning
          - Executive Team
      - name: Revenue & Yield
        icon: aibi
        summary: Route and cabin revenue performance against forecast across the commercial book.
        kpis:
          - RASK
          - Yield
          - Load factor
          - Revenue vs forecast
          - Ancillary revenue per passenger
        teams:
          - Revenue & Pricing
          - Network Planning
          - Executive Team
      - name: Network & Unit Cost
        icon: aibi
        summary: Route profitability and unit cost with fleet utilisation and fuel efficiency.
        kpis:
          - CASK
          - Route profitability
          - Load factor
          - Block-hour utilisation
          - Fuel burn per ASK
        teams:
          - Network Planning
          - Executive Team
          - Operations Control
      - name: Baggage & Customer
        icon: aibi
        summary: Baggage handling and customer experience across stations and journeys.
        kpis:
