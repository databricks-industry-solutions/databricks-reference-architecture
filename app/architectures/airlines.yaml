agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Network Planning Agent
        icon: genie
        summary: Ask about route profitability, yield and load factor in plain language across the commercial book.
        feeds:
          - PROS Revenue Management
          - ATPCO Fare Filings
          - Revenue Accounting
          - On-time, RASK, turnaround
        teams:
          - Revenue & Pricing
          - Network Planning
          - Executive Team
        questions:
          - Which routes had the lowest RASK last month and why?
          - How does load factor compare to last year by market?
          - Which fare classes are we spilling demand in?
          - What is yield by cabin on our top ten routes?
          - Where is ancillary revenue per passenger growing fastest?
      - name: Operations Control Agent
        icon: genie
        summary: Explore on-time performance, delay causes and turnaround compliance across the operation.
        feeds:
          - ACARS / OOOI Messages
          - Airport Operational Database
          - A-CDM Message Bus
          - On-time, RASK, turnaround
        teams:
          - Operations Control
          - Network Planning
          - Executive Team
        questions:
          - What is our on-time performance today versus the same day last week?
          - Which delay cause codes are driving the most delay minutes?
          - Which stations have the worst turnaround compliance this month?
          - How many flights missed target off-block yesterday, and why?
          - Which rotations are most exposed to reactionary delay?
      - name: Fleet Reliability Agent
