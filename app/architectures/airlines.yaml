          - Where are we losing bookings to abandonment in the shopping funnel?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: IROPS Recovery
        short: Disruption
        icon: gauge
        summary: Recovering aircraft, crew and passengers together after weather, ATC or technical disruption, optimising total cost of the day rather than any single resource.
        problem: Weather, ATC and technical disruption cascade across aircraft, crew and passengers. Recovered in silos, each fix breaks another and the cost of the day runs away before anyone sees the whole picture.
        who_benefits: Operations Control
        how_built: Movement, crew-legality and booking feeds land in Lakehouse//RT; recovery options are costed across all three resources in Model Serving and actioned from the OCC Recovery Cockpit on Lakebase.
        components:
          - OCC Recovery Cockpit
          - Lakehouse//RT
          - Model Serving
          - ACARS / OOOI Messages
          - Lakebase
        stories:
          - title: 'Aer Lingus: real-time recovery decisions in the OCC'
            url: https://www.databricks.com/blog/scaling-ai-through-data-fluency
          - title: JetBlue Blue Sky operational digital twin
            url: https://www.databricks.com/blog/accelerating-innovation-jetblue-using-databricks
      - name: Continuous Pricing & NDC
        short: Revenue
        icon: market
        summary: Moving from filed fare classes to continuous price points served through NDC offers, scored per shopping request against demand and remaining capacity.
        problem: Filed fare classes cannot express willingness to pay, so revenue leaks between the ladder's rungs, and NDC shopping traffic now moves faster than the fare-filing cycle can answer.
        who_benefits: Revenue & Pricing
        how_built: PROS forecasts and ATPCO rules are conformed in the lakehouse; demand and willingness-to-pay models score each shopping request through Model Serving behind the NDC offer engine.
        components:
          - RM Analyst Workbench
          - Model Serving
          - PROS Revenue Management
          - NDC Offer & Order API
          - AI/BI
        stories:
          - title: easyJet modernises pricing on Databricks Apps
            url: https://www.databricks.com/customers/easyjet/lakebase
          - title: Virgin Atlantic unifies commercial and finance data
            url: https://www.databricks.com/customers/virgin-atlantic
      - name: Network & Fleet Planning
        short: Capacity
        icon: sheet
        summary: Which routes are flown, at what frequency and with which aircraft, evaluated on profitability per departure rather than on route revenue alone, season by season.
        problem: Routes judged on route revenue alone hide the ones that lose money per departure once fleet, slots and maintenance windows are costed into the season.
        who_benefits: Network Planning
        how_built: Schedule, cost and demand feeds are conformed to certified Metric Views; profitability-per-departure scenarios are explored in AI/BI on the same definitions the executive team reads.
        components:
          - AI/BI
          - Unity Catalog
          - NetLine/Sched
          - Genie One
        stories:
          - title: 'Virgin Atlantic: booking analysis from weeks to hours'
            url: https://www.databricks.com/customers/virgin-atlantic
      - name: Crew Pairing & Rostering
        short: Planning
        icon: people
        summary: AIMS generates and validates legality-constrained pairings and rosters under flight time limitations, while lakehouse models flag duty risk and support authorized roster repair when the operation moves.
        problem: Legal, low-cost pairings must hold under flight-time limitations and then be repaired the moment the operation moves, keeping crews within legality.
        who_benefits: Operations Control
        how_built: AIMS generates and validates pairings and roster state, conformed and served in Lakehouse//RT; disruption models identify crews nearing duty limits and support authorized roster repair before rosters break.
        components:
          - AIMS Crew Management
          - Lakehouse//RT
          - Model Serving
          - Lakeflow
        stories:
          - title: JetBlue models crew duty limits in Blue Sky
            url: https://www.databricks.com/blog/accelerating-innovation-jetblue-using-databricks
      - name: Predictive Maintenance
        short: Engineering
        icon: iot
        summary: Predicting component removal from sensor, QAR and defect history so an AOG becomes a planned base visit.
        problem: An AOG discovered at the gate cancels flights and cascades. Component removals need predicting from actual condition, not a calendar, so the fix becomes a planned base visit.
        who_benefits: Engineering & MRO
        how_built: QAR, sensor and AMOS defect history feed remaining-useful-life models tracked in MLflow and scored in Model Serving; predicted removals raise AMOS work orders from the AOG Watchtower.
        components:
          - AOG Watchtower
          - Aircraft Sensor & QAR
          - MLflow
          - Model Serving
          - Swiss-AS AMOS
        stories:
          - title: 'JetBlue: maintenance anomalies caught in real time'
            url: https://www.databricks.com/blog/accelerating-innovation-jetblue-using-databricks
          - title: Predictive maintenance on the Databricks Lakehouse
            url: https://www.databricks.com/blog/what-is-predictive-maintenance
      - name: Passenger 360
        short: Customer 360
        icon: custlake
        summary: PNR, loyalty, clickstream and disruption history unified into one passenger view.
        problem: A passenger's booking, loyalty, digital and disruption history sit in separate systems, so the airline treats a top-tier flyer like a stranger and no team can see the full relationship across the journey.
        who_benefits: Revenue & Pricing
        how_built: PNR data from Amadeus Altéa PSS, Loyalty & FFP and Web & App Clickstream are unified in CustomerLake under Unity Catalog, giving one governed passenger view every channel and the OCC read.
        components:
          - CustomerLake
          - Amadeus Altéa PSS
          - Loyalty & FFP
          - Web & App Clickstream
          - Unity Catalog
      - name: Turnaround & OTP
        short: Punctuality
        icon: stream
        summary: 'On-time performance attacked at the stand: milestone-level turnaround data against the A-CDM clock, so the delay is predicted and moved rather than explained afterwards.'
        problem: On-time performance is won or lost at the stand. Without milestone-level turnaround data the delay is explained after the aircraft is late, not moved before it happens.
        who_benefits: Operations Control
        how_built: A-CDM milestones stream into Lakehouse//RT; the Turnaround Manager flags stands that will miss target off-block so the ramp is moved before the delay is booked.
        components:
          - Turnaround Manager
          - Lakehouse//RT
          - A-CDM Message Bus
          - Airport Operational Database
        stories:
          - title: JetBlue Blue Sky operational digital twin
            url: https://www.databricks.com/customers/jetblue-video
      - name: Unified Ops Control
        short: Operations
        icon: gauge
        summary: One real-time operating picture across flights, crew, aircraft and passengers for the OCC.
        problem: The OCC watches flights, crew, aircraft and passengers on separate screens fed by separate systems, so no one sees the whole operation at once and a small delay becomes a cascade before it is understood.
        who_benefits: Operations Control
        how_built: Movement, crew, maintenance and booking feeds stream into Lakehouse//RT and are conformed to certified AI/BI Metric Views, so the OCC Recovery Cockpit shows one live common operating picture across the operation.
        components:
          - OCC Recovery Cockpit
          - Lakehouse//RT
          - AI/BI
          - A-CDM Message Bus
          - ACARS / OOOI Messages
        stories:
          - title: JetBlue Blue Sky operational digital twin
            url: https://www.databricks.com/blog/accelerating-innovation-jetblue-using-databricks
      - name: Ancillary Merchandising
        short: Retailing
        icon: product
        summary: Seats, bags and lounge access merchandised per passenger against the loyalty profile.
        problem: Seats, bags and lounge access are offered the same to everyone, so the airline leaves ancillary revenue on the table and the profile needed to personalise the offer sits unused behind the loyalty estate.
        who_benefits: Revenue & Pricing
        how_built: Loyalty and Web & App Clickstream signals feed offer-propensity models in Model Serving with features in Feature Store, and ranked ancillary offers are served through the NDC Offer & Order API into the booking path.
        components:
          - Model Serving
          - Feature Store
          - Loyalty & FFP
          - NDC Offer & Order API
          - CustomerLake
        stories:
          - title: Eurowings personalises search with AI Search and Model Serving
            url: https://www.databricks.com/customers/eurowings
      - name: Loyalty & FFP
        short: Loyalty
        icon: custlake
        summary: Tier economics, partner earn and redemption managed against member value across the programme.
        problem: Members drift toward downgrade or churn between slow batch reviews, and points liability and partner-earn economics are hard to see until the balance sheet catches up.
        who_benefits: Revenue & Pricing
        how_built: Frequent-flyer accruals, redemptions and tier movement from Loyalty & FFP are unified in CustomerLake, and tier-migration and churn models score in Model Serving on certified AI/BI views.
        components:
          - CustomerLake
          - Loyalty & FFP
          - Model Serving
          - MLflow
          - AI/BI
        stories:
          - title: How AI is redefining travel and hospitality
            url: https://www.databricks.com/blog/booking-bon-voyage-how-ai-redefining-travel-hospitality-experience
medallion:
  Bronze:
    short: Raw operational feeds
    summary: PNR and ticketing records from the passenger service system, ACARS and OOOI movement messages, AODB stand and gate events, AMOS work orders and ATPCO fare filings, landed exactly as received so a fare or a delay code can always be replayed as it stood.
  Silver:
    short: Conformed flight, passenger, tail
    summary: Flight legs, passenger journeys and aircraft tails resolved into single conformed entities across the reservation, operations and maintenance estates, with IATA and ICAO station codes reconciled and interline segments stitched to one itinerary.
  Gold:
    short: On-time, RASK, turnaround
    summary: 'Contracted products the commercial and operations teams run on: on-time performance and delay attribution by cause code, RASK and CASK by route and cabin, turnaround compliance, and load factor and yield by market.'
