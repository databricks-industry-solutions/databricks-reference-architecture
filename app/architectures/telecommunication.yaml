name: Telecommunications
description: 'Mobile and fixed operators: network inventory and performance, customer billing and care, field service, fraud and revenue assurance, and 5G service orchestration.'
sources:
  - name: BSS & Billing
    icon: erp
    simplified: 2
    tiles:
      - name: Amdocs CES
        icon: erp
        summary: 'Customer, product and billing: subscriptions, invoices, payments and dunning.'
        citations:
          - amdocs-ces
        category: Telecom BSS / Billing
        what_it_is: 'Customer, product and billing: subscriptions, invoices, payments and dunning across the base.'
        who_uses_it: Billing operations, Finance and Commercial teams.
        data_out:
          batch:
            types:
              - structured
            volume: 10-50 GB/day
            interval: Billing cycles + hourly deltas
          stream:
            types:
              - semi-structured
            volume: tens of events/sec
            interval: Continuous CDC
      - name: Netcracker BSS
        icon: market
        summary: Order management, product catalog and revenue management for converged offers.
