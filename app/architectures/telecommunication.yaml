agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Network Operations Agent
        icon: genie
        summary: Ask about cell performance, alarms and outage impact in plain language.
        feeds:
          - Ericsson ENM
          - Nokia NetAct
          - Cisco Crosswork
          - Churn, ARPU, network KPI
        teams:
          - Network Operations
          - CEO & CTO Office
          - Data Engineers
        questions:
          - Which cells have the worst dropped-call rate right now?
          - What is the current alarm-to-restoration time by region?
          - Which transport paths are approaching capacity?
          - Where are outages affecting the most subscribers today?
          - Which sites show degrading performance counters this week?
      - name: Churn & Retention Agent
        icon: genie
        summary: Explore churn risk, ARPU and NPS drivers across the subscriber base.
        feeds:
          - Amdocs CES
          - Salesforce Service Cloud
          - Medallia Experience
          - Conformed subscriber, session
        teams:
          - Commercial & Marketing
          - Customer Care
          - Data Scientists
        questions:
          - Which high-value subscribers are at highest churn risk this month?
          - What are the top complaint drivers behind low NPS?
          - Which segments have the best next-best-offer uptake?
          - How does ARPU trend by segment this quarter?
          - Which subscribers had a dropped call and then contacted care?
      - name: Fraud & Revenue Assurance Agent
        icon: genie
        summary: Answer leakage, fraud and roaming-dispute questions on governed data.
        feeds:
          - Mobileum Fraud
          - Subex Revenue Assurance
          - GSMA TAP Roaming
          - Churn, ARPU, network KPI
        teams:
          - Revenue Assurance
          - CEO & CTO Office
          - Data Scientists
        questions:
          - What is our fraud loss rate this month versus last?
          - Which roaming partners exceed dispute thresholds?
          - Where is revenue leaking across rating and interconnect?
          - Which accounts show SIM-change and identity-context anomalies, separate from IRSF usage patterns?
          - What is the value of unreconciled TAP discrepancies?
      - name: Care & Dispatch Agent
        icon: genie
        summary: Ask about resolution rates, handle times and field-SLA risk in plain language.
        feeds:
          - Genesys Cloud CX
          - ServiceMax FSM
          - Salesforce Field Service
          - Conformed subscriber, session
        teams:
          - Customer Care
          - Network Operations
          - App Developers
        questions:
          - What is first-contact resolution by care channel today?
          - Which truck rolls are at risk of missing SLA?
          - Where is technician capacity most constrained this week?
          - Which complaint types drive the most repeat contacts?
          - Which field jobs are waiting on a part or spare right now?
          - What is average handle time by queue right now?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Churn Prediction
        short: Retention
        icon: custlake
        summary: Churn risk scored by usage, care and network quality signals.
        problem: Subscribers leave after dropped calls or a billing dispute, but usage, care and network signals sit in separate systems, so churn is seen only once the number has already ported out.
        who_benefits: Commercial & Marketing
        how_built: Usage, care and network-quality features are engineered in Feature Store and scored in Model Serving, surfacing save offers in the Churn Prevention Hub before the renewal window closes.
        components:
          - Churn Prevention Hub
          - Feature Store
          - Model Serving
          - CustomerLake
          - MLflow
        stories:
          - title: How to predict the likelihood of each telco customer churning
            url: https://www.databricks.com/blog/2021/02/24/solution-accelerator-telco-customer-churn-predictor.html
          - title: Graph analytics for telco customer churn prediction
            url: https://www.databricks.com/solutions/accelerators/graph-analytics-telco-customer-churn-prediction
      - name: Network Fault Correlation
        short: NOC
        icon: stream
        summary: Alarms grouped to root cause and customer impact before truck roll.
        problem: Radio, transport and core alarms flood the NOC by the thousand during an outage, and engineers correlate them by hand, so a single root-cause fault hides behind a wall of symptom alerts.
        who_benefits: Network Operations
        how_built: Alarm and performance streams land in Lakehouse//RT and are grouped to a root cause and customer impact, surfaced on the NOC War Room before a technician is dispatched.
        components:
          - NOC War Room
          - Lakehouse//RT
          - Ericsson ENM
          - Delta Lake
          - AI Functions
        stories:
          - title: Telco Network Analytics Solution Accelerator
            url: https://www.databricks.com/solutions/accelerators/telco-network-analytics
      - name: Capacity Forecasting
        short: Planning
        icon: chart
        summary: Cell and transport capacity forecast against traffic growth.
        problem: Cell and transport capacity is planned off spreadsheets and last quarter's peaks, so congestion is found after subscribers feel the slowdown and capex lands in the wrong sites.
        who_benefits: Network Operations
        how_built: Traffic, session and topology history is conformed on Delta Lake and forecast with models tracked in MLflow, so planners size cell and transport capacity in AI/BI against projected growth.
        components:
          - Lakehouse//RT
          - MLflow
          - AI/BI
          - Cisco Crosswork
          - Delta Lake
        stories:
          - title: T-Mobile expands its cell tower network with Databricks
            url: https://www.databricks.com/customers/t-mobile
          - title: Telco Network Analytics Solution Accelerator
            url: https://www.databricks.com/solutions/accelerators/telco-network-analytics
      - name: Fraud & SIM-Swap
        short: Fraud
        icon: gavel
        summary: SIM swap, IRSF and subscription fraud flagged before settlement.
        problem: SIM-swap, IRSF and subscription fraud move faster than nightly rules, so loss clears through interconnect and roaming settlement before a static rules engine ever flags the pattern.
        who_benefits: Revenue Assurance
        how_built: CDR, usage and device signals score IRSF and subscription-fraud patterns in real time through Model Serving on Lakehouse//RT, while SIM-change and identity-context anomalies flag account takeover, raising flagged accounts to revenue-assurance and care before loss clears settlement.
        components:
          - Mobileum Fraud
          - Model Serving
          - Lakehouse//RT
          - MLflow
          - AI Functions
        stories:
          - title: AT&T cuts fraud with real-time AI on Databricks
            url: https://www.databricks.com/customers/att
          - title: 'Securing the future: AT&T uses generative AI to transform fraud protection'
            url: https://www.databricks.com/blog/securing-future-att-uses-generative-ai-transform-fraud-protection
      - name: Revenue Assurance & Leakage
        short: Assurance
        icon: gavel
        summary: Rating, interconnect and roaming leakage reconciled and identified for recovery across the revenue chain.
        problem: Revenue leaks between mediation, rating, interconnect and roaming settlement, and the gaps are chased in month-end spreadsheets long after the usage has already billed short or not at all.
        who_benefits: Revenue Assurance
        how_built: Subex, WeDo and GSMA TAP feeds are conformed on Delta Lake and reconciled end to end, so leakage across rating and interconnect surfaces on certified AI/BI views and Genie One answers where revenue is being lost.
        components:
          - Subex Revenue Assurance
          - WeDo RAID
          - GSMA TAP Roaming
          - AI/BI
          - Genie One
      - name: Next Best Offer
        short: Marketing
        icon: market
        summary: Next-best-offer scored per subscriber at renewal and in-app.
        problem: Offers are pushed to broad segments from a copied profile store, so the message misses the subscriber's real usage and device context and upsell lands as spam at the wrong moment.
        who_benefits: Commercial & Marketing
        how_built: Next-best-offer is scored per subscriber in Model Serving against CustomerLake features and delivered through the Churn Prevention Hub at renewal and in-app, without copying profiles into a CDP.
        components:
          - Churn Prevention Hub
          - CustomerLake
          - Model Serving
          - Feature Store
          - AI Functions
      - name: Predictive Network Maintenance
        short: Reliability
        icon: iot
        summary: Cell site and transport failures predicted from performance counters and alarms before service degrades.
        problem: Radio and transport hardware is maintained on fixed schedules or after it already fails, so a degrading site is only caught once subscribers feel dropped calls and a truck rolls to a hard-down cell.
        who_benefits: Network Operations
        how_built: Ericsson ENM and Nokia NetAct counters and alarms are conformed on Lakehouse//RT and scored with remaining-life and anomaly models tracked in MLflow and Model Serving, so the Field Dispatch Console raises planned work before a site goes hard down.
        components:
          - Field Dispatch Console
          - Ericsson ENM
          - Model Serving
          - MLflow
          - Lakehouse//RT
        stories:
          - title: Introducing the Data + AI Platform for Communications
            url: https://www.databricks.com/blog/introducing-data-intelligence-platform-communications
      - name: Field Dispatch Optimization
        short: Field service
        icon: people
        summary: Technician routing, parts and appointment windows optimised against SLA and travel.
        problem: Truck rolls are scheduled from static rules, so technicians criss-cross territories, arrive without the right part and miss appointment windows while high-SLA jobs wait.
        who_benefits: Network Operations
        how_built: ServiceMax, Salesforce Field Service and Geotab telematics are conformed on Delta Lake and scored in Model Serving, so the Field Dispatch Console routes crews and parts against SLA risk and travel time on AI/BI.
        components:
          - Field Dispatch Console
          - ServiceMax FSM
          - Geotab Fleet
          - Model Serving
          - AI/BI
      - name: Care Transcript Analysis
        short: Contact centre
        icon: chat
        summary: Call and chat transcripts summarised and themed to surface complaint drivers and next best action.
        problem: The reason subscribers call sits locked in thousands of untranscribed calls and chats, so care leaders see handle time and queue depth but never the themes driving repeat contacts and low NPS.
        who_benefits: Customer Care
        how_built: Genesys and Salesforce Service Cloud transcripts are summarised and themed with AI Functions under Unity Catalog, so complaint drivers and next best action surface beside the ticket in the Care Agent Desktop.
        components:
          - Care Agent Desktop
          - Genesys Cloud CX
          - AI Functions
          - Unity Catalog
      - name: Location Data Monetization
        short: New revenue
        icon: market
        summary: Privacy-reviewed aggregated location and mobility products released under defined disclosure conditions for external buyers.
        problem: The operator sits on aggregate mobility and network-presence signals with real value to retail, transport and planning buyers, but there is no governed, privacy-safe way to package and share them as products.
        who_benefits: CEO & CTO Office
        how_built: Network and location signals are aggregated and anonymised on Delta Lake, published as privacy-reviewed Data Products in Unity Catalog under defined disclosure conditions and shared to buyers over Delta Sharing, with usage read in AI/BI.
        components:
          - Data Products
          - Unity Catalog
          - Delta Lake
          - Delta Sharing
          - AI/BI
medallion:
  Bronze:
    short: Raw network and BSS feeds
    summary: CDR and usage records, probe and SNMP metrics, CRM interactions, work orders and billing cycles, landed exactly as received so a dropped call or a disputed charge can always be replayed.
  Silver:
    short: Conformed subscriber, session
    summary: Subscribers, devices, cells and service instances resolved into single conformed entities across BSS, OSS and CRM, with session records stitched to one journey.
  Gold:
    short: Churn, ARPU, network KPI
    summary: 'Contracted products commercial and network teams run on: churn and ARPU by segment, dropped-call rate, mean time to repair, fraud loss and NPS drivers.'
