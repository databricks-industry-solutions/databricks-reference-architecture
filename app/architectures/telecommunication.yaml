pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: CEO & CTO Office
        mark: Genie One
        summary: The CEO on ARPU and churn; the CTO on network availability and capex efficiency, trading coverage build against the subscribers it retains.
        uses:
          - - Genie One
            - Ask what last month's churn cost without analyst delay.
          - - AI/BI
            - ARPU and NPS on certified Metric Views.
          - - Unity Catalog
            - One subscriber definition across BSS and CRM.
        sub:
          - name: CEO
            cares: ARPU, churn and the return on every pound of coverage capex.
          - name: CTO
            cares: network availability, 5G rollout pace and capex efficiency.
          - name: Strategy & Transformation
            cares: the data and AI foundation behind converged fixed and mobile offers.
        ucs:
          - Capacity Forecasting
          - Location Data Monetization
          - Revenue Assurance & Leakage
          - Churn Prediction
      - name: Network Operations
        mark: Lakehouse//RT
        summary: NOC engineers on alarms, cell performance and outage restoration, grouping faults to root cause and customer impact before a truck rolls.
        uses:
          - - NOC War Room
            - Live alarms, customer impact and truck rolls on one screen.
          - - Lakehouse//RT
            - Probe and alarm state at network latency.
        sub:
          - name: NOC Lead
            cares: alarm-to-restoration time and the customer impact behind every outage.
          - name: RAN & Transport Planning
            cares: cell and transport capacity against traffic growth and coverage gaps.
          - name: Field Operations
            cares: truck-roll SLA, technician capacity and parts availability.
        ucs:
          - Network Fault Correlation
          - Capacity Forecasting
          - Predictive Network Maintenance
          - Field Dispatch Optimization
      - name: Commercial & Marketing
        mark: CustomerLake
        summary: Product owners on offer uptake, upsell and retention campaigns, scoring next-best-offer per subscriber before the contract renewal window.
        uses:
          - - Next Best Offer
            - Propensity-scored upsell before renewal, delivered through the Churn Prevention Hub.
          - - CustomerLake
            - Segments without copying profiles into a separate CDP.
        sub:
          - name: Segment & Offer Owners
            cares: next-best-offer, upsell and the renewal save rate per segment.
          - name: Retention Marketing
            cares: churn drivers and the campaigns that hold high-value subscribers.
          - name: Enterprise & B2B
            cares: 5G and connectivity contracts and the SLAs behind them.
        ucs:
          - Churn Prediction
          - Next Best Offer
          - Location Data Monetization
      - name: Customer Care
        core: true
        mark: Apps
        summary: Care leaders on first-contact resolution, handle time and complaint drivers, putting subscriber and network context beside every ticket.
        uses:
          - - Care Agent Desktop
            - Subscriber context and next-best-action beside the ticket.
          - - Apps
            - Care tools hosted next to governed BSS data.
        sub:
          - name: Care Operations
            cares: first-contact resolution, handle time and complaint backlog.
          - name: Complaint & Quality
            cares: the network and billing causes behind repeat complaints and NPS.
          - name: Digital Care
            cares: self-service deflection and the app experience beside the ticket.
        ucs:
          - Care Transcript Analysis
          - Churn Prediction
          - Next Best Offer
      - name: Revenue Assurance
        mark: AI/BI
        summary: Finance and fraud teams on leakage, disputes and roaming settlement, flagging SIM-change account takeover and catching IRSF loss before it clears interconnect.
        uses:
          - - AI/BI
            - Leakage and fraud loss on certified views.
          - - Genie One
            - Ask which roaming partners exceed dispute thresholds.
        sub:
          - name: Fraud Management
            cares: SIM-swap, IRSF and subscription fraud loss before it clears.
          - name: Revenue Assurance
            cares: leakage across rating, mediation and interconnect.
          - name: Roaming & Interconnect Settlement
            cares: TAP discrepancies and partner dispute exposure.
        ucs:
          - Fraud & SIM-Swap
          - Revenue Assurance & Leakage
          - Churn Prediction
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land CDR and usage records, probe and SNMP metrics, CRM interactions and billing cycles; own Bronze to Silver and the pager when a churn table stalls.
        uses:
          - - Lakeflow Connect
            - Managed connectors for BSS, OSS and CRM sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on CDR and probe feeds.
          - - Lakewatch
            - Freshness on the churn tables commercial reads each morning.
        sub:
          - name: BSS/OSS Ingestion
            cares: CDR, usage, probe and SNMP feeds landed Bronze to Silver.
          - name: Pipeline Reliability
            cares: freshness and expectations on the churn and network KPI tables.
          - name: Streaming
            cares: alarm and session streams landed at network latency.
        ucs:
          - Network Fault Correlation
          - Capacity Forecasting
          - Churn Prediction
      - name: Data Scientists
        mark: MLflow
        summary: Churn, fault-correlation, fraud-scoring and capacity-forecast models, and whether they still hold as network load and offer mix shift.
        uses:
          - - Feature Store
            - Subscriber and network features read identically in training and serving.
          - - MLflow
            - Every churn and fraud experiment tracked for audit.
          - - Model Serving
            - Churn and fraud models scored in the operational path.
        sub:
          - name: Churn & Propensity
            cares: retention, next-best-offer and lifetime-value models.
          - name: Network ML
            cares: fault-correlation, capacity and QoS forecasting models.
          - name: Fraud Modelling
            cares: SIM-swap, IRSF and subscription-fraud scoring.
        ucs:
          - Churn Prediction
          - Fraud & SIM-Swap
          - Capacity Forecasting
      - name: App Developers
        mark: Apps
        summary: Ship the NOC War Room, Care Agent Desktop and Churn Prevention apps network and care teams work in, next to governed BSS and probe data.
        uses:
          - - Apps
            - Care and NOC screens with no separate web tier to secure.
          - - Lakebase
            - Serverless Postgres for ticket and offer state writes.
          - - Agent Bricks
            - Agents that draft next-best-action against governed tools.
        sub:
          - name: NOC & Field Apps
            cares: the NOC War Room and Field Dispatch Console engineers work in.
          - name: Care & Retention Apps
            cares: the Care Agent Desktop and Churn Prevention Hub.
          - name: Agents & Writeback
            cares: next-best-action agents and governed writes to BSS and work orders.
        ucs:
          - Network Fault Correlation
          - Care Transcript Analysis
          - Next Best Offer
          - Field Dispatch Optimization
