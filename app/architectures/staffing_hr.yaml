name: Staffing & HR
description: 'Staffing firms and HR service providers: candidate sourcing, placement lifecycle, vendor management systems, payroll and compliance, and workforce analytics across clients and geographies.'
sources:
  - name: ATS & Recruiting
    icon: erp
    tiles:
      - name: Bullhorn ATS/CRM
        icon: erp
        summary: Candidate records, submissions, interviews and placement history for staffing firms.
        citations:
          - bullhorn
        category: Applicant Tracking System (ATS/CRM)
        what_it_is: System of record for candidate records, submissions, interviews and placement history at staffing firms.
        who_uses_it: Recruiters, account managers and sourcing teams.
        data_out:
          batch:
            types:
              - structured
            volume: 2-10 GB/day
            interval: Nightly batch + hourly deltas
          stream:
            types:
              - semi-structured
            volume: tens of submission events/sec
            interval: Continuous CDC
      - name: Workday Recruiting
        icon: people
        summary: Requisitions, offers and onboarding for corporate HR and RPO programs.
        citations:
          - workday-rec
        category: Talent Acquisition / Recruiting
        what_it_is: Manages requisitions, offers and onboarding for corporate HR and RPO programs.
        who_uses_it: RPO recruiters, HR and onboarding teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-4 GB/day
            interval: Nightly batch + hourly deltas
      - name: Greenhouse
        icon: sheet
        summary: Structured hiring pipelines, scorecards and DEI reporting for enterprise clients.
        citations:
          - greenhouse
        category: Applicant Tracking System (ATS)
        what_it_is: Runs structured hiring pipelines, interview scorecards and DEI reporting for enterprise clients.
        who_uses_it: Recruiters, hiring managers and DEI/compliance teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 0.5-3 GB/day
            interval: Hourly / nightly sync
  - name: VMS & Contingent
    icon: market
    tiles:
      - name: Beeline VMS
        icon: market
        summary: Client requisitions, rate cards, approvals and supplier scorecards.
        citations:
          - beeline
        category: Vendor Management System (VMS)
        what_it_is: Holds client requisitions, rate cards, approvals and supplier scorecards for contingent labour programs.
        who_uses_it: Program managers, MSP teams and supplier managers.
        data_out:
          batch:
            types:
              - structured
            volume: 2-8 GB/day
            interval: Nightly batch + hourly deltas
          stream:
            types:
              - semi-structured
            volume: tens of requisition events/sec
            interval: Continuous CDC
      - name: SAP Fieldglass
        icon: partner
        summary: Contingent workforce procurement, statements of work and compliance tracking.
        citations:
          - fieldglass
        category: Contingent Workforce Procurement (VMS)
        what_it_is: Manages contingent workforce procurement, statements of work and compliance tracking.
        who_uses_it: Procurement, MSP and compliance teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-6 GB/day
            interval: Nightly batch
      - name: Magnit VMS
        icon: api
        summary: 'MSP-managed programs: spend, tenure limits and conversion tracking.'
        citations:
          - magnit
        category: Managed Service Provider (MSP/VMS)
        what_it_is: Runs MSP-managed programs tracking spend, tenure limits and conversion across suppliers.
        who_uses_it: MSP program managers and procurement analysts.
        data_out:
          batch:
            types:
              - structured
            volume: 1-4 GB/day
            interval: Daily batch + on-demand API
  - name: Payroll & Time
    icon: chart
    tiles:
      - name: ADP Workforce Now
        icon: erp
        summary: Payroll, tax and benefits for placed workers across jurisdictions.
        citations:
          - adp
        category: Payroll / HCM Suite
        what_it_is: Runs payroll, tax and benefits for placed workers across jurisdictions.
        who_uses_it: Payroll operations, tax and benefits teams.
        data_out:
          batch:
            types:
              - structured
            volume: 5-15 GB/day
            interval: Per pay run + nightly batch
      - name: UKG Pro WFM
        core: true
        icon: people
        summary: Time and attendance, scheduling and accruals for hourly placements.
        citations:
          - ukg-pro
        category: Workforce Management (Time & Attendance)
        what_it_is: Captures time and attendance, scheduling and accruals for hourly placements.
        who_uses_it: Schedulers, field operations and payroll teams.
        data_out:
          batch:
            types:
              - structured
            volume: 2-8 GB/day
            interval: Nightly batch
          stream:
            types:
              - semi-structured
            volume: hundreds of punch events/sec
            interval: Continuous (near real-time)
      - name: Deel Global Payroll
        icon: globe
        summary: Contractor payments and compliance in international staffing programs.
        citations:
          - deel
        category: Global Payroll / EOR
        what_it_is: Processes contractor payments and compliance for international staffing programs.
        who_uses_it: Global payroll, contractor operations and compliance teams.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-3 GB/day
            interval: Per pay cycle + daily batch
  - name: Credentialing
    icon: gavel
    tiles:
      - name: Symplr Credentialing
        icon: gavel
        summary: Licence verification, expirations and privileging for healthcare staffing.
        citations:
          - symplr
        category: Credentialing / Provider Enrolment
        what_it_is: Manages licence verification, expirations and privileging for healthcare staffing.
        who_uses_it: Credentialing specialists and compliance officers.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-2 GB/day
            interval: Nightly batch
      - name: Checkr Background
        core: true
        icon: partner
        summary: Criminal, employment and education checks with adverse action workflow.
        citations:
          - checkr
        category: Background Screening Service
        what_it_is: Runs criminal, employment and education checks with adverse-action workflow.
        who_uses_it: Screening, compliance and onboarding teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 0.5-2 GB/day
            interval: On-demand + daily batch
      - name: Everify I-9
        core: true
        icon: gavel
        summary: E-Verify employment eligibility verification status alongside the employer's I-9 records for US placements.
        citations:
          - everify
        category: Employment Eligibility Verification
        what_it_is: Provides E-Verify employment eligibility verification status and references the employer's I-9 records and audit trail for US placements.
        who_uses_it: Onboarding, HR and compliance teams.
        data_out:
          batch:
            types:
              - structured
            volume: GBs of verification records
            interval: On-demand + daily batch
  - name: Learning & Skills
    icon: product
    tiles:
      - name: Cornerstone LMS
        icon: product
        summary: Client-mandated training completion and skills certifications.
        citations:
          - cornerstone
        category: Learning Management System (LMS)
        what_it_is: Tracks client-mandated training completion and skills certifications.
        who_uses_it: Learning & development, compliance and recruiting teams.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-2 GB/day
            interval: Nightly batch
      - name: LinkedIn Talent Insights
        icon: chart
        summary: Labour market supply, demand and skill adjacency by geography.
        citations:
          - linkedin-ti
        category: Labour Market Intelligence
        what_it_is: Provides labour market supply, demand and skill adjacency by geography.
        who_uses_it: Talent intelligence, sourcing and strategy teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: GBs across datasets
            interval: Weekly / on-demand API
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Client HRIS Marts
        icon: fed
        summary: Client employee and cost centre marts queried in place under Unity Catalog.
        category: HRIS Data Warehouse / Marts
        what_it_is: Client employee and cost-centre marts queried in place via federation under Unity Catalog.
        who_uses_it: HR analytics, finance and client reporting teams.
        data_out:
          batch:
            types:
              - structured
            volume: GB-scale HRIS marts
            interval: Queried on demand (federated)
  - name: Data Formats
    icon: zbraces
    simplified: 2
    tiles:
      - name: 'HR-XML'
        icon: zbraces
        fmt: 'HRX'
        summary: 'HR Open Standards XML for recruiting, staffing and workforce data exchange.'
        spec_url: https://www.hropenstandards.org/
        spark_connector: 'spark-xml'
        spark_repo: https://github.com/databricks/spark-xml
        databricks_resource: https://docs.databricks.com/aws/en/query/formats/xml
        source_systems:
          - 'Workday'
          - 'SAP SuccessFactors'
          - 'Bullhorn'
      - name: 'HR-JSON'
        icon: zbraces
        fmt: 'HRJ'
        summary: 'HR Open Standards JSON encodings of the HR data model for modern APIs.'
        spec_url: https://www.hropenstandards.org/
      - name: 'LER-RS'
        icon: zbraces
        fmt: 'LER'
        summary: 'Learning and Employment Record Resource Standard for verifiable credentials.'
        spec_url: https://www.hropenstandards.org/
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    simplified: 2
    tiles:
      - name: Indeed Job Feed
        icon: api
        summary: Job postings and application funnel metrics ingested for sourcing analytics.
        citations:
          - indeed
        category: Job Board / Sourcing Feed
        what_it_is: Supplies job postings and application funnel metrics for sourcing analytics.
        who_uses_it: Sourcing, recruitment marketing and analytics teams.
        data_out:
          batch:
            types:
              - semi-structured
            volume: GBs of posting and funnel data
            interval: Daily + on-demand API
      - name: Lightcast Labour Market
        icon: chart
        summary: Occupation demand, wage benchmarks and skills taxonomy updates.
        citations:
          - lightcast
        category: Labour Market Intelligence
        what_it_is: Provides occupation demand, wage benchmarks and skills taxonomy updates.
        who_uses_it: Pricing, talent intelligence and strategy teams.
        data_out:
          batch:
            types:
              - structured
            volume: GBs of benchmark data
            interval: Weekly / monthly refresh
      - name: State Licence Boards
        icon: gavel
        summary: Professional licence status files consumed for credential monitoring.
        citations:
          - symplr
        category: Regulatory Licence Registry
        what_it_is: Publishes professional licence status files consumed for credential monitoring.
        who_uses_it: Credentialing and compliance teams.
        data_out:
          batch:
            types:
              - structured
            volume: MBs-GBs of licence files
            interval: Daily / weekly refresh
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: CEO & Growth Office
        mark: Genie One
        summary: The CEO on gross margin and client concentration; the COO on fill rate, redeployment and the compliance exposure sitting in open placements.
        uses:
          - - Genie One
            - Ask what last quarter's margin by client was without analyst delay.
          - - AI/BI
            - Fill rate and spread on certified Metric Views.
          - - Unity Catalog
            - One placement definition across ATS and payroll.
        sub:
          - name: Chief Executive
            cares: gross margin, client concentration and the bets that grow the book without eroding spread.
          - name: Chief Operating Officer
            cares: fill rate, redeployment and the compliance exposure sitting in open placements.
          - name: Growth & Strategy
            cares: which client segments and skills to expand into against where the market is moving.
        ucs:
          - Client Profitability
          - Time-to-Fill
          - Attrition Prediction
          - Rate Benchmarking
      - name: Recruiting & Sales
        mark: Model Serving
        summary: Recruiters and account managers on req pipelines, submittal quality and rate negotiations, defending time-to-fill and interview velocity.
        uses:
          - - Recruiter Workbench
            - Open reqs, submittal quality and interview velocity.
          - - Model Serving
            - Candidate match scores in the submission path.
        sub:
          - name: Recruiters
            cares: submittal quality, interview velocity and getting a strong candidate to the client first.
          - name: Account Managers
            cares: open reqs by client, rate negotiations and defending time-to-fill on the account.
          - name: Sourcing
            cares: building candidate pipelines against scarce skills before the req even opens.
        ucs:
          - Candidate Matching
          - Time-to-Fill
          - Rate Benchmarking
          - Skills Taxonomy
      - name: Workforce Operations
        core: true
        mark: Lakehouse//RT
        summary: Schedulers on shift coverage, overtime creep and credential gaps that would block a worker from starting the client assignment on time.
        uses:
          - - Coverage Console
            - Open shifts and credential expiry on one screen.
          - - Lakehouse//RT
            - Timecard and credential state at shift latency.
        sub:
          - name: Schedulers
            cares: shift coverage, open shifts and credential gaps that would stop a worker starting on time.
          - name: Redeployment
            cares: keeping workers on back-to-back assignments and catching flight risk before an end date.
          - name: Field Operations
            cares: overtime creep and the on-site issues that break a client's coverage plan.
        ucs:
          - Overtime Control
          - Attrition Prediction
          - Credential Monitoring
          - Candidate Matching
      - name: Payroll & Finance
        mark: AI/BI
        summary: Payroll and billing teams on bill-pay spread, accrual accuracy and client invoicing, chasing margin leakage that hides in missed approvals.
        uses:
          - - AI/BI
            - Margin and leakage on certified views.
          - - Genie One
            - Ask which clients are below target spread this month.
        sub:
          - name: Payroll Operations
            cares: accurate pay runs, timecard approvals and accruals across jurisdictions.
          - name: Billing & Invoicing
            cares: bill-pay spread, client invoicing and the leakage hiding in missed approvals.
          - name: Finance & Margin
            cares: gross margin by client, rebates and chargebacks against target spread.
        ucs:
          - Payroll Leakage
          - Client Profitability
          - Overtime Control
          - Rate Benchmarking
      - name: Compliance & Risk
        mark: Lakeflow
        summary: Compliance officers on credential expirations, tenure limits and audit response, keeping every placement defensible under client and law.
        uses:
          - - Compliance Dashboard
            - Credential and I-9 status by placement.
          - - Lakeflow
            - ATS, VMS and payroll feeds conformed for audit.
        sub:
          - name: Compliance Officers
            cares: credential expirations, tenure limits and keeping every placement defensible.
          - name: Background & Screening
            cares: background checks, adverse-action workflow and I-9 eligibility on time.
          - name: Audit & Reporting
            cares: EEO, OFCCP and client DEI reporting that stands up to an audit.
        ucs:
          - Credential Monitoring
          - DEI Hiring Analytics
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land ATS submittals, VMS requisitions, timecards and payroll runs; own Bronze to Silver and the pager when a fill-rate or margin table breaks.
        uses:
          - - Lakeflow Connect
            - Managed connectors for ATS, VMS and payroll sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on placement and timecard feeds.
          - - Lakewatch
            - Freshness on the margin tables finance reads each morning.
        sub:
          - name: Ingestion Engineers
            cares: managed connectors for ATS, VMS and payroll and the Bronze landing zone.
          - name: Pipeline Engineers
            cares: Silver conforming of worker, req and placement and the expectations that guard them.
          - name: Platform Reliability
            cares: freshness and the pager when a fill-rate or margin table breaks before finance reads it.
        ucs:
          - Time-to-Fill
          - Payroll Leakage
          - Credential Monitoring
      - name: Data Scientists
        mark: MLflow
        summary: Candidate-match, time-to-fill, attrition and rate-benchmark models, and whether they still hold as skills demand and client mix shift.
        uses:
          - - Feature Store
            - Candidate and req features read identically in training and serving.
          - - MLflow
            - Every match and attrition experiment tracked for audit.
          - - Model Serving
            - Match and attrition models scored in the submission path.
        sub:
          - name: ML Engineers
            cares: candidate-match, attrition and rate models in both training and serving.
          - name: Analytics Science
            cares: time-to-fill decomposition and the margin drivers behind the metrics.
          - name: MLOps
            cares: tracking every match and attrition experiment for audit as skills demand shifts.
        ucs:
          - Candidate Matching
          - Attrition Prediction
          - Rate Benchmarking
          - Skills Taxonomy
      - name: App Developers
        mark: Apps
        summary: Ship the Recruiter Workbench, Coverage Console and Margin Analyzer apps recruiting and finance work in, next to governed placement data.
        uses:
          - - Apps
            - Recruiting screens with no separate web tier to secure.
          - - Lakebase
            - Serverless Postgres for shift and credential state writes.
          - - Agent Bricks
            - Agents that draft submittals against governed tools.
        sub:
          - name: Workbench Developers
            cares: the Recruiter Workbench and Coverage Console recruiting and ops live in.
          - name: Margin & Compliance Apps
            cares: the Margin Analyzer and Compliance Dashboard finance and risk run on.
          - name: Agent Developers
            cares: agents that draft submittals and renewal tasks against governed tools.
        ucs:
          - Candidate Matching
          - Overtime Control
          - Credential Monitoring
          - Payroll Leakage
