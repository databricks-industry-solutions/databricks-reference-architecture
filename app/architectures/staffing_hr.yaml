agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Fill & Pipeline Agent
        icon: genie
        summary: Ask about requisition ageing, submittal quality and time-to-fill in plain language.
        feeds:
          - Bullhorn ATS/CRM
          - Beeline VMS
          - Indeed Job Feed
          - Conformed worker, req, client
        teams:
          - Recruiting & Sales
          - Account Managers
          - Sourcing
        questions:
          - What is our average time-to-fill by client this quarter versus last?
          - Which open requisitions have aged past 30 days without a submittal?
          - Which recruiters have the highest submittal-to-interview conversion?
          - Where are reqs stalling most, at client approval, sourcing or interview?
          - Which skills have the fewest available candidates against open demand?
      - name: Client Margin Agent
        icon: genie
        summary: Explore gross margin, bill-pay spread and leakage across client accounts.
        feeds:
          - ADP Workforce Now
          - Beeline VMS
          - Client HRIS Marts
          - Fill rate, margin, compliance
        teams:
          - Payroll & Finance
          - Billing & Invoicing
          - Finance & Margin
        questions:
          - Which clients are below target spread this month?
          - Where is margin leaking through missed timecard approvals?
          - What is gross margin by client and skill this quarter?
          - Which rate cards are out of line with the market wage benchmark and modeled bill rate?
          - How much did off-cycle adjustments cost us last pay run?
      - name: Workforce Operations Agent
        icon: genie
        summary: Ask about shift coverage, overtime and credential gaps at shift latency.
        feeds:
          - UKG Pro WFM
          - Symplr Credentialing
          - State Licence Boards
          - Conformed worker, req, client
        teams:
          - Workforce Operations
          - Schedulers
          - Redeployment
        questions:
          - Which open shifts have no covered worker for tomorrow?
          - Which workers are approaching an overtime threshold this week?
          - Which placements have a credential expiring in the next 30 days?
          - Which assignments are at highest risk of early termination?
          - Where is overtime creep eroding margin by client?
      - name: Compliance & Credentials Agent
        icon: genie
        summary: Answer credential, background and eligibility questions across active placements.
        feeds:
          - Symplr Credentialing
          - Checkr Background
          - Everify I-9
          - Fill rate, margin, compliance
        teams:
          - Compliance & Risk
          - Background & Screening
          - Audit & Reporting
        questions:
          - How many active placements have a lapsed licence right now?
          - Which background checks are pending past SLA?
          - Which placements are missing a completed I-9?
          - What is our EEO pipeline diversity by client this quarter?
          - Which credentials must renew before the next shift starts?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Candidate Matching
        short: Recruiting
        icon: people
        summary: Skills and availability scored against open reqs before submittal.
        problem: Recruiters read resumes and reqs by hand across the ATS and job boards, so strong candidates sit unseen while low-fit submittals burn the client's screening time and the req ages.
        who_benefits: Recruiting & Sales
        how_built: ATS, VMS and job-board data land through Lakeflow and conform on Delta Lake; match models in Model Serving score skills and availability against open reqs inside the Recruiter Workbench.
        components:
          - Recruiter Workbench
          - Model Serving
          - Bullhorn ATS/CRM
          - Feature Store
          - Delta Lake
        stories:
          - title: How DXC built a GenAI workforce agent on Lakebase
            url: https://www.databricks.com/customers/dxc/lakebase
          - title: 104 Corporation personalizes talent acquisition to improve hiring
            url: https://www.databricks.com/customers/104-corporation
      - name: Time-to-Fill
        short: Operations
        icon: chart
        summary: Req ageing decomposed by client approval, sourcing and interview stages.
        problem: Reqs age for reasons buried across client approvals, sourcing and interview loops, so managers argue over anecdotes instead of seeing where each requisition actually stalls.
        who_benefits: Recruiting & Sales
        how_built: Requisition events from the ATS and VMS conform under Unity Catalog and decompose into stage-level metrics in AI/BI, so time-to-fill breaks out by client, stage and recruiter on certified views.
        components:
          - Recruiter Workbench
          - Beeline VMS
          - Unity Catalog
          - AI/BI
          - Genie One
        stories:
          - title: LA County cuts hiring bottlenecks with a unified lakehouse
            url: https://www.databricks.com/customers/la-county
      - name: Credential Monitoring
        short: Compliance
        icon: gavel
        summary: Expiring licences flagged before they block placement or shift.
        problem: Licence renewals, background-check status and I-9 completion or reverification each run on different clocks across thousands of active placements, and one missed credential can pull a worker off a client shift or void a healthcare contract.
        who_benefits: Compliance & Risk
        how_built: Credential and licence-board feeds land through Lakeflow and conform under Unity Catalog; expiry rules surface on the Compliance Dashboard so renewals dispatch before a placement is blocked.
        components:
          - Compliance Dashboard
          - Symplr Credentialing
          - State Licence Boards
          - Lakeflow
          - Unity Catalog
        stories:
          - title: BAYADA builds an AI-ready platform for compliance monitoring
            url: https://www.databricks.com/customers/bayada
      - name: Overtime Control
        short: Workforce
        icon: stream
        summary: Overtime hours forecast and flagged against client scheduling rules for scheduler action.
        problem: Overtime accrues shift by shift against client-specific rules, and by the time it lands on the invoice the margin on the assignment is already gone and hard to claw back.
        who_benefits: Workforce Operations
        how_built: Timecard and schedule data stream into Lakehouse//RT and feed overtime-forecast models in Model Serving, so the Coverage Console flags at-risk shifts before the hours are worked.
        components:
          - Coverage Console
          - UKG Pro WFM
          - Lakehouse//RT
          - Model Serving
          - AI/BI
      - name: Payroll Leakage
        short: Finance
        icon: erp
        summary: Bill-pay mismatches and missed timecard approvals surfaced before close.
        problem: Bill-pay spread leaks through missed timecard approvals, wrong rate cards and off-cycle adjustments, and the gap only surfaces after payroll has run and the client has been invoiced.
        who_benefits: Payroll & Finance
        how_built: Payroll, timecard and VMS rate data conform on Delta Lake and reconcile in the Margin Analyzer, with AI/BI surfacing bill-pay mismatches before the pay run closes.
        components:
          - Margin Analyzer
          - ADP Workforce Now
          - Delta Lake
          - AI/BI
          - Unity Catalog
        stories:
          - title: BAYADA validates complex payroll on a governed lakehouse
            url: https://www.databricks.com/customers/bayada
      - name: Client Profitability
        short: Finance
        icon: market
        summary: Gross margin by client account including rebates and chargebacks.
        problem: Gross margin by client hides behind rebates, chargebacks and spread that live in different systems, so account teams renew low-margin clients without ever seeing the true number.
        who_benefits: Payroll & Finance
        how_built: Payroll, billing and placement data conform under Unity Catalog into certified margin metrics in the Margin Analyzer, so profitability by client and skill is one governed number in AI/BI.
        components:
          - Margin Analyzer
          - Unity Catalog
          - AI/BI
          - ADP Workforce Now
          - Genie One
      - name: Attrition Prediction
        short: Retention
        icon: custlake
        summary: Assignment completion and extension likelihood scored per worker.
        problem: Contract workers churn or decline extensions with little warning, leaving the client short mid-assignment and forcing a rushed, expensive backfill that the recruiter absorbs.
        who_benefits: Workforce Operations
        how_built: Assignment, timecard and engagement features build in Feature Store and score through attrition models in Model Serving, with runs tracked in MLflow so redeployment is planned before a worker leaves.
        components:
          - Coverage Console
          - Feature Store
          - Model Serving
          - MLflow
          - Lakehouse//RT
        stories:
          - title: Addressing HR's widening capacity gap with AI
            url: https://www.databricks.com/blog/addressing-hrs-widening-capacity-gap-ai
      - name: Rate Benchmarking
        short: Pricing
        icon: chart
        summary: Pay rates benchmarked against market wages, with indicative bill rates derived from employer costs and target margin by skill and metro.
        problem: Bill and pay rates are set from stale spreadsheets and gut feel, so recruiters lose deals by overpricing scarce skills and leave margin on the table where the market has already moved.
        who_benefits: Recruiting & Sales
        how_built: Internal pay rates join external market wage benchmarks under Unity Catalog and serve in AI/BI, with an indicative bill-rate bridge from employer costs and target margin, so recruiters see market spread by skill and metro inside the Recruiter Workbench.
        components:
          - Recruiter Workbench
          - Lightcast Labour Market
          - LinkedIn Talent Insights
          - Unity Catalog
          - AI/BI
        stories:
          - title: Crafting a data-driven talent intelligence strategy
            url: https://www.databricks.com/blog/crafting-data-driven-talent-intelligence-strategy-healthcare
      - name: DEI Hiring Analytics
        short: Compliance
        icon: gavel
        summary: Pipeline diversity metrics for client and regulatory reporting.
        problem: Diversity metrics for client and regulatory reporting are stitched together by hand from ATS exports, so pipeline gaps and reporting errors surface only when an audit is already underway.
        who_benefits: Compliance & Risk
        how_built: ATS pipeline data conforms under Unity Catalog into governed diversity metrics in AI/BI, so EEO and client DEI reports run from the same certified data behind the Compliance Dashboard.
        components:
          - Compliance Dashboard
          - Greenhouse
          - Unity Catalog
          - AI/BI
          - Data Products
        stories:
          - title: LA County democratizes hiring data to compete for diverse talent
            url: https://www.databricks.com/customers/la-county
      - name: Skills Taxonomy
        short: Talent
        icon: product
        summary: Skills inferred from placements and training for future req matching.
        problem: Skills live as free text in resumes, LMS records and placement notes, so the same capability is named a dozen ways and no two systems agree on what a worker can actually do.
        who_benefits: Recruiting & Sales
        how_built: Placement, training and resume text normalize with AI Functions into a governed skills taxonomy under Unity Catalog, feeding candidate features in Feature Store for future req matching.
        components:
          - AI Functions
          - Unity Catalog
          - Feature Store
          - Cornerstone LMS
          - Delta Lake
        stories:
          - title: DXC scales a competency agent across 130,000 consultants
            url: https://www.databricks.com/customers/dxc/lakebase
          - title: Crafting a data-driven talent intelligence strategy
            url: https://www.databricks.com/blog/crafting-data-driven-talent-intelligence-strategy-healthcare
medallion:
  Bronze:
    short: Raw HR and placement feeds
    summary: ATS applications, VMS requisitions, timecards, payroll runs and compliance documents, landed exactly as received so a placement margin or a credential can always be replayed.
  Silver:
    short: Conformed worker, req, client
    summary: Candidates, requisitions, placements and time entries resolved into single conformed entities across ATS, VMS and payroll, with assignment dates stitched to one engagement.
  Gold:
    short: Fill rate, margin, compliance
    summary: 'Contracted products sales and finance run on: time-to-fill, gross margin by client, credential expiry risk, overtime and bill-pay spread by skill.'
