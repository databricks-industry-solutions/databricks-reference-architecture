        short: 3rd-party harness
        summary: OpenAI's coding harness connected over MCP, governed at runtime by Unity Gateway rather than trusted by configuration.
      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Mill Operations Agent
        icon: genie
        summary: Ask about OEE, downtime and throughput by machine and line in plain language.
        feeds:
          - Valmet DNA DCS
          - AVEVA PI Historian
          - Kiwiplan MES
          - OEE, yield, OTIF, emissions
        teams:
          - Mill Operations
          - Executive Team
          - Shift & DCS operators
        questions:
          - What was OEE by machine and line yesterday, and where did downtime go?
          - Which downtime reasons cost the most tonnes this week?
          - What is throughput by grade against plan right now?
          - Which machines had the most sheet breaks this shift?
          - What is unit cost by machine and grade last week?
      - name: Quality & Grade Agent
        icon: genie
        summary: Explore basis weight, moisture, defects and grade give-away by reel.
        feeds:
          - Valmet IQ QCS
          - AVEVA PI Historian
          - Greycon opt-Studio
          - Conformed reel, order, asset
        teams:
          - Process & QA
          - Quality
          - Process engineering
        questions:
          - What is first-pass yield and grade give-away by grade this month?
          - Which reels are trending off-spec on basis weight or moisture?
          - Which defect types are most common by machine and grade?
          - Where is trim loss highest across the order book?
          - Which set-points correlate with the current quality drift?
      - name: Supply & OTIF Agent
        icon: genie
        summary: Answer demand, order-cycle and OTIF-risk questions across the network.
        feeds:
          - SAP S/4HANA
          - Blue Yonder TMS
          - Amtech ERP
          - OEE, yield, OTIF, emissions
        teams:
          - Supply Chain
          - Demand & S&OP
          - Logistics
        questions:
          - Which orders are at risk of missing OTIF this week?
          - What is order cycle time by grade and customer?
          - Where is demand outrunning available machine time and trim?
          - Which customers drive the most claims and short shipments?
          - What is forecast accuracy by grade versus last quarter?
      - name: Energy & Fiber Agent
        icon: genie
        summary: Ask about energy intensity, emissions and fiber-origin compliance.
        feeds:
          - Recovery Boiler DCS
          - Energy & Utilities
          - EUDR / Fiber Trace
          - OEE, yield, OTIF, emissions
        teams:
          - Energy & ESG
          - Energy management
          - Fiber sourcing
        questions:
          - What is energy intensity per tonne by mill and grade this month?
          - Which mill and grade drove this month's Scope 1-2 emissions?
          - Where can recovery-boiler and steam set-points cut energy cost?
          - Which fiber consignments lack complete EUDR chain-of-custody?
          - What is Scope 3 emissions per tonne by fiber source?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Machine & Line OEE
        short: Production
        icon: gauge
        summary: Paper-machine and converting-line OEE and downtime attacked at the machine and line, with losses attributed to the right area and shift in near real time.
        problem: OEE and downtime are reviewed the next morning from manual logs, so a losing shift is explained after the tonnes are gone rather than corrected while the run is live.
        who_benefits: Mill Operations
        how_built: DCS, historian and MES feeds stream into Lakehouse//RT; OEE and downtime are computed on certified Metric Views and surfaced live on the Mill Control Tower with break-risk scored in Model Serving.
        components:
          - Mill Control Tower
          - Lakehouse//RT
          - Valmet DNA DCS
          - AI/BI
          - Model Serving
        stories:
          - title: 'Databricks: agents for production lines and in-shift OEE recovery'
            url: https://www.databricks.com/blog/agents-production-lines-trusted-decisions-real-time
          - title: Multi-factory OEE solution accelerator
            url: https://www.databricks.com/blog/2022/11/29/solution-accelerator-multi-factory-overall-equipment-effectiveness.html
      - name: Dryer & Roll Reliability
        short: Reliability
        icon: iot
        summary: Failures on dryers, rolls, pumps and drives predicted from sensor and historian data so an unplanned break becomes a planned maintenance window.
        problem: An unplanned failure on a dryer or drive tears the sheet and stops the machine for hours; maintenance run on a calendar fixes healthy assets and misses the ones about to fail.
        who_benefits: Mill Operations
        how_built: Historian vibration and process tags feed remaining-useful-life models tracked in MLflow and scored in Model Serving; predicted failures raise Maximo work orders from the Reliability Watchtower.
        components:
          - Reliability Watchtower
          - AVEVA PI Historian
          - IBM Maximo EAM
          - Model Serving
          - MLflow
          - Lakehouse//RT
        stories:
          - title: Predictive maintenance on paper and pulp dryers (DeepIQ + Databricks)
            url: https://www.databricks.com/blog/2020/07/28/industrial-iot-analytics-with-deepiq-datastudio-and-databricks.html
          - title: Predictive maintenance on the Databricks Lakehouse
            url: https://www.databricks.com/blog/what-is-predictive-maintenance
      - name: Web-Break & Edge-Crack Detection
        short: Runnability
        icon: stream
        summary: Web breaks, edge cracks and surface defects predicted from wet-end, dryer and inspection data so the operator stabilises the machine before the sheet lets go.
        problem: A sheet break costs tens of minutes of production and a threading effort, and the conditions that cause it hide in high-frequency wet-end and dryer data no operator can watch by eye.
        who_benefits: Process & QA
        how_built: Historian, QCS and existing web-inspection defect outputs are conformed and served in Lakehouse//RT; break-risk models use Feature Store features and score in Model Serving, warning the operator through the Quality & Grade Cockpit before a break.
        components:
          - Quality & Grade Cockpit
          - AVEVA PI Historian
          - Model Serving
          - Feature Store
          - Lakehouse//RT
        stories:
          - title: Databricks for Manufacturing
            url: https://www.databricks.com/solutions/industries/manufacturing-industry-solutions
          - title: What is Overall Equipment Effectiveness (OEE)?
            url: https://www.databricks.com/blog/what-is-overall-equipment-effectiveness
      - name: Off-Quality Root-Cause
        short: Quality
        icon: chart
        summary: Off-quality reels traced to the station and set-point that produced them, joining QCS, camera and process data.
        problem: Defects and off-spec reels are found at inspection or by the customer, and QCS and camera data live apart from the process record, so root cause is reconstructed by hand long after the reel is made.
        who_benefits: Process & QA
        how_built: QCS measurements and web-inspection images are conformed on the lakehouse; computer-vision and defect models trained with MLflow score in Model Serving, and AI Functions classify defect and complaint text at scale.
        components:
          - Quality & Grade Cockpit
          - Valmet IQ QCS
          - Model Serving
          - AI Functions
          - MLflow
        stories:
          - title: 'Corning: end-to-end ML and computer-vision defect detection on Databricks'
            url: https://www.databricks.com/blog/2023/01/05/how-corning-built-end-end-ml-databricks-lakehouse-platform.html
          - title: Corning accelerates manufacturing quality with the Databricks Platform
            url: https://www.databricks.com/customers/corning-mosaic-ai
      - name: Reel & Roll Inventory
        short: Inventory
        icon: sheet
        summary: Reel, roll and finished-goods inventory tuned to real order pull and aging rather than static safety-stock tables.
        problem: Reels and finished rolls pile up in some grades and stock out in others because safety stock is set from static tables, so working capital sits in slow-moving inventory while hot orders wait on machine time.
        who_benefits: Supply Chain
        how_built: Order, production and warehouse inventory data are conformed to certified Metric Views; aging and reorder models score in Model Serving and drive reel and roll positioning in the S&OP & OTIF Planner.
        components:
          - S&OP & OTIF Planner
          - SAP S/4HANA
          - Amtech ERP
          - Model Serving
          - AI/BI
      - name: Grade Demand & S&OP
        short: Planning
        icon: market
        summary: Demand forecast to grade and customer, balanced against machine time and trim so the mill plans what it can sell and make profitably.
        problem: Demand, machine capacity and trim are planned in separate tools, so the mill either builds inventory it cannot sell or misses orders it could have run, and forecast accuracy never improves.
        who_benefits: Supply Chain
        how_built: Order, shipment and price feeds are conformed to Gold; demand models score in Model Serving and feed the S&OP & OTIF Planner where capacity and trim are balanced on the same numbers finance reads.
        components:
          - S&OP & OTIF Planner
          - SAP S/4HANA
          - Greycon opt-Studio
          - Model Serving
          - AI/BI
        stories:
          - title: Mondelez scales SKU demand forecasting on Databricks (cross-industry example)
            url: https://www.databricks.com/customers/mondelez
          - title: Smarter supply chains with data and AI
            url: https://www.databricks.com/blog/smarter-supply-chains-data-and-ai-why-its-time-rethink-inventory-management
      - name: Order-to-Cash Working Capital
        short: Cash flow
        icon: globe
        summary: Cash tied up in reels, receivables and slow orders freed by connecting order-to-cash, delivery and claims on one set of numbers.
        problem: Working capital leaks across the order-to-cash cycle, late deliveries, disputed claims and reels waiting on trim, but order, shipment and receivables data sit in separate systems, so finance sees the cash impact only after the quarter closes.
        who_benefits: Supply Chain
        how_built: ERP order, receivables, warehouse and TMS feeds are joined in the lakehouse; order-cycle and claims models score in Model Serving and the S&OP & OTIF Planner flags the orders tying up cash in time to act.
        components:
          - S&OP & OTIF Planner
          - SAP S/4HANA
          - Salesforce CRM
          - Blue Yonder TMS
          - AI/BI
        stories:
          - title: Barilla streamlines manufacturing and supplier OTIF on Databricks
            url: https://www.databricks.com/customers/barilla
          - title: Digital supply chain reference architecture for manufacturing
            url: https://www.databricks.com/resources/architectures/manufacturing-digital-supply-chain-reference-architecture
      - name: Steam & Power per Tonne
        short: Energy
        icon: gauge
        summary: Steam, power and recovery-boiler operation optimised to cut energy per tonne, a major controllable cost, with recommendations evaluated against runnability constraints.
        problem: Energy is the mill's largest controllable cost, but steam and power are run to habit, and the levers that would cut them sit in DCS and metering data nobody optimises together.
        who_benefits: Energy & ESG
        how_built: Recovery-boiler, utility and historian data are conformed to Gold; energy models score in Model Serving and recommendations are surfaced on the Mill Control Tower against production targets.
        components:
          - Mill Control Tower
          - Recovery Boiler DCS
          - AVEVA PI Historian
          - Model Serving
          - AI/BI
        stories:
          - title: Shell optimises operations and energy with Databricks
            url: https://www.databricks.com/customers/shell
          - title: Sustainability reference architecture for manufacturing
            url: https://www.databricks.com/resources/architectures/sustainability-reference-architecture-for-manufacturing
      - name: Reel & Order Genealogy
        short: Traceability
        icon: product
        summary: Every reel and roll traced from furnish and machine run through converting to the customer order and shipment in one view.
        problem: When a claim or off-spec escape lands, tracing a finished roll back through converting, the machine run and the furnish means stitching MES, QCS and ERP exports by hand, and one genealogy answer can take days.
        who_benefits: Process & QA
        how_built: Machine, converting and order records resolve to common reel, roll and order keys under Unity Catalog on Delta Lake, so the Quality & Grade Cockpit shows full forward-and-back reel-to-order genealogy at once.
        components:
          - Quality & Grade Cockpit
          - Kiwiplan MES
          - SAP S/4HANA
          - Unity Catalog
          - Delta Lake
      - name: Fiber & Forestry Supply
        short: Supply
        icon: network
        summary: Wood and recovered-fiber supply planned and traced from forest and recycler to the fiber line, with deforestation-free due diligence built in.
        problem: Fiber is the mill's largest raw-material spend and a growing compliance exposure; harvest, procurement and recovered-fiber data are scattered, and EUDR due diligence is a manual paper chase.
        who_benefits: Supply Chain
        how_built: Forestry, scaling and recovered-fiber feeds are conformed on the lakehouse; supply and quality are read in AI/BI and Genie, and fiber-origin lineage under Unity Catalog supports EUDR chain-of-custody.
        components:
          - Trimble Forestry
          - EUDR / Fiber Trace
          - Unity Catalog
          - AI/BI
          - Genie
        stories:
          - title: Smarter supply chains with data and AI
            url: https://www.databricks.com/blog/smarter-supply-chains-data-and-ai-why-its-time-rethink-inventory-management
          - title: Digital supply chain reference architecture for manufacturing
            url: https://www.databricks.com/resources/architectures/manufacturing-digital-supply-chain-reference-architecture
medallion:
  Bronze:
    short: Raw mill and order feeds
    summary: DCS and historian tags from the paper machines and recovery boiler, converting-line and MES events, LIMS lab results, SAP order and shipment records and forestry scale tickets, landed exactly as received so a reel or a delay can be replayed as it stood.
  Silver:
    short: Conformed reel, order, asset
    summary: Reels, orders, grades and machines resolved into single conformed entities across the DCS, MES, quality and ERP estates, with grade codes and units of measure reconciled and reel genealogy stitched from fiber to finished roll.
  Gold:
    short: OEE, yield, OTIF, emissions
    summary: 'Contracted products the mill and commercial teams run on: OEE and downtime by machine and line, first-pass yield and grade give-away, OTIF and order cycle time, and energy intensity and Scope 1-3 emissions by tonne.'
