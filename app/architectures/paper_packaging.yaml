pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Executive Team
        mark: Genie One
        summary: The CEO and mill-group leadership on margin per tonne, capacity and the trade between fiber cost and energy; the CFO on unit cost and working capital tied up in reels and inventory; the COO on OEE, safety and the reliability of the machines the mill runs on.
        uses:
          - - Genie One
            - Ask what a machine or a grade cost last week, or where downtime went, without booking analyst time.
          - - AI/BI
            - OEE, unit cost, yield and OTIF on one certified set of Metric Views.
          - - Unity Catalog
            - Certification and the business glossary, so "OEE" and "yield" mean one thing across every mill.
        sub:
          - name: CEO & Group
            cares: margin per tonne, capacity and the fiber-versus-energy trade.
          - name: CFO & Finance
            cares: unit cost and working capital tied up in reels and inventory.
          - name: COO
            cares: OEE, safety and machine reliability across the fleet of mills.
        ucs:
          - Machine & Line OEE
          - Grade Demand & S&OP
          - Steam & Power per Tonne
          - Order-to-Cash Working Capital
      - name: Mill Operations
        mark: Lakehouse//RT
        summary: Shift managers and DCS operators running the paper machines and recovery boiler, converting and finishing on corrugator and folding-carton lines, and reliability engineering on the assets whose failure stops the machine.
        uses:
          - - Mill Control Tower
            - Live OEE, downtime and throughput by machine and line at the latency a run moves at.
          - - Lakehouse//RT
            - DCS, historian and MES state streamed for real-time operations.
          - - Model Serving
            - Break-risk and reliability models scored against live machine state.
        sub:
          - name: Shift & DCS operators
            cares: the paper machine and recovery boiler on the current run.
          - name: Converting & finishing
            cares: corrugator and folding-carton line performance.
          - name: Reliability eng
            cares: the assets whose failure stops the machine.
        ucs:
          - Dryer & Roll Reliability
          - Machine & Line OEE
          - Web-Break & Edge-Crack Detection
          - Steam & Power per Tonne
      - name: Process & QA
        core: true
        mark: Model Serving
        summary: Process engineers on digester, refiner and dryer set-points, quality on basis weight, moisture and strength against grade spec, and R&D and fiber on furnish, additives and new-grade development.
        uses:
          - - Quality & Grade Cockpit
            - Basis weight, moisture and defect trends against grade spec by reel.
          - - Model Serving
            - Break-risk, defect and quality models scored as supervisory recommendations the operator or approved policy accepts.
          - - AI Functions
            - Lab notes, defect images and complaints classified at scale from unstructured data.
        sub:
          - name: Process engineering
            cares: digester, refiner and dryer set-points.
          - name: Quality
            cares: basis weight, moisture and strength against grade spec.
          - name: R&D & fiber
            cares: furnish, additives and new-grade development.
        ucs:
          - Off-Quality Root-Cause
          - Web-Break & Edge-Crack Detection
          - Reel & Order Genealogy
      - name: Supply Chain
        mark: AI/BI
        summary: Demand planning and S&OP balancing orders against machine time and trim, order-to-cash and customer service on order status and claims, and logistics on warehouse, carrier and OTIF to the converter and brand owner.
        uses:
          - - AI/BI
            - Demand, order cycle time and OTIF on the definitions the commercial team already reports.
          - - Model Serving
            - Demand and OTIF-risk models scored into planning and dispatch.
          - - Genie One
            - Ask which orders are at risk of missing OTIF this week.
        sub:
          - name: Demand & S&OP
            cares: orders balanced against machine time and trim.
          - name: Order-to-cash & service
            cares: order status, claims and credit.
          - name: Logistics
            cares: warehouse, carrier and OTIF to the customer.
        ucs:
          - Grade Demand & S&OP
          - Reel & Roll Inventory
          - Order-to-Cash Working Capital
          - Fiber & Forestry Supply
      - name: Energy & ESG
        mark: Genie One
        summary: Energy managers on steam, power and the recovery boiler, ESG and sustainability on Scope 1-3 emissions and CSRD reporting, and fiber sourcing on wood, recovered fiber and deforestation-free supply.
        uses:
          - - AI/BI
            - Energy intensity and Scope 1-3 emissions per tonne on certified views.
          - - Genie One
            - Ask which mill and grade drove this month's emissions and energy cost.
          - - Unity Catalog
            - Fiber-origin and emissions lineage governed for EUDR and CSRD audit.
        sub:
          - name: Energy management
            cares: steam, power and the recovery boiler.
          - name: ESG & sustainability
            cares: Scope 1-3 emissions and CSRD reporting.
          - name: Fiber sourcing
            cares: wood, recovered fiber and deforestation-free supply.
        ucs:
          - Steam & Power per Tonne
          - Reel & Order Genealogy
          - Fiber & Forestry Supply
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land DCS and historian tags over OPC UA, MES and converting events, LIMS results and SAP order and shipment feeds; own the Bronze to Silver path and the pager when the mill tables stall.
        uses:
          - - Lakeflow Connect
            - Managed connectors for SAP, MES, LIMS and quality sources.
          - - Auto Loader
            - Historian and converting-line event files landed incrementally into Bronze.
          - - Lakewatch
            - Freshness on the OEE and order tables ops and planning read each morning.
      - name: Data Scientists
        mark: MLflow
        summary: Sheet-break, defect, remaining-useful-life and demand models off historian, LIMS and order data, and whether they still hold as grades and furnish change.
        uses:
          - - Feature Store
            - Machine, reel and grade features read identically in training and serving.
          - - MLflow
            - Every break-risk and reliability model tracked for audit and reproduction.
          - - Model Serving
            - Break-risk, defect and demand models scored in the operational path.
      - name: App Developers
        mark: Apps
        summary: Ship the mill-control, reliability, quality and planning applications the business works in, hosted next to governed data.
        uses:
          - - Apps
            - Operational screens with no separate web tier to run or secure.
          - - Lakebase
            - Serverless Postgres for run-state, work orders and planning writes.
          - - Agent Bricks
            - Agents that draft a work order or a recovery action against governed tools.
