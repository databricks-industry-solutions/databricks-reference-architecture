name: Real Estate
description: 'Property investment, development and operations: leasing, valuations, construction progress and tenant experience across commercial and residential portfolios.'
sources:
  - name: Property & ERP
    icon: erp
    simplified: 2
    tiles:
      - name: Yardi Voyager
        icon: erp
        summary: Property accounting, AP/AR and CAM reconciliations for operating portfolios.
        citations:
          - yardi
        category: Property Management & Accounting (ERP)
        what_it_is: Property accounting, AP/AR and CAM reconciliations for operating portfolios, the financial system of record per asset.
        who_uses_it: Lease Administration, Portfolio Manager and Construction Finance teams.
        data_out:
          batch:
            types:
              - structured
            volume: millions of GL and lease ledger rows
            interval: Nightly close batch
      - name: MRI Software
        icon: db
        summary: Commercial lease administration, billing and investor reporting.
        citations:
          - mri
        category: Lease Administration & Investor Reporting
        what_it_is: Commercial lease administration, billing and investor reporting across the operating portfolio.
        who_uses_it: Lease Administration, Head of Investor Relations and Valuations teams.
        data_out:
          batch:
            types:
              - structured
            volume: hundreds of thousands of lease and billing rows
            interval: Daily
      - name: SAP Real Estate Mgmt
        icon: erp
        summary: Corporate real estate, cost allocations and IFRS lease accounting.
        citations:
          - sap-rem
        category: Corporate Real Estate & Lease Accounting
        what_it_is: Corporate real estate, cost allocations and IFRS 16 / ASC 842 lease accounting.
        who_uses_it: CFO & Treasury, Lease Administration and Governance Engineering teams.
        data_out:
          batch:
            types:
              - structured
            volume: millions of cost-allocation and lease rows
            interval: Nightly ERP extract
  - name: Leasing & CRM
    icon: custlake
    tiles:
      - name: Salesforce Real Estate
        icon: custlake
        summary: Broker pipelines, tour activity and lease negotiation stages.
        citations:
          - sf-real-estate
        category: Customer Relationship Management (CRM)
        what_it_is: Broker pipelines, tour activity and lease negotiation stages for the leasing deal desk.
        who_uses_it: Brokerage Team, Leasing Director and Head of Investor Relations teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: hundreds of thousands of pipeline and activity rows
            interval: Hourly CRM sync
      - name: VTS Lease Platform
        icon: partner
        summary: Availabilities, proposals and executed leases for commercial assets.
        citations:
          - vts
        category: Commercial Leasing Platform
        what_it_is: Availabilities, proposals and executed leases for commercial assets across the leasing lifecycle.
        who_uses_it: Leasing Director, Brokerage Team and Lease Counsel teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: hundreds of thousands of availability and proposal rows
            interval: Hourly sync
      - name: ARGUS Enterprise
        core: true
        icon: chart
        summary: Discounted cash flow valuation and hold-sell analysis for commercial assets.
        citations:
          - buildout
        category: CRE Valuation & Cash Flow Modelling
        what_it_is: Discounted cash flow valuation and hold-sell analysis for commercial assets used in underwriting.
        who_uses_it: Valuations, Portfolio Manager and Rent & Valuation Modelling teams.
        data_out:
          batch:
            types:
              - structured
            volume: thousands of valuation model outputs
            interval: Per valuation cycle
  - name: Construction & Dev
    icon: sheet
    simplified: 2
    tiles:
      - name: Procore Project Mgmt
        icon: sheet
        summary: Budgets, schedules, RFIs and daily logs from development sites.
        citations:
          - procore
        category: Construction Project Management
        what_it_is: Budgets, schedules, RFIs and daily logs from development sites, the project system of record.
        who_uses_it: Project Controls, Development Director and Construction Finance teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: hundreds of thousands of budget and log records
            interval: Daily site logs
      - name: Oracle Aconex
        icon: notebook
        summary: Document transmittals, submittals and design revisions.
        citations:
          - aconex
        category: Construction Document Management
        what_it_is: Document transmittals, submittals and design revisions across the development lifecycle.
        who_uses_it: Project Controls, Development Director and Application Engineering teams.
        data_out:
          batch:
            types:
              - semi-structured
              - unstructured
            volume: millions of documents and transmittals
            interval: Daily
      - name: CoStar Market Data
        core: true
        icon: chart
        summary: Comparable rents, vacancy and transaction comps for underwriting.
        citations:
          - costar
        category: Property Listing / Market Data
        what_it_is: Comparable rents, vacancy and transaction comps for underwriting and valuation.
        who_uses_it: Valuations, Portfolio Manager and Rent & Valuation Modelling teams.
        data_out:
          batch:
            types:
              - structured
            volume: millions of comp and market rows
            interval: Daily market feed
  - name: Operations & IoT
    icon: iot
    tiles:
      - name: Honeywell Forge BMS
        icon: iot
        summary: HVAC, access and energy telemetry from building management systems.
        citations:
          - honeywell-forge
        category: Building Management System (BMS)
        what_it_is: HVAC, access and energy telemetry from building management systems across the operating portfolio.
        who_uses_it: Chief Engineer, Energy Optimisation and Facilities Management teams.
        data_out:
          stream:
            types:
              - structured
            volume: tens of thousands of meter and sensor points/min
