agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Portfolio & NOI Agent
        icon: genie
        summary: Ask about net operating income, occupancy and capex by asset and fund in plain language.
        feeds:
          - Yardi Voyager
          - MRI Software
          - Investor Reporting Mart
          - NOI, occupancy, capex
        teams:
          - Fund & Asset Leadership
          - Asset Management
          - Portfolio Manager
        questions:
          - What was same-store NOI by asset last quarter?
          - Which assets missed their budgeted rent steps this year?
          - How does occupancy trend by market and property type?
          - Where is capex per square foot running above plan?
          - Which funds are most exposed to upcoming lease expirations?
      - name: Leasing & Retention Agent
        icon: genie
        summary: Explore pipeline, tour conversion, time-to-lease and tenant churn risk.
        feeds:
          - Salesforce Real Estate
          - VTS Lease Platform
          - ServiceChannel FM
          - Conformed asset, lease
        teams:
          - Leasing & Brokerage
          - Asset Management
          - Brokerage Team
        questions:
          - What is time-to-lease by asset and market this quarter?
          - Which brokerage teams have the highest tour-to-lease conversion?
          - Which tenants are at highest churn risk before renewal?
          - Where is net effective rent trending below the market comp?
          - Which proposals are at risk of expiring options this month?
      - name: Development & Capex Agent
        icon: genie
        summary: Answer questions on draw schedules, cost-to-complete and development IRR against approved project cash flows and lender covenants.
        feeds:
          - Procore Project Mgmt
          - Oracle Aconex
          - Investor Reporting Mart
          - NOI, occupancy, capex
        teams:
          - Development
          - Development Director
          - Construction Finance
        questions:
          - Which projects are over budget or behind schedule right now?
          - What is cost-to-complete versus the approved budget by project?
          - How does development IRR compare across the active pipeline?
          - Which draws are approaching a covenant threshold?
          - Where is contractor performance dragging the schedule?
      - name: Operations & Energy Agent
        icon: genie
        summary: Ask about work orders, SLA breaches and energy intensity across the portfolio.
        feeds:
          - Honeywell Forge BMS
          - ServiceChannel FM
          - Measurabl ESG
          - Conformed asset, lease
        teams:
          - Property Operations
          - Chief Engineer
          - ESG & Sustainability
        questions:
          - Which assets have the most open work orders and SLA breaches?
          - Where is energy intensity highest per square foot this month?
          - Which buildings are missing ENERGY STAR or ESG disclosures?
          - How does operating cost per square foot compare across the portfolio?
          - Which HVAC assets show anomalies against occupancy schedules?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Rent Forecasting
        short: Underwriting
        icon: chart
        summary: Market rent and renewal probability scored with comps and tenant history.
        problem: Market rent and renewal outcomes are guessed from stale comps and last year's rent roll, so underwriting and budgeted rent steps rest on a number no one can defend per asset.
        who_benefits: Asset Management
        how_built: Comps, tenant history and market signals are engineered in Feature Store and scored through Model Serving, landing renewal probability and market rent on Portfolio Command.
        components:
          - Portfolio Command
          - CoStar Market Data
          - Model Serving
          - Feature Store
          - MLflow
        stories:
          - title: Reonomy modernizes real estate with data and ML
            url: https://www.databricks.com/customers/reonomy
      - name: Tenant Retention
        short: Occupancy
        icon: custlake
        summary: Churn risk surfaced from service tickets and lease economics before expiration.
        problem: Tenants leave at renewal after a year of unresolved service tickets and off-market rent, but that churn signal is buried in FM logs and lease economics no one joins until the notice lands.
        who_benefits: Asset Management
        how_built: Service-ticket history and lease economics are joined and scored in Model Serving, surfacing churn risk on the Leasing Pipeline before renewal windows open.
        components:
          - Leasing Pipeline
          - ServiceChannel FM
          - CustomerLake
          - Model Serving
          - AI/BI
        stories:
          - title: Cushman & Wakefield builds an enterprise AI core on Databricks
            url: https://www.databricks.com/blog/your-ai-ready-your-data-foundation-probably-isnt
      - name: Capex Planning
        short: Investment
        icon: sheet
        summary: Replacement and repositioning projects ranked by NOI impact and risk.
        problem: Capital plans are built in spreadsheets per asset, so replacement and repositioning projects compete for budget without a comparable view of NOI impact or risk across the portfolio.
        who_benefits: Fund & Asset Leadership
        how_built: Work-order, condition and NOI data are conformed on Delta Lake under Unity Catalog and ranked in AI/BI, so capex projects sort by NOI impact on Portfolio Command.
        components:
          - Portfolio Command
          - Yardi Voyager
          - AI/BI
          - Unity Catalog
          - Delta Lake
      - name: Energy Optimisation
        short: Operations
        icon: iot
        summary: HVAC and lighting schedules tuned to occupancy and tariff signals.
        problem: HVAC and lighting run to fixed schedules regardless of occupancy or tariff, so energy burns in empty floors and peak-price windows while operating cost per square foot and ESG targets slip.
        who_benefits: Property Operations
        how_built: BMS telemetry and tariff signals feed optimisation models scored in Model Serving, and approved setpoint schedules are written back to Honeywell Forge BMS from the Operations Hub.
        components:
          - Operations Hub
          - Honeywell Forge BMS
          - Model Serving
          - Lakehouse//RT
          - Measurabl ESG
        stories:
          - title: Colas drives efficiency and cuts energy use with Databricks
            url: https://www.databricks.com/customers/colas
          - title: TK Elevator delivers service intelligence across connected buildings
            url: https://www.databricks.com/customers/tke-elevator
      - name: Development ROI
        short: Projects
        icon: product
        summary: Cost-to-complete and IRR tracked against lender covenants in real time.
        problem: Development budgets and schedules live in the project system while draws and covenants live in finance, so cost-to-complete and IRR are reconciled by hand and slippage surfaces only at the lender report.
        who_benefits: Development
        how_built: Procore budget, schedule and draw data land through Lakeflow and are joined to finance-approved project cash flows and lender covenant terms in AI/BI, so cost-to-complete and IRR update live on the Development Tracker.
        components:
          - Development Tracker
          - Procore Project Mgmt
          - Lakeflow
          - AI/BI
          - Delta Lake
        stories:
          - title: Trackunit eliminates downtime for the construction industry
            url: https://www.databricks.com/customers/trackunit
      - name: Lease Abstraction
        short: Legal
        icon: gavel
        summary: Critical dates and options extracted from abstracts with audit lineage.
        problem: Critical dates, options and clauses sit in thousands of PDF leases in varied formats and languages, so abstraction is manual and slow and a missed option date is a real financial loss.
        who_benefits: Leasing & Brokerage
        how_built: Lease PDFs are extracted with AI Functions and Agent Bricks into governed records under Unity Catalog, with lineage back to the source clause and Genie for portfolio-level questions.
        components:
          - Leasing Pipeline
          - AI Functions
          - Agent Bricks
          - Unity Catalog
          - Genie One
        stories:
          - title: JLL turns lease data into governed insights with Genie and AI/BI
            url: https://www.databricks.com/customers/jll/dealsumm
      - name: CAM Reconciliation
        short: Finance
        icon: erp
        summary: Operating expense pools reconciled before tenant true-ups post.
        problem: Operating-expense pools are reconciled against hundreds of lease recovery clauses by hand each year, so CAM true-ups post late and disputes erode the recoveries the budget assumed.
        who_benefits: Property Operations
        how_built: Expense ledgers and lease recovery terms are conformed on Delta Lake and reconciled in AI/BI, so CAM pools tie out before true-ups post from Yardi Voyager.
        components:
          - Operations Hub
          - Yardi Voyager
          - MRI Software
          - Delta Lake
          - AI/BI
      - name: Portfolio Risk
        short: Climate
        icon: globe
        summary: Flood and hazard exposure aggregated for insurance and disclosure.
        problem: Flood, wildfire and heat exposure is assessed asset by asset at insurance renewal, so the portfolio's aggregate climate risk and its effect on premiums and disclosure is never seen whole.
        who_benefits: Fund & Asset Leadership
        how_built: Hazard layers are joined to the asset register with H3 spatial indexing in Apache Spark and aggregated in AI/BI, so climate exposure rolls up by fund on Portfolio Command.
        components:
          - Portfolio Command
          - Flood & Hazard Layers
          - Apache Spark
          - AI/BI
          - Delta Lake
        stories:
          - title: Geospatial analytics and AI with Databricks and CARTO for JLL
            url: https://www.databricks.com/blog/2021/12/09/announcing-cartos-spatial-extension-for-databricks-powering-geospatial-analysis-for-jll.html
      - name: Broker Performance
        short: Leasing
        icon: partner
        summary: Tour conversion and time-to-lease compared across brokerage teams.
        problem: Tour activity, proposals and executed leases sit in the CRM and the leasing platform separately, so time-to-lease and conversion are compared across brokerage teams from stale exports weeks late.
        who_benefits: Leasing & Brokerage
        how_built: Salesforce and VTS activity are conformed under Unity Catalog and surfaced in AI/BI, so tour conversion and time-to-lease compare across teams on the Leasing Pipeline.
        components:
          - Leasing Pipeline
          - VTS Lease Platform
          - Salesforce Real Estate
          - Unity Catalog
          - AI/BI
        stories:
          - title: Xanadu improves client engagement with Databricks
            url: https://www.databricks.com/customers/xanadu-realty
      - name: Investor Reporting
        short: Funds
        icon: share
        summary: NAV and waterfall metrics produced from the same tables finance closes on.
        problem: Fund NAV and waterfalls are rebuilt in spreadsheets each quarter from data finance already closed, so investor reporting lags weeks behind and every number is reconciled twice.
        who_benefits: Fund & Asset Leadership
        how_built: NAV and waterfall marts are queried in place from the Investor Reporting Mart under Unity Catalog and shared to investors over OpenSharing instead of quarterly PDFs.
        components:
          - Investor Reporting Mart
          - Unity Catalog
          - OpenSharing
          - Data Products
          - AI/BI
        stories:
          - title: JLL modernizes its data stack and analytics with Databricks
            url: https://www.databricks.com/customers/jll/training-and-certification
medallion:
  Bronze:
    short: Raw lease and ops
    summary: Lease abstracts, rent rolls, construction draws, work orders and utility meter reads, landed exactly as received so a square foot or a rent step can always be replayed as it stood.
  Silver:
    short: Conformed asset, lease
    summary: Properties, units, tenants and leases resolved into single conformed entities across ERP, CRM and operations systems, with CAM reconciliations stitched and occupancy reconciled to one unit record.
  Gold:
    short: NOI, occupancy, capex
    summary: 'Contracted products asset and portfolio leaders run on: net operating income, occupancy and retention, capex per square foot and development IRR.'
