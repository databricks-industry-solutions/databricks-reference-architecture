      - name: ServiceChannel FM
        core: true
        icon: stream
        summary: Work orders, contractor SLAs and tenant service requests.
        citations:
          - servicechannel
        category: Facilities Management (CMMS)
        what_it_is: Work orders, contractor SLAs and tenant service requests across managed properties.
        who_uses_it: Facilities Management, Chief Engineer and Retention & Risk teams.
        data_out:
          stream:
            types:
              - structured
              - semi-structured
            volume: thousands of work-order events/hour
            interval: Continuous (work orders)
      - name: Measurabl ESG
        icon: observ
        summary: Utility bills, ENERGY STAR scores and carbon disclosures by asset.
        citations:
          - measurabl
        category: ESG & Sustainability Reporting
        what_it_is: Utility bills, ENERGY STAR scores and carbon disclosures by asset for ESG reporting.
        who_uses_it: ESG & Sustainability, Chief Engineer and CFO & Treasury teams.
        data_out:
          batch:
            types:
              - structured
            volume: hundreds of thousands of utility and emissions rows
            interval: Monthly billing cycle
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Investor Reporting Mart
        icon: fed
        summary: Fund NAV and waterfall marts queried in place under Unity Catalog.
        category: Federated Data Warehouse / Marts
        what_it_is: Fund NAV and waterfall marts queried in place under Unity Catalog, avoiding a second copy of numbers finance already closed.
        who_uses_it: Head of Investor Relations, CFO & Treasury and Governance Engineering teams.
        data_out:
          batch:
            types:
              - structured
            volume: millions of NAV and waterfall rows queried in place
            interval: Query-time federation
  - name: Data Formats
    icon: zbraces
    tiles:
      - name: 'RESO Data Dictionary'
        icon: zbraces
        fmt: 'RESO'
        summary: 'RESO standard vocabulary for real-estate listing and property data.'
        spec_url: https://www.reso.org/data-dictionary/
      - name: 'RESO Web API'
        icon: zbraces
        fmt: 'API'
        summary: 'RESO OData-based API standard for accessing MLS listing data.'
        spec_url: https://www.reso.org/reso-web-api/
      - name: 'RESO Common Format'
        icon: zbraces
        fmt: 'RCF'
        summary: 'RESO standardised replication format for bulk listing data exchange.'
        spec_url: https://www.reso.org/
      - name: 'OSCRE IDM'
        icon: zbraces
        fmt: 'OSCRE'
        summary: 'OSCRE Industry Data Model for commercial real-estate information exchange.'
        spec_url: https://www.oscre.org/
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    simplified: 2
    tiles:
      - name: Municipal Permit APIs
        icon: api
        summary: Zoning and permit filings consumed inbound for development risk monitoring.
        category: Government Permit / Zoning Data
        what_it_is: Zoning and permit filings consumed inbound for development risk monitoring.
        who_uses_it: Project Controls, Development Director and Governance Engineering teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: thousands of permit filings/day
            interval: Scheduled API pulls
      - name: Walk Score / Transit
        icon: globe
        summary: Amenity and transit scores attached to assets for underwriting models.
        citations:
          - walkscore
        category: Location & Amenity Scoring
        what_it_is: Amenity and transit scores attached to assets for underwriting and valuation models.
        who_uses_it: Valuations, Rent & Valuation Modelling and Portfolio Manager teams.
        data_out:
          batch:
            types:
              - structured
            volume: scores per asset location
            interval: On refresh
      - name: Flood & Hazard Layers
        icon: globe
        summary: Climate hazard overlays normalised for portfolio risk scoring.
        category: Climate & Hazard Geospatial Data
        what_it_is: Flood, wildfire and heat hazard overlays normalised for portfolio climate-risk scoring.
        who_uses_it: Retention & Risk, CFO & Treasury and Data Scientists teams.
        data_out:
          batch:
            types:
              - semi-structured
              - unstructured
            volume: hazard raster and polygon layers
            interval: Periodic refresh
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Fund & Asset Leadership
        mark: Genie One
        summary: The CEO on portfolio NOI and occupancy; the CFO on capex per square foot and fund IRR when interest rates and cap rates shift the book.
        uses:
          - - Genie One
            - Ask what same-store NOI was last quarter without waiting on asset management.
          - - AI/BI
            - NOI, occupancy and capex on one certified set of Metric Views.
          - - Unity Catalog
            - Certification so "occupancy" means one thing across ERP and CRM.
        sub:
          - name: CEO
            cares: portfolio NOI, occupancy and the trade between growth and the cost of capital.
          - name: CFO & Treasury
            cares: capex per square foot, fund IRR and debt covenants as rates and cap rates move.
          - name: Head of Investor Relations
            cares: NAV, waterfalls and the reporting investors and lenders see each quarter.
        ucs:
          - Investor Reporting
          - Portfolio Risk
          - Capex Planning
          - Rent Forecasting
      - name: Asset Management
        mark: AI/BI
        summary: Portfolio managers on rent rolls, renewals and capital plans by asset, tracking same-store NOI and tenant retention against the annual budget.
        uses:
          - - Portfolio Command
            - Lease expirations and renewal risk on one surface.
          - - AI/BI
            - NOI and retention on governed definitions.
          - - Genie One
            - Ask which assets missed budgeted rent steps.
        sub:
          - name: Portfolio Manager
            cares: same-store NOI, renewal risk and the capital plan against the annual budget.
          - name: Lease Administration
            cares: rent steps, recoveries and critical dates across the rent roll.
          - name: Valuations
            cares: cap rates, comps and the mark on each asset at reporting.
        ucs:
          - Rent Forecasting
          - Tenant Retention
          - Capex Planning
          - CAM Reconciliation
      - name: Development
        mark: Lakehouse//RT
        summary: Development directors on draw schedules, milestones and contractor performance, watching cost-to-complete and development IRR against covenants.
        uses:
          - - Development Tracker
            - Budget and schedule variance before lender reports.
          - - Lakehouse//RT
            - Site progress at the latency a delay compounds at.
          - - Model Serving
            - Cost-to-complete models scored on draw history.
        sub:
          - name: Development Director
            cares: draw schedules, cost-to-complete and development IRR against covenants.
          - name: Project Controls
            cares: budget and schedule variance and contractor performance on site.
          - name: Construction Finance
            cares: lender draws, retention and the capital stack on each project.
        ucs:
          - Development ROI
          - Capex Planning
      - name: Leasing & Brokerage
        core: true
        mark: CustomerLake
        summary: Brokerage teams on pipeline, tour conversion and time-to-lease, tracking leasing velocity and net effective rent by asset and market.
        uses:
          - - Leasing Pipeline
            - Proposal status and comp rents before options expire.
          - - CustomerLake
            - Tenant prospects without copying CRM elsewhere.
          - - Apps
            - Tour and proposal workflows on governed data.
        sub:
          - name: Leasing Director
            cares: pipeline, net effective rent and time-to-lease by asset and market.
          - name: Brokerage Team
            cares: tour activity, proposals and conversion across the deal desk.
          - name: Lease Counsel
            cares: clauses, options and the abstract behind every executed lease.
        ucs:
          - Broker Performance
          - Lease Abstraction
          - Tenant Retention
      - name: Property Operations
        mark: Apps
        summary: Building engineers and FM on work orders, energy intensity and tenant satisfaction, watching SLA breaches and operating cost per square foot.
        uses:
          - - Operations Hub
            - Open tickets and SLA breaches before renewals.
          - - Apps
            - Technician mobile workflows on governed BMS data.
          - - Lakeflow
            - Utility and work-order feeds conformed for asset analytics.
        sub:
          - name: Chief Engineer
            cares: HVAC, energy intensity and equipment reliability across the building.
          - name: Facilities Management
            cares: work orders, contractor SLAs and tenant service requests.
          - name: ESG & Sustainability
            cares: ENERGY STAR, carbon disclosure and utility cost per square foot.
        ucs:
          - Energy Optimisation
          - CAM Reconciliation
          - Tenant Retention
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land the ERP lease, CRM, construction and BMS meter feeds; own the Bronze to Silver path and the pager when a portfolio pipeline breaks.
        uses:
          - - Lakeflow Connect
            - Managed connectors for property ERP, CRM and BMS sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on lease and meter feeds.
          - - Lakewatch
            - Freshness on the NOI and occupancy tables asset teams read.
        sub:
          - name: Ingestion Engineering
            cares: the ERP lease, CRM, construction and BMS feeds landing on time.
          - name: Platform Reliability
            cares: the pager and freshness on the NOI and occupancy tables.
          - name: Governance Engineering
            cares: Unity Catalog permissions and lineage across property systems.
        ucs:
          - Development ROI
          - CAM Reconciliation
          - Portfolio Risk
      - name: Data Scientists
        mark: MLflow
        summary: Rent-forecast, tenant-retention, energy-optimisation and cost-to-complete models, and whether they still hold six months after deployment across the portfolio.
        uses:
          - - Feature Store
            - Lease and market features read identically in training and serving.
          - - MLflow
            - Every rent and retention run tracked for audit and reproduction.
          - - Model Serving
            - Rent and churn models scored in the underwriting path.
        sub:
          - name: Rent & Valuation Modelling
            cares: market rent, renewal probability and asset valuation models.
          - name: Retention & Risk
            cares: tenant churn, credit and portfolio climate-risk scoring.
          - name: Energy Optimisation
            cares: occupancy and tariff-aware HVAC and lighting models.
        ucs:
          - Rent Forecasting
          - Tenant Retention
          - Energy Optimisation
      - name: App Developers
        mark: Apps
        summary: Ship the portfolio command, development tracker and operations applications asset and FM teams work in, hosted next to governed property data.
        uses:
          - - Apps
            - Operational screens with no separate web tier to run or secure.
          - - Lakebase
            - Serverless Postgres for work-order state and governed writes.
          - - Agent Bricks
            - Agents that draft a lease abstract against governed tools.
        sub:
          - name: Application Engineering
            cares: the portfolio, leasing and operations screens teams work in.
          - name: Workflow & Writeback
            cares: governed writes back to Yardi, BMS and FM systems.
          - name: Agent Engineering
            cares: agents that draft a lease abstract against governed tools.
        ucs:
          - Lease Abstraction
          - Broker Performance
          - Investor Reporting
