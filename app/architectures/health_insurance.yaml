        how_built: Facets and HealthEdge adjudication, edit and pend results conform on Delta Lake under Unity Catalog, and AI Functions cluster pend root causes scored in Model Serving so claims operations raises administrative first-pass fixes in a dedicated FWA Command Centre module before the next cycle, with fraud referrals reserved for the integrity workflow.
