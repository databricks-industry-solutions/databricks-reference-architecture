      - name: Prior Auth Optimisation
        short: Utilisation
        icon: api
        summary: Authorization turnaround and denial overturn rates improved without loosening medical necessity.
        problem: Authorization requests pile up in manual queues, so turnaround drags, providers are abraded, and inconsistent evidence handling drives avoidable denials that resurface as costly appeals.
        who_benefits: Care Management
        how_built: Authorization and clinical documents land through connectors, and AI Functions rank approval likelihood and missing evidence in Model Serving, drafting determinations for nurse review.
