          - Delta Lake
          - HealthEdge Source
      - name: Member Retention
        short: Growth
        icon: custlake
        summary: Disenrollment risk scored from service complaints, claims gaps and digital engagement.
        problem: Members disenroll after a bad service experience or unmet care need, but the complaint, claims-gap and engagement signals that predict it are scattered and seen only after they leave.
        who_benefits: CEO & CFO
        how_built: Service, claims and engagement features are built in Feature Store and scored in Model Serving to flag disenrollment risk, driving retention outreach from governed member segments.
