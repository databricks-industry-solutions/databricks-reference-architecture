        summary: High-cost members identified and engaged before preventable admissions.
        problem: Rising-risk members are spotted only after an avoidable ED visit or admission, because claims, pharmacy and clinical signals live apart and nurses lack a periodic view of who is rising in risk for preventive outreach.
        who_benefits: Care Management
        how_built: Member features from claims and clinical feeds are built in Feature Store and scored monthly in Model Serving, ranking rising-risk members in the Care Manager Console for outreach.
