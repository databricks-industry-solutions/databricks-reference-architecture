      - name: Utilization Forecasting
        short: Trend
        icon: chart
        summary: Inpatient, ED and pharmacy utilization forecast by cohort so trend and reserves hold.
        problem: Utilization is understood only in the rear-view from booked claims, so IBNR reserves and trend assumptions are set on stale averages and miss the surges that blow the annual medical budget.
        who_benefits: Actuarial & Finance
        how_built: Paid-claim, authorization and pharmacy history conform on Delta Lake and feed forecasting models tracked in MLflow and scored in Model Serving, so utilization and trend by cohort read on certified AI/BI Metric Views before the reserve is booked.
