medallion:
  Bronze:
    short: Raw claims and enrollment
    summary: EDI 837/835 transactions, enrollment files, provider directories, prior auth decisions and pharmacy claims, landed exactly as received so a paid claim or a member month can always be replayed.
  Silver:
    short: Conformed member, claim
    summary: Members, providers, claims and authorizations resolved into single conformed entities across core admin and clinical systems, with ICD and CPT codes reconciled to one service line.
  Gold:
    short: MLR, risk, quality
    summary: 'Contracted products actuarial and quality teams run on: medical loss ratio, risk-adjusted revenue, HEDIS measure rates, and fraud waste and abuse savings.'
