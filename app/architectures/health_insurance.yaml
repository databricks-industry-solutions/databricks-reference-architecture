      - name: Auto-Adjudication Rate
        short: Claims
        icon: gauge
        summary: First-pass auto-adjudication maximised with fewer pends, edits and manual rework.
        problem: Claims fall out to manual pend queues on avoidable edit and eligibility mismatches, so adjudication is slow, inconsistent and costly and the same defects recur every cycle.
