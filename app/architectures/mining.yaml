        icon: api
        summary: Cargo certificates served to smelters and traders from governed lab lineage.
        citations:
          - lims
      - name: Trader Data Sharing
        icon: share
        summary: Stockpile and shipment positions shared to offtake partners over Delta Sharing.
        citations:
          - metal-bulletin
      - name: Rail & Port Partners
        core: true
        icon: globe
        summary: Nomination and stow data exchanged without nightly spreadsheet reconciliation.
        citations:
          - pcs
  - name: Regulatory & Reporting
    icon: gavel
    tiles:
      - name: Mine Safety Reporting
        icon: gavel
        summary: Regulator submissions produced from the same governed tables operations runs on.
        citations:
          - intelex
      - name: Emissions & Tailings
        core: true
        icon: share
        summary: Scope 1 and water disclosures filed from contracted Gold products.
        citations:
          - envirosuite
  - name: Published Products
    icon: product
    tiles:
      - name: Data Products
        icon: product
        summary: Published, contracted products discoverable in Unity Catalog Domains and shared over OpenSharing.
      - name: Sharing Recipients
        core: true
        icon: share
        summary: Traders, smelters and joint-venture partners reading live tables with no copy.
  - name: Databricks Apps
    icon: apps
    tiles:
      - name: Pit Control Tower
        icon: gauge
        short: Fleet dispatch
        summary: Shovel queues, payload variance and reallocation options on Databricks Apps over Lakebase.
      - name: Plant Performance
        icon: stream
        short: Recovery live
        summary: Mill throughput and recovery against plan with constraint flags before metal is lost.
      - name: Grade Control
        icon: sheet
        short: Block model
        summary: Blast, dig and assay reconciled for short-term model updates before the shovel moves.
      - name: Shipment Tracker
        icon: globe
        short: Export cargo
        summary: Port stock, vessel laytime and assay disputes plus inbound consumables buffers and replenishment on one surface for marketing and materials planning.
  - name: AI/BI Dashboards
    icon: aibi
    tiles:
      - name: Pit & Fleet Productivity
        icon: aibi
        summary: Payload, cycle time, queue and fleet productivity on certified operations Metric Views.
        kpis:
          - Fleet productivity
          - Payload variance
          - Truck queue time
          - Cycle time
          - Idle time
        teams:
          - Mine Operations
          - Site Leadership
          - Dispatch Controller
      - name: Grade & Recovery
        icon: aibi
        summary: Head grade, recovery, throughput and metal accounting across mine and plant.
        kpis:
          - Mill recovery
          - Head grade
          - Throughput
          - Recovered metal per tonne
          - Grade reconciliation
        teams:
          - Processing
          - Grade Control Geologist
          - Plant Metallurgist
      - name: Commercial & Logistics
        icon: aibi
        summary: Realised price, TC/RC, demurrage and cargo performance.
        kpis:
          - Realised price vs benchmark
          - TC/RC terms
          - Demurrage exposure
          - Cargo on-time rate
          - Hedge effectiveness
        teams:
          - Marketing & Sales
          - Logistics & Shipping
          - Treasury & Hedging
      - name: Safety & ESG
        icon: aibi
        summary: Safety leading indicators, permit compliance and Scope 1 emissions intensity.
        kpis:
          - TRIFR
          - Proximity events
          - Permit exceedances
          - Scope 1 intensity
          - Dust/vibration exceedances
        teams:
          - Safety & ESG
          - HSE Manager
          - Environment Lead
  - name: Agent Harnesses
    icon: agents
    tiles:
      - name: Omnigent OSS
        icon: omni
        short: Databricks, open source
        summary: Open-source meta-harness above existing agent frameworks, enabling agent composition, collaboration and centralised governance from one interface.
        capabilities:
          - Build
          - Deploy
          - Optimize
          - Govern
        related:
          - Agent Bricks
          - Unity Gateway
      - name: Claude Code
        core: true
        icon: code
        short: 3rd-party harness
        summary: Anthropic's coding harness working against the platform through MCP, with spend, routing and policy governed by Unity Gateway.
      - name: OpenAI Codex
        core: true
        icon: code
        short: 3rd-party harness
        summary: OpenAI's coding harness connected over MCP, governed at runtime by Unity Gateway rather than trusted by configuration.
      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Pit Operations Agent
        icon: genie
        summary: Ask about production, payload, cycle time, queue, fleet efficiency and haul-truck, shovel and fixed-plant equipment health across the pit in plain language.
        feeds:
          - Modular Mining DISPATCH
          - Hexagon MineOperate
          - High-Precision GPS
          - Metso Metrics
          - IBM Maximo
          - Conformed block, fleet
        teams:
          - Mine Operations
          - Site Leadership
          - Dispatch Controller
        questions:
          - What were tonnes moved and fleet productivity by shift yesterday?
          - Where are truck queues building right now and why?
          - Which trucks and shovels are underperforming their payload target?
          - How much did idle time cost us in diesel this week?
          - Which pit areas are limiting dig rate against the plan?
          - Which haul trucks, shovels and mills are trending toward failure this month?
          - What is remaining life on the critical fleet and fixed-plant components?
          - What is the maintenance work-order backlog by asset class, and which repair should we schedule first?
      - name: Recovery & Metallurgy Agent
        icon: genie
        summary: Explore mill production, head grade, recovery and orebody models across mine and plant.
        feeds:
          - LIMS Assay Lab
          - Maptek BlastLogic
          - AVEVA PI System
          - Grade, cost, recovery
        teams:
          - Processing
          - Grade Control Geologist
          - Plant Metallurgist
        questions:
          - What was mill throughput and recovery yesterday versus plan?
          - Which circuit is constraining recovery today and what change is recommended?
          - How does reconciled grade compare to the block model this month?
          - How much metal did we lose to tailings this shift?
          - Which blast blocks are diluting mill feed right now?
      - name: Logistics & Market Agent
        icon: genie
        summary: Answer questions on realised price, cargoes, demurrage and how a market or capital scenario flows to margin.
        feeds:
          - SAP IS-Mining
          - Metal Bulletin
          - Port Community System
          - Rail Wagon Telemetry
        teams:
          - Marketing & Sales
          - Logistics & Shipping
          - Treasury & Hedging
        questions:
          - What is our realised price versus benchmark by cargo this month?
          - How would a benchmark price drop flow through to margin and the capital plan?
          - What is our current demurrage exposure across vessels?
          - Which cargoes are at risk of missing their laycan if a rail outage hits?
          - How does realised margin hold across price and disruption scenarios by cargo?
      - name: Safety & Environment Agent
        icon: genie
        summary: Ask about safety leading indicators, emissions intensity, water reuse and permit compliance across the operation.
        feeds:
          - Intelex EHS
          - Wearable Proximity
          - Envirosuite
          - AVEVA PI System
        teams:
          - Safety & ESG
          - HSE Manager
          - Environment Lead
        questions:
          - What is our TRIFR trend this year?
          - How many proximity or zone-breach events happened this week?
          - Which permits are closest to a breach before we file?
          - What is our Scope 1 emissions intensity and water reuse per tonne this month?
          - Where are dust or vibration readings approaching community thresholds?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Production Monitoring
        short: Throughput live
        icon: gauge
        summary: Mill throughput, recovery and recovered metal per tonne monitored live as feed grade and ore hardness shift through the shift.
        problem: Feed grade and ore hardness drift through the shift, and by the time throughput and recovery drop in the lab result metal has already been lost to tailings that no reagent change can bring back.
        who_benefits: Processing
        how_built: Concentrator historian and assay tags conform on Delta Lake, and recovery models scored in Model Serving flag throughput and circuit constraints in the Plant Performance app before metal is lost.
        components:
          - Plant Performance
          - AVEVA PI System
          - Metso Metrics
          - Model Serving
          - MLflow
          - Delta Lake
        stories:
          - title: Nexa mines less waste and more value with AI-driven insights
            url: https://www.databricks.com/customers/nexa
      - name: Predictive Maintenance & Asset Health
        short: Asset health
        icon: stream
        summary: Haul-truck, shovel and mill failures predicted from telemetry before they remove capacity from the plan.
