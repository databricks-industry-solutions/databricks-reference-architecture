name: Mining
description: 'A mining operator running pit and underground operations, processing plants and export logistics: fleet and plant telemetry, orebody knowledge and grade control, mill recovery, mobile and fixed-asset reliability, workforce safety, and commodity supply for metals and bulk commodities.'
sources:
  - name: Fleet & Dispatch
    icon: iot
    simplified: 2
    tiles:
      - name: Modular Mining DISPATCH
        icon: iot
        summary: Shovel-truck assignment, queue times and payload cycles from the open-pit dispatch system.
        citations:
          - modular
        category: Fleet Management System (FMS)
        what_it_is: Runs open-pit shovel-truck assignment, queue times and payload cycles as the real-time fleet dispatch system of record.
        who_uses_it: Dispatch controllers, mine operations and production engineers.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day cycle history
            interval: Shift-end + hourly rollups
          stream:
            types:
              - semi-structured
            volume: 1-10k events/sec
            interval: Continuous (real-time assignments)
      - name: Hexagon MineOperate
        icon: stream
        summary: Underground and surface fleet location, production reporting and operator logs.
        citations:
          - hexagon
        category: Fleet Management System (FMS)
        what_it_is: Tracks underground and surface fleet location, production reporting and operator logs across the operation.
        who_uses_it: Mine operations, dispatch controllers and production reporting teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 1-8k events/sec
            interval: Continuous (location + production)
      - name: Maptek BlastLogic
        icon: sheet
        summary: Drill and blast designs, actuals and fragmentation linked to dig blocks.
        citations:
          - maptek
        category: Drill & Blast Management System
        what_it_is: Holds drill and blast designs, actuals and fragmentation results linked to dig blocks for grade and productivity analysis.
        who_uses_it: Drill & blast engineers, grade control geologists and mine planning.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 0.5-2 GB/day
            interval: Per-blast + daily updates
  - name: Plant & Processing
    icon: stream
    simplified: 2
    tiles:
      - name: AVEVA PI System
        icon: iot
        summary: Mill throughput, reagent flows and recovery tags from concentrator historians.
        citations:
          - aveva-pi
        category: Process / Time-Series Historian
        what_it_is: Stores mill throughput, reagent flows and recovery tags from concentrator plants as the processing time-series system of record.
        who_uses_it: Plant metallurgists, concentrator operators and reliability engineers.
        data_out:
          batch:
            types:
              - structured
            volume: 10-50 GB/day tag history
            interval: Hourly aggregates
          stream:
            types:
              - semi-structured
            volume: 10-100k tags/sec
            interval: Continuous (sub-second)
      - name: Metso Metrics
        icon: gauge
        summary: Cloud monitoring of crusher, mill and screen performance against nameplate and maintenance windows.
        citations:
          - metso
        category: Equipment Performance Monitoring
        what_it_is: Cloud monitoring of crusher, mill and screen performance against nameplate and maintenance windows for reliability and throughput.
        who_uses_it: Reliability engineers, maintenance planning and plant operations.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-2 GB/day
            interval: Hourly / daily
          stream:
            types:
              - semi-structured
            volume: hundreds of readings/sec
            interval: Continuous equipment telemetry
      - name: IBM Maximo
        core: true
        icon: gauge
        summary: Work orders, component lifing and preventive-maintenance schedules for the mobile fleet and fixed plant.
        citations:
          - maximo
        category: Enterprise Asset Management (EAM)
        what_it_is: Manages work orders, component lifing, spares and preventive-maintenance schedules for haul trucks, shovels and fixed plant as the maintenance system of record.
        who_uses_it: Maintenance planning, reliability engineers and storeroom teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day work orders
            interval: Nightly + event-driven
      - name: LIMS Assay Lab
        core: true
        icon: gavel
        summary: Sample preparation, assay results and QA/QC duplicates for grade control.
        citations:
          - lims
        category: Laboratory Information Management (LIMS)
        what_it_is: Manages sample preparation, assay results and QA/QC duplicates that grade control and metal accounting depend on.
        who_uses_it: Assay lab, grade control geologists and metallurgists.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-2 GB/day assays
            interval: Per-batch + daily
  - name: Commercial & ERP
    icon: erp
    simplified: 2
    tiles:
      - name: SAP IS-Mining
        icon: erp
        summary: Production orders, inventory, sales contracts and settlement postings.
        citations:
          - sap-mining
        category: Mining ERP
        what_it_is: Runs production orders, inventory, sales contracts and settlement postings on the industry SAP mining core.
        who_uses_it: Commercial, supply chain and Finance teams.
        data_out:
          batch:
            types:
              - structured
            volume: 5-20 GB/day
            interval: Nightly batch + monthly close
      - name: Metal Bulletin
        icon: market
        summary: Benchmark prices and index curves the marketing desk hedges against.
        citations:
          - metal-bulletin
        category: Commodity Price Benchmark Provider
        what_it_is: Supplies benchmark metal prices and index curves the marketing and treasury desks mark and hedge physical delivery against.
        who_uses_it: Commercial, marketing and treasury/hedging teams.
        data_out:
          batch:
            types:
              - structured
            volume: MBs reference data
            interval: Daily price publication
      - name: Port Community System
        icon: globe
        summary: Vessel nominations, stow plans and weighbridge tickets at export terminals.
        citations:
          - pcs
        category: Port & Terminal Operating System
        what_it_is: Manages vessel nominations, stow plans and weighbridge tickets at export terminals for bulk commodity shipping.
        who_uses_it: Logistics & shipping, port operations and commercial teams.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-2 GB/day
            interval: Per-vessel + daily updates
  - name: Safety & Environment
    icon: gavel
    simplified: 2
    tiles:
      - name: Intelex EHS
        icon: gavel
        summary: Incidents, near-misses and permit-to-work records tied to site and crew.
        citations:
          - intelex
        category: EHS Management System
        what_it_is: Records incidents, near-misses and permit-to-work compliance tied to site and crew for safety analytics.
        who_uses_it: HSE managers, site safety and operations supervisors.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 0.5-2 GB/day
            interval: Hourly / daily
      - name: Envirosuite
        icon: observ
        summary: Dust, noise and blast vibration monitoring against community thresholds.
        citations:
          - envirosuite
        category: Environmental Monitoring System
        what_it_is: Monitors dust, noise and blast vibration against community and regulatory thresholds around the operation.
        who_uses_it: Environment leads, community relations and compliance teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds of readings/sec
            interval: Continuous sensor monitoring
      - name: Wearable Proximity
        icon: iot
        summary: Tag collision and zone breach events from personnel and equipment proximity systems.
        category: Proximity Detection / Collision Avoidance
        what_it_is: Emits tag collision and zone-breach events from personnel and equipment proximity systems for fatal-risk protection.
        who_uses_it: HSE managers, mine operations and safety analytics teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 1-10k events/sec
            interval: Continuous (event-driven)
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Corporate Risk Ledger
        icon: fed
        summary: Hedging and working-capital marts queried in place under Unity Catalog for treasury reporting.
        category: Enterprise Data Warehouse
        what_it_is: Corporate hedging and working-capital marts kept in the incumbent treasury warehouse and queried in place through federation rather than copied.
        who_uses_it: Treasury & hedging, Finance and Risk analysts.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale historical marts
            interval: Queried on demand (federated)
  - name: Data Formats
    icon: zbraces
    simplified: 2
    tiles:
      - name: 'OMF'
        icon: zbraces
        fmt: 'OMF'
        summary: 'Open Mining Format for exchanging geologic and block-model data between tools.'
        spec_url: https://gmggroup.org/
      - name: 'IREDES'
        icon: zbraces
        fmt: 'IRED'
        summary: 'International Rock Excavation Data Exchange Standard for mining equipment data.'
        spec_url: https://iredes.org/
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    tiles:
      - name: High-Precision GPS
        icon: iot
        summary: RTK survey and machine guidance files normalised for block model updates.
        citations:
          - hexagon
        category: Survey & Machine Guidance Feed
        what_it_is: RTK survey and machine-guidance files normalised for block-model updates and as-mined reconciliation.
        who_uses_it: Surveyors, grade control geologists and mine planning.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-2 GB/day
            interval: Per-survey + shift updates
      - name: Satellite Imagery
        icon: globe
        summary: Pit shell and stockpile volumetrics from periodic earth-observation feeds.
        citations:
          - planet
        category: Earth Observation / Remote Sensing
        what_it_is: Pit shell and stockpile volumetrics derived from periodic earth-observation imagery for inventory and progress reconciliation.
        who_uses_it: Survey, stockpile management and mine planning teams.
        data_out:
          batch:
            types:
              - unstructured
            volume: GBs/scene
            interval: Periodic (revisit cycle)
      - name: Rail Wagon Telemetry
        icon: stream
        summary: Load, location and brake events from outbound rail convoys to port.
        citations:
          - pcs
        category: Rail Logistics Telemetry
        what_it_is: Load, location and brake events from outbound rail convoys, streamed in to reconcile the mine-to-port flow.
        who_uses_it: Logistics & shipping and rail operations teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 100s-1000s of events/sec
            interval: Continuous (in-transit telemetry)
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Site Leadership
        mark: Genie One
        summary: The general manager on tonnes milled, grade recovery and unit cash cost when weather or an unplanned equipment stop limits the month's plan.
        uses:
          - - Genie One
            - Ask what yesterday's mill recovery was without waiting on the morning report.
          - - AI/BI
            - Grade, cost and fleet KPIs on one certified set of Metric Views.
          - - Unity Catalog
            - Certification so "head grade" means one thing across mine and plant.
        sub:
          - name: General Manager
            cares: 'the monthly plan: tonnes milled, head grade and unit cash cost against budget.'
          - name: Operations Superintendent
            cares: pit-to-plant coordination and where the shift is losing productivity.
          - name: Site Finance
            cares: cost per tonne, sustaining capital and the stockpile and demurrage working capital.
        ucs:
          - Design Space Simulation & Exploration
          - Production Monitoring
          - Operations Resource Efficiency
          - Sustainability & Circular Economy
      - name: Mine Operations
        mark: Lakehouse//RT
        summary: Pit sequencing, dig rates and truck queue times when a shovel goes down, protecting fleet productivity and unit cost per tonne moved.
        uses:
          - - Pit Control Tower
            - Fleet reallocation options costed before the shift plan changes.
          - - Lakehouse//RT
            - Dispatch state at the latency a queue builds at.
          - - AI/BI
            - Payload and cycle time on governed definitions.
        sub:
          - name: Mine Manager
            cares: the pit sequence, dig rates and whether the fleet is meeting the daily plan.
          - name: Dispatch Controller
            cares: shovel-truck assignment and truck queue time in real time across the pit.
          - name: Drill & Blast Engineer
            cares: blast design, fragmentation and how it feeds the dig blocks and grade.
        ucs:
          - Design Space Simulation & Exploration
          - Operations Resource Efficiency
          - Predictive Maintenance & Asset Health
      - name: Processing
        core: true
        mark: AI/BI
        summary: Mill stability, reagent consumption and recovered metal per tonne milled when feed grade and ore hardness shift through the shift.
        uses:
          - - Plant Performance
            - Recovery and throughput variance flagged before metal is lost.
          - - Model Serving
            - Grade-control models scored on blast and assay feeds.
          - - Genie One
            - Ask which circuit is constraining recovery today.
        sub:
          - name: Plant Metallurgist
            cares: recovery, reagent dosing and recovered metal per tonne milled as feed shifts.
          - name: Concentrator Superintendent
            cares: mill throughput, circuit stability and the constraint through the shift.
          - name: Grade Control Geologist
            cares: ore-versus-waste calls and reconciling assays back to the block model.
        ucs:
          - Production Monitoring
          - Design Space Simulation & Exploration
          - Predictive Maintenance & Asset Health
      - name: Marketing & Sales
        mark: AI/BI
        summary: Contract delivery, assay disputes and hedge exposure against benchmark moves, tracked on realised price and TC/RC terms by cargo.
        uses:
          - - Shipment Tracker
            - Cargo assay and moisture reconciled before invoice.
          - - AI/BI
            - Realised price and TC/RC on certified Metric Views.
          - - Unity Catalog
            - One definition of contained metal across mine and port.
        sub:
          - name: Commercial Manager
            cares: realised price, TC/RC terms and contract delivery by cargo.
          - name: Logistics & Shipping
            cares: vessel laytime, demurrage exposure and the stockpile-to-port flow.
          - name: Treasury & Hedging
            cares: benchmark exposure and hedge effectiveness against the physical book.
        ucs:
          - Capital Investment Simulation
      - name: Safety & ESG
        mark: Unity Catalog
        summary: Fatal-risk protocols, Scope 1 emissions and community commitments the board signs, tracked on TRIFR and permit-breach counts before audit.
        uses:
          - - Workforce Safety
            - Leading indicators and permit breaches before audit.
          - - Unity Catalog
            - Lineage from sensor to regulatory disclosure.
          - - AI/BI
            - TRIFR and emissions on governed definitions.
        sub:
          - name: HSE Manager
            cares: fatal-risk protocols, TRIFR and permit-to-work compliance before audit.
          - name: Environment Lead
            cares: dust, noise, tailings and Scope 1 emissions against community thresholds.
          - name: Community & Governance
            cares: the commitments the board signs and the disclosures regulators read.
        ucs:
          - Workforce Safety
          - Sustainability & Circular Economy
          - Regulation Compliance, & External Reporting
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land the dispatch, plant SCADA, assay lab and port load feeds; own the Bronze to Silver path and the pager when a site pipeline breaks.
        uses:
          - - Lakeflow Connect
            - Managed connectors for DISPATCH, historian and LIMS sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on cycle and assay feeds.
          - - Lakewatch
            - Freshness on the grade and fleet tables the morning report reads.
        sub:
          - name: Pipeline Engineers
            cares: the Bronze-to-Silver path for dispatch, historian, LIMS and port feeds.
          - name: Streaming Engineers
            cares: SCADA and telemetry landed at the latency a truck queue builds at.
          - name: Platform & Governance
            cares: Unity Catalog lineage so head grade means one thing mine to plant.
        ucs:
          - Design Space Simulation & Exploration
          - Operations Resource Efficiency
      - name: Data Scientists
        mark: MLflow
        summary: Grade-control, recovery, haul-truck RUL and demurrage models, and whether they still hold six months after deployment across pit and plant.
        uses:
          - - Feature Store
            - Blast and assay features read identically in training and serving.
          - - MLflow
            - Every grade and recovery run tracked for audit and reproduction.
          - - Model Serving
            - Grade-control models scored on blast and assay feeds.
        sub:
          - name: Geometallurgy ML
            cares: grade-control and recovery models across the blast and assay feeds.
          - name: Reliability Data Science
            cares: haul-truck and mill remaining-life models on streaming telemetry.
          - name: Operations Research
            cares: fleet, blending and logistics optimisation against demurrage and cost.
        ucs:
          - Production Monitoring
          - Predictive Maintenance & Asset Health
          - Design Space Simulation & Exploration
      - name: App Developers
        mark: Apps
        summary: Ship the pit control, plant performance and shipment applications operators and marketers work in, hosted next to governed mine data.
        uses:
          - - Apps
            - Operational screens with no separate web tier to run or secure.
          - - Lakebase
            - Serverless Postgres for dispatch state and governed writes.
          - - Agent Bricks
            - Agents that draft a fleet reallocation against governed tools.
        sub:
          - name: Operational App Devs
            cares: the pit control, plant performance and shipment screens operators live in.
          - name: Integration Engineers
            cares: writeback to DISPATCH, DCS setpoints and CMMS work orders.
          - name: Agent Builders
            cares: governed agents that draft a fleet reallocation or a work order.
        ucs:
          - Operations Resource Efficiency
          - Production Monitoring
consumers:
  - name: BI & Productivity
    icon: chart
    from: bi
    tiles:
      - name: Tableau / Qlik / ThoughtSpot
        icon: chart
        summary: External BI against SQL warehouses, with Unity Catalog permissions enforced end to end.
      - name: Microsoft Teams
        icon: chat
        summary: Genie in Teams for governed answers and shift updates in the channel the pit already works in.
      - name: Notebooks & IDEs
        icon: notebook
        summary: Notebooks, VS Code and JetBrains against governed data and Genie Code.
  - name: Operations Writeback
    icon: opdb
    tiles:
      - name: DISPATCH Reassignment
        icon: iot
        summary: Truck and shovel assignments written back when the optimiser changes the shift plan.
        citations:
          - modular
      - name: Plant Setpoint
        icon: stream
        summary: Approved reagent and density targets pushed to DCS within operating envelopes.
        citations:
          - aveva-pi
      - name: Maintenance Work Order
        core: true
        icon: erp
        summary: Predicted component failures raised in CMMS before the truck leaves service.
        citations:
