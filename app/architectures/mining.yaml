        short: Maintenance actions
        icon: gauge
        summary: The specific repair, its timing and the parts and crew to schedule recommended, not just a failure predicted.
        problem: A predicted haul-truck or mill failure still lands on a planner who decides by hand what to fix, when to take the machine down and which parts and crew to line up, so the window between the alert and the shutdown is lost to manual triage.
