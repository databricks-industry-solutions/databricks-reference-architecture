        who_uses_it: Agronomy Advisory, Ag Data Science and App & IoT Eng teams.
        data_out:
          stream:
            types:
              - structured
              - semi-structured
            volume: tens of thousands of sensor events/min
            interval: Continuous (sensor)
      - name: Pessl METOS Stations
        icon: iot
        summary: Field weather stations and disease-model dataloggers from Pessl Instruments, the on-farm ground truth calibrating remote signals.
        citations:
          - metos
        category: Weather Station Network
        what_it_is: Field weather stations and disease-model dataloggers, the on-farm ground truth calibrating remote signals.
        who_uses_it: Agronomy Advisory, Field Trials and Ag Data Science teams.
        data_out:
          stream:
            types:
              - structured
            volume: thousands of station readings/min
            interval: Continuous (station)
  - name: R&D, Agronomy & ERP
    icon: erp
    tiles:
      - name: Cropwise Agronomy
        icon: sheet
        summary: 'Syngenta''s digital agronomy suite: field scouting, agronomic recommendations and product performance tied to the crop-protection portfolio.'
        citations:
          - cropwise
        category: Digital Agronomy Suite
        what_it_is: Field scouting, agronomic recommendations and product performance tied to the crop-protection portfolio.
        who_uses_it: Agronomy Advisory, Crop Science R&D and Field Trials teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: hundreds of thousands of scouting and rec records
            interval: Daily
      - name: LabWare LIMS
        icon: docs
        summary: 'The laboratory information management system of record for seed, trait and crop-protection R&D: sample results, assays and study data.'
        citations:
          - labware
        category: Laboratory Information Management (LIMS)
        what_it_is: 'System of record for seed, trait and crop-protection R&D: sample results, assays and study data.'
        who_uses_it: Crop Science R&D, Field Trials and Ag Data Science teams.
        data_out:
          batch:
            types:
              - structured
            volume: millions of sample and assay results
            interval: Daily lab batch
      - name: SAP S/4HANA
        core: true
        icon: erp
        summary: 'The commercial system of record for the ag vendor: orders, inventory, dealer settlements and the input supply chain behind the products in the field.'
        citations:
          - sap-s4
        category: Enterprise Resource Planning (ERP)
        what_it_is: Commercial system of record for orders, inventory, dealer settlements and the input supply chain behind the products in the field.
        who_uses_it: Input Supply & Pricing, Dealer Network and Commercial teams.
        data_out:
          batch:
            types:
              - structured
