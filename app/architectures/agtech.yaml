        category: Crop Simulation Models
        what_it_is: Crop-simulation frameworks turning weather, soil and genetics into growth-stage and yield estimates, run at scale against conformed field data.
        who_uses_it: Ag Data Science, Crop Science R&D and Agronomy Advisory teams.
        data_out:
