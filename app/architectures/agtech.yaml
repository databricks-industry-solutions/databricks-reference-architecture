pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Digital Product
        mark: Genie One
        summary: 'The leaders of the digital ag platform: the chief digital officer and precision-ag product managers who own the provider''s grower and agronomist experience and its integrations to FieldView, Operations Center and other external systems, and the platform GM who answers for adoption and connected acres.'
        uses:
          - - Genie One
            - Ask how many acres synced last week or which prescription workflow is stalling without booking analyst time.
          - - AI/BI
            - Connected acres, feature adoption and platform reliability on one certified set of Metric Views.
          - - Unity Catalog
            - Certification and the glossary, so "active acre" and "as-applied" mean one thing across the platform.
        sub:
          - name: Chief Digital Officer
            cares: the digital farming strategy and the connected-acre growth target.
          - name: Precision Ag Product
            cares: FieldView and Operations Center feature adoption and grower retention.
          - name: Platform GM
            cares: reliability, partner integrations and the data-sharing ecosystem.
        ucs:
          - Production Monitoring
          - Feedstock, Formulation, & Recipe Control
      - name: Agronomy & R&D
        mark: AI/BI
        summary: 'The crop scientists and agronomists: seed and crop-protection R&D running multi-year trials, field research turning plots into product claims, and the agronomy advisory team standing behind the recommendations growers act on.'
        uses:
          - - AI/BI
            - Trial results, product performance and agronomic signals on governed, certified data.
          - - Model Serving
            - Yield, pest and disease models scored into the products agronomists use.
          - - Genie One
            - Ask how a hybrid performed by geography or which trials are ready to read without an analyst pull.
        sub:
          - name: Crop Science R&D
            cares: seed, trait and crop-protection discovery and development pipelines.
          - name: Field Trials
            cares: multi-location protocols and the statistics behind product claims.
          - name: Agronomy Advisory
            cares: the recommendations and prescriptions growers act on in season.
        ucs:
          - Production Monitoring
          - Design Space Simulation & Exploration
          - Feedstock, Formulation, & Recipe Control
      - name: Equipment Eng
        mark: Lakehouse//RT
        summary: 'The OEM engineering side: telematics engineers landing machine telemetry at fleet scale, reliability engineers on component life and in-season uptime, and the autonomy and guidance teams building the systems that steer and spray the machine.'
        uses:
          - - Lakehouse//RT
            - Live machine and implement state at the latency an in-season fleet moves at.
          - - Model Serving
            - Remaining-life and anomaly models scored against streaming telemetry.
          - - Apache Spark
            - Large-scale geospatial and telemetry processing across the connected fleet.
        sub:
          - name: Telematics Engineering
            cares: machine, implement and as-applied telemetry off the CAN bus.
          - name: Machine Reliability
            cares: component life, warranty and in-season uptime.
          - name: Autonomy & Guidance
            cares: steering, See & Spray and the perception data behind them.
        ucs:
          - Operations Resource Efficiency
          - Distribution & Logistics Optimization
          - Feedstock, Formulation, & Recipe Control
      - name: Sustainability
        mark: Model Serving
        summary: 'The teams behind the carbon and stewardship programs: carbon program operators enrolling acres, the MRV and verification team standing behind every credit, and regenerative-ag leads proving practice change across the supply shed.'
        uses:
          - - Model Serving
            - Soil-carbon and emissions models scored against imagery and practice data.
          - - Unity Catalog
            - Auditable lineage from field practice to reported credit under one governance model.
          - - AI/BI
            - Enrolled acres, practice adoption and verified outcomes on certified views.
        sub:
          - name: Carbon Programs
            cares: enrolment, baselining and grower payments across the supply shed.
          - name: MRV & Verification
            cares: measurement, reporting and verification behind every issued credit.
          - name: Regenerative Ag
            cares: cover crops, tillage and the practice-change evidence base.
        ucs:
          - Sustainability & Circular Economy
          - Product & Process Traceability
      - name: Commercial
        core: true
        mark: AI/BI
        summary: 'The go-to-market side: the dealer and channel network selling and servicing equipment and inputs, grower-success teams on retention and expansion, and input supply and pricing balancing demand against the season.'
        uses:
          - - AI/BI
            - Dealer performance, grower retention and input demand on certified Metric Views.
          - - Genie One
            - Ask which dealers are trending down or where input demand is spiking without a finance pull.
          - - Model Serving
            - Churn, demand and cross-sell models scored into the commercial workflow.
        sub:
          - name: Dealer Network
            cares: channel performance, parts and service revenue.
          - name: Grower Success
            cares: onboarding, retention and expansion on the platform.
          - name: Input Supply & Pricing
            cares: seed and crop-protection demand against the season.
        ucs:
          - Product & Process Traceability
          - Demand Forecasting
          - Production Monitoring
  - name: Technical
    icon: code
    tiles:
      - name: Geospatial Eng
        mark: Lakeflow
        summary: Land the imagery, boundary and telemetry feeds from Planet, Sentinel, JDLink and ISOBUS; own the raster-to-tabular path with GDAL, rasterio and H3, and the pager when a tile or telemetry feed stalls.
        uses:
          - - Lakeflow Connect
            - Managed connectors for FMS, telematics and imagery providers.
          - - Apache Spark
            - Mosaic and Spatial SQL H3 indexing turning rasters into governed tables.
          - - Lakewatch
            - Freshness on the field and fleet tables agronomists read every morning.
        ucs:
          - Feedstock, Formulation, & Recipe Control
          - Production Monitoring
          - Operations Resource Efficiency
      - name: Ag Data Science
        mark: MLflow
        summary: Yield, pest, disease and remaining-life models built on remote-sensing computer vision, crop simulations and telemetry, and whether they still hold a season after deployment.
        uses:
          - - Feature Store
            - Field, weather and machine features read identically in training and serving.
          - - MLflow
            - Every run tracked for audit and reproduction across seasons and geographies.
          - - Model Serving
            - Yield, pest and uptime models scored in the product and operational path.
        ucs:
          - Production Monitoring
          - Design Space Simulation & Exploration
          - Operations Resource Efficiency
      - name: App & IoT Eng
        mark: Apps
        summary: Ship the grower, agronomist and dealer applications and the ingestion behind millions of connected machines, hosted next to governed data.
        uses:
          - - Apps
            - Grower and dealer screens with no separate web tier to run or secure.
          - - Lakebase
            - Serverless Postgres for prescription, workflow and roster state with governed writes.
          - - Zerobus
            - High-volume machine and sensor events ingested directly to the lakehouse.
        ucs:
          - Operations Resource Efficiency
          - Production Monitoring
          - Feedstock, Formulation, & Recipe Control
