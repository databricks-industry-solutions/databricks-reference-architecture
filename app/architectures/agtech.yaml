agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Field & Yield Agent
        icon: genie
        summary: Ask about yield, vegetation index and field performance by hybrid and geography in plain language.
        feeds:
          - Climate FieldView
          - Planet Imagery
          - DTN Weather
          - Yield, agronomy, sustainability
        teams:
          - Agronomy & R&D
          - Digital Product
          - Agronomy Advisory
        questions:
          - Which fields are trending below their production norm on the latest imagery?
          - What was average yield by hybrid and region this season?
          - Which seed and trait candidates rank highest in the latest genetics-by-environment simulation?
          - How did variable-rate seeding and nutrient prescriptions perform against flat-rate blocks?
          - Where is disease or pest pressure emerging that should change the prescription?
      - name: Fleet Telematics Agent
        icon: genie
        summary: Explore fleet efficiency, service and logistics and operator safety across the connected machine estate.
        feeds:
          - JDLink Telematics
          - CNH AFS Connect
          - ISOBUS Task Data
          - Conformed field, grower, machine
        teams:
          - Equipment Eng
          - Machine Reliability
          - Dealer Network
        questions:
          - Where is fuel and input use least efficient across the connected fleet?
          - What is machine utilisation by class and region this season?
          - Which dealer parts and input shipments are at risk of missing the field window?
          - How should service parts move across depots to cover predicted machine failures?
          - Which operator safety events and near-misses are concentrated by machine and region?
      - name: Carbon MRV Agent
        icon: genie
        summary: Answer questions on enrolled acres, practice change and recorded verified and issued carbon status, distinct from modeled estimates.
        feeds:
          - Planet Imagery
          - Sentinel Hub
          - DSSAT & APSIM Models
          - Yield, agronomy, sustainability
        teams:
          - Sustainability
          - Carbon Programs
          - MRV & Verification
        questions:
          - How many acres are enrolled and baselined by supply shed?
          - Which practice changes show the strongest verified carbon outcome?
          - Which enrolled acres are missing evidence for verification?
          - Can we trace this crop lot from field and grower to processor for a deforestation-free claim?
          - Which sourcing regions lack the provenance evidence EUDR requires?
      - name: Channel & Dealer Agent
        icon: genie
        summary: Ask about input demand, dealer performance and input cost variance.
        feeds:
          - SAP S/4HANA
          - JD Operations Center
          - Climate FieldView
          - Conformed field, grower, machine
        teams:
          - Commercial
          - Dealer Network
          - Grower Success
        questions:
          - What is forecast seed and crop-protection demand by geography and season?
          - Where is input demand spiking against the season?
          - Where is input procurement cost rising fastest across input manufacturing?
          - How would a change in fertiliser feedstock or energy cost hit input margin?
          - Which dealers are trending down on parts and service revenue?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Production Monitoring
        short: Crop production
        icon: chart
        summary: In-season crop production and field performance monitored from imagery, weather, soil and machine data, so agronomists and growers act on live condition rather than last year's average.
        problem: Crop condition and production are judged from spotty scouting and last year's yield, so agronomic and commercial decisions are made without a live, defensible read per field and hybrid.
        who_benefits: Agronomy & R&D
        how_built: Imagery, weather and soil features are engineered in Feature Store and scored through Model Serving, with runs tracked in MLflow, surfacing live crop condition and yield in the Field Insights Hub across seasons and geographies.
        components:
          - Field Insights Hub
          - Planet Imagery
          - Model Serving
          - MLflow
          - Feature Store
        stories:
          - title: Bayer transforms global data management with Databricks
            url: https://www.databricks.com/customers/bayer
          - title: FMC Optimizes Harvests With Data and AI
            url: https://www.databricks.com/customers/fmc-corporation
      - name: Design Space Simulation & Exploration
        short: Crop genetics R&D
        icon: notebook
        summary: Seed, trait and crop-protection candidates simulated across weather, soil and genetics scenarios so R&D screens the design space before multi-year field trials.
        problem: Seed and trait candidates are proven one physical trial at a time across countries and labs, so the genetics-by-environment design space is never simulated and the eight-to-twelve-year development cycle stretches further.
        who_benefits: Agronomy & R&D
        how_built: Lab, trial and DSSAT and APSIM crop-simulation data are conformed under Unity Catalog, and machine learning models tracked in MLflow simulate genetics-by-environment response so R&D ranks candidates before the next trial season.
        components:
          - LabWare LIMS
          - DSSAT & APSIM Models
          - MLflow
          - Unity Catalog
        stories:
          - title: Syngenta accelerates crop protection research with Gaia
            url: https://www.databricks.com/customers/syngenta
      - name: Sustainability & Circular Economy
        short: Carbon & MRV
        icon: gavel
        summary: Measuring, reporting and verifying practice-change carbon at supply-shed scale, keeping modeled estimates, submitted evidence and issued credits separated and audit-ready.
        problem: Carbon programs enrol acres faster than they can prove the outcome, and measurement stitched from spreadsheets and one-off models will not survive verification.
        who_benefits: Sustainability
        how_built: Imagery, practice and soil data feed carbon and emissions models scored in Model Serving, with Unity Catalog holding an auditable lineage from field practice to reported credit in the Carbon MRV Console.
        components:
          - Carbon MRV Console
          - Model Serving
          - Planet Imagery
          - Unity Catalog
          - AI/BI
        stories:
          - title: How Dow built a carbon footprint ledger on Databricks
            url: https://www.databricks.com/blog/how-dow-built-carbon-footprint-ledger-databricks-accelerate-sustainability-scale
          - title: Data and AI in action across the energy industry
            url: https://www.databricks.com/blog/powering-future-data-and-ai-action-across-energy-industry
      - name: Feedstock, Formulation, & Recipe Control
        short: Variable-rate ag
        icon: sheet
        summary: Building variable-rate seeding and nutrient prescriptions from conformed field data and pushing them to the machine in the format the implement reads.
        problem: Prescriptions are authored in one tool and executed in another, so field data, agronomic models and the machine terminal rarely line up and rates default to flat.
        who_benefits: Digital Product
        how_built: Field, soil and yield layers are scored with AI Functions and Model Serving in Prescription Studio, then written back to FieldView and the ISOBUS task controller.
        components:
          - Prescription Studio
          - Model Serving
          - Climate FieldView
          - ISOBUS Task Data
          - AI Functions
        stories:
          - title: How John Deere uses industrial AI for precision agriculture
            url: https://www.databricks.com/blog/2021/07/09/down-to-the-individual-grain-how-john-deere-uses-industrial-ai-to-increase-crop-yields-through-precision-agriculture.html
      - name: Product & Process Traceability
        stories:
          - title: Databricks for Manufacturing
            url: https://www.databricks.com/solutions/industries/manufacturing-industry-solutions
          - title: Managing recalls with barcode traceability in the data lakehouse
            url: https://www.databricks.com/blog/managing-recalls-barcode-traceability-delta-lake
        short: Crop provenance
        icon: share
        summary: Crop and input provenance followed from field and grower to processor so deforestation-free and scope-3 claims are backed by governed evidence, not attestation.
        problem: Provenance evidence for regulations like EUDR and for scope-3 sourcing is scattered across ERP, field and partner systems, so due diligence is manual and hard to defend.
        who_benefits: Commercial
        how_built: Field, ERP and partner data are conformed under Unity Catalog and published as governed data products shared to partners and regulators over OpenSharing.
        components:
          - SAP S/4HANA
          - Unity Catalog
          - OpenSharing
          - Data Products
          - Delta Lake
      - name: Demand Forecasting
        short: Input demand
        icon: globe
        summary: Seed and crop-protection demand forecast by geography and season so supply and pricing plan against real pull, not last year.
        problem: Input demand is forecast from last year's shipments in spreadsheets, so seed and crop-protection stock is built for the wrong geographies and the dealer channel is short of what growers actually order.
        who_benefits: Commercial
        how_built: Order, dealer, agronomy and weather data are conformed on Delta Lake, and demand models scored in Model Serving forecast seed and crop-protection demand by geography and season for supply and pricing to plan against.
        components:
          - SAP S/4HANA
          - Cropwise Agronomy
          - Model Serving
          - Delta Lake
          - AI/BI
        stories:
          - title: Accelerating Corteva's data source onboarding with Lakeflow
            url: https://www.databricks.com/dataaisummit/session/accelerating-cortevas-data-source-onboarding-lakeflow
          - title: Optimizing supply chain operations with demand forecasting
            url: https://www.databricks.com/customers/upl
      - name: Commodity & Energy Trading
        stories:
          - title: Data and AI in action across the energy industry
            url: https://www.databricks.com/blog/powering-future-data-and-ai-action-across-energy-industry
        short: Procurement hedging
        icon: market
        summary: Input procurement cost and margin variance across the input supply chain tracked against orders and plan, so margin holds as feedstock and energy costs move.
        problem: Crop-protection and fertiliser inputs are made from energy and commodity feedstocks whose costs swing, but procurement cost and consumption sit in ERP and spreadsheets, so pricing and procurement see the margin impact only after it lands.
        who_benefits: Commercial
        how_built: SAP S/4HANA procurement, order and input-cost data are conformed on Delta Lake, and cost-variance and scenario models scored in Model Serving track feedstock and energy cost against input margin on certified Metric Views in AI/BI, grounded in internal procurement cost rather than an external price feed.
        components:
          - SAP S/4HANA
          - Model Serving
          - Delta Lake
          - AI/BI
          - Unity Catalog
      - name: Workforce Safety
        stories:
          - title: StrongArm Tech cuts workplace injuries with IoT and ML on Databricks
            url: https://www.databricks.com/customers/strongarm
        short: Operator safety
        icon: iot
        summary: Operator and field-worker safety events and near-misses surfaced from machine telemetry and sensor data so unsafe conditions are caught before an injury.
        problem: Safety events hide in machine telemetry and field sensor streams no one watches, so rollover, proximity and fatigue risks are only reviewed after an incident on the farm or in the plant.
        who_benefits: Equipment Eng
        how_built: JDLink telemetry and machine event streams land in Lakehouse//RT, and anomaly and risk models scored in Model Serving flag operator safety events and near-misses in the Fleet Watchtower for engineering and dealers to act on.
        components:
          - Fleet Watchtower
          - JDLink Telematics
          - Machine Event Streams
          - Model Serving
          - Delta Lake
      - name: Distribution & Logistics Optimization
        short: Dealer logistics
        icon: gauge
        summary: Dealer parts and seed and crop-protection input movement optimised across depots and dealers, including parts demand from predicted machine service, so stock reaches the field in the window.
        problem: Parts stock out at the dealer and inputs arrive late because service demand, machine health, orders and shipments live in separate systems, so distribution reacts to shortages instead of routing ahead of them.
        who_benefits: Commercial
        how_built: ERP orders, dealer inventory, shipment status and predicted-service signals from telemetry are conformed on Delta Lake, and routing and reorder models scored in Model Serving optimise parts and input distribution against the season in the Fleet Watchtower.
        components:
          - Fleet Watchtower
          - SAP S/4HANA
          - CNH AFS Connect
          - Model Serving
          - Delta Lake
        stories:
          - title: Barilla streamlines food manufacturing operations with Databricks Lakehouse
            url: https://www.databricks.com/customers/barilla
      - name: Operations Resource Efficiency
        short: Fleet efficiency
        icon: iot
        summary: Machine, fuel and input use across the connected fleet turned into operational efficiency, so the OEM and growers cut waste per acre from machine-bus and field data.
        problem: Machine telemetry arrives at large-provider scale, and legacy stores cannot ingest and geospatially analyse it fast enough to show where fuel, inputs and machine time are wasted across the operation.
        who_benefits: Equipment Eng
        how_built: Telemetry streams into Lakehouse//RT and is processed with Apache Spark and H3 indexing on Delta Lake, giving every downstream team one scalable view of fleet utilisation and resource efficiency.
        components:
          - Fleet Watchtower
          - JDLink Telematics
          - Lakehouse//RT
          - Apache Spark
          - Delta Lake
        stories:
          - title: CNH analyzes geospatial data to improve crop outputs
            url: https://www.databricks.com/customers/cnh
medallion:
  Bronze:
    short: Raw field & fleet feeds
    summary: Machine telemetry off the CAN bus, satellite and drone imagery tiles, weather-station and soil-probe readings, agronomy trial and lab results, and FMS field boundaries landed exactly as received, so a yield map or a spray pass can always be replayed as it stood.
  Silver:
    short: Conformed field, grower, machine
    summary: Fields, growers, crops, seasons and machines resolved into single conformed entities across the FMS, telematics, imagery and agronomy estates, with field boundaries reconciled to a common geometry and trial plots stitched to their protocols.
  Gold:
    short: Yield, agronomy, sustainability
    summary: 'Contracted products the agronomy, product and sustainability teams run on: yield and vegetation index by field and hybrid, variable-rate prescription performance, machine uptime and utilisation, and verified carbon and practice-change outcomes by supply shed.'
