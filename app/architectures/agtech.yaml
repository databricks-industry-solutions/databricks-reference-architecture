  - name: Weather & Field Sensors
    icon: iot
    simplified: 3
    tiles:
      - name: DTN Weather
        icon: stream
        summary: Hyper-local forecasts, historical weather and field-level conditions, the meteorology layer behind spray windows, disease risk and yield modelling.
