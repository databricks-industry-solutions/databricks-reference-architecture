        category: Weather Data Provider
        what_it_is: Hyper-local forecasts, historical weather and field-level conditions behind spray windows, disease risk and yield modelling.
        who_uses_it: Agronomy Advisory, Ag Data Science and Field Trials teams.
        data_out:
          stream:
            types:
              - structured
            volume: field-level obs and forecasts
            interval: Continuous (hourly refresh)
      - name: CropX Soil Probes
        core: true
        icon: iot
        summary: In-ground soil moisture, temperature and salinity sensors feeding irrigation and nutrient decisions at the root zone.
        citations:
