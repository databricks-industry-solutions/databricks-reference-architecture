  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Commercial Data Mart
        icon: fed
        summary: Legacy commercial, dealer and R&D data marts left where they are and queried in place under Unity Catalog, which avoids a second copy of numbers still under retention and contract.
        category: Federated Data Warehouse / Marts
        what_it_is: Legacy commercial, dealer and R&D marts queried in place under Unity Catalog, avoiding a second copy of numbers still under retention and contract.
        who_uses_it: Commercial, Dealer Network and Crop Science R&D teams.
        data_out:
          batch:
            types:
              - structured
            volume: billions of historical rows queried in place
            interval: Query-time federation
  - name: Data Formats
    icon: zbraces
    tiles:
      - name: 'ADAPT'
        icon: zbraces
        fmt: 'ADPT'
        summary: 'AgGateway toolkit that normalises field operation data across mixed equipment fleets.'
        spec_url: https://adaptframework.org/
      - name: 'ISOXML'
        core: true
        icon: zbraces
        fmt: 'ISOX'
        summary: 'ISO 11783-10 task data format for prescriptions and as-applied telemetry from machinery.'
        spec_url: https://www.iso.org/standard/61581.html
        spark_connector: 'spark-xml'
        spark_repo: https://github.com/databricks/spark-xml
        databricks_resource: https://docs.databricks.com/aws/en/query/formats/xml
        source_systems:
          - 'John Deere'
          - 'Trimble'
          - 'AGCO'
      - name: 'ISOBUS'
        icon: zbraces
        fmt: 'BUS'
        summary: 'ISO 11783 plug-and-play network between tractors, implements and displays.'
        spec_url: https://www.aef-online.org/the-aef/isobus.html
