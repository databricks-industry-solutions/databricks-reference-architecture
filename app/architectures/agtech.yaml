name: AgTech
description: 'An agriculture technology provider: precision-ag analytics and variable-rate prescriptions, connected-equipment telematics, satellite and sensor networks, crop and genetics R&D simulation, grower and customer 360, and a governed ag-data marketplace. The board represents digital-platform, equipment-OEM and input-provider variants rather than one vendor owning every named platform.'
sources:
  - name: Farm Mgmt Platforms
    icon: appbuilder
    simplified: 3
    tiles:
      - name: Climate FieldView
        icon: appbuilder
        summary: 'Bayer''s digital farming platform and the system of record for connected field data: planting, application and harvest layers synced off the FieldView Drive across tens of millions of acres.'
        citations:
          - fieldview
        category: Farm Management System (FMS)
        what_it_is: 'System of record for connected field data: planting, application and harvest layers synced off the FieldView Drive across tens of millions of acres.'
        who_uses_it: Digital Product, Precision Ag Product and Agronomy Advisory teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: tens of millions of acre-layers
            interval: Daily field sync
      - name: JD Operations Center
        core: true
        icon: apps
        summary: 'John Deere''s farm-management hub: fields, jobs, guidance lines and agronomic layers, the offboard home for the data machines generate in the field.'
        citations:
          - jd-opscenter
        category: Farm Management System (FMS)
        what_it_is: Farm-management hub for fields, jobs, guidance lines and agronomic layers, the offboard home for machine-generated field data.
        who_uses_it: Digital Product, Grower Success and Agronomy Advisory teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: millions of jobs and field records
            interval: Daily field sync
      - name: Trimble Ag Software
        icon: sheet
        summary: Precision-ag field records, mapping and prescription authoring used across mixed-fleet operations, feeding boundaries and as-applied data into the estate.
        citations:
          - trimble-ag
        category: Precision Ag Software
        what_it_is: Precision-ag field records, mapping and prescription authoring across mixed-fleet operations, feeding boundaries and as-applied data.
        who_uses_it: Precision Ag Product, Agronomy Advisory and Geospatial Eng teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: hundreds of thousands of field records
            interval: Daily field sync
      - name: Granular Insights
        icon: product
        summary: Corteva's agronomic planning and field-data insights; the farm-financials business was divested.
        citations:
          - granular
        category: Agronomic Planning Software
        what_it_is: Agronomic planning and field-data insights tied to the crop portfolio, feeding planning layers into the estate.
        who_uses_it: Agronomy Advisory, Digital Product and Crop Science R&D teams.
        data_out:
          batch:
            types:
              - structured
            volume: hundreds of thousands of plan records
            interval: Daily field sync
  - name: Equipment Telematics
    icon: iot
    simplified: 3
    tiles:
      - name: JDLink Telematics
        icon: iot
        summary: 'John Deere machine connectivity: position, engine, implement and as-applied telemetry streamed off the machine into the Operations Center and the data platform.'
        citations:
          - jdlink
        category: Equipment Telematics
        what_it_is: Machine connectivity for position, engine, implement and as-applied telemetry streamed off the machine into the platform.
        who_uses_it: Telematics Engineering, Machine Reliability and Autonomy & Guidance teams.
        data_out:
          stream:
            types:
              - structured
              - semi-structured
            volume: petabyte-scale telemetry across the fleet
            interval: Continuous (machine bus)
      - name: CNH AFS Connect
        icon: iot
        summary: 'Case IH and New Holland fleet telematics and remote display access: machine health, location and agronomic data across the CNH equipment estate.'
        citations:
          - cnh-afs
        category: Equipment Telematics
        what_it_is: Fleet telematics and remote display access for machine health, location and agronomic data across the CNH estate.
        who_uses_it: Telematics Engineering, Machine Reliability and Dealer Network teams.
        data_out:
          stream:
            types:
              - structured
              - semi-structured
            volume: hundreds of GB/day of telemetry
            interval: Continuous (machine bus)
      - name: PTx (AGCO)
        icon: stream
        summary: 'AGCO''s precision ag brand across Fendt, Massey Ferguson and Valtra (Precision Planting and PTx Trimble): mixed-fleet machine and agronomic data brought together for the operation.'
        citations:
          - agco-fuse
        category: Equipment Telematics
        what_it_is: Precision-ag brand bringing mixed-fleet machine and agronomic data across Fendt, Massey Ferguson and Valtra together for the operation.
        who_uses_it: Telematics Engineering, Precision Ag Product and Machine Reliability teams.
        data_out:
          stream:
            types:
              - structured
              - semi-structured
            volume: hundreds of GB/day of telemetry
            interval: Continuous (machine bus)
      - name: ISOBUS Task Data
        icon: connect
        summary: 'The ISO 11783 in-cab standard for task controllers and implement data: as-applied logs and prescriptions exchanged between terminal and machine, parsed on arrival.'
        citations:
          - isobus
        category: Machine Data Standard
        what_it_is: 'ISO 11783 task-controller and implement data: as-applied logs and prescriptions exchanged between terminal and machine, parsed on arrival.'
        who_uses_it: Geospatial Eng, Telematics Engineering and Precision Ag Product teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: millions of as-applied task files
            interval: Per field pass
  - name: Imagery & Remote Sensing
    icon: globe
    simplified: 2
    tiles:
      - name: Planet Imagery
        icon: globe
        summary: Daily high-cadence satellite imagery over every field, the raster source behind vegetation-index time series and in-season crop monitoring.
        citations:
          - planet
        category: Satellite Imagery Provider
        what_it_is: Daily high-cadence satellite imagery over every field, the raster source behind vegetation-index time series and in-season crop monitoring.
        who_uses_it: Geospatial Eng, Ag Data Science and Agronomy Advisory teams.
        data_out:
          batch:
            types:
              - unstructured
              - semi-structured
            volume: terabytes of raster tiles/day
            interval: Daily imagery pass
      - name: Sentinel Hub
        icon: globe
        summary: Copernicus Sentinel-2 and Landsat archive access with on-the-fly processing, the free-tier backbone for NDVI and change-detection layers.
        citations:
          - sentinelhub
        category: Satellite Imagery Provider
        what_it_is: Copernicus Sentinel-2 and Landsat archive access with on-the-fly processing, the backbone for NDVI and change-detection layers.
        who_uses_it: Geospatial Eng, Ag Data Science and Sustainability teams.
        data_out:
          batch:
            types:
              - unstructured
              - semi-structured
            volume: hundreds of GB of raster/day
            interval: Per revisit cycle
      - name: DJI Ag Drones
        icon: media
        summary: Low-altitude drone imagery and multispectral capture for scouting and trial plots, landed as high-resolution rasters alongside the satellite feeds.
        citations:
          - dji-ag
        category: Drone / Aerial Imagery
        what_it_is: Low-altitude drone imagery and multispectral capture for scouting and trial plots, landed as high-resolution rasters.
        who_uses_it: Field Trials, Agronomy Advisory and Geospatial Eng teams.
        data_out:
          batch:
            types:
              - unstructured
            volume: high-resolution rasters per flight
            interval: Per scouting flight
      - name: EarthDaily (EarthOne)
        icon: network
        summary: Analysis-ready geospatial data and remote-sensing models over large areas, used for regional crop and yield signals.
        citations:
          - descartes
        category: Geospatial Analytics Provider
        what_it_is: Analysis-ready geospatial data and remote-sensing models over large areas, used for regional crop and yield signals.
        who_uses_it: Ag Data Science, Geospatial Eng and Agronomy & R&D teams.
        data_out:
          batch:
            types:
              - semi-structured
              - unstructured
            volume: regional raster and index products
