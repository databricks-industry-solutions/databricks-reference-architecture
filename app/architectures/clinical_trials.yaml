agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Enrollment & Sites Agent
        icon: genie
        summary: Ask how enrollment is tracking to plan and which sites are at risk, in plain language.
        feeds:
          - Veeva CTMS
          - Medidata Rave EDC
          - Conformed subjects and visits
          - Enrollment, safety signals
        teams:
          - Chief Medical & Clinical Ops
          - Clinical Operations
          - Clinical Trial Manager
        questions:
          - How is enrollment tracking to plan by country and site this month?
          - Which sites are under-enrolling and at risk of closure?
          - What is the screen-failure rate by site and protocol?
          - How long is site activation taking from selection to first patient in?
          - Which countries are driving the current enrollment shortfall?
      - name: Safety Signals Agent
        icon: genie
        summary: Explore adverse events, emerging signals and expedited-reporting timeliness across trials.
        feeds:
          - Argus Safety
          - Veeva Vault Safety
          - WHO Drug Dictionary
          - Enrollment, safety signals
        teams:
          - Medical & Safety
          - Pharmacovigilance
          - Drug Safety Physician
        questions:
          - What is the SAE incidence by product and treatment arm this quarter?
          - Which adverse events are showing an emerging signal across trials?
          - How many expedited reports are approaching their reporting deadline?
          - What is our time-to-signal for newly reported serious events?
          - Which concomitant medications co-occur most with reported events?
      - name: Data Quality & Lock Agent
        icon: genie
        summary: Answer query-aging, completeness and lock-readiness questions across EDC and labs.
        feeds:
          - Medidata Rave EDC
          - LabCorp Central Lab
          - CDISC Standards
          - Conformed subjects and visits
        teams:
          - Data Management
          - Lead Data Manager
          - Standards & CDISC
        questions:
          - Which sites have the oldest open queries right now?
          - What is data completeness on critical variables by study?
          - How many visits are missing or overdue by site?
          - Where does SDTM conformance fail validation checks?
          - How far are we from database-lock readiness this week?
      - name: Site Feasibility Agent
        icon: genie
        summary: Rank sites and geographies for the next protocol from history, registries and real-world data.
        feeds:
          - Veeva CTMS
          - ClinicalTrials.gov
          - IQVIA Real World
          - Flatiron Oncology EHR
        teams:
          - Clinical Operations
          - Chief Medical & Clinical Ops
          - Site Management
        questions:
          - Which sites historically enroll fastest for this indication?
          - What is each candidate site's past data-quality track record?
          - How many competing trials are recruiting the same population?
          - What patient volume does real-world data suggest per region?
          - Which sites combine high enrollment with low screen-failure rates?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Enrollment Forecasting
        short: Operations
        icon: people
        summary: Site and country enrollment predicted against activation curves.
        problem: Enrollment velocity data lands on a monthly cycle, so a site that stalls is only spotted weeks later, after the slip has already pushed the read-out and the whole study timeline.
        who_benefits: Chief Medical & Clinical Ops
        how_built: CTMS and EDC feeds land through Lakeflow, and enrollment-forecast models tracked in MLflow score site and country curves into the Enrollment Cockpit against the activation plan.
        components:
          - Enrollment Cockpit
          - Model Serving
          - MLflow
          - Feature Store
          - Veeva CTMS
        stories:
          - title: Clinical operations intelligence belongs on the Lakehouse
            url: https://www.databricks.com/blog/clinical-operations-intelligence-belongs-lakehouse
          - title: Clinical trials run longer than they have to. That's a patient problem.
            url: https://www.databricks.com/blog/clinical-trials-run-longer-they-have-thats-patient-problem
      - name: Site Selection
        short: Feasibility
        icon: globe
        summary: Sites ranked by historical enrollment and data quality.
        problem: Sites are picked from relationships and last trial's memory, so poor enrollers are chosen again and again while the feasibility signal sits unused in CTMS, registries and RWE.
        who_benefits: Clinical Operations
        how_built: Historical CTMS performance is joined to ClinicalTrials.gov and IQVIA Real World under Unity Catalog, and sites are ranked by enrollment and data-quality models scored in Model Serving.
        components:
          - IQVIA Real World
          - ClinicalTrials.gov
          - Model Serving
          - AI/BI
          - Unity Catalog
        stories:
          - title: Clinical operations intelligence belongs on the Lakehouse
            url: https://www.databricks.com/blog/clinical-operations-intelligence-belongs-lakehouse
      - name: Remote Monitoring
        short: Quality
        icon: observ
        summary: Risk-based monitoring triggers from centralized data review.
        problem: On-site monitoring visits are periodic and expensive, so data issues and safety risks at a site surface only at the next visit, weeks after the signal first appeared in the data.
        who_benefits: Clinical Operations
        how_built: Centralized EDC and lab data land on Lakehouse//RT, and risk-based monitoring models in Model Serving raise site and query triggers reviewed in AI/BI under Unity Catalog.
        components:
          - Lakehouse//RT
          - AI/BI
          - Model Serving
          - Medidata Rave EDC
          - Unity Catalog
        stories:
          - title: Clinical trials run longer than they have to. That's a patient problem.
            url: https://www.databricks.com/blog/clinical-trials-run-longer-they-have-thats-patient-problem
      - name: Safety Signal Detection
        short: PV
        icon: gavel
        summary: Disproportionality and temporal clustering on adverse events.
        problem: Adverse events arrive as structured cases and unstructured narratives across trials, so a real safety signal can hide in the noise until it is late enough to force a labeling change.
        who_benefits: Medical & Safety
        how_built: Case and narrative data feed disproportionality and clustering models tracked in MLflow and scored in Model Serving, surfacing ranked signals in the Safety Signal Hub for medical review.
        components:
          - Safety Signal Hub
          - Model Serving
          - MLflow
          - Argus Safety
          - Feature Store
        stories:
          - title: Improving drug safety with adverse event detection using NLP
            url: https://www.databricks.com/blog/2022/01/17/improving-drug-safety-with-adverse-event-detection-using-nlp.html
      - name: HEOR Acceleration
        short: Evidence
        icon: chart
        summary: Real-world cost and outcomes evidence built for payers and HTA bodies.
        problem: Health-economics and outcomes studies are one-off analyses against fresh extracts that take months to assemble, so payer dossiers and comparative-effectiveness evidence always lag the questions the market is already asking.
        who_benefits: Biostatistics
        how_built: IQVIA real-world data and Flatiron oncology records are conformed under Unity Catalog on Delta Lake and analysed in Notebooks & IDEs, so HEOR cohorts and outcomes evidence carry lineage instead of living in ad hoc spreadsheets.
        components:
          - IQVIA Real World
          - Flatiron Oncology EHR
          - Unity Catalog
          - Delta Lake
          - Notebooks & IDEs
      - name: SDTM Automation
        short: Data Mgmt
        icon: db
        summary: Study data converted to SDTM with traceable mappings.
        problem: SDTM conversion is a manual, spec-driven grind repeated per study, so mapping errors surface late, traceability is thin, and the database-lock-to-submission path is slow and fragile.
        who_benefits: Data Management
        how_built: Raw EDC data is mapped to SDTM through Lakeflow pipelines on Delta Lake, with CDISC Standards and lineage held in Unity Catalog and AI Functions drafting mappings for review.
        components:
          - CDISC Standards
          - Lakeflow
          - Delta Lake
          - Unity Catalog
          - AI Functions
        stories:
          - title: Building a modern clinical trial data + AI platform
            url: https://www.databricks.com/blog/building-modern-clinical-trial-data-intelligence-platform
      - name: Adaptive Trial Design
        short: Biostats
        icon: chart
        summary: Interim results driving sample size or arm changes.
        problem: Interim looks need unblinded results fast and under tight access control, but the analysis data is scattered and every controlled peek is a slow, manual, audit-heavy assembly.
        who_benefits: Biostatistics
        how_built: Governed ADaM data feeds interim analyses in the Interim Analysis Workbench on Notebooks & IDEs, with MLflow and Unity Catalog holding the audit trail behind every sample-size or arm change.
        components:
          - Interim Analysis Workbench
          - Notebooks & IDEs
          - Unity Catalog
          - AI/BI
          - MLflow
        stories:
          - title: Amgen modernizes analytics to speed drug development and delivery
            url: https://www.databricks.com/blog/2022/03/22/amgen-modernizes-analytics-with-a-unified-data-lakehouse-to-speed-drug-development-delivery.html
          - title: Building a modern clinical trial data + AI platform
            url: https://www.databricks.com/blog/building-modern-clinical-trial-data-intelligence-platform
      - name: Patient Recruitment
        short: Digital
        icon: custlake
        summary: Candidate cohorts identified from RWE and registries for site screening.
        problem: Trials often miss enrollment timelines because eligible patients are hard to find, and the EHR and registry signals that would surface them sit outside the trial systems.
        who_benefits: Clinical Operations
        how_built: De-identified EHR and registry data from Flatiron and IQVIA are conformed under Unity Catalog, and cohort models in Model Serving estimate protocol-eligible cohort feasibility, with eligibility confirmation and patient contact handled through authorized site recruitment workflows.
        components:
          - Flatiron Oncology EHR
          - IQVIA Real World
          - Model Serving
          - Unity Catalog
          - AI Functions
        stories:
          - title: Clinical operations intelligence belongs on the Lakehouse
            url: https://www.databricks.com/blog/clinical-operations-intelligence-belongs-lakehouse
      - name: Clinical Data Repository
        short: Modernisation
        icon: db
        summary: Legacy SDTM and study marts modernised into one governed repository.
        problem: Historical study data is trapped in ageing SDTM marts and per-study silos, so pooled analysis and legacy queries are slow and every cross-study question turns into another migration project.
        who_benefits: Data Management
        how_built: Federation provides continuing access to retained legacy SDTM marts, while selected datasets are materialized onto Delta Lake under Unity Catalog by Lakeflow, so one governed clinical data repository serves pooled analysis.
        components:
          - Legacy SDTM Mart
          - CDISC Standards
          - Lakeflow
          - Delta Lake
          - Unity Catalog
      - name: OMOP Standardisation
        short: Data model
        icon: api
        summary: Trial and real-world data mapped to the OMOP common data model.
        problem: Every analysis and RWE study remaps clinical and real-world data its own way, so results do not compare across studies and collaborators cannot pool data without yet another translation layer.
        who_benefits: Data Management
        how_built: EDC and real-world data are mapped to the OMOP common data model through Lakeflow on Delta Lake under Unity Catalog, so cohorts, analytics and external collaborations all run against one governed standard.
        components:
          - CDISC Standards
          - IQVIA Real World
          - Lakeflow
          - Delta Lake
          - Unity Catalog
