name: Clinical Trials
description: Protocol design, site operations, patient recruitment, safety monitoring, and regulatory submissions across CROs and sponsors.
sources:
  - name: EDC & eSource
    icon: db
    tiles:
      - name: Medidata Rave EDC
        icon: db
        summary: Case report forms, queries and audit trails by subject.
        citations:
          - medidata-rave
        category: Electronic Data Capture (EDC)
        what_it_is: Captures case report form data, edit-check queries and a per-subject audit trail across sites, the operational system of record for clinical data collection.
        who_uses_it: Clinical Data Management, CRAs / monitors and site coordinators.
        data_out:
          batch:
            types:
              - structured
            volume: 1-10 GB/day per study
            interval: Nightly extracts + intraday query cycles
          stream:
            types:
              - semi-structured
            volume: tens of form events/sec at peak
            interval: Continuous CDC on eCRF saves
      - name: Veeva Vault CDMS
        icon: db
        summary: Unified clinical data management and remote monitoring.
        citations:
          - veeva-cdms
        category: Clinical Data Management System (CDMS)
        what_it_is: Unifies data capture, cleaning and remote monitoring on one clinical data management platform so data managers work review and coding against a single subject record.
        who_uses_it: Clinical Data Management, Clinical Programmers and central monitors.
        data_out:
          batch:
            types:
              - structured
            volume: 1-8 GB/day per study
            interval: Nightly batch + query refreshes
      - name: Oracle Clinical One
        icon: db
        summary: Unified platform for randomization and data capture.
        citations:
          - oracle-clinical
        category: Clinical Data Management & Randomization Platform
        what_it_is: Combines electronic data capture with randomization and trial supply management on one platform, so data capture and drug assignment share a subject model.
        who_uses_it: Clinical Data Management, Clinical Supply and Biostatistics.
        data_out:
          batch:
            types:
              - structured
            volume: 1-6 GB/day per study
            interval: Nightly batch extracts
          stream:
            types:
              - semi-structured
            volume: randomization events on demand
            interval: Continuous at randomization
  - name: CTMS & Sites
    icon: sheet
    simplified: 2
    tiles:
      - name: Veeva CTMS
        icon: sheet
        summary: Site feasibility, activation and enrollment tracking.
        citations:
          - veeva-ctms
        category: Clinical Trial Management System (CTMS)
        what_it_is: Tracks site feasibility, activation milestones, monitoring visits and enrollment against plan across the study's sites and countries.
        who_uses_it: Clinical Operations, Clinical Trial Managers and Site Management.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-3 GB/day
            interval: Nightly sync + intraday updates
      - name: Medidata CTMS
        icon: people
        summary: Monitoring visits, action items and site payments.
        citations:
          - medidata-ctms
        category: Clinical Trial Management System (CTMS)
        what_it_is: Manages monitoring visit reports, action items and visit-based site payments, tying operational site activity to enrollment and quality.
        who_uses_it: Clinical Operations, CRAs / monitors and Site payments teams.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-2 GB/day
            interval: Nightly sync
      - name: Signant SmartSupplies
        core: true
        icon: product
        summary: IRT, drug supply and depot inventory.
        citations:
          - signant
        category: Interactive Response Technology (IRT/RTSM)
        what_it_is: Randomizes subjects and manages drug supply, depot inventory and resupply triggers so the right kit reaches the right site as enrollment moves.
        who_uses_it: Clinical Supply, Clinical Operations and Depot / logistics teams.
        data_out:
          batch:
            types:
              - structured
            volume: 0.2-1 GB/day
            interval: Nightly batch
          stream:
            types:
              - semi-structured
            volume: randomization + dispensing events
            interval: Continuous at dosing
  - name: Safety & PV
    icon: gavel
    simplified: 2
    tiles:
      - name: Argus Safety
        icon: gavel
        summary: SAE processing, MedDRA coding and expedited reporting.
        citations:
          - argus
        category: Pharmacovigilance / Safety System
        what_it_is: Processes individual case safety reports, codes events to MedDRA and drives expedited (E2B) regulatory reporting for adverse events.
        who_uses_it: Pharmacovigilance, Drug Safety Physicians and Medical Monitors.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: 0.5-2 GB/day cases + narratives
            interval: Hourly / daily case intake
      - name: Veeva Vault Safety
        icon: gavel
        summary: Case intake, narrative generation and submissions.
        citations:
          - veeva-safety
        category: Pharmacovigilance / Safety System
        what_it_is: Handles safety case intake, narrative generation and regulatory submissions on a cloud safety platform tied to the trial's adverse-event record.
        who_uses_it: Pharmacovigilance, Drug Safety Physicians and Regulatory reporting.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: 0.5-2 GB/day
            interval: Hourly / daily
      - name: WHO Drug Dictionary
        icon: product
        summary: Medication coding for concomitant therapies.
        citations:
          - who-dd
        category: Drug Dictionary / Medical Coding Reference
        what_it_is: Reference dictionary used to code concomitant medications to a standard so drug exposure and interactions are analysable across studies.
        who_uses_it: Clinical Data Management, Medical coders and Pharmacovigilance.
        data_out:
          batch:
            types:
              - structured
            volume: MBs (reference dictionary)
            interval: Quarterly version releases
  - name: Labs & Imaging
    icon: stream
    tiles:
      - name: LabCorp Central Lab
        icon: stream
        summary: Central lab results with reference ranges by visit.
        citations:
          - labcorp
        category: Central Laboratory
        what_it_is: Runs the trial's central laboratory testing and returns results with reference ranges and flags per subject visit for safety and efficacy review.
        who_uses_it: Clinical Data Management, Medical Monitors and Biostatistics.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Daily result transfers
      - name: Medidata Imaging
        icon: iot
        summary: DICOM reads and lesion measurements for oncology.
        citations:
          - medidata-imaging
        category: Medical Imaging / Imaging Core Lab
        what_it_is: Manages DICOM image acquisition, blinded independent reads and lesion measurements (e.g. RECIST) for imaging endpoints in oncology trials.
        who_uses_it: Imaging core lab reviewers, Medical Monitors and Biostatistics.
        data_out:
          batch:
            types:
              - unstructured
              - structured
            volume: 10-100 GB/day (DICOM)
            interval: Per-visit uploads + read cycles
      - name: Clario eCOA
        core: true
        icon: apps
        summary: Patient-reported outcomes and eDiary entries.
        citations:
          - ert-ecoa
        category: Electronic Clinical Outcome Assessment (eCOA)
        what_it_is: Collects patient-reported outcomes, clinician assessments and eDiary entries on provisioned devices and apps for endpoint measurement.
        who_uses_it: Clinical Operations, Biostatistics and Site coordinators.
        data_out:
          batch:
            types:
              - structured
            volume: 0.2-1 GB/day
            interval: Daily uploads
          stream:
            types:
              - semi-structured
            volume: diary entries as completed
            interval: Continuous device sync
  - name: Regulatory
    icon: share
    tiles:
      - name: Veeva RIM
        icon: share
        summary: Submissions, correspondence and health authority commitments.
        citations:
          - veeva-rim
        category: Regulatory Information Management (RIM)
        what_it_is: Tracks regulatory submissions, health-authority correspondence and commitments so the submission plan and its content stay aligned across regions.
        who_uses_it: Regulatory Affairs, Regulatory Operations and Data Management.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: 0.5-2 GB/day
            interval: Nightly + submission milestones
      - name: CDISC Standards
        icon: api
        summary: SDTM and ADaM datasets for regulatory packages.
        citations:
          - cdisc
        category: Clinical Data Standards (CDISC)
        what_it_is: Defines the SDTM and ADaM dataset standards clinical data is mapped to for a compliant, traceable regulatory submission package.
        who_uses_it: Standards & CDISC, Clinical Programmers and Biostatistics.
        data_out:
          batch:
            types:
              - structured
            volume: MBs (standards + controlled terminology)
            interval: Periodic standard releases
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Legacy SDTM Mart
        icon: fed
        summary: Historical submission datasets queried in place under Unity Catalog.
        category: Clinical Data Warehouse / Submission Data Mart
        what_it_is: Historical SDTM and ADaM submission datasets kept in the incumbent warehouse and queried in place through federation rather than copied.
        who_uses_it: Biostatistics, Statistical Programmers and Regulatory Affairs.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale historical datasets
            interval: Queried on demand (federated)
  - name: Data Formats
    icon: zbraces
    tiles:
      - name: 'CDISC SDTM'
        icon: zbraces
        fmt: 'SDTM'
        summary: 'CDISC Study Data Tabulation Model for organising collected clinical trial data for submission.'
        spec_url: https://www.cdisc.org/standards/foundational/sdtm
      - name: 'CDISC ADaM'
        core: true
        icon: zbraces
        fmt: 'ADaM'
        summary: 'CDISC Analysis Data Model for analysis-ready datasets supporting statistical results.'
        spec_url: https://www.cdisc.org/standards/foundational/adam
      - name: 'ODM-XML'
        icon: zbraces
        fmt: 'ODM'
        summary: 'CDISC Operational Data Model for capturing, exchanging and archiving eCRF data.'
        spec_url: https://www.cdisc.org/standards/data-exchange/odm-xml
        spark_connector: 'spark-xml'
        spark_repo: https://github.com/databricks/spark-xml
        databricks_resource: https://docs.databricks.com/aws/en/query/formats/xml
        source_systems:
          - 'Medidata Rave'
          - 'Oracle Clinical'
          - 'Veeva CDMS'
      - name: 'Define-XML'
        icon: zbraces
        fmt: 'DEF'
        summary: 'CDISC metadata standard describing dataset structure for regulatory submissions.'
        spec_url: https://www.cdisc.org/standards/data-exchange/define-xml
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    tiles:
      - name: ClinicalTrials.gov
        icon: api
        summary: Public trial registry metadata for competitive intelligence.
        citations:
          - clinicaltrials-gov
        category: Public Clinical Trial Registry
        what_it_is: Public registry of trial protocols, sites and status used for competitive intelligence and feasibility benchmarking.
        who_uses_it: Clinical Operations, Feasibility and Portfolio teams.
        data_out:
          batch:
            types:
              - semi-structured
            volume: 100s of MB (registry extracts)
            interval: Weekly / on-demand pulls
      - name: IQVIA Real World
        icon: partner
        summary: External control arms and epidemiology for protocol design.
        citations:
          - iqvia-rwe
        category: Real-World Data / Evidence Provider
        what_it_is: Supplies real-world claims and clinical data for external control arms, epidemiology and protocol design and site targeting.
        who_uses_it: Biostatistics, Epidemiology and Feasibility teams.
        data_out:
          batch:
            types:
              - structured
            volume: 10-100 GB per cohort
            interval: Periodic cohort refreshes
      - name: Flatiron Oncology EHR
        icon: custlake
        summary: De-identified oncology records for external comparators.
        citations:
          - flatiron
        category: Real-World Oncology Data (EHR-derived)
        what_it_is: De-identified, curated oncology EHR data used for external comparator arms and real-world outcomes in cancer trials.
        who_uses_it: Biostatistics, Epidemiology and Medical & Safety.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: 10-50 GB per cohort
            interval: Periodic curated refreshes
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Chief Medical & Clinical Ops
        mark: Genie One
        summary: The CMO on pipeline milestones and study risk; the VP Clinical on enrollment velocity and budget burn against lock timelines.
        uses:
          - - Genie One
            - Ask how enrollment is tracking to plan by country.
          - - AI/BI
            - Milestone and spend on certified Metric Views.
          - - Unity Catalog
            - One subject definition across EDC and safety.
        sub:
          - name: Chief Medical Officer
            cares: pipeline milestones, study risk and the go/no-go calls on programs in flight.
          - name: VP Clinical Operations
            cares: enrollment velocity and budget burn against database-lock timelines.
          - name: Head of Portfolio
            cares: study prioritisation and the trade between speed, cost and quality.
        ucs:
          - Enrollment Forecasting
          - Site Selection
          - Patient Recruitment
      - name: Clinical Operations
        mark: Lakehouse//RT
        summary: Site activation, monitoring and enrollment rescue, run on enrollment velocity, screen-failure rate and query aging by site.
        uses:
          - - Enrollment Cockpit
            - Site velocity and screen-failure drivers.
          - - Lakehouse//RT
            - Query aging at operational latency.
        sub:
          - name: Clinical Trial Manager
            cares: site activation, enrollment rescue and the day-to-day study timeline.
          - name: CRA / Monitor
            cares: source data verification, query aging and protocol compliance by site.
          - name: Site Management
            cares: site feasibility, payments and screen-failure drivers.
        ucs:
          - Enrollment Forecasting
          - Site Selection
          - Remote Monitoring
          - Patient Recruitment
      - name: Data Management
        core: true
        mark: AI/BI
        summary: Database lock readiness, query resolution and SDTM conversion, tracked on open-query aging, data completeness and lock cycle time.
        uses:
          - - Lock Readiness
            - Critical variables and open queries by site.
          - - AI/BI
            - Data quality metrics on governed EDC.
        sub:
          - name: Lead Data Manager
            cares: database-lock readiness, open-query aging and data completeness.
          - name: Clinical Programmer
            cares: edit checks, SDTM conversion and traceable mappings.
          - name: Standards & CDISC
            cares: SDTM and ADaM conformance for the submission package.
        ucs:
          - SDTM Automation
          - Clinical Data Repository
          - OMOP Standardisation
      - name: Medical & Safety
        mark: Model Serving
        summary: DSMB reviews, signal detection and medical monitoring, judged on SAE incidence, time-to-signal and expedited-report timeliness.
        uses:
          - - Safety Signal Hub
            - Emerging AE patterns across trials.
          - - Model Serving
            - Signal detection models on adverse events.
        sub:
          - name: Medical Monitor
            cares: emerging safety signals and the DSMB review of the risk picture.
          - name: Pharmacovigilance
            cares: SAE case processing, expedited reporting and signal timeliness.
          - name: Drug Safety Physician
            cares: causality, labeling impact and the benefit-risk narrative.
        ucs:
          - Safety Signal Detection
          - Remote Monitoring
          - HEOR Acceleration
      - name: Biostatistics
        mark: Apps
        summary: Interim analyses, adaptive designs and TLF production, measured on interim-look turnaround, TLF cycle time and protocol-deviation rate.
        uses:
          - - Interim Analysis Workbench
            - Controlled access to unblinded results.
          - - Apps
            - Statistical review apps on governed ADaM.
        sub:
          - name: Study Biostatistician
            cares: interim looks, adaptive designs and the analysis plan.
          - name: Statistical Programmer
            cares: TLF production and reproducible ADaM-driven outputs.
          - name: Quantitative Sciences
            cares: modeling, sample-size re-estimation and design simulation.
        ucs:
          - Adaptive Trial Design
          - SDTM Automation
          - Safety Signal Detection
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land EDC eCRF entries, central-lab results, imaging reads and safety narratives; own Bronze to Silver and the pager when the enrollment tables stall.
        uses:
          - - Lakeflow Connect
            - Managed connectors for EDC, CTMS and safety sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on lab and eCRF feeds.
          - - Lakewatch
            - Freshness on the enrollment and query tables study teams read daily.
        sub:
          - name: Ingestion Engineer
            cares: landing EDC, central-lab, imaging and safety feeds into Bronze.
          - name: Pipeline Owner
            cares: Bronze-to-Silver conformance and the enrollment-table pager.
          - name: Platform & Governance
            cares: Unity Catalog permissions and the audit trail across sources.
        ucs:
          - Enrollment Forecasting
          - SDTM Automation
          - Remote Monitoring
      - name: Data Scientists
        mark: MLflow
        summary: Enrollment-forecast, risk-based-monitoring and safety signal-detection models, and whether they still hold as sites and protocols amend.
        uses:
          - - Feature Store
            - Subject and site features read identically in training and serving.
          - - MLflow
            - Every enrollment and signal model tracked for audit and reproduction.
          - - Model Serving
            - Signal and monitoring models scored in the review path.
        sub:
          - name: Enrollment Modeler
            cares: site and country enrollment forecasts as protocols amend.
          - name: Safety Signal Scientist
            cares: disproportionality and clustering on adverse events.
          - name: RBM Analyst
            cares: risk-based monitoring triggers from centralized review.
        ucs:
          - Enrollment Forecasting
          - Safety Signal Detection
          - Remote Monitoring
      - name: App Developers
        mark: Apps
        summary: Ship the enrollment cockpit, lock readiness, safety signal hub and interim analysis apps clinical ops and biostats work in, next to governed trial data.
        uses:
          - - Apps
            - Study screens with no separate web tier to secure.
          - - Lakebase
            - Serverless Postgres for monitoring and review state.
          - - Agent Bricks
            - Agents that draft narratives and query resolutions against governed tools.
        sub:
          - name: Clinical App Engineer
            cares: the enrollment cockpit and lock-readiness screens ops work in.
          - name: Safety App Engineer
            cares: the safety signal hub and the case-review workflow.
          - name: Agent Developer
            cares: agents drafting narratives and query resolutions on governed tools.
        ucs:
          - Enrollment Forecasting
          - Safety Signal Detection
          - Adaptive Trial Design
