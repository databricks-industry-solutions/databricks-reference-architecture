pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Exec & Product
        mark: Genie One
        summary: The CEO on growth, net revenue retention and the efficacy story that wins renewals; the Chief Product Officer on activation, engagement and the roadmap that moves learning outcomes; the Chief Learning Officer on whether the product actually teaches.
        uses:
          - - Genie One
            - Ask what this month's retention was by cohort, or which features move outcomes, without booking analyst time.
          - - AI/BI
            - Growth, engagement and learning-outcome metrics on one certified set of Metric Views.
          - - Unity Catalog
            - Certification and the glossary, so "active learner" and "mastery" mean one thing across the company.
        sub:
          - name: CEO
            cares: growth, net revenue retention and the efficacy story behind renewals.
          - name: Chief Product Officer
            cares: activation, engagement and the roadmap that moves outcomes.
          - name: Chief Learning Officer
            cares: whether the product actually teaches, measured on outcomes.
        ucs:
          - Learner Engagement
          - At-Risk & Retention
          - Subscription Churn
          - Adaptive Learning
      - name: Learning Science
        mark: Model Serving
        summary: Learning scientists and psychometricians validating that content teaches, curriculum designers sequencing adaptive paths, and efficacy researchers proving outcome gains against a control cohort.
        uses:
          - - Adaptive Path Engine
            - The next best lesson sequenced per learner from live mastery estimates.
          - - Model Serving
            - Knowledge-tracing and item-response models scored inside the learning path.
          - - MLflow
            - Every efficacy and knowledge-tracing run tracked for audit and reproduction.
        sub:
          - name: Learning scientists
            cares: knowledge tracing, item response and mastery modelling.
          - name: Curriculum designers
            cares: adaptive sequencing and content-to-standard alignment.
          - name: Efficacy researchers
            cares: outcome gains proven against a control cohort.
        ucs:
          - Adaptive Learning
          - Content Efficacy
          - Automated Scoring
          - GenAI Tutor
      - name: Growth & Engage
        core: true
        mark: Lakehouse//RT
        summary: Growth teams on signup-to-activation and free-to-paid conversion, lifecycle marketing on onboarding and reactivation nudges, and engagement analysts on the clickstream signals that predict who quietly disengages.
        uses:
          - - Learner 360
            - Engagement, streaks and risk on one profile per learner.
          - - AI/BI
            - Activation and engagement funnels on governed event data with one metric definition.
          - - Lakehouse//RT
            - Live learner state at the latency an onboarding flow moves at.
        sub:
          - name: Growth
            cares: signup-to-activation and free-to-paid conversion loops.
          - name: Lifecycle marketing
            cares: onboarding, reactivation and in-app nudges.
          - name: Engagement analysts
            cares: the clickstream signals behind quiet disengagement.
        ucs:
          - Learner Engagement
          - GenAI Tutor
          - Support Deflection
      - name: Finance & RevOps
        mark: AI/BI
        summary: The CFO on gross margin, cash and the efficiency of growth; RevOps on seat and usage-based revenue, metering accuracy and billed-to-consumed; the renewals desk on the accounts quietly heading for non-renewal.
        uses:
          - - AI/BI
            - MRR, the ARR bridge and net revenue retention on certified Metric Views.
          - - Model Serving
            - Churn and expansion propensity scored inside the renewals path.
          - - Genie One
            - Ask which accounts are under-billed this month without a finance pull.
        sub:
          - name: CFO
            cares: gross margin, cash and the efficiency of growth.
          - name: RevOps & billing
            cares: seat and usage revenue, metering accuracy and billed-to-consumed.
          - name: Renewals desk
            cares: the accounts quietly heading for non-renewal.
        ucs:
          - Subscription Churn
          - Usage-Based Billing
          - At-Risk & Retention
      - name: Trust & Safety
        mark: Unity Catalog
        summary: Assessment-integrity teams on exam anomalies and proctoring signals, the trust and safety desk on student-safety alerts in K-12 environments, and the privacy office on FERPA, COPPA and GDPR obligations across minors' data.
        uses:
          - - Integrity Monitor
            - Exam-session anomalies and proctoring flags ranked for human review.
          - - Unity Catalog
            - Row and column governance so minors' data is reachable only by who may see it.
          - - Model Serving
            - Anomaly and safety-signal models scored on assessment and clickstream events.
        sub:
          - name: Assessment integrity
            cares: exam anomalies and proctoring-signal review.
          - name: Trust & safety
            cares: student-safety alerts in K-12 environments.
          - name: Privacy office
            cares: FERPA, COPPA and GDPR across minors' data.
        ucs:
          - Exam Integrity
          - Automated Scoring
          - At-Risk & Retention
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land the LMS, rostering, clickstream, billing and assessment feeds with Fivetran, Airbyte and Kafka; run dbt and Airflow on the Bronze to Silver path; own the pager when the engagement and billing tables stall.
        uses:
          - - Lakeflow Connect
            - Managed connectors for Salesforce, Stripe and the SaaS learning sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on clickstream and grade feeds.
          - - Lakewatch
            - Freshness on the engagement and outcome tables the business reads every morning.
        sub:
          - name: Ingestion engineers
            cares: LMS, rostering and billing feeds into Bronze.
          - name: Streaming engineers
            cares: clickstream and xAPI events into Lakehouse//RT.
          - name: Platform & governance
            cares: Unity Catalog permissions and the pipeline SLAs.
        ucs:
          - Learner Engagement
          - Adaptive Learning
          - Usage-Based Billing
      - name: ML Scientists
        mark: MLflow
        summary: Knowledge-tracing, item-response, churn and content-recommendation models built in Python with PyTorch and scikit-learn, and whether they still hold once the curriculum and the cohort change.
        uses:
          - - Feature Store
            - Learner and content features read identically in training and serving.
          - - MLflow
            - Every knowledge-tracing and churn run tracked for audit and reproduction.
          - - Model Serving
            - Mastery, recommendation and churn models scored in the learning and CRM path.
        sub:
          - name: Learning modelers
            cares: knowledge tracing, item response and mastery estimation.
          - name: Applied GenAI
            cares: tutoring and grading agents on governed content.
          - name: MLOps
            cares: tracking and serving models in the learning path.
        ucs:
          - Adaptive Learning
          - Automated Scoring
          - GenAI Tutor
      - name: App Developers
        mark: Apps
        summary: Ship the learner, tutor, adaptive and integrity applications the product runs in, hosted next to governed data with LTI launch into the customer's LMS.
        uses:
          - - Apps
            - Learner and educator screens with no separate web tier to run or secure.
          - - Lakebase
            - Serverless Postgres for learner state, streaks and governed writes.
          - - Agent Bricks
            - Tutor and grading agents that act against governed tools.
        sub:
          - name: Learning app developers
            cares: learner, educator and tutor screens.
          - name: Backend & Lakebase
            cares: learner state and progress with governed writes.
          - name: Agent developers
            cares: tutoring and grading agents over MCP.
        ucs:
          - GenAI Tutor
          - Exam Integrity
consumers:
  - name: BI & Productivity
    icon: chart
    from: bi
    simplified: 2
    tiles:
      - name: Tableau / Power BI
        icon: chart
        summary: Executive and board dashboards against SQL warehouses, with Unity Catalog permissions enforced end to end.
      - name: Microsoft Teams
        icon: chat
        summary: Genie in Teams for Unity Catalog-governed answers from the lakehouse, in the channel product and learning teams already work in.
      - name: Notebooks & IDEs
        icon: notebook
        summary: Analyst notebooks, VS Code and JetBrains against governed learning and revenue data with Genie Code.
  - name: Learner Activation
    icon: zfunnel
    simplified: 2
    tiles:
      - name: Reverse ETL to CDP
        icon: reverse
        summary: Engagement scores and lifecycle segments synced back to Segment and the CRM for in-app and email activation.
        citations:
          - segment
      - name: In-App Nudges
        icon: dial
        summary: Onboarding and re-engagement nudges served into the learning app from governed engagement and risk scores.
      - name: Email & Push
        icon: market
        summary: Lifecycle and reactivation campaigns triggered from governed cohorts in Braze and the marketing stack.
        citations:
          - braze
  - name: Operational Writeback
    icon: opdb
    tiles:
      - name: LTI Grade Passback
        icon: reverse
        summary: Grades and supported mastery representations written back into the customer's LMS gradebook over LTI so the score reaches the course the learner works in.
        citations:
          - oneroster
      - name: CRM Health Writeback
        icon: crm
        summary: Account health and churn risk written back to Salesforce so success teams act in the system they live in.
        citations:
          - salesforce
      - name: Adaptive Content Push
        icon: product
        summary: Next-best content decisions pushed into the learning platform so the path adapts in the flow.
  - name: Partners & Sharing
    icon: share
    tiles:
      - name: Institution Products
        icon: product
        summary: Engagement and outcome products published in Unity Catalog Domains and shared with customer institutions over OpenSharing.
      - name: Publisher Sharing
        icon: share
        summary: Content usage and efficacy shared live with courseware publishers over Delta Sharing rather than quarterly file exchange.
      - name: Embedded Analytics
        icon: aibi
        summary: Educator- and admin-facing dashboards embedded in the product against governed tables with per-tenant row isolation.
  - name: Privacy & Compliance
    icon: gavel
    tiles:
      - name: FERPA & COPPA Evidence
        icon: gavel
        summary: Access and consent evidence for FERPA and COPPA produced from the same governed tables the product runs on.
      - name: Privacy & DSAR
        icon: zshield
        summary: GDPR and CCPA subject access and deletion for learners and guardians coordinated across linked learner, guardian and tenant records rather than a single record.
  - name: Databricks Apps
    icon: apps
    tiles:
      - name: Learner 360
        icon: custlake
        short: Engagement & risk
        summary: 'One profile per learner across every product and LMS: streaks, mastery, engagement and disengagement risk composed from clickstream, assessment and billing signals, on Databricks Apps over Lakebase.'
      - name: Adaptive Path Engine
        icon: ztarget
        short: Personalized learning
        summary: The next best lesson sequenced per learner from live mastery estimates, so each learner sees content pitched at the edge of what they can already do rather than a fixed syllabus.
      - name: Outcomes Studio
        icon: chart
        short: Efficacy analytics
        summary: Where learning scientists and product evaluate which content, sequence and intervention move outcomes, with causal estimates conditioned on documented study design, on the same certified metrics the executive team reads.
      - name: Integrity Monitor
        icon: watch
        short: Exam integrity
        summary: Exam-session anomalies and proctoring signals ranked for human review, so integrity cases surface from the data instead of a spot check after grades post.
  - name: AI/BI Dashboards
    icon: aibi
    tiles:
      - name: Engagement & Activation
        icon: aibi
        summary: Activation, engagement and disengagement funnels on certified Metric Views.
        kpis:
          - Activation rate
          - Weekly active learners
          - Engagement score
          - Disengagement risk
          - Feature adoption
        teams:
          - Growth & Engage
          - Exec & Product
          - Engagement analysts
      - name: Learning Outcomes
        icon: aibi
        summary: Mastery, adaptive-path performance and content efficacy across the product.
