  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Learner Engagement
        short: Engagement
        icon: stream
        summary: Engagement, streaks and quiet disengagement measured on one governed event stream, so product, growth and learning-science read the same activity instead of three tools' versions of it.
        problem: Learning events sit in a CDP and two analytics tools that each define "active" differently, so no two teams agree on engagement or spot the learner drifting toward churn until they are gone.
        who_benefits: Growth & Engage
        how_built: Segment and Snowplow clickstream land through Lakeflow and are conformed to certified Metric Views; engagement and risk are composed per learner in Learner 360 on Lakehouse//RT.
        components:
          - Segment CDP
          - Snowplow Behavioral
          - Lakehouse//RT
          - Learner 360
          - AI/BI
        stories:
          - title: HOMER lifts engagement and cuts churn with Databricks
            url: https://www.databricks.com/customers/homer
          - title: GoGuardian improves learning outcomes with Databricks
            url: https://www.databricks.com/customers/goguardian
      - name: Adaptive Learning
        short: Personalization
        icon: ztarget
        summary: The next best lesson chosen per learner from live mastery estimates, so each learner works at the edge of what they can already do rather than a fixed syllabus.
        problem: A one-size syllabus bores the learner who is ahead and loses the one who is behind, and the mastery signal needed to adapt is scattered across LMS activity and assessment attempts.
        who_benefits: Learning Science
        how_built: xAPI and assessment events feed knowledge-tracing models tracked in MLflow and scored in Model Serving; the Adaptive Path Engine sequences the next item from live mastery.
        components:
          - xAPI Record Store
          - Model Serving
          - Feature Store
          - Adaptive Path Engine
          - MLflow
        stories:
          - title: McGraw Hill drives adaptive learning on Databricks Delta
            url: https://www.databricks.com/blog/leveraging-delta-across-teams-mcgraw-hill
          - title: Democratizing big data and ML at McGraw-Hill
            url: https://www.databricks.com/blog/2017/10/18/using-databricks-democratize-big-data-machine-learning-mcgraw-hill-education.html
      - name: Content Efficacy
        short: Efficacy
        icon: chart
        summary: Comparing which content, sequence and intervention move learning outcomes against a control, with causal claims conditioned on documented study design and assignment rather than asserted from a content calendar.
        problem: Content is shipped on intuition and refreshed on a calendar, while the evidence of what actually teaches sits unjoined across engagement, assessment and outcome data.
        who_benefits: Learning Science
        how_built: Engagement and outcome events are conformed to certified Metric Views; efficacy is measured in AI/BI from the Outcomes Studio on one definition of mastery under Unity Catalog.
        components:
          - Amplitude Analytics
          - AI/BI
          - Outcomes Studio
          - Unity Catalog
          - xAPI Record Store
        stories:
          - title: Democratizing big data and ML at McGraw-Hill
            url: https://www.databricks.com/blog/2017/10/18/using-databricks-democratize-big-data-machine-learning-mcgraw-hill-education.html
          - title: Data analytics and AI in education
            url: https://www.databricks.com/solutions/industries/education
      - name: At-Risk & Retention
        short: Retention
        icon: people
        summary: Predicting the learner who will disengage or fail from LMS activity, assessment and support signals, so the intervention happens before the term is lost, not in the post-mortem.
        problem: At-risk learners are identified after they fail or churn, when the leading signals of struggle were visible weeks earlier across activity, grades and support tickets.
        who_benefits: Exec & Product
        how_built: Activity, assessment and support features feed risk models tracked in MLflow and scored in Model Serving; risk and its drivers surface per learner in Learner 360 for the owning team.
        components:
          - Instructure Canvas
          - Model Serving
          - Feature Store
          - Learner 360
          - MLflow
        stories:
          - title: GoGuardian improves learning outcomes with Databricks
            url: https://www.databricks.com/customers/goguardian
          - title: Data analytics and AI in education
            url: https://www.databricks.com/solutions/industries/education
      - name: Automated Scoring
        short: Assessment
        icon: gauge
        summary: Open-response and behavioural assessments scored by governed models with human oversight, turning a multi-day human backlog into near-instant, consistent feedback.
        problem: Open-response and simulation scoring is a slow, expensive human bottleneck, and inconsistent scoring undermines both the learner's feedback and the assessment's validity.
        who_benefits: Trust & Safety
        how_built: Item banks and rubrics are governed in Unity Catalog; scoring runs through AI Functions and fine-tuned models in Model Serving with an Agent Bricks review loop, tracked in MLflow.
        components:
          - QTI Question Banks
          - AI Functions
          - Model Serving
          - Agent Bricks
          - MLflow
        stories:
          - title: DDI automates behavioral simulation scoring with GenAI
            url: https://www.databricks.com/customers/ddi
      - name: Exam Integrity
        short: Integrity
        icon: gavel
        summary: Exam-session anomalies and proctoring signals ranked for human review, so integrity cases surface from the data rather than a spot check after grades post.
        problem: Proctoring generates far more signal than reviewers can watch, so real cheating hides in the volume while honest learners are flagged by blunt rules.
        who_benefits: Trust & Safety
        how_built: Proctoring, keystroke and response-timing events stream into Lakehouse//RT; anomaly models in Model Serving rank sessions for review in the Integrity Monitor, tracked in MLflow.
        components:
          - Proctorio
          - Model Serving
          - Lakehouse//RT
          - Integrity Monitor
          - MLflow
      - name: GenAI Tutor
        short: Tutoring
        icon: chat
        summary: A governed AI tutor that explains, hints and quizzes from the product's own content and the learner's mastery state, at a scale one-to-one human tutoring never reaches.
        problem: One-to-one tutoring is the strongest lever on outcomes and the least scalable, and an ungoverned chatbot risks hallucinating answers or leaking a minor's data.
        who_benefits: Learning Science
        how_built: Product content is governed in Unity Catalog and retrieved by an Agent Bricks tutor using AI Functions and Model Serving, grounded in the learner's mastery from the Adaptive Path Engine.
        components:
          - Agent Bricks
          - AI Functions
          - Model Serving
          - Adaptive Path Engine
          - Unity Catalog
        stories:
          - title: 'AI applications: tools, use cases and platforms'
            url: https://www.databricks.com/blog/ai-applications
          - title: Data analytics and AI in education
            url: https://www.databricks.com/solutions/industries/education
      - name: Subscription Churn
        short: Retention
        icon: market
        summary: Predicting subscription churn and expansion from engagement, outcome and billing signals so the save happens before the renewal date, not at it.
        problem: Churn shows up in the renewal number when it is too late to act, while the leading signals sit unjoined across product engagement, learning outcomes and billing.
        who_benefits: Finance & RevOps
        how_built: Engagement, outcome and billing features feed churn and expansion models tracked in MLflow and scored in Model Serving; risk is activated through CustomerLake and read in AI/BI.
        components:
          - Chargebee Billing
          - Model Serving
          - Feature Store
          - CustomerLake
          - AI/BI
        stories:
          - title: HOMER lowers churn and lifts conversion with Databricks
            url: https://www.databricks.com/customers/homer
      - name: Usage-Based Billing
        short: Monetization
        icon: gauge
        summary: Seat and usage consumption rated and reconciled to invoices before the close, so the vendor bills exactly what institutions and learners actually used.
        problem: Seat- and usage-based pricing leaks revenue when metering, rating and the invoice disagree, and the reconciliation of consumed to billed only surfaces after the period closes.
        who_benefits: Finance & RevOps
        how_built: Raw seat and usage events are conformed in the lakehouse, rated against the plan and reconciled to Stripe and Chargebee invoices, with margin and revenue-at-risk read in AI/BI.
        components:
          - Stripe Billing
          - Chargebee Billing
          - AI/BI
          - Lakeflow
          - Unity Catalog
        stories:
          - title: Tech builds on AI. Finance protects the margin.
            url: https://www.databricks.com/blog/tech-builds-ai-finance-protects-margin
      - name: Support Deflection
        short: Support
        icon: chat
        summary: A governed assistant that resolves common learner and educator questions from the product docs and ticket history, deflecting volume before it reaches an agent.
        problem: Support volume scales with the learner base, and the answers already exist in docs and past tickets, but agents re-solve the same questions by hand every day.
        who_benefits: Growth & Engage
        how_built: Zendesk and Intercom history and product docs are governed in Unity Catalog and served to an Agent Bricks assistant with AI Functions and Model Serving, deflecting and summarising tickets.
        components:
          - Zendesk Support
          - Intercom
          - Agent Bricks
          - AI Functions
          - Model Serving
        stories:
          - title: LLMs for Customer Service and Support
            url: https://www.databricks.com/solutions/accelerators/llms-customer-service-and-support
medallion:
  Bronze:
    short: Raw learning and billing events
    summary: Clickstream and lesson events from the learning platform, LMS activity and grade-passback callbacks over LTI, rostering files from Clever and OneRoster, Stripe and Chargebee billing records and proctoring and assessment logs, landed exactly as received so an engagement spike or a disputed grade can always be replayed as it stood.
  Silver:
    short: Conformed learner, course, tenant
    summary: Learners, courses, content items and tenants resolved into single conformed entities across the LMS, telemetry, billing and assessment estates, with anonymous device ids stitched to known learners and multi-tenant institution data isolated to one governed hierarchy.
  Gold:
    short: Outcomes, engagement, retention, NRR
    summary: 'Contracted products the product, learning-science and revenue teams run on: engagement and activation funnels, mastery and learning-outcome attainment, at-risk and retention scores by cohort, subscription NRR and churn, and metering accuracy for usage-based billing.'
