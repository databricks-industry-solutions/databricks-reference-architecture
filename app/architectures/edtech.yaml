  - name: Data Formats
    icon: zbraces
    tiles:
      - name: 'LTI'
        icon: zbraces
        fmt: 'LTI'
        summary: '1EdTech Learning Tools Interoperability for launching external tools inside an LMS.'
        spec_url: https://www.1edtech.org/standards/lti
      - name: 'OneRoster'
        core: true
        icon: zbraces
        fmt: '1R'
        summary: '1EdTech standard for exchanging class rosters, enrolments and gradebook data.'
        spec_url: https://www.1edtech.org/standards/oneroster
      - name: 'QTI'
        icon: zbraces
        fmt: 'QTI'
        summary: 'Question and Test Interoperability for portable assessment content and results.'
        spec_url: https://www.1edtech.org/standards/qti
        spark_connector: 'spark-xml'
        spark_repo: https://github.com/databricks/spark-xml
        databricks_resource: https://docs.databricks.com/aws/en/query/formats/xml
        source_systems:
          - 'Canvas'
          - 'TAO'
          - 'Respondus'
      - name: 'Caliper Analytics'
        icon: zbraces
        fmt: 'CAL'
        summary: '1EdTech learning-event data standard for capturing analytics across tools.'
        spec_url: https://www.1edtech.org/standards/caliper
