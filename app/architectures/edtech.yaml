name: EdTech
description: 'EdTech software vendors: online learning platforms, LMS and courseware, assessment and proctoring, adaptive learning, learner engagement, and subscription billing and outcomes analytics.'
sources:
  - name: CRM & Subscriptions
    icon: crm
    simplified: 2
    tiles:
