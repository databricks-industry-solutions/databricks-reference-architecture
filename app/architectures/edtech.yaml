agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Learner Engagement Agent
        icon: genie
        summary: Ask about activation, engagement and quiet disengagement across the base in plain language.
        feeds:
          - Segment CDP
          - Snowplow Behavioral
          - Amplitude Analytics
          - Outcomes, engagement, retention, NRR
        teams:
          - Growth & Engage
          - Engagement analysts
          - Lifecycle marketing
        questions:
          - What was activation by cohort this month versus last?
          - Which learners are drifting toward disengagement right now?
          - Where does the onboarding funnel drop off most?
          - Which features correlate with sustained engagement?
          - How does engagement differ between free and paid learners?
      - name: Learning Outcomes Agent
        icon: genie
        summary: Explore mastery, adaptive-path performance and content efficacy, qualifying control comparisons by study type.
        feeds:
