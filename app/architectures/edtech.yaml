        category: CRM
        what_it_is: System-of-record for institution and district accounts, opportunities and pipeline, and the customer hierarchy every revenue metric rolls up to.
        who_uses_it: Sales, RevOps and Customer success teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Hourly / nightly sync
          stream:
            types:
              - semi-structured
            volume: tens of events/sec
            interval: Continuous CDC
