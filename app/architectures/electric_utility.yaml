  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Demand Forecasting
        short: Peak & net load
        icon: chart
        summary: Short- and long-term demand forecasts that account for weather, DER and electrification load growth.
        problem: Demand is shifting under electrification, rooftop solar and heat waves, but forecasts built on last year's load and a spreadsheet miss the peaks that set purchased-power cost.
        who_benefits: Grid Operations
        how_built: Meter, weather and DER features are engineered in Feature Store and scored through Model Serving, tracked in MLflow, so the Load Forecast Console shows weather-adjusted load before the desk commits.
        components:
          - Load Forecast Console
          - Feature Store
          - Model Serving
          - MLflow
          - Weather Data Services
        stories:
          - title: Unlocking the future of energy with smart meter innovation (Southern Company)
            url: https://www.databricks.com/blog/unlocking-future-energy-smart-meter-innovation
          - title: Kraken deploys Delta Sharing to scale secure global operations
            url: https://www.databricks.com/customers/kraken
          - title: Accelerating Europe's energy transition with energy flexibility
            url: https://www.databricks.com/customers/sympower
      - name: Grid Management & Energy Mix
        short: DER & energy mix
        icon: stream
        summary: Feeder load, DER output and switching balanced so the distribution grid holds voltage and thermal limits as the energy mix shifts.
        problem: DER, storage and flexible load swing feeder state minute to minute while dispatch signals, inverter telemetry and the network model live apart, so the grid runs conservatively and hosting capacity is left unused.
        who_benefits: Grid Operations
        how_built: ADMS, DERMS and IEEE 2030.5 telemetry land in Lakehouse//RT; DER voltage setpoint advisories are scored in Model Serving and routed through DERMS, while discrete switching plans are proposed for operator approval and executed through ADMS; Lakebase holds a governed working copy of approved feeder constraints, with incumbent systems retaining approval and execution.
        components:
          - Lakehouse//RT
          - Model Serving
          - GE Vernova ADMS
          - AutoGrid Flex DERMS
          - ADMS Switching Orders
        stories:
          - title: Octopus Energy builds the world's largest virtual power plant (2026 Customer Awards)
            url: https://www.databricks.com/blog/announcing-winners-2026-databricks-customer-awards
      - name: Predictive Maintenance & Asset Health
        short: Grid asset health
        icon: gauge
        summary: Transformer, feeder, breaker and regulator failure risk scored from loading, condition and SCADA telemetry so plant is replaced or serviced before the fault.
        problem: Asset condition sits across EAM records, SCADA analogs and AMI voltage while plant is maintained on a calendar, so overloaded and aging assets fail in service instead of being replaced on a risk-ranked plan.
        who_benefits: Asset Management
        how_built: EAM condition, PI historian loading and AMI voltage are conformed on Delta Lake and scored for failure risk and remaining life in Model Serving tracked in MLflow, raising work orders and ranking assets in the Asset Health Cockpit.
        components:
          - Asset Health Cockpit
          - AVEVA PI Historian
          - ABB Ellipse EAM
          - Model Serving
          - MLflow
        stories:
          - title: AusNet Services predicts asset risk with Databricks
            url: https://www.databricks.com/customers/ausnet-services
          - title: What is predictive maintenance on the Databricks platform
            url: https://www.databricks.com/blog/what-is-predictive-maintenance
          - title: Introducing the Data + AI Platform for Energy
            url: https://www.databricks.com/blog/introducing-data-intelligence-platform-energy
      - name: Sustainability & Circular Economy
        short: Emissions & losses
        icon: globe
        summary: Grid emissions, technical and non-technical losses and DER-driven decarbonisation tracked and reduced on governed data, with asset reuse weighed against replacement.
        problem: Emissions factors, line-loss data, DER output and asset-disposal records sit in separate systems, so the utility cannot report decarbonisation progress or target the losses and asset waste that erode both cost and sustainability goals.
        who_benefits: Grid Operations
        how_built: AMI loss data, DERMS output and PI historian records conform under Unity Catalog; loss and emissions metrics are modelled in AI/BI and published as governed Reliability Reporting products so decarbonisation and loss-reduction progress is traceable to source.
        components:
          - AutoGrid Flex DERMS
          - AVEVA PI Historian
          - Unity Catalog
          - AI/BI
          - Reliability Reporting
        stories:
          - title: SSE Energy Solutions lowers carbon emissions with Databricks
            url: https://www.databricks.com/customers/sse
          - title: Powering a sustainable future that's always on
            url: https://www.databricks.com/customers/uk-power-networks
      - name: Agentic Customer Support & Outage Response
        short: Agentic outage care
        icon: chat
        summary: An agent grounded in live outage and billing state that drafts restoration ETAs, outage notifications and answers to high-bill and program questions for agent approval.
        problem: During an event the contact centre and notification channels lag the control centre, so customers get stale restoration times and high-bill answers from partial records exactly when call volume spikes and crews are stretched.
        who_benefits: Customer Operations
        how_built: Milsoft OMS state, Oracle CCB billing and Kubra channels join in Lakehouse//RT; an agent on Agent Bricks drafts restoration ETAs, outage notifications and customer answers against governed tools and AI Functions for agent approval.
        components:
          - Milsoft OMS
          - Oracle Utilities CCB
          - Kubra Payment Portal
          - Agent Bricks
          - AI Functions
        stories:
          - title: 'Hawaiian Electric: AI agents transforming electric grid operations'
            url: https://www.databricks.com/blog/manual-autonomous-how-ai-agents-are-transforming-electric-grid-operations
          - title: Alabama Power leverages Databricks for outage and storm modeling
            url: https://www.databricks.com/blog/alabama-power-leverages-databricks-outage-and-storm-modeling
      - name: Regulation Compliance, & External Reporting
        short: Reliability filings
        icon: gavel
        summary: Reliability, DER and sustainability filings produced from the same governed tables operations runs on, traceable back to source.
        problem: SAIDI, SAIFI, DER interconnection and emissions filings are rebuilt each cycle from ledgers and exports the commission cannot trace, so filings lag and a number that cannot be sourced is one a regulator can strike.
        who_benefits: Regulatory & Rates
        how_built: Reliability, interconnection and emissions data conform to Gold under Unity Catalog and are published as governed Reliability Reporting products in AI/BI, filed with full lineage.
        components:
          - Reliability Reporting
          - Unity Catalog
          - AI/BI
          - Regulatory Cost Accounting
          - Data Products
        stories:
          - title: Hawaiian Electric Boosts Regulatory Efficiency
            url: https://www.databricks.com/customers/hawaiian-electric-company/agent-bricks
          - title: Maintaining regulatory compliance with ease
            url: https://www.databricks.com/customers/hawaiian-electric-company
      - name: Scenario Planning & Business Simulation
        short: Electrification scenarios
        icon: model
        summary: Electrification, DER-growth, weather and rate scenarios simulated end to end so grid and financial outcomes are tested before capital and rate decisions are made.
        problem: Planning and rate teams model electrification, DER penetration and rate scenarios in disconnected spreadsheets, so grid load, reliability and revenue impacts never reconcile and decisions rest on a single static case.
        who_benefits: Regulatory & Rates
        how_built: Conformed load, DER, asset and financial data are modelled in AI/BI with Genie One and scored through scenario models in Model Serving tracked in MLflow, so planners and rate teams compare grid and revenue outcomes across cases.
        components:
          - Load Forecast Console
          - Feature Store
          - Model Serving
          - MLflow
          - AI/BI
        stories:
          - title: Stress Testing Supply Chain Networks at Scale on Databricks
            url: https://www.databricks.com/blog/stress-testing-supply-chain-networks-scale-databricks
          - title: "Solution Accelerator: Supply Chain Stress Testing with Digital Twins"
            url: https://github.com/databricks-industry-solutions/supply-chain-stress-test
      - name: Incident & Field Service Assistant
        short: Field crew ops
        icon: apps
        summary: An assistant that gives field crews the switching plan, asset history and safety context for the job, and closes the work order on mobile.
        problem: Crews arrive with paper switching orders and no asset history, so jobs stall on missing context and completions are keyed in later, leaving the network model and work records stale.
        who_benefits: Grid Operations
        how_built: EAM history, the GIS network model and OMS dispatch conform under Unity Catalog; an assistant on Agent Bricks serves crews from Databricks Apps over Lakebase, writing completions back through OMS Crew Dispatch, which relays completion to the authoritative EAM work record.
        components:
          - OMS Crew Dispatch
          - Esri ArcGIS Utility
          - Agent Bricks
          - Lakebase
          - Unity Catalog
        stories:
          - title: Introducing the Data + AI Platform for Energy
            url: https://www.databricks.com/blog/introducing-data-intelligence-platform-energy
      - name: Commodity & Energy Trading
        short: Purchased-power procurement
        icon: market
        summary: Purchased-power procurement and DER dispatch optimised against load forecasts and ISO/RTO price signals, so the wires utility buys the power it must serve at least cost.
        problem: Load, DER availability and ISO/RTO market prices sit in separate systems, so purchased power is procured on stale views and the DER value that could offset peak purchases at the transmission-distribution interface is left on the table.
        who_benefits: Grid Operations
        how_built: TSO/DSO market data, DERMS dispatch and load forecasts conform in Lakehouse//RT; purchased-power procurement and DER-offset optimisation is scored in Model Serving tracked in MLflow for procurement and DER operations.
        components:
          - TSO/DSO Market Integration
          - AutoGrid Flex DERMS
          - Load Forecast Console
          - Model Serving
          - MLflow
        stories:
          - title: Data and AI in action across the energy industry
            url: https://www.databricks.com/blog/powering-future-data-and-ai-action-across-energy-industry
      - name: Capital Investment Simulation
        short: Grid capital plan
        icon: sheet
        summary: Capital plan prioritisation, revenue requirement and reliability-per-dollar simulated on governed ledgers so finance and rate design work from one set of numbers.
        problem: Capital, cost-of-service and reliability numbers are spread across finance and operations systems, so each rate case and board pack rebuilds them, the numbers rarely reconcile and capital tradeoffs cannot be simulated.
        who_benefits: Regulatory & Rates
        how_built: Jurisdictional cost ledgers are queried in place under Unity Catalog and modelled in AI/BI with Genie One, so revenue requirement, capital and reliability-per-dollar scenarios are simulated from one governed set for rate cases and the board.
        components:
          - Regulatory Cost Accounting
          - Unity Catalog
          - AI/BI
          - Genie One
          - Rate Case Submissions
        stories:
          - title: How telecom CFOs can make smarter network capex decisions with AI
            url: https://www.databricks.com/blog/how-telecom-cfos-can-make-smarter-network-capex-decisions-ai
medallion:
  Bronze:
    short: Raw meter and SCADA
    summary: AMI interval reads, SCADA analogs and events, CIS billing extracts, OMS outage tickets and GIS asset records, landed exactly as received so a meter read or a protection trip can always be replayed.
  Silver:
    short: Conformed meter, premise
    summary: Meters, premises, feeders and assets resolved into single conformed entities across AMI, CIS and GIS, with service point identifiers reconciled and outage events stitched to affected customers.
  Gold:
    short: SAIDI, losses, collections
    summary: 'Contracted products operations and regulators run on: SAIDI and SAIFI by circuit, technical and non-technical loss, collections effectiveness, and demand forecast accuracy.'
