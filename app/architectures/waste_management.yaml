name: Waste Management
description: 'For waste and recycling operators: collection route planning, fleet maintenance and driver safety, scalehouse and landfill operations, disposal logistics, customer billing and pricing, and environmental compliance across municipal and commercial contracts.'
sources:
  - name: Billing & CRM
    icon: erp
    tiles:
      - name: AMCS Platform
        icon: erp
        summary: Customer accounts, service schedules, pricing and invoicing for haulers.
        citations:
          - amcs
        category: Waste ERP & Billing Platform
        what_it_is: Holds customer accounts, service schedules, pricing and invoicing as the core billing platform for haulers.
        who_uses_it: Billing operations, account managers and pricing & revenue teams.
        data_out:
          batch:
            types:
              - structured
            volume: 2-8 GB/day
            interval: Nightly batch + billing cycles
      - name: Routeware Account
        icon: market
        summary: Commercial and residential billing with container asset tracking.
        citations:
          - routeware
        category: Waste Billing & Container Tracking
        what_it_is: Commercial and residential billing with container asset tracking across the customer base.
        who_uses_it: Billing analysts, account managers and container asset teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-4 GB/day
            interval: Nightly batch + billing cycles
      - name: Salesforce Service Cloud
        icon: custlake
        summary: Service cases, missed pickups and contract amendments.
        citations:
          - sf-service
        category: Customer Service CRM
        what_it_is: Manages service cases, missed-pickup reports and contract amendments across commercial and residential accounts.
        who_uses_it: Customer service, account managers and contract renewals teams.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-2 GB/day
            interval: Hourly sync
          stream:
            types:
              - semi-structured
            volume: tens of events/sec
            interval: Continuous CDC
  - name: Dispatch & Routes
    icon: sheet
    tiles:
      - name: RouteSmart
        icon: sheet
        summary: Route design, sequencing and balance for residential and commercial lines.
        citations:
          - routesmart
        category: Route Optimization System
        what_it_is: Designs, sequences and balances residential and commercial routes for the collection fleet.
        who_uses_it: Route managers, dispatch supervisors and operations planning.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-2 GB/day route plans
            interval: Daily route builds
      - name: AMCS Dispatch
        icon: stream
        summary: Daily dispatch, turn-by-turn and completion confirmation.
        citations:
          - amcs-dispatch
        category: Dispatch & Route Execution
        what_it_is: Runs daily dispatch, turn-by-turn navigation and stop-completion confirmation for collection crews.
        who_uses_it: Dispatch supervisors, drivers and route managers.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 100s-1000s of events/sec
            interval: Continuous (completion events)
      - name: Rubicon Route Assist
        icon: partner
        summary: Dynamic routing and contamination feedback from driver devices.
        citations:
          - rubicon
        category: Digital Routing & Driver App
        what_it_is: Provides dynamic routing and contamination feedback captured from driver devices in the field.
        who_uses_it: Dispatch supervisors, drivers and sustainability teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 100s of events/sec
            interval: Continuous (driver events)
  - name: Fleet & Telematics
    icon: iot
    tiles:
      - name: Geotab Fleet
        icon: iot
        summary: Vehicle location, idle time, fuel and maintenance for collection fleets.
        citations:
          - geotab
        category: Fleet Telematics Platform
        what_it_is: Streams vehicle location, idle time, fuel and engine/maintenance data for the collection fleet.
        who_uses_it: Fleet & safety, route managers and maintenance teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 1-10k readings/sec
            interval: Continuous (GPS + engine telemetry)
      - name: Motive ELD
        icon: stream
        summary: Hours of service and safety events for CDL drivers.
        citations:
          - motive
        category: ELD & Driver Safety System
        what_it_is: Captures hours-of-service compliance and driver safety events for CDL drivers on the fleet.
        who_uses_it: Fleet & safety, compliance and dispatch teams.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-2 GB/day logs
            interval: Daily HOS logs
          stream:
            types:
              - semi-structured
            volume: hundreds of events/sec
            interval: Continuous safety events
      - name: Lift Sensors & RFID
        core: true
        icon: partner
        summary: Automated lift counts and container identification on trucks.
        citations:
          - rubicon
        category: Container Identification & Lift Sensors
        what_it_is: Emits automated lift counts and container RFID identification from onboard truck sensors.
        who_uses_it: Route managers, billing verification and sustainability teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 100s-1000s of lifts/sec at peak
            interval: Continuous (lift events)
  - name: Disposal & MRF
    icon: db
    tiles:
      - name: Paradigm Software
        icon: db
        summary: Inbound and outbound scale tickets, tare and moisture adjustments.
        citations:
          - scalehouse
        category: Scalehouse / Weighbridge System
        what_it_is: Records inbound and outbound scale tickets with tare and moisture adjustments at disposal and transfer sites.
        who_uses_it: Scalehouse leads, landfill managers and billing teams.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-2 GB/day tickets
            interval: Continuous tickets + daily batch
      - name: Landfill Gas Monitor
        core: true
        icon: iot
        summary: Gas extraction, flare and wellfield readings for compliance.
        citations:
          - landfill-gas
        category: Landfill Gas Monitoring System
        what_it_is: Monitors gas extraction, flare and wellfield readings across the landfill for compliance and capture optimisation.
        who_uses_it: Landfill managers, environmental and compliance teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: tens-hundreds of readings/sec
            interval: Continuous wellfield monitoring
      - name: Machinex MRF SCADA
        core: true
        icon: stream
        summary: Material recovery throughput, contamination and bale weights.
        citations:
          - machinex
        category: MRF Plant SCADA
        what_it_is: Captures material-recovery throughput, contamination and bale weights from the recycling plant.
        who_uses_it: MRF plant managers, operators and sustainability teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds of signals/sec
            interval: Continuous (plant telemetry)
  - name: Compliance & ESG
    icon: gavel
    tiles:
      - name: Enablon EHS
        icon: gavel
        summary: Permits, inspections and incident reporting for disposal sites.
        citations:
          - enablon
        category: EHS Management System
        what_it_is: Manages permits, inspections and incident reporting for landfills and disposal sites.
        who_uses_it: Regulatory affairs, environmental and site compliance teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 0.5-2 GB/day
            interval: Hourly / daily
      - name: Wastebits Reporting
        icon: chart
        summary: Diversion, recycling and landfill tonnage for municipal reporting.
        citations:
          - wastebits
        category: Diversion & Tonnage Reporting Platform
        what_it_is: Aggregates diversion, recycling and landfill tonnage for municipal and regulatory reporting.
        who_uses_it: ESG reporting, regulatory affairs and municipal contract teams.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-2 GB/day
            interval: Daily + reporting cycles
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Municipal Contract Marts
        icon: fed
        summary: City tonnage and franchise fee marts queried in place under Unity Catalog.
        category: Enterprise Data Warehouse
        what_it_is: City tonnage and franchise-fee marts kept in the incumbent finance warehouse and queried in place through federation rather than copied.
        who_uses_it: VP finance, contract renewals and ESG reporting teams.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale historical marts
            interval: Queried on demand (federated)
  - name: Data Formats
    icon: zbraces
    simplified: 2
    tiles:
      - name: 'EPA Waste Manifest'
        icon: zbraces
        fmt: 'EPA'
        summary: 'US EPA Uniform Hazardous Waste Manifest for cradle-to-grave waste tracking.'
        spec_url: https://www.epa.gov/hwgenerators/uniform-hazardous-waste-manifest
      - name: 'EPA e-Manifest'
        icon: zbraces
        fmt: 'eMAN'
        summary: 'EPA electronic manifest system and API for hazardous-waste shipment data.'
        spec_url: https://www.epa.gov/e-manifest
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    tiles:
      - name: EPA LMOP Data
        icon: gavel
        summary: Landfill gas and emissions reference data for compliance benchmarking.
        citations:
          - epa-lmop
        category: Regulatory Reference Data
        what_it_is: Landfill Methane Outreach Program gas and emissions reference data used for compliance benchmarking.
        who_uses_it: ESG reporting and regulatory affairs teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: MBs-GBs reference data
            interval: Periodic (regulatory updates)
      - name: State Diversion Reports
        icon: api
        summary: Mandatory recycling reporting files consumed for municipal contracts.
        citations:
          - wastebits
        category: Mandatory Recycling Reporting Feed
        what_it_is: Mandatory state recycling and diversion reporting files consumed inbound to satisfy municipal contract obligations.
        who_uses_it: ESG reporting, regulatory affairs and municipal contract teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: MBs-GBs
            interval: Monthly / quarterly filings
      - name: Recycling Market Indices
        core: true
        icon: market
        summary: Commodity bale price indices for MRF revenue planning.
        category: Commodity Price Index Provider
        what_it_is: Commodity bale price indices used to forecast MRF revenue and time bale sales against the market.
        who_uses_it: MRF plant managers, pricing & revenue and sustainability teams.
        data_out:
          batch:
            types:
              - structured
            volume: MBs reference data
            interval: Daily / weekly index updates
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: CEO & Ops Office
        mark: Genie One
        summary: The CEO on margin per ton and contract renewal; the COO on route productivity, missed stops and the collection fleet's safety record.
        uses:
          - - Genie One
            - Ask what last month's diversion rate was without analyst delay.
          - - AI/BI
            - Cost per ton and missed stops on certified Metric Views.
          - - Unity Catalog
            - One ton definition across scale and billing.
        sub:
          - name: CEO
            cares: margin per ton, contract renewals and the growth-versus-cost trade across the book.
          - name: Chief Operating Officer
            cares: route productivity, missed stops and the collection fleet's safety record.
          - name: VP Finance
            cares: cost per ton, disposal spend and cash across municipal and commercial contracts.
        ucs:
          - Route Optimization
          - Missed Stop & Route Efficiency
          - Dynamic Pricing & Working Capital
          - Fleet Predictive Maintenance
      - name: Collection Ops
        mark: Lakehouse//RT
        summary: Dispatchers on route completion, missed stops and contamination callbacks, re-sequencing trucks before a service gap becomes a credit.
        uses:
          - - Dispatch Console
            - Live trucks, stops and exceptions on one map.
          - - Lakehouse//RT
            - GPS and lift events at route latency.
        sub:
          - name: Dispatch Supervisors
            cares: live route completion, exceptions and re-sequencing trucks before a service gap.
          - name: Route Managers
            cares: route balance, productivity and the miles and time each line runs.
          - name: Fleet & Safety
            cares: vehicle uptime, driver hours-of-service and the collection fleet's safety record.
        ucs:
          - Route Optimization
          - Fleet Predictive Maintenance
          - Driver & Workforce Safety
      - name: Disposal & MRF
        core: true
        mark: Apps
        summary: Landfill and MRF managers on remaining airspace, throughput and commodity revenue, balancing inbound tons against permitted daily capacity.
        uses:
          - - Scalehouse Dashboard
            - Inbound tons, diversion and bale inventory in real time.
          - - Apps
            - Site apps hosted next to governed scale data.
        sub:
          - name: Landfill Managers
            cares: remaining permitted airspace, gas capture and inbound tons against daily capacity.
          - name: MRF Plant Managers
            cares: recovery throughput, bale quality and contamination in the recycling stream.
          - name: Scalehouse Leads
            cares: tare, moisture and material class on every inbound and outbound ticket.
        ucs:
          - Tonnage & Commodity Forecasting
          - Disposal & Transfer Logistics
          - Circular Economy & Emissions
      - name: Commercial Sales
        mark: AI/BI
        summary: Account managers on pricing, service changes and churn risk, protecting margin per customer segment before a contract comes up for renewal.
        uses:
          - - AI/BI
            - Revenue and margin by customer segment on certified views.
          - - Genie One
            - Ask which accounts are below target margin.
        sub:
          - name: Account Managers
            cares: service changes, churn risk and margin per commercial account.
          - name: Pricing & Revenue
            cares: container and service fees against cost-to-serve and the market.
          - name: Contract Renewals
            cares: at-risk accounts and the terms up for renewal this quarter.
        ucs:
          - Dynamic Pricing & Working Capital
          - Customer 360 & Churn
          - Compliance & Franchise Reporting
      - name: Sustainability
        mark: Lakeflow
        summary: ESG teams on diversion rate, circularity and municipal reporting, proving material flows by customer and site against franchise commitments.
        uses:
          - - Diversion Registry
            - Material flows and diversion evidence by customer and site.
          - - Lakeflow
            - Scale and route feeds conformed for ESG analytics.
        sub:
          - name: ESG Reporting
            cares: diversion rate, carbon and methane against franchise and corporate commitments.
          - name: Diversion & Circularity
            cares: material flows and recovered-tonnage evidence by customer and site.
          - name: Regulatory Affairs
            cares: permits, EPR obligations and the mandatory municipal reporting calendar.
        ucs:
          - Circular Economy & Emissions
          - Compliance & Franchise Reporting
          - Tonnage & Commodity Forecasting
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land route completion events, scale tickets, GPS and lift sensor reads; own Bronze to Silver and the pager when a cost-per-ton table breaks.
        uses:
          - - Lakeflow Connect
            - Managed connectors for billing, dispatch and scale sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on route and scale feeds.
          - - Lakewatch
            - Freshness on the diversion tables operations reads each morning.
        sub:
          - name: Ingestion Engineers
            cares: billing, dispatch, scale and telematics sources landed exactly as received.
          - name: Pipeline & Streaming
            cares: GPS and lift events at route latency and the Bronze-to-Silver path.
          - name: Data Quality & SRE
            cares: expectations and freshness on the cost-per-ton and diversion tables.
        ucs:
          - Route Optimization
          - Missed Stop & Route Efficiency
          - Tonnage & Commodity Forecasting
      - name: Data Scientists
        mark: MLflow
        summary: Missed-stop, contamination-detection, churn and commodity-revenue models, and whether they still hold as routes and bale indices shift.
        uses:
          - - Feature Store
            - Route and customer features read identically in training and serving.
          - - MLflow
            - Every routing and churn experiment tracked for audit.
          - - Model Serving
            - Missed-stop and churn models scored in the dispatch path.
        sub:
          - name: Routing & Ops ML
            cares: miss-risk, route and remaining-life models scored in the dispatch path.
          - name: Vision & Contamination
            cares: camera and lift-sensor models flagging contaminated recycling loads.
          - name: Churn & Pricing
            cares: commercial churn and price-elasticity models against service and billing.
        ucs:
          - Missed Stop & Route Efficiency
          - Circular Economy & Emissions
          - Customer 360 & Churn
          - Fleet Predictive Maintenance
      - name: App Developers
        mark: Apps
        summary: Ship the Dispatch Console, Scalehouse Dashboard and Diversion Registry apps operations and ESG teams work in, next to governed scale data.
        uses:
          - - Apps
            - Site and dispatch screens with no separate web tier to secure.
          - - Lakebase
            - Serverless Postgres for stop and ticket state writes.
          - - Agent Bricks
            - Agents that draft route changes against governed tools.
        sub:
          - name: Dispatch & Ops Apps
            cares: the Dispatch Console dispatchers and drivers run the day from.
          - name: Scalehouse & Site Apps
            cares: the Scalehouse Dashboard for inbound tons, material class and bale inventory.
          - name: ESG & Registry Apps
            cares: the Diversion Registry that assembles diversion and emissions evidence.
        ucs:
          - Disposal & Transfer Logistics
          - Driver & Workforce Safety
          - Circular Economy & Emissions
