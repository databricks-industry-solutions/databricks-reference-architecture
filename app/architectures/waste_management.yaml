        icon: gauge
        short: Route execution
        summary: Live trucks, stop completion and exceptions on a map with driver messaging.
      - name: Scalehouse Dashboard
        icon: db
        short: Disposal ops
        summary: Inbound tons, material class and bale inventory for landfill and MRF sites.
      - name: Diversion Registry
