        summary: Open-source meta-harness above existing agent frameworks, enabling agent composition, collaboration and centralised governance from one interface.
        capabilities:
          - Build
          - Deploy
          - Optimize
          - Govern
        related:
          - Agent Bricks
          - Unity Gateway
      - name: Claude Code
        core: true
        icon: code
        short: 3rd-party harness
        summary: Anthropic's coding harness working against the platform through MCP, with spend, routing and policy governed by Unity Gateway.
      - name: OpenAI Codex
        core: true
        icon: code
        short: 3rd-party harness
        summary: OpenAI's coding harness connected over MCP, governed at runtime by Unity Gateway rather than trusted by configuration.
      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Collection & Routing Agent
        icon: genie
        summary: Ask about route completion, missed stops and productivity across the fleet in plain language.
        feeds:
          - AMCS Dispatch
          - Geotab Fleet
          - RouteSmart
          - Conformed customer, route
        teams:
          - Collection Ops
          - Dispatch Supervisors
          - Route Managers
        questions:
          - Which routes are running behind schedule right now?
          - How many stops are at risk of being missed today?
          - Which routes have the highest cost per stop this week?
          - Where are trucks idling the most across the fleet?
          - How many service credits did missed stops cost us last month?
      - name: Disposal & MRF Agent
        icon: genie
        summary: Ask about inbound tonnage, landfill airspace, contamination and bale revenue in plain language.
        feeds:
          - Paradigm Software
          - Machinex MRF SCADA
          - Landfill Gas Monitor
          - Cost per ton, diversion
        teams:
          - Disposal & MRF
          - Landfill Managers
          - MRF Plant Managers
        questions:
          - How much inbound tonnage did we take yesterday by material class?
          - How fast is landfill airspace being consumed against permit?
          - What is our contamination rate in the recycling stream this week?
          - What is forecast bale revenue against current commodity indices?
          - How is gas capture tracking across the wellfield?
      - name: Commercial Accounts Agent
        icon: genie
        summary: Explore account margin, pricing and churn risk across the book in plain language.
        feeds:
          - AMCS Platform
          - Salesforce Service Cloud
          - Routeware Account
          - Cost per ton, diversion
        teams:
          - Commercial Sales
          - Account Managers
          - Pricing & Revenue
        questions:
          - Which accounts are below target margin right now?
          - Which commercial accounts are at highest churn risk this quarter?
          - How does cost-to-serve compare to price by segment?
          - Which contracts are up for renewal in the next 90 days?
          - Where would a price adjustment most improve margin without raising churn?
      - name: Sustainability & ESG Agent
        icon: genie
        summary: Ask about diversion, estimated methane emissions and fleet-activity carbon against franchise commitments, distinct from gas-capture readings, in plain language.
        feeds:
          - Wastebits Reporting
          - Landfill Gas Monitor
          - EPA LMOP Data
          - Machinex MRF SCADA
        teams:
          - Sustainability
          - ESG Reporting
          - Diversion & Circularity
        questions:
          - What is our diversion rate by customer and site this month?
          - How are landfill methane emissions trending this year?
          - Which municipal contracts are behind on diversion targets?
          - What is fleet carbon intensity per ton collected?
          - How much recovered tonnage can we evidence for EPR obligations?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Route Optimization
        short: Collection
        icon: sheet
        summary: Residential and commercial routes rebalanced for miles, time and safety.
        problem: Residential and commercial routes are planned on last year's map, so trucks run extra miles, miss time windows and burn fuel while dispatchers cannot see the day as it actually unfolds.
        who_benefits: Collection Ops
        how_built: GPS, lift and completion feeds land in Lakehouse//RT and feed routing models in Model Serving, with optimised stop order pushed to driver devices from the Dispatch Console.
        components:
          - Dispatch Console
          - Lakehouse//RT
          - Model Serving
          - Geotab Fleet
          - RouteSmart
          - Delta Lake
        stories:
          - title: Cleanaway champions a sustainable means to waste management
            url: https://www.databricks.com/customers/cleanaway
          - title: Fleet optimization with CARTO & Databricks
            url: https://www.databricks.com/blog/fleet-optimization-carto-databricks
      - name: Fleet Predictive Maintenance
        short: Assets
        icon: iot
        summary: Predictive maintenance from telematics before a truck breaks down on route.
        problem: A truck that breaks down mid-route strands a full load and blows the day's schedule, yet maintenance runs on fixed mileage rather than the engine and idle data the fleet already streams.
        who_benefits: Collection Ops
        how_built: Geotab and ELD telemetry stream into Lakehouse//RT and feed remaining-life models tracked in MLflow and scored in Model Serving, so a service is booked before a breakdown lands on route.
        components:
          - Dispatch Console
          - Geotab Fleet
          - Motive ELD
          - Lakehouse//RT
          - Model Serving
          - MLflow
        stories:
          - title: What is Predictive Maintenance?
            url: https://www.databricks.com/blog/what-is-predictive-maintenance
          - title: 'Vinli: fleet optimization powered by AI'
            url: https://www.databricks.com/customers/vinli
      - name: Tonnage & Commodity Forecasting
        short: Demand
        icon: market
        summary: Inbound tonnage and bale revenue forecast against demand and volatile commodity indices so sites plan capacity and sell into strength.
        problem: Inbound tonnage swings with seasons and contracts while bale revenue swings with volatile commodity indices, and with throughput, quality and price in separate systems the site cannot forecast demand or decide when to sell.
        who_benefits: Disposal & MRF
        how_built: Scale-ticket tonnage and MRF bale weights conform on Delta Lake and join to commodity indices; demand and revenue models tracked in MLflow score in Model Serving, surfaced in the Scalehouse Dashboard and AI/BI.
        components:
          - Scalehouse Dashboard
          - Paradigm Software
          - Machinex MRF SCADA
          - Recycling Market Indices
          - Model Serving
          - AI/BI
        stories:
          - title: Sustainability in Aluminum Production
            url: https://www.databricks.com/blog/sustainability-aluminum-production
      - name: Disposal & Transfer Logistics
        short: Disposal
        icon: db
        summary: Hauls routed to the right transfer station or landfill against tip fees, backhaul and remaining airspace so disposal cost and capacity are managed together.
        problem: Loads are hauled to the default site regardless of tip fee, distance or remaining permitted airspace, so disposal cost climbs, sites fill unevenly and backhaul opportunities are missed.
        who_benefits: Disposal & MRF
        how_built: Scale tickets, route completion and survey volumes conform on Delta Lake under Unity Catalog, and disposal-allocation and airspace models in Model Serving surface site choice and capacity burn in the Scalehouse Dashboard.
        components:
          - Scalehouse Dashboard
          - Paradigm Software
          - AMCS Dispatch
          - Model Serving
          - Unity Catalog
          - Delta Lake
      - name: Circular Economy & Emissions
        short: ESG
        icon: chart
        summary: Recycling contamination, diversion and landfill-gas and fleet emissions tracked together for circular-economy performance and sustainability reporting.
        problem: Contamination downgrades recycling with no feedback to the route, while landfill gas capture and fleet emissions are reported from spreadsheets months late, so circular-economy and carbon commitments cannot be shown live.
        who_benefits: Sustainability
        how_built: Lift-sensor and MRF camera streams feed contamination vision models in Model Serving with flags written back to the account, and landfill gas-capture readings and fleet activity with emissions factors conform on Delta Lake under Unity Catalog for diversion and emissions evidence in the Diversion Registry, keeping captured gas distinct from estimated methane emissions.
        components:
          - Diversion Registry
          - Machinex MRF SCADA
          - Landfill Gas Monitor
          - Model Serving
          - Unity Catalog
          - Delta Lake
        stories:
          - title: How Dow Built a Carbon Footprint Ledger on Databricks
            url: https://www.databricks.com/blog/how-dow-built-carbon-footprint-ledger-databricks-accelerate-sustainability-scale
          - title: From emissions reporting to decarbonization decisions
            url: https://www.databricks.com/blog/emissions-reporting-decarbonization-decisions
      - name: Compliance & Franchise Reporting
        short: Contracts
        icon: gavel
        summary: Franchise fee, diversion, permit and EPR evidence assembled for city and regulator audits on schedule.
        problem: City franchise and regulatory contracts demand tonnage, diversion, permit and service-level evidence on schedule, and assembling it by hand from scale, route and EHS systems for each audit is slow and hard to defend.
        who_benefits: Sustainability
        how_built: Scale, route, EHS and diversion data conform into governed Gold products under Unity Catalog and publish to city contracts and regulators over OpenSharing from the Diversion Registry.
        components:
          - Diversion Registry
          - Wastebits Reporting
          - Enablon EHS
          - Unity Catalog
          - OpenSharing
          - Data Products
      - name: Customer 360 & Churn
        short: Sales
        icon: custlake
        summary: A unified commercial account view scoring churn from service quality, billing and price before the cancellation notice.
        problem: Commercial accounts leave after a run of missed pickups or a price rise, but service quality, billing and pricing live in separate systems so churn first shows as the cancellation notice.
        who_benefits: Commercial Sales
        how_built: Service, billing and interaction history conform under Unity Catalog into one account view and score in Model Serving, with at-risk accounts surfaced in the Commercial Pricing Hub before renewal.
        components:
          - Commercial Pricing Hub
          - Salesforce Service Cloud
          - Model Serving
          - Unity Catalog
          - Feature Store
          - AI/BI
      - name: Driver & Workforce Safety
        short: Safety
        icon: people
        summary: Unsafe driving, fatigue and lift-hazard risk flagged from telematics, ELD and driver-app signals before an injury or collision.
        problem: Driver fatigue, harsh-driving and lift hazards surface only after an incident or a CSA hit, while the ELD, telematics and driver-app signals that predict them sit unaggregated across systems.
        who_benefits: Collection Ops
        how_built: Motive ELD hours-of-service, Geotab harsh-driving and Rubicon driver-app events conform on Delta Lake, and safety-risk models tracked in MLflow score in Model Serving so at-risk drivers and behaviours surface in AI/BI for coaching.
        components:
          - Motive ELD
          - Geotab Fleet
          - Rubicon Route Assist
          - Model Serving
          - MLflow
          - AI/BI
      - name: Missed Stop & Route Efficiency
        short: Service
        icon: stream
        summary: Stops at risk of miss flagged and route resource use tightened from GPS, lift and history so trucks finish clean with fewer miles.
        problem: Missed pickups surface only when the customer calls, and by then the crew has left the street, a service credit is owed and the route runs extra miles the next day.
        who_benefits: Collection Ops
        how_built: GPS traces, lift-sensor reads and service history land through Lakeflow and score miss-risk and productivity models in Model Serving, raising exceptions and efficiency guidance on the Dispatch Console before the truck leaves the zone.
        components:
          - Dispatch Console
          - Lakeflow
          - Model Serving
          - Lift Sensors & RFID
          - Salesforce Service Cloud
          - Feature Store
        stories:
          - title: Cleanaway champions a sustainable means to waste management
            url: https://www.databricks.com/customers/cleanaway
      - name: Dynamic Pricing & Working Capital
        short: Commercial
        icon: gauge
        summary: Container and service fees tuned to cost-to-serve and churn, and cash from billing and disposal spend tracked so margin and working capital hold.
        problem: Container and service fees are set once at contract while disposal and fuel cost climb and receivables and disposal spend sit in separate ledgers, so margin erodes and cash is only reconciled after the fact.
        who_benefits: Commercial Sales
        how_built: Cost-to-serve, disposal, churn and receivables signals conform under Unity Catalog and score in Model Serving, surfacing per-account price, margin and cash guidance in the Commercial Pricing Hub on AI/BI.
        components:
          - Commercial Pricing Hub
          - Model Serving
          - Unity Catalog
          - AMCS Platform
          - AI/BI
          - Delta Lake
medallion:
  Bronze:
    short: Raw route and scale feeds
    summary: Route completion events, scalehouse tickets, GPS and lift sensor reads, customer service orders and billing cycles, landed exactly as received so a missed stop or a tonnage line can always be replayed.
  Silver:
    short: Conformed customer, route
    summary: Customers, routes, stops and disposal tickets resolved into single conformed entities across billing, dispatch and scale systems, with service history stitched to one account.
  Gold:
    short: Cost per ton, diversion
    summary: 'Contracted products operations and sustainability teams run on: cost per ton, diversion rate, missed stops, landfill airspace and customer churn by segment.'
