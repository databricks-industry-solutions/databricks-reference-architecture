name: Restaurants
description: 'Restaurant and foodservice operators: POS and kitchen execution, inventory and labor, franchise performance and delivery marketplace integration.'
sources:
  - name: POS & Kitchen
    icon: market
    simplified: 3
    tiles:
      - name: NCR Aloha POS
        icon: market
        summary: Guest checks, modifiers, voids and payment tenders from dine-in and bar.
        citations:
          - ncr-aloha
        category: Restaurant POS
        what_it_is: Captures guest checks, modifiers, voids, comps and payment tenders across dine-in, bar and counter service.
        who_uses_it: Store operations, Shift managers and Loss prevention teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Nightly polling extracts
          stream:
            types:
              - semi-structured
            volume: hundreds of checks/sec at peak
            interval: Continuous (POS transactions)
      - name: Toast Restaurant POS
        icon: partner
        summary: Full-service and QSR transactions with online ordering integration.
        citations:
          - toast
        category: Restaurant POS
        what_it_is: Cloud POS for full-service and QSR that unifies in-store checks with online and app ordering on one platform.
        who_uses_it: Store operations, Digital ordering and Menu management teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds of orders/sec at peak
            interval: Continuous (API / webhook)
      - name: QSR Automations KDS
        icon: stream
        summary: Kitchen display timing, bump events and course sequencing.
        citations:
          - qsr-automations
        category: Kitchen Display System (KDS)
        what_it_is: Drives kitchen display timing, bump events and course sequencing so ticket and prep times can be measured.
        who_uses_it: Kitchen operations, Speed-of-service and Operations teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: thousands of bump events/min at peak
            interval: Continuous (kitchen events)
  - name: Back Office & ERP
    icon: erp
    simplified: 3
    tiles:
      - name: Restaurant365
        icon: erp
        summary: AP, inventory, scheduling and store P&L for multi-unit operators.
        citations:
          - r365
        category: Restaurant Back-Office / ERP
        what_it_is: Restaurant-specific ERP covering accounts payable, inventory, scheduling and store-level P&L for multi-unit operators.
        who_uses_it: Finance, Controllers and Above-store operations teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-8 GB/day
            interval: Nightly close + intraday deltas
      - name: CrunchTime Inventory
        icon: sheet
        summary: Food counts, theoretical usage and waste tracking by store.
        citations:
          - crunchtime
        category: Inventory & Food-Cost Management
        what_it_is: Tracks food counts, theoretical versus actual usage and waste by store to drive food-cost control.
        who_uses_it: Finance, Kitchen operations and Purchasing teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-4 GB/day counts + usage
            interval: Daily counts + period close
      - name: SAP Business One
        icon: db
        summary: Franchise billing, royalties and consolidated financial close.
        citations:
          - sap-b1
        category: Financial / ERP System
        what_it_is: Handles franchise billing, royalty accruals and the consolidated financial close for the operator.
        who_uses_it: Finance, Franchise accounting and Treasury teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Nightly batch + period close
  - name: Labor & Scheduling
    icon: people
    simplified: 2
    tiles:
      - name: HotSchedules
        icon: people
        summary: Shift schedules, punches and labor compliance across locations.
        citations:
          - hotschedules
        category: Workforce Scheduling System
        what_it_is: Builds shift schedules, captures punches and enforces labor-compliance rules across store locations.
        who_uses_it: Store managers, Above-store operations and HR compliance teams.
        data_out:
          batch:
            types:
              - structured
            volume: sub-GB to 2 GB/day
            interval: Hourly punch + schedule sync
      - name: Deputy Workforce
        icon: chart
        summary: Time and attendance, leave and wage rules for hourly teams.
        citations:
          - deputy
        category: Time & Attendance Platform
        what_it_is: Records time and attendance, leave and wage rules for hourly teams and feeds payroll and labor analytics.
        who_uses_it: Store managers, Payroll and HR teams.
        data_out:
          batch:
            types:
              - structured
            volume: sub-GB/day
            interval: Hourly / nightly sync
      - name: Harri Talent Platform
        icon: custlake
        summary: Hiring, onboarding and turnover metrics by store and role.
        citations:
          - harri
        category: HR & Talent Management
        what_it_is: Manages hiring, onboarding and turnover tracking by store and role for high-churn hourly workforces.
        who_uses_it: HR, Recruiting and Store operations teams.
        data_out:
          batch:
            types:
              - structured
            volume: sub-GB/day
            interval: Daily sync
  - name: Delivery & Loyalty
    icon: partner
    simplified: 2
    tiles:
      - name: DoorDash Marketplace
        icon: partner
        summary: Third-party delivery orders, fees and customer ratings by store.
        citations:
          - doordash
        category: Delivery Marketplace
        what_it_is: Third-party delivery marketplace supplying orders, commission and fee detail, refunds and customer ratings per store.
        who_uses_it: Digital & delivery, Store operations and Finance teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 1-3 GB/day orders + payouts
            interval: Hourly orders + daily payout files
      - name: Uber Eats Merchant
        icon: api
        summary: Delivery channel orders, adjustments and payout statements.
        citations:
          - uber-eats
        category: Delivery Marketplace
        what_it_is: Delivery channel supplying orders, adjustments and payout statements reconciled against store sales.
        who_uses_it: Digital & delivery, Store operations and Finance teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 1-3 GB/day
            interval: Hourly orders + daily payouts
      - name: Paytronix Loyalty
        core: true
        icon: custlake
        summary: Guest profiles, offers redeemed and visit frequency.
        citations:
          - paytronix
        category: Loyalty & Guest Engagement
        what_it_is: Holds guest profiles, offer redemptions and visit frequency behind loyalty and win-back programs.
        who_uses_it: Marketing, Loyalty and CRM teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-4 GB/day
            interval: Hourly / nightly sync
          stream:
            types:
              - semi-structured
            volume: tens of events/sec
            interval: Continuous (redemption events)
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Franchisee P&L Mart
        icon: fed
        summary: Franchise unit economics left at franchisees and queried in place under Unity Catalog.
        category: Franchise Financial Data Warehouse
        what_it_is: Franchise unit-economics marts left at franchisees and queried in place through federation rather than centralised.
        who_uses_it: Franchise business consultants, Finance and Franchise development teams.
        data_out:
          batch:
            types:
              - structured
            volume: GB-scale per franchisee
            interval: Queried on demand (federated)
  - name: Data Formats
    icon: zbraces
    tiles:
      - name: 'RTN Customer Record'
        icon: zbraces
        fmt: 'RTN'
        summary: 'Restaurant Technology Network open API customer-record data standard.'
        spec_url: https://restauranttechnologynetwork.com/
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    tiles:
      - name: Weather & Events API
        icon: globe
        summary: Local weather and event calendars consumed inbound for demand forecasting.
        category: Weather & Events Data
        what_it_is: Supplies local forecasts and event calendars used as demand-forecasting features for prep, ordering and staffing.
        who_uses_it: Operations, Forecasting scientists and Store managers.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: sub-GB/day
            interval: Hourly / daily pulls
      - name: Commodity Price Feeds
        icon: market
        summary: Protein and produce indices normalised for menu engineering alerts.
        citations:
          - usda-ams
        category: Commodity Price Index
        what_it_is: Normalises protein and produce price indices into food-cost and menu-engineering alerts.
        who_uses_it: Finance, Purchasing and Menu strategy teams.
        data_out:
          batch:
            types:
              - structured
            volume: sub-GB/day
            interval: Daily index files
      - name: Health Dept Inspections
        icon: gavel
        summary: Municipal inspection scores parsed for franchise compliance monitoring.
        category: Regulatory Inspection Data
        what_it_is: Parses municipal health-inspection scores and violations for franchise food-safety and compliance monitoring.
        who_uses_it: Franchise compliance, Food safety and Operations teams.
        data_out:
          batch:
            types:
              - semi-structured
            volume: sub-GB/day
            interval: Weekly / on publication
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Brand Leadership
        mark: Genie One
        summary: The CEO on comparable sales and franchise growth; the CFO on food and labor cost percent when commodity prices and hourly wages spike.
        uses:
          - - Genie One
            - Ask what yesterday's comp sales were by banner without waiting on operations.
          - - AI/BI
            - Sales, labor and margin on one certified set of Metric Views.
          - - Unity Catalog
            - Certification so "comp" means one thing across POS and ERP.
        sub:
          - name: CEO
            cares: comparable sales, franchise growth and the trade between new units and unit margin.
          - name: CFO
            cares: prime cost, cash and food and labor exposure when commodities and wages spike.
          - name: Chief Brand Officer
            cares: menu strategy, LTO cadence and the guest brand promise across banners.
        ucs:
          - Menu Engineering
          - Demand Forecasting
          - New Store Analytics
      - name: Operations
        mark: Lakehouse//RT
        summary: Regional directors on speed of service, void rates and shift execution, watching ticket times and order accuracy against the operations plan.
        uses:
          - - Store Performance
            - Ticket times and void pareto before the ops call.
          - - Lakehouse//RT
            - Kitchen bump events at service latency.
          - - AI/BI
            - Speed and accuracy on governed definitions.
        sub:
          - name: VP Operations
            cares: speed of service, order accuracy and execution against the operations plan.
          - name: Regional Director
            cares: store-level void rates, ticket times and shift execution on the ground.
          - name: Above-Store Coach
            cares: coaching underperforming stores on labor deployment and throughput.
        ucs:
          - Demand Forecasting
          - Labor Optimisation
          - Speed of Service
      - name: Finance & Accounting
        mark: AI/BI
        summary: Controllers on food cost percent, cash over-short and franchise royalties, tracking prime cost against budget before period close.
        uses:
          - - Food Cost Dashboard
            - Theoretical versus actual usage before period close.
          - - AI/BI
            - P&L and prime cost on certified Metric Views.
          - - Genie One
            - Ask which stores missed food cost budget last week.
        sub:
          - name: Controller
            cares: food cost percent, prime cost and cash over-short against budget.
          - name: FP&A
            cares: store P&L forecasting and the variance behind every margin miss.
          - name: Loss Prevention
            cares: void, comp and refund patterns by employee and shift.
        ucs:
          - Food Cost Control
          - Shrink & Void Control
          - Menu Engineering
      - name: Marketing & Loyalty
        mark: CustomerLake
        summary: Brand teams on offers, LTO performance and guest retention, tracking redemption lift and visit frequency across the loyalty base.
        uses:
          - - Loyalty Campaign Hub
            - Offer redemption and lift before national promos launch.
          - - CustomerLake
            - Guest segments without copying loyalty DB elsewhere.
          - - Model Serving
            - Churn models scored on visit patterns.
        sub:
          - name: CMO
            cares: brand campaigns, LTO performance and national promo return.
          - name: Loyalty Manager
            cares: redemption lift, visit frequency and points liability across the base.
          - name: Digital & Delivery
            cares: app orders, marketplace mix and third-party channel economics.
        ucs:
          - Guest Churn
          - Delivery Channel Mix
          - Menu Engineering
      - name: Franchise Development
        mark: Apps
        summary: Franchise leadership on unit economics, compliance and new store pipeline, tracking unit-level P&L and audit scores by franchisee.
        uses:
          - - Franchise Scorecard
            - Unit P&L and audit scores by franchisee.
          - - Apps
            - Compliance workflows on governed operations data.
          - - Unity Catalog
            - One store definition across franchise and corporate.
        sub:
          - name: VP Franchise Development
            cares: the new-unit pipeline and franchisee selection and growth.
          - name: Franchise Business Consultant
            cares: unit economics, audit scores and compliance by franchisee.
          - name: Site Selection
            cares: trade-area analysis and the pro forma behind each new store.
        ucs:
          - Franchise Compliance
          - New Store Analytics
          - Food Cost Control
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land the POS, KDS, inventory and delivery-platform feeds; own the Bronze to Silver path and the pager when a store pipeline breaks.
        uses:
          - - Lakeflow Connect
            - Managed connectors for POS, back-office and delivery sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on check and punch feeds.
          - - Lakewatch
            - Freshness on the comp sales and food cost tables ops reads.
        sub:
          - name: Ingestion Engineer
            cares: POS, KDS, inventory and delivery connectors and the Bronze landing.
          - name: Pipeline Owner
            cares: the Bronze to Silver path and the pager when a store feed breaks.
          - name: Platform Admin
            cares: Unity Catalog permissions and cost across store and franchise data.
        ucs:
          - Demand Forecasting
          - Speed of Service
          - Delivery Channel Mix
      - name: Data Scientists
        mark: MLflow
        summary: Demand-forecast, labor-optimisation, menu-engineering and guest-churn models, and whether they still hold six months after deployment across stores.
        uses:
          - - Feature Store
            - Traffic and weather features read identically in training and serving.
          - - MLflow
            - Every forecast and churn run tracked for audit and reproduction.
          - - Model Serving
            - Demand and churn models scored in the scheduling and loyalty path.
        sub:
          - name: Forecasting Scientist
            cares: store and daypart demand and labor models tuned to weather and events.
          - name: Personalisation Scientist
            cares: guest churn and offer models scored on visit patterns.
          - name: MLOps Engineer
            cares: whether a forecast still holds six months on across hundreds of stores.
        ucs:
          - Demand Forecasting
          - Labor Optimisation
          - Guest Churn
          - Menu Engineering
      - name: App Developers
        mark: Apps
        summary: Ship the store performance, food cost and franchise applications operators and finance work in, hosted next to governed store data.
        uses:
          - - Apps
            - Operational screens with no separate web tier to run or secure.
          - - Lakebase
            - Serverless Postgres for schedule state and governed writes.
          - - Agent Bricks
            - Agents that draft a purchase order against governed tools.
        sub:
          - name: Full-Stack Developer
            cares: the store performance, food cost and franchise screens teams work in.
          - name: Platform Engineer
            cares: Lakebase schedule state and governed writeback to stores.
          - name: Agent Developer
            cares: agents that draft a purchase order against governed tools.
        ucs:
          - Food Cost Control
          - Franchise Compliance
          - Speed of Service
