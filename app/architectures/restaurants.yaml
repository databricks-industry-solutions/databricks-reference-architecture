      - name: Store Performance
        icon: gauge
        short: Comp sales live
        summary: Ticket times, voids and daypart sales on Databricks Apps over Lakebase.
      - name: Food Cost Dashboard
        icon: sheet
        short: Prime cost
        summary: Theoretical versus actual food cost before period close.
      - name: Loyalty Campaign Hub
        icon: custlake
        short: Offer lift
        summary: Redemption and incremental visits before national promos launch.
      - name: Franchise Scorecard
        icon: partner
        short: Unit economics
        summary: P&L, audit scores and compliance by franchisee on one surface.
  - name: AI/BI Dashboards
    icon: aibi
    tiles:
      - name: Comp Sales & Operations
        icon: aibi
