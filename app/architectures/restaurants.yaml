  - name: Agent Harnesses
    icon: agents
    tiles:
      - name: Omnigent OSS
        icon: omni
        short: Databricks, open source
        summary: Open-source meta-harness above existing agent frameworks, enabling agent composition, collaboration and centralised governance from one interface.
        capabilities:
          - Build
          - Deploy
          - Optimize
          - Govern
        related:
          - Agent Bricks
          - Unity Gateway
      - name: Claude Code
        core: true
        icon: code
        short: 3rd-party harness
        summary: Anthropic's coding harness working against the platform through MCP, with spend, routing and policy governed by Unity Gateway.
      - name: OpenAI Codex
        core: true
        icon: code
        short: 3rd-party harness
        summary: OpenAI's coding harness connected over MCP, governed at runtime by Unity Gateway rather than trusted by configuration.
      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Store Performance Agent
        icon: genie
        summary: Ask about comp sales, ticket times and daypart performance across stores in plain language.
        feeds:
          - NCR Aloha POS
          - Toast Restaurant POS
          - QSR Automations KDS
          - Sales, labor, margin
        teams:
          - Operations
          - VP Operations
          - Regional Director
        questions:
          - What were comp sales by store and daypart yesterday versus last year?
          - Which stores have the slowest ticket times this week?
          - Which stores missed their speed-of-service target during the lunch rush?
          - How do voids and comps compare across stores this period?
          - Which regions are trending down on order accuracy?
      - name: Food Cost & Margin Agent
        icon: genie
        summary: Explore theoretical-versus-actual food cost, waste and prime cost across stores.
        feeds:
          - CrunchTime Inventory
          - Restaurant365
          - NCR Aloha POS
          - Sales, labor, margin
        teams:
          - Finance & Accounting
          - Controller
          - Loss Prevention
        questions:
          - Which stores missed food-cost budget last week and by how much?
          - What is the theoretical-versus-actual usage variance by item?
          - Where is waste highest and which items drive it?
          - How is prime cost tracking against budget by store?
          - Which employees and shifts show unusual void and comp patterns?
      - name: Delivery & Loyalty Agent
        icon: genie
        summary: Answer questions on delivery channel mix, marketplace economics and guest loyalty.
        feeds:
          - DoorDash Marketplace
          - Uber Eats Merchant
          - Paytronix Loyalty
          - Conformed store, item
        teams:
          - Marketing & Loyalty
          - Loyalty Manager
          - Digital & Delivery
        questions:
          - What are net marketplace proceeds per delivered check by channel and store?
          - Which delivery platform drives the most profitable orders this month?
          - Which loyalty members are lapsing before their points expire?
          - What is redemption lift on the current offer versus baseline?
          - How does visit frequency differ between loyalty and non-loyalty guests?
      - name: Franchise & Brand Agent
        icon: genie
        summary: Ask about franchise unit economics, audit scores and new-store performance.
        feeds:
          - Franchisee P&L Mart
          - Health Dept Inspections
          - Restaurant365
          - Sales, labor, margin
        teams:
          - Franchise Development
          - Franchise Business Consultant
          - Brand Leadership
        questions:
          - Which franchisees are below system-average unit economics?
          - Which units are at risk on their next field or health audit?
          - How are new stores ramping against their pro forma?
          - Which banners are driving comparable-sales growth this quarter?
          - Where is franchisee compliance slipping across the system?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Demand Forecasting
        short: Planning
        icon: chart
        summary: Store-level sales forecast tuned to weather, events and promos.
        problem: Store managers guess covers from last year and gut feel, so prep, ordering and staffing are set blind to weather, local events and promotions, and every miss lands as waste or long waits.
        who_benefits: Operations
        how_built: POS sales, weather and event feeds land through Lakeflow, demand features are built in Feature Store and scored in Model Serving, and the forecast surfaces by store and daypart in Store Performance.
        components:
          - Store Performance
          - Weather & Events API
          - Feature Store
          - Model Serving
          - MLflow
        stories:
          - title: Accelerate demand planning from 4.5 hours to under 1 hour with Databricks
            url: https://www.databricks.com/blog/2021/01/28/how-to-accelerate-demand-planning-from-4-5-hours-to-under-1-hour-with-azure-databricks.html
      - name: Labor Optimisation
        short: Scheduling
        icon: people
        summary: Shift plans matched to forecasted traffic without overtime creep.
        problem: Schedules are built on manager intuition days ahead, so peaks are understaffed and slow shifts carry idle labor, and overtime creeps in wherever the plan and real traffic drift apart.
        who_benefits: Operations
        how_built: Forecasted traffic scored in Model Serving drives shift plans that respect wage rules, written back to HotSchedules before the week locks with roster state held in Lakebase.
        components:
          - Store Performance
          - HotSchedules
          - Model Serving
          - Feature Store
          - Lakebase
        stories:
          - title: Dave & Buster's modernizes analytics to align labor with demand
            url: https://www.databricks.com/blog/dave-and-busters-successful-analytics-platform-modernization
      - name: Food Cost Control
        short: Margin
        icon: sheet
        summary: Waste and portion variance attacked with theoretical usage evidence.
        problem: Food cost is reconciled long after the period closes, so waste, over-portioning and yield loss are found in hindsight when the money is gone and no one can trace which store or item drove it.
        who_benefits: Finance & Accounting
        how_built: Counts, theoretical usage and purchases from CrunchTime Inventory conform on Delta Lake under Unity Catalog, and the Food Cost Dashboard shows theoretical-versus-actual variance by store before close.
        components:
          - Food Cost Dashboard
          - CrunchTime Inventory
          - AI/BI
          - Delta Lake
          - Unity Catalog
        stories:
          - title: Gousto gains near real-time inventory and fulfillment visibility on Databricks
            url: https://www.databricks.com/customers/gousto
      - name: Menu Engineering
        short: Profitability
        icon: product
        summary: Items ranked by contribution margin and popularity not gut feel.
        problem: Menu decisions lean on gut feel and last quarter's bestsellers, so low-margin items stay on the board and high-margin dishes go unpromoted because item sales and true recipe cost never meet in one place.
        who_benefits: Brand Leadership
        how_built: POS item sales joined to recipe cost on Delta Lake rank each item by contribution margin and popularity in AI/BI, so Genie One can answer which items to feature, reprice or cut.
        components:
          - Food Cost Dashboard
          - NCR Aloha POS
          - AI/BI
          - Genie One
          - Delta Lake
        stories:
          - title: PAR Technology builds AI-powered restaurant intelligence on Databricks
            url: https://www.databricks.com/customers/par-technology/genie
      - name: Speed of Service
        short: Operations
        icon: stream
        summary: Kitchen and drive-thru times improved with bump-to-ticket analytics.
        problem: Slow tickets and drive-thru lanes are only felt at the register, so managers coach on anecdotes while the bump and timing data that shows where seconds are lost stays trapped in the kitchen display.
        who_benefits: Operations
        how_built: Kitchen ticket and bump events from QSR Automations KDS and optional drive-thru timer events stream into Lakehouse//RT, and Store Performance tracks kitchen ticket times and drive-thru lane times as distinct intervals by store and daypart against the service target.
        components:
          - Store Performance
          - QSR Automations KDS
          - Lakehouse//RT
          - AI/BI
          - Delta Lake
        stories:
          - title: Dave & Buster's improves speed of service with unified analytics
            url: https://www.databricks.com/blog/dave-and-busters-successful-analytics-platform-modernization
      - name: Delivery Channel Mix
        short: Digital
        icon: partner
        summary: Marketplace fees and order mix optimised for net proceeds after fees, promotions and refunds per store.
        problem: Third-party delivery adds orders but commissions, promos and refunds bury the real margin, so operators cannot see which channel or store actually makes money on a delivered check.
        who_benefits: Marketing & Loyalty
        how_built: Order, fee and payout feeds from DoorDash Marketplace and Uber Eats Merchant conform on Delta Lake, and net proceeds after fees, promotions and refunds are modeled by channel and store so operators shift mix toward the platforms that net most.
        components:
          - DoorDash Marketplace
          - Uber Eats Merchant
          - AI/BI
          - Delta Lake
          - Model Serving
        stories:
          - title: iFood optimizes delivery economics with Databricks and Tableau
            url: https://www.databricks.com/customers/ifood
      - name: Guest Churn
        short: Loyalty
        icon: custlake
        summary: Lapsed guests identified before loyalty points expire.
        problem: Lapsing guests are noticed only once visits have already stopped, so loyalty points expire unredeemed and win-back offers land after the guest has moved on to a competitor.
        who_benefits: Marketing & Loyalty
        how_built: Visit and redemption history from Paytronix Loyalty land in CustomerLake, churn features are built in Feature Store and scored in Model Serving, and win-back offers fire from the Loyalty Campaign Hub before points lapse.
        components:
          - Loyalty Campaign Hub
          - Paytronix Loyalty
          - CustomerLake
          - Model Serving
          - Feature Store
        stories:
          - title: Kard drives customer loyalty with hyper-personalized rewards
            url: https://www.databricks.com/customers/kard
          - title: Databricks and Stitch turn data into QSR marketing performance
            url: https://www.databricks.com/blog/databricks-and-stitch-marketing-activation
      - name: Franchise Compliance
        short: Audit
        icon: gavel
        summary: Food safety and ops standards scored before field audits.
        problem: Food-safety and brand-standard gaps surface at the field audit or the health inspection, when a failing store is already a liability and there was no early signal to fix it in time.
        who_benefits: Franchise Development
        how_built: Inspection scores, brand-standard checks and store operations conform under Unity Catalog, and the Franchise Scorecard flags at-risk units so issues are corrected before the field audit lands.
        components:
          - Franchise Scorecard
          - Health Dept Inspections
          - Restaurant365
          - Unity Catalog
          - AI/BI
      - name: Shrink & Void Control
        short: Loss prevention
        icon: gauge
        summary: Suspicious void and comp patterns surfaced by employee and shift.
        problem: Voids, comps and refunds are normal until they are not, so theft and sweethearting hide in the noise and a manager cannot tell an honest correction from a pattern worth investigating.
        who_benefits: Finance & Accounting
        how_built: Void, comp and refund events from NCR Aloha POS conform on Delta Lake and anomaly models in Model Serving surface suspicious patterns by employee, shift and store for loss-prevention review.
        components:
          - Store Performance
          - NCR Aloha POS
          - Model Serving
          - AI Functions
          - Delta Lake
      - name: New Store Analytics
        short: Growth
        icon: globe
        summary: Ramp curves and trade-area performance scored against pro forma.
        problem: New units are judged on a pro forma built before opening, so a site that under-ramps looks fine for months and the trade-area and cannibalization signals that would explain it are never assembled.
        who_benefits: Franchise Development
        how_built: Ramp curves, trade-area traffic and comparable-store data conform on Delta Lake and models score each opening against its pro forma in the Franchise Scorecard so a slow ramp is caught early.
        components:
          - Franchise Scorecard
          - Weather & Events API
          - AI/BI
          - Model Serving
          - Delta Lake
medallion:
  Bronze:
    short: Raw ticket and labor
    summary: POS checks, kitchen display events, inventory counts, timeclock punches and delivery platform orders, landed exactly as received so a ticket or a shift can always be replayed as it stood.
  Silver:
    short: Conformed store, item
    summary: Stores, menu items, employees and shifts resolved into single conformed entities across POS, back-office and delivery systems, with voids and comps reconciled and channel orders stitched to one guest check.
  Gold:
    short: Sales, labor, margin
    summary: 'Contracted products operations and finance run on: comparable sales, labor percent and food cost percent by store and daypart.'
