agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Batch & Process Performance Agent
        icon: genie
        summary: Ask about batch monitoring, energy per ton, recipe control and design-space screening by plant and product in plain language.
        feeds:
          - AVEVA PI System
          - Honeywell Uniformance
          - Siemens Opcenter PSM
          - Yield, OEE, compliance
        teams:
          - Plant Operations
          - Process Engineering
          - Scale-Up Engineer
        questions:
          - What was batch yield and OEE by plant and product last month?
          - What is steam and power per ton by unit versus target?
          - Which feedstock lots and recipe parameters drive off-spec at scale-up?
          - Which candidate formulations rank best in the simulated design space before lab work?
          - Which batches deviated most from the golden-batch trajectory?
      - name: Safety & Compliance Agent
        icon: genie
        summary: Explore process-safety leading indicators, REACH and TRI filing status and SDS obligations across the estate.
        feeds:
          - Enablon EHS
          - Sphera Product Steward
          - LabWare LIMS
          - Conformed batches and materials
        teams:
          - Quality & Regulatory
          - EHS Officer
          - Regulatory Affairs
        questions:
          - Which near-misses, permits and process alarms signal an unsafe condition this shift?
          - What is the process-safety incident rate by plant and unit?
          - Which REACH and TRI filings are approaching their deadline?
          - Which SDS records are out of date for shipped products?
          - What is right-first-time CoA release rate by product?
      - name: Reliability & Maintenance Agent
        icon: genie
        summary: Answer rotating-equipment health, remaining-life and prescriptive-maintenance questions.
        feeds:
          - IBM Maximo
          - AVEVA PI System
          - Yield, OEE, compliance
        teams:
          - Plant Operations
          - Reliability Engineer
          - Reliability Data Scientist
        questions:
          - Which rotating assets are predicted to fail in the next month?
          - What is unplanned downtime by asset class this quarter?
          - Which pumps and agitators drive the most maintenance cost?
          - Which work orders are overdue on critical equipment?
          - What is MTBF trend on the assets that stop the plant?
      - name: Supply, Demand & Trading Agent
        icon: genie
        summary: Ask about grade demand, feedstock and bulk planning and feedstock trading across the network.
        feeds:
          - SAP TM
          - ORBCOMM Tank Monitoring
          - AspenTech Supply
          - ICIS Pricing
        teams:
          - Supply Chain
          - S&OP Planner
          - Customer Service
        questions:
          - Which scarce grades should be allocated to which contracts first?
          - How is grade demand forecast to move by region next quarter?
          - Which feedstock buys and hedges look favorable at current ICIS price assessments?
          - Which tanks are near empty or overdue for a bulk movement?
          - Where is margin leaking to low-value spot orders under allocation?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Feedstock, Formulation, & Recipe Control
        short: Recipe control
        icon: product
        summary: Feedstock ratios, formulations and recipes optimized and turned into engineer-approved plant setpoints before the run.
        problem: A formulation that works in the lab behaves differently at plant scale, and with recipe, feedstock and plant data apart, recipe control and scale-up are trial and error that burn weeks of reactor time and off-spec material.
        who_benefits: Process Engineering
        how_built: Lab, feedstock and plant historian data conform to common material and equipment keys, and machine learning models tracked in MLflow propose and rank formulations, turning lab recipes into governed plant setpoints with risk guards before the first run.
        components:
          - Golden Batch Analytics
          - LabWare LIMS
          - AVEVA PI System
          - MLflow
        stories:
          - title: Chevron Phillips Chemical tackles GenAI with Databricks
            url: https://www.databricks.com/customers/chevron-phillips-chemical
      - name: Workforce Safety
        stories:
          - title: StrongArm Tech cuts workplace injuries with IoT and ML on Databricks
            url: https://www.databricks.com/customers/strongarm
          - title: "BP's Geospatial AI Engine: transforming safety and operations with Databricks"
            url: https://www.databricks.com/blog/bps-geospatial-ai-engine-transforming-safety-and-operations-databricks
        short: Process safety
        icon: gavel
        summary: Process-safety and permit signals surfaced so unsafe conditions are caught before an incident.
        problem: Process-safety incidents, near-misses and permit-to-work records sit across EHS, historian and shift systems, so leading indicators of an unsafe condition are only joined up after a loss-of-containment event when the investigation reconstructs them.
        who_benefits: CEO & EHS Council
        how_built: Incident, permit and process-alarm data conform under Unity Catalog on Delta Lake, and leading-indicator models scored in Model Serving surface unsafe trends on the Batch Cockpit before an incident.
        components:
          - Batch Cockpit
          - Enablon EHS
          - AVEVA PI System
          - Model Serving
          - Unity Catalog
          - Delta Lake
      - name: Design Space Simulation & Exploration
        short: Molecular R&D
        icon: network
        summary: Candidate molecules and formulations screened across a simulated property design space before lab work.
        problem: New molecules and materials are found by physical trial, so the design space is explored one slow, costly experiment at a time and promising candidates are never simulated or ranked before reactor time is committed.
        who_benefits: Process Engineering
        how_built: Historical experiment, property and formulation data conform on Delta Lake, and machine learning models tracked in MLflow simulate the property design space so chemists screen and rank candidates virtually before committing lab and reactor time.
        components:
          - LabWare LIMS
          - Delta Lake
          - MLflow
          - AI/BI
        stories:
          - title: Driving eco-innovation in the energy sector for a cleaner future
            url: https://www.databricks.com/customers/omv
      - name: Operations Resource Efficiency
        short: Energy per ton
        icon: chart
        summary: Steam, power and utilities minimized per ton produced, unit by unit.
        problem: Steam and power are the biggest cost after feedstock, yet usage is trended per site weeks later, so nobody sees which units and setpoints drive energy per ton while the batch still runs.
        who_benefits: Process Engineering
        how_built: Utility and process tags conform alongside batch data, and AI Functions and models in Golden Batch Analytics rank the setpoints that cut energy per ton without pushing the batch off spec.
        components:
          - Golden Batch Analytics
          - Honeywell Uniformance
          - Model Serving
          - AI Functions
          - AI/BI
        stories:
          - title: Databricks and Shell collaborate to simplify industrial time series analytics on the Lakehouse
            url: https://www.databricks.com/blog/developing-time-series-lakehouse-shell
      - name: Production Monitoring
        short: Batch monitoring
        icon: iot
        summary: Live batch execution, yield and deviation monitored against golden-batch references on every run.
        problem: Two operators run the same recipe and get different yields, yet the best batch's trajectory lives in tribal memory, so no run can be held against what good actually looked like in flight.
        who_benefits: Process Engineering
        how_built: Historian trajectories conform to golden-batch references on Delta Lake, and deviation from the best profile is scored and shown in Golden Batch Analytics so operators steer the run in flight.
        components:
          - Golden Batch Analytics
          - AVEVA PI System
          - Model Serving
          - Delta Lake
          - AI/BI
        stories:
          - title: Databricks for Energy
            url: https://www.databricks.com/solutions/industries/energy
          - title: Databricks spatial joins for crop yield analysis and forecasting
            url: https://www.databricks.com/blog/databricks-spatial-joins-now-17x-faster-out-box
      - name: Commodity & Energy Trading
        short: Feedstock trading
        icon: market
        summary: Feedstock buys, energy positions and hedges evaluated against live commodity price assessments.
        problem: Feedstock and energy are the largest cost of goods, but buyers weigh purchases and hedges against price sheets and spreadsheets that lag the market, so margin is set by decisions made without a live view of price, demand and plant cost.
        who_benefits: Supply Chain
        how_built: ICIS price assessments conform with feedstock consumption and plant cost on Delta Lake, and models scored in Model Serving rank feedstock buys, energy positions and hedges by margin impact for the commercial desk in AI/BI.
        components:
          - ICIS Pricing
          - AspenTech Supply
          - Model Serving
          - Delta Lake
          - AI/BI
        stories:
          - title: Data and AI in action across the energy industry
            url: https://www.databricks.com/blog/powering-future-data-and-ai-action-across-energy-industry
      - name: Supply & Materials Planning
        short: Bulk supply
        icon: stream
        summary: Feedstock supply and bulk movements planned against tanks, rail and vessel windows.
        problem: Feedstock arrives and product ships in bulk against narrow rail and vessel windows, but tank levels, material plans and transport slots sit in separate systems, so a missed window means demurrage, a stockout of raw feed, or a tank running dry.
        who_benefits: Supply Chain
        how_built: Tank telemetry, material plans and transport windows conform to production schedules on Delta Lake, and models scored in Lakehouse//RT sequence feedstock replenishment and bulk movements against live rail and vessel windows for the planner.
        components:
          - SAP TM
          - ORBCOMM Tank Monitoring
          - Model Serving
          - Lakehouse//RT
          - AI/BI
        stories:
          - title: Supply chain and distribution optimization on Databricks
            url: https://www.databricks.com/solutions/accelerators/supply-chain-distribution-optimization
          - title: "John Deere's AI for Precision Farming"
            url: https://www.databricks.com/blog/2021/07/09/down-to-the-individual-grain-how-john-deere-uses-industrial-ai-to-increase-crop-yields-through-precision-agriculture.html
      - name: Demand Forecasting
        short: Grade demand
        icon: aibi
        summary: Grade-level demand forecast by region and account to drive allocation and production planning.
        problem: Demand for grades and packs is forecast from history in spreadsheets weeks before S&OP, so allocation and production plans chase stale signals and swing between stockouts on contracted volume and excess of slow grades.
        who_benefits: Supply Chain
        how_built: Order history, contracts and shipment signals conform on Delta Lake, and forecasting models served through Model Serving push grade-level demand by region and account into the S&OP planning path in AI/BI.
        components:
          - AspenTech Supply
          - SAP S/4HANA PP-PI
          - Model Serving
          - Delta Lake
          - AI/BI
        stories:
          - title: Part-level demand forecasting Solution Accelerator
            url: https://github.com/databricks-industry-solutions/parts-demand-forecasting
          - title: Databricks for Energy
            url: https://www.databricks.com/solutions/industries/energy
      - name: Regulation Compliance, & External Reporting
        short: REACH & TRI
        icon: gavel
        summary: REACH, TRI and SDS obligations tracked and external filings assembled from governed data.
        problem: REACH dossiers, TRI releases and SDS updates are assembled by hand from LIMS, EHS and stewardship exports, so filing deadlines live in spreadsheets and one late or wrong submission risks a shipment hold or a fine.
        who_benefits: Quality & Regulatory
        how_built: Substance, emissions and stewardship data conform under Unity Catalog on Delta Lake, and AI Functions assemble REACH, TRI and SDS submissions with a defensible audit trail surfaced in the CoA Workbench.
        components:
          - CoA Workbench
          - Sphera Product Steward
          - Enablon EHS
          - Unity Catalog
          - AI Functions
        stories:
          - title: How Dow Built a Carbon Footprint Ledger on Databricks to Accelerate Sustainability at Scale
            url: https://www.databricks.com/blog/how-dow-built-carbon-footprint-ledger-databricks-accelerate-sustainability-scale
      - name: Prescriptive Maintenance
        short: Asset reliability
        icon: zplug
        summary: Pump, agitator and compressor failures predicted and maintenance prescribed before an unplanned trip.
        problem: Pumps, agitators and compressors fail without warning, and an unplanned trip on a continuous line cascades into lost batches and emergency repairs costlier than any planned fix.
        who_benefits: Plant Operations
        how_built: Vibration and process tags from the historian conform to asset records and feed remaining-life models in Model Serving, so predicted failures raise prescribed work orders in IBM Maximo before the trip.
        components:
          - IBM Maximo
          - AVEVA PI System
          - Model Serving
          - MLflow
          - Lakehouse//RT
        stories:
          - title: What is predictive maintenance on the Databricks platform
            url: https://www.databricks.com/blog/what-is-predictive-maintenance
          - title: "Databricks and Shell: industrial time series analytics on the Lakehouse"
            url: https://www.databricks.com/blog/developing-time-series-lakehouse-shell
