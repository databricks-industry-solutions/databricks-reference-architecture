name: Chemical Manufacturing
description: 'A specialty and commodity chemicals producer: feedstock and formulation control, batch plant operations on reactors and continuous lines, QC labs and product stewardship, rotating-asset reliability, molecular design, and bulk global supply chains.'
sources:
  - name: ERP & Supply
    icon: erp
    simplified: 2
    tiles:
      - name: SAP S/4HANA PP-PI
        icon: erp
        summary: Recipes, batch records, inventory and costing.
        citations:
          - sap-pppi
        category: Process Manufacturing ERP
        what_it_is: System of record for process-industry recipes, batch records, inventory and costing across plants.
        who_uses_it: Production planning, plant controllers and Finance.
        data_out:
          batch:
            types:
              - structured
            volume: 10-50 GB/day
            interval: Nightly batch + hourly deltas
          stream:
            types:
              - semi-structured
            volume: hundreds of postings/sec
            interval: Continuous CDC
      - name: Oracle Process Mfg
        icon: erp
        summary: Formula management, lot traceability and planning.
        citations:
          - oracle-pm
        category: Process Manufacturing ERP
        what_it_is: Manages formula (recipe) management, lot traceability and production planning on the Oracle process estate.
        who_uses_it: Formulation, planning and Lot traceability teams.
        data_out:
          batch:
            types:
              - structured
            volume: 5-20 GB/day
            interval: Nightly batch
      - name: AspenTech Supply
        icon: sheet
        summary: Planning, scheduling and network optimization.
        citations:
          - aspentech
        category: Supply Chain Planning / Optimization
        what_it_is: Runs supply planning, scheduling and network optimization across production sites and distribution.
        who_uses_it: S&OP planners, scheduling and Supply chain leadership.
        data_out:
          batch:
            types:
              - structured
            volume: GBs (plans + scenarios)
            interval: Planning cycles + on-demand
  - name: MES & Historian
    icon: iot
    tiles:
      - name: AVEVA PI System
        icon: iot
        summary: Historian tags, events and asset framework.
        citations:
          - aveva-pi
        category: Process / Time-Series Historian
        what_it_is: Collects historian tags, events and the asset framework underpinning batch analytics, OEE and reliability.
        who_uses_it: Process engineering, reliability and Data science.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 10-100k tags/sec
            interval: Continuous historian stream
      - name: Honeywell Uniformance
        icon: stream
        summary: DCS data, alarms and batch phase records.
        citations:
          - honeywell
        category: DCS / Process Historian
        what_it_is: Carries DCS process data, alarms and batch phase records from the control system into the estate.
        who_uses_it: Control room operators, process engineering and Reliability.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 5-50k tags/sec
            interval: Continuous control-room telemetry
      - name: Siemens Opcenter PSM
        core: true
        icon: zplug
        summary: Electronic batch records and equipment logs.
        citations:
          - opcenter-psm
        category: Process MES / Electronic Batch Records
        what_it_is: Captures electronic batch records and equipment logbooks for process manufacturing sites.
        who_uses_it: Process operators, Quality and Regulatory affairs.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 2-10 GB/day batch records
            interval: Per-batch + hourly
  - name: Quality & LIMS
    icon: gavel
    simplified: 2
    tiles:
      - name: LabWare LIMS
        icon: gavel
        summary: Sample plans, results and CoA release.
        citations:
          - labware
        category: Laboratory Information Management (LIMS)
        what_it_is: Manages sample plans, lab results and certificate-of-analysis (CoA) release against each batch.
        who_uses_it: QC labs, Quality management and Customer quality.
        data_out:
          batch:
            types:
              - structured
            volume: 1-4 GB/day
            interval: Hourly / per-sample
      - name: Thermo SampleManager
        icon: product
        summary: QC testing, stability and method compliance.
        citations:
          - samplemanager
        category: Laboratory Information Management (LIMS)
        what_it_is: Runs QC testing, stability studies and analytical method compliance across the lab estate.
        who_uses_it: QC labs, stability teams and Method validation.
        data_out:
          batch:
            types:
              - structured
            volume: GBs (results + stability)
            interval: Hourly / per-test
      - name: Sphera Product Steward
        core: true
        icon: gavel
        summary: SDS, REACH and hazard classifications.
        citations:
          - sphera
        category: Product Stewardship / EHS Compliance
        what_it_is: Manages safety data sheets (SDS), REACH data and hazard classifications for substances and products.
        who_uses_it: Product stewardship, Regulatory affairs and EHS.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: 100s of MB/day
            interval: Daily + on change
      - name: Enablon EHS
        core: true
        icon: observ
        summary: Process-safety incidents, near-misses and permit-to-work compliance.
        citations:
          - enablon
        category: EHS & Process Safety Management
        what_it_is: Records process-safety incidents, near-misses, loss-of-primary-containment events and permit-to-work compliance tied to plant, unit and crew.
        who_uses_it: EHS, process safety and Plant operations.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 0.5-2 GB/day events
            interval: Hourly / daily
  - name: Maintenance
    icon: zplug
    tiles:
      - name: IBM Maximo
        icon: zplug
        summary: Work orders, PM schedules and spare parts.
        citations:
          - maximo
        category: Enterprise Asset Management (EAM)
        what_it_is: Manages maintenance work orders, preventive-maintenance schedules and spare parts against the asset base.
        who_uses_it: Maintenance planning, reliability and Storeroom teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Nightly + event-driven
      - name: SAP PM
        icon: erp
        summary: Notification, maintenance plans and reliability.
        citations:
          - sap-pm
        category: Plant Maintenance (EAM)
        what_it_is: Runs maintenance notifications, plans and reliability against the same asset master inside the ERP.
        who_uses_it: Maintenance planning, reliability and Plant operations.
        data_out:
          batch:
            types:
              - structured
            volume: 1-4 GB/day
            interval: Nightly batch
  - name: Logistics
    icon: stream
    tiles:
      - name: SAP TM
        icon: stream
        summary: Bulk tank scheduling and dangerous goods routing.
        citations:
          - sap-tm
        category: Transportation Management (TMS)
        what_it_is: Handles bulk tank scheduling, dangerous-goods routing and delivery execution for chemical logistics.
        who_uses_it: Logistics, dangerous-goods compliance and Customer service.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Hourly + event-driven
      - name: ORBCOMM Tank Monitoring
        icon: iot
        summary: Iso tank level and temperature telemetry.
        citations:
          - orbcomm
        category: IoT Tank Telemetry
        what_it_is: Streams iso-tank level, temperature and location telemetry from bulk containers in transit and at customer sites.
        who_uses_it: Logistics, vendor-managed inventory and Customer service.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 100s-1000s of readings/sec
            interval: Continuous telemetry
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Corporate Finance Mart
        icon: fed
        summary: Transfer pricing and segment P&L marts queried in place under Unity Catalog.
        category: Enterprise Data Warehouse
        what_it_is: Transfer-pricing and segment P&L marts kept in the incumbent warehouse and queried in place through federation instead of copied.
        who_uses_it: Finance, controlling and Segment reporting.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale historical marts
            interval: Queried on demand (federated)
  - name: Data Formats
    icon: zbraces
    tiles:
      - name: 'Chem eStandards'
        icon: zbraces
        fmt: 'CHEM'
        summary: 'OAGi chemical industry XML standards for orders, shipments and invoices.'
        spec_url: https://oagi.org/pages/chem-estandards
      - name: 'DEXPI'
        icon: zbraces
        fmt: 'DEXPI'
        summary: 'Data Exchange in the Process Industry model for P&ID and plant engineering data.'
        spec_url: https://dexpi.org/
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    tiles:
      - name: ECHA REACH
        icon: gavel
        summary: Registration dossiers and substance volumes.
        citations:
          - echa
        category: Regulatory Reference (REACH)
        what_it_is: Provides REACH registration dossiers and substance volume thresholds used for compliance and reporting.
        who_uses_it: Regulatory affairs, product stewardship and Compliance.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: 100s of MB
            interval: Periodic regulatory updates
      - name: EPA TRI Reporting
        icon: gavel
        summary: Toxic release inventory thresholds and submissions.
        citations:
          - epa-tri
        category: Environmental Reporting (EPA TRI)
        what_it_is: Supplies Toxic Release Inventory thresholds and reference used to compile TRI release submissions.
        who_uses_it: EHS, Regulatory affairs and Environmental compliance.
        data_out:
          batch:
            types:
              - structured
            volume: 10s of MB
            interval: Annual + periodic reference
      - name: ICIS Pricing
        core: true
        icon: market
        summary: Commodity chemical price assessments by region.
        citations:
          - icis
        category: Commodity Price Benchmarks
        what_it_is: Delivers commodity chemical price assessments by region joined to margin and demand for commercial decisions.
        who_uses_it: Commercial, S&OP and Margin analytics.
        data_out:
          batch:
            types:
              - structured
            volume: 10s of MB/day
            interval: Daily price assessments
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: CEO & EHS Council
        mark: Genie One
        summary: The CEO on margin per ton and capacity utilization; the EHS officer on process-safety incident rate and emissions intensity.
        uses:
          - - Genie One
            - Ask what last month's yield was by plant.
          - - AI/BI
            - OEE and margin on certified Metric Views.
          - - Unity Catalog
            - One batch definition across MES and ERP.
        sub:
          - name: CEO
            cares: margin per ton, capacity utilization and the trade between growth and asset risk.
          - name: EHS Officer
            cares: the process-safety incident rate, permits and emissions intensity across every plant.
          - name: Chief Sustainability Officer
            cares: Scope 1 and 2 intensity and the credibility of what the company reports.
        ucs:
          - Regulation Compliance, & External Reporting
          - Workforce Safety
          - Operations Resource Efficiency
          - Prescriptive Maintenance
      - name: Plant Operations
        mark: Lakehouse//RT
        summary: Shift handover, batch execution and abnormal situation management, run on OEE, first-pass yield and deviation count.
        uses:
          - - Batch Cockpit
            - Live phase progress and deviation flags.
          - - Lakehouse//RT
            - Historian tags at control-room latency.
        sub:
          - name: Plant Manager
            cares: OEE, first-pass yield and hitting the monthly production plan safely.
          - name: Shift Supervisor
            cares: batch execution, deviations and a clean handover between crews.
          - name: Reliability Engineer
            cares: rotating-equipment uptime and the unplanned trips that break the plan.
        ucs:
          - Prescriptive Maintenance
          - Production Monitoring
      - name: Process Engineering
        mark: AI/BI
        summary: Recipe optimization, scale-up and golden batch comparison, judged on yield per batch, energy per ton and off-spec rate.
        uses:
          - - Golden Batch Analytics
            - Deviation from reference trajectories.
          - - AI/BI
            - Yield and energy per batch on governed tags.
        sub:
          - name: Process Engineer
            cares: yield per batch, energy per ton and closing the gap to the golden batch.
          - name: Scale-Up Engineer
            cares: moving lab recipes to plant parameters without off-spec first runs.
          - name: Optimization Engineer
            cares: the setpoints that lift yield and cut energy inside the safe envelope.
        ucs:
          - Production Monitoring
          - Operations Resource Efficiency
          - Feedstock, Formulation, & Recipe Control
      - name: Quality & Regulatory
        core: true
        mark: Apps
        summary: CoA release, stability and regulatory submissions, tracked on CoA compliance, right-first-time release and REACH filing timeliness.
        uses:
          - - CoA Workbench
            - Release decisions with full genealogy.
          - - Apps
            - Lab review apps on governed LIMS data.
        sub:
          - name: QC Manager
            cares: CoA compliance, right-first-time release and off-spec rate.
          - name: Regulatory Affairs
            cares: REACH and TRI filing timeliness and a defensible audit trail.
          - name: Product Steward
            cares: SDS accuracy, hazard classification and substance volume limits.
        ucs:
          - Production Monitoring
          - Regulation Compliance, & External Reporting
      - name: Supply Chain
        mark: Model Serving
        summary: Demand allocation, tank scheduling and customer prioritization, measured on on-time-in-full, margin per ton and contract-fill rate.
        uses:
          - - Allocation Optimizer
            - Scarce product ranked by margin and contract.
          - - Model Serving
            - Demand forecasts in the planning path.
        sub:
          - name: S&OP Planner
            cares: allocating finite capacity to the highest-margin, contracted demand.
          - name: Logistics Manager
            cares: tank levels, dangerous-goods routing and rail and vessel windows.
          - name: Customer Service
            cares: on-time-in-full and contract-fill promises to key accounts.
        ucs:
          - Supply & Materials Planning
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land DCS historian tags, LIMS results, SAP postings and SDS documents; own Bronze to Silver and the pager when the batch and yield tables stall.
        uses:
          - - Lakeflow Connect
            - Managed connectors for ERP, MES and LIMS sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on historian and lab feeds.
          - - Lakewatch
            - Freshness on the batch and yield tables the control room reads.
        sub:
          - name: OT & Historian Eng
            cares: landing DCS and PI tags at control-room latency without dropping events.
          - name: ERP & LIMS Integration
            cares: conforming SAP postings, batch records and lab results into one model.
          - name: Pipeline Reliability
            cares: the pager when the batch, yield and CoA tables stall before a shift.
        ucs:
          - Production Monitoring
          - Regulation Compliance, & External Reporting
      - name: Data Scientists
        mark: MLflow
        summary: Golden-batch, predictive-quality, energy-optimisation and predictive-maintenance models, and whether they still hold across a recipe scale-up.
        uses:
          - - Feature Store
            - Batch and asset features read identically in training and serving.
          - - MLflow
            - Every quality and RUL model tracked for audit and reproduction.
          - - Model Serving
            - Quality and setpoint models scored in the control path.
        sub:
          - name: Process Data Scientist
            cares: golden-batch, predictive-quality and energy models that hold on scale-up.
          - name: Reliability Data Scientist
            cares: remaining-life models for pumps, agitators and compressors.
          - name: MLOps Engineer
            cares: every quality and RUL model tracked, reproduced and safely re-served.
        ucs:
          - Design Space Simulation & Exploration
          - Prescriptive Maintenance
          - Feedstock, Formulation, & Recipe Control
      - name: App Developers
        mark: Apps
        summary: Ship the batch cockpit, golden batch analytics, CoA workbench and allocation optimizer apps operations and quality work in, next to governed batch data.
        uses:
          - - Apps
            - Control-room and lab screens with no separate web tier to secure.
          - - Lakebase
            - Serverless Postgres for release and allocation state.
          - - Agent Bricks
            - Agents that draft setpoints and work orders against governed tools.
        sub:
          - name: Control-Room App Dev
            cares: the Batch Cockpit and setpoint screens operators run a shift from.
          - name: Quality App Dev
            cares: the CoA Workbench and lab-review screens release decisions are made in.
          - name: Agent & Lakebase Dev
            cares: release and allocation state, and agents that draft work orders.
        ucs:
          - Production Monitoring
          - Feedstock, Formulation, & Recipe Control
