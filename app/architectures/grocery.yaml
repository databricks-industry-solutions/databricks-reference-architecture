name: Grocery
description: 'Grocery retail and wholesale: store operations, replenishment, fresh perimeter, loyalty and supplier collaboration.'
sources:
  - name: Store & POS
    icon: market
    simplified: 3
    tiles:
      - name: NCR Voyix POS
        icon: market
        summary: Lane transactions, tenders, voids and item-level scans from store registers.
        citations:
          - ncr-voyix
        category: Point-of-Sale (POS) System
        what_it_is: Captures lane transactions, tenders, voids and item-level scans across store registers, the base signal for baskets, shrink and availability.
        who_uses_it: Store Operations, Front-End teams and Loss Prevention.
        data_out:
          batch:
            types:
              - structured
            volume: 20-80 GB/day
            interval: End-of-day polling
          stream:
            types:
              - semi-structured
            volume: 2-8k scans/sec at peak
            interval: Continuous (near real-time)
      - name: Toshiba ACE POS
        icon: erp
        summary: Front-end and self-checkout events with department and weight-scale integration.
        citations:
          - toshiba-ace
        category: Point-of-Sale (POS) System
        what_it_is: Runs front-end and self-checkout with department and weight-scale integration, emitting checkout and scale events per lane.
        who_uses_it: Store Operations and Front-End teams.
        data_out:
          batch:
            types:
              - structured
            volume: 10-40 GB/day
            interval: End-of-day batch
          stream:
            types:
              - semi-structured
            volume: 1-5k events/sec at peak
            interval: Continuous checkout events
      - name: Trax Shelf Analytics
        icon: iot
        summary: On-shelf availability and planogram compliance from in-aisle image recognition.
        citations:
          - trax
        category: Shelf Monitoring / Computer Vision
        what_it_is: Reads on-shelf availability and planogram compliance from in-aisle image recognition, flagging gaps and phantom inventory.
        who_uses_it: Store Operations, Merchandising and Space Planning teams.
        data_out:
          batch:
            types:
              - semi-structured
              - unstructured
            volume: GBs/day images + reads
            interval: Multiple scans per day
  - name: Merchandising & Promo
    icon: sheet
    simplified: 2
    tiles:
      - name: Relex Space Planning
        icon: sheet
        summary: Planograms, facings and space-to-sales assignments by store cluster.
        citations:
          - relex
        category: Space & Assortment Planning System
        what_it_is: Builds planograms, facings and space-to-sales assignments by store cluster so range matches local sell-through.
        who_uses_it: Space Planners, Category Managers and Merchandising teams.
        data_out:
          batch:
            types:
              - structured
            volume: 2-8 GB/day
            interval: Nightly batch + plan saves
      - name: SymphonyAI IRIS
        icon: chart
        summary: Promotion planning, lift forecasts and vendor funding accruals.
        citations:
          - symphony-iris
        category: Retail AI / Promotion Analytics
        what_it_is: Plans promotions, forecasts lift and accrues vendor funding so category teams know which deals fund the next circular.
        who_uses_it: Pricing & Promotions, Merchandising and Category teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Daily model runs
      - name: Dunnhumby Customer Data
        core: true
        icon: custlake
        summary: Loyalty baskets, segments and propensity scores from the science partner.
        citations:
          - dunnhumby
        category: Customer Science / Loyalty Analytics
        what_it_is: Supplies loyalty baskets, segments and propensity scores from the customer-science partner for personalisation and category work.
        who_uses_it: Loyalty & Marketing and Personalisation Science teams.
        data_out:
          batch:
            types:
              - structured
            volume: 5-20 GB/day
            interval: Daily / weekly feed
  - name: Supply & Fresh
    icon: stream
    tiles:
      - name: Blue Yonder Replenishment
        icon: stream
        summary: Store and DC orders, forecasts and service-level exceptions.
        citations:
          - blue-yonder-repl
        category: Replenishment & Demand Planning System
        what_it_is: Generates store and DC orders, forecasts and service-level exceptions, the backbone of grocery replenishment.
        who_uses_it: Replenishment Planners, DC Operations and Supply Chain teams.
        data_out:
          batch:
            types:
              - structured
            volume: 5-30 GB/day
            interval: Multiple daily order cycles
      - name: Sensitech Fresh Chain
        icon: iot
        summary: Temperature monitoring for dairy, meat and produce from DC to store backroom.
        citations:
          - sensitech
        category: Cold-Chain Monitoring Platform
        what_it_is: Monitors temperature for dairy, meat and produce from DC to store backroom, emitting the excursion signals behind fresh quality.
        who_uses_it: Fresh Operations, Logistics and Food Safety teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: thousands of sensor reads/sec
            interval: Continuous telemetry
      - name: Invafresh Fresh Platform
        core: true
        icon: product
        summary: Markdown, production planning and waste tracking for bakery, deli and produce.
        citations:
          - invafresh
        category: Fresh Item Management System
        what_it_is: Runs markdown, production planning and waste tracking for bakery, deli and produce against the code-date clock.
        who_uses_it: Fresh Managers, Store Operations and Merchandising teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Daily + intraday markdown runs
  - name: E-com & Fulfillment
    icon: partner
    simplified: 2
    tiles:
      - name: Instacart Marketplace
        icon: partner
        summary: Third-party pick, substitution and delivery events attributed to store inventory.
        citations:
          - instacart
        category: Grocery Delivery Marketplace
        what_it_is: Emits third-party pick, substitution and delivery events attributed to store inventory for online basket and substitution analytics.
        who_uses_it: Digital & E-commerce and Loyalty & Marketing teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds of order events/sec
            interval: Continuous order + pick events
      - name: Ocado Smart Platform
        icon: api
        summary: CFC pick accuracy, route density and on-time delivery for automated fulfillment.
        citations:
          - ocado
        category: Automated Fulfillment Platform
        what_it_is: Provides customer-fulfillment-centre pick accuracy, route density and on-time delivery for automated online grocery fulfillment.
        who_uses_it: E-commerce Operations and Logistics teams.
        data_out:
          batch:
            types:
              - structured
            volume: GBs/day
            interval: Hourly batch
          stream:
            types:
              - semi-structured
            volume: hundreds of events/sec
            interval: Continuous fulfillment events
      - name: Web & App Clickstream
        icon: observ
        summary: Digital basket builds, search and coupon clips joined to in-store loyalty ID.
        category: Digital Clickstream Source
        what_it_is: Captures digital basket builds, search and coupon clips joined to the in-store loyalty ID to link online behaviour to the household.
        who_uses_it: Digital & E-commerce, Loyalty & Marketing and Analytics teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 2-10k events/sec at peak
            interval: Continuous clickstream
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Franchisee POS
        icon: fed
        summary: Licensed store sales and inventory left at franchise operators and queried in place under Unity Catalog.
        category: Licensed Store Data Source
        what_it_is: Licensed-store sales and inventory left at franchise operators and queried in place through federation instead of nightly flat-file collection.
        who_uses_it: Franchise Operations, Merchandising and Finance analysts.
        data_out:
          batch:
            types:
              - structured
            volume: 10s-100s GB (federated)
            interval: Queried on demand (federated)
  - name: Data Formats
    icon: zbraces
    simplified: 2
    tiles:
      - name: 'X12 EDI'
        icon: zbraces
        fmt: 'X12'
        summary: 'ANSI X12 EDI transaction sets for POs, invoices and ship notices with suppliers.'
        spec_url: https://x12.org/
      - name: 'EANCOM'
        icon: zbraces
        fmt: 'EANC'
        summary: 'GS1 EDIFACT subset for grocery order-to-cash messaging.'
        spec_url: https://www.gs1.org/standards/edi
      - name: 'GS1 XML'
        icon: zbraces
        fmt: 'GS1X'
        summary: 'GS1 XML business messages for supply-chain transactions.'
        spec_url: https://www.gs1.org/standards/edi-xml
        spark_connector: 'spark-xml'
        spark_repo: https://github.com/databricks/spark-xml
        databricks_resource: https://docs.databricks.com/aws/en/query/formats/xml
        source_systems:
          - '1WorldSync'
          - 'SAP'
          - 'GS1 GDSN'
      - name: 'EPCIS'
        icon: zbraces
        fmt: 'EPC'
        summary: 'GS1 event standard for perishables traceability and freshness visibility.'
        spec_url: https://www.gs1.org/standards/epcis
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    tiles:
      - name: GS1 GDSN Product Data
        icon: api
        summary: Synchronised item attributes and packaging hierarchies consumed inbound for master data.
        citations:
          - gs1-gdsn
        category: Product Data Synchronisation Network
        what_it_is: Supplies synchronised item attributes and packaging hierarchies consumed inbound to keep master data aligned with suppliers.
        who_uses_it: Master Data, Merchandising and Category teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: GBs/day attribute updates
            interval: Daily / on-change sync
      - name: NielsenIQ Store Read
        core: true
        icon: market
        summary: Syndicated store-level performance for competitive benchmarking.
        citations:
          - nielseniq
        category: Syndicated Market Data Provider
        what_it_is: Provides syndicated store-level performance so category teams can benchmark against the competitive market.
        who_uses_it: Category Managers, Merchandising and Insights teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/week
            interval: Weekly / monthly syndicated feed
      - name: Weather & Local Events
        icon: globe
        summary: Forecast and event calendars for demand shaping on perishable categories.
        category: External Signal / Weather Feed
        what_it_is: Attaches forecast and event calendars as exogenous signals for demand shaping on perishable categories.
        who_uses_it: Demand Science, Replenishment and Store Operations teams.
        data_out:
          batch:
            types:
              - structured
            volume: MBs-GBs/day
            interval: Daily forecast refresh
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: CEO & COO
        mark: Genie One
        summary: The CEO on comparable-store sales and market share; the COO on shrink, labor productivity and on-shelf availability through the peak trading weeks.
        uses:
          - - Genie One
            - Ask what comp sales were yesterday by banner without waiting on retail analytics.
          - - AI/BI
            - Sales, shrink and availability on one certified set of Metric Views.
          - - Unity Catalog
            - Certification and the business glossary, so "comp" means one thing across banners.
        sub:
          - name: CEO
            cares: comparable-store sales, market share and the margin behind the banner's growth.
          - name: COO
            cares: shrink, labor productivity and on-shelf availability through the peak trading weeks.
          - name: CFO
            cares: gross margin, waste as a cost line and the cash tied up in store inventory.
        ucs:
          - Shrink Attribution
          - On-Shelf Availability
          - Demand Forecasting
      - name: Merchandising
        mark: Model Serving
        summary: Category managers on assortment localisation, price and the promotion lift that decides which vendor deals fund the next circular.
        uses:
          - - Promo Planning Workbench
            - Lift scenarios before vendor deals lock.
          - - Model Serving
            - Demand models scored per SKU-store.
          - - AI/BI
            - Category performance on governed definitions.
        sub:
          - name: Category Manager
            cares: assortment, price and the vendor deals that fund the next circular.
          - name: Space Planner
            cares: planograms and facings that match space to local sell-through.
          - name: Pricing & Promotions
            cares: everyday price, markdown ladders and promotion lift by segment.
        ucs:
          - Promotion Optimisation
          - Assortment Localisation
          - Demand Forecasting
      - name: Store Operations
        core: true
        mark: Lakehouse//RT
        summary: District managers on labor schedules, on-shelf gaps and fresh-department waste, timing markdowns before the perishable code date closes.
        uses:
          - - Fresh Markdown Console
            - Perishable markdown timing by sell-through curve.
          - - Lakehouse//RT
            - Live out-of-stock signals at store-hour granularity.
          - - AI/BI
            - Shrink and labor productivity the field reads.
        sub:
          - name: District Manager
            cares: labor cost, on-shelf gaps and store execution across the district.
          - name: Fresh Manager
            cares: bakery, deli and produce waste against the code-date clock.
          - name: Front-End Manager
            cares: checkout throughput, scan accuracy and register shrink at the lane.
        ucs:
          - Fresh Waste Reduction
          - On-Shelf Availability
          - Labor Scheduling
          - Shrink Attribution
      - name: Supply Chain
        mark: AI/BI
        summary: Replenishment planners on forecast bias, store and DC fill rate and days of supply against warehouse capacity constraints.
        uses:
          - - Replenishment Optimiser
            - Order proposals tested against service targets.
          - - AI/BI
            - Fill rate and days of supply on certified Metric Views.
          - - Unity Catalog
            - One definition of inventory across POS and WMS.
        sub:
          - name: Replenishment Planner
            cares: forecast bias, store and DC fill rate and days of supply.
          - name: DC Operations
            cares: warehouse capacity, throughput and outbound service levels.
          - name: Vendor Manager
            cares: supplier fill, lead time and joint business planning.
        ucs:
          - Demand Forecasting
          - Vendor Collaboration
          - Fresh Waste Reduction
      - name: Loyalty & Marketing
        mark: CustomerLake
        summary: Personalised offers, fuel rewards and digital-coupon redemption scored per household to lift basket size and loyalty penetration.
        uses:
          - - Loyalty Offer Engine
            - Offers scored per household from basket history.
          - - CustomerLake
            - Segments without copying Dunnhumby exports elsewhere.
          - - Genie One
            - Ask which segments responded to last week's digital coupon.
        sub:
          - name: Loyalty Lead
            cares: household penetration, offer response and fuel-reward redemption.
          - name: Personalisation Science
            cares: propensity models and the segments behind each offer.
          - name: Digital & E-commerce
            cares: online basket size, coupon clips and substitution acceptance.
        ucs:
          - Loyalty Personalisation
          - E-commerce Substitution
          - Promotion Optimisation
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land the POS, merchandising and replenishment feeds; own the Bronze to Silver path and the pager when a store feed breaks.
        uses:
          - - Lakeflow Connect
            - Managed connectors for POS, merchandising and supply sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on POS and inventory feeds.
          - - Lakewatch
            - Freshness on the tables merchandising and the field read every morning.
        sub:
          - name: Ingestion Engineering
            cares: POS, merchandising and replenishment feeds landing on time.
          - name: Platform Engineering
            cares: the Bronze-to-Silver path and the pager when a store feed breaks.
          - name: Data Quality
            cares: expectations and freshness on POS and inventory tables.
        ucs:
          - Demand Forecasting
          - On-Shelf Availability
          - Fresh Waste Reduction
      - name: Data Scientists
        mark: MLflow
        summary: Demand, fresh-waste and loyalty-offer models, and whether they still hold a season after deployment.
        uses:
          - - Feature Store
            - SKU-store features defined once for training and serving.
          - - MLflow
            - Every demand and offer run tracked for audit and reproduction.
          - - Model Serving
            - Forecast and personalisation models scored per SKU-store.
        sub:
          - name: Demand Science
            cares: SKU-store forecasts across weather, promo and local events.
          - name: Fresh & Waste Modelling
            cares: markdown and production models that cut spoilage.
          - name: Personalisation Science
            cares: household offer and substitution models that hold a season.
        ucs:
          - Demand Forecasting
          - Fresh Waste Reduction
          - Loyalty Personalisation
      - name: App Developers
        mark: Apps
        summary: Ship the replenishment, fresh-markdown and loyalty applications stores work in, hosted next to governed data.
        uses:
          - - Apps
            - Store and markdown screens with no separate web tier to run or secure.
          - - Lakebase
            - Serverless Postgres for order and markdown writes.
          - - Agent Bricks
            - Agents that draft an order proposal or markdown against governed tools.
        sub:
          - name: Store Apps
            cares: replenishment and markdown screens store teams work in.
          - name: Loyalty Apps
            cares: the offer and coupon surfaces households see.
          - name: Platform & Agents
            cares: governed writes and agents drafting orders and markdowns.
        ucs:
          - Fresh Waste Reduction
          - Loyalty Personalisation
          - Labor Scheduling
consumers:
  - name: BI & Productivity
    icon: chart
    from: bi
    simplified: 2
    tiles:
      - name: Tableau / Qlik / ThoughtSpot
        icon: chart
        summary: External BI against SQL warehouses, with Unity Catalog permissions enforced end to end.
      - name: Microsoft Teams
        icon: chat
        summary: Genie in Teams for Unity Catalog-governed answers from the lakehouse, and store alerts in the channel operations already works in.
      - name: Notebooks & IDEs
        icon: notebook
        summary: Notebooks, VS Code and JetBrains against governed data and Genie Code.
  - name: Store Writeback
    icon: opdb
    tiles:
      - name: Replenishment Orders
        icon: stream
        summary: System-generated store orders written back into replenishment after planner review.
        citations:
          - blue-yonder-repl
      - name: Fresh Markdown Prices
        core: true
        icon: market
        summary: Dynamic markdowns pushed to POS labels for approaching sell-by inventory.
        citations:
          - invafresh
      - name: Associate Task Mobile
        icon: apps
        summary: Gap scans, facing tasks and temperature checks pushed to handheld devices.
  - name: Supplier & Partners
    icon: partner
    tiles:
      - name: Vendor VMI Portal
        icon: share
        summary: Inventory and forecast positions shared with key CPG suppliers over Delta Sharing.
      - name: Marketplace Pick Partners
        icon: partner
        summary: Substitution and fill-rate metrics exchanged with delivery marketplaces.
        citations:
          - instacart
      - name: Franchise Reporting
        icon: globe
        summary: Licensed store KPIs aggregated without nightly flat-file collection.
  - name: Regulatory & Reporting
    icon: gavel
    tiles:
      - name: Weights & Measures
        icon: gavel
        summary: Scale calibration and packaged goods compliance records from governed store audits.
      - name: Vendor Funding Audit
        icon: share
        summary: Promotion accruals and scan-based trade reconciliations filed from Gold products.
  - name: Published Products
    icon: product
    tiles:
      - name: Data Products
        icon: product
        summary: Published, contracted products discoverable in Unity Catalog Domains and shared over OpenSharing.
      - name: Sharing Recipients
        core: true
        icon: share
        summary: CPG vendors, franchisees and analysts reading live tables with no copy and no egress duplication.
  - name: Databricks Apps
    icon: apps
    tiles:
      - name: Replenishment Optimiser
        icon: stream
        short: Store orders
        summary: SKU-store order proposals scored against service level, capacity and spoilage risk before the cut-off.
      - name: Fresh Markdown Console
        icon: gauge
        short: Perishable waste
        summary: Markdown timing and depth optimised from sell-through curves and hours-to-code by department.
      - name: Promo Planning Workbench
        icon: market
        short: Vendor deals
        summary: Lift forecasts and funding accruals reconciled before circular and digital ads lock.
      - name: Loyalty Offer Engine
        icon: custlake
        short: Personalisation
        summary: Household offers scored from basket history and channel preference on governed segments.
  - name: AI/BI Dashboards
    icon: aibi
    tiles:
      - name: Sales, Shrink & Margin
        icon: aibi
        summary: Comparable sales, shrink, waste and margin by department on certified Metric Views.
        kpis:
          - Comparable sales
          - Shrink rate
          - Waste cost
          - Basket size
          - Gross margin
        teams:
          - CEO & COO
          - Store Operations
          - Merchandising
      - name: Availability & Fresh
        icon: aibi
        summary: On-shelf availability, fresh waste and markdown recovery across stores.
        kpis:
          - On-shelf availability
          - Fresh waste
          - Markdown recovery
          - Out-of-stock rate
          - Code-date compliance
        teams:
          - Store Operations
          - Supply Chain
          - Merchandising
      - name: Replenishment & Fill
        icon: aibi
        summary: Forecast accuracy, fill rate and days of supply across stores and DCs.
        kpis:
          - Forecast bias
          - Store fill rate
          - DC fill rate
          - Days of supply
          - Vendor OTIF
        teams:
          - Supply Chain
          - Merchandising
          - CEO & COO
      - name: Loyalty & Personalisation
        icon: aibi
        summary: Household penetration, offer response and online basket across channels.
        kpis:
          - Loyalty penetration
          - Offer response rate
          - Online basket size
          - Substitution acceptance
          - Fuel reward redemption
        teams:
          - Loyalty & Marketing
          - Merchandising
          - Store Operations
  - name: Agent Harnesses
    icon: agents
    tiles:
      - name: Omnigent OSS
        icon: omni
        short: Databricks, open source
        summary: Open-source meta-harness above existing agent frameworks, enabling agent composition, collaboration and centralised governance from one interface.
        capabilities:
          - Build
          - Deploy
          - Optimize
          - Govern
        related:
          - Agent Bricks
          - Unity Gateway
      - name: Claude Code
        core: true
        icon: code
        short: 3rd-party harness
        summary: Anthropic's coding harness working against the platform through MCP, with spend, routing and policy governed by Unity Gateway.
      - name: OpenAI Codex
        core: true
        icon: code
        short: 3rd-party harness
        summary: OpenAI's coding harness connected over MCP, governed at runtime by Unity Gateway rather than trusted by configuration.
      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Sales & Shrink Agent
        icon: genie
        summary: Ask about comparable sales, shrink and margin by department in plain language.
        feeds:
          - NCR Voyix POS
          - Toshiba ACE POS
          - Shrink, fill rate, basket
        teams:
          - CEO & COO
          - Store Operations
          - Merchandising
        questions:
          - What were comparable sales yesterday by banner and department?
          - What is shrink and waste by department this period?
          - Which stores show the worst register and scan exceptions?
          - How is basket size trending versus last year?
          - Where is margin leaking against the plan by category?
      - name: Availability & Fresh Agent
        icon: genie
        summary: Explore on-shelf availability and fresh waste across stores and departments.
        feeds:
          - Trax Shelf Analytics
          - Invafresh Fresh Platform
          - Blue Yonder Replenishment
          - Conformed SKU, store
        teams:
          - Store Operations
          - Supply Chain
          - Merchandising
        questions:
          - What is on-shelf availability by store and category right now?
          - Which fresh departments are driving the most waste?
          - Where are out-of-stocks hiding behind phantom inventory?
          - Which SKUs need a markdown before the code date closes?
          - What is store and DC fill rate this week?
      - name: Replenishment & Supply Agent
        icon: genie
        summary: Answer forecast, fill rate and days-of-supply questions across the network.
        feeds:
          - Blue Yonder Replenishment
          - NielsenIQ Store Read
          - Franchisee POS
        teams:
          - Supply Chain
          - Merchandising
          - CEO & COO
        questions:
          - Where is forecast bias worst by SKU and store?
          - What is days of supply by category and DC?
          - Which vendors are missing fill and lead-time targets?
          - Where is DC capacity constraining replenishment?
          - Which franchise stores diverge most from the banner?
      - name: Loyalty & Offers Agent
        icon: genie
        summary: Ask about household penetration, offer response and substitution across channels.
        feeds:
          - Dunnhumby Customer Data
          - Instacart Marketplace
          - Web & App Clickstream
        teams:
          - Loyalty & Marketing
          - Merchandising
          - Store Operations
        questions:
          - What is loyalty penetration and offer response by segment?
          - Which segments responded to last week's digital coupon?
          - What is online basket size versus in-store by household?
          - Which substitutions are customers rejecting most?
          - Which households are cross-sell candidates for fresh?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Demand Forecasting
        short: Replenishment
        icon: sheet
        summary: SKU-store forecasts that blend loyalty baskets, weather and local events for perishables and center store.
        problem: Store orders lean on last year and a planner's gut, so weather, promotions and local-event swings are missed and the same SKU is short in one store and overstocked in the next.
        who_benefits: Supply Chain
        how_built: POS, inventory and weather feeds land through Lakeflow, are conformed on Delta Lake, and SKU-store demand is scored in Model Serving to drive proposals in the Replenishment Optimiser.
        components:
          - Replenishment Optimiser
          - Model Serving
          - Feature Store
          - Weather & Local Events
          - Blue Yonder Replenishment
          - AI/BI
        stories:
          - title: Albert Heijn reduces waste and transport costs with data insights
            url: https://www.databricks.com/customers/albert-heijn
          - title: Ahold Delhaize builds a self-service data platform for 60M weekly customers
            url: https://www.databricks.com/customers/ahold-delhaize
      - name: Fresh Waste Reduction
        short: Shrink
        icon: gauge
        summary: Markdown and production planning that cuts spoilage without sacrificing on-shelf availability.
        problem: Perishables are marked down too late or too deep, so bakery, deli and produce spoil in the backroom or lose margin to blanket discounts, with the code-date clock tracked on clipboards.
        who_benefits: Store Operations
        how_built: Sell-through, production and temperature feeds are conformed on Delta Lake and scored in Model Serving, so the Fresh Markdown Console times each markdown against hours-to-code by department.
        components:
          - Fresh Markdown Console
          - Invafresh Fresh Platform
          - Model Serving
          - Lakehouse//RT
          - Delta Lake
        stories:
          - title: Albert Heijn cuts food waste and transport costs with data insights
            url: https://www.databricks.com/customers/albert-heijn
          - title: How Jumbo transformed the grocery shopping experience with data and AI
            url: https://www.databricks.com/blog/2022/06/07/jumbo-transforms-how-they-delight-customers-with-data-driven-personalized-experiences.html
      - name: On-Shelf Availability
        short: Operations
        icon: iot
        summary: Shelf gaps detected earlier from POS voids, inventory and shelf vision and prioritised for store teams.
        problem: A shelf gap is found only when a customer leaves empty-handed, because POS voids, backroom stock and shelf scans live in separate systems and phantom inventory hides the real out-of-stock.
        who_benefits: Store Operations
        how_built: POS, inventory and shelf-vision signals stream into Lakehouse//RT and are scored against expected sell-down, so store teams get prioritised out-of-stock alerts at shelf level earlier, ahead of most customer discovery.
        components:
          - Lakehouse//RT
          - Trax Shelf Analytics
          - NCR Voyix POS
          - AI/BI
          - Model Serving
        stories:
          - title: How Jumbo transformed the grocery shopping experience with data and AI
            url: https://www.databricks.com/blog/2022/06/07/jumbo-transforms-how-they-delight-customers-with-data-driven-personalized-experiences.html
      - name: Promotion Optimisation
        short: Merchandising
        icon: market
        summary: Which deals drove incremental units versus subsidised baseline sales.
        problem: Deals are judged on total units sold, so subsidised baseline sales look like wins, true incremental lift stays unknown, and the next vendor deal is negotiated on last quarter's noise.
        who_benefits: Merchandising
        how_built: Basket and promotion data are conformed on Delta Lake and lift is modelled in Model Serving, so the Promo Planning Workbench reconciles incremental units against funding before a circular locks.
        components:
          - Promo Planning Workbench
          - SymphonyAI IRIS
          - Model Serving
          - AI/BI
          - Delta Lake
        stories:
          - title: 84.51° powers Kroger price, promotions and loyalty with Databricks
            url: https://www.databricks.com/customers/8451
          - title: Ahold Delhaize analyses promotions and sales across customer segments
            url: https://www.databricks.com/customers/ahold-delhaize
      - name: Assortment Localisation
        short: Space
        icon: sheet
        summary: Cluster-specific assortments scored on velocity, margin and local demographic fit.
        problem: One national planogram ignores that a store's shoppers differ block to block, so slow SKUs hold shelf space local demand never wanted and the range that would sell never makes the set.
        who_benefits: Merchandising
        how_built: Sales, demographic and space data are conformed under Unity Catalog and stores are clustered in Model Serving, so localised ranges are scored on velocity, margin and local fit and read in AI/BI.
        components:
          - Relex Space Planning
          - Model Serving
          - AI/BI
          - Unity Catalog
          - NielsenIQ Store Read
        stories:
          - title: John Keells clusters stores to localise supermarket assortments
            url: https://www.databricks.com/customers/john-keells-holdings
          - title: How Jumbo transformed the grocery shopping experience with data and AI
            url: https://www.databricks.com/blog/2022/06/07/jumbo-transforms-how-they-delight-customers-with-data-driven-personalized-experiences.html
      - name: Labor Scheduling
        short: Store ops
        icon: people
        summary: Shift plans aligned to forecast traffic and fresh production workloads.
        problem: Shift plans are built on a fixed template, so registers are overstaffed on a slow morning and the fresh counter is short when a forecast peak and a production run land at the same hour.
        who_benefits: Store Operations
        how_built: Forecast traffic and fresh-production workload are scored in Model Serving on conformed Delta Lake data, so shift plans are built to demand while respecting staff availability, skills and scheduling rules, and published to store screens on Apps for manager approval.
        components:
          - Model Serving
          - AI/BI
          - Lakehouse//RT
          - Apps
          - Delta Lake
      - name: E-commerce Substitution
        short: Digital
        icon: partner
        summary: Eligible substitution candidates ranked by predicted acceptance, with pick accuracy tracked as a separate fulfillment measure.
        problem: When a picked item is out, the substitution is a guess, so shoppers get a swap they reject, refunds climb and the store loses the basket and the trust behind the next online order.
        who_benefits: Loyalty & Marketing
        how_built: Pick, substitution and acceptance history are engineered in Feature Store and scored with Model Serving and AI Functions, so eligible substitution candidates are ranked by predicted household acceptance and item eligibility, with item-picking accuracy measured separately.
        components:
          - Instacart Marketplace
          - Ocado Smart Platform
          - Model Serving
          - Feature Store
          - AI Functions
      - name: Loyalty Personalisation
        short: CRM
        icon: custlake
        summary: Offers and fuel rewards targeted per household without batch list exports.
        problem: Offers and fuel rewards go out as batch list pulls that are stale on arrival, so households get coupons for items they never buy and the partner's segments never reach the live channel.
        who_benefits: Loyalty & Marketing
        how_built: Basket history and segments land in CustomerLake and offers are scored per household in Model Serving, so the Loyalty Offer Engine targets each household without exporting lists to another tool.
        components:
          - Loyalty Offer Engine
          - CustomerLake
          - Dunnhumby Customer Data
          - Model Serving
          - Genie One
        stories:
          - title: 84.51° improves customer loyalty for Kroger shoppers with Databricks
            url: https://www.databricks.com/customers/8451
          - title: Ahold Delhaize drives personalization for 60M weekly customers
            url: https://www.databricks.com/customers/ahold-delhaize
      - name: Vendor Collaboration
        short: CPG
        icon: share
        summary: Joint business planning on shared forecast and inventory positions.
        problem: Joint business planning runs on emailed spreadsheets, so grocer and CPG supplier argue over whose forecast and inventory numbers are right instead of planning the promotion or the fill.
        who_benefits: Supply Chain
        how_built: Conformed forecast and inventory positions are published as governed Data Products and shared to suppliers over OpenSharing, so both sides plan against one live set of numbers with no file exchange.
        components:
          - OpenSharing
          - Data Products
          - Delta Lake
          - Unity Catalog
          - Blue Yonder Replenishment
        stories:
          - title: How Crisp and Databricks Enable Retail-Supplier Collaboration through Shared Sales and Inventory Data
            url: https://www.databricks.com/blog/how-crisp-and-databricks-enable-retail-supplier-collaboration-through-shared-sales-and-inventory-data
      - name: Shrink Attribution
        short: Loss prevention
        icon: chart
        summary: Recorded waste, verified adjustments and unexplained residual shrink distinguished by department and store pattern, with suspected causes ranked for review.
        problem: Shrink shows up as one lump on the P&L, so theft, spoilage and scan errors are impossible to separate and the store never knows which lever, security, process or training, actually moves it.
        who_benefits: CEO & COO
        how_built: POS, inventory and audit data are conformed on Delta Lake under Unity Catalog and scored in Model Serving, so recorded waste and verified scan adjustments are separated from unexplained residual shrink, with suspected causes ranked by department for store review in AI/BI.
        components:
          - AI/BI
          - Model Serving
          - NCR Voyix POS
          - Delta Lake
          - Unity Catalog
medallion:
  Bronze:
    short: Raw POS and supply
    summary: POS transactions, inventory snapshots, DC shipments, planogram compliance scans and loyalty swipes, landed exactly as received so a basket or a shrink event can always be replayed.
  Silver:
    short: Conformed SKU, store
    summary: SKUs, stores, vendors and customers resolved into single conformed entities across POS, merchandising and supply systems, with promotion flags reconciled to the item sold.
  Gold:
    short: Shrink, fill rate, basket
    summary: 'Contracted products merchandising and operations run on: shrink and waste by department, on-shelf availability, basket size and loyalty penetration.'
