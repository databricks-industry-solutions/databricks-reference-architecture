name: Media & Broadcasting
description: 'Content production, rights and distribution: linear and streaming operations, ad sales and audience measurement across broadcasters and studios.'
sources:
  - name: Playout & MAM
    icon: stream
    tiles:
      - name: Dalet Galaxy
        icon: stream
        summary: 'Newsroom, MAM and playout scheduling: rundowns, media assets and as-run logs from linear operations.'
        citations:
          - dalet
        category: Media Asset Management (MAM) / Playout
        what_it_is: 'Newsroom, MAM and playout scheduling: rundowns, media assets and as-run logs from linear operations.'
        who_uses_it: Playout operations, News and Programming teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 1-5 GB/day as-run + metadata
            interval: Hourly / per-run
          stream:
            types:
              - semi-structured
            volume: tens of playout events/sec
            interval: Continuous
      - name: Avid MediaCentral
        icon: stream
        summary: Edit decisions, proxy media and production metadata from craft editing and finishing.
