agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Audience & Reach Agent
        icon: genie
        summary: Ask about cross-platform reach, frequency and ratings in plain language.
        feeds:
          - Nielsen One
          - Comscore
          - Roku / Samsung ACR
          - Reach, yield, churn
        teams:
          - Ad Sales
          - Programming
          - Data Scientists
        questions:
          - What reach and frequency did last night's prime deliver by demo?
          - Which titles drove the most incremental reach on CTV?
          - How does linear versus streaming reach compare this quarter?
          - Which demos are we under-delivering against upfront guarantees?
          - What is duplicated reach across linear, OTT and CTV panels?
      - name: Ad Yield Agent
        icon: genie
        summary: Explore pacing, delivery and makegood exposure across linear and streaming.
        feeds:
          - WideOrbit WO Traffic
          - FreeWheel Ad Server
          - Operative One
          - Reach, yield, churn
        teams:
          - Ad Sales
          - Network & Studio Chiefs
          - App Developers
        questions:
          - Which campaigns are pacing to under-deliver this quarter?
          - What is ad yield by daypart versus last year?
          - Where is makegood liability accumulating right now?
          - Which pods have the lowest fill rate on streaming?
          - What scatter inventory is priced below market?
      - name: Programming & Slate Agent
        icon: genie
        summary: Answer content ROI, completion and title-performance questions on governed data.
        feeds:
          - Brightcove
          - Studio Cost Ledger
          - Nielsen One
          - Conformed asset, viewer
        teams:
          - Programming
          - Network & Studio Chiefs
          - Data Scientists
        questions:
          - Which titles returned the most acquisition and retention last month?
          - What is completion rate by genre this quarter?
          - Which catalog titles are driving new subscribers?
          - How does content ROI compare across platforms by title?
          - Which premieres under-performed against their lead-in?
      - name: Subscriber Retention Agent
        icon: genie
        summary: Ask about QoE, concurrency and subscriber churn risk in plain language.
        feeds:
          - Conviva Experience
          - Brightcove
          - Zuora Media
          - Reach, yield, churn
        teams:
          - Distribution
          - Programming
          - Data Engineers
        questions:
          - Which regions have the worst rebuffering right now?
          - What is concurrency versus forecast for tonight's live event?
          - Which subscribers are at highest churn risk before renewal?
          - How does QoE correlate with cancellations this month?
          - Which devices show the highest startup failure rate?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Audience Measurement
        short: Reach
        icon: chart
        summary: Cross-platform reach and frequency reconciled across linear, OTT and CTV panels.
        problem: Reach and frequency live in Nielsen, Comscore and ACR panels that never agree, so the sales desk prices upfronts and proves delivery against numbers that shift by source.
        who_benefits: Ad Sales
        how_built: Panel, as-run and ACR feeds are conformed on Delta Lake under Unity Catalog, so reach and frequency by demo read from one certified set of Metric Views in AI/BI.
        components:
          - Nielsen One
          - Comscore
          - Roku / Samsung ACR
          - AI/BI
          - Unity Catalog
        stories:
          - title: Seven West Media fuels audience growth and ad revenue with AI
            url: https://www.databricks.com/customers/seven-west-media
          - title: First-party audience data is the ad sales relationship now
            url: https://www.databricks.com/blog/first-party-audience-data-ad-sales-relationship-now
      - name: Ad Yield Optimisation
        short: Revenue
        icon: market
        summary: Scatter pricing and pod structure tuned to delivery pace and audience composition.
        problem: Scatter pricing and pod structure are set from stale pacing reports, so inventory sells too cheap or under-delivers and the lost yield only surfaces after the quarter closes.
        who_benefits: Ad Sales
        how_built: Delivery pace and audience composition are scored in Model Serving and surfaced in the Yield Manager app, so the desk tunes rate cards and pod fills against live delivery.
        components:
          - Yield Manager
          - FreeWheel Ad Server
          - Operative One
          - Model Serving
          - AI/BI
        stories:
          - title: Comcast Advertising powers campaign success with predictive insights
            url: https://www.databricks.com/customers/comcast/databricks-apps
      - name: Content Metadata Enrichment
        short: Content
        icon: product
        summary: Assets auto-tagged and enriched with entities, topics and scene descriptors for search and curation.
        problem: Descriptive metadata is missing or inconsistent across the archive and incoming assets, so search, rights and recommendation all run on sparse tags and editors re-tag the same content by hand.
        who_benefits: Programming
        how_built: Dalet and Avid assets are enriched with entities, topics and scene descriptors using AI Functions under Unity Catalog, so consistent metadata powers search, curation and recommendation.
        components:
          - Dalet Galaxy
          - Avid MediaCentral
          - AI Functions
          - Unity Catalog
        stories:
          - title: Warner Bros. Discovery curates the viewer experience
            url: https://www.databricks.com/customers/warner-bros-discovery
          - title: Condé Nast delivers personalized content at global scale
            url: https://www.databricks.com/customers/conde_nast
      - name: Subscriber Churn
        short: Retention
        icon: custlake
        summary: Cancel risk surfaced from viewing, billing and service contacts before renewal.
        problem: Cancel intent shows up in viewing dips, billing events and support contacts that sit in separate systems, so retention learns a subscriber is leaving only when the cancellation lands.
        who_benefits: Distribution
        how_built: Viewing, billing and service features are engineered in Feature Store and scored through Model Serving with runs tracked in MLflow, so cancel risk surfaces before renewal, not after.
        components:
          - Model Serving
          - CustomerLake
          - Zuora Media
          - Feature Store
          - MLflow
        stories:
          - title: Showtime lowers churn with a view into the subscriber journey
            url: https://www.databricks.com/customers/showtime
          - title: Flagging at-risk subscribers for direct-to-consumer media
            url: https://www.databricks.com/blog/2020/08/18/flagging-at-risk-subscribers-for-direct-to-consumer-media-services.html
      - name: Subscription Pricing & Packaging
        short: DTC
        icon: market
        summary: Plan tiers, bundles and price points tuned to engagement and churn for direct-to-consumer.
        problem: Streaming plans, price points and bundles are set on instinct and rarely revisited, so the tier mix leaves revenue on the table and pushes price-sensitive subscribers to cancel instead of downgrade.
        who_benefits: Distribution
        how_built: Zuora subscription, billing and viewing signals are conformed on Delta Lake and scored in Model Serving against CustomerLake features, so tier and bundle economics and price sensitivity read by segment in AI/BI.
        components:
          - Zuora Media
          - CustomerLake
          - Model Serving
          - Feature Store
          - AI/BI
      - name: QoE Monitoring
        short: Streaming
        icon: stream
        summary: Startup and rebuffer anomalies traced to CDN, device and title root cause.
        problem: When a stream buffers or fails to start, the cause hides across CDN, device and title, so viewers churn on a bad session before anyone traces which link in the delivery chain broke.
        who_benefits: Distribution
        how_built: Player and CDN telemetry stream into Lakehouse//RT and are scored in Model Serving, so the Live Ops Console traces startup and rebuffer anomalies to CDN, device and title root cause.
        components:
          - Live Ops Console
          - Conviva Experience
          - Brightcove
          - Lakehouse//RT
          - Model Serving
        stories:
          - title: FOX Sports reimagines the live fan experience
            url: https://www.databricks.com/customers/fox-sports
          - title: Building QoS analytics for streaming video services
            url: https://www.databricks.com/blog/2020/05/06/how-to-build-a-quality-of-service-qos-analytics-solution-for-streaming-video-services.html
      - name: Personalised Recommend
        short: Engagement
        icon: partner
        summary: Home screen rails ranked on affinity without copying profiles off-platform.
        problem: Home-screen rails default to editorial hunches or generic popularity, so viewers scroll past content they would watch and profiles get copied into outside tools to make it work.
        who_benefits: Programming
        how_built: Affinity models read viewing features from Feature Store and score in Model Serving on-platform, so home-screen rails rank to each household without copying profiles off the lakehouse.
        components:
          - Model Serving
          - Feature Store
          - CustomerLake
          - Brightcove
          - AI Functions
        stories:
          - title: Viacom18 personalizes viewing on the Databricks platform
            url: https://www.databricks.com/customers/viacom18
          - title: Personalization strategies for media companies
            url: https://www.databricks.com/blog/personalization-strategies-for-media
      - name: Audience Segmentation
        short: Audience
        icon: custlake
        summary: First-party audience segments built from viewing, subscription and engagement for sales and activation.
        problem: Sales promises audiences it cannot prove and marketing targets broad demos, because first-party viewing, subscription and engagement signals are never resolved into durable, addressable segments.
        who_benefits: Ad Sales
        how_built: Viewing, subscription and panel signals are resolved in CustomerLake and modelled into segments with Feature Store and Model Serving, so addressable first-party audiences are read in AI/BI for sales and activation.
        components:
          - CustomerLake
          - Nielsen One
          - Feature Store
          - Model Serving
          - AI/BI
      - name: Content Localization
        short: Global
        icon: stream
        summary: Subtitles, dubbing and market versions generated and quality-checked at scale.
        problem: Localizing catalogue for new markets means slow, costly manual subtitling and dubbing, so titles reach international audiences late and smaller-language markets are skipped entirely.
        who_benefits: Distribution
        how_built: Source assets and scripts are transcribed, translated and quality-checked with AI Functions on Delta Lake, so subtitles, dubs and market versions are generated and reviewed far faster than manual workflows.
        components:
          - Dalet Galaxy
          - AI Functions
          - Model Serving
          - Delta Lake
      - name: Content & Licensing Monetization
        short: Monetization
        icon: share
        summary: Content, rights and audience data packaged as governed products for licensees and partners.
        problem: Licensing and syndication run on emailed spreadsheets and one-off extracts, so rights holders and platform partners get stale data and the publisher cannot package or monetize its own catalogue and audience as governed data products.
        who_benefits: Network & Studio Chiefs
        how_built: Rights, viewing and audience data are conformed under Unity Catalog and published as governed Data Products shared to licensees and partners over Delta Sharing, with consumption read in AI/BI.
        components:
          - Data Products
          - Rightsline
          - Unity Catalog
          - Delta Sharing
          - AI/BI
medallion:
  Bronze:
    short: Raw audience feeds
    summary: As-run logs, playout automation events, ad server impressions, subscriber transactions and social engagement, landed exactly as received so a rating or a spot can always be replayed as it stood.
  Silver:
    short: Conformed asset, viewer
    summary: Programs, episodes, rights windows and viewer households resolved into single conformed entities across playout, OTT and ad systems, with cross-device identifiers reconciled and campaign delivery stitched to one audience.
  Gold:
    short: Reach, yield, churn
    summary: 'Contracted products sales and programming leaders run on: reach and frequency by demo, ad yield by daypart, subscriber churn and content ROI by title and platform.'
