pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Network & Studio Chiefs
        mark: Genie One
        summary: The CEO on portfolio ROI and subscriber growth; the CRO on ad yield by daypart and upfront commitments against the reach actually delivered.
        uses:
          - - Genie One
            - Ask what last night's prime delivered in reach without waiting on research.
          - - AI/BI
            - Reach, yield and churn on one certified set of Metric Views.
          - - Unity Catalog
            - Certification so "impression" means one thing across sales and ops.
        sub:
          - name: CEO
            cares: portfolio ROI, subscriber growth and the mix of linear decline against streaming gain.
          - name: Chief Revenue Officer
            cares: ad yield by daypart and upfront commitments against the reach actually delivered.
          - name: Head of Content
            cares: greenlight and licensing bets and the return each title earns across platforms.
        ucs:
          - Content & Licensing Monetization
          - Ad Yield Optimisation
          - Subscriber Churn
          - Audience Measurement
      - name: Programming
        mark: AI/BI
        summary: Schedule architecture, premiere windows and catalog rotation scored on audience retention, completion rate and content ROI by title and platform.
        uses:
          - - Schedule Optimizer
            - Daypart and title mix scored on reach and cost before the grid locks.
          - - AI/BI
            - Content ROI and completion rate on governed definitions.
          - - Genie One
            - Ask which titles drove the most new subscribers last month.
        sub:
          - name: VP Programming
            cares: the prime grid, premiere windows and catalog rotation against audience retention.
          - name: Scheduling
            cares: daypart mix and lead-in strategy before the grid locks for air.
          - name: Content Strategy
            cares: which titles and genres to commission from completion and ROI signals.
        ucs:
          - Content Metadata Enrichment
          - Personalised Recommend
          - Audience Measurement
      - name: Ad Sales
        core: true
        mark: CustomerLake
        summary: Upfront guarantees, scatter pricing and makegood liability when delivery under-runs against the reach and frequency by demo the desk sold.
        uses:
          - - Yield Manager
            - Rate cards and pacing exceptions before the quarter closes short.
          - - CustomerLake
            - Advertiser segments without copying CRM into a separate CDP.
          - - AI/BI
            - Delivery versus order on certified Metric Views.
        sub:
          - name: VP Ad Sales
            cares: upfront guarantees and scatter pricing against the reach and frequency the desk sold.
          - name: Yield & Pricing
            cares: rate cards, pacing and makegood liability when delivery under-runs.
          - name: Ad Operations
            cares: pod structure, trafficking and delivery reconciliation across linear and streaming.
        ucs:
          - Ad Yield Optimisation
          - Audience Segmentation
          - Audience Measurement
      - name: Distribution
        mark: Lakehouse//RT
        summary: MVPD carriage, OTT app QoE and CDN cost per stream when a marquee live event spikes concurrency past the forecast the network planned for.
        uses:
          - - Live Ops Console
            - Stream health and failover state during marquee broadcasts.
          - - Lakehouse//RT
            - QoE and concurrency at the latency a live event moves at.
          - - Model Serving
            - Churn risk scored on viewing and billing signals.
        sub:
          - name: Head of Streaming
            cares: OTT growth, concurrency and QoE during marquee live events.
          - name: CDN & Delivery
            cares: cost per stream and failover when concurrency spikes past forecast.
          - name: Retention
            cares: subscriber churn scored from viewing, billing and service signals.
        ucs:
          - QoE Monitoring
          - Subscriber Churn
          - Subscription Pricing & Packaging
          - Personalised Recommend
      - name: News & Production
        mark: Apps
        summary: Rundown execution, field feeds and rights clearance for breaking coverage, watched on time-to-air and the clearance exceptions that block a segment.
        uses:
          - - Newsroom Hub
            - Story lifecycle from pitch through air with asset lineage.
          - - Apps
            - Assignment and approval screens on governed metadata.
          - - Agent Bricks
            - Agents that draft rundown suggestions from wire and social feeds.
        sub:
          - name: News Director
            cares: time-to-air and the clearance exceptions that block a segment.
          - name: Field & Assignment
            cares: crew, feeds and rundown execution for breaking coverage.
          - name: Social & Digital
            cares: talent clips and owned-account reach scored back to parent titles.
        ucs:
          - Content Localization
          - Content Metadata Enrichment
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land the playout, OTT, ad server and measurement feeds; own the Bronze to Silver path and the pager when an as-run or impression pipeline breaks.
        uses:
          - - Lakeflow Connect
            - Managed connectors for MAM, ad server and subscription sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on as-run and impression feeds.
          - - Lakewatch
            - Freshness on the reach and yield tables sales reads every morning.
        sub:
          - name: Streaming Data Eng
            cares: landing as-run, playout and impression feeds with expectations on freshness.
          - name: Ad & Subscription Eng
            cares: ingesting ad server, traffic and billing sources for reach and yield tables.
          - name: Platform Eng
            cares: the Bronze-to-Silver path and the pager when a pipeline breaks before morning.
        ucs:
          - Audience Measurement
          - QoE Monitoring
          - Audience Segmentation
      - name: Data Scientists
        mark: MLflow
        summary: Subscriber churn, recommendation, ad-yield and reach-forecast models, and whether they still hold six months after deployment across linear and OTT.
        uses:
          - - Feature Store
            - Viewing and billing features read identically in training and serving.
          - - MLflow
            - Every churn and yield run tracked for audit and reproduction.
          - - Model Serving
            - Recommendation and churn models scored in the streaming path.
        sub:
          - name: Churn & Retention Science
            cares: cancel-risk models on viewing, billing and service contacts.
          - name: Recommendation & Ranking
            cares: affinity models ranking home-screen rails without copying profiles.
          - name: Ad & Reach Forecasting
            cares: yield and reach-forecast models across linear and OTT.
        ucs:
          - Subscriber Churn
          - Personalised Recommend
          - Ad Yield Optimisation
      - name: App Developers
        mark: Apps
        summary: Ship the live-ops, yield manager and newsroom applications programming and sales work in, hosted next to governed audience and rights data.
        uses:
          - - Apps
            - Operational screens with no separate web tier to run or secure.
          - - Lakebase
            - Serverless Postgres for rundown state and governed writes.
          - - Agent Bricks
            - Agents that draft rundown suggestions against governed tools.
        sub:
          - name: Live Ops Dev
            cares: stream-health and failover screens for marquee broadcasts.
          - name: Yield & Newsroom Dev
            cares: the yield manager and newsroom apps sales and news work in.
          - name: Platform Dev
            cares: governed writes and rundown state on serverless Postgres.
        ucs:
          - Subscription Pricing & Packaging
          - Content & Licensing Monetization
          - Content Localization
