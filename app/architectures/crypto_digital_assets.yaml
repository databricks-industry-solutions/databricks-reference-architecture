      - name: On-Chain Data Sets
        icon: network
        summary: Decoded, enriched on-chain datasets monetised to the wider ecosystem as governed, contracted products.
  - name: Databricks Apps
    icon: apps
    tiles:
      - name: Surveillance Desk
        icon: gauge
        short: Market abuse
        summary: 'The screen a surveillance analyst runs the market from: spoofing, wash-trading and cross-venue manipulation alerts with full order-book and on-chain context, on Databricks Apps over Lakebase.'
      - name: AML Case Manager
        icon: gavel
        short: Wallet risk & SAR
        summary: Where compliance analysts triage wallet and transaction alerts, trace exposure paths and draft neutral, report-ready SAR narratives with an Agent Bricks copilot, every step traced for the examiner.
      - name: Custody Control
        icon: key
        short: Balances & keys
        summary: Wallet balances, key operations and withdrawal approvals reconciled to the ledger on one governed screen, with reserve-reconciliation evidence for the responsible attestation process produced from the same numbers.
      - name: Treasury Cockpit
        icon: market
        short: Liquidity & exposure
        summary: Fiat and crypto liquidity, stablecoin reserves and settlement exposure across venues, banks and custodians in near real time, so treasury moves funds before a shortfall.
  - name: AI/BI Dashboards
    icon: aibi
    tiles:
      - name: Trading & Liquidity
        icon: aibi
        summary: Volume, depth and liquidity across venues and pairs on certified Metric Views.
        kpis:
