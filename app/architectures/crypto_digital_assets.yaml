            volume: Asset metadata
            interval: Daily refresh
          stream:
            types:
              - semi-structured
            volume: Prices + volumes
            interval: Continuous (API polling)
      - name: CF Benchmarks
        icon: market
        summary: Regulated crypto reference rates and indices, including the underlying rates for listed crypto futures and ETFs, the reference against which marks and settlements are validated.
        citations:
          - cfbenchmarks
        category: Benchmark / Reference Rate Provider
        what_it_is: Regulated crypto reference rates and indices, including the underlying rates for listed crypto futures and ETFs, the reference against which marks and settlements are validated.
        who_uses_it: Risk, finance and trading desk.
        data_out:
          batch:
            types:
