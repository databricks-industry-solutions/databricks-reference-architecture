name: Crypto & Digital Assets
description: 'Crypto exchanges, custodians and digital-asset firms: on-chain indexing, trading and matching, wallet custody, blockchain analytics and AML, market surveillance, and treasury and settlement.'
sources:
  - name: On-Chain & Nodes
    icon: network
    simplified: 2
    tiles:
      - name: Alchemy Node RPC
        icon: network
        summary: Managed node and RPC access across Ethereum, Layer-2s and other chains, the source of block, transaction and log data without running the full node estate in-house.
        citations:
          - alchemy
        category: Blockchain Node / RPC Provider
        what_it_is: Managed node and RPC access across Ethereum, Layer-2s and other chains, the source of block, transaction and log data without running the full node estate in-house.
        who_uses_it: Blockchain engineering, data engineering and quant.
        data_out:
          stream:
            types:
              - semi-structured
            volume: Blocks + logs + traces
            interval: Continuous (per block)
      - name: Infura RPC
        icon: network
        summary: ConsenSys node infrastructure serving JSON-RPC and WebSocket access to Ethereum and IPFS, a common redundant path for on-chain reads and transaction broadcast.
        citations:
          - infura
        category: Blockchain Node / RPC Provider
        what_it_is: Node infrastructure serving JSON-RPC and WebSocket access to Ethereum and IPFS, a redundant path for on-chain reads and transaction broadcast.
        who_uses_it: Blockchain engineering and data engineering.
        data_out:
          stream:
            types:
              - semi-structured
            volume: Blocks + logs
            interval: Continuous (per block)
      - name: The Graph Indexer
        icon: spark
        summary: Subgraph indexing of smart-contract events into queryable entities, the decoded, protocol-level view of DeFi and token activity across chains.
        citations:
          - thegraph
        category: Blockchain Indexing Protocol
        what_it_is: Subgraph indexing of smart-contract events into queryable entities, the decoded protocol-level view of DeFi and token activity across chains.
        who_uses_it: Blockchain engineering, quant and DeFi analytics.
        data_out:
          batch:
            types:
              - semi-structured
            volume: Decoded contract entities
            interval: Continuous indexing
          stream:
            types:
              - semi-structured
            volume: Subgraph event updates
            interval: Near real-time
      - name: QuickNode Streams
        icon: stream
        summary: Low-latency node access and streaming of blocks, mempool and contract events, the real-time on-chain feed for trading and surveillance.
        citations:
          - quicknode
        category: Blockchain Node / Streaming Provider
        what_it_is: Low-latency node access and streaming of blocks, mempool and contract events, the real-time on-chain feed for trading and surveillance.
        who_uses_it: Trading, market surveillance and blockchain engineering.
        data_out:
          stream:
            types:
              - semi-structured
            volume: Blocks + mempool + events
            interval: Continuous (real-time)
  - name: Trading & Market Data
    icon: market
    tiles:
      - name: AlphaPoint Exchange
        icon: market
        summary: 'Digital-asset exchange and matching-engine platform: order books, trade execution and inventory, the system of record for on-venue trading activity.'
        citations:
          - alphapoint
        category: Digital-Asset Exchange / Matching Engine
        what_it_is: Digital-asset exchange and matching-engine platform carrying order books, trade execution and inventory, the system of record for on-venue trading.
        who_uses_it: Trading operations, market makers and market data.
        data_out:
          stream:
            types:
              - semi-structured
            volume: Order + trade events at peak
            interval: Continuous (real-time)
      - name: Kaiko Market Data
        core: true
        icon: market
        summary: 'Institutional crypto market data: trades, order books and reference rates across centralised and decentralised venues, the benchmark feed for liquidity and pricing analytics.'
        citations:
          - kaiko
        category: Crypto Market Data Provider
        what_it_is: Institutional crypto market data covering trades, order books and reference rates across centralised and decentralised venues, the benchmark feed for liquidity and pricing analytics.
        who_uses_it: Market data, trading desk and quant.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale tick history
            interval: Daily history loads
          stream:
            types:
              - semi-structured
            volume: Trades + order-book ticks
            interval: Continuous (real-time)
      - name: CoinGecko API
        icon: api
        summary: Broad price, volume and asset-metadata coverage across thousands of tokens and venues, used for market context and coverage checks.
        citations:
          - coingecko
        category: Crypto Price / Metadata API
        what_it_is: Broad price, volume and asset-metadata coverage across thousands of tokens and venues, used for market context and coverage checks.
        who_uses_it: Market data, trading and research.
        data_out:
          batch:
            types:
