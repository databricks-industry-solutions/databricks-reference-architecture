      - name: Fedwire / SWIFT
        core: true
        icon: erp
        summary: Fiat banking rails for deposits, withdrawals and settlement with partner banks, reconciled against crypto movement for the full cash and coin position.
        citations:
          - swift
        category: Fiat Payment / Banking Rail
        what_it_is: Fiat banking rails for deposits, withdrawals and settlement with partner banks, reconciled against crypto movement for the full cash and coin position.
        who_uses_it: Treasury, settlement operations and finance.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: Payment messages + statements
            interval: Multiple settlement cycles daily
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Finance & Risk Marts
        icon: fed
        summary: Finance, treasury and risk marts left in their existing warehouses and queried in place under Unity Catalog, so the audited books and risk exposures enrich analytics without a second copy of the numbers.
        category: Finance & Risk Data Mart
        what_it_is: Finance, treasury and risk marts kept in the incumbent warehouses and queried in place, so audited books and risk exposures enrich analytics without a second copy.
        who_uses_it: Finance, treasury and risk.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale books + risk history
            interval: Queried on demand (federated)
  - name: Data Formats
    icon: zbraces
    simplified: 2
    tiles:
      - name: 'IVMS 101'
        icon: zbraces
        fmt: 'IVMS'
        summary: 'interVASP data model for Travel Rule originator/beneficiary information exchange.'
        spec_url: https://www.intervasp.org/
      - name: 'TRISA'
        icon: zbraces
        fmt: 'TRISA'
        summary: 'Travel Rule Information Sharing Architecture for compliant VASP-to-VASP data exchange.'
        spec_url: https://trisa.io/
