        who_uses_it: Custody operations, wallet security and treasury.
        data_out:
          batch:
            types:
              - structured
            volume: Balance + policy snapshots
            interval: Nightly reconciliation
          stream:
            types:
              - semi-structured
            volume: Transfer + approval events
            interval: Continuous (events)
      - name: BitGo Custody
        icon: key
        summary: Qualified custody and multi-signature wallets with settlement and staking, the record of institutional holdings and their approval workflow.
        citations:
          - bitgo
        category: Qualified Digital-Asset Custody
        what_it_is: Qualified custody and multi-signature wallets with settlement and staking, the record of institutional holdings and their approval workflow.
        who_uses_it: Custody operations, wallet security and finance.
        data_out:
          batch:
            types:
              - structured
            volume: Holdings + approval records
            interval: Nightly reconciliation
          stream:
            types:
              - semi-structured
            volume: Transfer events
            interval: Continuous (events)
      - name: Ledger Enterprise
        icon: key
        summary: Hardware-secured enterprise custody and key management, the governed device layer behind cold-storage balances and withdrawal ceremonies.
        citations:
          - ledger
        category: Hardware Custody / Key Management
        what_it_is: Hardware-secured enterprise custody and key management, the governed device layer behind cold-storage balances and withdrawal ceremonies.
        who_uses_it: Wallet security, custody operations and audit.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: Key ceremony + device logs
            interval: Nightly batch
      - name: Copper Custody
        icon: key
        summary: Custody, collateral and off-exchange settlement for institutions, the record of segregated holdings pledged against trading exposure.
        citations:
          - copper
        category: Custody & Off-Exchange Settlement
        what_it_is: Custody, collateral and off-exchange settlement for institutions, the record of segregated holdings pledged against trading exposure.
        who_uses_it: Custody operations, treasury and credit risk.
        data_out:
          batch:
            types:
              - structured
            volume: Collateral + settlement records
            interval: Nightly reconciliation
          stream:
            types:
              - semi-structured
            volume: Settlement events
            interval: Continuous (events)
  - name: Compliance & Analytics
    icon: zshield
    tiles:
      - name: Chainalysis KYT
        icon: zshield
        summary: Know-Your-Transaction screening and address risk scoring across chains, the wallet and transaction risk signal every AML disposition is built on.
        citations:
          - chainalysis
        category: Blockchain Analytics / KYT
        what_it_is: Know-Your-Transaction screening and address risk scoring across chains, the wallet and transaction risk signal every AML disposition is built on.
        who_uses_it: MLRO and financial crime, sanctions and investigations.
        data_out:
          batch:
            types:
              - structured
            volume: Risk scores + exposure paths
            interval: Daily batch
          stream:
            types:
              - semi-structured
            volume: Screening API responses
            interval: Continuous (API)
      - name: Elliptic Analytics
        icon: zshield
        summary: Blockchain analytics and exposure tracing for digital-asset compliance, the source of wallet risk, exposure paths and illicit-activity indicators.
        citations:
          - elliptic
        category: Blockchain Analytics / Screening
        what_it_is: Blockchain analytics and exposure tracing for digital-asset compliance, the source of wallet risk, exposure paths and illicit-activity indicators.
        who_uses_it: Financial crime, sanctions and investigations.
        data_out:
          batch:
            types:
              - structured
            volume: Risk + exposure data
            interval: Daily batch
          stream:
            types:
              - semi-structured
            volume: Screening API responses
            interval: Continuous (API)
      - name: TRM Labs
        icon: globe
        summary: Blockchain intelligence for transaction monitoring, sanctions and investigation, a second risk feed enriched onto addresses and counterparties.
        citations:
          - trm
        category: Blockchain Intelligence / Screening
        what_it_is: Blockchain intelligence for transaction monitoring, sanctions and investigation, a second risk feed enriched onto addresses and counterparties.
        who_uses_it: Financial crime, sanctions and investigations.
        data_out:
          batch:
            types:
              - structured
            volume: Address risk data
            interval: Daily batch
          stream:
            types:
              - semi-structured
            volume: Screening API responses
            interval: Continuous (API)
      - name: Notabene Travel Rule
        core: true
        icon: gavel
        summary: 'FATF Travel Rule messaging: originator and beneficiary information exchanged with counterparty VASPs on qualifying transfers, the compliance layer over on-chain settlement.'
        citations:
          - notabene
        category: Travel Rule Compliance Provider
        what_it_is: FATF Travel Rule messaging exchanging originator and beneficiary information with counterparty VASPs on qualifying transfers, the compliance layer over on-chain settlement.
        who_uses_it: Travel Rule team, compliance and financial crime.
        data_out:
          stream:
            types:
              - semi-structured
            volume: Travel Rule messages
            interval: Continuous (per transfer)
  - name: Ledger & Settlement
    icon: erp
    tiles:
      - name: Core Ledger
        icon: db
        summary: The internal double-entry ledger of customer balances, fees and internal transfers, the accounting record every on-chain balance is reconciled against.
        category: Core Ledger / Accounting System
        what_it_is: The internal double-entry ledger of customer balances, fees and internal transfers, the accounting record every on-chain balance is reconciled against.
        who_uses_it: Finance, treasury and custody operations.
        data_out:
          batch:
            types:
              - structured
            volume: Postings + balances
            interval: Continuous CDC (near real-time)
      - name: Circle / USDC
        core: true
        icon: product
        summary: Stablecoin issuance, minting and redemption flows, the fiat-backed settlement rail whose reserves and movements feed treasury and liquidity.
        citations:
          - circle
        category: Stablecoin Issuer / Settlement Rail
        what_it_is: Stablecoin issuance, minting and redemption flows, the fiat-backed settlement rail whose reserves and movements feed treasury and liquidity.
        who_uses_it: Treasury, finance and settlement operations.
        data_out:
          batch:
            types:
              - structured
            volume: Reserve + attestation data
            interval: Daily/periodic
          stream:
            types:
              - semi-structured
            volume: Mint + redeem + transfer events
            interval: Continuous (on-chain)
      - name: Fireblocks Network
        icon: partner
        summary: Off-exchange settlement and transfer network between counterparties, the record of institutional settlement instructions and confirmations.
        citations:
          - fireblocks
        category: Off-Exchange Settlement Network
        what_it_is: Off-exchange settlement and transfer network between counterparties, the record of institutional settlement instructions and confirmations.
        who_uses_it: Settlement operations, treasury and trading.
        data_out:
          stream:
            types:
              - semi-structured
            volume: Settlement instructions + confirmations
