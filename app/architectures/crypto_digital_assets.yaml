agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Market & Liquidity Agent
        icon: genie
        summary: Ask about trading volume, order-book depth and liquidity across venues in plain language.
        feeds:
          - Kaiko Market Data
          - AlphaPoint Exchange
          - Risk, liquidity, compliance
        teams:
          - Trading Desk
          - Market makers
          - Market data
        questions:
          - What was trading volume by pair and venue yesterday?
          - Where is order-book depth thinnest across our pairs right now?
          - How have spreads moved this week by venue?
          - Which venues show the best liquidity for a large order?
          - How does our market share compare across pairs this month?
      - name: AML & Wallet Risk Agent
        icon: genie
        summary: Ask about wallet risk, exposure paths and alert queues across chains in plain language.
        feeds:
          - Chainalysis KYT
          - Elliptic Analytics
          - Conformed wallet, asset, trade
        teams:
          - Compliance & AML
          - MLRO & financial crime
          - Sanctions & PEP
        questions:
          - Which wallets show the highest risk exposure this week?
          - What is a wallet's exposure path to sanctioned addresses?
          - How large is the AML alert backlog and what is ageing?
          - Which counterparties have rising illicit-activity indicators?
          - How many transfers were held or blocked for screening today?
      - name: Custody & Reserves Agent
        icon: genie
        summary: Ask about custodied balances, reconciliation and proof of reserves in plain language.
        feeds:
          - Fireblocks Custody
          - Core Ledger
          - Conformed wallet, asset, trade
        teams:
          - Custody Ops
          - Custody operations
          - Proof of reserves
        questions:
          - What are our custodied balances by asset right now?
          - Where do on-chain balances diverge from the ledger?
          - Which withdrawals are pending approval and for how long?
          - What is our reserve coverage ratio by asset today?
          - How many reconciliation breaks are open across wallets?
      - name: Treasury & Exposure Agent
        icon: genie
        summary: Ask about liquidity, stablecoin reserves and counterparty exposure in plain language.
        feeds:
          - Circle / USDC
          - Core Ledger
          - Risk, liquidity, compliance
        teams:
          - Exec & Finance
          - CFO & Treasury
          - Chief Risk Officer
        questions:
          - What is our fiat and crypto liquidity across venues and banks?
          - What are our stablecoin holdings and redemption exposure right now?
          - Which counterparties carry the largest exposure today?
          - What settlement float is expected before the next window?
          - What was net trading revenue yesterday across the book?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: On-Chain Data Platform
        short: Data foundation
        icon: network
        summary: Ingesting and decoding block, mempool and smart-contract data across chains into governed tables, joined to exchange and off-chain data as one queryable estate.
        problem: On-chain data is high-volume, deeply nested and forever changing across chains and Layer-2s; teams rebuild brittle indexers per chain and still cannot join it to exchange or customer data.
        who_benefits: Trading Desk
        how_built: Node, mempool and market-data feeds land through Auto Loader and Lakeflow into a Bronze-to-Gold medallion; decoded events are conformed in Delta Lake and streamed in Lakehouse//RT for near-real-time analytics.
        components:
          - Alchemy Node RPC
          - Lakeflow
          - Auto Loader
          - Delta Lake
          - Lakehouse//RT
        stories:
          - title: 'The boom of SOON: near-real-time data at Coinbase'
            url: https://www.databricks.com/customers/coinbase/streaming
          - title: Streaming CEX, DEX and blockchain events for Web3 analytics
            url: https://community.databricks.com/t5/technical-blog/streaming-cex-dex-and-blockchain-events-in-databricks-for-web3/ba-p/120503
      - name: Real-Time Fraud
        short: Fraud & ATO
        icon: gauge
        summary: Scoring deposits, withdrawals and logins inline for fraud and account takeover, with sub-second features computed on live transaction data.
        problem: Crypto fraud and account takeover move in seconds and are irreversible once a withdrawal confirms; microbatch feature pipelines add latency that costs accuracy and money.
        who_benefits: Risk & Fraud
        how_built: Transaction and login events stream into Lakehouse//RT; features from Feature Store are scored through Model Serving, with millisecond scoring as the design target behind the withdrawal path.
        components:
          - Model Serving
          - Feature Store
          - Lakehouse//RT
          - Kafka Trade Events
          - Delta Lake
        stories:
          - title: Real-time fraud detection at Coinbase
            url: https://www.databricks.com/customers/coinbase/lakeflow
          - title: Ultra-fast anomaly detection on Ethereum with Spark Real-Time Mode
            url: https://www.databricks.com/blog/ultra-fast-anomaly-detection-using-apache-spark-real-time-mode
      - name: AML Wallet Screening
        short: Financial crime
        icon: zshield
        summary: Screening wallets and transactions against blockchain-analytics risk, tracing exposure paths, and drafting report-ready narratives for compliance analysts.
        problem: Analysts manually stitch Chainalysis and Elliptic screening to internal history, and every high-risk disposition and SAR is drafted by hand under regulatory scrutiny.
        who_benefits: Compliance & AML
        how_built: Screening results and on-chain evidence are conformed in the lakehouse; an Agent Bricks copilot explains wallet risk and drafts neutral narratives, traced and evaluated in MLflow, from the AML Case Manager.
        components:
          - Agent Bricks
          - AML Case Manager
          - Chainalysis KYT
          - Elliptic Analytics
          - MLflow
        stories:
          - title: 'Elliptic: protect crypto assets with governed AI'
            url: https://www.databricks.com/customers/elliptic
          - title: Modern BSA/AML compliance on Databricks
            url: https://www.databricks.com/blog/modern-bsaaml-compliance-databricks
      - name: Travel Rule Compliance
        short: VASP data
        icon: gavel
        summary: Exchanging originator and beneficiary information with counterparty VASPs on qualifying transfers, matched to on-chain settlement and screening.
        problem: The FATF Travel Rule forces VASPs to exchange originator and beneficiary data on transfers, but that data lives apart from the on-chain settlement and screening it must be reconciled against.
        who_benefits: Compliance & AML
        how_built: Notabene Travel Rule messages are joined to on-chain transfers and screening results in the lakehouse; matches and exceptions are governed in Unity Catalog and worked from the AML Case Manager.
        components:
          - Notabene Travel Rule
          - AML Case Manager
          - Unity Catalog
          - AI Functions
          - Delta Lake
        stories:
          - title: AML solutions at scale with Databricks
            url: https://www.databricks.com/blog/2021/07/16/aml-solutions-at-scale-using-databricks-lakehouse-platform.html
      - name: Market Surveillance
        short: Manipulation
        icon: observ
        summary: Detecting spoofing, wash trading and cross-venue manipulation from order-book, trade and on-chain flow, and building the case an investigator can defend.
        problem: Manipulation hides across order books, venues and wallets; rule-only surveillance floods analysts with false positives and misses the coordinated, cross-venue patterns that matter.
        who_benefits: Risk & Fraud
        how_built: Order-book, trade and on-chain events are conformed in Lakehouse//RT; behaviour models in Model Serving score manipulation patterns surfaced with full context on the Surveillance Desk.
        components:
          - Surveillance Desk
          - Model Serving
          - Lakehouse//RT
          - Kaiko Market Data
          - AI/BI
        stories:
          - title: Ultra-fast anomaly detection on blockchain data with Real-Time Mode
            url: https://www.databricks.com/blog/ultra-fast-anomaly-detection-using-apache-spark-real-time-mode
      - name: Market Analytics
        short: Liquidity & books
        icon: market
        summary: Order-book depth, spreads, liquidity and reference rates across venues and pairs, from multi-terabyte tick history queryable at low cost.
        problem: Order-book and tick data arrives from a dozen venues at multi-terabyte scale; teams cannot ingest, join and query it fast enough to run liquidity and pricing analytics.
        who_benefits: Trading Desk
        how_built: Tick and order-book data from Kaiko and exchange feeds land through Auto Loader into Delta Lake, partitioned and Z-ordered, and queried at scale on SQL Warehouses with AI/BI.
        components:
          - Kaiko Market Data
          - Auto Loader
          - Delta Lake
          - SQL Warehouses
          - AI/BI
        stories:
          - title: How Gemini built a cryptocurrency analytics platform on the lakehouse
            url: https://www.databricks.com/blog/2022/02/15/how-gemini-built-a-cryptocurrency-analytics-platform-using-lakehouse-for-financial-services.html
          - title: Delta Sharing with Nasdaq's digital assets market data
            url: https://www.databricks.com/blog/using-delta-sharing-accelerate-insights-nasdaqs-digital-assets-market-data
      - name: Proof of Reserves
        short: Custody assurance
        icon: key
        summary: Reconciling on-chain wallet balances to the internal ledger to produce reserve evidence supporting attestations to clients, auditors and regulators.
        problem: After exchange collapses, clients and regulators demand provable reserves, but on-chain balances and the internal ledger live in separate systems reconciled by hand.
        who_benefits: Custody Ops
        how_built: On-chain balances from custody wallets and Core Ledger postings are reconciled in Lakehouse//RT; the Custody Control app produces reserve-reconciliation evidence, stating the asset and liability coverage basis, that supports the separate attestation process.
        components:
          - Custody Control
          - Fireblocks Custody
          - Core Ledger
          - Lakehouse//RT
          - Unity Catalog
      - name: Treasury & Settlement
        short: Liquidity
        icon: db
        summary: Managing fiat and crypto liquidity, stablecoin holdings and redemption exposure, and settlement exposure across venues, banks and custodians in near real time.
        problem: Liquidity and settlement exposure sit across exchanges, banks, stablecoins and custodians; treasury sees it too late to move funds before a shortfall or a stuck settlement.
        who_benefits: Exec & Finance
        how_built: Ledger, custody and settlement feeds are conformed to Gold; exposure and liquidity are surfaced in the Treasury Cockpit with Genie and AI/BI on certified Metric Views.
        components:
          - Treasury Cockpit
          - Circle / USDC
          - Core Ledger
          - Genie
          - AI/BI
      - name: DeFi Analytics
        short: On-chain protocols
        icon: spark
        summary: Tracking TVL, liquidity-pool flows, lending positions and wallet behaviour across DeFi protocols, correlated to centralised-exchange activity.
        problem: DeFi activity spans protocols, pools and Layer-2s with no common schema; correlating it to exchange flow for trading and risk means decoding raw contract events chain by chain.
        who_benefits: Trading Desk
        how_built: Decoded DeFi and DEX events land in Delta Lake and are conformed to Silver; wallet-behaviour features feed Model Serving and are explored in AI/BI alongside CEX flow.
        components:
          - The Graph Indexer
          - Delta Lake
          - Feature Store
          - Model Serving
          - AI/BI
        stories:
          - title: Streaming CEX, DEX and blockchain events for Web3 trading analytics
            url: https://community.databricks.com/t5/technical-blog/streaming-cex-dex-and-blockchain-events-in-databricks-for-web3/ba-p/120503
      - name: Customer 360
        short: Personalization
        icon: custlake
        summary: Resolving identity across on-chain wallets, exchange accounts and products to power personalization, retention and lifetime-value models, with fraud signals shared.
        problem: A customer's wallets, accounts and product activity are scattered across services, so personalization, retention and risk each rebuild a partial view and none is complete.
        who_benefits: Risk & Fraud
        how_built: Identity is resolved across wallets and accounts with CustomerLake and graph analytics; personalization and churn models in Model Serving are governed in Unity Catalog.
        components:
          - CustomerLake
          - Model Serving
          - Unity Catalog
          - Feature Store
          - AI/BI
        stories:
          - title: Block redefines financial services with Unity Catalog
            url: https://www.databricks.com/customers/block/unity-catalog
medallion:
  Bronze:
    short: Raw on-chain and trade feeds
    summary: Node and RPC blocks, mempool and decoded contract events, exchange order and trade messages, wallet and custody transactions, market-data ticks and blockchain-analytics screening results, landed exactly as received in open Delta and Iceberg formats so any transfer or trade can be replayed as it stood, chain reorgs and all.
  Silver:
    short: Conformed wallet, asset, trade
    summary: Wallets, addresses, tokens, customers and trades resolved into single conformed entities across the on-chain, exchange and custody estates, chain reorganisations reconciled, token contracts decoded, and internal accounts stitched to the on-chain addresses they control.
  Gold:
    short: Risk, liquidity, compliance
    summary: 'Contracted products the trading, risk and compliance teams run on: real-time risk and counterparty exposure, order-book depth and liquidity, wallet and transaction risk scores, reserve-reconciliation evidence for attestations, and regulator-ready AML and market-surveillance reporting.'
