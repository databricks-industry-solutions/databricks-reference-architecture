  - name: Custody & Wallets
    icon: key
    tiles:
      - name: Fireblocks Custody
        icon: key
        summary: 'MPC-based wallet infrastructure and transfer policy engine: non-secret key-operation metadata, whitelists and signed-withdrawal records, the source of truth for custodied balances and movement, excluding private keys and MPC key-share material.'
        citations:
          - fireblocks
        category: Digital-Asset Custody (MPC Wallet)
