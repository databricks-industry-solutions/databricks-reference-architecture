        summary: Genie in Teams for Unity Catalog-governed answers from the lakehouse, and risk and surveillance alerts in the channel the desk already works in.
      - name: Notebooks & IDEs
        icon: notebook
        summary: Quant and analyst notebooks, VS Code and JetBrains against governed on-chain and market data and Genie Code.
  - name: Client & Partner APIs
    icon: partner
    tiles:
      - name: Institutional Data API
        icon: api
        summary: Curated market, on-chain and risk data served to institutional clients and prime-brokerage partners through governed API endpoints.
      - name: Market Data Sharing
        icon: share
        summary: Enriched trade, order-book and on-chain datasets shared with funds and partners over OpenSharing rather than copied file exports.
      - name: Client Portals
        icon: apps
