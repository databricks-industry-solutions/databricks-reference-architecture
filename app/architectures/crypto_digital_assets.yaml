pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Exec & Finance
        mark: Genie One
        summary: The CEO on growth against regulatory cost and the trade between listings and risk; the CFO and treasury on liquidity, stablecoin holdings and fiat and crypto exposure; the Chief Risk Officer on counterparty, market and financial-crime risk across the book.
        uses:
          - - Genie One
            - Ask what the firm's exposure or yesterday's trading revenue was without booking analyst time.
          - - AI/BI
            - Trading revenue, liquidity, reserves and risk exposure on one certified set of Metric Views.
          - - Unity Catalog
            - Certification and the business glossary, so "exposure" and "reserves" mean one thing across the firm.
        sub:
          - name: CEO
            cares: growth, listings and the trade between volume and regulatory risk.
          - name: CFO & Treasury
            cares: liquidity, stablecoin reserves and fiat and crypto exposure.
          - name: Chief Risk Officer
            cares: counterparty, market and financial-crime risk across the book.
        ucs:
          - Treasury & Settlement
          - Market Analytics
          - Customer 360
      - name: Trading Desk
        mark: AI/BI
        summary: Market makers and liquidity providers quoting across venues, trading operations watching order books and spreads, and the market-data team joining on-chain flow to exchange activity.
        uses:
          - - Market Analytics
            - Order-book depth, spreads and liquidity across venues on governed data.
          - - Lakehouse//RT
            - Trade, quote and on-chain events at the latency a market moves at.
          - - AI/BI
            - Volume, liquidity and PnL on the same definitions the executive team reads.
        sub:
          - name: Market makers
            cares: quoting and inventory across trading pairs and venues.
          - name: Trading operations
            cares: order-book health, spreads and venue connectivity.
          - name: Market data
            cares: joining on-chain flow to exchange trades and reference rates.
        ucs:
          - On-Chain Data Platform
          - Market Analytics
          - DeFi Analytics
      - name: Compliance & AML
        core: true
        mark: Agent Bricks
        summary: The MLRO and financial-crime team screening wallets and transactions, sanctions and PEP analysts clearing alerts, and the Travel Rule team exchanging originator and beneficiary data with counterparty VASPs.
        uses:
          - - Agent Bricks
            - A compliance copilot that explains wallet risk and drafts report-ready narratives from governed on-chain evidence.
          - - AI Functions
            - Alert triage and SAR narrative drafting run in SQL against governed transaction data.
          - - Unity Catalog
            - Lineage and access controls so every screening decision is traceable for the examiner.
        sub:
          - name: MLRO & financial crime
            cares: wallet and transaction screening and SAR filing.
          - name: Sanctions & PEP
            cares: alert clearing against sanctioned addresses and lists.
          - name: Travel Rule
            cares: originator and beneficiary exchange with counterparty VASPs.
        ucs:
          - AML Wallet Screening
          - Travel Rule Compliance
          - Market Surveillance
      - name: Custody Ops
        mark: Lakehouse//RT
        summary: Custody operations reconciling on-chain balances to the ledger, wallet-security teams governing key ceremonies and withdrawal approvals, and the proof-of-reserves team attesting holdings to clients and auditors.
        uses:
          - - Lakehouse//RT
            - On-chain balances and withdrawal events reconciled at settlement speed.
          - - Custody Control
            - Wallet balances, key operations and withdrawal approvals on one governed screen.
          - - Unity Catalog
            - Governed, audited access to the balances proof-of-reserves is attested from.
        sub:
          - name: Custody operations
            cares: balance reconciliation between chain and ledger.
          - name: Wallet security
            cares: key ceremonies, whitelists and withdrawal approvals.
          - name: Proof of reserves
            cares: attesting holdings to clients, auditors and regulators.
        ucs:
          - Proof of Reserves
          - AML Wallet Screening
      - name: Risk & Fraud
        mark: Model Serving
        summary: Real-time fraud and account-takeover teams scoring transactions inline, market-surveillance analysts detecting manipulation and wash trading, and credit-risk teams sizing counterparty and liquidation exposure.
        uses:
          - - Model Serving
            - Fraud, surveillance and risk models scored inside the transaction path in milliseconds.
          - - Feature Store
            - Trade and wallet features defined once and read identically in training and serving.
          - - Lakehouse//RT
            - Transaction and order events at the sub-second latency fraud moves at.
        sub:
          - name: Fraud & ATO
            cares: real-time scoring of deposits, withdrawals and logins.
          - name: Market surveillance
            cares: manipulation, spoofing and wash-trading detection.
          - name: Credit & liquidation
            cares: counterparty and margin exposure across the book.
        ucs:
          - Real-Time Fraud
          - Market Surveillance
          - Customer 360
  - name: Technical
    icon: code
    tiles:
      - name: Blockchain Eng
        mark: Lakeflow
        summary: Run node clients and indexers across Bitcoin, Ethereum and Layer-2s, decode smart-contract and ERC-20 events, and land on-chain, mempool and exchange feeds through Auto Loader and Lakeflow into the medallion.
        uses:
          - - Lakeflow Connect
            - Managed connectors for exchange, market-data and SaaS sources.
          - - Auto Loader
            - Incremental ingestion of node, mempool and market-data files as they land.
          - - Lakehouse//RT
            - CEX, DEX and blockchain events streamed for near-real-time analytics.
      - name: Quant & ML
        mark: MLflow
        summary: Build fraud, market-surveillance, willingness-to-trade and liquidation-risk models on Kaiko and on-chain data, and check whether they still hold once market regimes shift.
        uses:
          - - Feature Store
            - Trade, wallet and order-book features shared across models.
          - - MLflow
            - Every run tracked and evaluated for audit and reproduction.
          - - Model Serving
            - Fraud, surveillance and pricing models scored in the operational path.
      - name: Platform Eng
        mark: Apps
        summary: Ship the surveillance, AML, custody and treasury applications the firm works in, backed by governed data and serverless Postgres, with agents drafting alerts and case narratives.
        uses:
          - - Apps
            - Trading, custody and compliance screens with no separate web tier to secure.
          - - Lakebase
            - Serverless Postgres for case state, approvals and governed writes.
          - - Agent Bricks
            - Agents that draft a SAR narrative or a surveillance case against governed tools.
consumers:
  - name: BI & Productivity
    icon: chart
    from: bi
    simplified: 2
    tiles:
