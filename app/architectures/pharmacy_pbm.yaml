pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: PBM Leadership
        mark: Genie One
        summary: The CEO on book-of-business growth and client retention; the CFO on rebate economics and net cost trend; the chief trade officer on manufacturer rebate contracts and formulary value.
        uses:
          - - Genie One
            - Ask what a client's net cost per claim was last month, or where rebate leaked, without a analyst pull.
          - - AI/BI
            - Net cost, rebate accrual and generic dispensing rate on one certified set of Metric Views.
          - - Unity Catalog
            - Certification and the glossary so "net cost" and "rebate" mean one thing across the PBM.
        sub:
          - name: CEO
            cares: book-of-business growth and client retention.
          - name: CFO
            cares: rebate economics and net cost trend across the book.
          - name: Chief trade officer
            cares: manufacturer rebate contracts and formulary value.
        ucs:
          - Rebate Optimization
          - Formulary Management
          - Network Performance
          - MAC & Drug Pricing
      - name: Clinical & UM
        mark: Model Serving
        summary: The P&T committee on formulary decisions, clinical pharmacists on medication therapy and adherence, and utilization management on prior-authorization policy and step therapy.
        uses:
          - - Model Serving
            - Adherence and prior-auth models scored inside the clinical and PA path.
          - - AI Functions
            - Prior-auth documents and clinical notes classified at scale from unstructured text.
          - - AI/BI
            - Adherence, PA turnaround and formulary compliance on governed, certified views.
        sub:
          - name: P&T committee
            cares: formulary decisions and therapeutic class review.
          - name: Clinical pharmacy
            cares: medication therapy management and adherence.
          - name: Utilization mgmt
            cares: prior-authorization policy and step therapy.
        ucs:
          - Prior Auth Automation
          - Medication Adherence
          - Formulary Management
      - name: Network Pricing
        core: true
        mark: AI/BI
        summary: Network contracting on pharmacy reimbursement, the pricing team on MAC lists and AWP, and underwriting on client pricing guarantees and effective rate.
        uses:
          - - AI/BI
            - MAC competitiveness, network spread and guarantee attainment on certified views.
          - - Model Serving
            - MAC and reimbursement models scored against acquisition cost and claim volume.
          - - Genie One
            - Ask which drugs are underwater on the current MAC list this week.
        sub:
          - name: Network contracting
            cares: pharmacy reimbursement and network design.
          - name: Pricing & MAC
            cares: MAC list maintenance and AWP benchmarking.
          - name: Underwriting
            cares: client pricing guarantees and effective rate.
        ucs:
          - MAC & Drug Pricing
          - Network Performance
          - Rebate Optimization
      - name: Pharmacy Ops
        mark: Lakehouse//RT
        summary: Retail pharmacy operations on dispensing workflow and throughput, mail and specialty on fulfillment and patient support, and inventory on stock, replenishment and 340B accumulation.
        uses:
          - - Dispensing Queue
            - Fill volume, wait time and out-of-stock risk monitored in the external pharmacy-management workspace.
          - - Lakehouse//RT
            - Live dispensing and inventory state at the latency a pharmacy moves at.
          - - Model Serving
            - Demand and replenishment models scored against fill and wholesaler data.
        sub:
          - name: Retail pharmacy ops
            cares: dispensing workflow and throughput.
          - name: Mail & specialty
            cares: fulfillment and specialty patient support.
          - name: Inventory
            cares: stock, replenishment and 340B accumulation.
        ucs:
          - Specialty Pharmacy
          - Dispensing & Inventory
          - 340B Compliance
      - name: Trust & Comply
        mark: Unity Catalog
        summary: Program integrity on fraud, waste and abuse, regulatory affairs on Medicare Part D and CMS reporting, and audit on pharmacy audit exposure and DIR reconciliation.
        uses:
          - - Model Serving
            - Fraud, waste and abuse models scored across claims, prescriber and pharmacy behaviour.
          - - Unity Catalog
            - Fine-grained governance and lineage over PHI supporting HIPAA and CMS audit.
          - - AI/BI
            - FWA exposure, Part D metrics and DIR reconciliation on governed, certified views.
        sub:
          - name: Program integrity
            cares: fraud, waste and abuse investigation.
          - name: Regulatory affairs
            cares: Medicare Part D and CMS reporting.
          - name: Audit
            cares: pharmacy audit exposure and DIR reconciliation.
        ucs:
          - Fraud, Waste & Abuse
          - 340B Compliance
          - Medication Adherence
  - name: Technical
    icon: code
    tiles:
      - name: Claims Data Eng
        mark: Lakeflow
        summary: Land NCPDP claims and reversals, eligibility and enrollment, Surescripts and wholesaler EDI; own the Bronze to Silver path and the pager when the claims tables stall.
        uses:
          - - Lakeflow Connect
            - Managed connectors for RxClaim, dispensing, rebate and eligibility sources.
          - - Auto Loader
            - NCPDP claim and EDI files landed incrementally into Bronze.
          - - Lakewatch
            - Freshness on the claims and rebate tables finance reads every morning.
      - name: Pharmacy DS
        mark: MLflow
        summary: Adherence, fraud-waste-abuse, prior-auth prediction and demand models, and whether they still hold six months after deployment as formularies and networks change.
        uses:
          - - Feature Store
            - Member, drug and claim features read identically in training and serving.
          - - MLflow
            - Every adherence and FWA model tracked for audit and reproduction.
          - - Model Serving
            - Adherence and anomaly models scored in the clinical and claims path.
      - name: Health App Dev
        mark: Apps
        summary: Ship the prior-auth, rebate, adherence and dispensing applications the pharmacy and PBM work in, hosted next to governed PHI.
        uses:
          - - Apps
            - Operational screens with no separate web tier to run or secure.
          - - Lakebase
            - Serverless Postgres for PA and dispensing state with governed writes.
          - - Agent Bricks
            - Agents that draft a prior-auth decision against governed tools.
