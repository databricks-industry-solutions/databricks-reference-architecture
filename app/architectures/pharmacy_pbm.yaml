  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Rebate Optimization
        short: Revenue
        icon: market
        summary: Manufacturer rebate accrual and formulary value reconciled per claim so net cost is understood before the invoice, not after.
        problem: Rebate contracts, formulary tiers and adjudicated claims sit in separate systems, so rebate leakage and net cost per client are reconstructed by hand quarters after the money moved.
        who_benefits: PBM Leadership
        how_built: Model N manufacturer settlement records and RxClaim adjudication are conformed in the lakehouse; PBM accrual and client net-cost pass-through are scored per claim in Model Serving and read in the Rebate Cockpit on certified Metric Views.
        components:
          - Rebate Cockpit
          - Model N Rebates
          - SS&C RxClaim
          - AI/BI
          - Model Serving
          - Rebate & Claims Marts
        stories:
          - title: Databricks for Healthcare and Life Sciences
            url: https://www.databricks.com/solutions/industries/healthcare-and-life-sciences
      - name: Prior Auth Automation
        short: Clinical
        icon: gavel
        summary: Prior-authorization requests triaged, evidence assembled and routine approvals drafted to cut waits toward hours rather than days.
        problem: Prior authorization is a manual, fax-and-portal process; requests queue for days while clinicians reassemble the same claims, prescriber and formulary evidence by hand.
        who_benefits: Clinical & UM
        how_built: CoverMyMeds PA requests and Surescripts data land in the lakehouse; text models classify and draft determinations in Model Serving and Agent Bricks, and the PA Assistant writes back only determinations accepted under approved policy.
        components:
          - PA Assistant
          - CoverMyMeds
          - Surescripts Rx
          - Agent Bricks
          - AI Functions
          - Model Serving
        stories:
          - title: Orizon automates claims and denials with data and AI
            url: https://www.databricks.com/customers/orizon/mosaic-ai
          - title: Databricks for Healthcare and Life Sciences
            url: https://www.databricks.com/solutions/industries/healthcare-and-life-sciences
      - name: Medication Adherence
        short: Clinical
        icon: gauge
        summary: Members scored on refill and adherence risk so outreach reaches non-adherent patients before the gap widens.
        problem: Non-adherence drives avoidable cost and worse outcomes, but the refill and claims signal that predicts it is scattered and reviewed too late to intervene.
        who_benefits: Clinical & UM
        how_built: Fill and claims history feed proportion-of-days-covered and risk models in Model Serving; the Adherence Monitor targets outreach to the members most likely to lapse.
        components:
          - Adherence Monitor
          - NCPDP Claims
          - Model Serving
          - AI/BI
          - Feature Store
        stories:
          - title: CVS Health improves medication adherence with Databricks
            url: https://www.databricks.com/customers/cvs-health
      - name: Formulary Management
        short: Clinical
        icon: sheet
        summary: Formulary tiers and coverage decisions evaluated on utilization, rebate value and clinical evidence together.
        problem: Formulary decisions weigh clinical evidence, rebate value and utilization that live in different systems, so a tier change's true net-cost effect is hard to see before it ships.
        who_benefits: Clinical & UM
        how_built: MMIT formulary status and FDB drug data are conformed with utilization and rebate on the lakehouse; scenarios are explored in AI/BI and Genie on the definitions the P&T committee reads.
        components:
          - MMIT Formulary
          - First Databank FDB
          - AI/BI
          - Unity Catalog
          - Genie One
        stories:
          - title: IQVIA and Databricks enable healthcare data collaboration
            url: https://www.databricks.com/blog/future-healthcare-relies-data-collaboration-how-iqvia-and-databricks-lakehouse-enable-better
          - title: Databricks for Healthcare and Life Sciences
            url: https://www.databricks.com/solutions/industries/healthcare-and-life-sciences
      - name: MAC & Drug Pricing
        short: Pricing
        icon: chart
        summary: MAC lists and reimbursement tuned against acquisition cost and AWP so drugs are neither underwater nor overpaid.
        problem: MAC lists drift against acquisition cost and AWP, leaving drugs underwater for pharmacies or overpaid for clients, and every list refresh is a slow manual reconciliation.
        who_benefits: Network Pricing
        how_built: FDB and Medi-Span pricing and RxClaim adjudication are conformed to Gold; MAC and reimbursement models score competitiveness in Model Serving and write updates back to the adjudication engine.
        components:
          - First Databank FDB
          - Medi-Span
          - SS&C RxClaim
          - Model Serving
          - AI/BI
          - Lakeflow
        stories:
          - title: Abacus Insights unifies healthcare data on Databricks
            url: https://www.databricks.com/customers/abacus-insights
          - title: Databricks for Healthcare and Life Sciences
            url: https://www.databricks.com/solutions/industries/healthcare-and-life-sciences
      - name: Network Performance
        short: Network
        icon: network
        summary: Pharmacy network spread, guarantee attainment and effective rate read on one certified set of definitions.
        problem: Network spread and client guarantee attainment are computed in spreadsheets from claims exports, so effective rate is known too late to renegotiate or correct.
        who_benefits: Network Pricing
        how_built: Adjudicated claims and contract terms are conformed to certified Metric Views; network spread and guarantee attainment are read in AI/BI and Genie and shared to plan sponsors.
        components:
          - SS&C RxClaim
          - AI/BI
          - Genie One
          - Unity Catalog
          - Plan Sponsor Portal
        stories:
          - title: Abacus Insights unifies healthcare data on Databricks
            url: https://www.databricks.com/customers/abacus-insights
      - name: Specialty Pharmacy
        short: Specialty
        icon: partner
        summary: Specialty patient journeys from hub enrollment through fill and adherence assembled into one view for support and outcomes.
        problem: Specialty patients move across hub, benefit verification, specialty pharmacy and clinical support systems that never meet, so enrollment stalls and adherence risk is invisible.
        who_benefits: Pharmacy Ops
        how_built: CareMetx hub, dispensing and clinical feeds are conformed on the lakehouse; adherence and abandonment models score each patient in Model Serving for proactive specialty support.
        components:
          - CareMetx Hub
          - PioneerRx
          - Model Serving
          - Lakehouse//RT
          - AI/BI
        stories:
          - title: Walgreens delivers personalized care at the point of care
            url: https://www.databricks.com/customers/walgreens
          - title: Databricks for Healthcare and Life Sciences
            url: https://www.databricks.com/solutions/industries/healthcare-and-life-sciences
      - name: Dispensing & Inventory
        short: Operations
        icon: iot
        summary: Demand forecasting and replenishment across the pharmacy network so the right drug is on the shelf without dead stock.
        problem: Out-of-stocks turn patients away while overstock ties up cash and risks expiry, and forecasts made per store miss the demand that moves across the network.
        who_benefits: Pharmacy Ops
        how_built: Dispensing, wholesaler and fill-automation feeds stream into Lakehouse//RT; demand and replenishment models in Model Serving right-size inventory and drive the dispensing queue.
        components:
          - ScriptPro Robotics
          - Parata Systems
          - Cencora Supply
          - Lakehouse//RT
          - Model Serving
          - Dispensing Queue
        stories:
          - title: Walgreens optimizes pharmacy supply chain with Databricks
            url: https://www.databricks.com/customers/walgreens
      - name: 340B Compliance
        short: Compliance
        icon: gavel
        summary: 340B eligibility, accumulation and split-billing reconciled continuously with monitored exceptions and traceable evidence for audit.
        problem: 340B eligibility, accumulation and duplicate-discount prevention span dispensing, TPA and claims feeds, so compliance is a reactive audit scramble rather than continuous monitoring.
        who_benefits: Pharmacy Ops
        how_built: Trisus and Macro Helix split-billing, dispensing and wholesaler data are conformed under Unity Catalog; eligibility and duplicate-discount checks run continuously with lineage for audit.
        components:
          - Trisus 340B
          - Macro Helix 340B
          - McKesson Supply
          - Unity Catalog
          - AI/BI
        stories:
          - title: Databricks for Healthcare and Life Sciences
            url: https://www.databricks.com/solutions/industries/healthcare-and-life-sciences
      - name: Fraud, Waste & Abuse
        short: Integrity
        icon: zshield
        summary: Claims, prescriber and pharmacy behaviour scored for fraud, waste and abuse so investigations chase the highest-value cases.
        problem: Rules engines catch known schemes but miss evolving behaviour like prescriber collusion and phantom billing, and manual review queues overwhelm special investigations with false positives.
        who_benefits: Trust & Comply
        how_built: Adjudicated claims, prescriber and pharmacy data are conformed on the lakehouse; anomaly and peer-comparison models score behaviour in Model Serving and route explainable cases to the FWA Investigator.
        components:
          - FWA Investigator
          - NCPDP Claims
          - Model Serving
          - AI Functions
          - AI/BI
          - MLflow
        stories:
          - title: Orizon reduces waste and protects patients with AI
            url: https://www.databricks.com/customers/orizon/mosaic-ai
          - title: Real-time fraud prevention on Databricks
            url: https://www.databricks.com/blog/bringing-real-time-fraud-prevention-government-benefits
medallion:
  Bronze:
    short: Raw claims and Rx feeds
    summary: NCPDP claim transactions and reversals, dispensing and e-prescribing records, manufacturer rebate contracts, 340B accumulations and wholesaler invoices, landed exactly as received so a claim or a rebate can always be replayed as it stood.
  Silver:
    short: Conformed claim, member, drug
    summary: Claims, members, prescribers and drugs resolved into single conformed entities across the adjudication, dispensing and rebate estates, with NDC, GPI and NPI reconciled and every fill stitched to member, plan and drug.
  Gold:
    short: Net cost, adherence, rebate
    summary: 'Contracted products the clinical and finance teams run on: net cost and rebate accrual per claim, medication adherence by drug and cohort, generic dispensing rate, and pharmacy network and specialty performance.'
