pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Exchange Exec
        mark: Genie One
        summary: The CEO on trading volumes, listings and market share; the CFO on transaction, listing and fee revenue against the cost of running the venue; the Chief Commercial Officer on how fee schedules and rebates are set and how listings are won.
        uses:
          - - Genie One
            - Ask what fee revenue did last quarter, or how a rebate change moved volume, without booking an analyst.
          - - AI/BI
            - Trading volume, fee and rebate revenue and listing pipeline on one certified set of Metric Views.
          - - Unity Catalog
            - One governed glossary, so "billable volume" and "captured order flow" mean one thing across the group.
        sub:
          - name: CEO
            cares: trading volumes, listings and market share.
          - name: CFO
            cares: transaction, listing and fee revenue against the cost of running the venue.
          - name: Chief Commercial Officer
            cares: fee schedules, rebates and winning new listings.
        ucs:
          - Fee & Rebate Optimization
          - Listing Prospects
          - Execution Quality Analytics
      - name: Market Ops
        mark: Lakehouse//RT
        summary: Matching-engine operators watching fill rates, message rates and gateway health; the market-quality team on spreads, depth and fairness; the reliability team on latency, jitter and plant capacity across the trading day.
        uses:
          - - Lakehouse//RT
            - Order-book, gateway and telemetry state at the latency the matching engine actually runs at.
          - - Model Serving
            - Fairness, latency-anomaly and failure models scored inside the trading day.
          - - AI/BI
            - Latency, spread, depth and message rates on the same definitions the market-quality team defends.
        sub:
          - name: Matching-engine ops
            cares: fill rates, message rates and gateway health.
          - name: Market quality
            cares: spreads, depth and execution fairness by symbol.
          - name: Reliability engineering
            cares: latency, jitter and plant capacity across the day.
        ucs:
          - Matching Engine Monitoring
          - Latency Anomaly Detection
          - System Health & Maintenance
      - name: Clearing & Membership
        mark: Model Serving
        summary: The head of clearing risk on member margin and default exposure; the membership team on member health and admissions; market operations on corporate-action processing and settlement across the trading day.
        uses:
          - - Model Serving
            - Member credit, margin and settlement-risk models scored inside the trading day.
          - - AI/BI
            - Member exposure, margin usage and fails on one certified set of Metric Views.
          - - Unity Catalog
            - Member and instrument records governed with lineage from source to margin call.
        sub:
          - name: Clearing risk
            cares: member margin, default-fund exposure and settlement risk.
          - name: Membership
            cares: member health, admissions and concentration.
          - name: Market operations
            cares: corporate-action processing and settlement across the day.
        ucs:
          - Member Credit Monitoring
          - System Health & Maintenance
          - Corporate Actions
      - name: Listings & Products
        mark: AI/BI
        summary: The head of listings on the issuer pipeline and prospect identification; the commercial team on fee schedules and rebate design; product managers on execution-quality analytics packaged for members.
        uses:
          - - AI/BI
            - Listing pipeline, fee and rebate revenue and execution-quality metrics on one certified set of Metric Views.
          - - Model Serving
            - Prospect-scoring and fee-elasticity models scored on venue activity.
          - - Unity Catalog
            - Issuer, member and instrument records governed with lineage from source to product.
        sub:
          - name: Head of listings
            cares: the issuer pipeline and prospect identification.
          - name: Commercial
            cares: fee schedules and rebate design against captured flow.
          - name: Product managers
            cares: execution-quality analytics packaged for members.
        ucs:
          - Listing Prospects
          - Corporate Actions
          - Fee & Rebate Optimization
      - name: Surveil & Integrity
        core: true
        mark: AI Functions
        summary: Market-surveillance analysts investigating spoofing, layering and manipulation across the venue's order flow; the market-integrity team on cross-venue and cross-asset abuse; the membership team on member conduct and disciplinary referrals.
        uses:
          - - AI Functions
            - Order and trade patterns screened for manipulation across the whole venue at scale.
          - - Genie One
            - Investigators ask for a member's activity around a print in plain language.
          - - Unity Catalog
            - Complete, auditable order-and-trade trails that satisfy a regulatory examination.
        sub:
          - name: Market surveillance
            cares: spoofing, layering and manipulation across order flow.
          - name: Market integrity
            cares: cross-venue and cross-asset abuse and disciplinary referrals.
          - name: Membership
            cares: member conduct and position concentration.
        ucs:
          - Manipulation Detection
          - Cross-Venue Surveillance
          - Member Credit Monitoring
  - name: Technical
    icon: code
    tiles:
      - name: Feed Engineers
        mark: Lakeflow
        summary: Capture ITCH market-data and OUCH order-entry channels, OPRA and consolidated-tape feeds through feed handlers, curate the depth and trade tables, and keep every tick feed fresh for calculation and distribution.
        uses:
          - - Lakeflow Connect
            - Managed connectors for matching-engine, reference and vendor sources.
          - - Auto Loader
            - Continuous ingestion of multicast and file feeds into Bronze with schema evolution.
          - - Lakewatch
            - Freshness on the tick and reference tables every desk and subscriber depends on.
        sub:
          - name: Ingestion Engineers
            cares: ITCH and OUCH multicast, OPRA and consolidated-tape feeds captured off the wire on time.
          - name: Pipeline Engineers
            cares: depth and trade tables conformed with expectations on every tick feed.
          - name: Platform Reliability
            cares: freshness of the tick and reference tables every desk and subscriber depends on.
      - name: Matching & Reliability Eng
        mark: MLflow
        summary: Turn matching-engine and network telemetry in Python and kdb+/q into latency, capacity and failure analytics, and own the libraries the market-quality and reliability teams run against.
        uses:
          - - Feature Store
            - Latency and telemetry features defined once and read identically in analysis and monitoring.
          - - MLflow
            - Every latency-anomaly and failure model versioned and reproducible for audit.
          - - Model Serving
            - Latency-anomaly and predictive-maintenance scores computed in the live monitoring path.
        sub:
          - name: Reliability Engineers
            cares: matching-engine and gateway telemetry turned into latency and capacity analytics.
          - name: Model Engineers
            cares: latency-anomaly and failure models versioned and reproducible for audit.
          - name: Telemetry Engineers
            cares: gateway, network and hardware telemetry conformed for monitoring.
      - name: App Developers
        mark: Apps
        summary: Ship the market-quality, feed-operations, latency and surveillance applications the venue works in, hosted next to governed data.
        uses:
          - - Apps
            - Operational screens with no separate web tier to run or secure.
          - - Lakebase
            - Serverless Postgres for case, member-limit and fee-schedule state with governed writes.
          - - Agent Bricks
            - Agents that draft a surveillance case or a feed-outage summary against governed tools.
        sub:
          - name: Full-Stack Engineers
            cares: the market-quality, feed-operations and latency screens the venue works in.
          - name: Agent Developers
            cares: agents that draft a surveillance case or feed-outage summary on governed tools.
          - name: Integration Engineers
            cares: case, member-limit and fee-schedule writeback into venue systems.
consumers:
  - name: BI & Productivity
    icon: chart
    from: bi
    simplified: 2
    tiles:
      - name: Tableau / Power BI
        icon: chart
        summary: External BI against SQL warehouses, with Unity Catalog permissions enforced end to end.
      - name: Microsoft Teams
        icon: chat
        summary: Genie in Teams for governed answers, and feed-outage and surveillance alerts in the channel operations already work in.
      - name: Notebooks & IDEs
        icon: notebook
        summary: Notebooks, VS Code and JetBrains against governed tick, reference and index data with Genie Code.
  - name: Data Distribution
    icon: partner
    tiles:
      - name: Delta Sharing Feeds
        icon: share
        summary: Tick, reference, corporate-actions and index feeds delivered to subscribers and vendors over Delta Sharing rather than file drops and FTP.
      - name: Cloud Marketplaces
        icon: market
