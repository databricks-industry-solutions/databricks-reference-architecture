          - itch
        category: Direct Market Data Feed (Depth of Book)
        what_it_is: Nasdaq's full order-by-order depth-of-book feed carrying every add, modify, cancel and execution, the raw ground truth for level 2 and level 3 market data.
        who_uses_it: Feed engineering, market quality and quant subscribers.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 1-5M messages/sec at peak
            interval: Continuous (sub-millisecond)
      - name: OPRA Options Feed
        icon: stream
        summary: 'The Options Price Reporting Authority consolidated feed: quotes and trades across every US options exchange, the industry''s highest-volume market-data stream.'
