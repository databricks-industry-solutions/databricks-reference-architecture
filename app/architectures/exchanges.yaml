name: Exchanges
description: 'Exchange and venue operators: matching-engine and gateway monitoring, latency and system-health analytics, real-time manipulation detection, cross-venue and cross-asset surveillance, execution-quality analytics, fee and rebate optimization, member credit monitoring, listing-prospect identification, and corporate-action processing.'
sources:
  - name: Trading & Matching
    icon: market
    simplified: 3
    tiles:
      - name: Nasdaq Matching
        icon: market
        summary: 'Nasdaq''s INET matching engine and marketplace technology: the order book, matching and gateway layer that is the source of every order, quote and fill on the venue.'
        citations:
          - nasdaq-inet
        category: Matching Engine / Trading Platform
        what_it_is: 'Nasdaq''s INET matching engine and marketplace technology: the order book, matching and gateway layer that is the source of every order, quote and fill on the venue.'
        who_uses_it: Matching-engine operations, market quality and trading systems teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 100k-1M order/quote/fill messages/sec at peak
            interval: Continuous (microsecond)
      - name: Deutsche Börse T7
        icon: market
        summary: 'The T7 trading platform behind Xetra and Eurex: order entry, matching and market-data generation for cash equities and derivatives.'
        citations:
          - t7
        category: Matching Engine / Trading Platform
        what_it_is: 'The T7 trading platform behind Xetra and Eurex: order entry, matching and market-data generation for cash equities and derivatives.'
        who_uses_it: Matching-engine operations, market quality and derivatives operations.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 100k-1M order/quote messages/sec at peak
            interval: Continuous (microsecond)
      - name: LSEG Millennium
        icon: market
        summary: 'MillenniumIT''s Millennium Exchange matching platform: the low-latency order book and matching engine running the trading venue.'
        citations:
          - millennium
        category: Matching Engine / Trading Platform
        what_it_is: 'MillenniumIT''s Millennium Exchange matching platform: the low-latency order book and matching engine running the trading venue.'
        who_uses_it: Matching-engine operations and market-quality teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 50k-500k order/quote messages/sec at peak
            interval: Continuous (microsecond)
      - name: CME Globex
        icon: market
        summary: 'The Globex electronic trading platform for futures and options: the source of the order, quote and trade stream for the derivatives venue.'
        citations:
          - globex
        category: Derivatives Trading Platform
        what_it_is: 'The Globex electronic trading platform for futures and options: the source of the order, quote and trade stream for the derivatives venue.'
        who_uses_it: Derivatives market operations, matching-engine ops and clearing teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 100k-1M order/quote/trade messages/sec at peak
            interval: Continuous (microsecond)
  - name: Market Data Feeds
    icon: stream
    simplified: 2
    tiles:
      - name: TotalView-ITCH
        icon: stream
        summary: 'Nasdaq''s full order-by-order depth-of-book feed: every add, modify, cancel and execution, the raw ground truth for level 2 and level 3 market data.'
