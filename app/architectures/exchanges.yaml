        category: Instrument Symbology Provider
        what_it_is: 'Bloomberg''s open symbology (FIGI): a permanent instrument identifier that stitches vendor, venue and internal symbols to one security.'
        who_uses_it: Reference-data engineering, feed engineering and data business.
        data_out:
          batch:
            types:
              - structured
            volume: GBs of symbology mappings
            interval: Daily refresh + on-demand
  - name: Venue Telemetry & Ops
    icon: gauge
    tiles:
      - name: Gateway & Matching Logs
        icon: gauge
        summary: Order-entry gateway and matching-engine telemetry, per-message timestamps, queue depths and sequence state, the ground truth for latency and fairness.
        category: Matching-Engine Telemetry
        what_it_is: Order-entry gateway and matching-engine telemetry carrying per-message timestamps, queue depths and sequence state for latency and fairness analytics.
        who_uses_it: Matching-engine operations, market quality and reliability teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 100k-1M telemetry events/sec at peak
            interval: Continuous (microsecond)
      - name: Corvil Latency Analytics
        icon: observ
        summary: Wire-level network and application latency capture across gateways and feeds, the source of nanosecond latency and jitter measurement.
        citations:
