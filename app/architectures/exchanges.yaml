          - opra
        category: Consolidated Options Data Feed
        what_it_is: The Options Price Reporting Authority consolidated feed carrying quotes and trades across every US options exchange, the industry's highest-volume market-data stream.
        who_uses_it: Feed engineering, market-data operations and subscribers.
