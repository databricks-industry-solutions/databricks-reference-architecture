  - name: Published Products
    icon: product
    tiles:
      - name: Data Products
        icon: product
        summary: Published, contracted market-data and index products discoverable in Unity Catalog Domains and shared over OpenSharing.
      - name: Sharing Recipients
        core: true
        icon: share
        summary: Subscribers, vendors and index licensees reading live tables with no copy and no egress duplication.
  - name: Databricks Apps
    icon: apps
    tiles:
      - name: Market Quality
        icon: gauge
        short: Order book health
        summary: 'The screen the market-quality team runs the venue from: spread, depth, message rates and matching latency by symbol, flagging fairness and outage risk before members notice, on Databricks Apps over Lakebase.'
      - name: Feed Ops Monitor
        icon: stream
        short: Feed dissemination
        summary: 'Live health of every disseminated feed: gap detection, sequence integrity and subscriber delivery latency, so a dropped multicast channel is caught before the support calls start.'
      - name: Latency Cockpit
        icon: chart
        short: Latency & health
        summary: Where the reliability team watches matching latency, jitter and gateway health in real time, and turns a degrading path into scheduled maintenance before members notice.
      - name: Surveillance Console
        icon: gavel
        short: Market abuse
        summary: Manipulation, spoofing and layering alerts triaged with the member's full order and print context in one investigation view, with a case trail that supports regulatory examination.
