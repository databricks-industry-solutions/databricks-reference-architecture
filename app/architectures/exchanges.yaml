  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Venue Revenue Mart
        icon: fed
        summary: The transaction, listing and fee revenue mart left where it is and queried in place under Unity Catalog, which avoids a second copy of the audited fee and rebate numbers.
        category: Revenue / Fee Data Mart
        what_it_is: The transaction, listing and fee revenue mart kept in the incumbent warehouse and queried in place, giving one audited view of fee and rebate numbers.
        who_uses_it: Finance, commercial and membership teams.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale billing + usage history
            interval: Queried on demand (federated)
  - name: Data Formats
