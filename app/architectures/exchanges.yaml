agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Market Quality & Latency Agent
        icon: genie
        summary: Ask about matching latency, spreads, depth and fairness by symbol in plain language.
        feeds:
          - Gateway & Matching Logs
          - Corvil Latency Analytics
          - Latency, quality, member, fees
        teams:
          - Market Ops
          - Matching-engine ops
          - Market quality
        questions:
          - What is our matching latency by symbol right now versus yesterday?
          - Which symbols show the widest spreads and thinnest depth today?
          - Where did message rates spike and did any gateway degrade?
          - Are there fairness concerns in fill sequencing for any symbol?
          - Which gateways are closest to capacity at peak?
      - name: Fees & Listings Agent
        icon: genie
        summary: Explore fee and rebate revenue, captured order flow, and the listing pipeline grounded in issuer research and pipeline attributes.
        feeds:
          - Venue Revenue Mart
          - Nasdaq Matching
          - Latency, quality, member, fees
        teams:
          - Exchange Exec
          - Listings & Products
          - Commercial
        questions:
          - What did fee and rebate revenue do last quarter by tier?
          - How would a rebate change move captured order flow?
          - Which members respond most to a fee-tier change?
          - Which issuers are the strongest listing prospects right now?
          - Where are we losing flow to competing venues?
      - name: Member & Clearing Risk Agent
        icon: genie
        summary: Ask about member positions, margin usage and concentration across the trading day.
        feeds:
          - Member Position Ledger
          - OCC Clearing
          - Conformed books, instruments, members
        teams:
          - Clearing & Membership
          - Clearing risk
          - Membership
        questions:
          - Which members carry the largest margin usage right now?
          - Where is member position concentration building today?
          - Which members are closest to a credit or margin limit?
          - How did member exposure move under the latest price shock?
          - Which members have the most settlement fails this week?
      - name: Surveillance & Integrity Agent
        icon: genie
        summary: Investigate manipulation and cross-venue abuse as investigation leads across accessible order and trade evidence.
        feeds:
          - Nasdaq SMARTS
          - CTA/UTP SIP
          - Conformed books, instruments, members
        teams:
          - Surveil & Integrity
          - Market surveillance
          - Market integrity
        questions:
          - Which members showed spoofing or layering patterns this week?
          - What was a member's activity around this print?
          - Which schemes span more than one market or asset class?
          - How many surveillance cases are open past their SLA?
          - Is our order and trade trail complete for the reporting period?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Execution Quality Analytics
        short: Best execution
        icon: chart
        summary: Producing execution-quality and market-quality analytics, spread, depth, fill rates and price improvement, as a product for members and regulators instead of ad-hoc reports.
        problem: Execution-quality questions are answered days later from partial exports, so members cannot see fill quality on the venue and the operator cannot evidence best execution.
        who_benefits: Exchange Exec
        how_built: ITCH, SIP and gateway events land through the Multicast Feed Bus into Lakehouse//RT; execution-quality metrics are computed to Gold and published to members over Delta Sharing Feeds and AI/BI.
        components:
          - Feed Ops Monitor
          - TotalView-ITCH
          - Lakehouse//RT
          - Delta Sharing Feeds
          - AI/BI
        stories:
          - title: Nasdaq reinvents finance with Databricks
            url: https://www.databricks.com/customers/nasdaq
          - title: 'The boom of SOON: Coinbase streaming ingestion'
            url: https://www.databricks.com/customers/coinbase/streaming
      - name: Matching Engine Monitoring
        short: Market quality
        icon: gauge
        summary: Watching matching latency, spread, depth and fill fairness by symbol so market-quality problems and gateway issues are caught in the trading day rather than in a post-mortem.
        problem: Matching-engine and gateway telemetry sits in operational logs no analytics can reach, so latency drift and fairness questions are answered days later from partial exports.
        who_benefits: Market Ops
        how_built: Gateway and matching logs stream into Lakehouse//RT; latency, spread and fairness metrics are computed to Gold and watched in the Market Quality app on the market-quality team's own definitions.
        components:
          - Market Quality
          - Gateway & Matching Logs
          - Lakehouse//RT
          - Nasdaq Matching
          - AI/BI
        stories:
          - title: Nasdaq reinvents finance with Databricks
            url: https://www.databricks.com/customers/nasdaq
          - title: Modernizing investment data platforms
            url: https://www.databricks.com/blog/2021/01/29/strategies-for-modernizing-investment-data-platforms.html
      - name: Fee & Rebate Optimization
        short: Pricing
        icon: market
        summary: Modeling how fee schedules and rebate tiers move captured order flow and revenue so pricing changes are simulated on real volume before they go live.
        problem: Fee and rebate changes are set from spreadsheets and gut feel, so the venue cannot see how a tier change will move flow and revenue until after members react.
        who_benefits: Exchange Exec
        how_built: Transaction, volume and fee data are conformed to Gold against the venue revenue mart; elasticity and what-if models are scored in Model Serving and read in AI/BI before a schedule change.
        components:
          - Venue Revenue Mart
          - Model Serving
          - AI/BI
          - Nasdaq Matching
          - Unity Catalog
        stories:
          - title: Nasdaq reinvents finance with Databricks
            url: https://www.databricks.com/customers/nasdaq
      - name: Manipulation Detection
        short: Market abuse
        icon: gavel
        summary: Detecting spoofing, layering, wash trades and momentum ignition across the venue's order flow in real time, with an audit trail and completeness that supports a regulatory examination.
        problem: Surveillance runs in a vendor silo with gappy data and end-of-day batches, so spoofing and layering are seen too late, alerts are noisy, and completeness cannot be proven to an examiner.
        who_benefits: Surveil & Integrity
        how_built: Orders, executions and messages are unified in Lakehouse//RT with Unity Catalog completeness checks; detectors and AI Functions score manipulation patterns and cases open in the Surveillance Console.
        components:
          - Surveillance Console
          - Nasdaq SMARTS
          - AI Functions
          - Model Serving
          - Lakehouse//RT
        stories:
          - title: 'FINRA: predictive fraud detection at scale'
            url: https://www.databricks.com/blog/2019/06/05/customer-spotlight-finra.html
          - title: Real-time fraud detection at Coinbase
            url: https://www.databricks.com/customers/coinbase/lakeflow
      - name: Listing Prospects
        short: Listings
        icon: product
        summary: Identifying companies and issuers likely to list or cross-list from market activity, sector momentum, issuer research and listing-pipeline attributes so the listings team reaches prospects before competitors.
        problem: The listings team works from manual research and relationships, so timely prospects, cross-listing candidates and at-risk issuers are missed and the pipeline stays thin.
        who_benefits: Listings & Products
        how_built: Market activity, sector and reference data are conformed in the lakehouse; prospect-scoring models and Agent Bricks rank candidates read in AI/BI and Genie.
        components:
          - Agent Bricks
          - AI/BI
          - Genie
          - Bloomberg FIGI
          - Unity Catalog
        stories:
          - title: Nasdaq reinvents finance with Databricks
            url: https://www.databricks.com/customers/nasdaq
      - name: Member Credit Monitoring
        short: Member risk
        icon: gauge
        summary: Monitoring member positions, margin and concentration across the trading day so venue credit exposure is seen intraday, while CCP-owned margin and default decisions remain with the clearing house under integrated-clearing scope.
        problem: Member position and margin state lives across clearing and membership systems reconciled in batch, so credit exposure and concentration surface late when a default is expensive.
        who_benefits: Clearing & Membership
        how_built: Member position, margin and clearing feeds are conformed to Gold; credit and concentration models are scored in Model Serving and watched in AI/BI intraday.
        components:
          - Member Position Ledger
          - OCC Clearing
          - Model Serving
          - AI/BI
          - Lakehouse//RT
      - name: Corporate Actions
        short: Reference
        icon: cdc
        summary: Ingesting and normalising dividends, splits, mergers and re-organisations, applying them to instruments and producing position-impact outputs handed to authoritative clearing and settlement systems so downstream feeds stay correct.
        problem: Corporate actions arrive from many sources in incompatible formats and must be applied point-in-time; a missed split or wrong ex-date silently corrupts prices, positions and member feeds.
        who_benefits: Clearing & Membership
        how_built: SIX and vendor corporate-actions feeds are ingested with Lakeflow and versioned as slowly-changing records in Delta Lake, applied to instruments under Unity Catalog lineage so history is replayable.
        components:
          - SIX Reference Data
          - Bloomberg FIGI
          - Lakeflow
          - Delta Lake
          - Unity Catalog
        stories:
          - title: Investment management reference architecture
            url: https://www.databricks.com/resources/architectures/financial-services-investment-management-reference-architecture
          - title: Modernizing investment data platforms
            url: https://www.databricks.com/blog/2021/01/29/strategies-for-modernizing-investment-data-platforms.html
      - name: Cross-Venue Surveillance
        short: Cross-venue
        icon: network
        summary: Correlating orders and trades across the venue's own markets and external venues and asset classes so manipulation that spans books and products is detected, not just single-symbol abuse.
        problem: Surveillance runs per market and per asset class, so cross-venue and cross-asset schemes, spoofing in one book to move another, slip through the gaps between siloed systems.
        who_benefits: Surveil & Integrity
        how_built: Order and trade trails across markets and external feeds are conformed under FIGI and ISIN instrument identity with LEI resolving legal entities in Unity Catalog; cross-market detectors and AI Functions score public market context and available participant-level trails in the Surveillance Console.
        components:
          - Surveillance Console
          - Nasdaq SMARTS
          - GLEIF LEI
          - AI Functions
          - Unity Catalog
        stories:
          - title: 'FINRA: predictive fraud detection at scale'
            url: https://www.databricks.com/blog/2019/06/05/customer-spotlight-finra.html
      - name: System Health & Maintenance
        short: Reliability
        icon: iot
        summary: Predicting matching-engine, gateway and data-center failures from telemetry before they degrade the venue, turning outages into scheduled maintenance.
        problem: Plant failures surface as live outages during the trading day, and the gateway, network and hardware telemetry that would have warned earlier sits unused in operational logs.
        who_benefits: Market Ops
        how_built: Gateway, network and hardware telemetry stream into Lakehouse//RT; remaining-life and anomaly models tracked in MLflow score in Model Serving and raise work before the plant degrades.
        components:
          - Colocation & Hardware
          - Corvil Latency Analytics
          - Model Serving
          - MLflow
          - Lakehouse//RT
        stories:
          - title: Nasdaq reinvents finance with Databricks
            url: https://www.databricks.com/customers/nasdaq
      - name: Latency Anomaly Detection
        short: Latency
        icon: observ
        summary: Detecting latency, jitter and message-rate anomalies across gateways and feeds in real time so a degrading path is caught before members notice and fairness is preserved.
        problem: Latency drift and gateway degradation are found from member complaints or post-mortems, so members experience unfair or slow execution before the operator sees the problem.
        who_benefits: Market Ops
        how_built: Corvil and gateway telemetry stream into Lakehouse//RT; latency-anomaly models score in Model Serving and surface to the Latency Cockpit and AI/BI in real time.
        components:
          - Latency Cockpit
          - Corvil Latency Analytics
          - Gateway & Matching Logs
          - Model Serving
          - AI/BI
        stories:
          - title: Modernizing investment data platforms
            url: https://www.databricks.com/blog/2021/01/29/strategies-for-modernizing-investment-data-platforms.html
medallion:
  Bronze:
    short: Raw feeds and messages
    summary: ITCH market-data and OUCH order-entry messages, OPRA and consolidated-tape ticks, matching-engine gateway and latency telemetry, corporate-actions announcements and member position and margin files, landed exactly as received so a print or a quote can always be replayed as it stood.
  Silver:
    short: Conformed books, instruments, members
    summary: Order books, executions, instruments and member positions resolved into single conformed entities across the matching, telemetry and clearing estates, with FIGI, ISIN and LEI identifiers reconciled and every print stitched to one security.
  Gold:
    short: Latency, quality, member, fees
    summary: 'Contracted products the venue and risk teams run on: matching latency and fairness by symbol, quote and trade quality, member margin and concentration, and fee and rebate revenue by tier.'
