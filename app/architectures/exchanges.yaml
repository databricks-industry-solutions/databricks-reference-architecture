        category: Network Latency Analytics
        what_it_is: Corvil wire-level network and application latency capture across gateways and feeds for nanosecond latency and jitter measurement.
        who_uses_it: Network engineering, market quality and reliability teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: high-rate latency metrics
            interval: Continuous (nanosecond)
      - name: Member Position Ledger
        icon: db
        summary: Member order, position and margin state across the trading day, the basis for member credit and position monitoring.
        category: Member Position & Margin Ledger
        what_it_is: Member order, position and margin state across the trading day, the basis for member credit and position monitoring.
        who_uses_it: Clearing risk, membership and market operations.
        data_out:
          batch:
            types:
              - structured
            volume: GBs of member positions + margin/day
            interval: Intraday + end-of-day
      - name: Colocation & Hardware
        icon: iot
        summary: Data-center, server and network hardware telemetry for the trading plant, feeding capacity and predictive-maintenance analytics.
        category: Data-Center / Hardware Telemetry
        what_it_is: Data-center, server and network hardware telemetry for the trading plant, feeding capacity and predictive-maintenance analytics.
        who_uses_it: Site reliability, data-center operations and capacity planning.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 10-100k hardware metrics/sec
            interval: Continuous telemetry
  - name: Surveillance & Clearing
    icon: gavel
    simplified: 2
    tiles:
      - name: Nasdaq SMARTS
        icon: gavel
        summary: 'Nasdaq''s SMARTS market-surveillance platform: cross-market alerts for manipulation, spoofing and abuse against the venue''s order flow.'
        citations:
          - smarts
        category: Market Surveillance Platform
        what_it_is: Nasdaq's SMARTS market-surveillance platform generating cross-market alerts for manipulation, spoofing and abuse against the venue's order flow.
        who_uses_it: Market surveillance, market integrity and compliance analysts.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: GBs of alerts + cases/day
            interval: Intraday + end-of-day
      - name: OCC Clearing
        icon: partner
        summary: 'The Options Clearing Corporation: clearing, margin and settlement for listed options and futures, the source of cleared-position and margin state.'
