          - Captured flow
          - Listing pipeline
          - Market share
        teams:
          - Exchange Exec
          - Listings & Products
          - Commercial
      - name: Clearing & Member Risk
        icon: aibi
        summary: Member margin, position concentration and settlement fails.
        kpis:
          - Member margin
          - Position concentration
          - Settlement fails
          - Default-fund coverage (integrated clearing)
          - Limit breaches
