agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Portfolio & Performance Agent
        icon: genie
        summary: Ask about returns, attribution and exposure across every book in plain language.
        feeds:
          - BlackRock Aladdin
          - Security Master
          - MSCI Barra
          - Conformed trades, positions, instruments
        teams:
          - CIO & Portfolio Mgmt
          - Portfolio managers
          - Quant Research
        questions:
          - What did each book return last quarter, and what drove attribution?
          - What is our current factor exposure across the whole portfolio?
          - Which positions contribute most to tracking error against mandate?
          - How has allocation shifted across asset classes this year?
          - Which holdings breach a concentration or mandate limit?
      - name: Execution & TCA Agent
        icon: genie
        summary: Explore slippage, venue performance and transaction cost against benchmark.
        feeds:
          - FIX Gateways
          - FlexTrade EMS
          - Bloomberg B-PIPE
          - P&L, risk, TCA, exposure
        teams:
          - Trading Desks
          - Execution traders
          - Desk heads
        questions:
          - What was our implementation shortfall by desk this week?
          - Which venues delivered the best fill quality for large orders?
          - How does slippage compare against arrival-price benchmark by asset class?
          - Which algos are underperforming on market impact right now?
          - Where are we paying the most in spread by symbol?
      - name: Portfolio Risk Agent
        icon: genie
        summary: Ask about VaR, stress, tracking error and factor exposure across books.
        feeds:
          - MSCI RiskMetrics
          - Bloomberg PORT
          - MSCI Barra
          - P&L, risk, TCA, exposure
        teams:
          - Risk Management
          - Chief Risk Officer
          - Market risk
        questions:
          - What is our firm-wide VaR today, and the trend this month?
          - How does the book behave under a rates +200bp stress scenario?
          - Which books carry the largest ex-ante tracking error against mandate?
          - Which positions are closest to a mandate or risk-budget breach?
          - What are our largest factor sensitivities across the portfolio?
      - name: Surveillance & Compliance Agent
        icon: genie
        summary: Investigate manipulation and screen KYC, suitability and reporting completeness across investors and trades.
        feeds:
          - FIX Gateways
          - DTCC
          - Conformed trades, positions, instruments
        teams:
          - Compliance & Surveil
          - Surveillance
          - Regulatory reporting
        questions:
          - Which traders showed spoofing-like order patterns this week?
          - Which investors are overdue a KYC or suitability refresh?
          - Which alert types have the worst false-positive rate?
          - How many surveillance or onboarding cases are open past their SLA?
          - Is our order and trade data complete for the reporting period?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Portfolio Construction
        short: Optimization
        icon: network
        summary: Turning signals, factor views and constraints into optimal target weights, so the book that reaches the desk reflects the mandate, risk budget and transaction cost rather than a spreadsheet override.
        problem: Construction runs in a desktop optimizer disconnected from live positions, factor risk and cost, so target weights ignore real constraints and the rebalance is reworked by hand before it trades.
        who_benefits: Quant Research
        how_built: Positions, factor exposures and cost estimates are conformed against one security master; optimal weights are computed with MSCI Barra and Model Serving and read in the Quant Research Lab under mandate constraints.
        components:
          - Quant Research Lab
          - MSCI Barra
          - Model Serving
          - Feature Store
          - BlackRock Aladdin
        stories:
          - title: Jefferies modernizes equity research with agentic analytics
            url: https://www.databricks.com/blog/jefferies-modernizes-equity-research-scale-databricks-and-agentic-analytics
          - title: Investment management reference architecture
            url: https://www.databricks.com/resources/architectures/financial-services-investment-management-reference-architecture
      - name: TCA & Best Execution
        short: Execution
        icon: market
        summary: Measuring slippage, venue performance and market impact against benchmark so execution improves and best-execution review is evidenced for clients and regulators.
        problem: Execution cost is measured in spreadsheets days after the fill, so venue and algo choices are never corrected while they still matter, and best execution is asserted rather than shown.
        who_benefits: Trading Desks
        how_built: FIX order and execution events are joined to market data in the lakehouse; slippage and venue analytics are computed to Gold and explored in the TCA Workbench on the desk's own definitions.
        components:
          - TCA Workbench
          - FIX Gateways
          - Bloomberg B-PIPE
          - AI/BI
          - Lakehouse//RT
        stories:
          - title: Investment management reference architecture
            url: https://www.databricks.com/resources/architectures/financial-services-investment-management-reference-architecture
      - name: Portfolio Risk
        short: VaR & stress
        icon: gauge
        summary: VaR, ex-ante tracking error, stress and factor sensitivities across every book, re-run intraday instead of waiting for an overnight batch that is stale by the open.
        problem: Portfolio risk is aggregated overnight from custodian and vendor extracts that never reconcile, so a shock is seen the next morning and mandate or risk-budget breaches are explained after the loss.
        who_benefits: Risk Management
        how_built: MSCI RiskMetrics and Bloomberg PORT analytics and position feeds are conformed to Gold; VaR, stress and tracking-error models are scored in Model Serving and read in the Risk Cockpit and AI/BI.
        components:
          - Risk Cockpit
          - MSCI RiskMetrics
          - Model Serving
          - MSCI Barra
          - AI/BI
        stories:
          - title: S&P Global unifies data intelligence
            url: https://www.databricks.com/customers/sp-global
          - title: MCP-powered financial AI workflows on Databricks
            url: https://www.databricks.com/blog/mcp-powered-financial-ai-workflows-databricks
      - name: Trade Surveillance
        short: Market abuse
        icon: gavel
        summary: Detecting spoofing, layering, wash trades and insider patterns across orders, executions and communications, with evidence and lineage that support regulatory examination.
        problem: Surveillance runs across siloed vendor systems with gappy data, so alerts are noisy, investigations are slow, and completeness cannot be proven to an examiner.
        who_benefits: Compliance & Surveil
        how_built: Orders, executions and comms are unified in the lakehouse with pipeline completeness checks and Unity Catalog lineage; detectors and AI Functions score patterns and cases open in the Surveillance Console.
        components:
          - Surveillance Console
          - AI Functions
          - Unity Catalog
          - Model Serving
          - Lakehouse//RT
        stories:
          - title: 'FINRA: predictive fraud detection at scale'
            url: https://www.databricks.com/blog/2019/06/05/customer-spotlight-finra.html
          - title: Coinbase scales real-time security
            url: https://www.databricks.com/customers/coinbase/lakeflow
      - name: Management Reporting
        short: FP&A
        icon: chart
        summary: Firm and fund management reporting, AUM, net flows, fee revenue and cost, produced from one governed source so the executive committee reads the same numbers finance closes on.
        problem: Management reporting is rebuilt each period from custodian, OMS and finance extracts that never agree, so AUM, flows and fee numbers differ across decks and the close is a manual reconciliation under deadline.
        who_benefits: CIO & Portfolio Mgmt
        how_built: AUM, flow, fee and cost data are conformed against the investment book of record; management metrics are served to certified Metric Views the executive committee reads in AI/BI and Genie One.
        components:
          - Investment BoR (IBOR)
          - AI/BI
          - Genie One
          - Data Products
          - BlackRock Aladdin
        stories:
          - title: S&P Global unifies data intelligence
            url: https://www.databricks.com/customers/sp-global
      - name: Alt-Data Alpha
        short: Alternative data
        icon: aisvc
        summary: Turning satellite, card, web and sentiment data into signals mapped to portfolio exposures before the edge is arbitraged away.
        problem: Alternative datasets arrive in dozens of formats and decay fast, and by the time they are cleaned and joined to positions the alpha is already gone.
        who_benefits: Quant Research
        how_built: Alternative datasets are ingested and standardised in the lakehouse and joined to holdings; signals are engineered in Feature Store and mapped to exposures with Agent Bricks.
        components:
          - Vendor Data APIs
          - Feature Store
          - Agent Bricks
          - FactSet
          - MLflow
        stories:
          - title: Jefferies modernizes equity research with agentic analytics
            url: https://www.databricks.com/blog/jefferies-modernizes-equity-research-scale-databricks-and-agentic-analytics
          - title: Nasdaq reinvents finance with Databricks
            url: https://www.databricks.com/customers/nasdaq
      - name: Regulatory Reporting
        short: Reporting
        icon: gavel
        summary: Producing applicable MiFID II, CAT, EMIR and transaction reports from the same governed data the firm trades on, under direct or delegated filing responsibility.
        problem: Regulatory reports are assembled from reconciled extracts under deadline, so late fixes and re-submissions are routine and lineage back to the source is hard to prove.
        who_benefits: Compliance & Surveil
        how_built: Trade, order and reference data are conformed to Gold with Unity Catalog lineage; MiFID II and CAT submissions are generated and filed from contracted products with a full audit trail.
        components:
          - Regulatory Reporting
          - Unity Catalog
          - MiFID II / CAT Filings
          - DTCC
          - FIX Gateways
        stories:
          - title: 'FINRA: predictive fraud detection at scale'
            url: https://www.databricks.com/blog/2019/06/05/customer-spotlight-finra.html
          - title: Nasdaq reinvents finance with Databricks
            url: https://www.databricks.com/customers/nasdaq
      - name: NAV & Reconciliation
        short: Breaks
        icon: cdc
        summary: Reconciling positions, cash and transactions across the IBOR, custodian and fund accountant so pre-NAV breaks are caught against the latest available snapshots rather than surfacing when the fund strikes its price.
        problem: Positions, cash and prices are reconciled in batch against the custodian and administrator, so breaks surface at NAV strike when they are expensive to resolve and threaten a late or restated price.
        who_benefits: Trading Desks
        how_built: FIX fills, DTCC confirms and daily custodian feeds land in the lakehouse; matching runs against the latest available custody and administrator snapshots, and fund operations resolve pre-NAV position and cash exceptions against the investment book of record before the fund strikes.
        components:
          - FIX Gateways
          - DTCC
          - Custodian Feeds
          - Investment BoR (IBOR)
          - Lakeflow
        stories:
          - title: Investment management reference architecture
            url: https://www.databricks.com/resources/architectures/financial-services-investment-management-reference-architecture
      - name: KYC & Suitability
        short: Onboarding
        icon: identity
        summary: Screening investors and mandates for KYC, AML and suitability so onboarding and ongoing monitoring run against one governed record instead of scattered documents and vendor checks.
        problem: KYC, sanctions and suitability checks live across onboarding tools, vendor screening and spreadsheets, so investor risk is re-keyed, refreshes are missed, and an examiner cannot see one complete file.
        who_benefits: Compliance & Surveil
        how_built: Investor, mandate and screening data are conformed under Unity Catalog; AI Functions resolve entities and flag suitability and sanctions exceptions to the Alert & Case Queue with a full audit trail.
        components:
          - AI Functions
          - Unity Catalog
          - Alert & Case Queue
          - Model Serving
          - Genie One
        stories:
          - title: 'FINRA: predictive fraud detection at scale'
            url: https://www.databricks.com/blog/2019/06/05/customer-spotlight-finra.html
      - name: Investor Reporting
        short: Client reporting
        icon: share
        summary: Producing accurate, timely performance, holdings and risk reports for investors and allocators from one governed source instead of a reporting team's spreadsheets.
        problem: Investor reports are rebuilt each period from extracts and manual checks, so they are late, inconsistent between clients, and expensive to audit.
        who_benefits: CIO & Portfolio Mgmt
        how_built: Performance, holdings and risk are served from certified Gold products; statements and allocator packs are generated and shared over Delta Sharing and governed apps.
        components:
          - Data Products
          - Sharing Recipients
          - AI/BI
          - Investment BoR (IBOR)
          - Genie One
        stories:
          - title: Nasdaq reinvents finance with Databricks
            url: https://www.databricks.com/customers/nasdaq
          - title: MCP-powered financial AI workflows on Databricks
            url: https://www.databricks.com/blog/mcp-powered-financial-ai-workflows-databricks
medallion:
  Bronze:
    short: Raw trade and market feeds
    summary: FIX order and execution messages, Bloomberg and LSEG market-data ticks, position and risk extracts from Aladdin and Charles River, and DTCC confirms, landed exactly as received so a fill or a price can always be replayed as it stood.
  Silver:
    short: Conformed trades, positions, instruments
    summary: Orders, executions, positions and instruments resolved into single conformed entities across the OMS, risk and custody estates, with the security master and legal-entity identifiers reconciled and trades stitched to one lifecycle.
  Gold:
    short: P&L, risk, TCA, exposure
    summary: 'Contracted products the desk, risk and compliance teams run on: P&L and attribution by book, VaR and exposure by factor and counterparty, transaction cost against benchmark, and regulatory positions.'
