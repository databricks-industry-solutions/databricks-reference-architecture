name: Capital Markets (Buy-Side)
description: 'Asset and investment managers: alternative-data alpha, portfolio construction and optimization, transaction cost analysis and best execution, portfolio risk, NAV and reconciliation, investor reporting, trade surveillance, KYC and suitability, and regulatory reporting across the investment book of record.'
sources:
  - name: Order & Execution
    icon: market
    tiles:
      - name: BlackRock Aladdin
        icon: erp
        summary: Portfolio, order and risk platform holding positions, exposures and the book of record across the investment process.
        citations:
          - aladdin
        category: Portfolio & Risk Management Platform
        what_it_is: Holds positions, exposures and the book of record across the investment process, combining portfolio management, order flow and risk in one platform.
        who_uses_it: Portfolio managers, risk teams and investment operations.
        data_out:
          batch:
            types:
              - structured
            volume: 20-80 GB/day positions + exposures
            interval: Daily + intraday snapshots
          stream:
            types:
              - semi-structured
            volume: hundreds of position events/sec
            interval: Continuous CDC
      - name: Charles River IMS
        icon: market
        summary: 'State Street''s investment management system: orders, allocations, compliance rules and positions, the buy-side system of record for the order lifecycle.'
        citations:
          - charles-river
        category: Investment Management System (OMS)
        what_it_is: 'State Street''s buy-side investment and order management system: the system of record for the order lifecycle, allocations, compliance rules and positions.'
        who_uses_it: Portfolio managers, buy-side traders and investment operations.
        data_out:
          batch:
            types:
              - structured
            volume: 10-40 GB/day positions + orders
            interval: End-of-day batch
          stream:
            types:
              - semi-structured
            volume: hundreds of order events/sec
            interval: Continuous CDC (near real-time)
      - name: Bloomberg AIM
        icon: market
        summary: Buy-side order and investment management, trade capture and compliance feeding executions and positions into the estate.
        citations:
          - bloomberg-aim
        category: Buy-Side Order Management System
        what_it_is: 'Bloomberg''s Asset & Investment Manager: buy-side order and investment management, trade capture and compliance feeding executions and positions into the estate.'
        who_uses_it: Buy-side traders, portfolio managers and compliance.
        data_out:
          batch:
            types:
              - structured
            volume: 5-20 GB/day positions
            interval: End-of-day batch
          stream:
            types:
              - semi-structured
            volume: hundreds of order/execution events/sec
            interval: Continuous CDC
      - name: FlexTrade EMS
        core: true
        icon: stream
        summary: 'Multi-asset execution management: smart order routing, algo wheels and venue connectivity, the source of the child-order and fill stream.'
        citations:
          - flextrade
        category: Execution Management System (EMS)
        what_it_is: Multi-asset execution management with smart order routing, algo wheels and venue connectivity, the source of the child-order and fill stream.
        who_uses_it: Execution traders and desk heads.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 1-10k child orders + fills/sec at peak
            interval: Continuous (sub-second)
  - name: Market & Reference Data
    icon: market
    tiles:
      - name: Bloomberg B-PIPE
        icon: market
        summary: 'Consolidated real-time market-data feed: prices, quotes and corporate actions across venues and asset classes.'
        citations:
          - bloomberg-bpipe
        category: Consolidated Market Data Feed
        what_it_is: Bloomberg's consolidated real-time market-data feed carrying prices, quotes and corporate actions across venues and asset classes.
        who_uses_it: Trading desks, quant research and market-data engineering.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 50k-500k ticks/sec at peak
            interval: Continuous streaming
      - name: LSEG Refinitiv
        icon: market
        summary: Real-time and historical pricing, tick history, fundamentals and reference data feeding valuation and analytics.
        citations:
          - refinitiv
        category: Market Data & Analytics Platform
        what_it_is: Real-time and historical pricing, tick history, fundamentals and reference data feeding valuation and analytics.
        who_uses_it: Trading desks, quant research and valuation teams.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale tick history
            interval: Daily history loads
          stream:
            types:
              - semi-structured
            volume: 10k-100k ticks/sec
            interval: Continuous streaming
      - name: ICE Data Services
        icon: market
        summary: Evaluated pricing, reference data and end-of-day feeds for fixed income and cross-asset valuation.
        citations:
          - ice-data
        category: Evaluated Pricing & Reference Data
        what_it_is: Evaluated pricing, reference data and end-of-day feeds for fixed income and cross-asset valuation.
        who_uses_it: Valuation, fixed-income desks and risk teams.
        data_out:
          batch:
            types:
              - structured
            volume: 5-20 GB/day evaluated prices
            interval: End-of-day + intraday snaps
      - name: Security Master
        core: true
        icon: db
        summary: 'The golden instrument and issuer record: identifiers, terms and corporate actions every position and trade resolves against.'
        category: Security Master / Reference Data
        what_it_is: The golden instrument and issuer record holding identifiers, terms and corporate actions that every position and trade resolves against.
        who_uses_it: Reference-data engineers, operations and every downstream desk.
        data_out:
          batch:
            types:
              - structured
            volume: GBs of reference + corporate actions
            interval: Daily refresh + intraday updates
  - name: Risk & Pricing
    icon: gauge
    tiles:
      - name: MSCI RiskMetrics
        icon: gauge
        summary: 'Multi-asset market-risk analytics: VaR, expected shortfall and stress across books, the buy-side firm''s ex-ante risk engine.'
        citations:
          - msci-risk
        category: Market Risk & VaR Analytics
        what_it_is: MSCI RiskMetrics multi-asset market-risk analytics providing VaR, expected shortfall and stress across books.
        who_uses_it: Market risk, portfolio managers and product control.
        data_out:
          batch:
            types:
              - structured
            volume: 5-20 GB/day risk + scenarios
            interval: Daily + scenario runs
      - name: Bloomberg PORT
        icon: gauge
        summary: 'Portfolio and risk analytics: performance attribution, ex-ante tracking error and scenario analysis across multi-asset books.'
        citations:
          - bloomberg-port
        category: Portfolio Risk & Attribution Analytics
        what_it_is: Bloomberg's portfolio and risk analytics providing attribution, ex-ante tracking error and scenario analysis across multi-asset books.
        who_uses_it: Portfolio managers, performance and risk teams.
        data_out:
          batch:
            types:
              - structured
            volume: 5-15 GB/day risk + attribution
            interval: Daily + intraday snapshots
      - name: MSCI Barra
        icon: chart
        summary: 'Multi-asset factor models and risk analytics: factor exposures, attribution and portfolio risk decomposition.'
        citations:
          - msci-barra
        category: Factor Risk Model Library
        what_it_is: 'Multi-asset factor models and risk analytics: factor exposures, attribution and portfolio risk decomposition.'
        who_uses_it: Quant research, risk and portfolio managers.
        data_out:
          batch:
            types:
              - structured
            volume: GBs of factor exposures + models
            interval: Daily / monthly refresh
      - name: Numerix
        icon: market
        summary: Derivatives pricing and analytics library for structured products, curves and Monte Carlo valuation.
        citations:
          - numerix
        category: Derivatives Pricing & Analytics Library
        what_it_is: Derivatives pricing and analytics library for structured products, curves and Monte Carlo valuation.
        who_uses_it: Quant developers, structuring and valuation teams.
        data_out:
          batch:
            types:
              - structured
            volume: GBs of curves + valuations
            interval: On demand + end-of-day
  - name: Post-Trade & Custody
    icon: partner
    tiles:
      - name: DTCC
        icon: partner
        summary: 'Central clearing, settlement and trade-confirmation infrastructure: matched trades, affirmations and settlement status.'
        citations:
          - dtcc
        category: Clearing & Settlement Utility
        what_it_is: Central clearing, settlement and trade-confirmation infrastructure carrying matched trades, affirmations and settlement status.
        who_uses_it: Post-trade operations, settlements and clearing teams.
        data_out:
          batch:
            types:
              - structured
            volume: 5-25 GB/day confirms + settlement
            interval: Multiple settlement cycles daily
          stream:
            types:
              - semi-structured
            volume: tens of status events/sec
            interval: Continuous status flow
      - name: SWIFT Network
        icon: stream
        summary: Interbank messaging for settlement, confirmations and custody instructions across counterparties and agents.
        citations:
          - swift
        category: Interbank Messaging Network
        what_it_is: Interbank messaging for settlement, confirmations and custody instructions across counterparties and agents.
        who_uses_it: Settlements, custody operations and treasury.
        data_out:
          stream:
            types:
              - semi-structured
            volume: tens-hundreds of messages/sec
            interval: Continuous message flow
      - name: FIX Gateways
        icon: api
        summary: The FIX order and execution message bus with venues, brokers and counterparties, the ground truth for orders and fills.
        citations:
          - fix
        category: Order Routing Protocol Gateway
        what_it_is: The FIX order and execution message bus with venues, brokers and counterparties, the ground truth for orders and fills.
        who_uses_it: Execution traders, desk operations and market-data engineering.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 1-10k order/exec messages/sec at peak
            interval: Continuous (sub-second)
      - name: Custodian Feeds
        core: true
        icon: db
        summary: Position, cash and settlement records from the custodian, reconciled against the internal book of record.
        category: Custodian Book of Record
        what_it_is: Position, cash and settlement records from the custodian, reconciled against the internal book of record.
        who_uses_it: Investment operations, reconciliation and fund accounting.
        data_out:
          batch:
            types:
              - structured
            volume: 1-10 GB/day positions + cash
            interval: Daily custodian files
  - name: Analytics & ESG Data
    icon: chart
    tiles:
      - name: FactSet
        icon: chart
        summary: Fundamentals, estimates, ownership and analytics feeding research, screening and portfolio analysis.
        citations:
          - factset
        category: Financial Data & Analytics Platform
        what_it_is: Fundamentals, estimates, ownership and analytics feeding research, screening and portfolio analysis.
        who_uses_it: Research analysts, quant research and portfolio managers.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day fundamentals + estimates
            interval: Daily feed
      - name: MSCI ESG Ratings
        icon: gavel
        summary: ESG ratings, controversies and carbon metrics scored against issuers for sustainable-investing mandates.
        citations:
          - msci-esg
        category: ESG Ratings Provider
        what_it_is: ESG ratings, controversies and carbon metrics scored against issuers for sustainable-investing mandates.
        who_uses_it: ESG research, portfolio managers and client reporting.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: GBs of ratings + controversies
            interval: Monthly + on-demand
      - name: Sustainalytics
        icon: gavel
        summary: Morningstar Sustainalytics ESG risk ratings and controversy research joined to holdings for mandate screening.
        citations:
          - sustainalytics
        category: ESG Ratings Provider
        what_it_is: Morningstar Sustainalytics ESG risk ratings and controversy research joined to holdings for mandate screening.
        who_uses_it: ESG research, compliance and portfolio managers.
        data_out:
          batch:
            types:
              - structured
            volume: GBs of ESG risk ratings
            interval: Monthly refresh
      - name: Morningstar Direct
        icon: chart
        summary: Fund, index and managed-investment data with performance and holdings for cross-fund analysis and reporting.
        citations:
          - morningstar
        category: Investment Research & Data Platform
        what_it_is: Fund, index and managed-investment data with performance and holdings for cross-fund analysis and reporting.
        who_uses_it: Research, product and client reporting teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-3 GB/day fund + holdings data
            interval: Daily feed
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Investment BoR (IBOR)
        icon: fed
        summary: Portfolio accounting and the investment book of record left where they are and queried in place under Unity Catalog, which avoids a second copy of the audited positions.
        category: Investment Book of Record (IBOR)
        what_it_is: Portfolio accounting and the investment book of record kept in the incumbent system and queried in place, giving one audited view of positions and cash.
        who_uses_it: Investment operations, fund accounting and finance.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale historical positions
            interval: Queried on demand (federated)
  - name: Data Formats
    icon: zbraces
    simplified: 2
    tiles:
      - name: 'FIX'
        icon: zbraces
        fmt: 'FIX'
        summary: 'Financial Information eXchange protocol for real-time order routing and trade execution.'
        spec_url: https://www.fixtrading.org/standards/fix-protocol/
      - name: 'FpML'
        icon: zbraces
        fmt: 'FpML'
        summary: 'Financial products Markup Language for OTC derivatives trade and lifecycle data.'
        spec_url: https://www.fpml.org/
        spark_connector: 'spark-xml'
        spark_repo: https://github.com/databricks/spark-xml
        databricks_resource: https://docs.databricks.com/aws/en/query/formats/xml
        source_systems:
          - 'Murex'
          - 'Calypso'
          - 'DTCC'
      - name: 'ISO 20022'
        icon: zbraces
        fmt: '20022'
        summary: 'Next-generation financial messaging for payments, securities and reporting.'
        spec_url: https://www.iso20022.org/
      - name: 'CDM'
        icon: zbraces
        fmt: 'CDM'
        summary: 'ISDA/FINOS Common Domain Model, a machine-readable model of trades and lifecycle events.'
        spec_url: https://www.finos.org/common-domain-model
