pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: CIO & Portfolio Mgmt
        mark: Genie One
        summary: The CIO on total portfolio return, allocation and tracking error against mandate; portfolio managers on positioning, attribution and rebalancing; the head of asset allocation on the strategic mix across asset classes and regions.
        uses:
          - - Genie One
            - Ask what a book returned, or what drove attribution last quarter, without waiting on an analyst.
          - - AI/BI
            - Return, attribution, exposure and tracking error on one certified set of Metric Views.
          - - Unity Catalog
            - One governed security master and glossary, so "exposure" and "return" mean one thing across the firm.
        sub:
          - name: CIO
            cares: total portfolio return, allocation and tracking error against mandate.
          - name: Portfolio managers
            cares: positioning, attribution and rebalancing across books.
          - name: Asset allocation
            cares: the strategic mix across asset classes and regions.
        ucs:
          - Portfolio Construction
          - Management Reporting
          - Investor Reporting
      - name: Trading Desks
        mark: Lakehouse//RT
        summary: Desk heads on execution quality, venue routing and desk P&L; equity and FICC traders working orders against liquidity; execution traders proving best execution and analysing transaction cost after the fill.
        uses:
          - - Lakehouse//RT
            - Order, execution and market state at the latency a desk actually trades at.
          - - Model Serving
            - Execution and venue models scored inside the routing decision.
          - - AI/BI
            - TCA, slippage and fill quality on the same definitions the desk defends.
        sub:
          - name: Desk heads
            cares: execution quality, venue routing and desk P&L.
          - name: Equity & FICC traders
            cares: working orders against available liquidity.
          - name: Execution traders
            cares: best execution and post-trade transaction cost.
        ucs:
          - TCA & Best Execution
          - NAV & Reconciliation
          - Portfolio Risk
      - name: Risk Management
        core: true
        mark: AI/BI
        summary: The CRO and market risk on VaR, stress and limit usage across books; credit risk on counterparty and issuer exposure; liquidity risk on funding and margin under stress.
        uses:
          - - AI/BI
            - VaR, exposure and limit usage across every book on certified Metric Views.
          - - Model Serving
            - Stress, VaR and counterparty models scored on demand rather than overnight.
          - - Unity Catalog
            - Governed, auditable risk numbers with lineage from feed to report.
        sub:
          - name: Chief Risk Officer
            cares: VaR, stress and limit usage across the firm.
          - name: Market risk
            cares: exposure and sensitivities by book and factor.
          - name: Credit risk
            cares: counterparty and issuer exposure under stress.
        ucs:
          - Portfolio Risk
          - Regulatory Reporting
          - NAV & Reconciliation
      - name: Quant Research
        mark: MLflow
        summary: Quant researchers building and testing alpha signals; the portfolio construction team turning signals into positions under constraints; the alpha research team mining alternative data for edge before it decays.
        uses:
          - - Feature Store
            - Signals and factors defined once and read identically in research and production.
          - - MLflow
            - Every backtest and model run tracked for audit and reproduction.
          - - Model Serving
            - Signals and optimisation scored in the live investment path.
        sub:
          - name: Quant researchers
            cares: alpha signals, factor models and regime detection.
          - name: Portfolio construction
            cares: turning signals into positions under constraints.
          - name: Alpha research
            cares: mining alternative data for edge before it decays.
        ucs:
          - Alt-Data Alpha
          - Portfolio Construction
          - Portfolio Risk
      - name: Compliance & Surveil
        mark: AI Functions
        summary: Trade surveillance analysts investigating manipulation and spoofing alerts; compliance officers on restricted lists and personal-account dealing; the regulatory reporting team filing MiFID II, CAT and transaction reports on time.
        uses:
          - - AI Functions
            - Communications and trade data screened for manipulation patterns at scale.
          - - Genie One
            - Investigators ask for a trader's activity around an event in plain language.
          - - Unity Catalog
            - Audit trails and lineage that satisfy a regulatory examination.
        sub:
          - name: Surveillance
            cares: manipulation, spoofing and wash-trade investigations.
          - name: Compliance officers
            cares: restricted lists and personal-account dealing.
          - name: Regulatory reporting
            cares: MiFID II, CAT and transaction reporting on time.
        ucs:
          - Trade Surveillance
          - Regulatory Reporting
          - KYC & Suitability
  - name: Technical
    icon: code
    tiles:
      - name: Quant Developers
        mark: MLflow
        summary: Turn research notebooks in Python, R and kdb+/q into production signals and backtests, and own the libraries the desk and PMs run against.
        uses:
          - - Notebooks & IDEs
            - Python, R and VS Code against governed tick and reference data.
          - - MLflow
            - Backtests and models versioned, tracked and reproducible for audit.
          - - Feature Store
            - Factor and signal libraries shared across research and production.
        sub:
          - name: Signal Developers
            cares: research notebooks turned into production signals the desk trades on.
          - name: Backtest Engineers
            cares: reproducible backtests and versioned models for audit.
          - name: Quant Library Owners
            cares: the factor and pricing libraries PMs and the desk run against.
      - name: Market Data Engineers
        mark: Lakeflow
        summary: Land Bloomberg B-PIPE, LSEG and ICE feeds and FIX order flow, curate the security master, and keep tick and reference tables fresh for every desk.
        uses:
          - - Lakeflow Connect
            - Managed connectors for market-data, OMS and custody sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on price and reference feeds.
          - - Lakewatch
            - Freshness on the tick and reference tables the desks open at the bell.
        sub:
          - name: Ingestion Engineers
            cares: Bloomberg, LSEG and ICE feeds and FIX order flow landed on time.
          - name: Pipeline Engineers
            cares: Bronze-to-Silver conforming and expectations on price and reference feeds.
          - name: Platform Reliability
            cares: freshness of the tick and reference tables the desks open at the bell.
      - name: Risk Systems Engineers
        mark: Model Serving
        summary: Wire MSCI RiskMetrics and Bloomberg PORT valuations, Monte Carlo VaR and stress engines into governed pipelines so risk numbers are timely, explainable and reproducible.
        uses:
          - - Model Serving
            - VaR, stress and pricing models scored on demand at book scale.
          - - Apache Spark
            - Distributed Monte Carlo and revaluation across the full position set.
          - - Unity Catalog
            - Lineage from raw feed to reported risk number for the regulator.
        sub:
          - name: Risk Platform Engineers
            cares: pricing and valuation engines wired into governed pipelines.
          - name: Compute Engineers
            cares: distributed Monte Carlo VaR and revaluation across the full position set.
          - name: Model Ops
            cares: risk numbers timely, explainable and reproducible for the regulator.
