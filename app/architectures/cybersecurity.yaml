pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Security Leadership
        mark: Genie One
        summary: The CISO on aggregate risk posture, board-level cyber exposure and the cost and coverage of the security programme; the deputy CISO and SecOps director on detection coverage against MITRE ATT&CK, mean-time-to-respond and the economics of log retention.
        uses:
          - - Genie One
            - Ask what the current risk posture and open critical incidents are without booking analyst time.
          - - AI/BI
            - Detection coverage, MTTD and MTTR, and SIEM spend on one certified set of Metric Views.
          - - Unity Catalog
            - Governance and the security glossary, so "critical incident" and "coverage" mean one thing across the programme.
        sub:
          - name: CISO
            cares: aggregate risk posture, board reporting and cyber exposure.
          - name: Deputy CISO
            cares: detection coverage, control effectiveness and programme maturity.
          - name: SecOps Director
            cares: SOC throughput, mean-time-to-respond and retention economics.
        ucs:
          - Threat Detection
          - Security Lakehouse
          - Compliance Reporting
      - name: SOC & Response
        mark: Lakehouse//RT
        summary: Tier-1 and tier-2 SOC analysts triaging alerts against a shrinking clock, incident responders containing active intrusions, and on-call leads running the bridge when a confirmed breach is in progress.
        uses:
          - - SOC Triage Console
            - The alert, its full entity context and the recommended action on one screen before an analyst escalates.
          - - Lakehouse//RT
            - Endpoint, identity and network events at the latency an intrusion moves at.
          - - Model Serving
            - Alert-scoring and deduplication models scored inline so the queue is ordered by real risk.
        sub:
          - name: Tier-1 analysts
            cares: first-pass triage and false-positive suppression.
          - name: Tier-2 analysts
            cares: deeper correlation and escalation decisions.
          - name: Incident responders
            cares: containment, eradication and recovery on active intrusions.
        ucs:
          - Threat Detection
          - Alert Triage & Dedup
          - Incident Forensics
          - Phishing & BEC Defense
      - name: Threat Intelligence
        mark: AI/BI
        summary: Threat intel analysts curating adversary tradecraft and indicators, and threat hunters forming hypotheses and pivoting across months of telemetry to find what no rule fired on.
        uses:
          - - Threat Hunt Workbench
            - Hypothesis-driven hunts across the full-fidelity history rather than a two-week index.
          - - Genie
            - Plain-English pivots across petabytes so a hunt is not gated on SPL fluency.
          - - AI/BI
            - Campaign, indicator and coverage views on governed data.
        sub:
          - name: Threat intel analysts
            cares: adversary profiling, indicator curation and prioritisation.
          - name: Threat hunters
            cares: hypothesis-driven hunting across long-horizon telemetry.
        ucs:
          - Threat Hunting
          - Threat Detection
          - Vulnerability Triage
      - name: GRC & Compliance
        mark: Unity Catalog
        summary: Governance, risk and compliance teams evidencing controls to auditors, insider-risk analysts investigating anomalous user behaviour, and risk owners prioritising the vulnerabilities that actually matter to the business.
        uses:
          - - Unity Catalog
            - Lineage, access controls and control evidence produced from the same governed tables the SOC runs on.
          - - AI/BI
            - Compliance coverage, insider-risk scores and exposure by control framework.
          - - Genie One
            - Ask which controls lack evidence this quarter without a manual audit pull.
        sub:
          - name: Compliance analysts
            cares: control evidence and framework coverage (SOC 2, PCI, NIST).
          - name: Insider-risk analysts
            cares: anomalous user and privileged-access behaviour.
          - name: Risk owners
            cares: risk-based vulnerability and exposure prioritisation.
        ucs:
          - Compliance Reporting
          - Insider Risk & UEBA
          - Vulnerability Triage
      - name: Detection Engineering
        core: true
        mark: Model Serving
        summary: Detection engineers who write, test and ship detection content as code, and content developers who tune rules against false positives and keep coverage mapped to the ATT&CK matrix.
        uses:
          - - Detection Studio
            - Detections authored, backtested against history and shipped through CI/CD.
          - - Model Serving
            - Behavioural and anomaly models scored alongside rule-based detections.
          - - Unity Catalog
            - Versioned, governed detection content with lineage from rule to alert.
        sub:
          - name: Detection engineers
            cares: detection-as-code authoring, testing and deployment.
          - name: Content developers
            cares: false-positive tuning and ATT&CK coverage mapping.
        ucs:
          - Detection-as-Code
          - Phishing & BEC Defense
          - Alert Triage & Dedup
  - name: Technical
    icon: code
    tiles:
      - name: Detection Engineers
        mark: Lakeflow
        summary: Write detections as code in Sigma, SQL and Python notebooks, backtest them against historical telemetry, and manage the rule library through Git and CI/CD instead of hand-editing SIEM consoles.
        uses:
          - - Genie Code
            - Draft and refine detections and translate hunt questions into SQL against governed tables.
          - - Lakeflow
            - Streaming and batch detection pipelines with expectations on every security feed.
          - - Unity Catalog
            - Versioned detection content with lineage from rule change to alert.
      - name: Sec Data Engineers
        mark: Lakeflow
        summary: Land Splunk, EDR, identity and network feeds, normalise them to OCSF with Auto Loader and Lakeflow, and own the Bronze-to-Silver path and the pager when a security pipeline stalls.
        uses:
          - - Lakeflow Connect
            - Managed connectors for SIEM, EDR, identity and SaaS security sources.
          - - Auto Loader
            - Incremental ingestion of high-volume log files into OCSF-conformed tables.
          - - Lakeflow
            - Declarative pipelines with expectations on endpoint, identity and network feeds.
      - name: Threat Hunters
        mark: AI/BI
        summary: Form hypotheses from ATT&CK tradecraft and Corelight and Zeek evidence, pivot across months of telemetry in notebooks, and turn confirmed findings into new detection content.
        uses:
          - - Genie
            - Natural-language pivots across full-fidelity history without SPL or KQL fluency.
          - - AI/BI
            - Hunt findings, indicator overlaps and coverage gaps on governed data.
          - - Model Serving
            - Anomaly and entity-risk models scored to surface hunt leads.
