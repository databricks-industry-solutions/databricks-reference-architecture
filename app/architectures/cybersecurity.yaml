      - name: Threat Hunt Workbench
        icon: observ
        short: Hunting queries
        summary: Where hunters form a hypothesis and pivot across months of full-fidelity telemetry in plain English, turning a confirmed finding into new detection content in the same session.
      - name: Detection Studio
        icon: code
