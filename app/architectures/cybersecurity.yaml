      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: SOC Operations Agent
        icon: genie
        summary: Ask about open incidents, alert quality and response times in plain language.
        feeds:
          - Splunk Enterprise
          - CrowdStrike Falcon
          - Cortex XSOAR
          - Detections, risk, MTTR
        teams:
          - SOC & Response
          - Security Leadership
          - Detection Engineering
        questions:
          - How many open critical incidents do we have right now?
          - What is mean-time-to-detect and respond this week?
          - Which alert types have the worst false-positive rate?
          - Which hosts have the most unresolved detections?
          - What is the alert backlog past SLA by tier?
      - name: Threat Hunting Agent
        icon: genie
        summary: Pivot across full-fidelity telemetry and threat intel to find what no rule fired on.
        feeds:
          - Corelight NDR
          - Chronicle SecOps
          - Mandiant Threat Intel
          - Conformed entities & OCSF
        teams:
          - Threat Intelligence
          - Threat Hunters
          - SOC & Response
        questions:
          - Which entities match indicators from the latest campaign?
          - Where do we see lateral movement across identities this month?
          - Which hosts beaconed to rare external destinations?
          - Which ATT&CK techniques have no detection coverage?
          - Which internal assets contacted known-bad infrastructure?
      - name: Identity & Insider Risk Agent
        icon: genie
        summary: Explore identity anomalies, privileged access and entity risk across the estate.
        feeds:
          - Okta Identity Cloud
          - Microsoft Entra ID
          - CyberArk PAM
          - Enterprise Audit Marts
        teams:
          - GRC & Compliance
          - SOC & Response
          - Security Leadership
        questions:
          - Which users show anomalous access versus their baseline?
          - Which privileged accounts checked out secrets off-hours?
          - Where did impossible-travel sign-ins occur this week?
          - Which leavers still have active entitlements?
          - Which identities have the highest entity-risk score?
      - name: Exposure & Compliance Agent
        icon: genie
        summary: Answer vulnerability exposure and control-coverage questions across frameworks.
        feeds:
          - Tenable Nessus
          - Qualys VMDR
          - Wiz CNAPP
          - Detections, risk, MTTR
        teams:
          - GRC & Compliance
          - Security Leadership
          - Detection Engineering
        questions:
          - Which exploitable vulnerabilities sit on business-critical assets?
          - What is our patch-SLA compliance by asset class?
          - Which controls lack evidence for the current audit cycle?
          - Which cloud misconfigurations are exposed to the internet?
          - How has overall exposure risk trended this quarter?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Threat Detection
        short: Correlation
        icon: zshield
        summary: Correlating endpoint, identity, network and cloud signals into high-fidelity detections mapped to MITRE ATT&CK, across full-fidelity history rather than a truncated index.
        problem: Signals scattered across a dozen point tools and a two-week SIEM index mean multi-stage attacks are only correlated after the fact, once the retention window has already dropped the earliest evidence.
        who_benefits: SOC & Response
        how_built: Endpoint, identity and network telemetry land in Lakehouse//RT normalised to OCSF; detections mapped to ATT&CK are scored in Model Serving and surfaced to the SOC Triage Console.
        components:
          - SOC Triage Console
          - Lakehouse//RT
          - Splunk Enterprise
          - CrowdStrike Falcon
          - Model Serving
        stories:
          - title: 'Barracuda: real-time threat detection, 75% lower cost'
            url: https://www.databricks.com/customers/barracuda-networks/cybersecurity
          - title: Building the future of security with NAB and Lakewatch
            url: https://www.databricks.com/blog/building-future-security-nab-lakewatch
      - name: Alert Triage & Dedup
        short: Triage
        icon: gauge
        summary: Deduplicating and scoring the alert flood so analysts work a queue ordered by real risk instead of drowning in near-duplicate, low-context tickets.
        problem: 'Alert volume outruns analyst capacity: near-duplicate alerts from overlapping tools flood the queue, real incidents wait behind noise, and burnout drives inconsistent triage.'
        who_benefits: SOC & Response
        how_built: Alerts are conformed and clustered in the lakehouse; a scoring and deduplication model in Model Serving orders the queue, and the result reaches analysts through the SOC Triage Console and Alert Dashboards.
        components:
          - SOC Triage Console
          - Model Serving
          - Cortex XSOAR
          - Lakehouse//RT
          - Alert Dashboards
        stories:
          - title: Barracuda makes security logs conversational with Genie
            url: https://www.databricks.com/blog/barracuda-makes-security-logs-conversational-genie
          - title: 'Lakewatch: the open security lakehouse for the AI era'
            url: https://www.databricks.com/product/lakewatch
      - name: Threat Hunting
        short: Proactive
        icon: observ
        summary: Hypothesis-driven hunting across months of full-fidelity telemetry to find the tradecraft no rule fired on, in plain English rather than gated on query-language fluency.
        problem: Hunting stops at the SIEM's retention wall and the analyst's SPL fluency; the long, quiet campaigns that matter most live in exactly the history that was aged out to save cost.
        who_benefits: Threat Intelligence
        how_built: Full-fidelity telemetry is retained in Delta Lake; hunters pivot in plain English through Genie on the Threat Hunt Workbench and turn confirmed findings into new detections.
        components:
          - Threat Hunt Workbench
          - Genie
          - AI/BI
          - Corelight NDR
          - Delta Lake
        stories:
          - title: NAB hunts at scale on the open security lakehouse
            url: https://www.databricks.com/blog/building-future-security-nab-lakewatch
          - title: 'Lakewatch: AI-driven hunting on the lakehouse'
            url: https://www.databricks.com/product/lakewatch
      - name: Phishing & BEC Defense
        short: Email threat
        icon: chat
        summary: Detecting phishing and business email compromise from behavioural signals across email, identity and message content rather than static rules and blocklists.
        problem: Socially engineered email and account-takeover BEC evade signature and rule-based filters, and the behavioural signal needed to catch them spans email, identity and history that legacy filters never see together.
        who_benefits: Detection Engineering
        how_built: Email, identity and content signals are joined in the lakehouse; behaviour models trained with Feature Store and tracked in MLflow score each message through Model Serving alongside Defender signals.
        components:
          - Model Serving
          - Microsoft Defender XDR
          - Feature Store
          - MLflow
          - Detection Studio
        stories:
          - title: Abnormal Security scales behavioural email AI on Databricks
            url: https://www.databricks.com/customers/abnormal
      - name: Insider Risk & UEBA
        short: Behaviour
        icon: people
        summary: User and entity behaviour analytics that baseline normal activity and flag anomalous access, exfiltration and privilege misuse before it becomes a breach.
        problem: Insider threat and account misuse look like ordinary activity one event at a time; the anomaly only appears when identity, access and data-movement history are baselined together, which siloed tools cannot do.
        who_benefits: GRC & Compliance
        how_built: Identity, privileged-access and audit signals are conformed and joined with Enterprise Audit Marts; UEBA models in Model Serving score entity risk against learned baselines with governance in Unity Catalog.
        components:
          - Model Serving
          - Okta Identity Cloud
          - CyberArk PAM
          - Feature Store
          - Enterprise Audit Marts
        stories:
          - title: Atlassian modernises threat detection on a security lakehouse
            url: https://www.databricks.com/customers/atlassian/security-lakehouse
      - name: Vulnerability Triage
        short: Exposure
        icon: gauge
        summary: Ranking vulnerabilities by exploitability, asset criticality and active-threat context so scarce remediation effort goes to the exposures an adversary would actually use.
        problem: Scanners return more critical findings than any team can patch, and raw CVSS scores ignore whether an asset is exposed, business-critical, or being actively exploited right now.
        who_benefits: GRC & Compliance
        how_built: Tenable and Qualys findings are joined to asset criticality and threat-intel exploitability in the lakehouse; a risk model in AI/BI and Model Serving ranks exposures in the Exposure Manager.
        components:
          - Exposure Manager
          - Tenable Nessus
          - Qualys VMDR
          - AI/BI
          - Model Serving
        stories:
          - title: 'VulnWatch: AI-Enhanced Prioritization of Vulnerabilities'
            url: https://www.databricks.com/blog/vulnwatch-ai-enhanced-prioritization-vulnerabilities
      - name: Incident Forensics
        short: Response
        icon: zshield
        summary: Reconstructing an intrusion end to end from full-fidelity history, and driving containment into the response tools without leaving the investigation.
        problem: When a breach is confirmed, responders need the full timeline across every tool, but the earliest evidence has usually aged out of the SIEM and stitching it back together by hand costs the hours that matter most.
        who_benefits: SOC & Response
        how_built: Full-fidelity endpoint and network evidence is queried from Delta Lake; the timeline is assembled in the SOC Triage Console with Genie, and containment is written back through EDR Host Isolation.
        components:
          - SOC Triage Console
          - Corelight NDR
          - Delta Lake
          - Genie
          - EDR Host Isolation
        stories:
          - title: 'Atlassian: long-horizon investigations on the lakehouse'
            url: https://www.databricks.com/customers/atlassian/security-lakehouse
          - title: Barracuda delivers alerts with full context in minutes
            url: https://www.databricks.com/customers/barracuda-networks/cybersecurity
      - name: Detection-as-Code
        short: Engineering
        icon: code
        summary: Treating detections as version-controlled, tested and CI/CD-deployed software, with coverage mapped to MITRE ATT&CK and every rule backtested against real history.
        problem: Detections hand-edited in SIEM consoles drift, go untested and leave silent coverage gaps; there is no peer review, no backtest against history and no map of what the estate can and cannot see.
        who_benefits: Detection Engineering
        how_built: Detections are authored in Detection Studio as Sigma, SQL and notebook code, backtested against Delta history, governed in Unity Catalog, and shipped through Detection CI/CD.
        components:
          - Detection Studio
          - Detection CI/CD
          - Sigma Rule Sync
          - Unity Catalog
          - Genie Code
        stories:
          - title: 'Databricks announces Lakewatch: detection-as-code, agentic SIEM'
            url: https://www.databricks.com/blog/databricks-announces-lakewatch-new-agentic-siem
          - title: 'Barracuda: detection rules managed and deployed automatically'
            url: https://www.databricks.com/customers/barracuda-networks/cybersecurity
      - name: Compliance Reporting
        short: Governance
        icon: gavel
        summary: Producing control coverage and audit evidence for SOC 2, PCI DSS and NIST from the same governed tables the SOC runs on, rather than a separate reporting scramble.
        problem: Compliance evidence is reassembled by hand each cycle from tools the auditors cannot see into, and proving who accessed sensitive security data means bolt-on instrumentation the SIEM never captured.
        who_benefits: GRC & Compliance
        how_built: Control coverage and access evidence are produced from governed Gold tables with lineage and immutable audit logs in Unity Catalog, and surfaced through AI/BI and Compliance Reporting.
        components:
          - Unity Catalog
          - AI/BI
          - Compliance Reporting
          - Audit Evidence
          - Regulatory Filings
        stories:
          - title: 'Barracuda: governed audit trail covers SOC 2 with Genie'
            url: https://www.databricks.com/blog/barracuda-makes-security-logs-conversational-genie
      - name: Security Lakehouse
        short: SIEM cost & tiering
        icon: lakehouse
        summary: Retaining full-fidelity telemetry in open formats at cloud-commodity cost, tiering logs by source and value, and querying years of history instead of dropping data to fit a SIEM budget.
        problem: Per-gigabyte SIEM ingestion pricing forces teams to drop logs, shorten retention and ignore unstructured data, so detection and investigation run on incomplete evidence chosen by budget rather than risk.
        who_benefits: Security Leadership
        how_built: All telemetry lands in the Lakehouse in open Delta and Iceberg tables with Auto Loader and Lakeflow, normalised to the OCSF event schema, retained cheaply and governed in Unity Catalog, with analytical query compute billed on query alongside separate ingestion, transformation and scoring costs.
        components:
          - Lakehouse
          - Unity Catalog
          - Delta Lake
          - Lakeflow
          - Auto Loader
        stories:
          - title: 'Atlassian: 80% reduction in ingestion overhead'
            url: https://www.databricks.com/customers/atlassian/security-lakehouse
          - title: 'Lakewatch: retain 100% of telemetry, no SIEM tax'
            url: https://www.databricks.com/blog/databricks-announces-lakewatch-new-agentic-siem
medallion:
  Bronze:
    short: Raw security telemetry
    summary: Endpoint, identity, network, cloud-audit and SIEM logs from CrowdStrike, Splunk, Okta and dozens of sources, landed exactly as received in open Delta and Iceberg tables so any alert can be replayed against full-fidelity history rather than a truncated retention window.
  Silver:
    short: Conformed entities & OCSF
    summary: Users, hosts, identities and assets resolved into single conformed entities across the endpoint, identity and network estates, normalised to the Open Cybersecurity Schema Framework and enriched with threat-intel indicators and MITRE ATT&CK technique tags.
  Gold:
    short: Detections, risk, MTTR
    summary: 'Contracted products the SOC and GRC teams run on: high-fidelity detections mapped to MITRE ATT&CK, entity risk scores, mean-time-to-detect and respond, and compliance coverage measured by control framework.'
