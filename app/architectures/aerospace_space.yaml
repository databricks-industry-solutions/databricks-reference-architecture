name: Aerospace & Space
description: 'Aerospace & defense OEMs and MRO providers: PLM and the digital thread, MES with in-line FOD and quality, supply chain, MRO turnaround and fleet reliability, workforce safety, satellite telemetry and earned-value program control.'
sources:
  - name: PLM & Engineering
    icon: dev
    simplified: 3
    tiles:
      - name: CATIA / 3DEXPERIENCE
        icon: dev
        summary: 'Dassault Systèmes design and MBSE backbone: the system of record for CAD, requirements and the model-based definition of the vehicle.'
        citations:
          - catia
        category: CAD / MBSE Platform
        what_it_is: System of record for CAD geometry, requirements and the model-based definition of the vehicle across the digital thread.
        who_uses_it: Systems engineering, design and MBSE teams.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: GBs (CAD + MBSE models)
            interval: On design release
      - name: Siemens Teamcenter
        core: true
        icon: erp
        summary: PLM for BOM, requirements, change orders and configuration management where Teamcenter is the incumbent digital thread.
        citations:
          - teamcenter
        category: PLM System
        what_it_is: Manages BOM, requirements, change orders and configuration management as the incumbent digital thread.
        who_uses_it: Configuration management, engineering and Change control.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 5-20 GB/day
            interval: On change release + nightly
      - name: PTC Windchill
        icon: dev
        summary: Product lifecycle management for design data, change control and the as-designed configuration on programs standardised on Windchill.
        citations:
          - windchill
        category: PLM System
        what_it_is: Holds design data, change control and the as-designed configuration on programs standardized on Windchill.
        who_uses_it: Design engineering, configuration management and Change control.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: On change release + nightly
      - name: Ansys Simulation
        icon: compute
        summary: Structural, thermal and CFD simulation results and reduced-order models validated against physical test.
        citations:
          - ansys
        category: Engineering Simulation (CAE)
        what_it_is: Produces structural, thermal and CFD simulation results and reduced-order models validated against physical test.
        who_uses_it: Simulation and analysis engineers and Design reviews.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: GBs-TBs per study
            interval: Per simulation run
  - name: Manufacturing & ERP
    icon: erp
    simplified: 2
    tiles:
      - name: Siemens Opcenter MES
        icon: compute
        summary: 'Manufacturing execution: electronic work instructions, as-built records, genealogy and in-line quality on the pulse line.'
        citations:
          - opcenter
        category: Manufacturing Execution System (MES)
        what_it_is: Executes electronic work instructions and captures as-built records, genealogy and in-line quality on the pulse line.
        who_uses_it: Production, assembly operators and Manufacturing engineering.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 500-5k events/sec
            interval: Continuous station events
      - name: DELMIA Apriso
        icon: compute
        summary: MES for production, quality and traceability across discrete aerostructures and assembly where Apriso is the incumbent.
        citations:
          - apriso
        category: Manufacturing Execution System (MES)
        what_it_is: Runs production, quality and traceability across discrete aerostructures and assembly where Apriso is the incumbent MES.
        who_uses_it: Production, quality and Traceability teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds of events/sec
            interval: Continuous production events
      - name: SAP S/4HANA
        core: true
        icon: erp
        summary: The ERP of record for procurement, inventory, production orders and finance across the aerospace and space business.
        citations:
          - sap
        category: Enterprise ERP
        what_it_is: System of record for procurement, inventory, production orders and finance across the aerospace and space business.
        who_uses_it: Procurement, production planning and Finance.
        data_out:
          batch:
            types:
              - structured
            volume: 20-80 GB/day
            interval: Nightly batch + hourly deltas
      - name: Fastmarkets Commodity Prices
        icon: market
        summary: Titanium, aluminium, nickel-alloy and composite commodity prices and market indices that inform should-cost, procurement and supply-chain risk.
        category: Commodities & Market Data
        what_it_is: External commodity price benchmarks for aerospace metals and composites and market indices used for should-cost estimation, procurement and supplier risk exposure.
        who_uses_it: Procurement, program finance and Supply chain.
        data_out:
          batch:
            types:
              - structured
            volume: MBs-GBs/day price feeds
            interval: Intraday to daily benchmarks
      - name: AVEVA PI Historian
        icon: iot
        summary: 'Process and test historian: equipment, engine and test-stand time-series underpinning SPC, OEE and anomaly detection.'
        citations:
          - avevapi
        category: Process / Time-Series Historian
        what_it_is: Stores equipment, engine and test-stand time-series underpinning SPC, OEE and anomaly detection.
        who_uses_it: Reliability engineering, test engineering and Data science.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 10-100k tags/sec
            interval: Continuous historian stream
  - name: Program & EVM
    icon: sheet
    tiles:
      - name: Deltek Cobra EVM
        icon: sheet
        summary: 'Earned-value management: the cost and schedule performance baseline, control accounts and variance the customer contract is measured against.'
        citations:
          - cobra
        category: Earned Value Management (EVM) System
        what_it_is: Holds the cost and schedule performance baseline, control accounts and variance the customer contract is measured against.
        who_uses_it: Program controls, project controllers and Program directors.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/cycle
            interval: Weekly + monthly reporting cycles
      - name: Oracle Primavera P6
        core: true
        icon: sheet
        summary: 'Integrated master schedule: activities, critical path and resource loading across the program and its suppliers.'
        citations:
          - primavera
        category: Project Scheduling (IMS)
        what_it_is: 'Maintains the integrated master schedule: activities, critical path and resource loading across the program and suppliers.'
        who_uses_it: Program schedulers, planners and Program directors.
        data_out:
          batch:
            types:
              - structured
            volume: GBs (schedule data)
            interval: Weekly schedule updates
      - name: Deltek Costpoint
        icon: erp
        summary: Government-contracting ERP for project accounting, timekeeping and DCAA-compliant cost tracking on defense and space programs.
        citations:
          - costpoint
        category: Government-Contracting ERP
        what_it_is: Runs project accounting, timekeeping and DCAA-compliant cost tracking on defense and space programs.
        who_uses_it: Program finance, project accounting and Contracts.
        data_out:
          batch:
            types:
              - structured
            volume: 5-20 GB/day
            interval: Nightly batch
  - name: Satellite & Ground
    icon: stream
    tiles:
      - name: Kratos OpenSpace
        icon: stream
        summary: 'Software-defined satellite ground system: telemetry, tracking and command and the orchestration of the ground segment.'
        citations:
          - kratos
        category: Satellite Ground System (TT&C)
        what_it_is: Software-defined ground system carrying telemetry, tracking and command and orchestrating the ground segment.
        who_uses_it: Mission operations, ground segment and Satellite controllers.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 1-50k frames/sec per pass
            interval: Continuous during contacts
      - name: Ansys STK
        icon: globe
        summary: 'Systems Tool Kit: orbit, coverage and mission analysis, the reference for where a satellite is and what it can see.'
        citations:
          - stk
        category: Mission Analysis / Orbit Modeling
        what_it_is: Computes orbit, coverage and mission analysis, the reference for where a satellite is and what it can see.
        who_uses_it: Mission analysts, flight dynamics and Mission planning.
        data_out:
          batch:
            types:
              - structured
            volume: GBs (ephemeris + analysis)
            interval: Per analysis run + scheduled
      - name: CCSDS Telemetry
        icon: stream
        summary: Space-standard telemetry and command frames from the spacecraft, decommutated on arrival and landed as structured events.
        citations:
          - ccsds
        category: Spacecraft Telemetry (CCSDS)
        what_it_is: Space-standard telemetry and command frames from the spacecraft, decommutated on arrival and landed as structured events.
        who_uses_it: Mission operations, spacecraft engineering and Anomaly response.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 10-100k params/sec per pass
            interval: Continuous during contacts
      - name: GMV Ground Segment
        icon: network
        summary: Flight dynamics and satellite control ground software feeding orbit, health and manoeuvre state into the estate.
        citations:
          - gmv
        category: Flight Dynamics / Ground Software
        what_it_is: Flight dynamics and satellite control ground software feeding orbit, health and manoeuvre state into the estate.
        who_uses_it: Flight dynamics, mission operations and Constellation ops.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds of events/sec
            interval: Continuous ground-segment state
  - name: MRO & Reliability
    icon: orch
    tiles:
      - name: IFS Maintenix
        icon: orch
        summary: 'Aviation maintenance of record: work orders, component lifing, service bulletins and the reliability history against each serial.'
        citations:
          - maintenix
        category: Aviation MRO / M&E System
        what_it_is: Maintenance of record for work orders, component lifing, service bulletins and reliability history against each serial.
        who_uses_it: Fleet reliability, maintenance planning and MRO operations.
        data_out:
          batch:
            types:
              - structured
            volume: 2-8 GB/day
            interval: Nightly + hourly deltas
      - name: Engine Health Monitor
        icon: iot
        summary: 'On-wing engine condition monitoring: vibration, temperature and performance parameters streamed from the delivered fleet.'
        category: Engine Condition Monitoring
        what_it_is: 'On-wing engine condition monitoring: vibration, temperature and performance parameters streamed from the delivered fleet.'
        who_uses_it: Fleet reliability, engine engineering and Data science.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 1-20k params/sec (fleet)
            interval: Continuous in-flight telemetry
      - name: Test & Flight Data
        core: true
        icon: iot
        summary: Flight-test, DFDR and test-stand instrumentation, the ground truth for qualification, reliability and anomaly investigation.
        category: Test & Flight Instrumentation
        what_it_is: Flight-test, DFDR and test-stand instrumentation, the ground truth for qualification, reliability and anomaly investigation.
        who_uses_it: Flight test, test engineering and Reliability engineering.
        data_out:
          stream:
            types:
              - semi-structured
              - unstructured
            volume: TBs per test campaign
            interval: High-rate during test + batch
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: EVM & Cost Marts
        icon: fed
        summary: Historical earned-value, cost and program marts left where they are and queried in place under Unity Catalog, which avoids a second copy of the audited numbers.
        category: Enterprise Data Warehouse
        what_it_is: Historical earned-value, cost and program marts kept in the incumbent warehouse and queried in place through federation, avoiding a second copy of the audited numbers.
        who_uses_it: Program finance, controls and Executive reporting.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale historical marts
            interval: Queried on demand (federated)
  - name: Data Formats
    icon: zbraces
    tiles:
      - name: 'ARINC 429'
        icon: zbraces
        fmt: '429'
        summary: 'Avionics data bus standard for digital information transfer between aircraft systems.'
        spec_url: https://www.aviation-ia.com/product-categories/arinc-standards
      - name: 'CCSDS Telemetry'
        core: true
        icon: zbraces
        fmt: 'TM'
        summary: 'CCSDS space packet telemetry standard for downlinking spacecraft data.'
        spec_url: https://ccsds.org/Pubs/102x0b5s.pdf
      - name: 'XTCE'
        icon: zbraces
        fmt: 'XTCE'
        summary: 'XML Telemetric and Command Exchange for describing spacecraft telemetry and command databases.'
        spec_url: https://ccsds.org/Pubs/660x0b2.pdf
        spark_connector: 'spark-xml'
        spark_repo: https://github.com/databricks/spark-xml
        databricks_resource: https://docs.databricks.com/aws/en/query/formats/xml
        source_systems:
          - 'GMV'
          - 'Kratos'
          - 'Ball Aerospace'
      - name: 'CCSDS Orbit Messages'
        icon: zbraces
        fmt: 'OEM'
        summary: 'CCSDS orbit data messages (OEM/OMM/OPM) for exchanging spacecraft ephemeris and orbit state.'
        spec_url: https://ccsds.org/Pubs/502x0b3e1.pdf
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    tiles:
      - name: Ground Station Feeds
        icon: stream
        summary: Telemetry, tracking and command downlink from KSAT and teleport networks, parsed on arrival and landed as CCSDS frames and structured events.
        citations:
          - ksat
        category: Ground Network Services
        what_it_is: Telemetry, tracking and command downlink from KSAT and teleport networks, parsed on arrival and landed as CCSDS frames and structured events.
        who_uses_it: Mission operations, ground segment and Telemetry engineering.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 10-100k frames/sec per pass
            interval: Continuous during contacts
      - name: Supplier EDI / Ariba
        icon: api
        summary: Supplier EDI, advance-ship-notice and purchase-order messages from the extended supply base exchanged through SAP Ariba and integration hubs.
        citations:
          - ariba
        category: Supplier EDI / Procurement Network
        what_it_is: Supplier EDI, advance-ship-notice and purchase-order messages from the extended supply base exchanged through SAP Ariba and integration hubs.
        who_uses_it: Procurement, supply chain and Supplier management.
        data_out:
          batch:
            types:
              - semi-structured
              - structured
            volume: 100s of MB/day
            interval: Continuous EDI messages
      - name: Test & Telemetry Bus
        icon: stream
        summary: MQTT and Kafka topics carrying engine, test-stand and satellite telemetry, landed incrementally as structured events.
        category: Telemetry Streaming Bus
        what_it_is: MQTT and Kafka topics carrying engine, test-stand and satellite telemetry, landed incrementally as structured events.
        who_uses_it: Telemetry engineering, test engineering and Streaming data teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: GBs/hour of telemetry
            interval: Continuous streaming
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Program Leaders
        mark: Genie One
        summary: Program directors on cost, schedule and earned-value performance across the portfolio; the CFO and finance on contract margin, cost of quality and cash across programs; the chief engineer on technical performance, risk and design maturity.
        uses:
          - - Program Cockpit
            - Cost, schedule and earned-value variance on a program at a glance before the monthly review.
          - - AI/BI
            - EVM, supplier risk and quality escapes on one certified set of Metric Views.
          - - Genie One
            - Ask what drove this month's cost variance without waiting on a controls analyst.
        sub:
          - name: Program directors
            cares: cost, schedule and earned-value performance across the portfolio.
          - name: CFO & finance
            cares: contract margin, cost of quality and cash across programs.
          - name: Chief engineer
            cares: technical performance, risk and design maturity.
        ucs:
          - Engineering Program Management & Bid Creation
          - Supply & Materials Planning
          - Product & Process Traceability
      - name: Eng & Design
        mark: AI/BI
        summary: Systems engineering on requirements and design maturity in the digital thread, structural, thermal and CFD analysts validating models against test, and MBSE teams keeping CATIA, Teamcenter and Windchill in one coherent thread.
        uses:
          - - Digital Thread View
            - Requirements traced to as-designed and as-built with no manual reconciliation.
          - - MLflow
            - Simulation surrogate and reliability models tracked for design reviews and audit.
          - - Unity Catalog
            - Requirements, CAD and change control governed with lineage across the estate.
        sub:
          - name: Systems engineering
            cares: requirements and design maturity in the digital thread.
          - name: Simulation & analysis
            cares: structural, thermal and CFD models validated against test.
          - name: Design & MBSE
            cares: CATIA, Teamcenter and Windchill kept in one coherent thread.
        ucs:
          - Product & Process Traceability
          - Design Space Simulation & Exploration
      - name: Mfg & Quality
        core: true
        mark: Lakehouse//RT
        summary: Production and assembly on rate, takt and station performance, quality and MRB on nonconformance and first-pass yield, and supply chain on part availability and supplier quality across the extended aerospace supply base.
        uses:
          - - Manufacturing Yield & Supply
            - Station yield and nonconformance flagged before a unit is at risk.
          - - Lakehouse//RT
            - Live MES and historian state at the latency a pulse line moves at.
          - - Model Serving
            - Defect and supplier-risk models scored against in-line inspection.
        sub:
          - name: Production & assembly
            cares: rate, takt and station performance on the line.
          - name: Quality & MRB
            cares: nonconformance, MRB disposition and first-pass yield.
          - name: Supply chain
            cares: part availability and supplier quality across the supply base.
        ucs:
          - Quality Event Root Cause Analysis
          - Defect Detection
          - Workforce Safety
          - Supply & Materials Planning
      - name: Mission & Fleet
        mark: Lakehouse//RT
        summary: Mission operations on satellite health, orbits and anomaly response, the ground segment on telemetry, tracking and command across the constellation, and fleet reliability on engine and airframe health across the delivered fleet.
        uses:
          - - Mission Control
            - Satellite health and anomalies triaged from live telemetry in one cockpit.
          - - Lakehouse//RT
            - Constellation telemetry at the latency an anomaly has to be caught at.
          - - Model Serving
            - Anomaly and remaining-useful-life models scored in the operational path.
        sub:
          - name: Mission operations
            cares: satellite health, orbits and anomaly response.
          - name: Ground segment
            cares: telemetry, tracking and command across the constellation.
          - name: Fleet reliability
            cares: engine and airframe health across the delivered fleet.
        ucs:
          - Incident & Field Service Assistant
          - Predictive Maintenance & Asset Health
      - name: Compliance & Sec
        mark: Unity Catalog
        summary: Export and ITAR control over technical data and licensing, compliance and audit on AS9100, DO-178C and contract terms, and security over controlled unclassified information and who may see which part of the program.
        uses:
          - - Unity Catalog
            - Row, column and tag policy so controlled technical data reaches only compliance-authorized people.
          - - AI Functions
            - Advisory export markings and control classifications inferred across documents at scale for compliance approval.
          - - Genie One
            - Ask who accessed a controlled dataset this quarter without a manual audit pull.
        sub:
          - name: Export & ITAR
            cares: controlled technical data and export licensing.
          - name: Compliance & audit
            cares: AS9100, DO-178C and contract compliance.
          - name: Security
            cares: controlled unclassified information and access.
        ucs:
          - Cyber Threat Monitoring & Detection
          - Engineering Program Management & Bid Creation
          - Product & Process Traceability
  - name: Technical
    icon: code
    tiles:
      - name: Telemetry Eng
        mark: Lakeflow
        summary: Land satellite, engine and test telemetry over CCSDS, MQTT and Kafka, PLM and MES feeds and the ground-network downlink; own the Bronze to Silver path and the pager when the telemetry tables stall.
        uses:
          - - Lakeflow Connect
            - Managed connectors for PLM, ERP, MES and program-controls sources.
          - - Zerobus
            - Gigabytes of engine and test telemetry pushed straight to the lakehouse with no message bus.
          - - Lakewatch
            - Freshness on the mission and fleet tables ops reads every pass.
        sub:
          - name: Streaming Engineer
            cares: CCSDS, MQTT and Kafka telemetry landed at mission-pass latency.
          - name: Ingestion Engineer
            cares: PLM, MES and ground-network downlink feeds landed into Bronze.
          - name: Pipeline On-call
            cares: the Bronze-to-Silver path and freshness on the mission and fleet tables ops reads every pass.
      - name: Sim & ML Eng
        mark: MLflow
        summary: Anomaly detection, remaining-useful-life, simulation surrogate and demand models, and whether they still hold as vehicles, orbits and processes change.
        uses:
          - - Feature Store
            - Vehicle, engine and telemetry features read identically in training and serving.
          - - MLflow
            - Every anomaly and RUL model tracked for design review, audit and reproduction.
          - - Model Serving
            - Anomaly and RUL models scored in the mission and fleet path.
        sub:
          - name: Reliability Data Scientist
            cares: remaining-useful-life and anomaly models on engine and telemetry data.
          - name: Simulation ML Engineer
            cares: surrogate models validated against test and reduced-order simulation.
          - name: MLOps Engineer
            cares: feature parity and drift on the anomaly and RUL models in the mission path.
      - name: Mission App Dev
        mark: Apps
        summary: Ship the mission-ops, program and fleet-health applications the business works in, hosted next to governed data with governed writes back to the ground system.
        uses:
          - - Apps
            - Mission, program and fleet screens with no separate web tier to run or secure.
          - - Lakebase
            - Serverless Postgres for command state, anomaly triage and program actions.
          - - Agent Bricks
            - Agents that draft an anomaly response or a work order against governed tools.
        sub:
          - name: Full-Stack Engineer
            cares: the Mission Control, Program Cockpit and Fleet Health Watch screens teams work in.
          - name: Backend Engineer
            cares: command state, anomaly triage and program actions on serverless Postgres with governed writes.
          - name: Agent Developer
            cares: agents that draft an anomaly response or work order against governed ground-system tools.
consumers:
  - name: BI & Productivity
    icon: chart
    from: bi
    tiles:
      - name: Tableau / Power BI
        icon: chart
        summary: Program, engineering and mission dashboards against SQL warehouses with Unity Catalog permissions enforced end to end.
      - name: Microsoft Teams
        icon: chat
        summary: Genie in Teams for governed answers from the lakehouse, and program and anomaly updates in the channel the team already works in.
      - name: Notebooks & IDEs
        icon: notebook
        summary: Engineering and data-science notebooks, VS Code and JetBrains against governed program and telemetry data.
  - name: Partners & Suppliers
    icon: partner
    tiles:
      - name: Supplier Sharing
        icon: share
        summary: Tier-1 and component suppliers reading live demand, quality and forecast tables over Delta Sharing rather than nightly file exchange.
      - name: Prime & Gov Sharing
        core: true
        icon: globe
        summary: Primes, subcontractors and government customers reading contracted program data over governed sharing, reducing duplicate extracts.
      - name: Digital Twin Exchange
        icon: share
        summary: As-built configuration and telemetry-fed digital twins shared to operators and MRO partners as live products.
  - name: Operational Writeback
    icon: opdb
    tiles:
      - name: Teamcenter Writeback
        icon: erp
        summary: Configuration and change decisions written back into the PLM so the answer reaches the system engineering works in.
        citations:
          - teamcenter
      - name: MES Disposition
        core: true
        icon: compute
        summary: Lot hold, release and rework decisions written back to the MES at the station.
        citations:
          - opcenter
      - name: Maintenix Work Orders
        icon: orch
        summary: Predicted component removals and service actions raised in the MRO system against the serial.
        citations:
          - maintenix
  - name: Mission & Ground
    icon: stream
    tiles:
      - name: Commanding Writeback
        icon: stream
        summary: Anomaly responses and manoeuvre plans proposed for controller review, with the authorized ground system validating and transmitting spacecraft commands.
        citations:
          - kratos
      - name: Ground Ops Portal
        icon: gauge
        summary: Satellite health, contact schedule and anomaly state served to mission controllers on Databricks Apps.
      - name: Constellation Ops
        icon: network
        summary: Cross-fleet reliability and coverage served to constellation operators from certified Gold products.
  - name: Compliance & Reporting
    icon: gavel
    tiles:
      - name: EVM / CPR Reporting
        icon: sheet
        summary: Contract Performance Reports and earned-value submissions filed to the customer from the same governed cost and schedule tables.
        citations:
          - cobra
      - name: ITAR & Export Filing
        core: true
        icon: gavel
        summary: Export-control markings, license usage and technical-data-access records produced from governed tables under Unity Catalog.
      - name: AS9100 Compliance
        icon: gavel
        summary: Quality, airworthiness and first-article records assembled for AS9100 and airworthiness audit from certified Gold.
  - name: Databricks Apps
    icon: apps
    tiles:
      - name: Mission Control
        icon: gauge
        short: Satellite mission ops
        summary: 'The cockpit mission controllers run a pass from: satellite health, contact schedule and anomalies from live CCSDS telemetry, with responses drafted for controller review before the authorized ground system validates and executes them, on Databricks Apps over Lakebase.'
      - name: Program Cockpit
        icon: sheet
        short: EVM & schedule
        summary: Earned-value cost and schedule variance by control account against the integrated master schedule, so a program manager sees the overrun forming before the monthly review, not after.
      - name: Fleet Health Watch
        icon: iot
        short: Fleet reliability
        summary: Engine and airframe health and predicted removals by serial, so reliability engineering plans the change at a base overnight instead of discovering it on wing.
      - name: Digital Thread View
        icon: network
        short: Requirements to as-built
        summary: Where systems engineering traces a requirement from CATIA and Teamcenter through to the as-built serial and its test evidence, on the same governed data the whole program reads, with the Yield & MRB Cockpit as its manufacturing-quality module for station yield, nonconformance and disposition.
  - name: AI/BI Dashboards
    icon: aibi
    tiles:
      - name: Program EVM & Schedule
        icon: aibi
        summary: Earned-value cost and schedule variance by control account on certified Metric Views.
        kpis:
          - Cost variance
          - Schedule variance
          - CPI
          - SPI
          - Estimate at completion
        teams:
          - Program Leaders
          - Program directors
          - CFO & finance
      - name: Digital Thread & Configuration
        icon: aibi
        summary: Requirement traceability, open changes and as-built conformance.
        kpis:
          - Requirement traceability
          - Open change orders
          - As-built conformance
          - Nonconformance count
          - First-article status
        teams:
          - Eng & Design
          - Systems engineering
          - Design & MBSE
      - name: Mission & Fleet Reliability
        icon: aibi
        summary: Satellite health, anomaly rates and predicted engine removals.
        kpis:
          - Fleet reliability
          - Anomaly rate
          - Predicted removals
          - Telemetry out-of-limits
          - Mean time between removals
        teams:
          - Mission & Fleet
          - Mission operations
          - Fleet reliability
      - name: Manufacturing Yield & Supply
        icon: aibi
        summary: First-pass yield, OEE, nonconformance and supplier risk.
        kpis:
          - First-pass yield
