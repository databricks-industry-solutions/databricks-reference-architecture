  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Virtual Visit Ops
        short: Telehealth
        icon: stream
        summary: Matching clinician supply to demand across scheduled and on-demand visits, cutting wait times and no-shows so access holds as volume grows.
        problem: Demand for virtual visits is spiky and clinician supply is fixed; without live matching, members wait, clinicians idle, and no-shows waste the slot that a waiting member needed.
        who_benefits: Clinical Ops
        how_built: Visit, queue and engagement feeds land in Lakehouse//RT; demand and no-show models score through Model Serving and the Visit Operations app steers staffing and reminders before the wait becomes a cancellation.
        components:
          - Visit Operations
          - Amwell Platform
          - Lakehouse//RT
          - Model Serving
          - AI/BI
        stories:
          - title: Accolade delivers seamless virtual care experiences on Databricks
            url: https://www.databricks.com/customers/accolade
          - title: Bupa unifies telehealth and health data on Databricks
            url: https://www.databricks.com/customers/bupaaustralia
      - name: RPM & Alerting
        short: Monitoring
        icon: iot
        summary: Turning high-frequency device telemetry into high-precision clinical alerts, so nurses act on deterioration early without drowning in noise.
        problem: RPM kits and wearables push millions of readings in dozens of formats; triaged by hand the signal is lost to alert fatigue, and the deterioration that mattered is seen too late.
        who_benefits: Care Management
        how_built: Device streams land through Auto Loader and Kafka into Lakehouse//RT; deterioration models score through Model Serving and the Care Command Center on Lakebase drives nurse triage and intervention.
        components:
          - Care Command Center
          - Validic Device Hub
          - Kafka Device Events
          - Lakehouse//RT
          - Model Serving
        stories:
          - title: Austin Health monitors patients at home with Databricks
            url: https://www.databricks.com/customers/austin-health
      - name: Member Engagement
        short: Engagement
        icon: custlake
        summary: Personalised outreach and adherence nudges scored per member against the profile the engagement estate already holds, so activation and retention rise.
        problem: Outreach is blasted the same to everyone while the signal to personalise it already sits behind the CRM and messaging estate, unused, so members disengage and programmes churn.
        who_benefits: Member Growth
        how_built: Engagement, visit and device data are unified through CustomerLake without a separate CDP; propensity and next-best-action are scored in Model Serving and activated through Braze and the Member 360 Hub.
        components:
          - Member 360 Hub
          - CustomerLake
          - Braze Journeys
          - Model Serving
          - AI/BI
        stories:
          - title: Flo Health scales personalised experiences on Databricks
            url: https://www.databricks.com/customers/flo-health
      - name: Contact Center Sentiment
        short: Service
        icon: chat
        summary: Member call and message transcripts mined for sentiment, effort and churn signals.
        problem: Member frustration lives in thousands of support calls and chat threads no one can read at scale, so the service failures that drive disengagement and churn surface only in anecdote, long after the member has cooled.
        who_benefits: Member Growth
        how_built: Twilio call and message transcripts land on Delta Lake under Unity Catalog and AI Functions summarise sentiment, contact drivers and resolution into governed tables surfaced in AI/BI and Genie One.
        components:
          - Twilio Comms
          - AI Functions
          - AI/BI
          - Genie One
          - Unity Catalog
      - name: Risk Stratification
        short: Population
        icon: chart
        summary: Ranking members by rising risk from clinical, device and claims signals, so care management works the members most likely to deteriorate first.
        problem: Panels are worked by tenure or squeaky wheel, not risk; the member quietly deteriorating is missed while care time is spent where it changes the least.
        who_benefits: Clinical Ops
        how_built: FHIR clinical history, device features and claims are conformed in the lakehouse; risk models tracked in MLflow score through Model Serving and surface the rising-risk panel in the Care Command Center.
        components:
          - Care Command Center
          - Epic FHIR APIs
          - Feature Store
          - MLflow
          - Model Serving
        stories:
          - title: Accolade improves member stratification with Databricks
            url: https://www.databricks.com/customers/accolade
      - name: FHIR Interoperability
        short: Interop
        icon: api
        summary: Turning HL7 v2, C-CDA and FHIR from many EHRs into one conformed clinical model, so every downstream care and analytics use case reads one patient record.
        problem: Clinical data arrives from dozens of EHRs as HL7, C-CDA and nested FHIR JSON; without a conformed model, every team rebuilds the same patient and every join drifts.
        who_benefits: Product & Data
        how_built: HL7 and FHIR events land through subscriptions into Delta Lake; SQL-on-FHIR transformations build conformed resources served operationally on Lakebase and governed end to end in Unity Catalog.
        components:
          - HL7 & FHIR Messages
          - Redox Interop
          - Health Gorilla
          - Delta Lake
          - Lakebase
          - Unity Catalog
        stories:
          - title: Building a FHIR-native health data platform on Databricks Lakebase
            url: https://www.databricks.com/blog/building-fhir-native-health-data-platform-databricks-lakebase
      - name: Digital Patient 360
        short: Unified profile
        icon: custlake
        summary: One governed view of the patient across visits, devices, claims and engagement.
        problem: A patient's history is scattered across telehealth, monitoring, engagement and payer systems, so care teams and product never see the whole person and every experience is built on a partial profile.
        who_benefits: Care Management
        how_built: Visit, device, claims and engagement data unify in CustomerLake under Unity Catalog and are served on Lakebase in the Member 360 Hub, so one governed patient profile powers care, coaching and personalisation.
        components:
          - Member 360 Hub
          - CustomerLake
          - Epic FHIR APIs
          - Lakebase
          - Unity Catalog
      - name: Digital Therapeutics
        short: DTx
        icon: apps
        summary: Powering evidence-based digital coaching for chronic conditions and supporting programme evaluation and evidence preparation for applicable claims and payer contracts.
        problem: Digital therapeutics live or die on efficacy evidence, but coaching signals, device readings and outcomes sit apart, so personalisation is coarse and the evidence base is slow to build.
        who_benefits: Product & Data
        how_built: Device, engagement and clinical data are aggregated into a member view; coaching and efficacy models tracked in MLflow score through Model Serving and Feature Store into the programme in the Member 360 Hub.
        components:
          - Member 360 Hub
          - Apple HealthKit
          - Dexcom CGM
          - Model Serving
          - MLflow
          - Feature Store
        stories:
          - title: Welldoc enhances cardiometabolic digital coaching on Databricks
            url: https://www.databricks.com/blog/welldocr-and-databricks-enhancing-cardiometabolic-care-improved-data-tailored-interventions
      - name: Outcomes Analytics
        short: Value-based
        icon: sheet
        summary: Measuring clinical and financial outcomes by cohort and programme, so product, clinical and payer teams see what actually moves adherence, gaps and cost of care.
        problem: Outcomes are reported quarterly from stale extracts that cannot separate what worked from what did not, so value-based contracts are argued on anecdote and product bets are unproven.
        who_benefits: Payer Partners
        how_built: Clinical, engagement and claims outcomes are conformed to certified Gold; cohort and programme results are explored in AI/BI on Unity Catalog definitions and published as Data Products in the Outcomes Explorer.
        components:
          - Outcomes Explorer
          - AI/BI
          - Unity Catalog
          - Data Products
          - Genie One
        stories:
          - title: Welldoc surfaces population outcomes for health plans on Databricks
            url: https://www.databricks.com/blog/welldocr-and-databricks-enhancing-cardiometabolic-care-improved-data-tailored-interventions
          - title: Healthcare and life sciences on the Databricks Platform
            url: https://www.databricks.com/solutions/industries/healthcare-and-life-sciences
      - name: Care Coordination
        short: Coordination
        icon: people
        summary: Coordinating hand-offs across virtual visits, RPM, coaching and the EHR so the member has one care plan, not a set of disconnected touchpoints.
        problem: A member's care is split across telehealth, monitoring, coaching and their provider's EHR; without a shared plan the touchpoints contradict each other and work falls between the teams.
        who_benefits: Clinical Ops
        how_built: A unified member and care-plan view is served on Lakebase; agents draft hand-offs and proposed updates against governed tools with Agent Bricks and AI Functions, and the care team accepts changes before active-plan updates write back to the EHR and Health Cloud.
        components:
          - Care Command Center
          - Agent Bricks
          - AI Functions
          - Lakebase
          - Model Serving
        stories:
          - title: Bupa builds a unified digital health view on Databricks
            url: https://www.databricks.com/customers/bupaaustralia
medallion:
  Bronze:
    short: Raw visit, device, claim feeds
    summary: Video and async visit records from the telehealth platform, device telemetry from wearables and RPM kits, FHIR resources pulled from EHRs, engagement events and eligibility and paid-claims files, landed exactly as received so a reading or a visit can always be replayed as it stood.
  Silver:
    short: Conformed member, encounter, device
    summary: Members, encounters, care plans and device streams resolved into single conformed entities across the telehealth, monitoring and engagement estates, with FHIR Patient and Observation identities matched and eligibility reconciled to one member record.
  Gold:
    short: Engagement, outcomes, cost of care
    summary: 'Contracted products clinical and commercial teams run on: visit access and no-show rates, RPM adherence and alert precision, care-gap closure and quality measures, engagement and retention, and clinical and financial outcomes by cohort.'
