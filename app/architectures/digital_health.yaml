agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Virtual Visit Ops Agent
        icon: genie
        summary: Ask about visit access, no-show rates and clinician utilisation in plain language.
        feeds:
          - Amwell Platform
          - Teladoc Health
          - Zoom for Healthcare
          - Engagement, outcomes, cost of care
        teams:
          - Clinical Ops
          - Care Delivery
          - Quality & Safety
        questions:
          - What is this week's no-show rate by programme and channel?
          - Where is clinician availability falling short of visit demand?
          - What is average wait time from request to visit start?
          - Which programmes have the longest queue depth right now?
          - How has virtual visit volume grown month over month?
      - name: Patient Deterioration Agent
        icon: genie
        summary: Explore device adherence, alert precision and rising risk across the panel.
        feeds:
          - Validic Device Hub
          - Dexcom CGM
          - Kafka Device Events
          - Conformed member, encounter, device
        teams:
          - Care Management
          - RPM Nurses
          - Health Coaches
        questions:
