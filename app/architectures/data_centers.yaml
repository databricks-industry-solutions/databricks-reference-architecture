agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Facility Operations Agent
        icon: genie
        summary: Ask about live power, cooling, alarms and reliability across the floor in plain language.
        feeds:
          - JCI Metasys
          - Vertiv Environet
          - SNMP & Telemetry
          - PUE, uptime, capacity
        teams:
          - Facilities Ops
          - Optimization Eng
          - Executive Team
        questions:
          - Which halls are running hottest against their thermal envelope right now?
          - What is current PUE by site and how is it trending today?
          - Which cooling units are drawing the most power for the least effect?
          - Which critical assets are predicted to fail on a live floor?
          - Where is availability risk concentrated across the power and cooling chain?
      - name: Capacity & Energy Agent
        icon: genie
        summary: Explore power, cooling and space headroom and energy cost across the estate.
        feeds:
          - Sunbird dcTrack
          - Schneider PowerLogic
          - Utility & Energy Mkts
          - PUE, uptime, capacity
        teams:
          - Capacity & IX
          - Sustainability
          - Executive Team
        questions:
          - Where do we have stranded power capacity by hall?
          - Where will the next megawatt of demand land?
          - How much power did we buy on spot versus contract this week?
          - Which sites have the best carbon-intensity buying windows today?
          - Which sites are closest to selling out of cooling?
      - name: Incident & Security Agent
        icon: genie
        summary: Answer questions on incidents, change risk, cyber threats and field work in plain language.
        feeds:
          - ServiceNow ITSM
          - Kentik NPM
          - SolarWinds NPM
          - Conformed site, asset, tenant
        teams:
          - Service & Sec
          - Facilities Ops
          - NOC operators
        questions:
          - Which incidents are open past their SLA right now?
          - Which change records carry the highest risk this window?
          - Where did anomalous access or network activity occur this week?
          - Which control networks show signs of lateral movement?
          - How many field work orders are open past their SLA?
      - name: Sustainability & Finance Agent
        icon: genie
        summary: Ask about PUE, WUE, carbon, energy cost and return on capacity across the estate.
        feeds:
          - Schneider PowerLogic
          - PDU Branch Metering
          - Utility & Energy Mkts
          - PUE, uptime, capacity
        teams:
