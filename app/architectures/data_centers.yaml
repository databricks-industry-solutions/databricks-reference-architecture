name: Data Centers & Cloud
description: 'Colocation and hyperscale data-center operators: DCIM and critical facilities, power and cooling efficiency, capacity forecasting, energy and sustainability, cyber and physical security monitoring, field operations, and financial analytics.'
sources:
  - name: DCIM & Assets
    icon: erp
    tiles:
      - name: EcoStruxure IT
        icon: erp
        summary: 'Schneider Electric EcoStruxure IT DCIM: the system of record for assets, power chains, rack and space allocation and environmental monitoring across the estate.'
        citations:
          - schneider
        category: DCIM (Data Center Infrastructure Mgmt)
        what_it_is: System of record for assets, power chains, rack and space allocation and environmental monitoring across the estate.
        who_uses_it: Data-center operations, capacity planners and facilities engineers.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Nightly
          stream:
            types:
              - semi-structured
            volume: 1-10k readings/sec
            interval: Continuous
      - name: Nlyte DCIM
        icon: erp
        summary: 'Carrier Nlyte data-center infrastructure management: asset lifecycle, workflow and capacity records, the incumbent inventory of what is racked where and on which circuit.'
        citations:
          - nlyte
        category: DCIM / Asset Lifecycle
        what_it_is: Asset lifecycle, workflow and capacity records; the incumbent inventory of what is racked where and on which circuit.
        who_uses_it: Capacity planners, asset and facilities teams.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-2 GB/day
            interval: Nightly
      - name: Sunbird dcTrack
        icon: sheet
        summary: 'Sunbird dcTrack DCIM: rack elevations, power-port and network-port connectivity and capacity, the source for space, power and cooling headroom by cabinet.'
        citations:
          - sunbird
