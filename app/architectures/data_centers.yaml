        icon: zbraces
        fmt: 'IPMI'
        summary: 'Legacy Intelligent Platform Management Interface for out-of-band server monitoring.'
        spec_url: https://www.dmtf.org/standards/ipmi
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    tiles:
      - name: SNMP & Telemetry
        icon: stream
        summary: SNMP traps, syslog and NetFlow from power, cooling and network gear polled continuously and landed as governed events for real-time facility and network analysis.
        citations:
          - snmp
        category: Network / Facility Telemetry
        what_it_is: SNMP traps, syslog and NetFlow from power, cooling and network gear polled continuously and landed as governed events.
        who_uses_it: NOC, network and facilities data engineers.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 1-10k events/sec
            interval: Continuous
      - name: Kafka Sensor Bus
        icon: eventbus
        summary: High-frequency BMS, PDU and environmental events carried on existing Kafka topics, consumed continuously into the lakehouse for near-real-time cooling and power analytics.
        citations:
          - kafka
        category: Event Streaming Platform
        what_it_is: High-frequency BMS, PDU and environmental events carried on existing Kafka topics, consumed continuously for near-real-time analytics.
        who_uses_it: Facilities data engineers and streaming teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 10-100k events/sec
            interval: Continuous
      - name: MQTT Gateway
        icon: iot
        summary: Edge sensor and controller telemetry published to an MQTT broker at the site, bridged into the lakehouse so hall-level readings arrive at the cadence they are sampled.
        citations:
          - mqtt
        category: IoT Messaging (MQTT)
        what_it_is: Edge sensor and controller telemetry published to a site MQTT broker and bridged into the lakehouse at sampling cadence.
        who_uses_it: Edge/IoT and facilities data engineers.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 1-50k edge readings/sec
            interval: Continuous
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Executive Team
        mark: Genie One
        summary: The CEO on capacity, uptime and the cost of powering AI-era demand; the CFO on capital deployment across sites and the return on every megawatt; the COO on availability, SLA exposure and the sustainability commitments made to investors and tenants.
        uses:
          - - Genie One
            - Ask what a site cost to run last month, or where capacity is stranded, without booking analyst time.
          - - AI/BI
            - PUE, uptime, capacity headroom and energy cost on one certified set of Metric Views.
          - - Unity Catalog
            - Certification and the glossary, so "PUE" and "availability" mean one thing across every site.
        sub:
          - name: CEO
            cares: capacity, uptime and the cost of powering AI-era demand.
          - name: CFO
            cares: capital deployment across sites and return on every megawatt.
          - name: COO
            cares: availability, SLA exposure and sustainability commitments.
        ucs:
          - Capacity Planning
          - Sustainability
          - Energy Procurement
          - Financial Analytics
      - name: Facilities Ops
        mark: Lakehouse//RT
        summary: Critical facility engineers watching the power chain and cooling loops on a live floor, shift operators in the NOC acknowledging alarms against the clock, and mechanical and electrical teams keeping UPS, generators and chillers inside their operating envelope.
        uses:
          - - Critical Ops Cockpit
            - Power-chain, cooling and alarm state on one screen before an operator escalates.
          - - Lakehouse//RT
            - BMS, PDU and chiller telemetry at the latency a thermal event moves at.
          - - Model Serving
            - Cooling-setpoint and failure-risk models scored inline against live conditions.
        sub:
          - name: Critical facility eng
            cares: the power chain and cooling loops on a live floor.
          - name: NOC operators
            cares: alarm acknowledgement and first-response triage.
          - name: M&E engineers
            cares: UPS, generator and chiller operating envelopes.
        ucs:
          - Cooling Optimization
          - Predictive Maintenance
          - Uptime & Availability
          - Field Ops Assistant
      - name: Capacity & IX
        core: true
        mark: AI/BI
        summary: Capacity planners tracking power, cooling and space headroom hall by hall before a sales commitment strands a cabinet, and interconnection product managers monetising cross-connects and fabric ports across the meet-me room.
        uses:
          - - Capacity Planner
            - Power, cooling and space headroom and stranded capacity by hall on governed data.
          - - AI/BI
            - Utilisation, headroom and interconnection revenue on the definitions the board reads.
          - - Genie
            - Plain-English questions on where the next cabinet or cross-connect can land.
        sub:
          - name: Capacity planners
            cares: power, cooling and space headroom by hall.
          - name: Interconnection PMs
            cares: cross-connect and fabric-port monetisation.
        ucs:
          - Capacity Planning
          - Financial Analytics
      - name: Sustainability
        mark: Model Serving
        summary: Energy procurement teams hedging and buying power against volatile wholesale markets, and ESG and sustainability leads accounting for PUE, WUE and Scope 1-3 carbon across the estate for regulators, investors and tenants.
        uses:
          - - PUE Optimizer
            - Cooling and PUE recommendations reconciled against the carbon and cost they move.
          - - Model Serving
            - Load, price and carbon-intensity forecasts scored behind procurement and reporting.
          - - AI/BI
            - PUE, WUE and Scope 1-3 emissions on governed, audit-ready Gold tables.
        sub:
          - name: Energy procurement
            cares: hedging and buying power against wholesale markets.
          - name: ESG & sustainability
            cares: PUE, WUE and Scope 1-3 carbon accounting.
        ucs:
          - Sustainability
          - Energy Procurement
      - name: Service & Sec
        mark: Agent Bricks
        summary: Incident and change managers running the ITSM process when an alarm becomes a ticket, physical-security teams watching access control and video across the perimeter, and tenant-success and billing teams reconciling metered power draw against colocation contracts.
        uses:
          - - Tenant Portal
            - Metered power, billing, SLA and interconnection self-service for every tenant.
          - - Agent Bricks
            - Agents that triage an alarm, draft a change record or answer a tenant query against governed tools.
          - - Lakehouse//RT
            - Access-control, video and ITSM events joined to the assets they touch, live.
        sub:
          - name: Incident & change mgrs
            cares: the ITSM process from alarm to resolved ticket.
          - name: Physical security
            cares: access control and video across the perimeter.
          - name: Tenant success & billing
            cares: metered power reconciled against colo contracts.
        ucs:
          - Incident & Change
          - Cyber Threat Monitoring
  - name: Technical
    icon: code
    tiles:
      - name: DC Data Engineers
        mark: Lakeflow
        summary: Land DCIM asset records, BMS BACnet and Modbus points, PDU branch-circuit power reads and SNMP and NetFlow telemetry; own the Bronze-to-Silver path and the pager when a facility feed stalls.
        uses:
          - - Lakeflow Connect
            - Managed connectors for DCIM, ITSM and BMS historian sources.
          - - Auto Loader
            - Incremental ingestion of high-frequency sensor and meter files into conformed tables.
          - - Lakeflow
            - Declarative pipelines with expectations on every power, cooling and network feed.
        sub:
          - name: Ingestion Engineers
            cares: DCIM, BMS, PDU and SNMP feeds landed exactly as received.
          - name: Streaming Platform
            cares: high-frequency sensor and meter telemetry at floor latency.
          - name: Data Quality & SRE
            cares: Bronze-to-Silver expectations and the pager when a facility feed stalls.
        ucs:
          - Cooling Optimization
          - Predictive Maintenance
          - Capacity Planning
      - name: Optimization Eng
        mark: Model Serving
        summary: Build cooling-setpoint and PUE-optimisation models against BMS and chiller telemetry, and remaining-useful-life models on UPS, battery and CRAH condition data, and keep them honest six months after deployment.
        uses:
          - - Feature Store
            - Sensor features defined once and read identically in training and serving.
          - - MLflow
            - Every optimisation and RUL run tracked for audit and reproduction.
          - - Model Serving
            - Setpoint and failure-risk models scored in the operational control path.
        sub:
          - name: Cooling & PUE Science
            cares: cooling-setpoint and PUE-optimisation models against BMS and chiller telemetry.
          - name: Reliability Science
            cares: remaining-useful-life models on UPS, battery and CRAH condition data.
          - name: MLOps
            cares: every optimisation and RUL model tracked, evaluated and monitored for audit.
        ucs:
          - Cooling Optimization
          - Predictive Maintenance
          - Uptime & Availability
      - name: Ops App Devs
        mark: Apps
        summary: Ship the NOC, capacity and tenant applications the operator works in, hosted next to governed facility data with governed writes back to ITSM and DCIM.
        uses:
          - - Apps
            - Operational screens with no separate web tier to run or secure.
          - - Lakebase
            - Serverless Postgres for ticket, work-order and acknowledgement state.
          - - Agent Bricks
            - Agents that draft a change record or a tenant answer against governed tools.
        sub:
          - name: NOC & Capacity Apps
            cares: the Critical Ops Cockpit and Capacity Planner operations run the floor from.
          - name: Tenant Apps
            cares: the Tenant Portal for metered power, billing and SLA self-service.
          - name: Agents & Writeback
            cares: agents drafting change records and tenant answers with governed writeback to ITSM and DCIM.
        ucs:
          - Field Ops Assistant
          - Incident & Change
          - Capacity Planning
consumers:
  - name: BI & Productivity
    icon: chart
    from: bi
    tiles:
      - name: Power BI / Tableau
        icon: chart
        summary: Executive and operations dashboards against SQL warehouses, with Unity Catalog permissions enforced end to end.
      - name: Microsoft Teams
        icon: chat
        summary: Genie in Teams for Unity Catalog-governed answers from the facility lakehouse, and incident and capacity updates in the channel operations already works in.
      - name: Notebooks & IDEs
        icon: notebook
        summary: Engineer and analyst notebooks, VS Code and JetBrains against governed facility data and Genie Code.
  - name: NOC & Alerting
    icon: gauge
    tiles:
      - name: PagerDuty / Opsgenie
        icon: gauge
        summary: Scored, correlated alarms routed to the on-call rotation so the one incident that matters pages a human, not the whole storm.
      - name: NOC Dashboards
        icon: chart
        summary: Live power-chain, cooling and network state surfaced to the network operations centre with recommended actions attached.
      - name: Alarm Correlation
        icon: stream
        summary: BMS, PDU and network alarms clustered into incidents in near real time so operators triage causes, not a flood of symptoms.
  - name: Operational Writeback
    icon: opdb
    tiles:
      - name: ServiceNow Work Orders
        icon: opdb
        summary: Predicted failures and correlated incidents raised as work orders and change records in ServiceNow, in the system operations already runs.
        citations:
          - servicenow
      - name: DCIM Writeback
        icon: db
        summary: Reconciled capacity, connectivity and asset state written back into DCIM so the inventory operations plans against stays true.
      - name: Setpoint Advisories
        core: true
        icon: iot
        summary: Cooling-setpoint recommendations delivered as advisories to controls engineers, who apply them in the BMS rather than a model driving plant directly.
  - name: Regulatory & ESG
    icon: gavel
    tiles:
      - name: ESG & Carbon Report
        icon: gavel
        summary: PUE, WUE and Scope 1-3 emissions reporting for CSRD and investor disclosure, produced from the same governed tables the floor runs on.
      - name: SLA & Uptime Report
        icon: gavel
        summary: Contracted uptime and service-credit reporting to tenants produced from contracted Gold products rather than reassembled by hand under deadline.
      - name: Audit Evidence
        icon: docs
        summary: Immutable query and access logs recording who saw what and when, supporting specified facility and tenant audit controls rather than covering every requirement.
  - name: Sharing & Products
    icon: product
    tiles:
      - name: Data Products
        icon: product
        summary: Published, contracted facility and tenant products discoverable in Unity Catalog Domains and shared over OpenSharing.
      - name: Tenant Data Sharing
        core: true
        icon: share
        summary: Live power, uptime and interconnection data shared to each tenant over Delta Sharing, reducing bespoke exports subject to the recipient's access mode.
      - name: Sharing Recipients
        icon: share
        summary: Partners, utilities and regulators reading live governed tables directly rather than by nightly file exchange.
  - name: Databricks Apps
    icon: apps
    tiles:
      - name: Critical Ops Cockpit
        icon: gauge
        short: Live facility state
        summary: 'The screen the NOC and critical-facility engineers run a floor from: power-chain, cooling and alarm state, correlated into the one incident that matters, on Databricks Apps over Lakebase.'
      - name: Capacity Planner
        icon: sheet
        short: Power & space headroom
        summary: Power, cooling and space headroom and stranded capacity by hall and cabinet, so a sales commitment lands where capacity actually exists rather than behind a full breaker.
      - name: PUE Optimizer
        icon: chart
        short: Cooling efficiency
        summary: Cooling-setpoint and airflow recommendations scored against live heat load and reconciled to the PUE, cost and carbon they move, delivered as advisories to the controls team.
      - name: Tenant Portal
        icon: product
        short: Billing & SLA
        summary: Metered power, billing, SLA and interconnection self-service for every tenant, served from governed data and shared live over Delta Sharing.
  - name: AI/BI Dashboards
    icon: aibi
    tiles:
      - name: PUE & Efficiency
        icon: aibi
        summary: Site PUE, WUE and cooling energy on certified Metric Views.
        kpis:
          - PUE
          - WUE
          - Cooling energy share
          - Setpoint compliance
          - Free-cooling hours
        teams:
          - Sustainability
          - Facilities Ops
          - Executive Team
      - name: Capacity & Headroom
