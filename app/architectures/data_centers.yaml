      - name: Utility & Energy Mkts
        icon: fed
        summary: Utility interval-meter reads, wholesale energy-market prices and renewable-energy-certificate and PPA registries left in their existing warehouses and queried in place under Unity Catalog, so cost and carbon attribution join facility telemetry without a second copy.
        category: Energy Market & Utility Data
        what_it_is: Utility interval-meter reads, wholesale energy-market prices and REC/PPA registries kept in existing warehouses and queried in place through federation.
        who_uses_it: Energy procurement, sustainability and finance teams.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale market + meter history
