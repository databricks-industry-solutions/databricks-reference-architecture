          - Executive Team
          - ESG & sustainability
        questions:
          - What is PUE and WUE by site this month versus last?
          - What are Scope 1-3 emissions by site quarter to date?
          - What is energy cost per megawatt across the estate?
          - Where is energy spend growing fastest relative to load?
          - What is the return on the last megawatt we deployed?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Cooling Optimization
        short: Efficiency
        icon: iot
        summary: Optimising chiller, CRAH and airflow setpoints against live heat load to cut the cooling energy that is a material, site-dependent share of a site's power, without leaving the thermal envelope.
        problem: Cooling runs on static, conservative setpoints tuned for the worst case, so a material, site-dependent share of site power is spent holding halls colder than the live heat load actually needs.
        who_benefits: Facilities Ops
        how_built: BMS, chiller and PDU telemetry lands in Lakehouse//RT; setpoint models tracked in MLflow score against live load in Model Serving and are surfaced as advisories in the Critical Ops Cockpit.
        components:
          - Critical Ops Cockpit
          - Lakehouse//RT
          - Model Serving
          - JCI Metasys
          - MLflow
        stories:
          - title: Schneider Electric industrialises energy AI on Databricks
            url: https://www.databricks.com/blog/ai-doesnt-scale-until-you-stop-calling-it-innovation
          - title: Databricks IoT platform for predictive maintenance and optimization
            url: https://www.databricks.com/resources/demos/tutorials/lakehouse-platform/iot-and-predictive-maintenance
      - name: Capacity Planning
        short: Headroom
        icon: sheet
        summary: Tracking power, cooling and space headroom cabinet by cabinet so a sales commitment lands where capacity exists instead of stranding a megawatt behind a full breaker.
        problem: Power, cooling and space are tracked in separate DCIM, BMS and spreadsheet views, so capacity is sold against stale headroom and megawatts strand behind full breakers and hot aisles.
        who_benefits: Capacity & IX
        how_built: DCIM, branch-circuit and cooling feeds are conformed in the lakehouse; headroom and stranded capacity by hall are modelled and explored in the Capacity Planner on AI/BI.
        components:
          - Capacity Planner
          - AI/BI
          - Sunbird dcTrack
          - Nlyte DCIM
          - Schneider PowerLogic
        stories:
          - title: E.ON unifies energy asset data on the Databricks Platform
            url: https://www.databricks.com/customers/eon
      - name: Predictive Maintenance
        short: Critical plant
        icon: iot
        summary: Predicting UPS, battery, generator and CRAH failures from condition telemetry so a component is changed on a planned window instead of tripping a live floor.
        problem: Critical plant is maintained on a calendar rather than its condition, so a failing UPS string or battery is discovered when it trips a floor, not on a planned window.
        who_benefits: Facilities Ops
        how_built: PDU, BMS and Vertiv Environet condition data feed remaining-useful-life models tracked in MLflow and scored in Model Serving; predicted failures raise work orders from the Critical Ops Cockpit.
        components:
          - Critical Ops Cockpit
          - Vertiv Environet
          - MLflow
          - Model Serving
          - Lakeflow
        stories:
          - title: Predictive maintenance on the Databricks Lakehouse
            url: https://www.databricks.com/blog/what-is-predictive-maintenance
          - title: Turning predictive-maintenance scores into a reliability app
            url: https://developers.databricks.com/perspectives/databricks-supports-predictive-maintenance-iot-analytics-for-energy-operations
      - name: Uptime & Availability
        short: Resilience
        icon: gauge
        summary: Forecasting availability risk across the power and cooling chain so the operator defends the uptime SLA before a redundancy is quietly lost, not after an outage.
        problem: Redundancy is assumed until an outage proves it was lost weeks earlier; availability risk hides across UPS, generator, cooling and network layers that no single system watches together.
        who_benefits: Facilities Ops
        how_built: Power, cooling and network telemetry are unified in Lakehouse//RT; availability-risk models in Model Serving forecast single points of failure and surface them in the Critical Ops Cockpit.
        components:
          - Critical Ops Cockpit
          - Lakehouse//RT
          - Model Serving
          - SolarWinds NPM
          - Vertiv Environet
        stories:
          - title: 'Databricks for Energy: forecast load and predict outages'
            url: https://www.databricks.com/company/newsroom/press-releases/databricks-launches-data-intelligence-platform-energy-bringing
          - title: E.ON improves grid asset management on Databricks
            url: https://www.databricks.com/customers/eon
      - name: Energy Procurement
        short: Power buying
        icon: market
        summary: Buying and hedging power against volatile wholesale markets from a forecast of site load and carbon intensity, instead of a static block bought a year ahead.
        problem: Power is the largest operating cost and is bought against static blocks and gut feel, so the operator is exposed to spot volatility and misses the carbon-intensity windows that cut cost and emissions.
        who_benefits: Sustainability
        how_built: Site-load, market-price and carbon-intensity feeds are conformed to Gold; forecasts scored in Model Serving inform hedging and demand-response decisions read in AI/BI.
        components:
          - Model Serving
          - AI/BI
          - Utility & Energy Mkts
          - Delta Lake
          - Lakeflow
        stories:
          - title: Helen forecasts energy demand and production with Databricks
            url: https://www.databricks.com/customers/helen
          - title: Vattenfall builds real-time energy-market intelligence
            url: https://www.databricks.com/customers/vattenfall/genie
      - name: Sustainability
        short: Carbon & WUE
        icon: chart
        summary: Measuring WUE, water and Scope 1-3 carbon across the estate, combining governed telemetry with water records and applicable non-electricity activity data, so disclosure is produced continuously rather than reassembled each quarter.
        problem: PUE, WUE and carbon are reassembled by hand each reporting cycle from meters, spreadsheets and vendor portals the auditors cannot see into, so disclosures lag the operation by a quarter.
        who_benefits: Sustainability
        how_built: Meter, BMS and utility feeds are conformed to Gold with lineage in Unity Catalog; water records and applicable fuel, refrigerant and value-chain activity supply WUE and non-electricity emissions within stated organizational and reporting boundaries; PUE, WUE and Scope 1-3 emissions are published as governed Data Products and read in AI/BI.
        components:
          - AI/BI
          - Unity Catalog
          - Utility & Energy Mkts
          - Data Products
          - PDU Branch Metering
        stories:
          - title: How Dow built a carbon footprint ledger on Databricks
            url: https://www.databricks.com/blog/how-dow-built-carbon-footprint-ledger-databricks-accelerate-sustainability-scale
          - title: Vattenfall quantifies carbon impact at second-level granularity
            url: https://www.databricks.com/customers/vattenfall/genie
      - name: Incident & Change
        short: ITSM
        icon: opdb
        summary: Correlating the alarm storm into the one incident that matters and scoring the risk of every change before it touches a live floor.
        problem: A single fault throws hundreds of BMS and network alarms into ServiceNow at once and change risk is judged on memory, so the real incident is buried and risky changes reach live floors.
        who_benefits: Service & Sec
        how_built: Alarms and tickets from ServiceNow ITSM and the BMS estate are correlated in Lakehouse//RT; an agent on Agent Bricks drafts the incident and flags change risk against history.
        components:
          - ServiceNow ITSM
          - Lakehouse//RT
          - Agent Bricks
          - SNMP & Telemetry
          - AI Functions
        stories:
          - title: How Databricks Uses AI to Accelerate Incident Investigation
            url: https://www.databricks.com/blog/how-databricks-uses-ai-accelerate-incident-investigation
      - name: Cyber Threat Monitoring
        short: Security
        icon: zshield
        summary: Fusing network flow, device and access telemetry to detect threats to the facility and its control systems before they become incidents.
        problem: Network, facility-control and access systems each see one slice, so a lateral-movement or OT intrusion only surfaces on manual review after it has already reached a control network.
        who_benefits: Service & Sec
        how_built: Kentik flow, SolarWinds device and SNMP telemetry join access events in Lakehouse//RT; anomaly and threat models in Model Serving flag risk to the Critical Ops Cockpit and security teams.
        components:
          - Kentik NPM
          - SolarWinds NPM
          - SNMP & Telemetry
          - Model Serving
          - Lakehouse//RT
        stories:
          - title: 'Securing the Grid: A Practical Guide to Cyber Analytics for Energy & Utilities'
            url: https://www.databricks.com/blog/securing-grid-practical-guide-cyber-analytics-energy-utilities
      - name: Field Ops Assistant
        short: Workforce
        icon: apps
        summary: An assistant that gives smart-hands and facility technicians the work order, asset location and procedure for the job, and closes it on mobile.
        problem: Technicians hunt across DCIM, ITSM and runbooks for the asset, the circuit and the procedure, so a smart-hands job or a PM takes longer than the work itself and records lag behind.
        who_benefits: Facilities Ops
        how_built: ServiceNow work orders, DCIM asset location and procedures conform under Unity Catalog; an assistant on Agent Bricks serves technicians from Databricks Apps over Lakebase, writing completions back to ServiceNow.
        components:
          - ServiceNow ITSM
          - Nlyte DCIM
          - Agent Bricks
          - Lakebase
          - Unity Catalog
      - name: Financial Analytics
        short: Finance
        icon: sheet
        summary: Energy cost, capital per megawatt and cost-to-serve tracked on governed ledgers against live utilisation, so finance and operations work from one set of numbers.
        problem: Energy cost, capital and cost-to-serve are pulled from meters, market feeds and finance systems by hand, so each board pack rebuilds them and the return on a megawatt is only known at quarter close.
        who_benefits: Executive Team
        how_built: Meter, market and finance feeds are conformed against the Utility & Energy Mkts marts under Unity Catalog and analysed in AI/BI with Genie One, published as governed Data Products.
        components:
          - Utility & Energy Mkts
          - AI/BI
          - Genie One
          - Unity Catalog
          - Data Products
medallion:
  Bronze:
    short: Raw facility & sensor feeds
    summary: DCIM asset records, BMS BACnet and Modbus points, PDU branch-circuit power reads, chiller and CRAH telemetry, SNMP and NetFlow, access-control and video events and ServiceNow tickets, landed exactly as received so any PUE figure or outage can be replayed as it stood.
  Silver:
    short: Conformed site, asset, tenant
    summary: Sites, halls, racks, power chains, cooling loops and tenants resolved into single conformed entities across the DCIM, BMS and ITSM estates, with sensor points reconciled to one tag namespace and alarms and access events joined to the assets they touch.
  Gold:
    short: PUE, uptime, capacity
    summary: 'Contracted products operations and commercial run on: PUE and WUE by site, power and cooling capacity headroom, uptime and SLA compliance, interconnection utilisation and revenue, and metered tenant power billing.'
