    short: Raw event and fan feeds
    summary: Ticketing scans, POS concessions, broadcast logs, wearable tracking and CRM interactions, landed exactly as received so a attendance or a sponsorship impression can always be replayed.
  Silver:
    short: Conformed fan, event, asset
    summary: Fans, events, seats and media assets resolved into single conformed entities across ticketing, CRM and broadcast estates, with identity stitched across channels.
  Gold:
    short: Attendance, yield, engagement
    summary: 'Contracted products commercial and operations teams run on: ticket yield by section, F&B attach rate, sponsorship ROI, streaming concurrency and churn risk by segment.'
