        kpis:
          - Membership growth
          - Churn risk
          - Streaming concurrency
          - Per-cap spend
          - Offer conversion
        teams:
          - Fan Engagement
          - CRM Director
          - Digital & Content
      - name: Game-Day Operations
        icon: aibi
        summary: Ingress flow, concessions throughput and safety incidents on event day.
        kpis:
          - Ingress throughput
          - Queue time
          - Concessions per cap
          - Crowd density
          - Incident count
        teams:
          - Game-Day Ops
          - VP Venue Operations
          - Head of Security
