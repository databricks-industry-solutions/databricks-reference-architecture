  - name: Agent Harnesses
    icon: agents
    tiles:
      - name: Omnigent OSS
        icon: omni
        short: Databricks, open source
        summary: Open-source meta-harness above existing agent frameworks, enabling agent composition, collaboration and centralised governance from one interface.
        capabilities:
          - Build
          - Deploy
          - Optimize
          - Govern
        related:
          - Agent Bricks
          - Unity Gateway
      - name: Claude Code
        core: true
        icon: code
        short: 3rd-party harness
        summary: Anthropic's coding harness working against the platform through MCP, with spend, routing and policy governed by Unity Gateway.
      - name: OpenAI Codex
        core: true
        icon: code
        short: 3rd-party harness
        summary: OpenAI's coding harness connected over MCP, governed at runtime by Unity Gateway rather than trusted by configuration.
      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Ticketing & Pricing Agent
        icon: genie
        summary: Ask about sell-through pace, seat yield and secondary-market pressure in plain language.
        feeds:
          - Ticketmaster Archtics
          - SeatGeek Enterprise
          - Attendance, yield, engagement
        teams:
          - Ticketing & Pricing
          - Head of Ticketing
          - Pricing Analyst
        questions:
          - What was ticket yield by section for the last home stand?
          - Which sections are behind sell-through pace for the next event?
          - How much secondary-market pressure is building against face value?
          - Which events are pricing below the demand curve right now?
          - What is average net effective ticket price by opponent this season?
      - name: Fan Engagement Agent
        icon: genie
        summary: Explore fan profiles, membership churn and engagement stitched across channels.
        feeds:
          - Salesforce Marketing Cloud
          - VenueNext
          - Deltatre OTT Platform
          - Conformed fan, event, asset
        teams:
          - Fan Engagement
          - CRM Director
          - Membership Services
        questions:
          - What is the total spend of this fan across tickets, concessions and merch?
          - Which season-ticket members are at churn risk before renewal?
          - Which fans are highly engaged on OTT but have never attended in person?
          - What is streaming concurrency and churn by content type?
          - Which segments respond best to the current personalised offer?
      - name: Game-Day Operations Agent
        icon: genie
        summary: Answer questions on ingress flow, concessions throughput and crowd safety.
        feeds:
          - VenueNext
          - Genetec Security Center
          - Ticketmaster Archtics
          - Attendance, yield, engagement
        teams:
          - Game-Day Ops
          - VP Venue Operations
          - Head of Security
        questions:
          - How is ingress throughput tracking against target right now?
          - Which gates and concourses have the longest queues today?
          - Which concession stands are at risk of running out during peak?
          - Where are crowd-density hot spots approaching capacity thresholds?
          - How many incidents have been logged this event and of what type?
      - name: Sponsorship & Media Agent
        icon: genie
        summary: Ask about activation delivery, audience reach and sponsorship ROI.
        feeds:
          - SponsorUnited
          - Nielsen Sports
          - Stats Perform Feeds
          - Attendance, yield, engagement
        teams:
          - Ownership & Executive
          - Chief Commercial Officer
          - Fan Engagement
        questions:
          - Which sponsors are under-delivering against contracted impressions?
          - What is the audience reach of last week's broadcast by segment?
          - How does sponsorship ROI compare across activation types?
          - Which digital properties drive the most sponsor conversions?
          - What premium inventory remains unsold for upcoming events?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Dynamic Ticket Pricing
        short: Revenue
        icon: market
        summary: Price tiers adjusted to demand, inventory and secondary market pressure.
        problem: Seat prices sit on static tiers and stale rules, so demand shifts, opponent draw and secondary-market pressure move faster than pricing and revenue leaks on every event.
        who_benefits: Ticketing & Pricing
        how_built: Ticketing scans, demand and resale signals land through Lakeflow, conform on Delta Lake and are scored in Model Serving, with price tiers set in the Pricing Workbench through the sales window.
        components:
          - Pricing Workbench
          - Ticketmaster Archtics
          - Model Serving
          - Lakeflow
          - Delta Lake
        stories:
          - title: 'Stadium Analytics: increasing sports fan engagement with data and AI'
            url: https://www.databricks.com/blog/2022/03/31/stadium-analytics-increasing-sports-fan-engagement-with-data-and-ai.html
      - name: Fan Churn Prediction
        short: CRM
        icon: custlake
        summary: Season ticket and membership churn scored before renewal windows.
        problem: Membership and season-ticket data sits apart from concessions and app behaviour, so churn is only noticed at renewal when the fan has already decided to walk.
        who_benefits: Fan Engagement
        how_built: Ticketing, CRM and concessions signals are stitched per fan in CustomerLake, scored for churn in Model Serving and surfaced in the Fan 360 Console before the renewal window opens.
        components:
          - Fan 360 Console
          - Salesforce Marketing Cloud
          - CustomerLake
          - Model Serving
          - AI/BI
        stories:
          - title: NRL transforms fan experience with data
            url: https://www.databricks.com/customers/national-rugby-league
          - title: Pumpjack Dataworks builds a fan data refinery on Databricks
            url: https://www.databricks.com/customers/pumpjack-dataworks
      - name: Concessions Optimization
        short: F&B
        icon: product
        summary: Stand staffing and menu mix tuned to expected attendance and weather.
        problem: Stand staffing and menu mix are planned off last season's averages, so queues build at some counters while food is wasted at others and per-cap spend suffers on game day.
        who_benefits: Game-Day Ops
        how_built: POS folios, attendance and weather feeds conform on Delta Lake and forecast demand in Model Serving, with staffing and menu recommendations shown per stand in Game-Day Command.
        components:
          - Game-Day Command
          - VenueNext
          - Model Serving
          - Delta Lake
          - AI/BI
        stories:
          - title: 'Stadium Analytics: increasing sports fan engagement with data and AI'
            url: https://www.databricks.com/blog/2022/03/31/stadium-analytics-increasing-sports-fan-engagement-with-data-and-ai.html
      - name: Sponsorship ROI
        short: Commercial
        icon: partner
        summary: Activation impressions and conversions attributed to sponsor inventory.
        problem: Sponsors want proof their logo drove attention and sales, but impressions, broadcast exposure and conversions live in separate systems, so activation value is argued rather than measured.
        who_benefits: Ownership & Executive
        how_built: Broadcast, social and CRM exposure conform under Unity Catalog and are attributed to sponsor inventory in AI/BI, with activation proof shared to sponsors as governed Data Products.
        components:
          - SponsorUnited
          - Unity Catalog
          - AI/BI
          - Data Products
          - Delta Lake
        stories:
          - title: Pumpjack Dataworks builds a fan data refinery on Databricks
            url: https://www.databricks.com/customers/pumpjack-dataworks
      - name: Event Attendance & Revenue
        short: Analytics
        icon: chart
        summary: Attendance and matchday revenue forecast by event, opponent and promotion.
        problem: Gate, concessions and ancillary revenue are projected from last season's averages, so a marquee opponent or a slow midweek fixture is staffed and stocked to the wrong number and revenue is left on the table.
        who_benefits: Ownership & Executive
        how_built: Ticketing, concessions and event feeds conform on Delta Lake and forecast attendance and revenue per event in Model Serving, with opponent and promotion features in Feature Store read in AI/BI.
        components:
          - Ticketmaster Archtics
          - VenueNext
          - Model Serving
          - Feature Store
          - AI/BI
        stories:
          - title: LaLiga changes the world of sports with real-time streaming data
            url: https://www.databricks.com/customers/laliga
      - name: Broadcast Highlights
        short: Media
        icon: stream
        summary: Automated clip selection and publishing from live feeds.
        problem: Clipping and publishing highlights is a manual scramble against the second screen, so the best moments reach social late and the audience has already moved on.
        who_benefits: Fan Engagement
        how_built: Live broadcast and play-by-play feeds land through Lakeflow and AI Functions score clip-worthy moments on Delta Lake, so highlights are selected and published from Grabyo Clipping in near real time.
        components:
          - Grabyo Clipping
          - Stats Perform Feeds
          - Lakeflow
          - AI Functions
          - Delta Lake
      - name: Crowd Safety Analytics
        short: Operations
        icon: gauge
        summary: Estimated crowd density and developing hotspots flagged as thresholds are approached or exceeded.
        problem: Ingress crushes, density hot-spots and medical incidents are spotted by eye across dozens of cameras, so crews react after a bottleneck has already become a safety risk.
        who_benefits: Game-Day Ops
        how_built: Access-control and crowd-density feeds stream into Lakehouse//RT and are scored against density thresholds in Model Serving, alerting venue incident command from Game-Day Command when thresholds are approached or exceeded.
        components:
          - Game-Day Command
          - Genetec Security Center
          - Lakehouse//RT
          - Model Serving
          - Delta Lake
      - name: Fan Cross-Sell & Upsell
        short: Marketing
        icon: partner
        summary: Next best offer scored across tickets, concessions, merch and streaming per fan.
        problem: Ticketing, concessions, merch and streaming each market to fans in isolation, so a season-ticket holder gets a generic email instead of the parking, upgrade or merch offer their history says they will take.
        who_benefits: Fan Engagement
        how_built: Fan activity stitched in CustomerLake is scored for next best offer in Model Serving, so cross-sell and upsell across tickets, F&B, merch and OTT trigger per fan from the Fan 360 Console.
        components:
          - Fan 360 Console
          - Salesforce Marketing Cloud
          - CustomerLake
          - Model Serving
          - AI/BI
      - name: OTT Personalization
        short: Streaming
        icon: api
        summary: Content recommendations and offers scored per viewer segment.
        problem: Streaming viewers get generic content and offers because concurrency, device and viewing history sit apart from the CRM, so engagement and subscriber value are left on the table.
        who_benefits: Fan Engagement
        how_built: OTT telemetry and CRM data are stitched in CustomerLake and scored for recommendations in Model Serving, personalising content and offers per viewer segment in the direct-to-consumer app.
        components:
          - Deltatre OTT Platform
          - CustomerLake
          - Model Serving
          - Feature Store
          - AI/BI
        stories:
          - title: Seven West Media fuels audience growth and ad revenue with AI
            url: https://www.databricks.com/customers/seven-west-media
          - title: Empowering Swiss public media SRF with data-driven intelligence
            url: https://www.databricks.com/customers/srf
      - name: Merchandise Forecast
        short: Retail
        icon: erp
        summary: Event-level merch demand forecast tied to opponent and promotion.
        problem: Event-level merch demand swings with opponent, promotion and result, but forecasts run on flat seasonal averages, so stock sells out on hot nights and sits dead on others.
        who_benefits: Ownership & Executive
        how_built: Sales, event and promotion data conform on Delta Lake and forecast per-event demand in Model Serving, with opponent and promotion features managed in Feature Store for the retail team.
        components:
