name: Sports & Entertainment
description: 'Teams, venues and media rights: ticketing and fan engagement, game-day operations, broadcast and streaming, sponsorship activation, and athlete performance analytics.'
sources:
  - name: Ticketing & CRM
    icon: erp
    simplified: 3
    tiles:
      - name: Ticketmaster Archtics
        icon: erp
        summary: Primary ticketing, seat inventory, pricing and scan data from every event.
        citations:
          - ticketmaster
        category: Primary Ticketing System
        what_it_is: 'System-of-record for primary ticketing: seat inventory, pricing, sales and gate-scan data from every event.'
        who_uses_it: Ticketing, Pricing and Game-day operations teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-10 GB/day sales + scans
            interval: Nightly + intraday deltas
          stream:
            types:
              - semi-structured
            volume: thousands of scans/sec at ingress
            interval: Continuous on event day
      - name: Salesforce Marketing Cloud
        core: true
        icon: custlake
        summary: Fan profiles, membership tiers, service cases and campaign responses.
        citations:
          - sf-sports
        category: CRM & Marketing Platform
        what_it_is: Holds fan profiles, membership tiers, service cases and campaign responses used for engagement and retention.
        who_uses_it: Fan engagement, CRM and Membership services teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Hourly / nightly sync
          stream:
            types:
              - semi-structured
            volume: tens of events/sec
            interval: Continuous (engagement events)
      - name: SeatGeek Enterprise
        icon: market
        summary: Enterprise ticketing listings, transfer activity and resale demand signals.
        citations:
          - seatgeek
        category: Enterprise Ticketing Platform
        what_it_is: Supplies enterprise ticketing listings, transfer activity and resale demand signals as an illustrative feed.
        who_uses_it: Ticketing, Pricing analysts and Yield management teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: sub-GB to 2 GB/day
            interval: Hourly listing + transfer feeds
  - name: Venue Operations
    icon: stream
    tiles:
      - name: VenueNext
        icon: apps
        summary: Mobile ordering, wayfinding and in-seat service for arena and stadium guests.
        citations:
          - venuenext
        category: Venue Experience & Mobile Ordering
        what_it_is: Runs mobile ordering, wayfinding and in-seat service, emitting concessions and guest-flow events on game day.
        who_uses_it: Game-day operations, Concessions and Guest experience teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds-thousands of orders/sec at peak
            interval: Continuous on event day
      - name: Genetec Security Center
        icon: iot
        summary: Access control, crowd density cameras and incident logs on game day.
        citations:
          - genetec
        category: Physical Security & Access Control
        what_it_is: Provides access control, crowd-density camera analytics and incident logs used for crowd-safety monitoring.
        who_uses_it: Security, Game-day operations and Safety teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: thousands of events/sec at peak
            interval: Continuous on event day
      - name: Catapult Sports
        core: true
        icon: iot
        summary: 'GPS and IMU player tracking: load, sprint distance and injury risk flags.'
        citations:
          - catapult
        category: Athlete Performance Tracking (GPS/IMU)
        what_it_is: Captures GPS and IMU athlete-tracking data for training load, sprint distance and injury-risk signals.
        who_uses_it: Sports science, Medical and Coaching staff.
        data_out:
          batch:
            types:
              - structured
            volume: GBs per session
            interval: Post-session uploads
          stream:
            types:
              - semi-structured
            volume: high-frequency samples per athlete
            interval: Continuous during sessions
  - name: Broadcast & OTT
    icon: partner
    simplified: 2
    tiles:
      - name: Deltatre OTT Platform
        icon: api
        summary: Streaming concurrency, start-over and device telemetry for direct-to-consumer.
        citations:
          - deltatre
        category: OTT Streaming Platform
        what_it_is: Delivers direct-to-consumer streaming and emits concurrency, start-over and device telemetry for engagement.
        who_uses_it: Direct-to-consumer, Digital product and Audience teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: tens of thousands of events/sec at peak
            interval: Continuous during streams
      - name: Grabyo Clipping
        icon: stream
        summary: Live clipping, highlights and social publishing from broadcast feeds.
        citations:
          - grabyo
        category: Live Video Clipping & Publishing
        what_it_is: Clips and publishes live highlights from broadcast feeds to social and digital channels in near real time.
        who_uses_it: Digital & content, Social media and Broadcast teams.
        data_out:
          stream:
            types:
              - semi-structured
              - unstructured
            volume: high-bitrate clips + metadata
            interval: Continuous during broadcast
      - name: Nielsen Sports
        icon: chart
        summary: TV and digital audience measurement for rights valuation.
        citations:
          - nielsen-sports
        category: Audience Measurement
        what_it_is: Measures TV and digital audiences used to value media rights and sponsorship exposure.
        who_uses_it: Media rights, Sponsorship and Commercial strategy teams.
        data_out:
          batch:
            types:
              - structured
            volume: GBs of audience panels
            interval: Daily / weekly measurement
  - name: Sponsorship & Ads
    icon: market
    simplified: 2
    tiles:
      - name: SponsorUnited
        icon: partner
        summary: Sponsorship inventory, activation tracking and competitive spend intelligence.
        citations:
          - sponsorunited
        category: Sponsorship Intelligence Platform
        what_it_is: Tracks sponsorship inventory, activation delivery and competitive spend intelligence across the market.
        who_uses_it: Commercial, Sponsorship sales and Partnership teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: GBs of deals + activations
            interval: Daily / weekly
      - name: The Trade Desk
        icon: market
        summary: Programmatic inventory across league and team digital properties.
        citations:
          - trade-desk
        category: Programmatic Advertising (DSP)
        what_it_is: Buys and reports programmatic ad inventory across league and team digital properties.
        who_uses_it: Digital advertising, Media and Commercial teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 1-5 GB/day impressions + conversions
            interval: Hourly / daily
      - name: UKG Workforce
        icon: people
        summary: Staff scheduling, time and attendance for event and concessions crews.
        citations:
          - ukg
        category: Workforce Management
        what_it_is: Schedules event and concessions crews and records time and attendance for game-day staffing.
        who_uses_it: Venue operations, Concessions and HR teams.
        data_out:
          batch:
            types:
              - structured
            volume: sub-GB/day
            interval: Hourly punch + schedule sync
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: League Data Marts
        icon: fed
        summary: Official league statistics and schedule marts queried in place under Unity Catalog.
        category: League Statistics Data Warehouse
        what_it_is: Official league statistics and schedule marts kept at the league and queried in place through federation.
        who_uses_it: Analytics, Broadcast and Commercial teams.
        data_out:
          batch:
            types:
              - structured
            volume: GB-scale reference marts
            interval: Queried on demand (federated)
  - name: Data Formats
    icon: zbraces
    simplified: 2
    tiles:
      - name: 'SportsML'
        icon: zbraces
        fmt: 'SML'
        summary: 'IPTC SportsML-G2 XML for exchanging sports schedules, results and statistics.'
        spec_url: https://iptc.org/standards/sportsml-g2/
        spark_connector: 'spark-xml'
        spark_repo: https://github.com/databricks/spark-xml
        databricks_resource: https://docs.databricks.com/aws/en/query/formats/xml
        source_systems:
          - 'Stats Perform'
          - 'Genius Sports'
          - 'Sportradar'
      - name: 'IPTC Sport Schema'
        icon: zbraces
        fmt: 'IPTC'
        summary: 'IPTC linked-data Sport Schema for modelling sports events and entities.'
        spec_url: https://iptc.org/standards/sport-schema/
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    simplified: 2
    tiles:
      - name: Stats Perform Feeds
        icon: api
        summary: Live play-by-play, rosters and official statistics ingested for analytics.
        citations:
          - stats-perform
        category: Sports Data Feed
        what_it_is: Delivers live play-by-play, rosters and official statistics used for analytics, highlights and broadcast graphics.
        who_uses_it: Analytics, Broadcast and Content teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds of events/sec during games
            interval: Continuous during events
      - name: Social Listening APIs
        icon: observ
        summary: Brand mention and sentiment feeds for sponsorship and crisis monitoring.
        category: Social Listening & Sentiment
        what_it_is: Aggregates brand mentions and sentiment across social platforms for sponsorship value and crisis monitoring.
        who_uses_it: Sponsorship, Communications and Digital teams.
        data_out:
          batch:
            types:
              - semi-structured
              - unstructured
            volume: GBs of posts + sentiment
            interval: Continuous / hourly
      - name: Rights Holder Metadata
        icon: zplug
        summary: Media rights windows and blackout rules from league partners.
        category: Media Rights Metadata
        what_it_is: Supplies media-rights windows and blackout rules from league partners that govern where content may air.
        who_uses_it: Media rights, Broadcast operations and Legal teams.
        data_out:
          batch:
            types:
              - structured
            volume: sub-GB
            interval: On schedule updates
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Ownership & Executive
        mark: Genie One
        summary: The CEO on revenue per fan and matchday P&L; the COO on ingress throughput, concessions flow and the safety record across the venue.
        uses:
          - - Genie One
            - Last home stand yield without analyst delay.
          - - AI/BI
            - Attendance and sponsorship ROI on Metric Views.
        sub:
          - name: CEO / Team President
            cares: revenue per fan, matchday P&L and the trade between winning and margin.
          - name: CFO
            cares: gate, media and sponsorship revenue against the cost of running the venue.
          - name: Chief Commercial Officer
            cares: sponsorship value, premium inventory and the growth of the fan base.
        ucs:
          - Sponsorship ROI
          - Dynamic Ticket Pricing
          - Event Attendance & Revenue
          - Merchandise Forecast
      - name: Ticketing & Pricing
        mark: Model Serving
        summary: Pricing analysts on dynamic seat tiers, secondary-market pressure and sell-through pace against the demand curve before and during on-sale.
        uses:
          - - Pricing Workbench
            - Demand forecast before on-sale.
          - - Model Serving
            - Price models in the on-sale path.
        sub:
          - name: Head of Ticketing
            cares: sell-through pace, sections at risk and the on-sale calendar.
          - name: Pricing Analyst
            cares: dynamic seat tiers and secondary-market pressure against the demand curve.
          - name: Yield Manager
            cares: premium and dynamic inventory value across the season.
        ucs:
          - Dynamic Ticket Pricing
          - Event Attendance & Revenue
          - Fan Churn Prediction
      - name: Fan Engagement
        core: true
        mark: CustomerLake
        summary: CRM teams on membership growth, churn before renewal and personalised offers scored on spend stitched across ticketing and concessions.
        uses:
          - - Fan 360 Console
            - Spend stitched across ticketing and concessions.
          - - CustomerLake
            - Segments without a separate CDP.
        sub:
          - name: CRM Director
            cares: membership growth, renewals and churn before the renewal window.
          - name: Digital & Content
            cares: app engagement, highlights reach and personalised offers.
          - name: Membership Services
            cares: the season-ticket experience and the value each fan sees.
        ucs:
          - Fan Churn Prediction
          - OTT Personalization
          - Broadcast Highlights
          - Fan Cross-Sell & Upsell
      - name: Game-Day Ops
        mark: Lakehouse//RT
        summary: Venue managers and medical staff on ingress flow, queue times, player load and incidents, moving crews before a bottleneck becomes a delay.
        uses:
          - - Game-Day Command
            - Live scans and queue times on one screen.
          - - Load Management Hub
            - Player workload before selection.
        sub:
          - name: VP Venue Operations
            cares: ingress throughput, concessions flow and the safety record.
          - name: Head of Security
            cares: crowd density, incidents and evacuation readiness.
          - name: Head of Performance / Medical
            cares: player load, injury risk and availability for selection.
        ucs:
          - Crowd Safety Analytics
          - Concessions Optimization
          - Event Attendance & Revenue
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land ticketing scans, POS folios, wearable tracking and CRM feeds; own Bronze to Silver and the pager when a game-day attendance table stalls.
        uses:
          - - Lakeflow Connect
            - Managed connectors for ticketing, CRM and POS sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on scan and tracking feeds.
          - - Lakewatch
            - Freshness on the attendance tables commercial reads on game day.
        sub:
          - name: Streaming Engineer
            cares: scan, POS and tracking feeds landed at game-day latency.
          - name: Pipeline Engineer
            cares: Bronze-to-Silver reliability and expectations on attendance tables.
          - name: Platform Engineer
            cares: freshness and the pager when a game-day table stalls.
        ucs:
          - Crowd Safety Analytics
          - Concessions Optimization
          - Dynamic Ticket Pricing
      - name: Data Scientists
        mark: MLflow
        summary: Dynamic-pricing, fan-churn, injury-risk and highlight-selection models, and whether they still hold as rosters, opponents and demand shift.
        uses:
          - - Feature Store
            - Fan and athlete features read identically in training and serving.
          - - MLflow
            - Every pricing and load experiment tracked for audit.
          - - Model Serving
            - Price and risk models scored in the on-sale and coaching path.
        sub:
          - name: Pricing Scientist
            cares: demand and dynamic-pricing models that hold across opponents.
          - name: Fan & Churn Scientist
            cares: churn, propensity and offer-scoring models across channels.
          - name: Sports Scientist
            cares: injury-risk and load models against wearable and tracking data.
        ucs:
          - Dynamic Ticket Pricing
          - Fan Churn Prediction
          - Fan Cross-Sell & Upsell
      - name: App Developers
        mark: Apps
        summary: Ship the Game-Day Command, Pricing Workbench and Fan 360 apps commercial and venue teams work in, next to governed ticketing data.
        uses:
          - - Apps
            - Venue screens with no separate web tier to secure.
          - - Lakebase
            - Serverless Postgres for offer and incident state writes.
          - - Agent Bricks
            - Agents that draft offers against governed tools.
        sub:
          - name: Apps Engineer
            cares: the Game-Day Command, Pricing Workbench and Fan 360 screens.
          - name: Backend Engineer
            cares: offer and incident state on serverless Postgres.
          - name: Agent Engineer
            cares: agents that draft offers against governed ticketing tools.
        ucs:
          - Concessions Optimization
          - Dynamic Ticket Pricing
          - OTT Personalization
