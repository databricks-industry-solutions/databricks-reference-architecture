      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Category Growth Agent
        icon: genie
        summary: Ask about market share, distribution and category performance in plain language.
        feeds:
          - NielsenIQ Connect
          - Circana Liquid Data
          - Circana Market Advantage
          - Shipments, share, promo ROI
        teams:
          - Brand & Category
          - Sales & Accounts
          - Demand Planning
        questions:
          - What is our market share by category and channel this period?
          - Which brands are gaining and losing distribution points?
          - How does consumption compare to shipments by market?
          - Which price-pack tiers are trading up or down?
          - Where is the category growing fastest by geography?
      - name: Trade Spend Agent
        icon: genie
        summary: Explore promo lift, incrementality and trade-spend ROI by event and retailer.
        feeds:
          - SAP TPM
          - Blacksmith TPM
          - Circana Market Advantage
        teams:
          - Trade Marketing
          - Sales & Accounts
          - Brand & Category
        questions:
          - What was the ROI of last quarter's promotions by retailer?
          - Which events drove incremental volume versus base?
          - How much trade spend is accrued but unsettled?
          - Which mechanics deliver the best lift by category?
          - Where are we overspending on promotions that don't pay back?
      - name: Demand & Supply Agent
        icon: genie
        summary: Answer forecast accuracy, service level and inventory questions across the network.
        feeds:
          - o9 Demand Planning
          - Kinaxis Maestro
          - SAP IBP / S/4
          - Conformed products and markets
        teams:
          - Demand Planning
          - Supply Chain
          - Sales & Accounts
        questions:
          - Where is forecast bias worst by SKU-region?
          - What is case fill rate and OTIF by DC and customer?
          - Which SKUs are at risk of stockout this cycle?
          - What is days of inventory by brand and site?
          - Where should scarce supply be allocated first?
      - name: Retail Execution Agent
        icon: genie
        summary: Ask about perfect-store, on-shelf availability and deductions across banners.
        feeds:
          - Salesforce Consumer Goods
          - Amazon Vendor Central
          - Vistex GTM
        teams:
          - Sales & Accounts
          - Trade Marketing
          - Brand & Category
        questions:
          - What is our perfect-store score by banner?
          - Which stores have the worst on-shelf availability?
          - How many deductions are recoverable with shipment proof?
          - Which retailers show the most distribution voids?
          - Where is retail-media spend tied to real sell-through?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Demand Forecasting
        short: Planning
        icon: chart
        summary: ML forecasts refreshed with syndicated and weather signals.
        problem: Forecasts run on stale shipment history in spreadsheets, so sales, finance and supply each defend a different number and stockouts and overstocks appear before anyone trusts the plan.
        who_benefits: Demand Planning
        how_built: Syndicated scan, POS and weather signals land through Lakeflow, features are engineered in Feature Store and scored in Model Serving into the Consensus Forecast plan.
        components:
          - Consensus Forecast
          - Model Serving
          - MLflow
          - Feature Store
          - NielsenIQ Connect
        stories:
          - title: Unilever transforms with AI
            url: https://www.databricks.com/customers/unilever
          - title: Mondelēz facilitates model experimentation at enterprise scale
            url: https://www.databricks.com/customers/mondelez
      - name: Trade Promotion ROI
        short: Marketing
        icon: partner
        summary: Promo events evaluated on estimated incrementality.
        problem: Trade spend is the second-largest line on the P&L, yet promo results are judged on gross lift, so teams keep funding events that simply pulled forward volume they would have sold anyway.
        who_benefits: Trade Marketing
        how_built: Promo calendars, shipments and syndicated scan are conformed on Delta Lake and decomposed with Model Serving, so the Promo ROI Analyzer shows estimated incrementality against a modeled baseline on certified AI/BI views.
        components:
          - Promo ROI Analyzer
          - SAP TPM
          - Model Serving
          - AI/BI
          - Delta Lake
        stories:
          - title: How modern retailers and CPG brands win together
            url: https://www.databricks.com/blog/collaboration-advantage-how-modern-retailers-and-cpg-brands-win-together
          - title: Mars Wrigley scales global insights
            url: https://www.databricks.com/customers/mars-wrigley
      - name: Identity Resolution & CDP
        short: Consumer data
        icon: custlake
        summary: First-party consumer identities unified into one governed profile.
        problem: D2C sites, loyalty programs and household panels each hold a slice of the consumer, so the same person is counted many times and the brand never sees a single, consented view to activate on.
        who_benefits: Brand & Category
        how_built: First-party D2C and loyalty records with consent history are resolved on Delta Lake under Unity Catalog into governed Data Products, giving one consented consumer profile brand teams activate to authorized destinations; Circana household panels enrich segments at household level rather than proving identity.
        components:
          - Delta Lake
          - Unity Catalog
          - Data Products
          - Circana Liquid Data
          - Salesforce Consumer Goods
      - name: Shopper Segmentation
        short: Marketing
        icon: people
        summary: Households clustered by behaviour to target activation and innovation.
        problem: Brands market to broad demographics because behavioural segments live in agency decks and one-off studies, so activation, assortment and innovation all aim at an average shopper who does not exist.
        who_benefits: Trade Marketing
        how_built: Household-panel and consumption data from Circana Liquid Data and NielsenIQ Connect feed clustering features in Feature Store scored in Model Serving, so governed household segments surface in AI/BI for permitted audience activation.
        components:
          - Circana Liquid Data
          - NielsenIQ Connect
          - Feature Store
          - Model Serving
          - AI/BI
      - name: Price Pack Architecture
        short: Strategy
        icon: product
        summary: SKU mix optimized by channel and elasticity.
        problem: Pack sizes and price points drift per market with no view of elasticity, so a change meant to protect margin quietly trades down shoppers or hands share to a cheaper competitor.
        who_benefits: Brand & Category
        how_built: Syndicated consumption from Circana Liquid Data feeds elasticity features in Feature Store and simulations in Model Serving, so brand teams size price-pack moves by channel in AI/BI.
        components:
          - Circana Liquid Data
          - Model Serving
          - AI/BI
          - Feature Store
          - Delta Lake
        stories:
          - title: Mondelēz facilitates model experimentation at enterprise scale
            url: https://www.databricks.com/customers/mondelez
      - name: Retail Media Networks
        short: Digital
        icon: market
        summary: Retail media spend tied to sell-through outcomes.
        problem: Retail media budgets grow every year, but spend on retailer platforms is reported in each retailer's walled garden, so nobody can tie an impression to real sell-through and true return.
        who_benefits: Trade Marketing
        how_built: Advertising measurement data from Instacart Ads & Data is conformed on Delta Lake and joined to sell-through, so attributed ROAS and estimated incremental sales are distinguished in AI/BI and Model Serving, with Amazon Vendor Central supplying purchase-order and traffic context.
        components:
          - Instacart Ads & Data
          - Amazon Vendor Central
          - AI/BI
          - Model Serving
          - Delta Lake
        stories:
          - title: How modern retailers and CPG brands win together
            url: https://www.databricks.com/blog/collaboration-advantage-how-modern-retailers-and-cpg-brands-win-together
          - title: Heineken brews better decisions with data and AI
            url: https://www.databricks.com/customers/heineken-international
      - name: Joint Demand Planning
        short: Collaboration
        icon: share
        summary: Retailer POS shared into one collaborative forecast through governed access.
        problem: Retailers hold the real sell-out signal but share it as late spreadsheets, so the manufacturer plans on shipments that lag true demand and both sides carry the cost of the gap.
        who_benefits: Demand Planning
        how_built: Retailer POS is shared through Delta Sharing into the Consensus Forecast, so joint forecasts run on governed sell-out with governed access that reduces bespoke extracts, consuming o9 Demand Planning forecast outputs rather than porting its models.
        components:
          - Consensus Forecast
          - Delta Sharing
          - o9 Demand Planning
          - Model Serving
          - Delta Lake
      - name: New Product Intro
        short: Innovation
        icon: ztarget
        summary: Launch curves tracked against distribution targets.
        problem: A launch gets one shot at the shelf, yet distribution, velocity and cannibalization are tracked in separate reports, so a stalling SKU is spotted only after the reset window has closed.
        who_benefits: Brand & Category
        how_built: Syndicated scan from NielsenIQ Connect is joined to shipments and scored in Model Serving, so launch curves against distribution targets surface in AI/BI and Genie One for brand teams.
        components:
          - NielsenIQ Connect
          - Model Serving
          - AI/BI
          - Genie One
          - Delta Lake
      - name: Employee Knowledge Agent
        short: Productivity
        icon: genie
        summary: An internal assistant answering brand, promo and supply questions from governed data.
        problem: Analysts and field reps lose hours hunting across syndicated reports, promo systems and planning tools for answers, and the knowledge walks out the door when an expert leaves.
        who_benefits: Sales & Accounts
        how_built: Genie Agents answer natural-language questions over governed share, promo and supply Data Products, so authorized employees get a cited answer without waiting on an analyst.
        components:
          - Genie Agents
          - Unity Catalog
          - Data Products
          - Databricks Apps
        stories:
          - title: Grupo Bimbo delivers insights with Agent Bricks
            url: https://www.databricks.com/dataaisummit/session/beyond-dashboards-how-grupo-bimbo-delivers-insights-databricks
      - name: Inventory Optimization
        short: Finance
        icon: chart
        summary: Safety stock right-sized by service and cost.
        problem: Safety stock is set by a flat rule of thumb, so cash is tied up in slow SKUs while the fast movers still stock out, and no one can see the trade between service level and working capital.
        who_benefits: Supply Chain
        how_built: Demand, lead-time and service signals from o9 Demand Planning feed optimization models in Model Serving on Lakehouse//RT, so the Supply Command app right-sizes safety stock by SKU.
        components:
          - Supply Command
          - o9 Demand Planning
          - Model Serving
          - Lakehouse//RT
          - MLflow
        stories:
          - title: Unilever transforms with AI
            url: https://www.databricks.com/customers/unilever
          - title: Mondelēz facilitates model experimentation at enterprise scale
            url: https://www.databricks.com/customers/mondelez
