name: Consumer Goods
description: 'For a CPG manufacturer: demand planning, trade promotion, retail execution and supply chain across brands and categories, from plant to shelf.'
sources:
  - name: ERP & Manufacturing
    icon: erp
    simplified: 2
    tiles:
      - name: SAP IBP / S/4
        icon: erp
        summary: Demand, supply and production planning with financials.
        citations:
          - sap-ibp
        category: ERP / Integrated Business Planning
        what_it_is: Holds the shipment, order and financial system of record and runs integrated demand, supply and production planning across the network.
        who_uses_it: Demand Planning, Supply Chain and Finance teams.
        data_out:
          batch:
            types:
              - structured
            volume: 50-200 GB/day
            interval: Nightly close + hourly deltas
          stream:
            types:
              - semi-structured
            volume: hundreds of events/sec
            interval: Continuous CDC
      - name: Oracle JD Edwards
        icon: erp
        summary: Batch manufacturing, lot trace and DSD routes.
        citations:
          - jde
        category: Manufacturing ERP System
        what_it_is: Runs batch manufacturing, lot traceability and direct-store-delivery routing, emitting production and shipment records.
        who_uses_it: Manufacturing, Logistics and DSD Operations teams.
        data_out:
          batch:
            types:
              - structured
            volume: 10-50 GB/day
            interval: Nightly batch
      - name: Kinaxis Maestro
        icon: sheet
        summary: Concurrent planning and scenario simulation.
        citations:
          - kinaxis
        category: Supply Chain Planning Platform
        what_it_is: Runs concurrent supply-and-demand planning and scenario simulation so planners test allocation and service before committing.
        who_uses_it: Supply Planners, S&OP and Demand Planning teams.
        data_out:
          batch:
            types:
              - structured
            volume: 5-20 GB/day
            interval: Daily + scenario runs
  - name: Retail & Syndicated
    icon: market
    tiles:
      - name: NielsenIQ Connect
        icon: market
        summary: Syndicated scan and market share by category.
        citations:
          - nielseniq
        category: Syndicated Market Data Provider
        what_it_is: Supplies syndicated scan and market-share reads by category so brand and sales teams track share against competitors.
        who_uses_it: Brand & Category, Sales & Accounts and Insights teams.
        data_out:
          batch:
            types:
              - structured
            volume: 2-10 GB/week
            interval: Weekly / monthly syndicated feed
      - name: Circana Liquid Data
        icon: chart
        summary: Omni-channel consumption and household panels.
        citations:
          - circana
        category: Consumer Panel / Consumption Data
        what_it_is: Provides omni-channel consumption and household-panel data used for elasticity, price-pack and demand analytics.
        who_uses_it: Brand & Category, Revenue Management and Insights teams.
        data_out:
          batch:
            types:
              - structured
            volume: 2-8 GB/week
            interval: Weekly feed
      - name: Circana Market Advantage
        icon: market
        summary: Promo decomposition and competitive tracking.
        citations:
          - iri
        category: Syndicated Promotion Analytics
        what_it_is: Decomposes promotions and tracks competitive activity so trade teams see true lift versus baseline by event.
        who_uses_it: Trade Marketing, Revenue Management and Category teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/week
            interval: Weekly feed
  - name: Trade Promotion
    icon: partner
    tiles:
      - name: SAP TPM
        icon: partner
        summary: Promo planning, accruals and settlement.
        citations:
          - sap-tpm
        category: Trade Promotion Management (TPM)
        what_it_is: Plans promotions, manages accruals and settles trade spend, the system of record for promotional events and funding.
        who_uses_it: Trade Marketing, Revenue Management and Finance teams.
        data_out:
          batch:
            types:
              - structured
            volume: 2-8 GB/day
            interval: Daily + settlement cycles
      - name: Vistex GTM
        icon: market
        summary: Chargebacks, rebates and contract compliance.
        citations:
          - vistex
        category: Pricing & Rebate Management System
        what_it_is: Manages chargebacks, rebates and contract compliance so deductions can be matched to shipment and promo proof.
        who_uses_it: Sales & Accounts, Revenue Management and Finance teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Daily batch
      - name: Blacksmith TPM
        icon: chart
        summary: ROI analytics and post-event evaluation.
        citations:
          - blacksmith
        category: Trade Promotion Analytics
        what_it_is: Runs ROI analytics and post-event evaluation so trade teams learn which promotions actually paid for themselves.
        who_uses_it: Trade Marketing and Revenue Growth Management teams.
        data_out:
          batch:
            types:
              - structured
            volume: GBs/day
            interval: Daily + post-event runs
  - name: Field & DSD
    icon: stream
    simplified: 3
    tiles:
      - name: Salesforce Consumer Goods
        icon: custlake
        summary: Retail visits, audits and perfect store scores.
        citations:
          - sf-cg
        category: Retail Execution / Field Sales CRM
        what_it_is: Captures retail visits, store audits and perfect-store scores from the field, the base for retail-execution analytics.
        who_uses_it: Field Sales, Sales & Accounts and Shopper Marketing teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Hourly / nightly sync
          stream:
            types:
              - semi-structured
            volume: tens of events/sec
            interval: Continuous visit events
      - name: Körber WMS
        core: true
        icon: stream
        summary: Warehouse picking and DSD route sequencing.
        citations:
          - highjump
        category: Warehouse Management System (WMS)
        what_it_is: Runs warehouse picking and direct-store-delivery route sequencing, emitting the movement and route events behind service levels.
        who_uses_it: DC Operations, Logistics and DSD teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds of events/sec
            interval: Continuous movement events
      - name: o9 Demand Planning
        icon: sheet
        summary: Statistical and ML forecasts by SKU-region.
        citations:
          - o9
        category: Demand Planning Platform
        what_it_is: Generates statistical and ML forecasts by SKU-region, feeding the consensus plan and safety-stock optimization.
        who_uses_it: Demand Planners, Supply Chain and Forecast Analytics teams.
        data_out:
          batch:
            types:
              - structured
            volume: 2-10 GB/day
            interval: Daily plan runs
  - name: E-commerce
    icon: apps
    tiles:
      - name: Amazon Vendor Central
        icon: partner
        summary: Purchase orders, chargebacks and traffic.
        citations:
          - amazon-vc
        category: E-Retail Vendor Platform
        what_it_is: Supplies purchase orders, chargebacks and traffic from Amazon so teams tie e-retail spend to sell-through and deductions.
        who_uses_it: E-commerce, Sales & Accounts and Retail Media teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 1-5 GB/day
            interval: Daily reports + hourly POs
      - name: Instacart Ads & Data
        icon: product
        summary: Retail media and basket insights.
        citations:
          - instacart
        category: Retail Media Platform
        what_it_is: Provides retail-media performance and basket insights so shopper-marketing spend can be tied to real sell-through.
        who_uses_it: Shopper Marketing, Trade Marketing and E-commerce teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: GBs/day
            interval: Daily feed
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Finance Close Mart
        icon: fed
        summary: Trade spend accrual marts queried in place under Unity Catalog.
        category: Enterprise Data Warehouse
        what_it_is: Trade-spend accrual and close marts kept in the incumbent warehouse and queried in place through federation instead of being copied.
        who_uses_it: Finance, Revenue Management and Accounting analysts.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale historical marts
            interval: Queried on demand (federated)
  - name: Data Formats
    icon: zbraces
    tiles:
      - name: 'EANCOM'
        icon: zbraces
        fmt: 'EANC'
        summary: 'GS1 EDIFACT subset for orders, dispatch advices and invoices between CPG and retail.'
        spec_url: https://www.gs1.org/standards/edi
      - name: 'GS1 XML'
        icon: zbraces
        fmt: 'GS1X'
        summary: 'GS1 XML business messages for order-to-cash and master-data exchange.'
        spec_url: https://www.gs1.org/standards/edi-xml
        spark_connector: 'spark-xml'
        spark_repo: https://github.com/databricks/spark-xml
        databricks_resource: https://docs.databricks.com/aws/en/query/formats/xml
        source_systems:
          - 'SAP'
          - '1WorldSync'
          - 'GS1 GDSN'
      - name: 'EPCIS'
        icon: zbraces
        fmt: 'EPC'
        summary: 'GS1 event standard for supply-chain visibility and item traceability.'
        spec_url: https://www.gs1.org/standards/epcis
      - name: 'GDSN'
        core: true
        icon: zbraces
        fmt: 'GDSN'
        summary: 'Global Data Synchronisation Network catalogue messages for trusted product master data.'
        spec_url: https://www.gs1.org/services/gdsn
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    tiles:
      - name: Weather Source
        icon: stream
        summary: Weather-driven demand signals by market.
        citations:
          - weather-source
        category: External Signal / Weather Feed
        what_it_is: Supplies weather-driven demand signals by market as an exogenous input to the demand forecast.
        who_uses_it: Demand Planning and Forecast Analytics teams.
        data_out:
          batch:
            types:
              - structured
            volume: MBs-GBs/day
            interval: Daily forecast refresh
      - name: USDA ERS Food Data
        icon: api
        summary: Commodity input cost indices for margin planning.
        citations:
          - usda-ers
        category: Commodity / Economic Data Source
        what_it_is: Provides commodity input-cost indices consumed inbound for margin and price-pack planning.
        who_uses_it: Revenue Management, Finance and Procurement teams.
        data_out:
          batch:
            types:
              - structured
            volume: MBs/month
            interval: Monthly index release
      - name: Google Trends
        icon: observ
        summary: Search interest proxies for emerging demand.
        citations:
          - google-trends
        category: Search Interest Signal
        what_it_is: Supplies search-interest proxies used as an early signal for emerging demand and innovation tracking.
        who_uses_it: Brand & Category and Category Insights teams.
        data_out:
          batch:
            types:
              - semi-structured
            volume: MBs/day
            interval: Daily / weekly pulls
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Brand & Category
        mark: Genie One
        summary: The CEO on category share and innovation pipeline; the CFO on trade-spend efficiency and gross margin against promo ROI.
        uses:
          - - Genie One
            - Ask what last promo's ROI was by retailer.
          - - AI/BI
            - Share and margin on certified Metric Views.
          - - Unity Catalog
            - One SKU definition across syndicated and ERP.
        sub:
          - name: Chief Marketing Officer
            cares: category share, brand equity and the innovation pipeline across the portfolio.
          - name: CFO & Revenue Growth
            cares: gross margin, trade-spend efficiency and price-pack economics by brand.
          - name: Category Insights
            cares: shopper trends and where the category is growing by channel.
        ucs:
          - Price Pack Architecture
          - New Product Intro
          - Retail Media Networks
          - Identity Resolution & CDP
      - name: Sales & Accounts
        mark: AI/BI
        summary: Joint business plans, distribution and perfect store execution, judged on market share, on-shelf availability and distribution points.
        uses:
          - - Perfect Store Scorecard
            - On-shelf availability and compliance by banner.
          - - AI/BI
            - Sell-through and share on governed syndicated data.
        sub:
          - name: National Account Managers
            cares: joint business plans, distribution and deductions with each retailer.
          - name: Field Sales Leadership
            cares: on-shelf availability and perfect store execution across banners.
          - name: Revenue Management
            cares: chargeback recovery and net revenue by customer.
        ucs:
          - Trade Promotion ROI
          - Retail Media Networks
          - Employee Knowledge Agent
      - name: Demand Planning
        mark: Model Serving
        summary: Statistical forecasts, consensus and supply alignment, tracked on forecast accuracy, bias and consensus attainment by SKU-region.
        uses:
          - - Consensus Forecast
            - Sales and finance aligned on one number.
          - - Model Serving
            - ML forecasts in the planning path.
        sub:
          - name: Demand Planners
            cares: statistical baseline, consensus and forecast accuracy by SKU-region.
          - name: S&OP Lead
            cares: one number aligning sales, finance and supply each cycle.
          - name: Forecast Analytics
            cares: bias, error and the demand signals that move the plan.
        ucs:
          - Demand Forecasting
          - Inventory Optimization
          - New Product Intro
          - Joint Demand Planning
      - name: Trade Marketing
        mark: Apps
        summary: Promo design, accrual management and post-event analytics, measured on promo lift, incrementality and trade-spend ROI.
        uses:
          - - Promo ROI Analyzer
            - Lift and incrementality by event.
          - - Apps
            - Field audit apps on governed visit data.
        sub:
          - name: Trade Marketing Managers
            cares: promo design, mechanics and accruals by event and retailer.
          - name: Shopper Marketing
            cares: retail media and in-store activation tied to sell-through.
          - name: Revenue Growth Management
            cares: incrementality and trade-spend ROI across the plan.
        ucs:
          - Trade Promotion ROI
          - Retail Media Networks
          - Shopper Segmentation
      - name: Supply Chain
        core: true
        mark: Lakehouse//RT
        summary: Service levels, inventory and production scheduling, run on OTIF, case fill rate and days of inventory against demand across DCs and SKUs.
        uses:
          - - Supply Command
            - OTIF and fill rate by DC and SKU.
          - - Lakehouse//RT
            - Inventory positions at operational latency.
        sub:
          - name: Supply Planners
            cares: service levels, allocation and days of inventory across DCs.
          - name: Logistics & DSD
            cares: OTIF, fill rate and route execution to the store.
          - name: Sustainability Ops
            cares: packaging, sourcing and emissions by brand and site.
        ucs:
          - Inventory Optimization
          - Joint Demand Planning
          - Demand Forecasting
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land ERP shipments, retailer POS, syndicated scan and promo calendars; own Bronze to Silver and the pager when the share and promo tables stall.
        uses:
          - - Lakeflow Connect
            - Managed connectors for ERP, TPM and syndicated-data sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on shipment and scan feeds.
          - - Lakewatch
            - Freshness on the share and promo tables account teams read weekly.
        sub:
          - name: Ingestion Engineers
            cares: ERP shipments, retailer POS and syndicated scan landed on time.
          - name: Pipeline Owners
            cares: Bronze to Silver and the pager when share and promo tables stall.
          - name: Data Quality
            cares: expectations on shipment, scan and promo feeds before they publish.
        ucs:
          - Demand Forecasting
          - Trade Promotion ROI
          - Identity Resolution & CDP
      - name: Data Scientists
        mark: MLflow
        summary: Demand-forecast, promo-lift and price-pack elasticity models, and whether they still hold across a new innovation launch and channel shift.
        uses:
          - - Feature Store
            - SKU and market features read identically in training and serving.
          - - MLflow
            - Every forecast and lift model tracked for audit and reproduction.
          - - Model Serving
            - Forecast and lift models scored in the planning path.
        sub:
          - name: Forecasting Scientists
            cares: demand, elasticity and promo-lift models across launches and channels.
          - name: Optimization Scientists
            cares: allocation and safety-stock models under service and cost constraints.
          - name: MLOps
            cares: every forecast and lift model tracked for audit and reproduction.
        ucs:
          - Demand Forecasting
          - Price Pack Architecture
          - Inventory Optimization
          - Shopper Segmentation
      - name: App Developers
        mark: Apps
        summary: Ship the perfect store scorecard, consensus forecast, promo ROI analyzer and supply command apps sales and planning work in, next to governed SKU data.
        uses:
          - - Apps
            - Field and planning screens with no separate web tier to secure.
          - - Lakebase
            - Serverless Postgres for audit and accrual state.
          - - Agent Bricks
            - Agents that draft promo and allocation moves against governed tools.
        sub:
          - name: Frontend Engineers
            cares: perfect store, consensus and promo ROI screens next to governed data.
          - name: Backend Engineers
            cares: Lakebase state for audits, accruals and allocation writeback.
          - name: Agent Builders
            cares: agents that draft promo and allocation moves against governed tools.
        ucs:
          - Employee Knowledge Agent
          - Retail Media Networks
          - Trade Promotion ROI
