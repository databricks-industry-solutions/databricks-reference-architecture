  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Response Times
        short: Dispatch performance
        icon: stream
        summary: 'Response time attacked end to end: call-taking, dispatch and travel measured by call type and beat so the delay is moved before the standard is missed, not explained after.'
        problem: Response time is reported monthly and in aggregate, so a beat that is slipping is discovered weeks late and the call-taking, dispatch and travel components are never separated to see where the time actually goes.
        who_benefits: Patrol Ops
        how_built: CAD and 911 call events stream into Lakehouse//RT and are conformed to certified Metric Views; the Response Time Board flags calls holding in queue so supervisors move units before the standard is missed.
        components:
          - Response Time Board
          - Lakehouse//RT
          - Tyler Enterprise CAD
          - AI/BI
          - Esri ArcGIS
        stories:
          - title: Databricks for state & local public safety
            url: https://www.databricks.com/solutions/industries/state-local-government
          - title: 'Public sector: real-time emergency response'
            url: https://www.databricks.com/solutions/industries/public-sector
      - name: Real-Time Crime
        short: Live common picture
        icon: gauge
        summary: A real-time crime centre that fuses 911 and CAD calls, cameras, ALPR reads and gunshot alerts into one live picture so operators guide officers on current ground truth.
        problem: When a call comes in, operators piece the picture together from separate systems, cameras, ALPR, 911 and CAD that do not talk, so officers arrive with less context than the data already holds.
        who_benefits: Patrol Ops
        how_built: Call, camera, ALPR and gunshot feeds land in Lakehouse//RT and are fused on a map in the RTCC Cockpit; proximity and risk models in Model Serving surface the feeds that matter for each call.
        components:
          - RTCC Cockpit
          - Lakehouse//RT
          - ShotSpotter Alerts
          - Flock Safety ALPR
          - Model Serving
        stories:
          - title: 'Telefónica Tech: predictive policing on Databricks Genie'
            url: https://www.databricks.com/blog/transforming-industries-conversational-ai-partner-solutions-built-databricks-genie
          - title: Databricks for state & local public safety
            url: https://www.databricks.com/solutions/industries/state-local-government
      - name: Crime Analytics
        short: Hotspots & patterns
        icon: chart
        summary: Linking incidents into patterns and hotspots across records and calls for service so deployment is driven by where and when crime actually concentrates, with plain-language questions instead of a monthly report.
        problem: Crime patterns hide across records, calls for service and partner data that rarely sit together, so hotspots and series are spotted late and deployment lags the trend.
        who_benefits: Investigations
        how_built: RMS and calls-for-service data are conformed under Unity Catalog; hotspot and pattern models score in Model Serving and analysts ask questions in Genie against certified data.
        components:
          - Mark43 RMS
          - AI/BI
          - Model Serving
          - Esri ArcGIS
          - Genie One
        stories:
          - title: 'Telefónica Tech: predictive policing on Databricks Genie'
            url: https://www.databricks.com/blog/transforming-industries-conversational-ai-partner-solutions-built-databricks-genie
          - title: ArcGIS GeoAnalytics Engine on Databricks
            url: https://www.databricks.com/blog/2022/12/07/arcgis-geoanalytics-engine-databricks.html
      - name: Evidence Search
        short: Video & case search
        icon: media
        summary: Making hours of body-worn and in-car video, case notes and reports searchable by what was said and indexed in metadata, with redaction and disclosure tracked so evidence reaches court on time.
        problem: Digital evidence piles up faster than anyone can review it, and finding the moment that matters means scrubbing hours of video by hand while disclosure deadlines run.
        who_benefits: Investigations
        how_built: Evidence metadata and transcripts are governed in Unity Catalog; AI Functions transcribe and summarise while AI Search finds the moment across the case, surfaced in the Evidence Finder.
        components:
          - Evidence Finder
          - Axon Evidence
          - AI Functions
          - AI Search
          - Unity Catalog
        stories:
          - title: Databricks for state & local public safety
            url: https://www.databricks.com/solutions/industries/state-local-government
      - name: ALPR & BOLO
        short: Plate reads & alerts
        icon: network
        summary: Turning ALPR reads and BOLOs into timely leads, matching plate reads against wanted and missing-person lists and pushing alerts to the field before the vehicle is gone.
        problem: ALPR reads and watch-list hits sit in systems that do not share context, so cross-system enrichment and follow-up on a wanted or missing-person lead can lag or fall between agencies.
        who_benefits: Investigations
        how_built: Plate reads land in Lakehouse//RT and match against governed watch-lists in Model Serving; hits push to the field through BOLO & Alerts with evidence linked in Genetec Clearance.
        components:
          - Flock Safety ALPR
          - Model Serving
          - Lakehouse//RT
          - BOLO & Alerts
          - Genetec Clearance
        stories:
          - title: Databricks for state & local public safety
            url: https://www.databricks.com/solutions/industries/state-local-government
      - name: Officer Safety
        short: Responder telemetry
        icon: iot
        summary: Bringing first-responder location, status and telemetry together over broadband so a supervisor sees a responder in trouble and moves backup before a check-in is missed.
        problem: Officer status lives on the radio and in the supervisor's head, so a responder in trouble is noticed when a check-in is missed rather than when the signals first turn.
        who_benefits: Patrol Ops
        how_built: Responder endpoint status and AVL location events carried over FirstNet stream into Lakehouse//RT; models surface supervisor-facing risk indicators in Model Serving so supervisors move backup before a check-in is missed.
        components:
          - FirstNet Broadband
          - AVL Telemetry
          - Lakehouse//RT
          - Model Serving
          - Lakeflow
        stories:
          - title: 'Public sector: safer communities with real-time AI'
            url: https://www.databricks.com/solutions/industries/public-sector
      - name: EMS Demand
        short: Ambulance deployment
        icon: iot
        summary: Forecasting calls for service by hour and location so ambulances and crews are staged where the next call will fall instead of chasing it across the service area.
        problem: Ambulances are posted on static plans, so crews are in the wrong place when demand shifts and response intervals stretch on exactly the calls that matter most.
        who_benefits: Fire & EMS
        how_built: ePCR and historical call data are conformed with weather and event features; demand models score in Model Serving and the EMS Demand Planner recommends staging by hour and post.
        components:
          - EMS Demand Planner
          - ImageTrend ePCR
          - Model Serving
          - AI/BI
          - Esri ArcGIS
        stories:
          - title: ArcGIS GeoAnalytics Engine on Databricks
            url: https://www.databricks.com/blog/2022/12/07/arcgis-geoanalytics-engine-databricks.html
          - title: 'Public sector: real-time emergency response'
            url: https://www.databricks.com/solutions/industries/public-sector
      - name: Fire Risk
        short: Risk-based inspection
        icon: gauge
        summary: Scoring the building stock on fire risk from inspection, incident and property history so prevention targets the properties most likely to burn, not just the ones due on the calendar.
        problem: Inspections run on fixed cycles and complaints, so high-risk properties that have quietly slipped the queue keep slipping until an incident finds them first.
        who_benefits: Fire & EMS
        how_built: Inspection, incident and property records are unified under Unity Catalog; a risk model tracked in MLflow scores each property in Model Serving so First Due inspections target the highest risk.
        components:
          - First Due Fire
          - Model Serving
          - AI/BI
          - Esri ArcGIS
          - MLflow
        stories:
          - title: ArcGIS GeoAnalytics Engine on Databricks
            url: https://www.databricks.com/blog/2022/12/07/arcgis-geoanalytics-engine-databricks.html
          - title: Databricks for state & local public safety
            url: https://www.databricks.com/solutions/industries/state-local-government
      - name: Disaster Response
        short: Multi-agency COP
        icon: globe
        summary: A live common operating picture across police, fire, EMS and emergency management in a storm or mass-casualty event, built from the same governed feeds every agency already sends.
        problem: In a disaster the operating picture is stitched together by hand from agency feeds that arrive too late and never agree, exactly when coordination matters most.
        who_benefits: Command Staff
        how_built: Incident, unit, GIS and weather feeds stream into Lakehouse//RT and are mapped against Esri layers; Genie answers situation questions in plain language so agencies act on one picture.
        components:
          - Lakehouse//RT
          - Esri ArcGIS
          - Weather & Traffic
          - AI/BI
          - Lakeflow
        stories:
          - title: 'Slalom LakeSpeak: real-time emergency reports on Databricks'
            url: https://www.databricks.com/blog/transforming-industries-conversational-ai-partner-solutions-built-databricks-genie
          - title: State of Washington builds data-driven government
            url: https://www.databricks.com/customers/state-of-washington
      - name: Use of Force
        short: Accountability
        icon: gavel
        summary: Bringing use-of-force, complaint and early-intervention indicators together so supervisors and internal affairs see a pattern forming while there is still time to intervene.
        problem: Use-of-force and complaint signals sit in separate systems, so an officer trending toward trouble is recognised after an incident rather than in the early-intervention window.
        who_benefits: Prof Standards
        how_built: Use-of-force, complaint and body-worn evidence are conformed under Unity Catalog; early-intervention indicators surface in AI/BI so supervisors act within the window, with the numbers published for transparency.
        components:
          - Axon Evidence
          - AI/BI
          - Unity Catalog
          - Genie One
          - Mark43 RMS
        stories:
          - title: 'Fatal force: analyzing police shootings on Databricks'
            url: https://www.databricks.com/blog/2020/11/16/fatal-force-exploring-police-shootings-with-sql-analytics.html
          - title: Databricks for state & local public safety
            url: https://www.databricks.com/solutions/industries/state-local-government
medallion:
  Bronze:
    short: Raw responder system feeds
    summary: CAD incidents and unit statuses, 911 and NG911 call records, records-management reports, body-worn and in-car video metadata, ALPR reads and ePCR patient-care records landed exactly as received, so any incident or call can be replayed as it stood for court and audit.
  Silver:
    short: Conformed incident, unit, person
    summary: Incidents, units, people, vehicles and locations resolved into single conformed entities across the dispatch, records, evidence and fire/EMS estates, with master names and addresses reconciled and CJIS-controlled records governed under one access model.
  Gold:
    short: Response time, clearance, safety
    summary: 'Contracted products command and oversight run on: response time by call type and beat, case clearance rates, calls-for-service demand by hour and location, use-of-force and early-intervention indicators, and NIBRS, NFIRS and NEMSIS reporting.'
