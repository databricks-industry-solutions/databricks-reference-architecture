name: Public Safety
description: 'Police, fire, EMS and emergency management: computer-aided dispatch and 911 call handling, records and digital evidence, crime analysis, and coordinated multi-agency response.'
sources:
  - name: Dispatch & 911
    icon: stream
    simplified: 4
    tiles:
      - name: Tyler Enterprise CAD
        icon: stream
        summary: 'Enterprise Public Safety computer-aided dispatch: the system of record for calls for service, unit assignment and incident timestamps.'
        citations:
          - tyler-cad
        category: Computer-Aided Dispatch (CAD)
        what_it_is: System of record for calls for service, unit assignment and incident timestamps that a response can be replayed against.
        who_uses_it: Dispatchers, watch commanders and patrol operations.
        data_out:
          batch:
            types:
              - structured
            volume: 5-20 GB/day
            interval: Nightly batch
          stream:
            types:
              - semi-structured
            volume: hundreds of incident events/sec at peak
            interval: Continuous (sub-second)
      - name: Hexagon CAD
        icon: stream
        summary: 'HxGN OnCall Dispatch: incident intake, resource recommendation and unit status used by large agencies and consolidated dispatch centres.'
        citations:
          - hexagon-cad
        category: Computer-Aided Dispatch (CAD)
        what_it_is: Handles incident intake, resource recommendation and unit status for large agencies and consolidated dispatch centres.
        who_uses_it: Consolidated dispatch centre operators and patrol supervisors.
        data_out:
          batch:
            types:
              - structured
            volume: 5-25 GB/day
            interval: Nightly batch
          stream:
            types:
              - semi-structured
            volume: hundreds of events/sec at peak
            interval: Continuous (sub-second)
      - name: Carbyne NG911
        core: true
        icon: dial
        summary: Cloud-native NG911 call handling with caller location and live video, the front door for emergency calls into the CAD estate.
        citations:
          - carbyne
        category: NG911 Call Handling System
        what_it_is: Cloud-native NG911 call handling carrying caller location, live video and call metadata as the front door into the CAD estate.
        who_uses_it: 911 call-takers and dispatch supervisors.
        data_out:
          stream:
            types:
              - semi-structured
              - unstructured
            volume: hundreds of calls/hour + live media
            interval: Continuous (real-time)
      - name: Motorola PremierOne CAD
        icon: stream
        summary: 'Motorola PremierOne computer-aided dispatch: call intake, unit recommendation and incident timestamps, a widely deployed CAD system of record feeding the same incident and unit entities.'
        citations:
          - motorola-cad
        category: Computer-Aided Dispatch (CAD)
        what_it_is: Widely deployed CAD covering call intake, unit recommendation and incident timestamps, feeding the same incident and unit entities.
        who_uses_it: Dispatchers, watch commanders and patrol operations.
        data_out:
          batch:
            types:
              - structured
            volume: 5-20 GB/day
            interval: Nightly batch
          stream:
            types:
              - semi-structured
            volume: hundreds of events/sec at peak
            interval: Continuous (sub-second)
  - name: Records & Jail
    icon: erp
    tiles:
      - name: Mark43 RMS
        icon: db
        summary: 'Cloud records management: incident and arrest reports, case files and NIBRS-ready records, the system of record for what happened after the call.'
        citations:
          - mark43
        category: Records Management System (RMS)
        what_it_is: System of record for incident and arrest reports, case files and NIBRS-ready records after the call is closed.
        who_uses_it: Officers, detectives, records staff and crime analysts.
        data_out:
          batch:
            types:
              - structured
            volume: 3-15 GB/day
            interval: Nightly batch + hourly deltas
          stream:
            types:
              - semi-structured
            volume: tens of report events/sec
            interval: Continuous CDC
      - name: Tyler Odyssey Court
        icon: gavel
        summary: 'Enterprise Justice court case management: charges, dispositions and warrants shared with law enforcement and corrections.'
        citations:
          - odyssey
        category: Court Case Management System
        what_it_is: Manages charges, dispositions and warrants and shares them with law enforcement and corrections.
        who_uses_it: Court clerks, records and warrants teams and prosecutors.
        data_out:
          batch:
            types:
              - structured
            volume: 2-8 GB/day
            interval: Nightly batch
      - name: Guardian RFID JMS
        core: true
        icon: gavel
        summary: 'Jail management: booking, classification, housing and inmate movement tracked as the custody record of the facility.'
        citations:
          - guardian-rfid
        category: Jail Management System (JMS)
        what_it_is: Tracks booking, classification, housing and inmate movement as the custody record of the facility.
        who_uses_it: Corrections officers, classification and facility administration.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Nightly batch
          stream:
            types:
              - semi-structured
            volume: tens of movement events/sec
            interval: Continuous
  - name: Digital Evidence
    icon: media
    tiles:
      - name: Axon Evidence
        icon: media
        summary: 'Digital evidence management: body-worn and in-car video, photos and files with chain of custody, the evidence estate of record.'
        citations:
          - axon
        category: Digital Evidence Management System
        what_it_is: Stores body-worn and in-car video, photos and files with chain of custody as the evidence estate of record.
        who_uses_it: Officers, digital evidence teams and prosecutors.
        data_out:
          batch:
            types:
              - unstructured
              - semi-structured
            volume: TB-scale video + metadata/day
            interval: Continuous upload + nightly batch
      - name: Axon Body 4
        icon: media
        summary: Body-worn cameras streaming live and uploading recordings, the source of the video every review and disclosure request draws on.
        citations:
          - axon-body
        category: Body-Worn Camera Fleet
        what_it_is: Body-worn cameras streaming live and uploading recordings, the source video every review and disclosure request draws on.
        who_uses_it: Patrol officers, supervisors and digital evidence teams.
        data_out:
          stream:
            types:
              - unstructured
            volume: hundreds of GB/day video
            interval: Continuous live + on-dock upload
      - name: Genetec Clearance
        icon: share
        summary: Digital evidence sharing and redaction across agencies and prosecutors, the disclosure path for video and case files.
        citations:
          - genetec
        category: Evidence Sharing & Redaction Platform
        what_it_is: Shares and redacts digital evidence across agencies and prosecutors as the disclosure path for video and case files.
        who_uses_it: Digital evidence, records and disclosure teams and prosecutors.
        data_out:
          batch:
            types:
              - unstructured
              - semi-structured
            volume: tens of GB/day + share logs
            interval: Continuous + nightly batch
      - name: Flock Safety ALPR
        icon: network
        summary: Automatic licence-plate recognition cameras generating plate reads matched against wanted and missing-person lists.
        citations:
          - flock
        category: Automatic Licence-Plate Recognition (ALPR)
        what_it_is: Cameras generating plate reads matched against wanted and missing-person watch-lists to surface leads.
        who_uses_it: Crime analysts, detectives and patrol operations.
        data_out:
          stream:
            types:
              - semi-structured
            volume: thousands of plate reads/sec across the network
            interval: Continuous (real-time)
  - name: Fire & EMS
    icon: iot
    simplified: 2
    tiles:
      - name: ImageTrend ePCR
        icon: docs
        summary: 'Electronic patient-care records and fire incident reporting: the NEMSIS and NFIRS-ready record of every EMS and fire response.'
        citations:
          - imagetrend
        category: ePCR / Fire Records System
        what_it_is: Electronic patient-care records and fire incident reporting, the NEMSIS and NFIRS-ready record of every EMS and fire response.
        who_uses_it: EMS crews, fire officers and quality-review teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 2-8 GB/day
            interval: Nightly batch + per-run upload
      - name: ESO EHR
        icon: docs
        summary: EMS electronic health records and fire records, feeding patient outcomes, response intervals and quality review.
        citations:
          - eso
        category: ePCR / Fire Records System
        what_it_is: EMS electronic health records and fire records feeding patient outcomes, response intervals and quality review.
        who_uses_it: EMS medical directors, fire officers and QA teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 1-6 GB/day
            interval: Nightly batch + per-run upload
      - name: First Due Fire
        core: true
        icon: gauge
        summary: 'Fire prevention, inspections and pre-incident planning: the building, hydrant and inspection record behind risk-based deployment.'
        citations:
          - firstdue
        category: Fire Prevention & Inspections System
        what_it_is: Holds the building, hydrant and inspection records and pre-incident plans behind risk-based deployment and prevention.
        who_uses_it: Fire prevention, inspectors and fire operations.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 0.5-3 GB/day
            interval: Nightly batch
  - name: GIS & Telemetry
    icon: globe
    tiles:
      - name: Esri ArcGIS
        icon: globe
        summary: 'The GIS of record: beats, parcels, hydrants and service geographies and the spatial layers behind hotspots, coverage and response.'
        citations:
          - arcgis-esri
        category: Geographic Information System (GIS)
        what_it_is: System of record for beats, parcels, hydrants and service geographies and the spatial layers behind hotspots, coverage and response.
        who_uses_it: GIS and crime analysts, fire and emergency management.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: GB-scale spatial layers
            interval: Nightly / on-change refresh
      - name: AVL Telemetry
        core: true
        icon: iot
        summary: Automatic vehicle location and unit telemetry from patrol cars, fire apparatus and ambulances, the ground truth for travel time.
        category: Vehicle Location / Telemetry (AVL)
        what_it_is: Automatic vehicle location and unit telemetry from patrol cars, fire apparatus and ambulances, the ground truth for travel time.
        who_uses_it: Dispatch, patrol operations and fleet telematics teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: thousands of GPS pings/sec across the fleet
            interval: Continuous (seconds)
      - name: FirstNet Broadband
        icon: network
        summary: The first-responder broadband network carrying location, status and field data from responders back to the operations picture.
        citations:
          - firstnet
        category: First-Responder Broadband Network
        what_it_is: Carries responder location, status and field data back to the operations picture over the first-responder broadband network.
        who_uses_it: Field responders, dispatch and command staff.
        data_out:
          stream:
            types:
              - semi-structured
            volume: thousands of status/location events/sec
            interval: Continuous (real-time)
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: CJIS Repository
        icon: fed
        summary: State criminal-justice and NCIC/III record stores left where they are and queried in place under Unity Catalog, so CJIS-controlled records are never needlessly copied.
        category: Criminal Justice Record Store (CJIS)
        what_it_is: State criminal-justice and NCIC/III record stores queried in place through federation so CJIS-controlled records are never needlessly copied.
        who_uses_it: Records, warrants and CJIS-compliance teams and detectives.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale controlled records
            interval: Queried on demand (federated)
  - name: Data Formats
    icon: zbraces
    tiles:
      - name: 'CAP'
        icon: zbraces
        fmt: 'CAP'
        summary: 'OASIS Common Alerting Protocol for all-hazard public warning messages.'
        spec_url: https://docs.oasis-open.org/emergency/cap/v1.2/CAP-v1.2.html
        spark_connector: 'spark-xml'
        spark_repo: https://github.com/databricks/spark-xml
        databricks_resource: https://docs.databricks.com/aws/en/query/formats/xml
        source_systems:
          - 'Everbridge'
          - 'FEMA IPAWS'
          - 'Rave Mobile Safety'
      - name: 'EDXL'
        icon: zbraces
        fmt: 'EDXL'
        summary: 'OASIS Emergency Data Exchange Language suite for incident and resource messaging.'
        spec_url: https://www.oasis-open.org/committees/emergency/
      - name: 'NENA i3'
        core: true
        icon: zbraces
        fmt: 'i3'
        summary: 'NENA standard for Next Generation 9-1-1 IP-based emergency call handling.'
        spec_url: https://www.nena.org/page/i3_Stage3
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    tiles:
      - name: RapidSOS API
        icon: api
        summary: Device and app emergency data, precise caller location and medical profiles, streamed into the 911 and CAD picture.
        citations:
          - rapidsos
        category: Emergency Data Provider (Location)
        what_it_is: Streams device and app emergency data, precise caller location and medical profiles into the 911 and CAD picture.
        who_uses_it: 911 call-takers, dispatchers and patrol operations.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds of location events/sec
            interval: Continuous (real-time)
      - name: ShotSpotter Alerts
        icon: stream
        summary: Acoustic gunshot detection alerts with location and time, ingested as events for real-time response and analysis.
        citations:
          - shotspotter
        category: Acoustic Gunshot Detection
        what_it_is: Emits acoustic gunshot-detection alerts with location and time, ingested as events for real-time response and analysis.
        who_uses_it: Real-time crime centre operators, patrol and crime analysts.
        data_out:
          stream:
            types:
              - semi-structured
            volume: alerts on detection (bursty)
            interval: Continuous (real-time)
      - name: Weather & Traffic
        icon: globe
        summary: National Weather Service and traffic feeds joined for demand forecasting, routing and disaster response.
        citations:
          - nws
        category: Weather & Traffic Reference Feeds
        what_it_is: National Weather Service and traffic feeds joined for demand forecasting, routing and disaster response.
        who_uses_it: Emergency management, EMS demand planning and dispatch.
        data_out:
          stream:
            types:
              - semi-structured
            volume: periodic observations + alerts
            interval: Continuous (polling / push)
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Command Staff
        mark: Genie One
        summary: The police chief on crime trends and clearance; the fire chief and EMS medical director on response times and unit availability; the emergency manager on a live common picture when a storm or mass-casualty event stretches every agency at once.
        uses:
          - - Genie One
            - Ask what response times or calls for service looked like last night across the city without booking an analyst.
          - - AI/BI
            - Response times, clearance and calls-for-service demand on one certified set of Metric Views.
          - - Unity Catalog
            - Certification and the glossary, so "response time" and "cleared" mean one thing across every agency.
        sub:
          - name: Police Chief
            cares: crime trends, clearance rates and the deployment that moves them.
          - name: Fire Chief
            cares: response times, unit availability and station coverage.
          - name: Emergency Manager
            cares: a live common operating picture across agencies in a disaster.
        ucs:
          - Response Times
          - Real-Time Crime
          - Disaster Response
      - name: Patrol Ops
        mark: Lakehouse//RT
        summary: 'Watch commanders and dispatch supervisors running the shift: which units are available, where calls are stacking, and how long the queue is before the next car clears, on the day it is happening rather than in a monthly report.'
        uses:
          - - Lakehouse//RT
            - Live CAD, unit and call-queue state at the latency a shift moves at.
          - - AI/BI
            - Beat-level response times and calls-for-service load on governed data.
          - - Model Serving
            - Demand and staffing models that flag where the next car will be needed.
        sub:
          - name: Watch Commander
            cares: unit availability and the call queue across the shift.
          - name: Dispatch Supervisor
            cares: 911 and CAD load, hold times and unit assignment.
          - name: Field Supervisor
            cares: officer status, backup and scene safety.
        ucs:
          - Response Times
          - Real-Time Crime
          - Officer Safety
      - name: Investigations
        mark: AI Functions
        summary: 'Detectives and crime analysts working cases: linking incidents into patterns, searching hours of body-worn and in-car video and digital evidence, and turning ALPR reads and BOLOs into leads instead of a backlog.'
        uses:
          - - AI Functions
            - Transcription, summarisation and search over evidence run in SQL on governed data.
          - - AI Search
            - Semantic search across case notes, reports and evidence transcripts.
          - - Model Serving
            - Pattern and hotspot models scored into the analyst workflow.
        sub:
          - name: Detectives
            cares: case linkage, evidence review and leads.
          - name: Crime Analysts
            cares: hotspots, patterns and bulletins for deployment.
          - name: Digital Evidence
            cares: chain of custody, redaction and disclosure.
        ucs:
          - Crime Analytics
          - Evidence Search
          - ALPR & BOLO
      - name: Fire & EMS
        core: true
        mark: Model Serving
        summary: 'Fire operations and EMS medical directors on demand and risk: where the next call will fall, which properties carry the highest fire risk, and whether ambulances are staged where the calls actually are.'
        uses:
          - - Model Serving
            - Demand and fire-risk models scored into deployment and inspection planning.
          - - AI/BI
            - Calls-for-service demand, turnout time and unit-hour utilisation on certified views.
          - - Feature Store
            - Property, weather and history features read identically in training and serving.
        sub:
          - name: Fire Operations
            cares: turnout time, station coverage and move-up.
          - name: EMS Medical Director
            cares: ambulance demand, response intervals and patient outcomes.
          - name: Fire Prevention
            cares: risk-based inspection targeting across the building stock.
        ucs:
          - EMS Demand
          - Fire Risk
          - Disaster Response
      - name: Prof Standards
        mark: AI/BI
        summary: 'The accountability and community-trust side of the house: internal affairs and early-intervention review, records and CJIS compliance, and the transparency numbers the agency publishes to the public it serves.'
        uses:
          - - AI/BI
            - Use-of-force, complaint and early-intervention indicators on governed data.
          - - Unity Catalog
            - CJIS-aligned access, lineage and audit across every record.
          - - Genie One
            - Ask which indicators are trending or which records an audit needs without a manual pull.
        sub:
          - name: Internal Affairs
            cares: complaints, use-of-force review and early intervention.
          - name: Records & CJIS
            cares: record retention, disclosure and CJIS-compliant access.
          - name: Community Relations
            cares: the transparency numbers published to the public.
        ucs:
          - Use of Force
          - Evidence Search
          - Crime Analytics
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land the CAD, 911, RMS, digital-evidence and fire/EMS feeds from Tyler, Hexagon, Carbyne, Mark43, Axon and ImageTrend; own the Bronze to Silver path and the pager when a response-time table stalls.
        uses:
          - - Lakeflow Connect
            - Managed connectors for CAD, RMS and SaaS public-safety systems.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on incident and call feeds.
          - - Lakewatch
            - Freshness on the tables the watch and command staff read every shift.
      - name: GIS Analysts
        mark: Model Serving
        summary: Beats, parcels, hydrants and service geographies from Esri ArcGIS joined to incident and call data, and the spatial models behind hotspots, station coverage and disaster response.
        uses:
          - - Model Serving
            - Spatial hotspot, demand and risk models scored in the operational path.
          - - Feature Store
            - Geography and location features read identically in training and serving.
          - - AI Functions
            - Geocoding and address matching run in SQL against governed data.
      - name: App Developers
        mark: Apps
        summary: Ship the RTCC, response-time and evidence applications the agencies work in, hosted next to governed data with governed writes back to CAD and records.
        uses:
          - - Apps
            - Command-centre and field screens with no separate web tier to secure.
          - - Lakebase
            - Serverless Postgres for case, BOLO and workflow state.
          - - Agent Bricks
            - Agents that draft a bulletin or evidence summary against governed tools.
consumers:
  - name: BI & Productivity
    icon: chart
    from: bi
    tiles:
      - name: Tableau / Power BI
        icon: chart
        summary: Command and oversight dashboards against SQL warehouses with Unity Catalog permissions enforced end to end.
      - name: Microsoft Teams
        icon: chat
        summary: Genie in Teams for Unity Catalog-governed answers in the channel command staff already work in.
      - name: Notebooks & IDEs
        icon: notebook
        summary: Analyst notebooks, VS Code and JetBrains against governed incident, call and evidence data.
  - name: Public & Partners
    icon: partner
    tiles:
      - name: Community Portal
        icon: globe
        summary: Public crime maps and transparency numbers served to residents from governed Gold products.
      - name: Regional Sharing
        core: true
        icon: share
        summary: Mutual-aid and neighbouring agencies reading live incident and BOLO tables over Delta Sharing instead of file exchange.
      - name: Genie for Field
        icon: genie
        summary: Plain-language answers about incidents, records and BOLOs grounded in governed data for officers in the field.
  - name: Operational Writeback
    icon: opdb
    tiles:
      - name: CAD Writeback
        icon: stream
        summary: Recommended unit and ETA decisions written back into CAD so the answer reaches the dispatcher in the moment.
        citations:
          - tyler-cad
      - name: RMS Case Update
        core: true
        icon: db
        summary: Linked incidents, patterns and clearances written back into the records system investigators work in.
        citations:
          - mark43
      - name: BOLO & Alerts
        icon: dial
        summary: Plate hits, wanted matches and officer-safety alerts pushed to mobile data terminals and field devices.
  - name: Regulatory & Reporting
    icon: gavel
    tiles:
      - name: NIBRS Submission
        icon: gavel
        summary: National Incident-Based Reporting System crime submissions produced from the same governed tables the agency runs on.
        citations:
          - nibrs
      - name: NFIRS / NERIS
        icon: share
        summary: National fire incident reporting to USFA, produced from conformed fire and EMS Gold products.
        citations:
          - nfirs
      - name: NEMSIS EMS
        core: true
        icon: docs
        summary: National EMS Information System patient-care reporting filed from governed ePCR data.
        citations:
          - nemsis
  - name: Published Products
    icon: product
    tiles:
      - name: Data Products
        icon: product
        summary: Published, contracted products discoverable in Unity Catalog Domains and shared over OpenSharing.
      - name: Sharing Recipients
        core: true
        icon: share
        summary: Other agencies, prosecutors and researchers reading live tables with no copy and no egress duplication.
  - name: Databricks Apps
    icon: apps
    simplified: 2
    tiles:
      - name: RTCC Cockpit
        icon: gauge
        short: Real-time crime center
        summary: 'The screen a real-time crime centre runs on: live 911 and CAD calls, nearby cameras, ALPR reads and gunshot alerts fused on a map so operators guide responding officers with current ground truth, on Databricks Apps over Lakebase.'
      - name: Response Time Board
        icon: stream
        short: Dispatch to on-scene
        summary: Live response-time state by call type and beat against target, flagging the calls holding in queue so supervisors move units before the standard is missed.
      - name: Evidence Finder
        icon: media
        short: Search & redaction
        summary: Where investigators search transcribed body-worn and in-car video, case notes and reports by what was said and indexed in metadata, with redaction and disclosure tracked for court.
      - name: EMS Demand Planner
        icon: iot
        short: Ambulance deployment
        summary: Predicted calls for service by hour and location so ambulances are staged where the next call will fall instead of chasing it across town.
  - name: AI/BI Dashboards
    icon: aibi
    tiles:
      - name: Response Performance
        icon: aibi
        summary: Response time by call type and beat, call-queue depth and unit availability on certified views.
        kpis:
          - Response time
          - Call-taking time
          - Queue depth
          - Unit availability
          - On-time rate
        teams:
          - Patrol Ops
          - Command Staff
          - Dispatch Supervisor
      - name: Crime & Clearance
        icon: aibi
        summary: Calls-for-service demand, offence trends, hotspots and case clearance across the agency.
        kpis:
          - Calls for service
          - Clearance rate
          - Offence trend
          - Hotspot density
          - ALPR hit rate
        teams:
          - Investigations
          - Command Staff
          - Crime Analysts
      - name: Fire & EMS Operations
        icon: aibi
        summary: EMS demand, response intervals, turnout time, fire risk and unit-hour utilisation.
        kpis:
          - EMS demand
          - Response interval
          - Turnout time
          - Unit-hour utilisation
          - Fire-risk score
        teams:
          - Fire & EMS
          - Command Staff
          - EMS Medical Director
      - name: Accountability & Evidence
        icon: aibi
        summary: Use-of-force, complaint and early-intervention indicators with evidence review and disclosure throughput.
        kpis:
          - Use-of-force rate
          - Complaint volume
          - Early-intervention flags
          - Evidence backlog
          - Disclosure turnaround
        teams:
          - Prof Standards
          - Internal Affairs
          - Community Relations
  - name: Agent Harnesses
    icon: agents
    tiles:
      - name: Omnigent OSS
        icon: omni
        short: Databricks, open source
        summary: Open-source meta-harness above existing agent frameworks, enabling agent composition, collaboration and centralised governance from one interface.
        capabilities:
          - Build
          - Deploy
          - Optimize
          - Govern
        related:
          - Agent Bricks
          - Unity Gateway
      - name: Claude Code
        core: true
        icon: code
        short: 3rd-party harness
        summary: Anthropic's coding harness working against the platform through MCP, with spend, routing and policy governed by Unity Gateway.
      - name: OpenAI Codex
        core: true
        icon: code
        short: 3rd-party harness
        summary: OpenAI's coding harness connected over MCP, governed at runtime by Unity Gateway rather than trusted by configuration.
      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Response & Dispatch Agent
        icon: genie
        summary: Ask about response times, call queues and unit availability across the city in plain language.
        feeds:
          - Tyler Enterprise CAD
          - Carbyne NG911
          - AVL Telemetry
          - Response time, clearance, safety
        teams:
          - Patrol Ops
          - Command Staff
          - Dispatch Supervisor
        questions:
          - What were response times by call type and beat last night?
          - Which beats are running slowest against the standard right now?
          - How many calls are holding in queue and for how long?
          - Where is call-for-service demand concentrating this shift?
          - How does call-received-to-on-scene time break down into call processing, dispatch or turnout and travel?
