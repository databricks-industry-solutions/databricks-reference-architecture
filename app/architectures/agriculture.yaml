      - name: OpenAI Codex
        core: true
        icon: code
        short: 3rd-party harness
        summary: OpenAI's coding harness connected over MCP, governed at runtime by Unity Gateway rather than trusted by configuration.
      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Agronomy & Yield Agent
        icon: genie
        summary: Ask about in-season yield, crop condition and prescription performance by field.
        feeds:
          - Planet Labs Imagery
          - Climate FieldView
          - John Deere Operations Center
          - Yield, margin and carbon
        teams:
          - Agronomy
          - Lead Agronomist
          - Precision Ag Specialist
        questions:
          - What is the current yield estimate by field and hybrid?
          - Which fields show declining crop condition on recent imagery?
          - How did variable-rate seed and nitrogen prescriptions perform versus flat rate?
          - Which hybrid and variety placements simulate best for next season by zone?
          - Which fields have the best nitrogen use efficiency and input cost per bushel?
      - name: Grain Merchandising Agent
        icon: genie
        summary: Explore grain demand, basis positions and origination against futures and local bids.
        feeds:
          - CME Group Futures
          - DTN ProphetX
          - SAP S/4HANA Agribusiness
          - Yield, margin and carbon
        teams:
          - Grain Merchandising
          - Head Merchandiser
          - Risk Desk
        questions:
          - What is our basis position and open exposure by location right now?
          - What is hedge P&L by commodity this month against limits?
          - Where should we bid to fill the elevator at target basis?
          - What is forecast grain demand by crop and location versus plan?
          - Which contracts are off-margin at current futures and cash prices?
      - name: Harvest Operations Agent
        icon: genie
        summary: Answer harvest progress, elevator throughput and logistics bottleneck questions.
        feeds:
          - John Deere Operations Center
          - Agvance (SSI)
          - DTN Weather
          - Conformed fields and assets
        teams:
          - Co-op Executive Board
          - Chief Operating Officer
          - Origination
        questions:
          - What is harvest progress by region and crop today?
          - Where are elevator and dryer queues and the longest truck waits building?
          - Which spray or harvest windows carry heat or weather safety risk this week?
          - Which fields or elevators show unsafe equipment or grain-handling conditions right now?
          - What is cost per acre this harvest versus plan?
      - name: Carbon & MRV Agent
        icon: genie
        summary: Ask about enrolled acres, practice verification and credits issued per grower.
        feeds:
          - Regrow MRV
          - Indigo Carbon
          - Planet Labs Imagery
          - Yield, margin and carbon
        teams:
          - Sustainability
          - Carbon Program Lead
          - MRV & Verification
        questions:
          - How many acres are enrolled in carbon and regenerative programs by practice?
          - Which enrolled fields are missing practice verification evidence?
          - Can we trace lot lineage from field and grower through elevator to buyer?
          - How many credits have been issued per grower this cycle?
          - What is carbon intensity by crop for Scope 3 reporting to buyers?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Production Monitoring
        short: In-season yield tracking
        icon: chart
        summary: In-season yield estimates and field crop-condition monitored from imagery, weather and hybrid response.
        problem: Yield is guessed from last year's average and a windshield survey, so seed, input and marketing decisions are made months before anyone has a defensible number per field.
        who_benefits: Agronomy
        how_built: Satellite imagery, weather and hybrid-trial features are engineered in Feature Store and scored through Model Serving, with runs tracked in MLflow across the season.
        components:
          - Harvest Command
          - Planet Labs Imagery
          - Model Serving
          - Feature Store
          - MLflow
        stories:
          - title: Databricks spatial joins for crop yield analysis and forecasting
            url: https://www.databricks.com/blog/databricks-spatial-joins-now-17x-faster-out-box
      - name: Design Space Simulation & Exploration
        short: Seed & hybrid design
        icon: chart
        summary: Hybrid and variety placement simulated across zone, soil and weather scenarios before seed is ordered.
        problem: Hybrid and variety choices are made from last year's plots and a rep's pitch, so the seed-by-zone design space is never simulated and a poor placement is only discovered at harvest when the yield is already lost.
        who_benefits: Agronomy
        how_built: Hybrid-trial, imagery and weather data are conformed on Delta Lake, and machine learning models tracked in MLflow simulate variety response across zone, soil and weather so agronomy ranks placements in the Prescription Workbench before seed is ordered.
        components:
          - Prescription Workbench
          - Climate FieldView
          - Planet Labs Imagery
          - MLflow
        stories:
          - title: Syngenta Accelerates Crop Protection Research
            url: https://www.databricks.com/customers/syngenta
      - name: Sustainability & Circular Economy
        short: Carbon & regen programs
        icon: partner
        summary: Practice verification, carbon quantification and regenerative program outcomes for credit and Scope 3 programs.
        problem: Carbon programs enroll acres faster than they can prove the outcome, and practice evidence stitched from spreadsheets and one-off models will not survive third-party verification.
        who_benefits: Sustainability
        how_built: Imagery, practice and soil data feed carbon models scored in Model Serving, with Unity Catalog holding auditable lineage from field practice to issued credit in the Carbon Registry.
        components:
          - Carbon Registry
          - Model Serving
          - Regrow MRV
          - Unity Catalog
          - Planet Labs Imagery
        stories:
          - title: UPL cultivates innovation on Agent Bricks
            url: https://www.databricks.com/your-ai/customers/upl
      - name: Feedstock, Formulation, & Recipe Control
        short: Input rate formulation
        icon: iot
        summary: Seed, nitrogen and chemical rates formulated by productivity zone rather than flat application.
        problem: Inputs go on at flat rates because field, soil and yield layers live in different tools and never line up, so money is spent on acres that cannot return it.
        who_benefits: Agronomy
        how_built: Soil, yield and imagery layers are scored with AI Functions and Model Serving in the Prescription Workbench, then written back to the applicator and Deere Operations Center as variable-rate files.
        components:
          - Prescription Workbench
          - Model Serving
          - AI Functions
          - John Deere Operations Center
          - Delta Lake
        stories:
          - title: 'Geospatial Unbounded: variable-rate prescription from soil, zones and weather'
            url: https://www.databricks.com/blog/geospatial-unbounded-spatial-sql-ga-aibi-maps-delta-sharing-and-iceberg-v3
      - name: Product & Process Traceability
        short: Field-to-elevator lineage
        icon: product
        summary: Lot lineage from field and grower through elevator to customer, with sourcing claims intact.
        problem: Provenance from field to customer is scattered across ERP, elevator and grower systems, so lot lineage and sourcing claims are assembled by hand and hard to defend to a buyer or auditor.
        who_benefits: Sustainability
        how_built: Field, elevator and ERP data are conformed under Unity Catalog and published as governed data products shared to food-company buyers and lenders over OpenSharing.
        components:
          - SAP S/4HANA Agribusiness
          - Unity Catalog
          - Data Products
          - OpenSharing
          - Delta Lake
        stories:
          - title: Bayer transforms global data management with Databricks
            url: https://www.databricks.com/customers/bayer
      - name: Demand Forecasting
        short: Grain demand forecasting
        icon: market
        summary: Grain demand and origination volume forecast by crop and location against futures, cash bids and USDA balance sheets.
        problem: Origination and sales volumes are forecast from last year and gut feel, so the elevator either bids for grain it cannot move or misses demand it could have filled, and the plan never ties to the market.
        who_benefits: Grain Merchandising
        how_built: Futures, cash-bid and USDA balance-sheet feeds are conformed on Delta Lake, and demand models scored in Model Serving forecast crop and location demand in the Merchandising Desk for origination to plan against.
        components:
          - Merchandising Desk
          - CME Group Futures
          - DTN ProphetX
          - Model Serving
          - Delta Lake
        stories:
          - title: UPL optimizes supply chain operations with demand forecasting
            url: https://www.databricks.com/customers/upl
      - name: Commodity & Energy Trading
        stories:
          - title: Data and AI in action across the energy industry
            url: https://www.databricks.com/blog/powering-future-data-and-ai-action-across-energy-industry
        short: Basis & hedge trading
        icon: market
        summary: Basis positions, hedging and origination managed against futures, cash bids and local elevator prices.
        problem: Basis and hedge decisions are made in spreadsheets against yesterday's settlements, so position, exposure and hedge P&L drift out of view and grain is priced without a live market picture.
        who_benefits: Grain Merchandising
        how_built: CME futures, DTN cash bids and Barchart curves are conformed on Delta Lake, and basis-forecast models scored in Model Serving surface live position, exposure and hedge P&L in the Merchandising Desk.
        components:
          - Merchandising Desk
          - CME Group Futures
          - DTN ProphetX
          - Barchart cmdty
          - Model Serving
      - name: Workforce Safety
        stories:
          - title: StrongArm Tech cuts workplace injuries with IoT and ML on Databricks
            url: https://www.databricks.com/customers/strongarm
        short: Field & elevator safety
        icon: gavel
        summary: Equipment, elevator and field hazards surfaced from machine telemetry and weather so injuries are prevented before crews are exposed.
        problem: Grain handling, equipment operation and chemical spraying are among the most dangerous jobs in agriculture, but near-misses and hazardous conditions sit unread in telemetry and weather feeds until an incident forces the review.
        who_benefits: Co-op Executive Board
        how_built: Machine telemetry, elevator events and DTN Weather stream into Lakehouse//RT, and risk models scored in Model Serving flag hazardous heat, equipment and grain-handling conditions in Harvest Command before crews are sent out.
        components:
          - Harvest Command
          - John Deere Operations Center
          - DTN Weather
          - Lakehouse//RT
          - Model Serving
      - name: Distribution & Logistics Optimization
        short: Harvest grain logistics
        icon: stream
        summary: Seed and input supply and harvest grain movement planned across trucks, elevators and dryers to minimize wait and shrink.
        problem: Input deliveries before the season and grain movement at harvest are coordinated by phone, so seed and chemical arrive late, elevator and dryer queues build, grain shrinks in the wait, and no one sees the network bottleneck until it is too late.
        who_benefits: Co-op Executive Board
        how_built: Input orders, scale tickets, equipment telemetry and elevator status stream into Lakehouse//RT and route-and-scheduling logic surfaces live input supply, queues and dryer capacity in Harvest Command.
        components:
          - Harvest Command
          - Lakehouse//RT
          - John Deere Operations Center
          - Model Serving
          - Delta Lake
        stories:
          - title: Barilla streamlines food manufacturing operations with Databricks Lakehouse
            url: https://www.databricks.com/customers/barilla
      - name: Operations Resource Efficiency
        short: Input & nitrogen efficiency
        icon: erp
        summary: Seed, chemical and nitrogen spend per bushel and nitrogen use efficiency tracked against plan.
        problem: Seed, chemical and nitrogen spend is reconciled against plan long after the season, so overspend and poor nitrogen use efficiency on an acre or a hybrid are found at close rather than while there is still time to change the order.
        who_benefits: Finance & Risk
        how_built: Application records, ERP purchases and yield outcomes are conformed on Delta Lake and tracked in AI/BI, so cost per bushel and nitrogen use efficiency are measured against plan by field, hybrid and input.
        components:
          - Traction Ag
          - SAP S/4HANA Agribusiness
          - Delta Lake
          - AI/BI
          - Genie One
        stories:
          - title: FMC optimizes harvests with data and AI
            url: https://www.databricks.com/customers/fmc-corporation
medallion:
  Bronze:
    short: Raw field and market feeds
    summary: Telemetry from equipment, weather stations, satellite imagery and exchange ticks, landed exactly as received so a yield estimate can be replayed.
  Silver:
    short: Conformed fields and assets
    summary: Fields, parcels, equipment and contracts resolved into single entities across FMIS, ERP and trading systems.
  Gold:
    short: Yield, margin and carbon
    summary: 'Contracted products agronomy and finance run on: yield per acre, input cost per bushel, basis and carbon intensity scores.'
