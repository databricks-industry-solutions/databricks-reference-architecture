      - name: Warranty Cost Optimization
        short: Board & device warranty
        icon: product
        summary: Warranty claims joined to build genealogy and field telemetry so failure modes are fixed at the root, not paid repeatedly.
        problem: Warranty claims are paid and closed without joining them to the lot, supplier and telemetry that caused them, so the same failure mode is paid over and over and never designed out.
        who_benefits: Quality & Reliability
        how_built: ServiceMax warranty claims, QMS non-conformances and device telemetry conform under Unity Catalog on Delta Lake, and models in Model Serving surface the failure modes driving cost for design and supplier action.
        components:
