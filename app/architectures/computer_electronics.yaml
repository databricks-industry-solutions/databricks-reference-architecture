        problem: Sales sees orders, success sees tickets and product sees telemetry, and none of them meet, so the customer is served from fragments and churn signals are missed.
        who_benefits: Commercial & Aftermarket
        how_built: Salesforce, order, device telemetry and ServiceMax support history are conformed to Gold under Unity Catalog, linked through account and registered-device relationships, so a governed Customer 360 is read in AI/BI and Genie on the definitions the commercial team already reports.
