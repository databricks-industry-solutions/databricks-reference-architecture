      - name: Demand Forecasting
        short: Component demand planning
        icon: sheet
        summary: Product and component demand forecast against real signals so the plan holds when allocation tightens.
        problem: Demand lives in spreadsheets and stale ERP extracts, so forecasts miss, the wrong components are bought and either builds stall or excess inventory piles up.
        who_benefits: Supply Chain
        how_built: Kinaxis and SAP demand, order and telemetry signals conform on Delta Lake and are scored in Model Serving, so the Supply Control Tower forecasts demand on certified AI/BI Metric Views.
