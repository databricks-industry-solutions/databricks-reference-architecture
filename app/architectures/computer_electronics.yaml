      - name: Inventory Optimization
        short: Component working capital
        icon: market
        summary: Safety stock and reorder points tuned to actual component lead-time variability not static policy tables.
        problem: Safety stock and reorder points are set from static policy, so the network carries too much of the wrong components and still stocks out when allocation and lead times vary.
        who_benefits: Supply Chain
