      - name: Cyber Threat Monitoring & Detection
        short: Device security
        icon: observ
        summary: Deployed devices scored on security events so an emerging cyber threat is caught across the fleet before exposure grows.
        problem: Security events and threat intel sit in separate systems read after the fact, so a firmware exploit or anomaly spreads across the fleet before anyone joins the signals.
        who_benefits: Engineering & Product Security
        how_built: Device security events stream into Lakehouse//RT and correlate with the Threat Intelligence Feed on Delta Lake, and anomaly models in Model Serving surface threats to the Threat Console before exposure grows.
