      - name: Agentic Customer Support & Outage Response
        short: Device fleet support
        icon: crm
        summary: Agents that resolve customer and field support cases and coordinate outage response across the installed base, grounded in governed telemetry and service history.
        problem: Support and outage handling rely on people searching manuals, tickets and telemetry by hand, so resolution is slow, escalations pile up and a fleet-wide fault is triaged case by case instead of at once.
