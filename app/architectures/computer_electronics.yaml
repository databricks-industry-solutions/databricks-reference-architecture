      - name: Dynamic Pricing
        short: Channel pricing
        icon: market
        summary: Device and channel prices set from demand, attach and competitive signals so margin holds without hand-set discounts.
        problem: Prices and channel discounts are set from static tables and gut feel, so margin leaks on fast-moving devices while slow movers sit unsold and competitors reprice far quicker.
        who_benefits: Commercial & Aftermarket
        how_built: Salesforce orders, SAP pricing and device demand signals conform on Delta Lake and are scored by pricing models in Model Serving, so recommended device and channel prices are read in AI/BI under Unity Catalog and written back through the commercial path.
