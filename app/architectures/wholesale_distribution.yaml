name: Wholesale & Distribution
description: 'For wholesale distributors: demand and inventory planning, warehouse and transport execution, EDI order automation, dynamic pricing, working capital, and multi-channel commerce across the branch networks they run and the customers they supply.'
sources:
  - name: ERP & Finance
    icon: erp
    simplified: 3
    tiles:
      - name: SAP S/4HANA
        icon: erp
        summary: Orders, inventory, procurement and finance for large distributors; the system of record for the order-to-cash and procure-to-pay flow.
        citations:
          - sap
        category: Enterprise Resource Planning (ERP)
        what_it_is: Holds the system-of-record for order-to-cash and procure-to-pay across large distributors, the source of orders, inventory, purchasing and finance.
        who_uses_it: Finance & Rebates, Supply Chain & Ops and Sales & Commercial teams.
        data_out:
          batch:
            types:
              - structured
            volume: 20-100 GB/day
            interval: Nightly batch + hourly deltas
          stream:
            types:
              - semi-structured
            volume: hundreds of postings/sec
            interval: Continuous CDC
      - name: Infor Distribution
        icon: erp
        summary: 'CloudSuite Distribution ERP purpose-built for wholesale distributors: inventory, pricing and warehouse operations.'
        citations:
          - infor
        category: Distribution ERP
        what_it_is: Purpose-built distribution ERP covering inventory, pricing and warehouse operations for wholesale distributors.
        who_uses_it: Supply Chain & Ops, Category & Merch and Finance teams.
        data_out:
          batch:
            types:
              - structured
            volume: 10-40 GB/day
            interval: Nightly batch + hourly deltas
      - name: Epicor Prophet 21
        icon: erp
        summary: Distribution ERP widely run by mid-market wholesalers for order management, inventory and branch operations.
        citations:
          - epicor
        category: Distribution ERP
        what_it_is: Mid-market distribution ERP for order management, inventory and branch operations, the operational backbone of many wholesalers.
        who_uses_it: Supply Chain & Ops, Sales & Commercial and Branch operations teams.
        data_out:
          batch:
            types:
              - structured
            volume: 5-25 GB/day
            interval: Nightly batch
      - name: Oracle NetSuite
        icon: erp
        summary: Cloud ERP for distributors covering order management, inventory, procurement and financials.
        citations:
          - netsuite
        category: Cloud ERP
        what_it_is: Cloud ERP covering order management, inventory, procurement and financials for distributors running on a SaaS backbone.
        who_uses_it: Finance & Rebates, Supply Chain & Ops and Sales & Commercial teams.
        data_out:
          batch:
            types:
              - structured
            volume: 5-25 GB/day
            interval: Hourly / nightly sync
  - name: Warehouse (WMS)
    icon: store
    simplified: 3
    tiles:
      - name: Manhattan Active WMS
        icon: store
        summary: Warehouse management for picking, putaway, slotting and labour across the DC network, the source of execution events.
        citations:
          - manhattan
        category: Warehouse Management System (WMS)
        what_it_is: Runs picking, putaway, slotting and labour across the DC network, the source of execution move events behind fill rate and productivity.
        who_uses_it: Supply Chain & Ops, Warehouse operations and Data Engineers.
        data_out:
          batch:
            types:
              - structured
            volume: 10-40 GB/day
            interval: Hourly batch
          stream:
            types:
              - semi-structured
            volume: hundreds of moves/sec at peak
            interval: Continuous move events
      - name: Blue Yonder WMS
        icon: store
        summary: Warehouse management and fulfilment orchestration across distribution centres and branch stock.
        citations:
          - blueyonder
        category: Warehouse Management System (WMS)
        what_it_is: Orchestrates warehouse management and fulfilment across distribution centres and branch stock, feeding order and shipment execution state.
        who_uses_it: Supply Chain & Ops and Warehouse operations teams.
        data_out:
          batch:
            types:
              - structured
            volume: 5-25 GB/day
            interval: Hourly batch + intraday deltas
      - name: Körber WMS
        icon: store
        summary: Körber Supply Chain warehouse management for wave planning, inventory moves and labour in the DC.
        citations:
          - korber
        category: Warehouse Management System (WMS)
        what_it_is: Handles wave planning, inventory moves and labour in the DC, emitting the task and move events behind slotting and labour analytics.
        who_uses_it: Supply Chain & Ops and Warehouse operations teams.
        data_out:
          batch:
            types:
              - structured
            volume: 2-10 GB/day
            interval: Hourly batch
  - name: Transport & Logistics
    icon: stream
    simplified: 3
    tiles:
      - name: Oracle OTM
        icon: stream
        summary: 'Oracle Transportation Management: route planning, carrier selection, freight rating and settlement across the network.'
        citations:
          - oracle-otm
        category: Transportation Management System (TMS)
        what_it_is: Plans routes, selects carriers, rates freight and settles across the network, the source of movement and landed-cost data.
        who_uses_it: Supply Chain & Ops, Transport & logistics and Finance teams.
        data_out:
          batch:
            types:
              - structured
            volume: 5-20 GB/day
            interval: Nightly batch + hourly deltas
      - name: project44
        icon: iot
        summary: 'Real-time transportation visibility: in-transit tracking, ETAs and exception alerts across carriers.'
        citations:
          - project44
        category: Real-Time Transportation Visibility
        what_it_is: Provides in-transit tracking, ETAs and exception alerts across carriers, the live status feed behind the OTIF control tower.
        who_uses_it: Supply Chain & Ops, Transport & logistics and Customer service teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds-thousands of events/sec
            interval: Continuous (API / webhook)
      - name: FourKites
        icon: iot
        summary: Supply chain visibility platform tracking loads and shipments end to end for proactive exception handling.
        citations:
          - fourkites
        category: Real-Time Transportation Visibility
        what_it_is: Tracks loads and shipments end to end for proactive exception handling, feeding predictive ETA and dwell into service analytics.
        who_uses_it: Supply Chain & Ops, Transport & logistics and Warehouse operations teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds-thousands of events/sec
            interval: Continuous (API / webhook)
  - name: EDI & B2B Commerce
    icon: api
    simplified: 2
    tiles:
      - name: SPS Commerce EDI
        icon: api
        summary: Retail and distribution EDI network carrying purchase orders, ASNs and invoices between trading partners.
        citations:
          - sps
        category: EDI / B2B Network
        what_it_is: Carries purchase orders, ASNs and invoices between trading partners across the retail and distribution community, the B2B document backbone.
        who_uses_it: Supply Chain & Ops, Category & Merch and Integration Engineers.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Multiple daily batches
          stream:
            types:
              - semi-structured
            volume: tens-hundreds of documents/sec
            interval: Continuous document flow
      - name: TrueCommerce EDI
        icon: api
        summary: EDI and B2B integration network for order, shipment and invoice documents across the trading community.
        citations:
          - truecommerce
        category: EDI / B2B Network
        what_it_is: EDI and B2B integration network for order, shipment and invoice documents across the trading community, joined to orders for status and audit.
        who_uses_it: Supply Chain & Ops, Sales & Commercial and Integration Engineers.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-3 GB/day
            interval: Multiple daily batches
      - name: SAP Commerce Cloud
        core: true
        icon: product
        summary: 'B2B commerce and punchout catalogs: contract pricing, availability and reorder for buyer procurement systems.'
        citations:
          - sap-commerce
        category: B2B Commerce Platform
        what_it_is: Serves B2B commerce and punchout catalogs with contract pricing, availability and reorder to buyer procurement systems, emitting web and order events.
        who_uses_it: Sales & Commercial, Inside sales & e-commerce and Commercial App Devs.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Hourly sync
          stream:
            types:
              - semi-structured
            volume: hundreds of events/sec at peak
            interval: Continuous clickstream / orders
  - name: Pricing & CRM
    icon: market
    simplified: 2
    tiles:
      - name: Vendavo Pricing
        icon: market
        summary: 'B2B price management and margin optimisation: price guidance, deal scoring and rebate administration.'
        citations:
          - vendavo
        category: B2B Price Management
        what_it_is: Manages B2B pricing and margin optimisation with price guidance, deal scoring and rebate administration, the source of contract and quote pricing.
        who_uses_it: Sales & Commercial, Finance & Rebates and Pricing & Demand Sci teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Daily price + rebate refresh
      - name: PROS Pricing
        icon: market
        summary: AI-driven price optimisation and CPQ for distribution, feeding willingness-to-pay and quote guidance.
        citations:
          - pros
        category: Price Optimization & CPQ
        what_it_is: Provides AI-driven price optimisation and CPQ, feeding willingness-to-pay and quote guidance into the sales and commerce path.
        who_uses_it: Sales & Commercial, Pricing & Demand Sci and Inside sales teams.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-3 GB/day
            interval: Daily + on-demand quote scoring
      - name: Salesforce Sales Cloud
        core: true
        icon: crm
        summary: Accounts, opportunities and quotes for field, inside and account-management sales teams.
        citations:
          - salesforce
        category: Sales CRM
        what_it_is: Holds accounts, opportunities and quotes for field, inside and account-management teams, the relationship view behind churn and cross-sell.
        who_uses_it: Sales & Commercial, Sales leadership and Account management teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Hourly / nightly sync
          stream:
            types:
              - semi-structured
            volume: tens of events/sec
            interval: Continuous CDC
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Finance & Rebate Mart
        icon: fed
        summary: Rebate, chargeback and margin marts left where they are and queried in place under Unity Catalog, which avoids a second copy of the audited numbers.
        category: Finance Data Warehouse
        what_it_is: Rebate, chargeback and margin marts kept in the incumbent warehouse and queried in place through federation, avoiding a second copy of the audited numbers.
        who_uses_it: Finance & Rebates, CFO & controllers and Rebate & pricing admin analysts.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale historical marts
            interval: Queried on demand (federated)
  - name: Data Formats
    icon: zbraces
    simplified: 2
    tiles:
      - name: 'X12 EDI'
        icon: zbraces
        fmt: 'X12'
        summary: 'ANSI X12 EDI transaction sets for POs, invoices and ship notices with trading partners.'
        spec_url: https://x12.org/
      - name: 'EPCIS'
        icon: zbraces
        fmt: 'EPC'
        summary: 'GS1 event standard for distribution visibility and traceability.'
        spec_url: https://www.gs1.org/standards/epcis
      - name: 'EANCOM'
        icon: zbraces
        fmt: 'EANC'
        summary: 'GS1 EDIFACT subset for wholesale order-to-cash messaging.'
        spec_url: https://www.gs1.org/standards/edi
      - name: 'GS1 XML'
        icon: zbraces
        fmt: 'GS1X'
        summary: 'GS1 XML business messages for supply-chain transactions.'
        spec_url: https://www.gs1.org/standards/edi-xml
        spark_connector: 'spark-xml'
        spark_repo: https://github.com/databricks/spark-xml
        databricks_resource: https://docs.databricks.com/aws/en/query/formats/xml
        source_systems:
          - 'SAP'
          - 'Infor'
          - '1WorldSync'
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    simplified: 2
    tiles:
      - name: Dun & Bradstreet
        icon: partner
        summary: Firmographics, corporate hierarchies and credit signals for customer onboarding and credit risk.
        citations:
          - dnb
        category: Firmographic & Credit Data
        what_it_is: Supplies firmographics, corporate hierarchies and credit signals used to onboard customers and assess credit and counterparty risk.
        who_uses_it: Finance & Rebates, Credit & AR and Sales & Commercial teams.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-2 GB/day
            interval: Weekly + on-demand refresh
      - name: Circana POS
        icon: chart
        summary: Downstream point-of-sale and market data for demand sensing across categories and channels.
        citations:
          - circana
        category: POS & Market Data
        what_it_is: Provides downstream point-of-sale and market data for demand sensing across categories and channels, feeding forecast and assortment decisions.
        who_uses_it: Category & Merch, Pricing & Demand Sci and Merchandising teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/week
            interval: Weekly syndicated feed
      - name: DAT Freight Rates
        icon: market
        summary: Spot and contract freight rate benchmarks for carrier negotiation and landed-cost analysis.
        citations:
          - dat
        category: Freight Rate Benchmarks
        what_it_is: Publishes spot and contract freight-rate benchmarks used for carrier negotiation and landed-cost analysis.
        who_uses_it: Supply Chain & Ops, Transport & logistics and Finance teams.
        data_out:
          batch:
            types:
              - structured
            volume: MBs
            interval: Daily / weekly rate benchmarks
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Executive Office
        mark: Genie One
        summary: The CEO and COO on revenue growth, branch productivity and the working capital tied up in inventory; the strategy office on which categories, branches and customers to expand or exit.
        uses:
          - - Genie One
            - Ask what last month's gross margin was by branch and category without booking analyst time.
          - - AI/BI
            - Revenue, fill rate, margin and inventory turns on one certified set of Metric Views.
          - - Unity Catalog
            - Certification and the business glossary, so "margin" and "service level" mean one thing across the business.
        sub:
          - name: CEO & COO
            cares: revenue growth, branch productivity and the trade between service and working capital.
          - name: Strategy & M&A
            cares: which categories, branches and customers to expand, acquire or exit.
        ucs:
          - Working Capital & Cash Flow Optimization
          - Demand Forecasting
          - Dynamic Pricing
          - Customer 360
      - name: Sales & Commercial
        mark: Model Serving
        summary: Field sales, inside sales and account management growing wallet share across the customer base, defending price and catching accounts before they drift away.
        uses:
          - - Model Serving
            - Churn, cross-sell and next-best-order scored in the rep's account view.
          - - Pricing Cockpit
            - Quote and contract price guidance held to margin floors at the point of sale.
          - - AI/BI
            - Pipeline, win rate and estimated share of wallet on governed customer data.
        sub:
          - name: Sales leadership
            cares: territory targets, rep productivity and share of wallet.
          - name: Account management
            cares: retention, cross-sell and contract renewals on key accounts.
          - name: Inside sales & e-commerce
            cares: conversion and basket size across the branch and web channels.
        ucs:
          - Dynamic Pricing
          - Customer 360
          - Order Processing Automation
      - name: Category & Merch
        mark: AI/BI
        summary: Category managers and merchandisers deciding assortment, supplier terms and private-label mix, judged on category margin, in-stock rate and supplier performance.
        uses:
          - - AI/BI
            - Category margin, assortment productivity and supplier scorecards on certified views.
          - - Demand Forecasting
            - SKU-location demand signals feeding assortment and buy decisions.
          - - Genie One
            - Ask which SKUs are dead stock or which suppliers slipped on lead time.
        sub:
          - name: Category managers
            cares: assortment, pricing architecture and private-label mix.
          - name: Merchandising
            cares: planograms, promotions and new-product introductions.
          - name: Vendor management
            cares: supplier terms, rebates and lead-time performance.
        ucs:
          - Demand Forecasting
          - Working Capital & Cash Flow Optimization
      - name: Supply Chain & Ops
        core: true
        mark: Lakehouse//RT
        summary: Planning, warehouse and transport teams moving product from supplier to branch to customer at the promised service level and the lowest landed cost.
        uses:
          - - Inventory Command
            - Replenishment and safety-stock recommendations by SKU and location.
          - - Lakehouse//RT
            - Live warehouse and in-transit state at the latency the operation moves at.
          - - OTIF Control Tower
            - Orders at risk of missing the promised delivery flagged before they ship.
        sub:
          - name: Demand & supply planning
            cares: forecast, replenishment and safety-stock policy.
          - name: Warehouse operations
            cares: picking, putaway and slotting across the DC network.
          - name: Transport & logistics
            cares: route, carrier and last-mile execution to branch and customer.
        ucs:
          - Inventory Optimization
          - Distribution & Logistics Optimization
      - name: Finance & Rebates
        mark: AI/BI
        summary: The CFO's office running margin, cash and the rebate and chargeback programs that make or break net profit in a thin-margin distribution business.
        uses:
          - - AI/BI
            - Net margin after rebates and chargebacks on certified Metric Views.
          - - Rebate Manager
            - Supplier rebate accruals and customer chargebacks tracked to contract terms.
          - - Genie One
            - Ask which rebate tiers are at risk of being missed this quarter.
        sub:
          - name: CFO & controllers
            cares: gross-to-net margin, cash and inventory valuation.
          - name: Rebate & pricing admin
            cares: supplier rebate accruals and customer chargeback claims.
          - name: Credit & AR
            cares: customer credit exposure and collections across the book.
        ucs:
          - Working Capital & Cash Flow Optimization
          - Order Processing Automation
  - name: Technical
    icon: code
    tiles:
      - name: Supply Chain Data Eng
        mark: Lakeflow
        summary: Land the SAP, Infor and Epicor ERP, Manhattan and Blue Yonder WMS, TMS and EDI feeds; own the Bronze to Silver path and the pager when replenishment tables stall.
        uses:
          - - Lakeflow Connect
            - Managed connectors for the ERP, WMS and SaaS commerce sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on order, shipment and EDI feeds.
          - - Lakewatch
            - Freshness on the inventory and fill-rate tables ops reads every morning.
        sub:
          - name: Ingestion Engineers
            cares: the SAP, Infor and Epicor ERP, WMS, TMS and EDI order feeds landed on time.
          - name: Pipeline Engineers
            cares: the Bronze-to-Silver path and expectations on order, shipment and EDI feeds.
          - name: Platform Reliability
            cares: freshness of the fill-rate and margin tables ops and finance read every morning.
      - name: Pricing & Demand Sci
        mark: MLflow
        summary: Demand-forecast, price-elasticity, churn and inventory-optimisation models built from POS, order and Vendavo and PROS data, and whether they still hold as the network shifts.
        uses:
          - - Feature Store
            - Customer, SKU and location features read identically in training and serving.
          - - MLflow
            - Every forecast and pricing model tracked for audit and reproduction.
          - - Model Serving
            - Price, demand and churn models scored in the quote and replenishment path.
        sub:
          - name: Forecasting Scientists
            cares: demand and price-elasticity models across SKU-location and customer.
          - name: Optimization Scientists
            cares: inventory and safety-stock models under service and working-capital limits.
          - name: MLOps
            cares: every forecast and pricing model tracked for audit and reproduction.
      - name: Commercial App Devs
        mark: Apps
        summary: Ship the inventory command, pricing cockpit, OTIF tower and rebate applications the commercial and operations teams work in, hosted next to governed data.
        uses:
          - - Apps
            - Operational screens with no separate web tier to run or secure.
          - - Lakebase
            - Serverless Postgres for quote, replenishment and rebate-claim state.
          - - Agent Bricks
            - Agents that draft a reorder or a price quote against governed tools.
        sub:
          - name: Frontend Engineers
            cares: the inventory command, pricing cockpit and OTIF tower screens teams work in.
          - name: Backend Engineers
            cares: Lakebase state for quote, replenishment and rebate-claim writeback.
          - name: Agent Builders
            cares: agents that draft a reorder or a price quote against governed tools.
consumers:
  - name: BI & Productivity
    icon: chart
    from: bi
    simplified: 2
    tiles:
      - name: Tableau / Power BI
        icon: chart
        summary: Executive and branch dashboards against SQL warehouses, with Unity Catalog permissions enforced end to end.
      - name: Microsoft Teams
        icon: chat
        summary: Genie in Teams for margin and fill-rate answers in the channel the commercial team already works in.
      - name: Notebooks & IDEs
        icon: notebook
        summary: Analyst notebooks, VS Code and JetBrains against governed order and inventory data.
  - name: Customer & Supplier
    icon: partner
    tiles:
      - name: Customer & Punchout
        icon: api
        summary: Contract pricing, availability and reorder guidance served to buyer procurement and punchout catalogs.
        citations:
          - sap-commerce
      - name: Supplier Portals
        core: true
        icon: partner
        summary: Forecasts, scorecards and replenishment signals shared to suppliers over Delta Sharing rather than spreadsheets.
      - name: EDI Outbound
        icon: stream
        summary: Purchase orders, ASNs and invoices pushed back to trading partners through the EDI network.
        citations:
          - sps
  - name: Operational Writeback
    icon: opdb
    tiles:
      - name: ERP Replenishment
        icon: erp
        summary: Reorder points and purchase-order suggestions written back into the ERP so the buy reaches the procurement path.
        citations:
          - sap
      - name: WMS Slotting
        icon: store
        summary: Slotting and wave recommendations written to the warehouse system operations already works in.
        citations:
          - manhattan
      - name: Price & Quote Sync
        core: true
        icon: market
        summary: Contract prices and quote guidance written back to CRM and commerce at the point of sale.
        citations:
          - vendavo
  - name: Regulatory & Reporting
    icon: gavel
    tiles:
      - name: Trade & Tax Compliance
        icon: gavel
        summary: Sales-and-use tax, customs and controlled-product reporting produced from the same governed tables the business runs on.
      - name: Financial Reporting
        icon: share
        summary: Rebate, margin and inventory-valuation reporting filed from contracted Gold products.
  - name: Published Products
    icon: product
    tiles:
      - name: Data Products
        icon: product
        summary: Published, contracted products discoverable in Unity Catalog Domains and shared over OpenSharing.
      - name: Sharing Recipients
        core: true
        icon: share
        summary: Suppliers, carriers and buying groups reading governed shared tables without separately maintained publisher extracts.
  - name: Databricks Apps
    icon: apps
    tiles:
      - name: Inventory Command
        icon: gauge
        short: Replenishment
        summary: Replenishment, safety-stock, dead-stock and warehouse labor and pick-path recommendations by SKU and branch, so buyers reorder on predicted demand instead of a fixed reorder point, on Databricks Apps over Lakebase.
      - name: Pricing Cockpit
        icon: market
        short: Quote guidance
        summary: Where sales and pricing see the margin floor, competitor context and win probability on a quote before a contract price is agreed.
      - name: OTIF Control Tower
        icon: stream
        short: Service levels
        summary: Live order and shipment state against the promised delivery date, flagging orders that will miss on-time-in-full and reviewing route plans handed to Oracle OTM for execution.
      - name: Rebate Manager
        icon: gavel
        short: Margin recovery
        summary: Supplier rebate accruals and customer chargeback claims tracked to contract terms, so earned rebates are captured and invalid chargebacks are disputed.
  - name: AI/BI Dashboards
    icon: aibi
    tiles:
      - name: Fill-Rate & Service
        icon: aibi
        summary: Fill rate, OTIF and orders at risk across customers and branches.
        kpis:
          - Fill rate
          - OTIF
          - Orders at risk
          - Backorder rate
          - Perfect order rate
        teams:
          - Supply Chain & Ops
          - Executive Office
          - Demand & supply planning
      - name: Margin & Rebate Recovery
        icon: aibi
        summary: Gross-to-net margin, rebate accruals and chargeback exposure.
        kpis:
          - Gross-to-net margin
          - Rebate accrual
          - Chargeback exposure
          - Margin leakage
          - Net profit
        teams:
          - Finance & Rebates
          - CFO & controllers
          - Executive Office
      - name: Inventory & Working Capital
        icon: aibi
        summary: Inventory turns, dead stock and working capital by SKU and branch.
        kpis:
          - Inventory turns
          - Days on hand
          - Dead stock value
          - Working capital
          - Stockout rate
        teams:
          - Supply Chain & Ops
          - Category & Merch
          - Finance & Rebates
      - name: Sales & Customer Health
        icon: aibi
        summary: Estimated share of wallet, churn risk and cross-sell across the account base.
        kpis:
          - Estimated share of wallet
          - Churn risk
          - Cross-sell rate
          - Win rate
          - Order frequency
        teams:
          - Sales & Commercial
          - Account management
          - Inside sales & e-commerce
  - name: Agent Harnesses
    icon: agents
    tiles:
      - name: Omnigent OSS
        icon: omni
        short: Databricks, open source
        summary: Open-source meta-harness above existing agent frameworks, enabling agent composition, collaboration and centralised governance from one interface.
        capabilities:
          - Build
          - Deploy
          - Optimize
          - Govern
        related:
          - Agent Bricks
          - Unity Gateway
      - name: Claude Code
        core: true
        icon: code
        short: 3rd-party harness
        summary: Anthropic's coding harness working against the platform through MCP, with spend, routing and policy governed by Unity Gateway.
      - name: OpenAI Codex
        core: true
        icon: code
        short: 3rd-party harness
        summary: OpenAI's coding harness connected over MCP, governed at runtime by Unity Gateway rather than trusted by configuration.
      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Inventory & Fulfilment Agent
        icon: genie
        summary: Plan stock positions, fill rate and orders at risk of missing OTIF.
        feeds:
          - SAP S/4HANA
          - Manhattan Active WMS
          - project44
          - Fill-rate, margin, forecast
        teams:
          - Supply Chain & Ops
          - Demand & supply planning
          - Warehouse operations
        questions:
