  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Demand Forecasting
        short: SKU-location planning
        icon: chart
        summary: SKU-location demand forecasts across a long-tail catalog and a branch network, blending sell-through, order history, seasonality and promotions.
        problem: A distributor forecasts hundreds of thousands of SKU-location pairs on a spreadsheet cadence, so slow movers overstock and fast movers stock out between refreshes.
        who_benefits: Category & Merch
        how_built: Order, POS and promotion feeds are conformed to Gold; fine-grained forecasts are trained in MLflow and scored per SKU-location, feeding replenishment and buy decisions.
        components:
          - Inventory Command
          - Model Serving
          - SAP S/4HANA
          - AI/BI
          - Feature Store
        stories:
          - title: Demand Forecasting at Scale on Databricks
            url: https://www.databricks.com/solutions/accelerators/demand-forecasting
          - title: ReaderLink, North America's largest book distributor, forecasts demand on Databricks
            url: https://www.databricks.com/blog/revolutionizing-enterprise-data-analytics-readerlink-sql-ai-powered-insights
      - name: Inventory Optimization
        short: Stock & service
        icon: store
        summary: Safety-stock, reorder-point and assortment decisions tuned to service-level targets and the cash tied up in inventory across every branch.
        problem: Inventory is set by static min-max rules per branch, so millions in working capital sit in the wrong SKUs while service levels still miss on the ones that matter.
        who_benefits: Supply Chain & Ops
        how_built: Forecasts and lead-time variability feed multi-echelon optimisation in Model Serving; recommendations surface in the Inventory Command app and write back to the ERP.
        components:
          - Inventory Command
          - Model Serving
          - Manhattan Active WMS
          - Lakehouse//RT
          - MLflow
        stories:
          - title: Supply Chain Distribution Optimization
            url: https://www.databricks.com/solutions/accelerators/supply-chain-distribution-optimization
      - name: Dynamic Pricing
        short: Contract & quote
        icon: market
        summary: Contract and quote prices set per customer, product and volume against cost, competitor context and willingness to pay rather than a static price book.
        problem: Thousands of negotiated contract prices drift from cost, so margin leaks quietly on renewals and reps discount to the floor without knowing where the floor is.
        who_benefits: Sales & Commercial
        how_built: Vendavo and PROS pricing data are conformed in the lakehouse; elasticity and win-probability models score each quote through Model Serving behind the Pricing Cockpit.
        components:
          - Pricing Cockpit
          - Vendavo Pricing
          - PROS Pricing
          - Model Serving
          - AI/BI
        stories:
          - title: Data and AI in action across the energy industry
            url: https://www.databricks.com/blog/powering-future-data-and-ai-action-across-energy-industry
      - name: Distribution & Logistics Optimization
        short: Route & freight
        icon: stream
        summary: Delivery routes, carrier choice and last-mile execution optimised across the branch and DC network to cut freight cost and hit the delivery window.
        problem: Routes and carrier assignments are planned in silos per branch, so trucks run half-empty, freight spend climbs and delivery windows slip.
        who_benefits: Supply Chain & Ops
        how_built: Order, shipment and TMS feeds are conformed; route and load plans are generated in Model Serving, reviewed in the OTIF Control Tower and handed to Oracle OTM for transport execution against live in-transit state.
        components:
          - OTIF Control Tower
          - Oracle OTM
          - project44
          - Model Serving
          - Lakehouse//RT
        stories:
          - title: Scalable Route Generation on Databricks
            url: https://www.databricks.com/solutions/accelerators/scalable-route-generation
          - title: Scalable Route Generation With Databricks
            url: https://www.databricks.com/blog/solution-accelerator-scalable-route-generation-databricks-and-osrm
      - name: Customer 360
        short: Account 360
        icon: custlake
        summary: A unified account view predicting which customers are drifting and which product lines they should be buying, scored against the order history the CRM and ERP already hold.
        problem: 'A distributor loses accounts quietly: orders taper for months before anyone notices, and cross-sell whitespace sits unworked because no one scores it.'
        who_benefits: Sales & Commercial
        how_built: Order and CRM history are activated through CustomerLake; churn and next-best-order models are scored in Model Serving and served into the rep's account view.
        components:
          - Feature Store
          - Model Serving
          - Salesforce Sales Cloud
          - CustomerLake
          - AI/BI
        stories:
          - title: Calculate Customer Lifetime Value
            url: https://www.databricks.com/solutions/accelerators/customer-lifetime-value
      - name: Supply & Materials Planning
        short: Supplier lead-time risk
        icon: partner
        summary: Supplier lead-time reliability and single-source exposure surfaced across the buy so shortages are caught before they stall branch replenishment.
        problem: Supplier risk and lead-time variability sit unread across the ERP and inbound EDI feeds, so a slipping supplier or single-source SKU only becomes visible after a stockout has already hit the branches.
        who_benefits: Supply Chain & Ops
        how_built: SAP S/4HANA purchase orders and SPS Commerce EDI ASNs are conformed to Gold; lead-time and supplier-risk models score in Model Serving, and exposure surfaces in the Inventory Command app with Genie One for ad hoc questions.
        components:
          - SAP S/4HANA
          - SPS Commerce EDI
          - Dun & Bradstreet
          - Model Serving
          - Inventory Command
          - Genie One
        stories:
          - title: 'Customer Story: J.B. Hunt'
            url: https://www.databricks.com/customers/jbhunt
          - title: Fleet optimization with CARTO & Databricks
            url: https://www.databricks.com/blog/fleet-optimization-carto-databricks
      - name: Next-Best Commercial Offer
        short: Cross-sell offers
        icon: custlake
        summary: Ranked next-best product and reorder offers per account, so reps and the B2B portal pitch what a customer is most likely to buy next instead of a generic catalog.
        problem: Cross-sell whitespace across a long-tail catalog goes unworked because no one scores which product a given account should buy next, so reps default to reorders and the portal shows a generic catalog.
        who_benefits: Sales & Commercial
        how_built: Order, CRM and commerce history are conformed through CustomerLake and Feature Store; next-best-offer models score in Model Serving and surface in the rep's Salesforce view and the SAP Commerce portal.
        components:
          - CustomerLake
          - Feature Store
          - Model Serving
          - Salesforce Sales Cloud
          - SAP Commerce Cloud
        stories:
          - title: Recommendation Engines for Personalization
            url: https://www.databricks.com/solutions/accelerators/recommendation-engines
      - name: Order Processing Automation
        stories:
          - title: What is Intelligent Document Processing?
            url: https://www.databricks.com/blog/intelligent-document-processing
          - title: Document Intelligence on Databricks
            url: https://www.databricks.com/product/artificial-intelligence/document-intelligence
        short: EDI order-to-cash
        icon: api
        summary: EDI, portal and email orders parsed, validated and posted to the ERP automatically so the cash cycle no longer waits on manual keying.
        problem: Customer orders arrive as EDI, email, portal and phone in dozens of formats, so branch teams key them by hand into the ERP, errors creep in and the cash cycle waits on the backlog.
        who_benefits: Supply Chain & Ops
        how_built: SPS and TrueCommerce EDI and SAP Commerce orders land through Lakeflow, AI Functions parse and validate each order against the SAP catalog, and clean orders write to the ERP with exception state held on Lakebase.
        components:
          - SPS Commerce EDI
          - TrueCommerce EDI
          - SAP Commerce Cloud
          - AI Functions
          - Lakeflow
          - Lakebase
      - name: Cyber Threat Monitoring & Detection
        short: Systems cyber defense
        icon: zshield
        summary: Threats to the ERP, WMS, TMS and EDI systems detected from access and network logs before they divert orders, freight or payments.
        problem: ERP, WMS, TMS and EDI logins, API calls and document exchanges throw off security signals that sit unwatched across systems, so a compromised account or a spoofed trading-partner feed is caught only after orders or payments are already diverted.
        who_benefits: Supply Chain Data Eng
        how_built: ERP, WMS, TMS and EDI access and network logs land through Lakeflow, and anomaly-detection models tracked in MLflow score in Model Serving under Unity Catalog to flag account takeover, feed spoofing and data exfiltration for review.
        components:
          - Lakeflow
          - Model Serving
          - MLflow
          - Unity Catalog
          - Lakehouse//RT
        stories:
          - title: 'The Rosetta stone of CPS: Claroty’s AI-powered library'
            url: https://www.databricks.com/blog/rosetta-stone-cps-clarotys-ai-powered-library
      - name: Working Capital & Cash Flow Optimization
        short: Cash & margin
        icon: gauge
        summary: Cash tied up in inventory, receivables and unclaimed rebates surfaced by branch so the CFO steers days-of-cash before a thin-margin quarter squeezes.
        problem: Cash is trapped across inventory, receivables and unclaimed rebates in separate ledgers, so the CFO cannot see days-of-cash by branch or act before a thin-margin quarter turns into a cash squeeze.
        who_benefits: Finance & Rebates
        how_built: ERP receivables and inventory and the federated rebate mart are conformed under Unity Catalog, credit and payment-risk models score in Model Serving, and days-of-cash and exposure surface in AI/BI with Genie for ad hoc questions.
        components:
          - SAP S/4HANA
          - Finance & Rebate Mart
          - Dun & Bradstreet
          - Model Serving
          - AI/BI
          - Genie One
        stories:
          - title: Volvo Group increases spare-parts inventory visibility with Databricks
            url: https://www.databricks.com/customers/volvo/lakeflow-declarative-pipelines
medallion:
  Bronze:
    short: Raw ERP, WMS, EDI feeds
    summary: Orders, shipments and invoices from the ERP, WMS pick and putaway events, TMS movements and inbound EDI transactions, landed exactly as received so a short-ship or a price can always be replayed as it stood.
  Silver:
    short: Conformed customer, SKU, order
    summary: Customers, SKUs, suppliers and orders resolved into single conformed entities across the ERP, WMS, CRM and commerce estates, with ship-to and bill-to hierarchies reconciled and EDI trading partners matched.
  Gold:
    short: Fill-rate, margin, forecast
    summary: 'Contracted products the commercial and operations teams run on: fill rate and OTIF by customer and branch, gross-to-net margin after rebates, inventory turns, and SKU-location demand forecasts.'
