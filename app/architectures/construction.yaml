  - name: Databricks Apps
    icon: apps
    tiles:
      - name: Project Command
        icon: gauge
        short: Earned value
        summary: SPI, CPI and forecast at completion across the active portfolio.
      - name: Bid Analyzer
        icon: market
        short: Preconstruction
        summary: Historical productivity and risk allowances applied to new bids.
      - name: Field Daily Log
        icon: stream
        short: Production tracking
        summary: Installed quantities and labor hours vs daily plan.
      - name: Safety Dashboard
        icon: gavel
        short: Leading indicators
        summary: Observations, near-misses and training gaps before TRIR rises.
  - name: AI/BI Dashboards
    icon: aibi
    tiles:
      - name: WIP & Margin
        icon: aibi
        summary: Job margin, earned value and forecast at completion across the portfolio.
        kpis:
          - Job margin
          - CPI
          - SPI
          - Forecast at completion
          - Backlog
        teams:
          - GC President & COO
          - Project Managers
          - Cost Controllers
      - name: Field Productivity & Equipment
        icon: aibi
        summary: Labor productivity, daily production and equipment utilisation.
        kpis:
          - Units per labor hour
          - Production vs plan
          - Equipment utilisation
          - Idle time
          - Rental cost
        teams:
          - Field Superintendents
          - General Superintendent
          - Site Superintendent
