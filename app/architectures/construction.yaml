        icon: aibi
        summary: Win rate, unit-cost benchmarks and subcontractor risk before award.
        kpis:
          - Win rate
          - Bid margin
          - Unit-cost variance
          - Subcontractor risk
          - Trade coverage
        teams:
          - Estimating
          - Chief Estimator
          - Preconstruction Lead
  - name: Agent Harnesses
    icon: agents
    tiles:
      - name: Omnigent OSS
        icon: omni
        short: Databricks, open source
        summary: Open-source meta-harness above existing agent frameworks, enabling agent composition, collaboration and centralised governance from one interface.
        capabilities:
          - Build
          - Deploy
          - Optimize
          - Govern
        related:
          - Agent Bricks
          - Unity Gateway
      - name: Claude Code
        core: true
        icon: code
        short: 3rd-party harness
        summary: Anthropic's coding harness working against the platform through MCP, with spend, routing and policy governed by Unity Gateway.
      - name: OpenAI Codex
        core: true
        icon: code
        short: 3rd-party harness
        summary: OpenAI's coding harness connected over MCP, governed at runtime by Unity Gateway rather than trusted by configuration.
      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Cost & Completion Agent
        icon: genie
        summary: Track job margin, earned value and forecast at completion, plus BIM clash and 4D coordination and long-lead procurement against the schedule.
        feeds:
          - Trimble Viewpoint Vista
          - Sage 300 CRE
          - Primavera P6
          - Autodesk Revit
          - Navisworks
          - Bentley iTwin
          - Margin, schedule, safety
        teams:
          - Project Managers
          - Cost Controllers
          - GC President & COO
        questions:
          - Which jobs are below their forecast margin this month?
          - What is CPI and SPI by job right now?
          - How much change-order exposure is pending but not yet approved?
          - Which jobs have the largest variance to forecast at completion?
          - What is total backlog and projected revenue by region?
          - Which unresolved clashes between structural, mechanical and electrical models threaten the schedule?
          - Which 4D sequence options best absorb a slip on the critical path before the field builds them?
          - Which long-lead materials and buyout items are at risk of missing their need date on the P6 plan?
      - name: Field & Fleet Agent
        icon: genie
        summary: Run daily production, site progress and equipment health across active sites.
        feeds:
          - Procore
          - Samsara Fleet
          - United Rentals Total Control
          - Conformed projects and WBS
        teams:
          - Field Superintendents
          - General Superintendent
          - Site Superintendent
        questions:
          - What is units per labor hour by trade and job this week?
          - Which equipment is sitting idle while another site waits?
          - Which crews are behind the daily production plan?
          - What is equipment utilisation by asset across active sites?
          - Which trades are on the critical path and slipping?
      - name: Site Safety Agent
        icon: genie
        summary: Surface leading indicators, incidents and punch-list risk across sites.
        feeds:
          - HammerTech
          - OSHA Incident Data
          - Autodesk Build
          - Margin, schedule, safety
        teams:
          - Safety & Quality
          - EHS Director
          - Safety Manager
        questions:
          - Which sites have rising near-miss rates before TRIR moves?
          - What is our TRIR by region and job type this year?
          - Which inspection and permit items are overdue?
          - Where is punch-list burndown behind at closeout?
          - Which subcontractors have the worst safety observation record?
      - name: Bid & Estimating Agent
        icon: genie
        summary: Score bid win rate, unit costs and subcontractor prequalification before award.
        feeds:
          - ISNetworld
          - Dodge Construction Network
          - Trimble Viewpoint Vista
          - Conformed projects and WBS
        teams:
          - Estimating
          - Chief Estimator
          - Preconstruction Lead
        questions:
          - What is our bid win rate by job type and region?
          - Which subcontractors carry the highest default or safety risk?
          - How do our unit costs compare to historical productivity?
          - Which trades have thin coverage on upcoming bids?
          - Where are margins most sensitive on the current pipeline?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Engineering Program Management & Bid Creation
        stories:
          - title: Databricks for Federal Government
            url: https://www.databricks.com/solutions/industries/federal-government
        short: Preconstruction
        icon: market
        summary: Win probability, unit-cost basis and subcontractor risk brought together for GC preconstruction, with pursuit milestones and program deliverables tracked against the schedule so bids and program commitments are priced and paced on evidence, not memory.
        problem: Estimators price new work from memory and scattered historical jobs, subcontractor prequalification, safety and past performance sit in separate systems, and preconstruction deliverables and pursuit milestones live in disconnected trackers, so trades are awarded on price and programs commit without a clear read on cost basis, delivery risk or milestone readiness.
        who_benefits: Estimating
        how_built: Dodge leads, ISNetworld scores and Viewpoint historical cost conform on Delta Lake under Unity Catalog; win-probability and subcontractor-risk models tracked in MLflow score through Model Serving, an agent built on Agent Bricks drafts proposal narratives in the Bid Analyzer, and pursuit milestones and preconstruction deliverables are tracked against the Primavera P6 schedule so program commitments are managed alongside the bid.
        components:
          - Bid Analyzer
          - Dodge Construction Network
          - ISNetworld
          - Model Serving
          - MLflow
          - Agent Bricks
          - Primavera P6
      - name: Workforce Safety
        short: EHS
        icon: gavel
        summary: Leading indicators predicting recordable incidents before TRIR moves.
