pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Lab Leadership
        mark: Genie One
        summary: The lab CEO and COO on volume, cost per test and network capacity; the medical director on diagnostic quality and the test menu; the CFO on reimbursement, payer mix and margin per accession.
        uses:
          - - Genie One
            - Ask what a test line cost or what drove denials last month without an analyst pull.
          - - AI/BI
            - Cost per test, turnaround and margin per accession on one certified set of Metric Views.
          - - Unity Catalog
            - Certification and the glossary so "billable test" and "TAT" mean one thing across sites.
        sub:
          - name: Lab CEO & COO
            cares: volume, cost per test and network capacity.
          - name: Medical director
            cares: diagnostic quality and the test menu.
          - name: CFO & finance
            cares: reimbursement, payer mix and margin per accession.
        ucs:
          - Test Utilization
          - AMR Surveillance
          - Turnaround Time
          - Denials & Billing
      - name: Pathology
        mark: Model Serving
        summary: Anatomic pathologists reading whole-slide images and reporting diagnoses, molecular pathology interpreting NGS and FISH assays, and cytology screening cases before sign-out.
        uses:
          - - Pathology Viewer
            - Whole-slide images pre-screened with metastasis heat maps before sign-out.
          - - Model Serving
            - Image and molecular classifiers scored in the diagnostic path.
          - - MLflow
            - Every diagnostic model tracked for validation and audit.
        sub:
          - name: Anatomic pathologists
            cares: whole-slide reading and diagnostic sign-out.
          - name: Molecular pathology
            cares: NGS, FISH and companion-diagnostic interpretation.
          - name: Cytology
            cares: screening and adequacy before sign-out.
        ucs:
          - Digital Pathology AI
          - Molecular Diagnostics
          - Test Utilization
      - name: Lab Operations
        core: true
        mark: Lakehouse//RT
        summary: Lab operations managers on turnaround and backlog, bench supervisors on autoverification and repeat rates, and pre-analytic and phlebotomy teams on specimen quality and rejections.
        uses:
          - - TAT Command Center
            - Turnaround and backlog by bench flagged before a STAT misses target.
          - - Lakehouse//RT
            - Live accession and instrument state at the latency a bench moves at.
          - - Model Serving
            - Autoverification and delay models scored in the result path.
        sub:
          - name: Operations managers
            cares: turnaround, backlog and staffing across benches.
          - name: Bench supervisors
            cares: autoverification and repeat rates.
          - name: Pre-analytic & phlebotomy
            cares: specimen quality and rejections.
        ucs:
          - Turnaround Time
          - Result Autoverify
          - Critical Value Alerts
          - Instrument Uptime
      - name: QC & Accred
        mark: AI/BI
        summary: QA and QC managers on Levey-Jennings and Westgard rules, accreditation leads on CLIA and CAP readiness and proficiency testing, and lab safety on competency and audit trails.
        uses:
          - - AI/BI
            - QC drift, proficiency testing and audit readiness on certified Metric Views.
          - - Unity Catalog
            - Audit trails and lineage supporting CLIA and CAP inspection.
          - - Genie One
            - Ask which analytes breached Westgard rules this week.
        sub:
          - name: QA & QC managers
            cares: Levey-Jennings, Westgard rules and QC drift.
          - name: Accreditation leads
            cares: CLIA, CAP readiness and proficiency testing.
          - name: Lab safety
            cares: competency, training and audit trails.
        ucs:
          - QC & Accreditation
          - Instrument Uptime
          - Result Autoverify
      - name: Revenue Cycle
        mark: AI/BI
        summary: Billing and coding on clean-claim rate and medical-necessity coding, denials management on payer denials and appeals, and payer contracting on reimbursement and prior authorization.
        uses:
          - - Denials Workbench
            - Denials triaged by root cause with the evidence to appeal assembled.
          - - Model Serving
            - Denial-risk and medical-necessity models scored before submission.
          - - AI/BI
            - Clean-claim rate, denial rate and net collection on certified views.
        sub:
          - name: Billing & coding
            cares: clean-claim rate and medical-necessity coding.
          - name: Denials management
            cares: payer denials, appeals and write-offs.
          - name: Payer contracting
            cares: reimbursement and prior authorization.
        ucs:
          - Denials & Billing
          - Test Utilization
          - Turnaround Time
  - name: Technical
    icon: code
    tiles:
      - name: Interface Eng
        mark: Lakeflow
        summary: Land HL7 v2 orders and results, FHIR resources and analyzer ASTM messages through the interface engine; own the Bronze to Silver path and the pager when result feeds stall.
        uses:
          - - Lakeflow Connect
            - Managed connectors for LIS, LIMS, ERP and billing sources.
          - - Auto Loader
            - HL7, ASTM and instrument files landed incrementally into Bronze.
          - - Lakewatch
            - Freshness on the result and order tables the benches read all shift.
      - name: Diagnostics DS
        mark: MLflow
        summary: Whole-slide image models, autoverification and denial classifiers, and molecular interpretation models, and whether they still hold as assays and instruments change.
        uses:
          - - Feature Store
            - Specimen, patient and analyte features read identically in training and serving.
          - - MLflow
            - Every diagnostic and operational model tracked for validation and audit.
          - - Model Serving
            - Image, autoverification and denial models scored in the lab path.
      - name: Lab App Dev
        mark: Apps
        summary: Ship the TAT, pathology-viewer and denials applications the lab works in, hosted next to governed accession and result data.
        uses:
          - - Apps
            - Operational lab screens with no separate web tier to run or secure.
          - - Lakebase
            - Serverless Postgres for accession workflow state and governed writes.
          - - Agent Bricks
            - Agents that draft an appeal or a QC investigation against governed tools.
