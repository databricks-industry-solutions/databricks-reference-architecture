agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Turnaround & Operations Agent
        icon: genie
        summary: Ask about turnaround, backlog and benches at risk of missing target in plain language.
        feeds:
          - Epic Beaker LIS
          - DI Instrument Manager
          - Instrument Events
          - TAT, utilization, QC
        teams:
          - Lab Operations
          - Operations managers
          - Bench supervisors
        questions:
          - What is turnaround time by bench against target right now?
          - Which STAT orders are at risk of missing turnaround?
          - Where is the backlog deepest across the benches?
          - What is the autoverification rate by analyzer today?
          - Which specimens were rejected and for what reason?
      - name: Pathology & Diagnostics Agent
        icon: genie
        summary: Explore case volumes, sign-out throughput and molecular results across pathology.
        feeds:
          - Philips IntelliSite
