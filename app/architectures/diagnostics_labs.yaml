  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Turnaround Time
        short: Operations
        icon: gauge
        summary: Accessions tracked from collection to verified result across every bench, so the orders that will miss turnaround are moved before the STAT is late.
        problem: Turnaround is measured after the fact in the LIS, so a backlog on a bench or a stalled analyzer is discovered when a clinician chases a STAT, not before.
        who_benefits: Lab Operations
        how_built: LIS accession events and analyzer middleware feeds land in Lakehouse//RT; delay models score orders in Model Serving and the TAT Command Center flags benches that will miss target before the result is late.
        components:
          - TAT Command Center
          - Lakehouse//RT
          - Epic Beaker LIS
          - DI Instrument Manager
          - AI/BI
        stories:
          - title: Databricks for Healthcare and Life Sciences
            url: https://www.databricks.com/solutions/industries/healthcare-and-life-sciences
      - name: Digital Pathology AI
        short: Pathology
        icon: media
        summary: Whole-slide images processed at scale with deep learning to pre-screen for metastasis and prioritise cases before a pathologist signs out.
        problem: Whole-slide images are gigapixel and reviewed manually, so screening is slow and the hardest cases wait behind routine ones in the same queue.
        who_benefits: Pathology
        how_built: Slides from the digital-pathology scanners are processed with the Databricks pathology accelerator; metastasis models score tiles in Model Serving and surface heat maps in the Pathology Viewer for triage and sign-out.
        components:
          - Pathology Viewer
          - Philips IntelliSite
          - Leica Aperio
          - Model Serving
          - MLflow
          - Unity Catalog
        stories:
          - title: Digital Pathology Image Analysis solution accelerator
            url: https://www.databricks.com/solutions/accelerators/digital-pathology
          - title: Why Pathnostics chose Databricks for complex diagnostics data
            url: https://www.databricks.com/blog/why-pathnostics-chose-databricks-data-intelligence-platform-its-most-complex-diagnostics-data
      - name: Result Autoverify
        short: Operations
        icon: zeroops
        summary: Routine results released automatically against rules and prior-result deltas, so technologists spend their time on the cases that actually need a human.
        problem: Every result queues for manual verification even when it is normal and consistent with history, so technologist time is spent on the routine and the abnormal waits behind it.
        who_benefits: Lab Operations
        how_built: Analyzer results flow through the middleware into the lakehouse; automatic release follows laboratory-approved autoverification rules in the LIS and middleware, with delta-check and model outputs from Model Serving used under that same release policy so routine results release and only exceptions reach a technologist.
        components:
          - DI Instrument Manager
          - Analyzer Data
          - Model Serving
          - Lakehouse//RT
          - Sunquest LIS
        stories:
          - title: Databricks for Healthcare and Life Sciences
            url: https://www.databricks.com/solutions/industries/healthcare-and-life-sciences
      - name: Test Utilization
        short: Leadership
        icon: chart
        summary: Ordering patterns by provider, panel and guideline, so redundant and low-value tests are steered out and send-out cost is controlled.
        problem: Duplicate orders, reflex tests and expensive send-outs are ordered against no consistent guideline, so cost per accession creeps and the menu is never rationalised.
        who_benefits: Lab Leadership
        how_built: Order, result and coding data are conformed to certified Metric Views mapped to LOINC; the Utilization Hub and Genie surface redundant and low-value ordering for the medical director to steer.
        components:
          - Utilization Hub
          - AI/BI
          - Genie One
          - LOINC & SNOMED
          - Unity Catalog
        stories:
          - title: Databricks for Healthcare and Life Sciences
            url: https://www.databricks.com/solutions/industries/healthcare-and-life-sciences
      - name: Denials & Billing
        short: Revenue cycle
        icon: market
        summary: Claim denials predicted and triaged by root cause with the medical-necessity evidence assembled to appeal, so cash is not left on the table.
        problem: Denials are worked reactively across the billing system and spreadsheets, so appealable claims age past the window and the same root causes recur unmeasured.
        who_benefits: Revenue Cycle
        how_built: Accession, result and claim data are joined in the lakehouse; denial-risk models score claims in Model Serving before submission and the Denials Workbench assembles appeals on Lakebase.
        components:
          - Denials Workbench
          - XiFin RCM
          - Model Serving
          - AI/BI
          - Lakebase
        stories:
          - title: 'Beyond parsing X12: Closing the gap for revenue cycle workflows in healthcare'
            url: https://www.databricks.com/blog/beyond-parsing-x12-closing-gap-revenue-cycle-workflows-healthcare
      - name: QC & Accreditation
        short: Quality
        icon: gavel
        summary: QC drift, proficiency testing and audit trails on certified data, so CLIA and CAP inspection is a query rather than a scramble.
        problem: QC lives in instrument middleware and spreadsheets and accreditation evidence is assembled by hand, so Westgard breaches are caught late and every inspection is a fire drill.
        who_benefits: QC & Accred
        how_built: QC results and proficiency testing are conformed to Gold under Unity Catalog; Levey-Jennings and Westgard monitoring runs in AI/BI with lineage that supports CLIA and CAP inspection.
        components:
          - Bio-Rad Unity QC
          - AI/BI
          - Unity Catalog
          - Lakeflow
        stories:
          - title: Databricks for Healthcare and Life Sciences
            url: https://www.databricks.com/solutions/industries/healthcare-and-life-sciences
      - name: Molecular Diagnostics
        short: Pathology
        icon: ontology
        summary: NGS, FISH and companion-diagnostic results interpreted and reported with the unstructured assay context pathologists need to sign out.
        problem: Molecular results arrive as large, semi-structured assay outputs the LIS was never built to hold, so interpretation and reporting are slow and evidence is scattered.
        who_benefits: Pathology
        how_built: NGS and molecular outputs land in Delta Lake alongside the LIMS record; AI Functions extract and structure assay context and interpretation models score in Model Serving for sign-out.
        components:
          - LabWare LIMS
          - AI Functions
          - Model Serving
          - Delta Lake
          - Unity Catalog
        stories:
          - title: Why Pathnostics chose Databricks for complex diagnostics data
            url: https://www.databricks.com/blog/why-pathnostics-chose-databricks-data-intelligence-platform-its-most-complex-diagnostics-data
          - title: Real-World Evidence Solution Accelerator
            url: https://www.databricks.com/solutions/accelerators/real-world-evidence
      - name: Critical Value Alerts
        short: Operations
        icon: stream
        summary: Verified critical-threshold results flagged for timely routing to the ordering clinician, with predictive deterioration surfaced as separate review flags and acknowledgement closing the loop.
        problem: Critical values depend on a technologist reaching a clinician by phone, so a life-threatening result can wait in a queue and read-back is hard to evidence.
        who_benefits: Lab Operations
        how_built: Verified results stream through the interface engine into Lakehouse//RT; critical-threshold breaches raise notifications while early-deterioration models in Model Serving surface separate review flags; results deliver over FHIR to a routing target with an explicit acknowledgement and escalation workflow rather than guaranteed instant delivery.
        components:
          - Rhapsody Engine
          - Lakehouse//RT
          - Model Serving
          - Provider FHIR Results
        stories:
          - title: MUSC detects at-risk sepsis patients from real-world data
            url: https://www.databricks.com/blog/2020/10/20/detecting-at-risk-patients-with-real-world-data.html
      - name: Instrument Uptime
        short: Engineering
        icon: iot
        summary: Analyzer telemetry scored for drift and failure so a maintenance call is planned before an instrument goes down mid-run.
        problem: An analyzer failure mid-run scraps specimens and stalls a bench, and without telemetry the first signal is a failed QC or a dead instrument, not a prediction.
        who_benefits: QC & Accred
        how_built: Analyzer and middleware telemetry stream into the lakehouse; remaining-useful-life models score each instrument in Model Serving so service is planned before an unplanned failure.
        components:
          - Analyzer Data
          - Instrument Events
          - MLflow
          - Model Serving
          - AI/BI
        stories:
          - title: Predictive maintenance on the Databricks Lakehouse
            url: https://www.databricks.com/blog/what-is-predictive-maintenance
      - name: AMR Surveillance
        short: Population
        icon: zshield
        summary: Antibiotic resistance tracked across microbiology results and reported to clinicians and public health, so stewardship acts on real local patterns.
        problem: Resistance patterns sit in microbiology results no one aggregates, so antibiograms are annual and stewardship and public-health reporting lag the actual local trend.
        who_benefits: Lab Leadership
        how_built: Microbiology results are conformed with LOINC and SNOMED in the lakehouse; resistance trends are analysed in AI/BI and reported to clinicians and public health, and asked of Genie directly.
        components:
          - LOINC & SNOMED
          - Public Health Filing
          - AI/BI
          - Genie
          - Delta Lake
        stories:
          - title: Why Pathnostics chose Databricks for complex diagnostics data
            url: https://www.databricks.com/blog/why-pathnostics-chose-databricks-data-intelligence-platform-its-most-complex-diagnostics-data
          - title: Databricks for Healthcare and Life Sciences
            url: https://www.databricks.com/solutions/industries/healthcare-and-life-sciences
medallion:
  Bronze:
    short: Raw lab and result feeds
    summary: HL7 v2 orders and results, FHIR resources, analyzer ASTM messages through the middleware, LIMS specimen records, whole-slide image metadata and claims, landed exactly as received so an order or a result can be replayed as it stood.
  Silver:
    short: Conformed order, specimen, result
    summary: Orders, specimens, accessions, patients and results resolved into single conformed entities across the LIS, LIMS, instrument and billing estates, with LOINC and SNOMED codes reconciled and reflex and send-out chains stitched to one accession.
  Gold:
    short: TAT, utilization, QC
    summary: 'Contracted products the lab runs on: turnaround time and backlog by bench, test utilization and send-out cost, QC drift and proficiency testing, and denial rate and net collection by payer.'
