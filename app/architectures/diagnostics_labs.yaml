        fmt: 'LIS01'
        summary: 'CLSI standard for low-level connectivity between lab instruments and information systems.'
        spec_url: https://clsi.org/shop/standards/lis01/
      - name: 'CLSI LIS02'
        core: true
        icon: zbraces
        fmt: 'LIS02'
        summary: 'CLSI message specification for transferring lab orders and results.'
        spec_url: https://clsi.org/shop/standards/lis02/
