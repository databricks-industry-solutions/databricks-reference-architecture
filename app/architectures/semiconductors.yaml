        short: Recipe & APC control
        icon: erp
        summary: Closed-loop recipe and process-material control within guard bands against inline metrology.
        problem: Recipe and run-to-run adjustments rely on delayed metrology and spreadsheets, so corrections arrive a lot too late and drift pushes wafers past guard bands before anyone intervenes.
        who_benefits: Process Engineering
        how_built: Inline overlay and CD metrology land in Lakehouse//RT; an offset model in Model Serving computes closed-loop recipe adjustments, orchestrated back to equipment hosts via SECS/GEM, where the incumbent APC applies them within approved guard bands.
        components:
          - ASML YieldStar
          - SECS/GEM Tool Interface
          - Model Serving
          - AI Functions
          - Lakehouse//RT
