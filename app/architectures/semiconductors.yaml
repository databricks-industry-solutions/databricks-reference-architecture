pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: CEO & Fab Strategy
        mark: Genie One
        summary: The CEO on capacity utilisation and margin; the COO on cycle time, yield ramp and the cost of a fab excursion by product and layer.
        uses:
          - - Genie One
            - Ask what yesterday's fab output cost without booking analyst time.
          - - AI/BI
            - Yield, cycle time and OEE on certified Metric Views.
          - - Unity Catalog
            - Certification so yield means one thing across the enterprise.
        sub:
          - name: CEO
            cares: fab capacity utilisation, margin and the return on each new fab and node.
          - name: COO
            cares: cycle time, yield ramp and the cost of an excursion by product and layer.
          - name: VP Manufacturing
            cares: wafer starts, output commitments and the plan behind capacity.
        ucs:
          - Production Monitoring
          - Defect Detection
          - Demand Forecasting
      - name: Fab Operations
        mark: Lakehouse//RT
        summary: Fab managers on WIP position, tool availability and lot disposition through each critical layer, defending cycle time and wafer starts.
        uses:
          - - Fab Control Tower
            - Live WIP and bottleneck tools on Databricks Apps over Lakebase.
          - - Lakehouse//RT
            - Equipment and lot state at fab-line latency.
        sub:
          - name: Fab Shift Manager
            cares: WIP position, tool availability and hitting the day's wafer starts.
          - name: Dispatch & Scheduling
            cares: lot priority, bottleneck tools and keeping the route moving.
          - name: Process Engineering
            cares: recipe stability and run-to-run drift on critical layers.
        ucs:
          - Production Monitoring
          - Feedstock, Formulation, & Recipe Control
          - Prescriptive Maintenance
      - name: Yield Engineering
        core: true
        mark: Model Serving
        summary: Yield engineers on defect pareto, spatial signatures and the designed experiments that recover margin before a lot is dispositioned.
        uses:
          - - Yield Workbench
            - Bin maps and excursion history before disposition is signed.
          - - Model Serving
            - Defect classification and yield prediction on incoming lots.
        sub:
          - name: Yield Engineer
            cares: defect pareto, spatial signatures and recovering margin before disposition.
          - name: Product & Test Engineering
            cares: bin trends, test coverage and good-die cost per product.
          - name: Failure Analysis
            cares: tracing an excursion or return to the layer, tool and process step.
        ucs:
          - Defect Detection
          - Design Space Simulation & Exploration
      - name: Supply Chain
        mark: AI/BI
        summary: Materials planners on substrate lead times, wafer allocation and single-source risk, trading inventory cost against line-down risk.
        uses:
          - - AI/BI
            - Inventory, consumption and supplier OTIF on certified Metric Views.
          - - Genie One
            - Ask which lots are at risk from a supplier delay.
        sub:
          - name: Materials Planning
            cares: substrate and chemical lead times and buffer against line-down risk.
          - name: Wafer Allocation
            cares: allocating scarce capacity and wafers against demand and priority.
          - name: Supplier Risk
            cares: single-source exposure and multi-tier disruption on critical materials.
        ucs:
          - Demand Forecasting
          - Production Monitoring
      - name: Quality & Reliability
        mark: Lakeflow
        summary: Quality teams on customer returns, failure-analysis correlation and qualification change controls tied back to the fab lot and test bin.
        uses:
          - - FA Correlation Lab
            - Returns tied to fab lot, test bin and assembly trace.
          - - Lakeflow
            - Test, MES and returns feeds conformed for quality analytics.
        sub:
          - name: Quality Engineering
            cares: customer returns, RMA correlation and qualification change control.
          - name: Reliability Engineering
            cares: failure-mode life data tied back to fab lot and test bin.
          - name: Customer Quality
            cares: CoA, PPAP and reliability submissions to fabless customers.
        ucs:
          - Product & Process Traceability
          - Defect Detection
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land SECS/GEM tool events, MES lot history, ATE parametric dumps and ERP feeds; own Bronze to Silver and the pager when a yield pipeline stalls.
        uses:
          - - Lakeflow Connect
            - Managed connectors for MES, ERP and equipment host sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on SECS/GEM and test feeds.
          - - Lakewatch
            - Freshness on the yield tables engineering reads each shift.
        sub:
          - name: Pipeline Engineering
            cares: SECS/GEM, MES and ATE feeds landed Bronze to Silver on time.
          - name: Streaming & Ingest
            cares: equipment-host and STDF streams parsed and conformed on arrival.
          - name: Data Reliability
            cares: freshness and the pager when a yield pipeline stalls mid-shift.
        ucs:
          - Defect Detection
          - Production Monitoring
          - Prescriptive Maintenance
      - name: Data Scientists
        mark: MLflow
        summary: Defect-classification, yield-prediction, chamber-matching and test-optimisation models, and whether they still hold as processes and nodes shift.
        uses:
          - - Feature Store
            - Wafer and tool features read identically in training and serving.
          - - MLflow
            - Every excursion experiment tracked for audit and reproduction.
          - - Model Serving
            - Defect and yield models scored on incoming lots.
        sub:
          - name: Yield & Defect Modelling
            cares: excursion, defect-classification and yield-prediction models.
          - name: Equipment ML
            cares: chamber-matching and remaining-life models on tool telemetry.
          - name: Test Analytics
            cares: test-time optimisation and coverage models per product.
        ucs:
          - Defect Detection
          - Prescriptive Maintenance
      - name: App Developers
        mark: Apps
        summary: Ship the Fab Control Tower, Yield Workbench and Chamber Match apps engineering runs the line from, hosted next to governed MES and test data.
        uses:
          - - Apps
            - Fab screens with no separate web tier to run or secure.
          - - Lakebase
            - Serverless Postgres for hold state and disposition writes.
          - - Agent Bricks
            - Agents that draft dispositions against governed tools.
        sub:
          - name: Apps Engineering
            cares: the Fab Control Tower, Yield Workbench and Chamber Match apps.
          - name: Lakebase & Writeback
            cares: hold state and disposition writes on serverless Postgres.
          - name: Agents
            cares: agents that draft dispositions and work orders against governed tools.
        ucs:
          - Production Monitoring
          - Defect Detection
          - Feedstock, Formulation, & Recipe Control
