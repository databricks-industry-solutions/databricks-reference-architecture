      - name: Cyber Threat Monitoring & Detection
        short: Fab OT security
        icon: stream
        summary: Detecting cyber threats across fab OT networks, equipment hosts and MES before disruption.
        problem: Fab equipment networks, SECS/GEM hosts and MES were built for uptime not security, so intrusions and anomalous commands hide in tool and host telemetry no one correlates until a line stops.
        who_benefits: Fab Operations
        how_built: SECS/GEM host messages, MES events and equipment telemetry land in Lakehouse//RT and conform on Delta Lake; anomaly models score host and tool behaviour in Model Serving under Unity Catalog governance, flagging threats for investigation.
