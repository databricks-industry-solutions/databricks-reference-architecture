medallion:
  Bronze:
    short: Raw fab and test feeds
    summary: SECS/GEM equipment events, MES lot and step history, ATE parametric dumps and WIP snapshots, landed exactly as received so a yield excursion can always be replayed.
  Silver:
    short: Conformed lot, wafer, die
    summary: Lots, wafers, dies and equipment resolved into single conformed entities across MES, test and ERP, with die IDs reconciled and rework genealogy stitched to one trace.
  Gold:
    short: Yield, cycle time, OEE
    summary: 'Contracted products engineering runs on: yield and bin pareto by layer and tool, cycle time and WIP ageing, OEE and downtime attribution, and cost per good die.'
