name: Semiconductors
description: 'Fab and foundry operations: wafer manufacturing execution, yield and test analytics, design-to-silicon traceability, and supply chain resilience across the semiconductor value chain.'
sources:
  - name: Fab & MES
    icon: erp
    simplified: 2
    tiles:
      - name: Applied E3 MES
        icon: erp
        summary: 'Manufacturing execution for wafer fabs: lot tracking, recipe management, equipment dispatch and hold/release.'
        citations:
          - applied-e3
        category: Semiconductor MES
        what_it_is: Manufacturing execution for wafer fabs covering lot tracking, recipe management, equipment dispatch and hold/release.
        who_uses_it: Fab operations, dispatch and Process engineering.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 1-10k events/sec
            interval: Continuous lot/step events
      - name: Camstar Semiconductor
        icon: sheet
        summary: MES routings, BOMs, component traceability and quality holds against each lot.
        citations:
          - camstar
        category: Semiconductor MES
        what_it_is: Manages MES routings, BOMs, component traceability and quality holds against each lot through the route.
        who_uses_it: Fab operations, quality and Traceability teams.
        data_out:
          batch:
            types:
              - structured
            volume: 5-20 GB/day
            interval: Nightly + hourly deltas
          stream:
            types:
              - semi-structured
            volume: hundreds of events/sec
            interval: Continuous lot events
      - name: camLine LineWorks
        icon: db
        summary: 'Fab APC, FDC and SPC with equipment integration: run-to-run control and tool health across the wafer line.'
        citations:
          - brooks-pfab
        category: APC / FDC / SPC Platform
        what_it_is: Runs advanced process control, fault detection and SPC with equipment integration for run-to-run control and tool health.
        who_uses_it: Process engineering, equipment engineering and Yield engineering.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 2-20k tags/sec
            interval: Continuous equipment telemetry
  - name: Design & IP
    icon: sheet
    simplified: 2
    tiles:
      - name: Synopsys Fusion Design
        icon: sheet
        summary: 'RTL through sign-off: synthesis, place-and-route and timing closure feeding the tape-out record.'
        citations:
          - synopsys-fusion
        category: EDA Digital Design
        what_it_is: 'Takes RTL through sign-off: synthesis, place-and-route and timing closure feeding the tape-out record.'
        who_uses_it: Digital design, physical design and Sign-off teams.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: GBs-TBs per block
            interval: Per design run
      - name: Cadence Virtuoso
        icon: code
        summary: 'Custom and analog design: schematic, layout and LVS for IP blocks on each die.'
        citations:
          - cadence-virtuoso
        category: EDA Custom / Analog Design
        what_it_is: 'Supports custom and analog design: schematic, layout and LVS for IP blocks on each die.'
        who_uses_it: Analog/mixed-signal designers and IP teams.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: GBs per IP block
            interval: Per design run
      - name: Siemens Calibre
        icon: gavel
        summary: DRC, LVS and OPC verification against foundry rules before mask order.
        citations:
          - calibre
        category: EDA Physical Verification
        what_it_is: Runs DRC, LVS and OPC verification against foundry rules before the mask is ordered.
        who_uses_it: Physical verification, DFM and Tape-out teams.
        data_out:
          batch:
            types:
              - structured
            volume: GBs (verification results)
            interval: Per verification run
  - name: Yield & Test
    icon: iot
    simplified: 3
    tiles:
      - name: Teradyne UltraFLEX
        icon: iot
        summary: 'ATE parametric and functional test: bin maps, shmoo plots and bin history per die.'
        citations:
          - teradyne
        category: Automated Test Equipment (ATE)
        what_it_is: Runs parametric and functional test producing bin maps, shmoo plots and bin history per die.
        who_uses_it: Test engineering, product engineering and Yield engineering.
        data_out:
          stream:
            types:
              - semi-structured
            volume: GBs/hour parametric dumps
            interval: Continuous during test
      - name: PDF Solutions Exensio
        core: true
        icon: chart
        summary: 'Yield management: defect classification, spatial signatures and excursion detection.'
        citations:
          - pdf-exensio
        category: Yield Management System (YMS)
        what_it_is: Yield management for defect classification, spatial signature analysis and excursion detection across the fab.
        who_uses_it: Yield engineering, defect analysis and Process engineering.
        data_out:
          batch:
            types:
              - structured
            volume: 10-50 GB/day
            interval: Hourly + per-lot
      - name: KLA 5D Analyzer
        icon: stream
        summary: 'Inspection and metrology: defect maps, overlay and CD measurements by tool and recipe.'
        citations:
          - kla-5d
        category: Inspection & Metrology
        what_it_is: Inspection and metrology producing defect maps, overlay and CD measurements by tool and recipe.
        who_uses_it: Metrology, defect engineering and Yield engineering.
        data_out:
          stream:
            types:
              - unstructured
              - structured
            volume: TBs/day images + measures
            interval: Continuous inline inspection
  - name: Equipment & Sensors
    icon: stream
    simplified: 2
    tiles:
      - name: SECS/GEM Tool Interface
        icon: stream
        summary: Equipment events, alarms and trace data from lithography, etch and deposition tools.
        citations:
          - secs-gem
        category: Equipment Interface (SECS/GEM)
        what_it_is: Carries equipment events, alarms and trace data from lithography, etch and deposition tools to the host.
        who_uses_it: Equipment engineering, process control and Data engineering.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 5-50k events/sec
            interval: Continuous tool telemetry
      - name: ASML YieldStar
        icon: iot
        summary: In-line overlay and CD metrology from the scanner feeding litho feedback.
        citations:
          - asml-yieldstar
        category: Lithography Metrology
        what_it_is: Provides in-line overlay and CD metrology from the scanner feeding litho run-to-run feedback.
        who_uses_it: Litho engineering, metrology and Process control.
        data_out:
          stream:
            types:
              - structured
            volume: GBs/day metrology
            interval: Continuous inline metrology
      - name: Lam Equipment Analytics
        icon: partner
        summary: Chamber health, RF matching and preventive maintenance signals from process tools.
        citations:
          - lam-analytics
        category: Equipment Analytics
        what_it_is: Supplies chamber health, RF matching and preventive-maintenance signals from process tools for reliability.
        who_uses_it: Equipment engineering, maintenance and Reliability teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 1-10k tags/sec
            interval: Continuous chamber telemetry
  - name: Supply & Materials
    icon: market
    tiles:
      - name: SAP S/4HANA
        icon: erp
        summary: Procurement, inventory and cost accounting for wafers, chemicals and substrates.
        citations:
          - sap-s4
        category: Enterprise ERP
        what_it_is: System of record for procurement, inventory and cost accounting for wafers, chemicals and substrates.
        who_uses_it: Procurement, materials planning and Cost accounting.
        data_out:
          batch:
            types:
              - structured
            volume: 10-40 GB/day
            interval: Nightly batch + hourly deltas
      - name: Resilinc Supply Risk
        icon: globe
        summary: Multi-tier supplier mapping and disruption alerts for critical materials.
        citations:
          - resilinc
        category: Supply Chain Risk Intelligence
        what_it_is: Provides multi-tier supplier mapping and disruption alerts for critical materials and sub-tier fabs.
        who_uses_it: Supply chain risk, procurement and Materials planning.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 100s of MB/day
            interval: Daily + event-driven alerts
      - name: S&P Global Market Intelligence
        icon: market
        summary: Commodity prices for metals, specialty gases and chemicals and market demand indices that inform material cost, wafer allocation and supplier risk.
        category: Commodities & Market Data
        what_it_is: External commodity price benchmarks (metals, specialty gases, chemicals) and market demand indices used for material cost, allocation and supplier exposure analysis.
        who_uses_it: Supply chain risk, procurement and Materials planning.
        data_out:
          batch:
            types:
              - structured
            volume: MBs-GBs/day price feeds
            interval: Intraday to daily benchmarks
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Partner Foundry Marts
        icon: fed
        summary: Yield and capacity marts left at the foundry and queried in place under Unity Catalog.
        category: Enterprise Data Warehouse
        what_it_is: Yield and capacity marts kept at the foundry and queried in place through federation instead of copied into the lakehouse.
        who_uses_it: Yield engineering, capacity planning and Foundry interface teams.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale yield/capacity marts
            interval: Queried on demand (federated)
  - name: Data Formats
    icon: zbraces
    simplified: 2
    tiles:
      - name: 'STDF'
        icon: zbraces
        fmt: 'STDF'
        summary: 'Standard Test Data Format for semiconductor test and yield data.'
        spec_url: https://www.semi.org/en/standards
      - name: 'SECS-II'
        icon: zbraces
        fmt: 'SECS'
        summary: 'SEMI Equipment Communications Standard message content for fab equipment.'
        spec_url: https://www.semi.org/en/standards
      - name: 'GEM'
        icon: zbraces
        fmt: 'GEM'
        summary: 'SEMI Generic Equipment Model for host-to-tool factory automation.'
        spec_url: https://www.semi.org/en/standards
      - name: 'SEMI EDA'
        icon: zbraces
        fmt: 'EDA'
        summary: 'SEMI Equipment Data Acquisition (Interface A) for rich equipment data collection.'
        spec_url: https://www.semi.org/en/standards
