agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Yield & Quality Agent
        icon: genie
        summary: Ask about wafer defect detection, disposition and die-level traceability by layer, tool and product in plain language.
        feeds:
          - PDF Solutions Exensio
          - Teradyne UltraFLEX
          - KLA 5D Analyzer
          - Camstar Semiconductor
        teams:
          - Yield Engineering
          - Quality & Reliability
          - Failure Analysis
        questions:
          - Which defect signatures are trending up on inspection images this week?
          - Which tools or steps correlate with the current defect excursion?
          - Which customer returns trace back to which fab lot and test bin?
          - What is the bin pareto and disposition status for this failing lot?
          - Which lots carry the traceability genealogy behind this field return?
      - name: Fab Operations & Equipment Agent
        icon: genie
        summary: Explore WIP and cycle time, recipe run-to-run control, predicted tool failures and equipment-network threats across the route.
        feeds:
          - Applied E3 MES
          - SECS/GEM Tool Interface
          - Lam Equipment Analytics
          - ASML YieldStar
        teams:
          - Fab Operations
          - Process Engineering
          - Equipment ML
        questions:
          - Where is WIP piling up and which tools are the bottleneck versus target cycle time?
          - Which recipes show the most run-to-run drift toward guard bands by tool?
          - Which tools are predicted to fail in the next two weeks?
          - Are we on track to hit today's wafer starts?
          - Which equipment-host or MES events look like anomalous or unauthorized commands?
      - name: Engineering & Design Agent
        icon: genie
        summary: Answer tape-out program, foundry bid and design-space exploration questions from process and design data.
        feeds:
          - Synopsys Fusion Design
          - Siemens Calibre
          - Cadence Virtuoso
          - camLine LineWorks
        teams:
          - Process Engineering
          - Product & Test Engineering
          - Yield Engineering
        questions:
          - What is the status of each tape-out program and NPI milestone?
          - Which mask-cost and coverage assumptions sit behind this foundry bid?
          - Which yield signatures should feed back into design rules and IP revisions?
          - Which design-space trade-offs recover the most margin at this node?
          - Which design-technology changes correlate with the biggest yield gains?
      - name: Supply & Materials Agent
        icon: genie
        summary: Ask about part-level demand forecasting, material lead times, wafer allocation and multi-tier supplier risk across the value chain.
        feeds:
          - Resilinc Supply Risk
          - SAP S/4HANA
          - S&P Global Market Intelligence
          - OSAT Test File Exchange
        teams:
          - Supply Chain
          - Materials Planning
          - Wafer Allocation
        questions:
          - What is the part-level demand forecast by product and quarter?
          - How is scarce wafer capacity allocated against demand and priority?
          - Which lots are at risk from a supplier or substrate delay?
          - What is single-source exposure on critical materials?
          - Which substrates and chemicals have the most lead-time risk?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Defect Detection
        short: Wafer defect vision
        icon: gauge
        summary: Automated defect detection and classification from inspection images feeding disposition rules.
        problem: Inspection images pile up faster than engineers can classify them by hand, so defect signatures are labelled inconsistently and disposition rules lag the real failure modes.
        who_benefits: Yield Engineering
        how_built: Metrology inspection images are scored by vision models in Model Serving with features in Feature Store, feeding automated defect classes and disposition rules into the Yield Workbench.
        components:
          - Yield Workbench
          - KLA 5D Analyzer
          - Model Serving
          - AI Functions
          - Feature Store
        stories:
