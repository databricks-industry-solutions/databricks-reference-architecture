      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Actuarial & Reserving Agent
        icon: genie
        summary: Ask about reserve adequacy, experience versus assumptions and margin by product, with embedded-value answers labelled by valuation basis and AXIS run date.
        feeds:
          - Moody's Analytics AXIS
          - FINEOS Life
          - Persistency, mortality, margin
          - Conformed policy, party
        teams:
          - Actuarial & Reserving
          - Appointed Actuary
          - Experience Studies
        questions:
          - How does mortality experience compare to pricing assumptions by product?
          - What is the reserve roll-forward and variance since last quarter?
          - Which products show the weakest embedded value this period?
          - How have lapse rates moved against assumption by cohort?
          - What is new business strain by product and distribution channel?
      - name: New Business Underwriting Agent
        icon: genie
        summary: Explore straight-through-processing rates, evidence bottlenecks and risk classification.
        feeds:
          - Munich Re ALLFINANZ
          - ExamOne Lab Results
          - MIB Underwriting Exchange
          - Conformed policy, party
        teams:
          - Underwriting
          - Chief Underwriter
          - Case Underwriters
        questions:
          - What is our straight-through-processing rate this month by product?
          - Which evidence types are the biggest bottleneck to placement?
          - Where are offers expiring before evidence completes?
          - How does risk-class distribution compare to the pricing assumption?
          - Which cases show anti-selection signals from MIB hits?
      - name: Claims & Contestability Agent
        icon: genie
        summary: Answer death, disability and waiver claim questions with fraud and contestability signals.
        feeds:
          - Sedgwick Life Claims
          - Call Centre Telephony
          - FINEOS Life
        teams:
          - Claims
          - Contestable Review
          - Claims Fraud & SIU
        questions:
          - How many claims are open past their payout SLA and why?
          - Which claims fall inside the contestable period and need review?
          - What is average claim cycle time by benefit type?
          - Which claims carry the highest fraud signal before disbursement?
          - What is the trend in disability and waiver claim volume?
      - name: Distribution & Persistency Agent
        icon: genie
        summary: Ask about producer production, block persistency and suitability across the field.
        feeds:
          - Salesforce Financial Services
          - Persistency, mortality, margin
          - Conformed policy, party
        teams:
          - Distribution
          - Agency Leadership
          - Suitability & Compliance
        questions:
          - Which agents drove last month's lapse spike and where?
          - What is block persistency by channel and product?
          - Where is replacement activity concentrated across the field?
          - Which in-force households are the strongest cross-sell candidates?
          - Which producers show suitability outliers this quarter?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Mortality Underwriting
        short: Risk selection
        icon: people
        summary: Applicant risk classified with evidence completeness tracked before bind.
        problem: Applications wait on labs, APS and exam evidence scattered across vendors, so cases sit for days and a mortality misread only surfaces after the offer is already bound.
        who_benefits: Underwriting
        how_built: Application, exam and MIB evidence land through Lakeflow, are conformed on Delta Lake and scored against mortality models in Model Serving from the Underwriting Decision Hub before bind.
        components:
          - Underwriting Decision Hub
          - Munich Re ALLFINANZ
          - Model Serving
          - MLflow
          - Feature Store
        stories:
          - title: 'From static policies to autonomous insurance: how AI enables real-time coverage'
            url: https://www.databricks.com/blog/static-policies-autonomous-insurance-how-ai-enables-real-time-coverage
      - name: Lapse & Persistency
        short: Retention
        icon: gauge
        summary: Policies at risk of lapse identified from payment, service and engagement signals.
        problem: Lapse signals sit in billing, servicing and contact-centre systems that never join up, so a policy is flagged only after the grace period closes and the block quietly erodes.
        who_benefits: Distribution
        how_built: Payment, servicing and engagement features are built in Feature Store and scored in Model Serving, surfacing at-risk policies by agent and channel in the Agent Performance Hub.
        components:
          - Agent Performance Hub
          - Model Serving
          - Feature Store
          - AI/BI
          - CustomerLake
        stories:
          - title: Distribution optimization reference architecture for insurance
            url: https://www.databricks.com/resources/architectures/distribution-optimization-reference-architecture-for-insurance
      - name: Claims Fraud Detection
        short: Integrity
        icon: stream
        summary: Suspicious death and disability claims flagged before payout.
        problem: Death and disability claims run under payout SLAs, yet contestability checks and fraud signals sit in separate tools, so questionable claims are paid before anyone connects them.
        who_benefits: Claims
        how_built: Claims, policy and party feeds land in Lakehouse//RT and are scored with AI Functions and Model Serving, ranking suspect claims in the Claims Adjudication Console before disbursement.
        components:
          - Claims Adjudication Console
          - Sedgwick Life Claims
          - Model Serving
          - Lakehouse//RT
          - AI Functions
        stories:
          - title: 'Smart Claims: automating claims processing on Databricks'
            url: https://www.databricks.com/resources/demos/tutorials/lakehouse-platform/dbdemos-fsi-smart-claims
          - title: 'Navigating the impact of AI in insurance: opportunities and challenges'
            url: https://www.databricks.com/blog/navigating-impact-ai-insurance-opportunities-and-challenges
      - name: Reserve Adequacy
        short: Actuarial
        icon: chart
        summary: Reserve roll-forward and experience variance explained before opinion sign-off.
        problem: Reserve roll-forwards lean on experience data stitched from admin, claims and actuarial systems by hand, so variance surfaces late and the opinion rests on numbers no one can quickly replay.
        who_benefits: Actuarial & Reserving
        how_built: Conformed policy and claims data feed the Reserve Analytics Workbench, with Unity Catalog holding one definition of counts and AI/BI showing reserve variance on Delta Lake before sign-off.
        components:
          - Reserve Analytics Workbench
          - Moody's Analytics AXIS
          - Unity Catalog
          - AI/BI
          - Delta Lake
        stories:
          - title: Milliman modernizes actuarial data infrastructure and governance with Databricks
            url: https://www.databricks.com/customers/milliman
      - name: New Business Strain
        short: Finance
        icon: market
        summary: Acquisition costs and strain capital modelled by product and distribution channel.
        problem: Acquisition cost and reserve strain are modelled per product long after issue, so finance cannot see how a distribution push or a new rider drains capital until the quarter closes.
        who_benefits: CEO & CFO
        how_built: Issued-business, commission and reserve data are conformed on Delta Lake and modelled in the Reserve Analytics Workbench, so strain by product and channel is queryable in AI/BI and Genie One.
        components:
          - Reserve Analytics Workbench
          - Moody's Analytics AXIS
          - AI/BI
          - Unity Catalog
          - Genie One
      - name: Contact-Center AI
        short: Service
        icon: gavel
        summary: Call summarization, agent assist and self-service deflection across the policyholder and claims contact center.
        problem: Contact-center staff move between admin, claims and CRM screens to answer a policyholder or take a claim, so handle time is long, wrap-up is manual and callers repeat themselves.
        who_benefits: Claims
        how_built: Call transcripts and case data conform under Unity Catalog, agents built on Agent Bricks summarize interactions and draft next steps against governed policy and claim data, and deflection is served through Databricks Apps.
        components:
          - Call Centre Telephony
          - Salesforce Financial Services
          - Agent Bricks
          - AI/BI
      - name: Statutory & NAIC Reporting
        short: Regulatory
        icon: partner
        summary: NAIC annual-statement schedules and risk-based-capital returns assembled from one governed model with full lineage.
        problem: Statutory statements and RBC returns are stitched from actuarial, admin and finance systems each cycle, so reconciliation is manual, lineage is hard to prove and a restatement can trigger a finding.
        who_benefits: CEO & CFO
        how_built: Ledger, reserve and policy data conform on Delta Lake under Unity Catalog with full lineage against the NAIC filing specifications, and returns are assembled in AI/BI and published as Data Products.
        components:
          - SAP S/4HANA Insurance
          - NAIC Statutory Filings
          - Unity Catalog
          - Delta Lake
          - AI/BI
          - Data Products
      - name: Cross-sell Propensity
        short: Growth
        icon: custlake
        summary: Annuity and supplemental offers scored from in-force household relationships.
        problem: In-force households hold obvious annuity and supplemental openings, but relationships are locked in CRM and admin silos, so agents chase cold lists instead of the next best offer.
        who_benefits: Distribution
        how_built: Household relationships from CustomerLake and admin feed propensity models in Model Serving, with scored offers surfaced by agent in the Agent Performance Hub and explored in Genie One.
        components:
          - Agent Performance Hub
          - CustomerLake
          - Model Serving
          - Feature Store
          - Genie One
        stories:
          - title: Customer 360 reference architecture for insurance
            url: https://www.databricks.com/resources/architectures/c360-reference-architecture-for-insurance
      - name: Claims Processing
        short: Claims
        icon: api
        summary: Death, disability and waiver claims triaged and paid straight through when documents and policy checks align.
        problem: Claims arrive as calls, forms and documents across admin and TPA systems, so simple death and disability claims wait behind complex ones and payout SLAs slip.
        who_benefits: Claims
        how_built: Sedgwick and FINEOS claim feeds land via Lakeflow and are checked with AI Functions and scored in Model Serving, so entitlement and beneficiary verification precede authorized adjudication in the Claims Adjudication Console on Lakebase, which auto-adjudicates clean claims under approved rules, releases approved amounts and routes the rest.
        components:
          - Claims Adjudication Console
          - Sedgwick Life Claims
          - FINEOS Life
          - AI Functions
          - Model Serving
          - Lakebase
        stories:
          - title: AXA Japan modernizes data and analytics with Databricks
            url: https://www.databricks.com/customers/axa-japan
      - name: Embedded Value
        short: Strategy
        icon: product
        summary: In-force value and new business contribution tracked for portfolio decisions.
        problem: Embedded value and new-business contribution are assembled from actuarial extracts quarters late, so portfolio and reinsurance decisions run on a picture of the book that is already stale.
        who_benefits: CEO & CFO
        how_built: In-force, reserve and margin data are conformed under Unity Catalog, and the Reserve Analytics Workbench reconciles and reports AXIS-derived embedded-value results under a stated valuation basis and run date, queryable in AI/BI and Genie One.
        components:
          - Reserve Analytics Workbench
          - Moody's Analytics AXIS
          - AI/BI
          - Genie One
          - Unity Catalog
medallion:
  Bronze:
    short: Raw policy and claims feeds
    summary: Policy administration transactions, underwriting evidence, claims files, agent commissions and reinsurance bordereaux, landed exactly as received so a premium or a reserve can always be replayed.
  Silver:
    short: Conformed policy, party
    summary: Policies, insureds, agents and claims resolved into single conformed entities across admin, underwriting and finance systems, with rider and beneficiary relationships stitched to one contract.
  Gold:
    short: Persistency, mortality, margin
    summary: 'Contracted products actuarial and distribution leaders run on: persistency and lapse rates, mortality and morbidity experience, new business strain, and embedded value by product.'
