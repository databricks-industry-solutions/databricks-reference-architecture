name: Life Insurance
description: 'Life and annuity carriers: policy administration, underwriting, claims, actuarial reserving, reinsurance and distribution across individual and group blocks.'
sources:
  - name: Policy Administration
    icon: erp
    simplified: 3
    tiles:
      - name: FINEOS Life
        icon: erp
        summary: Individual and group life policy issuance, servicing, billing and claims on one admin platform.
        citations:
          - fineos
        category: Life & Annuity Policy Admin System
        what_it_is: System of record for individual and group life issuance, servicing, billing and claims, emitting policy, premium and claim transactions.
        who_uses_it: Actuarial & Reserving, policy operations and Claims teams.
        data_out:
          batch:
            types:
              - structured
            volume: 15-60 GB/day
            interval: Nightly batch + intraday deltas
          stream:
            types:
              - semi-structured
            volume: tens of transactions/sec
            interval: Continuous CDC
      - name: Majesco LifePlus
        icon: db
        summary: Policy, billing and claims for life, annuity and supplemental benefits.
        citations:
          - majesco
        category: Life & Annuity Policy Admin System
        what_it_is: Administers policy, billing and claims for life, annuity and supplemental benefits, feeding the conformed policy and party entities.
        who_uses_it: Policy operations, Actuarial & Reserving and Finance teams.
        data_out:
          batch:
            types:
              - structured
            volume: 5-30 GB/day
            interval: Nightly batch
      - name: Oracle Insurance Policy
        icon: sheet
        summary: Product configuration, policy transactions and financial integration for carriers.
        citations:
          - oracle-insurance
        category: Life & Annuity Policy Admin System
        what_it_is: Handles product configuration, policy transactions and financial integration for carriers, emitting policy and accounting records.
        who_uses_it: Product configuration, policy operations and Finance teams.
        data_out:
          batch:
            types:
              - structured
            volume: 5-25 GB/day
            interval: Nightly batch
  - name: New Business & UW
    icon: people
    tiles:
      - name: Munich Re ALLFINANZ
        icon: partner
        summary: Automated underwriting rules, evidence ordering and risk classification.
        citations:
          - munich-allfinanz
        category: Automated Underwriting Engine
        what_it_is: Runs automated underwriting rules, evidence ordering and risk classification, emitting risk-class decisions and requirement status.
        who_uses_it: Underwriting, case underwriters and underwriting-rules teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-4 GB/day decisions
            interval: Daily batch
          stream:
            types:
              - semi-structured
            volume: tens of decisions/sec
            interval: Continuous (API at application)
      - name: ExamOne Lab Results
        icon: stream
        summary: Paramedical exams, labs and APS retrieval tied to application case IDs.
        citations:
          - examone
        category: Paramedical & Lab Evidence Provider
        what_it_is: Supplies paramedical exams, lab results and attending-physician-statement retrieval tied to application case IDs.
        who_uses_it: Underwriting, case underwriters and evidence-ordering teams.
        data_out:
          stream:
            types:
              - semi-structured
              - unstructured
            volume: hundreds of results/hour
            interval: Continuous feed as evidence returns
      - name: MIB Underwriting Exchange
        core: true
        icon: gavel
        summary: Industry application history and code hits at point of underwriting.
        citations:
          - mib
        category: Industry Underwriting Exchange
        what_it_is: Provides industry application history and coded hits checked at point of underwriting to surface prior disclosures and risk signals.
        who_uses_it: Underwriting, chief underwriters and fraud/anti-selection teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: tens of lookups/sec
            interval: Continuous (API at application)
  - name: Claims & Customer
    icon: market
    simplified: 3
    tiles:
      - name: Sedgwick Life Claims
        icon: market
        summary: Death, disability and waiver claims intake, adjudication and payment.
        citations:
          - sedgwick
        category: Claims Administration (TPA)
        what_it_is: Third-party claims administration for death, disability and waiver claims intake, adjudication and payment, emitting claim and payment records.
        who_uses_it: Claims, claims operations and contestable-review teams.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: 2-10 GB/day incl. claim docs
            interval: Daily claims cycle
      - name: Salesforce Financial Services
        icon: custlake
        summary: Agent and policyholder relationships, service cases and cross-sell opportunities.
        citations:
          - sf-finserv
        category: Insurance CRM
        what_it_is: Holds agent and policyholder relationships, service cases and cross-sell opportunities, emitting account, case and activity events.
        who_uses_it: Distribution, agency leadership and sales-enablement teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-3 GB/day
            interval: Hourly / nightly sync
          stream:
            types:
              - semi-structured
            volume: tens of events/sec
            interval: Continuous CDC
      - name: Call Centre Telephony
        icon: chat
        summary: IVR, call recordings and disposition codes joined to policy and claim events.
        category: Contact Center Platform
        what_it_is: Captures IVR paths, call recordings and disposition codes joined to policy and claim events for service and quality analysis.
        who_uses_it: Claims operations, customer service and quality-assurance teams.
        data_out:
          stream:
            types:
              - semi-structured
              - unstructured
            volume: hundreds of calls/hour incl. recordings
            interval: Continuous call stream
  - name: Actuarial & Finance
    icon: chart
    tiles:
      - name: Moody's Analytics AXIS
        icon: chart
        summary: Actuarial models, reserves, capital and asset-liability management projections.
        citations:
          - axis
        category: Actuarial Modeling Platform
        what_it_is: Runs actuarial models for reserves, capital and asset-liability management projections, producing reserve, capital and ALM results.
        who_uses_it: Actuarial & Reserving, appointed actuary and Treasury & Investments teams.
        data_out:
          batch:
            types:
              - structured
            volume: 5-20 GB/valuation run
            interval: Monthly / quarterly valuation runs
      - name: SAP S/4HANA Insurance
        core: true
        icon: erp
        summary: General ledger, statutory reporting and investment accounting integration.
        citations:
          - sap-insurance
        category: Insurance ERP / General Ledger
        what_it_is: Provides the general ledger, statutory reporting and investment accounting integration, emitting financial postings and ledger balances.
        who_uses_it: Finance, financial reporting and Treasury & Investments teams.
        data_out:
          batch:
            types:
              - structured
            volume: 5-20 GB/day
            interval: Nightly close + period-end
      - name: Reinsurance Bordereaux
        icon: partner
        summary: Ceded premium, claims and experience reports exchanged with reinsurance partners.
        category: Reinsurance Bordereau Exchange
        what_it_is: Carries ceded premium, claims and experience reports exchanged with reinsurance partners for treaty reconciliation and recovery.
        who_uses_it: Finance, ceded-reinsurance and reserving teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 1-5 GB/cycle
            interval: Monthly / quarterly treaty cycle
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: MGU Admin Feeds
        icon: fed
        summary: Managing general underwriter policy detail left at partners and queried in place under Unity Catalog.
        category: Delegated Authority Admin System
        what_it_is: Managing-general-underwriter policy and bordereau detail kept at partners and queried in place through federation instead of being copied in.
        who_uses_it: Actuarial & Reserving, delegated-authority and Finance teams.
        data_out:
          batch:
            types:
              - structured
            volume: GB-scale partner marts
            interval: Queried on demand (federated)
  - name: Data Formats
    icon: zbraces
    simplified: 2
    tiles:
      - name: 'ACORD L&A XML'
        icon: zbraces
        fmt: 'ACORD'
        summary: 'ACORD Life & Annuity XML standards for new business, policy and claims data.'
        spec_url: https://www.acord.org/standards-architecture/acord-data-standards
        spark_connector: 'spark-xml'
        spark_repo: https://github.com/databricks/spark-xml
        databricks_resource: https://docs.databricks.com/aws/en/query/formats/xml
        source_systems:
          - 'FINEOS'
          - 'Majesco'
          - 'Equisoft'
      - name: 'ACORD L&A EDI'
        icon: zbraces
        fmt: 'L&A'
        summary: 'ACORD Life & Annuity transaction standards for carrier-distributor interchange.'
        spec_url: https://www.acord.org/standards-architecture/acord-data-standards
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    tiles:
      - name: Mortality Table Updates
        icon: chart
        summary: Industry mortality and lapse assumptions published by regulators and reinsurers.
        category: Actuarial Assumption Reference
        what_it_is: Industry mortality and lapse assumption tables published by regulators and reinsurers, consumed as reference for pricing and reserving.
        who_uses_it: Actuarial & Reserving, experience-studies and pricing teams.
        data_out:
          batch:
            types:
              - structured
            volume: MBs (tables)
            interval: Periodic release
      - name: ACORD Life Standards
        icon: api
        summary: Application, policy and claims XML messages normalised on ingest for straight-through processing.
        citations:
          - acord
        category: Insurance Data Standard (ACORD)
        what_it_is: Standard application, policy and claims XML messages normalised on ingest to drive straight-through processing across systems.
        who_uses_it: Data Engineers, Underwriting and integration teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds of messages/sec at peak
            interval: Continuous message flow
      - name: NAIC Statutory Filings
        icon: gavel
        summary: Annual statement schedules and risk-based capital specifications consumed inbound.
        citations:
          - naic
        category: Regulatory Filing Specification
        what_it_is: Inbound annual-statement schedules and risk-based-capital specifications that define the statutory returns finance must produce.
        who_uses_it: Finance, financial reporting and Actuarial & Reserving teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: MBs (specifications)
            interval: Annual / on release
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: CEO & CFO
        mark: Genie One
        summary: The CEO on new-business volume and embedded value; the CFO on statutory reserves, risk-based capital and the expense ratio by product line.
        uses:
          - - Genie One
            - Ask what last month's issued premium was by product without waiting on actuarial.
          - - AI/BI
            - Persistency, mortality and margin on one certified set of Metric Views.
          - - Unity Catalog
            - Certification and the business glossary, so "in-force" means one thing across admin and finance.
        sub:
          - name: Chief Executive
            cares: new-business volume, embedded value and the growth-versus-capital trade across the book.
          - name: Chief Financial Officer
            cares: statutory reserves, risk-based capital and the expense ratio by product line.
          - name: Treasury & Investments
            cares: asset-liability matching and the investment income backing long-dated liabilities.
        ucs:
          - Embedded Value
          - New Business Strain
          - Reserve Adequacy
          - Statutory & NAIC Reporting
      - name: Actuarial & Reserving
        mark: AI/BI
        summary: Appointed actuaries on reserve adequacy, mortality and lapse experience studies and the model governance a statutory opinion depends on.
        uses:
          - - Reserve Analytics Workbench
            - Experience versus pricing assumptions before opinion sign-off.
          - - AI/BI
            - Reserve roll-forward and variance on certified Metric Views.
          - - Unity Catalog
            - One definition of claim and policy counts across systems.
        sub:
          - name: Appointed Actuary
            cares: reserve adequacy and the statutory opinion that stands behind it.
          - name: Experience Studies
            cares: mortality, morbidity and lapse experience versus pricing assumptions.
          - name: Model Governance
            cares: assumption controls and the audit trail every valuation depends on.
        ucs:
          - Reserve Adequacy
          - New Business Strain
          - Embedded Value
      - name: Underwriting
        core: true
        mark: Model Serving
        summary: Chief underwriters on straight-through-processing rates, evidence-ordering bottlenecks and mortality leakage before an offer expires.
        uses:
          - - Underwriting Decision Hub
            - Risk class and evidence status before offers expire.
          - - Model Serving
            - Mortality and lapse models scored at application.
          - - MLflow
            - Every underwriting model run tracked for audit.
        sub:
          - name: Chief Underwriter
            cares: straight-through-processing rates and mortality leakage before offers expire.
          - name: Case Underwriters
            cares: evidence completeness and risk classification on individual applications.
          - name: Underwriting Rules
            cares: the automated rules and evidence-ordering logic behind accelerated issue.
        ucs:
          - Mortality Underwriting
      - name: Claims
        mark: Lakehouse//RT
        summary: Claims operations on death verification, contestable-period review and beneficiary payout, ranking open claims by SLA and fraud signal before disbursement.
        uses:
          - - Claims Adjudication Console
            - Open claims ranked by SLA and fraud signals.
          - - Lakehouse//RT
            - Claim status at operational latency.
          - - AI/BI
            - Severity and cycle time on governed definitions.
        sub:
          - name: Claims Operations
            cares: death and disability intake, cycle time and the payout SLA.
          - name: Contestable Review
            cares: early-duration and contestable-period investigation before benefit release.
          - name: Claims Fraud & SIU
            cares: fraud signals and referrals raised ahead of disbursement.
        ucs:
          - Claims Processing
          - Claims Fraud Detection
          - Contact-Center AI
      - name: Distribution
        mark: CustomerLake
        summary: Agency leaders on producer productivity, block persistency and suitability compliance when a lapse or replacement spike shows up.
        uses:
          - - Agent Performance Hub
            - Production, persistency and complaints by channel.
          - - CustomerLake
            - Household segments without copying CRM exports elsewhere.
          - - Genie One
            - Ask which agents drove last month's lapse spike.
        sub:
          - name: Agency Leadership
            cares: producer productivity, block persistency and channel mix.
          - name: Suitability & Compliance
            cares: replacement activity and suitable-sale monitoring across the field.
          - name: Sales Enablement
            cares: next-best-offer and cross-sell into in-force households.
        ucs:
          - Lapse & Persistency
          - Cross-sell Propensity
          - Contact-Center AI
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land the policy-admin, underwriting and reinsurance feeds; own the Bronze to Silver path and the pager when a bordereau load breaks.
        uses:
          - - Lakeflow Connect
            - Managed connectors for FINEOS, underwriting and finance sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on policy and claims feeds.
          - - Lakewatch
            - Freshness on the tables actuarial and distribution read every morning.
        sub:
          - name: Ingestion Engineering
            cares: the FINEOS, underwriting and reinsurance feeds and the bordereau loads.
          - name: Pipeline Reliability
            cares: Bronze-to-Silver expectations and the pager when a load breaks.
          - name: Platform & Governance
            cares: Unity Catalog structure and access across admin and finance data.
        ucs:
          - Claims Processing
          - Statutory & NAIC Reporting
          - Reserve Adequacy
      - name: Data Scientists
        mark: MLflow
        summary: Mortality, lapse and claims-fraud models, and whether they still hold across an experience study.
        uses:
          - - Feature Store
            - Policy and party features defined once for training and serving.
          - - MLflow
            - Every underwriting model run tracked for audit and reproduction.
          - - Model Serving
            - Mortality and lapse models scored at application and renewal.
        sub:
          - name: Mortality & Lapse Modelling
            cares: the mortality, morbidity and lapse models scored at application and renewal.
          - name: Claims Fraud Science
            cares: the anomaly and network models behind claims referrals.
          - name: Model Validation
            cares: whether a model still holds across an experience study.
        ucs:
          - Mortality Underwriting
          - Lapse & Persistency
          - Claims Fraud Detection
          - Cross-sell Propensity
      - name: App Developers
        mark: Apps
        summary: Ship the underwriting, claims and agent-performance applications the carrier works in, hosted next to governed data.
        uses:
          - - Apps
            - Underwriting and claims screens with no separate web tier to run or secure.
          - - Lakebase
            - Serverless Postgres for servicing and claims writes.
          - - Agent Bricks
            - Agents that draft an underwriting or claims decision against governed tools.
        sub:
          - name: Underwriting & Claims Apps
            cares: the decision hub and adjudication console underwriters and adjusters work in.
          - name: Servicing & Writeback
            cares: Lakebase-backed servicing and claims writes into admin.
          - name: Agent Experience
            cares: the producer-facing performance and suitability screens.
        ucs:
          - Claims Processing
          - Claims Fraud Detection
          - Contact-Center AI
