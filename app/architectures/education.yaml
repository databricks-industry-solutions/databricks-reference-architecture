medallion:
  Bronze:
    short: Raw campus feeds
    summary: SIS enrollments, LMS activity logs, admissions CRM events, aid awards and bursar transactions, landed exactly as received so a grade or an aid decision can always be replayed as it stood.
  Silver:
    short: Conformed student, course
    summary: Students, courses, sections and terms resolved into single conformed entities across the SIS, LMS and CRM estates, with cross-system identifiers reconciled and transfer credit stitched to one academic record.
  Gold:
    short: Retention, enrollment, outcomes
    summary: 'Contracted products academic and finance leaders run on: retention and persistence by cohort, enrollment yield and melt, learning outcome attainment, and aid packaging compliance.'
