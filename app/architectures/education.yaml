        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Enrollment & Yield Agent
        icon: genie
        summary: Ask about the funnel, yield and melt against target across cycles in plain language.
        feeds:
          - Slate by Technolutions
          - Salesforce Education Cloud
          - Ellucian Banner
          - Retention, enrollment, outcomes
        teams:
          - Admissions & Enrollment
          - Director of Admissions
          - Enrollment Management
        questions:
          - What does fall enrollment look like against target right now?
          - Which channels and territories convert inquiry to deposit best?
          - How much melt is occurring between deposit and day one?
          - Which programs are behind on their enrollment goal this cycle?
          - How does yield compare to the same point last cycle?
      - name: Student Success & Retention Agent
        icon: genie
        summary: Explore persistence risk, LMS activity and early-alert outreach across cohorts.
        feeds:
          - Canvas LMS
          - Blackboard Learn
          - Ellucian Banner
          - Conformed student, course
        teams:
          - Student Success
          - Advising & Coaching
          - Early Alert Coordinators
        questions:
          - Which students show rising stop-out risk before census?
          - Which courses have the most students with LMS inactivity this week?
          - Where is grade slippage concentrated by program and term?
          - Which advising interventions correlate with improved persistence?
          - Which cohorts are below their expected retention rate?
      - name: Learning Outcomes Agent
        icon: genie
        summary: Answer questions on mastery, completion and course effectiveness across programs.
        feeds:
          - Canvas LMS
          - Panopto Lecture Capture
          - Ellucian Banner
          - Retention, enrollment, outcomes
        teams:
          - President & Provost
          - Institutional Research
          - Registrar & Records
        questions:
          - Which courses have the lowest outcome-mastery attainment this term?
          - How does completion differ by course modality?
          - Which pathways bottleneck time-to-degree?
          - How does lecture-capture engagement relate to course grades?
          - Which programs improved learning outcomes year over year?
      - name: Aid & Finance Agent
        icon: genie
        summary: Ask about the aid discount rate, net tuition and Title IV packaging compliance.
        feeds:
          - PowerFAIDS
          - Nelnet Campus Commerce
          - IPEDS / State Reporting
          - Retention, enrollment, outcomes
        teams:
          - Finance & Financial Aid
          - Financial Aid Director
          - Bursar
        questions:
          - What is the aid discount rate this cycle versus last?
          - Which award packages are drifting outside Title IV rules?
          - How does net tuition revenue track against budget by program?
          - Which students have unresolved bursar holds affecting enrollment?
          - How does packaging affect yield across need bands?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Early Alert & Retention
        short: Persistence
        icon: gauge
        summary: Identifying students likely to stop out from LMS inactivity, grades and aid gaps, and intervening before census.
        problem: LMS inactivity, grade slippage and aid gaps hide across the SIS, LMS and aid systems, so advisors usually find a rising-risk student only after they have quietly stopped out.
        who_benefits: Student Success
        how_built: LMS activity, grades and aid signals land through Lakeflow and score persistence models in Model Serving, ranking risk in the Retention Risk Hub with outreach queued before census.
        components:
          - Retention Risk Hub
          - Model Serving
          - Canvas LMS
          - Feature Store
          - Ellucian Banner
        stories:
          - title: Western Governors University predicts dropout patterns and retention
            url: https://www.databricks.com/customers/western-governors-university
          - title: Flinders University improves student success with data and ML
            url: https://www.databricks.com/customers/flinders-university
      - name: Enrollment Forecasting
        short: Capacity
        icon: sheet
        summary: Fall and spring headcount scenarios scored against housing, staffing and section capacity before the board commits.
        problem: Headcount is projected from last year's melt and gut feel, so the board commits to a class the campus cannot house, staff or fill sections for once deposits convert.
        who_benefits: Admissions & Enrollment
        how_built: Admissions CRM, deposit and historical yield feeds are conformed on Delta Lake and scored into headcount scenarios read against housing and section capacity in the Course Demand Planner.
        components:
          - Course Demand Planner
          - AI/BI
