        summary: Packaging scenarios tested against policy and budget before award letters release to students.
  - name: AI/BI Dashboards
    icon: aibi
    tiles:
      - name: Enrollment & Yield
        icon: aibi
        summary: Funnel, yield, melt and net tuition on certified Metric Views.
        kpis:
