      - name: Alumni & Advancement
        icon: custlake
        summary: Graduate outcomes and giving propensity shared to advancement without nightly flat files.
  - name: Regulatory & Reporting
    icon: gavel
    tiles:
      - name: IPEDS & Federal Reporting
        icon: gavel
        summary: IPEDS, Clery and financial-responsibility metrics, each produced under its own reporting regime, from the same governed tables the institution runs on.
        citations:
          - ipeds
      - name: FERPA Audit Trail
        core: true
        icon: share
