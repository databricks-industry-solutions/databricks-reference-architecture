  - name: Published Products
    icon: product
    tiles:
      - name: Data Products
        icon: product
        summary: Published, contracted products discoverable in Unity Catalog Domains and shared over OpenSharing.
      - name: Sharing Recipients
        core: true
        icon: share
        summary: Consortia, researchers and state agencies accessing governed products, reducing bespoke exports with copies and transfer behavior dependent on the sharing mode.
  - name: Databricks Apps
    icon: apps
    tiles:
      - name: Student 360
        icon: custlake
        short: Unified learner view
        summary: 'Every touchpoint from inquiry through alumni on one screen: academics, aid, engagement and risk, on Databricks Apps over Lakebase.'
      - name: Retention Risk Hub
        icon: gauge
        short: Early intervention
        summary: Cohort risk ranked before census with recommended outreach and advising appointments queued for coordinators.
      - name: Course Demand Planner
        icon: sheet
        short: Section planning
        summary: Historical fill and waitlist patterns scored against instructional capacity, with headcount, housing and staffing scenarios, before the schedule locks.
      - name: Aid Packaging Workbench
        icon: market
