          stream:
            types:
              - semi-structured
            volume: tens-hundreds of events/sec at peak
            interval: Continuous (launch / passback)
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: President & Provost
        mark: Genie One
        summary: The president and provost on enrollment health, first-year retention and six-year completion, and the trade between access and net-tuition sustainability.
        uses:
          - - Genie One
            - Ask what fall enrollment looks like against target without waiting on institutional research.
          - - AI/BI
            - Retention, yield and net tuition on one certified set of Metric Views.
          - - Unity Catalog
            - Certification and the business glossary, so "retention" means one thing across campus.
        sub:
          - name: President
            cares: enrollment health, the completion rate and the trade between access and net-tuition sustainability.
          - name: Provost
            cares: academic program quality, learning outcomes and faculty resourcing across colleges.
          - name: Institutional Research
            cares: the certified numbers behind every board report and accreditation submission.
        ucs:
          - Enrollment Forecasting
          - Learning Analytics
          - Accreditation Reporting
          - Alumni Engagement
      - name: Registrar & Records
        mark: AI/BI
        summary: Official academic records, transfer articulation and degree-audit exceptions, and who is eligible to walk at commencement this term.
        uses:
          - - AI/BI
            - Registration velocity, credit accumulation and stop-out patterns on governed definitions.
          - - Genie One
            - Ask which programs are behind on degree progress this term.
          - - Unity Catalog
            - One definition of enrollment status across SIS and LMS.
        sub:
          - name: University Registrar
            cares: official academic records, transfer articulation and degree-audit integrity.
          - name: Scheduling Office
            cares: room utilisation, prime-time conflicts and section capacity each term.
          - name: Degree Audit
            cares: credit accumulation and who is eligible to walk at commencement this term.
        ucs:
          - Curriculum Optimisation
          - Space & Scheduling
          - Accreditation Reporting
      - name: Student Success
        mark: Model Serving
        summary: Advising, tutoring and early-alert teams intervening on rising-risk students from LMS inactivity, grade slippage and aid gaps before one silently stops out.
        uses:
          - - Retention Risk Hub
            - Risk scores and recommended outreach before census.
          - - Model Serving
            - Persistence models scored against live LMS and SIS signals.
          - - CustomerLake
            - Student segments without copying profiles into a separate CDP.
        sub:
          - name: Advising & Coaching
            cares: rising-risk students and the outreach that keeps them enrolled.
          - name: Tutoring & Learning Centers
            cares: where students struggle by course and when to intervene.
          - name: Early Alert Coordinators
            cares: LMS inactivity and grade slippage before census closes.
        ucs:
          - Early Alert & Retention
          - Learning Analytics
          - Curriculum Optimisation
      - name: Admissions & Enrollment
        core: true
        mark: CustomerLake
        summary: Recruitment yield by channel and territory, melt between deposit and day one, and section fill measured against instructional and housing capacity.
        uses:
          - - Enrollment Forecasting
            - Cohort scenarios scored on instructional and housing capacity.
          - - CustomerLake
            - Prospect journeys joined to application and enrollment outcomes.
          - - AI/BI
            - Yield and melt dashboards the cabinet reads each cycle.
        sub:
          - name: Director of Admissions
            cares: the funnel from inquiry to deposit by channel and territory.
          - name: Enrollment Management
            cares: yield, melt and the class the cabinet promised.
          - name: Recruitment Operations
            cares: recruiter activity and the events that move applications.
        ucs:
          - Recruitment Yield
          - Enrollment Forecasting
          - Financial Aid Packaging
      - name: Finance & Financial Aid
        mark: AI/BI
        summary: Net tuition revenue, the aid discount rate and packaging that stays inside federal Title IV rules while hitting the class the cabinet promised.
        uses:
          - - Aid Packaging Workbench
            - Award scenarios tested against policy before letters release.
          - - AI/BI
            - Discount rate and tuition revenue on certified Metric Views.
          - - Unity Catalog
            - One definition of aid and billing across bursar and aid systems.
        sub:
          - name: Financial Aid Director
            cares: packaging inside Title IV rules and the aid discount rate.
          - name: Bursar
            cares: tuition billing and receivables reconciled to enrollment status.
          - name: Sponsored Programs
            cares: effort certification and cost share on research grants.
        ucs:
          - Financial Aid Packaging
          - Research Compliance
          - Enrollment Forecasting
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land the SIS, LMS and admissions CRM feeds; own the Bronze to Silver path and the pager when a nightly enrollment or grade load breaks.
        uses:
          - - Lakeflow Connect
            - Managed connectors for Banner, Canvas and Slate.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on enrollment and grade feeds.
          - - Lakewatch
            - Freshness on the tables the registrar and advisors read every morning.
        sub:
          - name: Pipeline Engineering
            cares: the Bronze-to-Silver path off Banner, Canvas and Slate.
          - name: Integration & Reporting
            cares: state and federal file layouts and the nightly enrollment load.
          - name: Platform & Reliability
            cares: the pager when a grade or aid load breaks before dawn.
        ucs:
          - Early Alert & Retention
          - Enrollment Forecasting
          - Accreditation Reporting
      - name: Data Scientists
        mark: MLflow
        summary: Retention-risk, enrollment-yield and course-demand models, and whether they still hold a term after deployment.
        uses:
          - - Feature Store
            - Student features defined once and read identically in training and serving.
          - - MLflow
            - Every retention model run tracked for audit and reproduction.
          - - Model Serving
            - Persistence and yield models scored against live LMS and SIS signals.
        sub:
          - name: Retention Modeling
            cares: persistence and stop-out risk from LMS and SIS signals.
          - name: Enrollment Modeling
            cares: yield, melt and course-demand forecasts by cohort.
          - name: MLOps
            cares: whether a retention model still holds a term after deployment.
        ucs:
          - Early Alert & Retention
          - Enrollment Forecasting
          - Recruitment Yield
      - name: App Developers
        mark: Apps
        summary: Ship the advising, retention and aid-packaging applications the campus works in, hosted next to governed data.
        uses:
          - - Apps
            - Advising and retention screens with no separate web tier to run or secure.
          - - Lakebase
            - Serverless Postgres for advising notes and aid-decision writes.
          - - Agent Bricks
            - Agents that draft outreach or an aid scenario against governed tools.
        sub:
          - name: Advising Apps
            cares: the screens coordinators work early alerts and notes in.
          - name: Aid & Student Apps
            cares: aid-scenario and student-portal writes over governed data.
          - name: Platform Services
            cares: auth, hosting and the API surface next to the lakehouse.
        ucs:
          - Early Alert & Retention
          - Financial Aid Packaging
          - Alumni Engagement
consumers:
  - name: BI & Productivity
    icon: chart
    from: bi
    tiles:
      - name: Tableau / Qlik / ThoughtSpot
        icon: chart
