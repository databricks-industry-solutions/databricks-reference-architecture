name: Education
description: 'Higher-education-led with selected K-12 variants: student lifecycle from inquiry through alumni, learning outcomes, financial aid, and campus operations.'
sources:
  - name: Student Information
    icon: erp
    simplified: 2
    tiles:
      - name: Ellucian Banner
        icon: erp
        summary: 'Student information system of record: enrollments, registrations, grades, degree progress and transcript history.'
        citations:
          - ellucian-banner
        category: Student Information System (SIS)
        what_it_is: System-of-record for enrollments, registrations, grades, degree progress and transcript history across the institution.
        who_uses_it: Registrar, Advising and Institutional research teams.
        data_out:
          batch:
            types:
              - structured
            volume: 5-30 GB/day
            interval: Nightly batch + intraday deltas
      - name: Workday Student
        icon: erp
        summary: Cloud SIS for academic records, advising holds, program completion and residency rules.
        citations:
          - workday-student
        category: Student Information System (SIS)
        what_it_is: Cloud SIS holding academic records, advising holds, program completion and residency rules.
        who_uses_it: Registrar, Advising and Finance teams.
        data_out:
          batch:
            types:
              - structured
            volume: 2-15 GB/day
            interval: Nightly batch
          stream:
            types:
              - semi-structured
            volume: tens of events/sec
            interval: Continuous CDC
      - name: PowerSchool SIS
        core: true
        icon: erp
        summary: 'Dominant K-12 student information system: enrollments, attendance, grades and state reporting across districts.'
        citations:
          - powerschool
        category: Student Information System (SIS)
        what_it_is: K-12 SIS covering enrollments, attendance, grades and mandated state reporting across districts.
        who_uses_it: District administration, State reporting and Attendance teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-10 GB/day
            interval: Nightly batch
  - name: Learning & Content
    icon: notebook
    simplified: 3
    tiles:
      - name: Canvas LMS
        icon: notebook
        summary: Course shells, assignments, discussion activity and outcome mastery data from the primary learning environment.
        citations:
          - canvas-lms
        category: Learning Management System (LMS)
        what_it_is: Primary learning environment emitting course activity, assignment submissions, discussion events and outcome mastery data.
        who_uses_it: Student success, Faculty and Learning analytics teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 10-50 GB/day activity logs
            interval: Hourly / nightly
          stream:
            types:
              - semi-structured
            volume: hundreds of events/sec at peak
            interval: Continuous (activity events)
      - name: Blackboard Learn
        icon: notebook
        summary: LMS engagement, assessment attempts and content access for institutions on the Blackboard estate.
        citations:
          - blackboard
        category: Learning Management System (LMS)
        what_it_is: LMS engagement, assessment attempts and content access for institutions running on the Blackboard estate.
        who_uses_it: Student success, Faculty and Learning analytics teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 5-30 GB/day
            interval: Hourly / nightly
      - name: Panopto Lecture Capture
        icon: stream
        summary: Recorded lecture views, watch time and search queries joined to course enrollment for engagement analysis.
        citations:
          - panopto
        category: Lecture Capture / Video Platform
        what_it_is: Captures lecture recordings and emits view, watch-time and search events joined to enrollment for engagement analysis.
        who_uses_it: Learning analytics, Faculty and Instructional design teams.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: GBs of video + view logs
            interval: Continuous / daily
  - name: Admissions & CRM
    icon: partner
    simplified: 3
    tiles:
      - name: Slate by Technolutions
        icon: partner
        summary: Inquiry, application, decision and yield events from the admissions CRM the recruitment team works in.
        citations:
          - slate
        category: Admissions CRM
        what_it_is: Admissions CRM capturing inquiry, application, decision and yield events across the recruitment funnel.
        who_uses_it: Admissions, Recruitment operations and Enrollment management teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 1-5 GB/day
            interval: Hourly / nightly sync
      - name: Salesforce Education Cloud
        icon: custlake
        summary: Prospect journeys, recruiter activities and conversion funnels for institutions on Education Cloud.
        citations:
          - sf-edu-cloud
        category: Education CRM
        what_it_is: Holds prospect journeys, recruiter activities and conversion funnels for institutions on Education Cloud.
        who_uses_it: Admissions, Marketing and Enrollment management teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-4 GB/day
            interval: Hourly / nightly sync
          stream:
            types:
              - semi-structured
            volume: tens of events/sec
            interval: Continuous CDC
      - name: National Student Clearinghouse
        icon: share
        summary: Enrollment verification, degree completion and transfer research files exchanged with peer institutions.
        citations:
          - nsc
        category: Enrollment Verification Exchange
        what_it_is: Exchanges enrollment verification, degree completion and transfer research files with peer institutions.
        who_uses_it: Registrar, Institutional research and Enrollment management teams.
        data_out:
          batch:
            types:
              - structured
            volume: sub-GB per exchange
            interval: Periodic file exchanges
  - name: Finance & Student Aid
    icon: market
    simplified: 3
    tiles:
      - name: PowerFAIDS
        icon: market
        summary: Need analysis, packaging rules and ISIR-driven award letters the financial aid office certifies.
        citations:
          - powerfaids
        category: Financial Aid Management System
        what_it_is: Runs need analysis, packaging rules and ISIR-driven award letters the financial aid office certifies under Title IV.
        who_uses_it: Financial aid, Bursar and Compliance teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-3 GB/day awards + ISIR
            interval: Nightly batch + award cycles
      - name: Nelnet Campus Commerce
        icon: erp
        summary: Tuition billing, payment plans and bursar receivables reconciled against enrollment status.
        citations:
          - nelnet
        category: Tuition Billing & Payments
        what_it_is: Handles tuition billing, payment plans and bursar receivables reconciled against enrollment status.
        who_uses_it: Bursar, Student accounts and Finance teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-4 GB/day
            interval: Nightly batch + intraday deltas
      - name: Web & Portal Clickstream
        icon: observ
        summary: Prospect and student portal events from search through registration, joined to applications and enrollments.
        category: Web & Portal Clickstream
        what_it_is: Captures prospect and student portal events from search through registration, joined to applications and enrollments.
        who_uses_it: Admissions, Marketing and Learning analytics teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds of events/sec at peak
            interval: Continuous clickstream
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Research Grants Ledger
        icon: fed
        summary: Sponsored research accounting and effort certification marts left where they are and queried in place under Unity Catalog.
        category: Sponsored Research Data Warehouse
        what_it_is: Sponsored-research accounting and effort-certification marts kept in the incumbent system and queried in place through federation.
        who_uses_it: Sponsored programs, Research finance and Compliance teams.
        data_out:
          batch:
            types:
              - structured
            volume: GB-scale ledgers
            interval: Queried on demand (federated)
  - name: Data Formats
    icon: zbraces
    simplified: 3
    tiles:
      - name: 'Ed-Fi'
        icon: zbraces
        fmt: 'EdFi'
        summary: 'Ed-Fi data standard and API for unifying K-12 student information across systems.'
        spec_url: https://www.ed-fi.org/
      - name: 'CEDS'
        icon: zbraces
        fmt: 'CEDS'
        summary: 'US Common Education Data Standards for shared education data definitions.'
        spec_url: https://ceds.ed.gov/
      - name: 'PESC Transcripts'
        icon: zbraces
        fmt: 'PESC'
        summary: 'PESC XML standard for electronic academic transcripts and records.'
        spec_url: https://www.pesc.org/
      - name: 'OneRoster'
        core: true
        icon: zbraces
        fmt: '1R'
        summary: '1EdTech standard for roster, enrolment and grade exchange.'
        spec_url: https://www.1edtech.org/standards/oneroster
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    tiles:
      - name: IPEDS / State Reporting
        icon: gavel
        summary: Federal and state compliance file layouts consumed inbound for validation before submission season.
        citations:
          - ipeds
        category: Regulatory Reporting Data
        what_it_is: Supplies federal and state compliance file layouts consumed for validation before submission season.
        who_uses_it: Institutional research, Compliance and Finance teams.
        data_out:
          batch:
            types:
              - structured
            volume: sub-GB per submission
            interval: Per reporting cycle
      - name: Ed-Fi Data Standard
        icon: api
        summary: Interoperable student and assessment APIs normalised on ingest for state reporting and district exchange.
        citations:
          - ed-fi
        category: Education Data Standard / API
        what_it_is: Provides interoperable student and assessment APIs normalised on ingest for state reporting and district data exchange.
        who_uses_it: Integration engineering, State reporting and District data teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 1-5 GB/day
            interval: Nightly / on schedule
      - name: IMS Global LTI
        icon: api
        summary: Learning tool interoperability launches and grade passback events from third-party publishers.
