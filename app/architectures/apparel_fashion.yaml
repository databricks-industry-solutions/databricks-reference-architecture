      - name: Size Curve Optimization
        short: Allocation
        icon: product
        summary: Size profiles tuned by door cluster and sell-through.
        problem: Size curves are set once at the chain level, so popular sizes stock out while the odd sizes pile into markdown, and door-level demand and returns never feed back into the next allocation.
        who_benefits: Planning & Allocation
        how_built: Sell-through and returns by door cluster are conformed on Delta Lake, scored with Model Serving off Feature Store, and the Allocation Optimizer sets size profiles before allocation locks.
        components:
          - Allocation Optimizer
          - Oracle Xstore POS
          - Model Serving
          - Feature Store
          - Delta Lake
        stories:
          - title: ABFRL scales ML to store-level SKU assortment and allocation
            url: https://www.databricks.com/customers/aditya-birla-fashion-and-retail-ltd
      - name: Markdown Optimization
        short: Pricing
        icon: market
        summary: Markdown timing and depth maximizing margin recovery.
        problem: 'Markdowns are taken on a calendar rather than on evidence, so margin walks out the door: too deep too early on styles that would have sold, too late on the ones that never will.'
        who_benefits: Merchandising
        how_built: Sell-through, inventory and price-elasticity features on Delta Lake feed markdown models in Model Serving, with recommendations written back to POS and commerce and watched in AI/BI.
        components:
          - Model Serving
          - Salesforce Commerce Cloud
          - AI/BI
          - Delta Lake
          - MLflow
        stories:
          - title: ABFRL builds an in-season markdown recommendation model
            url: https://www.databricks.com/customers/aditya-birla-fashion-and-retail-ltd
      - name: Factory Risk Monitoring
        short: Sourcing
        icon: zplug
        summary: T&A delays flagged before launch dates are missed.
        problem: A slipped fabric date or a stalled cut cascades into a missed launch window, but time-and-action status lives in factory emails and spreadsheets, so the risk is seen only once the order is already late.
        who_benefits: Sourcing & Production
        how_built: PLM milestones and factory WIP land through Lakeflow onto Delta Lake at operational latency in Lakehouse//RT, and the Factory Tracker flags delay risk by PO before air-freight is forced.
        components:
          - Factory Tracker
          - Fast React Plan
          - Centric PLM
          - Lakehouse//RT
          - Lakeflow
          - Delta Lake
      - name: Sustainable Sourcing
        short: ESG
        icon: gavel
        summary: Preferred materials and factory disclosures scored at style level, with audit status reserved for linked audit evidence.
        problem: Buyers pick materials and factories with no live view of sustainability scores or audit status, so ESG claims and due-diligence rules are reconciled after the buy instead of shaping it.
        who_benefits: Sourcing & Production
        how_built: Higg material-impact scores and factory disclosures are conformed under Unity Catalog and joined to style records, scored at style level and read in AI/BI, keeping material impact, disclosures and separately evidenced audit status distinct so sourcing sees the ESG picture before commitment.
        components:
          - Higg Index MSI
          - Open Supply Hub
          - Unity Catalog
          - AI/BI
          - Delta Lake
      - name: Omnichannel Fulfillment
        short: Operations
        icon: stream
        summary: Ship-from-store and BOPIS against unified inventory.
        problem: Store and warehouse stock sit in separate systems, so ship-from-store and BOPIS promise inventory that isn't there and cancel orders a nearby store could have filled.
        who_benefits: Planning & Allocation
        how_built: POS, e-commerce and WMS feeds are unified on Delta Lake in near real time through Lakehouse//RT, exposing one governed inventory position that fulfilment routing and store Apps read.
        components:
          - Blue Yonder WMS
          - Shopify Plus
          - Lakehouse//RT
          - Delta Lake
          - Apps
        stories:
          - title: Optimizing Order Picking to Increase Omnichannel Profitability with Databricks
            url: https://www.databricks.com/blog/2022/08/04/optimizing-order-picking-to-increase-omnichannel-profitability-with-databricks.html
      - name: Clienteling & CRM
        short: Retail
        icon: custlake
        summary: High-value customers recognized in every channel.
        problem: A shopper is a loyalty number in-store, an email in DTC and a cookie online, so associates cannot recognise the high-value customer in front of them and personalization stays generic.
        who_benefits: Digital & CRM
        how_built: Store, DTC and loyalty identities are resolved on Delta Lake under Unity Catalog into CustomerLake profiles, and the Clienteling App serves associate recommendations over Lakebase.
        components:
          - Clienteling App
          - Salesforce Commerce Cloud
          - CustomerLake
          - Unity Catalog
          - Lakebase
        stories:
          - title: Skechers personalizes experiences for every customer
            url: https://www.databricks.com/customers/skechers
          - title: MUSINSA uses data to inspire smart fashion choices
            url: https://www.databricks.com/customers/musinsa
          - title: Myntra delivers personalized shopping experiences
            url: https://www.databricks.com/customers/myntra
      - name: Wholesale Chargebacks
        short: Finance
        icon: erp
        summary: Deductions reconciled to shipment and compliance data.
        problem: Department stores deduct for late, short or non-compliant shipments, and disputing a chargeback means matching it by hand to the PO, ASN and routing rules across systems, so most are written off.
        who_benefits: Brand President & CFO
        how_built: Shipment, order and compliance data are conformed on Delta Lake and reconciled in AI/BI against the Wholesale Partner Mart, surfacing which deductions are valid and which to dispute.
        components:
          - Wholesale Partner Mart
          - SAP S/4HANA Retail
          - AI/BI
          - Delta Lake
          - Unity Catalog
      - name: 3D Sample Reduction
        short: Design
        icon: apps
        summary: Physical samples replaced by digital fit approval.
        problem: Every style spins up multiple physical protos shipped between design and factories, adding weeks and cost to the calendar and a material footprint the sustainability targets can no longer absorb.
        who_benefits: Sourcing & Production
        how_built: Designers evaluate digital fit in CLO 3D and record approvals in Centric PLM, with Unity Catalog linking versioned 3D and material assets from CLO 3D and Adobe Substance to the evidence, so fewer physical protos are cut.
        components:
          - CLO 3D
          - Adobe Substance
          - Centric PLM
          - Unity Catalog
          - Delta Lake
      - name: Inventory Right-Sizing
        short: Finance
        icon: chart
        summary: WOS targets by category before excess ownership builds.
        problem: Excess inventory ties up cash and forces end-of-season markdown, but weeks-of-supply is read on a lag from stale reports, so overbuys are visible only once the ownership is already on the books.
        who_benefits: Brand President & CFO
        how_built: Sell-through and on-hand across channels are conformed on Delta Lake into certified Metric Views, so weeks-of-supply by category is watched in AI/BI and Genie One before excess builds.
        components:
          - Infor CloudSuite Fashion
          - AI/BI
          - Genie One
          - Delta Lake
          - Unity Catalog
        stories:
          - title: ABFRL anticipates the right product mix and quantities on Databricks
            url: https://www.databricks.com/customers/aditya-birla-fashion-and-retail-ltd
