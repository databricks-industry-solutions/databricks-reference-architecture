pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Brand President & CFO
        mark: Genie One
        summary: The CEO on brand heat and wholesale sell-in; the CFO on gross margin, full-price sell-through and inventory ownership.
        uses:
          - - Genie One
            - Ask what last collection's full-price sell-through was.
          - - AI/BI
            - Margin and OTB on certified Metric Views.
          - - Unity Catalog
            - One SKU definition across channels.
        sub:
          - name: Brand President / CEO
            cares: brand heat, wholesale sell-in and the health of the full-price business.
          - name: CFO
            cares: gross margin, full-price sell-through and the cash tied up in inventory ownership.
          - name: Financial Planning
            cares: OTB budgets, markdown liability and the season's margin bridge.
        ucs:
          - Inventory Right-Sizing
          - Wholesale Chargebacks
          - Markdown Optimization
      - name: Merchandising
        mark: AI/BI
        summary: Assortment breadth, depth, pricing and markdown cadence by door and channel, judged on sell-through rate, weeks of supply and GMROI.
        uses:
          - - Allocation Optimizer
            - Size curves and door profiles before allocation locks.
          - - AI/BI
            - Sell-through and WOS on governed POS.
        sub:
          - name: Buyers
            cares: assortment breadth and depth and the sell-through of every style they bought.
          - name: Merchandise Planners
            cares: pricing, markdown cadence and GMROI by door and channel.
          - name: Trading
            cares: weeks of supply and in-season reaction on the styles moving now.
        ucs:
          - Markdown Optimization
          - Demand Sensing
          - Size Curve Optimization
      - name: Planning & Allocation
        core: true
        mark: Model Serving
        summary: Open-to-buy, size curves and replenishment against demand forecasts, balancing receipt plans, in-stock rate and markdown liability.
        uses:
          - - OTB Workbench
            - Receipt plans against sell-through scenarios.
          - - Model Serving
            - Demand forecasts in the allocation path.
        sub:
          - name: Demand Planners
            cares: the forecast per style and door and how fast it moves with the trend.
          - name: Allocators
            cares: size curves, receipt plans and the in-stock rate at each door.
          - name: Replenishment
            cares: weeks of supply and refill timing against markdown liability.
        ucs:
          - Demand Sensing
          - Size Curve Optimization
          - Omnichannel Fulfillment
          - Inventory Right-Sizing
      - name: Sourcing & Production
        mark: Lakehouse//RT
        summary: Factory capacity, time-and-action risk and cost negotiations, tracked on on-time delivery, WIP by PO and landed cost per unit.
        uses:
          - - Factory Tracker
            - WIP and delay risk by PO and factory.
          - - Lakehouse//RT
            - Production milestones at operational latency.
        sub:
          - name: Sourcing Managers
            cares: landed cost per unit and the factory negotiation behind it.
          - name: Production / T&A
            cares: on-time delivery, WIP by PO and the critical-path calendar.
          - name: Product Development
            cares: fit, sample approvals and the path from design to proto.
        ucs:
          - Factory Risk Monitoring
          - 3D Sample Reduction
          - Sustainable Sourcing
      - name: Digital & CRM
        mark: Apps
        summary: Clienteling, loyalty and personalization across stores and DTC, measured on repeat rate, clienteled revenue and conversion.
        uses:
          - - Clienteling App
            - Associate recommendations on governed customer profiles.
          - - Apps
            - Store apps hosted next to governed data.
        sub:
          - name: Ecommerce
            cares: DTC conversion, on-site personalization and the owned-site funnel.
          - name: CRM & Loyalty
            cares: repeat rate, clienteled revenue and lifetime value across channels.
          - name: Retail Store Ops
            cares: associate clienteling and endless-aisle lookups on the floor.
        ucs:
          - Clienteling & CRM
          - Omnichannel Fulfillment
          - Demand Sensing
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land POS, e-commerce, PLM style masters and factory WIP; own Bronze to Silver and the pager when the sell-through tables merchandisers trade on stall.
        uses:
          - - Lakeflow Connect
            - Managed connectors for ERP, PLM and commerce sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on POS and production feeds.
          - - Lakewatch
            - Freshness on the sell-through tables the trading room reads every morning.
        sub:
          - name: Ingestion Engineers
            cares: managed connectors for ERP, PLM, POS and commerce feeds.
          - name: Pipeline Engineers
            cares: Bronze-to-Silver reliability and expectations on the sell-through tables.
          - name: Platform / SRE
            cares: the pager when the trading-room tables stall before market open.
        ucs:
          - Demand Sensing
          - Omnichannel Fulfillment
          - Factory Risk Monitoring
      - name: Data Scientists
        mark: MLflow
        summary: Short-lifecycle demand-sensing, size-curve and markdown-optimisation models, and whether they still hold across a new season's assortment.
        uses:
          - - Feature Store
            - Style and door features read identically in training and serving.
          - - MLflow
            - Every demand and markdown model tracked for audit and reproduction.
          - - Model Serving
            - Demand and markdown models scored in the allocation path.
        sub:
          - name: Demand Scientists
            cares: short-lifecycle demand-sensing and size-curve models per season.
          - name: Pricing Scientists
            cares: markdown-optimisation and price-elasticity models that hold through the season.
          - name: MLOps
            cares: training-to-serving parity and whether last season's model still holds.
        ucs:
          - Demand Sensing
          - Markdown Optimization
          - Size Curve Optimization
      - name: App Developers
        mark: Apps
        summary: Ship the OTB workbench, allocation optimizer, factory tracker and clienteling apps merchandising and stores work in, next to governed style data.
        uses:
          - - Apps
            - Operational and store screens with no separate web tier to secure.
          - - Lakebase
            - Serverless Postgres for allocation and clienteling state.
          - - Agent Bricks
            - Agents that draft receipt and markdown moves against governed tools.
        sub:
          - name: Full-Stack Engineers
            cares: the OTB, allocation and factory screens merchandising works in.
          - name: Store App Engineers
            cares: the clienteling and endless-aisle app on the sales floor.
          - name: Agent Engineers
            cares: agents that draft receipt and markdown moves against governed tools.
        ucs:
          - Clienteling & CRM
          - Markdown Optimization
          - Inventory Right-Sizing
