agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Sell-Through & Margin Agent
        icon: genie
        summary: Ask about sell-through, full-price rate and margin by collection in plain language.
        feeds:
          - Oracle Xstore POS
          - Shopify Plus
          - Infor CloudSuite Fashion
          - Sell-through, margin, OTB
        teams:
          - Merchandising
          - Brand President & CFO
          - Planning & Allocation
        questions:
          - What was full-price sell-through for the last collection?
          - Which styles are overstocked heading into markdown?
          - What is gross margin and GMROI by category and door?
          - How is weeks of supply trending versus the plan?
          - Which styles need a markdown before margin erodes?
      - name: Planning & Allocation Agent
        icon: genie
        summary: Explore open-to-buy, size curves and in-stock across doors and channels.
        feeds:
          - Infor CloudSuite Fashion
          - Blue Yonder WMS
          - Conformed styles and channels
        teams:
          - Planning & Allocation
          - Merchandising
          - Brand President & CFO
        questions:
          - What is open-to-buy remaining by department and collection?
          - Which doors are short on the fastest-selling sizes?
          - What is in-stock rate by door and style right now?
          - Where is markdown liability building against the plan?
          - Which size curves are misaligned to door demand?
      - name: Sourcing & Production Agent
        icon: genie
        summary: Answer factory WIP, on-time delivery and sustainability questions across the supply base.
        feeds:
          - Fast React Plan
          - Centric PLM
          - Lectra Fashion
          - Higg Index MSI
        teams:
          - Sourcing & Production
          - Merchandising
          - Brand President & CFO
        questions:
          - Which POs are at risk of missing the launch window?
          - What is on-time delivery by factory and season?
          - Where is WIP stalled against the critical path?
          - Which styles have unresolved sustainability or audit flags?
          - What is landed cost per unit trending by sourcing region?
      - name: Customer & Clienteling Agent
        icon: genie
        summary: Ask about repeat rate, clienteled revenue and personalisation across channels.
        feeds:
          - Salesforce Commerce Cloud
          - Oracle Xstore POS
          - Shopify Plus
        teams:
          - Digital & CRM
          - Merchandising
          - Brand President & CFO
        questions:
          - What is repeat purchase rate by customer segment?
          - How much revenue is clienteled versus walk-in?
          - Which high-value customers have lapsed this season?
          - What is DTC conversion by channel and device?
          - Which segments respond best to personalised offers?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Demand Sensing
        short: Planning
        icon: chart
        summary: Short-lifecycle forecasts updated from POS and digital signals.
        problem: Fashion sells out or gets marked down before anyone reads the signal, and forecasts built on last year's like-for-like miss the trend and the weather, so the buy is wrong the moment the season turns.
        who_benefits: Planning & Allocation
        how_built: POS and e-commerce signals land through Lakeflow onto Delta Lake, and demand-sensing models tracked in MLflow score through Model Serving into the OTB Workbench so plans move weekly, not seasonally.
        components:
          - OTB Workbench
          - Shopify Plus
          - Model Serving
          - MLflow
          - Lakeflow
          - Delta Lake
        stories:
          - title: ABFRL forecasts trends, demand and pricing on Databricks
            url: https://www.databricks.com/customers/aditya-birla-fashion-and-retail-ltd
