name: Apparel & Fashion
description: Seasonal collections, omnichannel retail, demand sensing, and sustainable sourcing across design, manufacturing, and direct-to-consumer channels.
sources:
  - name: PLM & Design
    icon: product
    simplified: 2
    tiles:
      - name: Centric PLM
        icon: product
        summary: Style masters, BOMs, colorways and sample approvals through development.
        citations:
          - centric-plm
        category: Product Lifecycle Management (PLM)
        what_it_is: Holds style masters, BOMs, colorways and sample approvals through development, the system of record for the line as it takes shape.
        who_uses_it: Product Development, Design and Sourcing teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 1-5 GB/day
            interval: Hourly / nightly sync
      - name: Adobe Substance
        icon: apps
        summary: Material libraries and 3D render assets linked to style records.
        citations:
          - adobe-substance
        category: 3D Material / Design Software
        what_it_is: Manages material libraries and 3D render assets linked to style records for digital design and virtual sampling.
        who_uses_it: Design and Product Development teams.
        data_out:
          batch:
            types:
              - unstructured
            volume: 10s-100s GB (assets)
            interval: On-save / nightly asset sync
      - name: CLO 3D
        icon: apps
        summary: Digital samples and fit iterations before physical proto.
        citations:
          - clo-3d
        category: 3D Sampling / Fit Simulation
        what_it_is: Produces digital samples and fit iterations before a physical proto, cutting sample rounds from the calendar.
        who_uses_it: Product Development, Design and Fit teams.
        data_out:
          batch:
            types:
              - unstructured
              - semi-structured
            volume: GBs/day (3D + fit)
            interval: On-iteration / daily sync
  - name: ERP & Supply
    icon: erp
    simplified: 2
    tiles:
      - name: Infor CloudSuite Fashion
        icon: erp
        summary: Seasonal collections, purchasing and factory allocations.
        citations:
          - infor-fashion
        category: Fashion ERP System
        what_it_is: Runs seasonal collections, purchasing and factory allocations, the commercial system of record for buy and ownership.
        who_uses_it: Merchandising, Planning and Finance teams.
        data_out:
          batch:
            types:
              - structured
            volume: 10-50 GB/day
            interval: Nightly close + hourly deltas
      - name: SAP S/4HANA Retail
        icon: erp
        summary: Inventory, allocation and financial close for multi-brand houses.
        citations:
          - sap-retail
        category: Retail ERP System
        what_it_is: Holds inventory, allocation and the financial close for multi-brand houses, reconciling ownership and margin across banners.
        who_uses_it: Finance, Merchandising and Master Data teams.
        data_out:
          batch:
            types:
              - structured
            volume: 20-80 GB/day
            interval: Nightly close + hourly deltas
          stream:
            types:
              - semi-structured
            volume: hundreds of events/sec
            interval: Continuous CDC
      - name: Blue Yonder WMS
        core: true
        icon: stream
        summary: Warehouse execution, pick paths and store replenishment.
        citations:
          - blue-yonder-wms
        category: Warehouse Management System (WMS)
        what_it_is: Runs distribution-centre execution, pick paths and store replenishment, emitting the movements behind door availability.
        who_uses_it: DC Operations, Store Replenishment and Logistics teams.
        data_out:
          batch:
            types:
              - structured
            volume: 5-30 GB/day
            interval: Multiple daily waves
          stream:
            types:
              - semi-structured
            volume: hundreds of events/sec
            interval: Continuous movement events
  - name: Commerce & POS
    icon: market
    tiles:
      - name: Shopify Plus
        icon: partner
        summary: DTC orders, returns and customer profiles across owned sites.
        citations:
          - shopify
        category: DTC E-Commerce Platform
        what_it_is: Powers direct-to-consumer orders, returns and customer profiles across owned sites, emitting the digital demand signal.
        who_uses_it: Ecommerce, Digital & CRM teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Hourly order sync
          stream:
            types:
              - semi-structured
            volume: hundreds-thousands of events/sec
            interval: Continuous clickstream
      - name: Salesforce Commerce Cloud
        icon: partner
        summary: Omnichannel carts, promotions and clienteling data.
        citations:
          - sf-commerce
        category: E-Commerce Platform
        what_it_is: Runs omnichannel carts, promotions and clienteling, emitting the browse, cart and order events behind the online journey.
        who_uses_it: Ecommerce, Digital Merchandising and Marketing teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: thousands of events/sec at peak
            interval: Continuous clickstream + orders
      - name: Oracle Xstore POS
        core: true
        icon: market
        summary: Store transactions, associates and endless aisle lookups.
        citations:
          - oracle-xstore
        category: Point-of-Sale (POS) System
        what_it_is: Captures store transactions, associate actions and endless-aisle lookups across the store fleet for sell-through and clienteling.
        who_uses_it: Retail Store Operations and Digital & CRM teams.
        data_out:
          batch:
            types:
              - structured
            volume: 5-20 GB/day
            interval: End-of-day polling
          stream:
            types:
              - semi-structured
            volume: hundreds of transactions/sec at peak
            interval: Continuous (near real-time)
  - name: Manufacturing
    icon: zplug
    simplified: 2
    tiles:
      - name: Lectra Fashion
        icon: zplug
        summary: Marker making, cutting room and factory KPIs.
        citations:
          - lectra
        category: Cutting Room / Manufacturing Software
        what_it_is: Runs marker making, cutting-room execution and factory KPIs, emitting the production and utilisation data behind supply.
        who_uses_it: Sourcing, Production and Manufacturing teams.
        data_out:
          batch:
            types:
              - structured
            volume: GBs/day
            interval: Daily batch
      - name: Gerber Technology
        icon: iot
        summary: Spreading, cutting and unit production tracking.
        citations:
          - gerber
        category: Cutting / Production Automation
        what_it_is: Tracks spreading, cutting and unit production on the factory floor, emitting throughput and WIP telemetry.
        who_uses_it: Production, Manufacturing and T&A teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds of events/sec
            interval: Continuous production events
      - name: Fast React Plan
        icon: sheet
        summary: Factory capacity, T&A calendars and critical path.
        citations:
          - fast-react
        category: Production Planning System
        what_it_is: Plans factory capacity, time-and-action calendars and the critical path so delay risk is visible before a launch window slips.
        who_uses_it: Production / T&A and Sourcing teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Daily plan runs
  - name: Sustainability
    icon: gavel
    tiles:
      - name: Higg Index MSI
        icon: gavel
        summary: Material sustainability impact scores, with facility disclosures and social-audit records tracked as a separate input class.
        citations:
          - higg
        category: Sustainability Scoring Platform
        what_it_is: Supplies material sustainability impact scores used to score styles; facility disclosures and social-audit records are a separate input class rather than the same product.
        who_uses_it: Sourcing, Sustainability and Compliance teams.
        data_out:
          batch:
            types:
              - structured
            volume: MBs-GBs/month
            interval: Monthly / on-audit refresh
      - name: Textile Exchange
        icon: partner
        summary: Preferred fiber certifications and chain of custody.
        citations:
          - textile-exchange
        category: Materials Certification Registry
        what_it_is: Provides preferred-fiber certifications and chain-of-custody records for due diligence and sustainability claims.
        who_uses_it: Sourcing, Sustainability and Compliance teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: MBs/month
            interval: Periodic certification updates
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Wholesale Partner Mart
        icon: fed
        summary: Department store sell-in and chargeback marts queried in place under Unity Catalog.
        category: Wholesale Data Mart
        what_it_is: Department-store sell-in and chargeback marts kept in the incumbent warehouse and queried in place through federation instead of being copied.
        who_uses_it: Wholesale, Finance and Merchandising analysts.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale historical marts
            interval: Queried on demand (federated)
  - name: Data Formats
    icon: zbraces
    simplified: 2
    tiles:
      - name: 'X12 EDI'
        icon: zbraces
        fmt: 'X12'
        summary: 'ANSI ASC X12 EDI transaction sets for POs, invoices and ship notices across the retail supply chain.'
        spec_url: https://x12.org/
      - name: 'EPCIS'
        icon: zbraces
        fmt: 'EPC'
        summary: 'GS1 event standard for item-level visibility and traceability from factory to store.'
        spec_url: https://www.gs1.org/standards/epcis
      - name: 'ASN'
        icon: zbraces
        fmt: 'ASN'
        summary: 'Advance Ship Notice (EDI 856) detailing the contents and packing of an inbound shipment.'
        spec_url: https://www.gs1.org/standards/edi
      - name: 'GS1 BOL'
        icon: zbraces
        fmt: 'BOL'
        summary: 'GS1 US Bill of Lading guideline for standardised freight documentation.'
        spec_url: https://www.gs1us.org/
cloud_integrations:
