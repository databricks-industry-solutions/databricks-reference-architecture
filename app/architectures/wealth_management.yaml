        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Household Growth Agent
        icon: genie
        summary: Ask about a household's value, held-away assets and relationship context in plain language.
        feeds:
          - Salesforce FSC
          - Addepar
          - Pershing NetX360
          - Conformed household, account, position
        teams:
