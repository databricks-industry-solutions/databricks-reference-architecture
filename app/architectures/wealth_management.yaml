  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Client Service AI
        short: Service
        icon: aisvc
        summary: Call summarization, agent assist and self-service answers across the client service desk, drafted from governed household data.
        problem: Client service teams jump between custody, planning and CRM systems to answer a call, so wait times grow, wrap-up is manual and the same question is answered differently each time.
        who_benefits: Client Experience
        how_built: Call and case data are unified in the lakehouse under Unity Catalog; agents built on Agent Bricks summarize interactions and draft answers against governed household data, surfaced in the service workflow.
        components:
          - Salesforce FSC
          - Agent Bricks
          - Genie
          - Unity Catalog
        stories:
          - title: Wealth advisor productivity starts with the client conversation
            url: https://www.databricks.com/blog/wealth-advisor-productivity-starts-client-conversation
      - name: Client Household 360
        short: Household view
        icon: people
        summary: Resolving every account, entity and held-away asset into one household view across custodians, so the advisor and the firm see the whole relationship.
        problem: Accounts sit across multiple custodians and legal entities with no shared household key, so the true relationship value and concentration are invisible and reporting never ties out.
        who_benefits: Wealth Leadership
        how_built: Custody, portfolio and CRM feeds are conformed against one household key in the lakehouse and served to the Advisor Desktop and AI/BI on certified Metric Views.
        components:
          - Advisor Desktop
          - Unity Catalog
          - Pershing NetX360
          - Addepar
          - AI/BI
        stories:
          - title: Addepar unifies portfolio, market and custodial data on Databricks
            url: https://www.databricks.com/customers/addepar
          - title: Wealth advisor productivity starts with the client conversation
            url: https://www.databricks.com/blog/wealth-advisor-productivity-starts-client-conversation
      - name: Next Best Action
        short: Advice
        icon: aisvc
        summary: Surfacing the most relevant next conversation for each household, from a funding opportunity to a plan gap, ranked and explained on the advisor's desktop.
        problem: Advisors cannot review every household every week, so opportunities and risks surface late or by luck rather than by a ranked, explainable signal.
        who_benefits: Advisory Field
        how_built: Household, planning and behaviour features feed next-best-action models in Model Serving; ranked, explained actions are written back to Salesforce FSC and the Advisor Desktop.
        components:
          - Advisor Desktop
          - Model Serving
          - Feature Store
          - Salesforce FSC
          - CustomerLake
        stories:
          - title: MCP-Powered Financial AI Workflows on Databricks
            url: https://www.databricks.com/blog/mcp-powered-financial-ai-workflows-databricks
      - name: Model Portfolio Rebal
        short: Trading
        icon: gauge
        summary: Rebalancing every household to its target model with tax and cash constraints respected, run across the book instead of one account at a time.
        problem: Rebalancing runs account by account in the portfolio tool, so drift, tax lots and household constraints are handled inconsistently and trading is slow to react to a model change.
        who_benefits: Investments
        how_built: Positions and model targets are conformed in the lakehouse; drift and tax-aware trades are scored in Model Serving and written back to Tamarac and Orion from the Rebalancing Console.
        components:
          - Rebalancing Console
          - Envestnet Tamarac
          - Orion Advisor Tech
          - Model Serving
          - AI/BI
        stories:
          - title: Addepar achieves scalable, cost-efficient data operations
            url: https://www.databricks.com/customers/addepar
          - title: Financial Services Investment Management reference architecture
            url: https://www.databricks.com/resources/architectures/financial-services-investment-management-reference-architecture
      - name: Tax-Loss Harvesting
        short: Tax alpha
        icon: chart
        summary: Finding unrealized-loss harvesting candidates across a household's taxable accounts given current lots and estimated tax rate, before the tax year closes.
        problem: Tax-loss opportunities hide in per-account cost-basis data that is never viewed at household level, so harvestable losses expire unclaimed and wash-sale rules are hard to police.
        who_benefits: Investments
        how_built: Cost-basis and lot data are conformed to Gold; harvest candidates are scored across the household and surfaced in the Rebalancing Console and to advisors in Genie.
        components:
          - Rebalancing Console
          - Addepar
          - Model Serving
          - Genie
          - Gold
        stories:
          - title: Wealth advisor productivity starts with the client conversation
            url: https://www.databricks.com/blog/wealth-advisor-productivity-starts-client-conversation
      - name: Performance Reporting
        short: Reporting
        icon: chart
        summary: Producing accurate, timely time-weighted performance, attribution and fee reporting for every household from one governed source instead of reconciled extracts.
        problem: Performance is stitched from custodian, portfolio and billing extracts that never agree, so client statements are late, inconsistent between systems and expensive to audit.
        who_benefits: Investments
        how_built: Positions, prices and fees are conformed against the custodial book of record; time-weighted performance and attribution are served to certified Gold products and Client Statements.
        components:
          - Client Statements
          - Addepar
          - SS&C Black Diamond
          - Data Products
          - AI/BI
        stories:
          - title: Addepar unifies portfolio and custodial data on Databricks
            url: https://www.databricks.com/customers/addepar
      - name: Client Attrition Risk
        short: Retention
        icon: observ
        summary: Predicting which households are at risk of leaving or moving assets away, early enough for the advisor to act rather than explain the outflow afterwards.
        problem: Outflows and advisor departures are seen after the assets move, so retention is reactive and the households most worth saving are identified too late.
        who_benefits: Advisory Field
        how_built: Household, activity and flow features feed attrition models tracked in MLflow and scored in Model Serving; at-risk households surface on the Advisor Desktop with the reason and a suggested action.
        components:
          - Advisor Desktop
          - Model Serving
          - Feature Store
          - Salesforce FSC
          - MLflow
        stories:
          - title: Databricks for Financial Services
            url: https://www.databricks.com/solutions/industries/financial-services
      - name: Digital & Robo Advice
        short: Hybrid advice
        icon: model
        summary: Powering self-directed and hybrid-advice journeys with personalised guidance, portfolios and nudges, at a cost to serve that reaches smaller and next-generation clients.
        problem: Digital advice journeys are generic and disconnected from the advised relationship, so smaller and next-generation clients get commodity guidance and drift to competitors.
        who_benefits: Client Experience
        how_built: Household and behaviour data are activated through CustomerLake; portfolio and guidance recommendations are scored in Model Serving and served into the digital and robo journey over Apex Clearing accounts.
        components:
          - CustomerLake
          - Model Serving
          - Apex Clearing
          - AI/BI
          - Lakehouse
        stories:
          - title: 'Customer Story: HSBC'
            url: https://www.databricks.com/customers/hsbc
      - name: Practice FP&A
        short: Finance
        icon: identity
        summary: Fee revenue, margin and cost-to-serve planned and closed on governed data instead of reconciled billing extracts.
        problem: Fee revenue, advisor compensation and cost-to-serve are stitched from billing and portfolio extracts each month, so the practice closes late and has no reliable forward view of margin by office or segment.
        who_benefits: Wealth Leadership
        how_built: Billing, portfolio and cost feeds conform on the lakehouse under Unity Catalog, AI Functions draft variance commentary, and fee revenue, margin and cost-to-serve are planned and reported through AI/BI and Genie.
        components:
          - SS&C Black Diamond
          - AI Functions
          - AI/BI
          - Genie
          - Unity Catalog
      - name: KYC AML & Suitability
        short: Compliance
        icon: gavel
        summary: Screening clients and monitoring account activity for KYC, AML and suitability with traceable evidence supporting regulatory examination, without drowning supervisors in false positives.
        problem: Screening and suitability run across siloed compliance systems with gappy data, so alerts are noisy, investigations are slow and completeness cannot be proven to an examiner.
        who_benefits: Risk & Compliance
        how_built: Client, activity and communications data are unified in the lakehouse; AI Functions and models score suitability and abuse patterns with LexisNexis screening, and cases open in the supervision queue.
        components:
          - AI Functions
          - LexisNexis KYC
          - Unity Catalog
          - Model Serving
          - Global Relay Archive
        stories:
          - title: 'Customer Story: HSBC'
            url: https://www.databricks.com/customers/hsbc
          - title: MCP-Powered Financial AI Workflows on Databricks
            url: https://www.databricks.com/blog/mcp-powered-financial-ai-workflows-databricks
medallion:
  Bronze:
    short: Raw custodial and CRM feeds
    summary: Custodial position and transaction files from Pershing, Fidelity and Schwab, Addepar and Orion portfolio extracts, Salesforce FSC activity and eMoney financial plans, landed exactly as received so a holding or a fee can always be replayed as it stood.
  Silver:
    short: Conformed household, account, position
    summary: Households, clients, accounts and positions resolved into single conformed entities across the custody, portfolio and CRM estates, with security identifiers reconciled and each account linked to one primary reporting household and advisor per reporting period, retaining effective-dated links for other valid entity, household and advisory relationships.
  Gold:
    short: AUM, fees, performance, flows
    summary: 'Contracted products the wealth business runs on: AUM and net new assets by advisor and household, fee revenue and margin, time-weighted performance and attribution, and net flows by segment and channel.'
