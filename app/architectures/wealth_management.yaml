pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Wealth Leadership
        mark: Genie One
        summary: The head of wealth on AUM, net new assets and advisor productivity; the CFO on fee revenue, margin and cost to serve; the COO on platform consolidation and the operating model across custodians and offices.
        uses:
          - - Genie One
            - Ask what net new assets an office brought in, or what a household is worth, without waiting on an analyst.
          - - AI/BI
            - AUM, net flows, fee revenue and advisor productivity on one certified set of Metric Views.
          - - Unity Catalog
            - One governed household and glossary, so "AUM" and "net new assets" mean one thing across the firm.
        sub:
          - name: Head of Wealth
            cares: AUM growth, net new assets and advisor productivity.
          - name: CFO
            cares: fee revenue, margin and cost to serve across the book.
          - name: COO
            cares: platform consolidation and the operating model across custodians.
        ucs:
          - Client Household 360
          - Performance Reporting
          - Practice FP&A
      - name: Advisory Field
        mark: Genie One
        summary: Financial advisors preparing for and running client reviews; relationship managers on HNW and private-banking relationships; client associates on meeting prep, service requests and follow-up.
        uses:
          - - Genie One
            - Ask a client's tax-loss opportunity or held-away balances in plain language, in seconds, before the meeting.
          - - Agent Bricks
            - Agents that draft a meeting brief and next best action against governed household data.
          - - Model Serving
            - Attrition and next-best-action scores surfaced on the advisor desktop.
        sub:
          - name: Financial advisors
            cares: client conversations, reviews and next best action.
          - name: Relationship managers
            cares: HNW and private-banking relationships.
          - name: Client associates
            cares: meeting prep, service requests and follow-up.
        ucs:
          - Next Best Action
          - Client Attrition Risk
          - Client Service AI
      - name: Investments
        core: true
        mark: AI/BI
        summary: The chief investment office on model portfolios and asset allocation; portfolio construction on rebalancing and tax-aware trading; investment research on fund selection and manager due diligence.
        uses:
          - - AI/BI
            - Performance, attribution and drift on the same definitions the advisor reads to the client.
          - - Model Serving
            - Rebalancing and tax-optimisation scored across households, not one account at a time.
          - - Unity Catalog
            - One governed security master and model library across research and trading.
        sub:
          - name: Chief investment office
            cares: model portfolios and asset allocation.
          - name: Portfolio construction
            cares: rebalancing and tax-aware trading across households.
          - name: Investment research
            cares: fund selection and manager due diligence.
        ucs:
          - Model Portfolio Rebal
          - Tax-Loss Harvesting
          - Performance Reporting
      - name: Client Experience
        mark: CustomerLake
        summary: Digital and robo-advice teams on self-directed and hybrid journeys; client marketing on segmentation and personalised outreach; the onboarding team on account opening and funding.
        uses:
          - - CustomerLake
            - Household, planning and clickstream activated for personalisation without a separate CDP.
          - - Model Serving
            - Propensity, funding and next-best-conversation models scored in the client journey.
          - - Apps
            - Client portal and onboarding screens hosted next to governed data.
        sub:
          - name: Digital & robo advice
            cares: self-directed and hybrid-advice journeys.
          - name: Client marketing
            cares: segmentation and personalised outreach.
          - name: Onboarding
            cares: account opening and funding.
        ucs:
          - Digital & Robo Advice
          - Client Service AI
          - Next Best Action
      - name: Risk & Compliance
        mark: AI Functions
        summary: Compliance on suitability, Reg BI and books-and-records; financial crime on KYC, AML and transaction monitoring; supervision on advisor conduct and communications surveillance.
        uses:
          - - AI Functions
            - Communications and account activity screened for suitability and abuse patterns at scale.
          - - Genie One
            - Investigators ask for a client's activity around an event in plain language.
          - - Unity Catalog
            - Audit trails and lineage as traceable evidence supporting a regulatory examination.
        sub:
          - name: Compliance
            cares: suitability, Reg BI and books-and-records.
          - name: Financial crime
            cares: KYC, AML and transaction monitoring.
          - name: Supervision
            cares: advisor conduct and communications surveillance.
        ucs:
          - KYC AML & Suitability
          - Client Household 360
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land Pershing, Fidelity and Schwab custodial files, Addepar and Orion positions and Salesforce FSC activity; own the Bronze to Silver path and the pager when a feed breaks.
        uses:
          - - Lakeflow Connect
            - Managed connectors for custody, CRM, planning and portfolio sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on position, transaction and fee feeds.
          - - Lakewatch
            - Freshness on the household and performance tables advisors open every morning.
      - name: Data Scientists
        mark: MLflow
        summary: Attrition, next-best-action, funding-propensity and tax-optimisation models, and whether they still hold six months after deployment.
        uses:
          - - Feature Store
            - Household and behaviour features defined once and read identically in training and serving.
          - - MLflow
            - Every run tracked for audit and reproduction under supervision.
          - - Model Serving
            - Attrition and next-best-action models scored on the advisor desktop.
      - name: App Developers
        mark: Apps
        summary: Ship the advisor desktop, review builder, rebalancing and onboarding applications the firm works in, hosted next to governed data.
        uses:
          - - Apps
            - Advisor and client screens with no separate web tier to run or secure.
          - - Lakebase
            - Serverless Postgres for onboarding state and governed writes.
          - - Agent Bricks
            - Agents that draft review packs and rebalance proposals against governed tools.
