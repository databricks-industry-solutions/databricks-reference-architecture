name: Banking
description: 'Retail and commercial banking: core ledger, payments, lending, fraud, and regulatory reporting across branches and digital channels.'
sources:
  - name: Core Banking
    icon: erp
    simplified: 3
    tiles:
      - name: Temenos Transact
        icon: erp
        summary: Deposits, loans, GL and end-of-day across retail and commercial.
        citations:
          - temenos
        category: Core Banking System
        what_it_is: Holds the system-of-record ledger for deposits, loans and the general ledger, and runs the end-of-day cycle that posts interest, fees and balances.
        who_uses_it: Core banking operations, retail and commercial product teams, and Finance for the general ledger.
        data_out:
          batch:
            types:
              - structured
            volume: 50-200 GB/day
            interval: End-of-day batch + hourly deltas
          stream:
            types:
              - semi-structured
            volume: 0.5-3k postings/sec at peak
            interval: Continuous CDC (near real-time)
      - name: FIS Profile
        icon: erp
        summary: Account processing, interest accrual and regulatory extracts.
        citations:
          - fis-profile
        category: Core Banking System
        what_it_is: Processes retail and commercial accounts, accrues interest and produces the regulatory and statement extracts the back office depends on.
        who_uses_it: Deposit operations, Finance and Regulatory reporting teams.
        data_out:
          batch:
            types:
              - structured
            volume: 20-80 GB/day
            interval: Nightly batch extracts
      - name: Fiserv DNA
        icon: erp
        summary: 'US core account processing: deposits, loans and GL on Fiserv DNA and Premier.'
        citations:
          - fiserv
        category: Core Banking System
        what_it_is: US community and regional bank core platform covering deposits, loans and the GL, with real-time posting on the DNA architecture.
        who_uses_it: Core operations and branch systems teams at US community and regional banks.
        data_out:
          batch:
            types:
              - structured
            volume: 10-60 GB/day
            interval: Nightly batch
          stream:
            types:
              - semi-structured
            volume: hundreds of events/sec
            interval: Continuous CDC
  - name: Cards & Payments
    icon: market
    tiles:
      - name: Visa DPS / Auth
        icon: market
        summary: Authorization, clearing and dispute messages.
        citations:
          - visa
        category: Card Authorization & Clearing
        what_it_is: Carries the real-time card authorization decisions and the clearing and dispute (chargeback) messages that settle them.
        who_uses_it: Fraud, Cards & Payments operations and Dispute/chargeback teams.
        data_out:
          batch:
            types:
              - structured
            volume: 5-30 GB/day clearing files
            interval: Multiple settlement cycles daily
          stream:
            types:
              - semi-structured
            volume: 2-10k auths/sec at peak
            interval: Continuous (sub-second)
      - name: Mastercard Smart Data
        icon: market
        summary: Commercial-card expense and spend analytics with merchant category enrichment.
        citations:
          - mastercard
        category: Commercial Card Spend Analytics
        what_it_is: Enriches commercial-card transactions with merchant, category and tax detail for expense management and spend analytics.
        who_uses_it: Commercial Banking, Corporate card program managers and client Finance teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 1-5 GB/day
            interval: Daily feed
      - name: SWIFT FIN Messages
        core: true
        icon: api
        summary: Cross-border payment instructions and confirmations.
        citations:
          - swift
        category: Interbank Messaging Network
        what_it_is: Standardized MT/MX financial messages for cross-border payments, confirmations and correspondent-bank instructions.
        who_uses_it: Payments operations, Treasury and Correspondent banking teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 50-500 msgs/sec
            interval: Continuous message flow
  - name: Digital Channels
    icon: apps
    simplified: 2
    tiles:
      - name: Temenos Infinity
        icon: apps
        summary: Mobile and web sessions, transfers and self-service events.
        citations:
          - temenos-infinity
        category: Digital Banking Platform
        what_it_is: Runs the mobile and web banking experience and emits the clickstream, transfer and self-service events behind digital journeys.
        who_uses_it: Digital Banking, Product and Marketing analytics teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 5-20k events/sec at peak
            interval: Continuous clickstream
      - name: Salesforce FSC
        icon: custlake
        summary: Households, opportunities and service cases.
        citations:
          - sf-fsc
        category: Banking CRM
        what_it_is: Financial Services CRM holding household and relationship models, opportunities and service cases across channels.
        who_uses_it: Retail and Commercial relationship managers, and Service teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Hourly / nightly sync
          stream:
            types:
              - semi-structured
            volume: tens of events/sec
            interval: Continuous CDC
      - name: NICE Actimize
        core: true
        icon: gavel
        summary: AML alerts, cases and SAR workflow.
        citations:
          - actimize
        category: Financial Crime / AML Platform
        what_it_is: Generates AML transaction-monitoring alerts, manages investigation cases and drives the SAR filing workflow.
        who_uses_it: Financial crime investigators, AML compliance and Fraud operations.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 2-8 GB/day alerts + cases
            interval: Hourly
  - name: Risk & Finance
    icon: chart
    tiles:
      - name: Moody's RiskCalc
        icon: chart
        summary: PD/LGD models and rating migrations for commercial names.
        citations:
          - moodys
        category: Credit Risk Model Library
        what_it_is: Provides probability-of-default and loss-given-default models and rating migrations for commercial and corporate exposures.
        who_uses_it: Credit risk modelers, Commercial credit officers and Regulatory capital teams.
        data_out:
          batch:
            types:
              - structured
            volume: GBs (reference + scores)
            interval: Daily / monthly refresh
      - name: FIS Ambit Focus
        core: true
        icon: chart
        summary: ALM, liquidity and interest rate risk measurement.
        citations:
          - fis-alm
        category: Asset & Liability Management System
        what_it_is: Measures balance-sheet interest-rate risk, liquidity and funding under scenarios for asset-liability management.
        who_uses_it: Treasury, ALM and Liquidity risk teams.
        data_out:
          batch:
            types:
              - structured
            volume: 5-20 GB/day positions
            interval: Daily + scenario runs
      - name: Nasdaq AxiomSL Reg Reporting
        icon: gavel
        summary: Basel, CCAR and local regulatory templates.
        citations:
          - axiomsl
        category: Regulatory Reporting Platform
        what_it_is: Assembles Basel, CCAR and local regulatory returns from risk and finance data with full lineage and validation.
        who_uses_it: Regulatory reporting, Finance and Risk control teams.
        data_out:
          batch:
            types:
              - structured
            volume: 10-40 GB/reporting cycle
            interval: Daily / monthly / quarterly cycles
  - name: Open Banking
    icon: api
    tiles:
      - name: Plaid Aggregation
        icon: api
        summary: External account verification and aggregation with consent.
        citations:
          - plaid
        category: Account Aggregation Provider
        what_it_is: Connects to external accounts with customer consent to verify ownership and aggregate balances and transactions.
        who_uses_it: Digital Banking, Lending origination and Personal financial management teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 100s of API calls/sec
            interval: Continuous (API / webhook)
      - name: Tink Open Banking
        icon: partner
        summary: AIS/PIS traffic and consent registry.
        citations:
          - tink
        category: Open Banking Platform
        what_it_is: Handles account-information and payment-initiation traffic under PSD2 with a consent registry for third-party access.
        who_uses_it: Open banking, Payments and Compliance teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 100s-1000s of events/sec
            interval: Continuous (API)
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Data Warehouse Mart
        icon: fed
        summary: Historical GL and risk marts queried in place under Unity Catalog.
        category: Enterprise Data Warehouse
        what_it_is: Legacy general-ledger and risk marts kept in the incumbent warehouse and queried in place through federation instead of being copied.
        who_uses_it: Finance, Risk and Regulatory reporting analysts.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale historical marts
            interval: Queried on demand (federated)
  - name: Data Formats
    icon: zbraces
    simplified: 2
    tiles:
      - name: 'ISO 20022'
        icon: zbraces
        fmt: '20022'
        summary: 'Rich XML/JSON financial messaging standard for payments, cash management and reporting.'
        spec_url: https://www.iso20022.org/
        spark_connector: 'spark-xml'
        spark_repo: https://github.com/databricks/spark-xml
        databricks_resource: https://docs.databricks.com/aws/en/query/formats/xml
        source_systems:
          - 'SWIFT'
          - 'Temenos'
          - 'Finastra'
      - name: 'SWIFT MT'
        icon: zbraces
        fmt: 'MT'
        summary: 'Legacy SWIFT FIN message types for cross-border payments and correspondent banking.'
        spec_url: https://www.swift.com/standards
      - name: 'BAI2'
        icon: zbraces
        fmt: 'BAI2'
        summary: 'Bank Administration Institute cash-management format for balance and transaction reporting.'
        spec_url: https://www.bai.org/
      - name: 'Nacha ACH'
        icon: zbraces
        fmt: 'ACH'
        summary: 'US automated clearing house file format for batch debit and credit transfers.'
        spec_url: https://achdevguide.nacha.org/ach-file-details
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    tiles:
      - name: FICO Falcon
        icon: gavel
        summary: Card fraud scores and consortium intelligence.
        citations:
          - fico
        category: Card Fraud Scoring
        what_it_is: Scores card transactions for fraud in real time using consortium models and returns a risk score to the authorization path.
        who_uses_it: Fraud operations and Card risk teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 2-10k scores/sec at peak
            interval: Continuous (sub-second)
      - name: LexisNexis Risk
        icon: partner
        summary: KYC, sanctions and adverse media screening.
        citations:
          - lexisnexis
        category: KYC & Screening Provider
        what_it_is: Provides identity verification, sanctions and adverse-media screening used at onboarding and in ongoing due diligence.
        who_uses_it: Financial crime compliance, KYC/onboarding and Sanctions teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 1-4 GB/day
            interval: Daily + on-demand
      - name: Experian Bureau
        core: true
        icon: custlake
        summary: Credit bureau pulls and attribute refreshes.
        citations:
          - experian
        category: Credit Bureau
        what_it_is: Supplies credit reports, scores and attribute refreshes used in lending decisions and portfolio monitoring.
        who_uses_it: Lending, Credit risk and Collections teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-3 GB/day
            interval: Daily + on-demand pulls
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Chief Credit Officer & CFO
        mark: Genie One
        summary: The CEO on ROE and deposit growth; the CFO on net interest margin, cost-to-income and CET1 capital against NPL formation across the book.
        uses:
          - - Genie One
            - Ask what last quarter's NIM was by segment.
          - - AI/BI
            - Capital and liquidity on certified Metric Views.
          - - Unity Catalog
            - One customer definition across channels.
        sub:
          - name: Chief Executive Officer
            cares: return on equity, deposit growth and the balance between growth and capital strength.
          - name: Chief Financial Officer
            cares: net interest margin, cost-to-income and the certified numbers behind the results.
          - name: Chief Credit Officer
            cares: portfolio credit quality, NPL formation and provisioning across the book.
        ucs:
          - Regulatory Reporting
          - CECL & CCAR Stress Testing
          - FP&A & Financial Close
      - name: Retail Banking
        mark: AI/BI
        summary: Branch productivity, product penetration and attrition, judged on deposit and loan growth, household profitability and cross-sell.
        uses:
          - - Branch Performance
            - Household profitability by branch and RM.
          - - AI/BI
            - Deposit and loan growth on governed core data.
        sub:
          - name: Head of Branch Network
            cares: branch productivity, deposit and loan growth and household profitability by region.
          - name: Head of Digital Banking
            cares: mobile and web engagement, digital sales and self-service adoption.
          - name: Cards & Payments Lead
            cares: card spend, interchange and fraud loss across the portfolio.
        ucs:
          - Customer 360
          - Next-Best-Product
          - Contact-Center AI
      - name: Commercial Banking
        mark: Model Serving
        summary: Relationship profitability, covenants and limit utilization, tracked on risk-adjusted return, exposure at default and rating migration.
        uses:
          - - RM Workbench
            - Exposure and cross-sell opportunities by relationship.
          - - Model Serving
            - Early warning models on commercial books.
        sub:
          - name: Head of Corporate Banking
            cares: relationship profitability and risk-adjusted return across the commercial book.
          - name: Relationship Managers
            cares: exposure, covenant status and cross-sell across their named clients.
          - name: Credit Risk Officers
            cares: limit utilization, rating migration and early signs of deterioration.
        ucs:
          - Credit Early Warning
          - Customer 360
          - Regulatory Reporting
      - name: Risk & Compliance
        core: true
        mark: Lakehouse//RT
        summary: Credit, market and operational risk with regulatory reporting, run on PD/LGD, fraud loss rate and AML alert-to-SAR conversion.
        uses:
          - - AML Investigator
            - Alert prioritization and case narrative drafting.
          - - Lakehouse//RT
            - Fraud scores at authorization latency.
        sub:
          - name: Chief Risk Officer
            cares: credit, market and operational risk appetite and the loss rate across the bank.
          - name: Head of Financial Crime
            cares: AML alert quality, SAR conversion and sanctions screening coverage.
          - name: Head of Fraud
            cares: real-time fraud loss, false-positive rate and dispute volumes.
        ucs:
          - Real-Time Fraud
          - AML Transaction Monitoring
          - Perpetual KYC/KYB
          - Credit Early Warning
      - name: Treasury & ALM
        mark: AI/BI
        summary: Funding, liquidity buffers and hedge effectiveness, measured on LCR, NSFR and interest-rate gap under stress across the balance sheet.
        uses:
          - - ALM Dashboard
            - Gap and duration under rate scenarios.
          - - AI/BI
            - LCR and NSFR on certified regulatory views.
        sub:
          - name: Group Treasurer
            cares: funding, liquidity buffers and the cost of funds across the balance sheet.
          - name: ALM Manager
            cares: interest-rate gap, duration and hedge effectiveness under rate scenarios.
          - name: Liquidity Risk Lead
            cares: LCR, NSFR and intraday liquidity under stress.
        ucs:
          - CECL & CCAR Stress Testing
          - Regulatory Reporting
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land core-banking postings, card-network authorizations, wire messages and market-data feeds; own Bronze to Silver and the pager when risk tables stall.
        uses:
          - - Lakeflow Connect
            - Managed connectors for core, cards and credit-bureau sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on posting and authorization feeds.
          - - Lakewatch
            - Freshness on the exposure and liquidity tables risk reads at open.
        sub:
          - name: Ingestion Engineers
            cares: core-banking postings, card authorizations and wire messages landed on time.
          - name: Pipeline Engineers
            cares: Bronze-to-Silver conforming and expectations on posting and auth feeds.
          - name: Platform Reliability
            cares: freshness of the exposure and liquidity tables risk reads at open.
        ucs:
          - Real-Time Fraud
          - Regulatory Reporting
          - Perpetual KYC/KYB
      - name: Data Scientists
        mark: MLflow
        summary: PD/LGD credit-risk, AML transaction-monitoring, card-fraud and next-best-action models, and whether they still hold through a rate cycle.
        uses:
          - - Feature Store
            - Customer and transaction features read identically in training and serving.
          - - MLflow
            - Every PD and fraud model tracked for audit and reproduction.
          - - Model Serving
            - Fraud models scored in the authorization path; PD models scored in lending, monitoring and stress workflows.
        sub:
          - name: Credit Risk Modelers
            cares: PD, LGD and early-warning models that hold through a rate cycle.
          - name: Financial Crime DS
            cares: AML and card-fraud models and keeping false positives low.
          - name: Marketing DS
            cares: propensity, churn and next-best-action models on the retail book.
        ucs:
          - Credit Early Warning
          - Real-Time Fraud
          - AML Transaction Monitoring
          - Next-Best-Product
      - name: App Developers
        mark: Apps
        summary: Ship the limit, case-management, RM workbench and AML investigator apps risk and RMs work in, hosted next to governed customer data.
        uses:
          - - Apps
            - Risk and RM screens with no separate web tier to secure.
          - - Lakebase
            - Serverless Postgres for limit and case-management state.
          - - Agent Bricks
            - Agents that draft case narratives and limit changes against governed tools.
        sub:
          - name: Full-Stack Engineers
            cares: the limit, case-management and RM workbench screens bankers work in.
          - name: Agent Developers
            cares: agents that draft case narratives and limit changes on governed tools.
          - name: Integration Engineers
            cares: writeback of blocks, limits and offers into core and channels.
        ucs:
          - AML Transaction Monitoring
          - Credit Early Warning
          - Contact-Center AI
consumers:
  - name: BI & Productivity
    icon: chart
    from: bi
    tiles:
      - name: Tableau / Power BI
        icon: chart
        summary: Finance and risk dashboards on SQL warehouses.
      - name: Microsoft Teams
        icon: chat
        summary: Genie in Teams for liquidity and exposure questions.
      - name: Notebooks & IDEs
        icon: notebook
        summary: Model development notebooks on governed customer data.
  - name: Partners & Networks
    icon: partner
    tiles:
      - name: Card Network Files
        icon: api
        summary: Clearing and settlement files to Visa and Mastercard.
        citations:
          - visa
      - name: Open Banking APIs
        icon: api
        summary: Account information and payment initiation to TPPs.
        citations:
          - tink
      - name: Correspondent Banking
        icon: globe
        summary: SWIFT payment routing to correspondent banks.
        citations:
          - swift
  - name: Operational Writeback
    icon: opdb
    tiles:
      - name: Limit Updates
        icon: gauge
        summary: Credit limits adjusted in core from early warning triggers.
      - name: Fraud Block Rules
        core: true
        icon: gavel
        summary: Card blocks propagated to authorization switches.
        citations:
