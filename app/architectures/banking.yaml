  - name: Regulatory & Reporting
    icon: gavel
    tiles:
      - name: Basel III Returns
        icon: gavel
        summary: RWA and capital returns filed from contracted Gold tables.
        citations:
          - axiomsl
      - name: FinCEN SAR Filing
        core: true
        icon: share
        summary: Suspicious activity reports assembled from AML cases.
        citations:
          - actimize
  - name: Published Products
    icon: product
    tiles:
      - name: Data Products
        icon: product
        summary: Customer and exposure products in Unity Catalog Domains.
      - name: Sharing Recipients
        core: true
        icon: share
        summary: Partners and regulators via governed sharing.
  - name: Databricks Apps
    icon: apps
    simplified: 2
    tiles:
      - name: Branch Performance
        icon: chart
        short: Household P&L
        summary: Deposit, loan and fee profitability by branch and relationship manager.
      - name: RM Workbench
        icon: custlake
        short: Commercial CRM
        summary: Exposure, covenant status and cross-sell pipeline on governed relationship data.
      - name: AML Investigator
        icon: gavel
        short: Case prioritization
        summary: Alerts ranked and narratives drafted against transaction graphs.
      - name: ALM Dashboard
        icon: gauge
        short: Liquidity gaps
        summary: Rate and liquidity scenarios with hedge recommendations.
  - name: AI/BI Dashboards
    icon: aibi
    tiles:
      - name: Capital & Liquidity
        icon: aibi
        summary: Basel capital ratios, LCR and NSFR on certified regulatory Metric Views.
        kpis:
          - CET1 ratio
          - LCR
          - NSFR
          - RWA
          - Interest-rate gap
        teams:
          - Chief Credit Officer & CFO
          - Treasury & ALM
          - Regulatory Reporting
      - name: Fraud & AML Operations
        icon: aibi
        summary: Fraud loss, alert volumes, false-positive rates and SAR throughput.
        kpis:
          - Fraud loss rate
          - Alert volume
          - False-positive rate
          - Alert-to-SAR conversion
          - Dispute volume
        teams:
          - Risk & Compliance
          - Head of Fraud
          - Head of Financial Crime
      - name: Retail Growth & Cross-Sell
        icon: aibi
        summary: Deposit and loan growth, product penetration and household profitability.
        kpis:
          - Deposit growth
          - Loan growth
          - Products per household
          - Cross-sell rate
          - Household profitability
        teams:
          - Retail Banking
          - Marketing & Sales
          - Head of Branch Network
      - name: Credit Portfolio Quality
        icon: aibi
        summary: NPL formation, rating migration and expected loss across the book.
        kpis:
          - NPL ratio
          - Rating migration
          - Expected loss
          - PD/LGD trend
          - Coverage ratio
        teams:
          - Commercial Banking
          - Credit Risk Officers
          - Chief Credit Officer & CFO
  - name: Agent Harnesses
    icon: agents
    tiles:
      - name: Omnigent OSS
        icon: omni
        short: Databricks, open source
        summary: Open-source meta-harness above existing agent frameworks, enabling agent composition, collaboration and centralised governance from one interface.
        capabilities:
          - Build
          - Deploy
          - Optimize
          - Govern
        related:
          - Agent Bricks
          - Unity Gateway
      - name: Claude Code
        core: true
        icon: code
        short: 3rd-party harness
        summary: Anthropic's coding harness working against the platform through MCP, with spend, routing and policy governed by Unity Gateway.
      - name: OpenAI Codex
        core: true
        icon: code
        short: 3rd-party harness
        summary: OpenAI's coding harness connected over MCP, governed at runtime by Unity Gateway rather than trusted by configuration.
      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Fraud & Financial Crime Agent
        icon: genie
        summary: Ask about fraud losses, alert quality and AML case backlogs in plain language.
        feeds:
          - Visa DPS / Auth
          - NICE Actimize
          - FICO Falcon
          - Conformed customers and accounts
        teams:
          - Risk & Compliance
          - Head of Fraud
          - AML Investigators
        questions:
          - What is our card fraud loss rate this month versus last?
          - Which alert types have the worst false-positive rate right now?
          - How many AML cases are open past their SLA, and for which segments?
          - Which merchant categories are driving the most confirmed fraud?
          - What is the alert-to-SAR conversion rate by investigator team?
      - name: Servicing & Collections Agent
        icon: genie
        summary: Ask about service, collections and credit-decisioning turnaround across the operation in plain language.
        feeds:
          - Temenos Infinity
          - Salesforce FSC
          - Experian Bureau
          - Conformed customers and accounts
        teams:
          - Retail Banking
          - Head of Digital Banking
          - Head of Branch Network
        questions:
          - What is our contact-center call deflection rate with AI assist this month?
          - Which service topics drive the most repeat calls and manual handling?
          - What is credit-decision turnaround by product this quarter?
          - How many delinquent accounts cured after the latest treatment strategy?
          - Where are digital self-service journeys dropping off?
      - name: Retail Growth Agent
        icon: genie
        summary: Answer household, cross-sell and next-best-action questions across deposits, loans, cards and digital.
        feeds:
          - Salesforce FSC
          - Temenos Transact
          - Temenos Infinity
          - Conformed customers and accounts
        teams:
          - Retail Banking
          - Relationship Managers
          - Marketing & Sales
        questions:
          - What is the total relationship value of this household across all products?
          - Which customers hold only one product but look like cross-sell candidates?
          - What is deposit and loan growth by branch and relationship manager?
          - Which digitally-active customers have never been offered a card?
          - What is attrition risk for our top-decile households?
      - name: Treasury & ALM Agent
        icon: genie
        summary: Ask about funding, liquidity buffers and rate risk under stress.
        feeds:
          - FIS Ambit Focus
          - SWIFT FIN Messages
          - NIM, NPL, liquidity ratios
        teams:
          - Treasury & ALM
          - Group Treasurer
          - Liquidity Risk Lead
        questions:
          - What is our LCR and NSFR today, and the trend this quarter?
          - How does the interest-rate gap look under a +200bp shock?
          - What is projected deposit runoff under the stress scenario?
          - Which currencies show the tightest intraday liquidity?
          - How effective are our current hedges against rate moves?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Real-Time Fraud
        short: Payments
        icon: gavel
        summary: Fraud scores returned to the authorization switch within its configured decision budget.
        problem: A stolen card or account is drained in the seconds between swipe and settlement, and overnight batch fraud checks only tell you how much you lost after the money is gone.
        who_benefits: Risk & Compliance
        how_built: Authorization messages land in Lakehouse//RT, fraud models in Model Serving score transaction features within the authorization window, and a fraud score or decision returns to the authorization switch within its configured decision budget.
        components:
          - Visa DPS / Auth
          - Lakehouse//RT
          - Model Serving
          - Feature Store
          - MLflow
        stories:
          - title: Coinbase scales real-time fraud detection on Databricks
            url: https://www.databricks.com/customers/coinbase/lakeflow
          - title: Maya cuts fraud losses by up to 98%
            url: https://www.databricks.com/customers/maya
      - name: AML Transaction Monitoring
        short: Compliance
        icon: gavel
        summary: Suspicious patterns surfaced across channels and entities.
        problem: Money-laundering signals are scattered across accounts, channels and entities, and rules-only monitoring buries analysts under alerts that are mostly false positives while real networks slip through.
        who_benefits: Risk & Compliance
        how_built: Transactions and KYC land under Unity Catalog, Model Serving scores alerts, and Agent Bricks agents build case files and draft SAR narratives in the AML Investigator for human sign-off.
        components:
          - AML Investigator
          - NICE Actimize
          - Agent Bricks
          - Unity Catalog
          - Model Serving
        stories:
