      - name: CECL & CCAR Stress Testing
        short: Capital
        icon: gauge
        summary: Expected credit loss and capital adequacy modelled under supervisory stress scenarios, with CECL and CCAR as applicable US-regime examples.
        problem: CECL provisioning and CCAR stress runs are stitched from risk, finance and market extracts each cycle, so scenarios take weeks, assumptions are hard to reproduce and the capital story is fragile under examiner scrutiny.
        who_benefits: Chief Credit Officer & CFO
        how_built: Exposure, rating and macro feeds conform on Delta Lake under Unity Catalog, loss and pre-provision models tracked in MLflow run in Model Serving, and scenario results are certified for Nasdaq AxiomSL Reg Reporting and AI/BI.
        components:
          - Nasdaq AxiomSL Reg Reporting
          - Moody's RiskCalc
          - Model Serving
          - MLflow
          - Delta Lake
        stories:
          - title: How Databricks helps banks navigate interest rate changes
            url: https://www.databricks.com/blog/how-databricks-helps-banks-navigate-interest-rate-changes
      - name: Regulatory Reporting
        short: Finance
        icon: erp
        summary: Basel, CCAR and local returns from one governed model.
        problem: Basel, CCAR and local returns are stitched from dozens of risk and finance systems each cycle, so reconciliation is manual, lineage is hard to prove and one restatement can trigger a finding.
        who_benefits: Chief Credit Officer & CFO
        how_built: Risk and finance data conform into governed Gold tables under Unity Catalog with full lineage, and returns are assembled for Nasdaq AxiomSL Reg Reporting and published as Data Products.
        components:
          - Nasdaq AxiomSL Reg Reporting
          - Unity Catalog
          - Delta Lake
          - AI/BI
          - Data Products
        stories:
          - title: BCBS 239 compliance in the age of AI (ABN AMRO)
            url: https://www.databricks.com/blog/bcbs-239-compliance-age-ai-turning-regulatory-burden-strategic-advantage
      - name: Perpetual KYC/KYB
        short: Onboarding
        icon: api
        summary: Continuous identity, sanctions and beneficial-ownership screening across the customer lifecycle.
        problem: KYC and KYB run as point-in-time checks at onboarding, so refreshes lag, sanctions and adverse-media hits are missed between reviews, and remediation backlogs build with no single view of party risk.
        who_benefits: Risk & Compliance
        how_built: LexisNexis screening and Salesforce FSC party data conform under Unity Catalog, AI Functions and Model Serving score entity and network risk continuously, and analysts clear cases in the AML Investigator.
        components:
          - AML Investigator
          - LexisNexis Risk
          - Salesforce FSC
          - AI Functions
          - Model Serving
          - Unity Catalog
      - name: FP&A & Financial Close
        short: Finance
        icon: people
        summary: Month-end close and financial planning accelerated with governed data and AI-drafted variance commentary.
        problem: Month-end close depends on manual reconciliation across the general ledger and dozens of feeder systems, so numbers land late, variance analysis is rushed and finance has little time left for forward planning.
        who_benefits: Chief Credit Officer & CFO
        how_built: General-ledger and subledger feeds conform on Delta Lake under Unity Catalog, AI Functions draft variance commentary, and planning and actuals are served through AI/BI and Genie for a faster, auditable close.
        components:
          - Temenos Transact
          - Data Warehouse Mart
          - AI Functions
          - AI/BI
          - Genie
          - Unity Catalog
      - name: Contact-Center AI
        short: Service
        icon: chat
        summary: Call summarization, agent assist and self-service deflection across the contact center.
        problem: Contact-center agents move between core, card and CRM screens to answer a caller, so handle time is long, wrap-up is manual and customers repeat themselves across every channel.
        who_benefits: Retail Banking
        how_built: Call transcripts and CRM cases conform under Unity Catalog, agents built on Agent Bricks summarize calls and suggest next steps against governed customer data, and deflection is served through Databricks Apps.
        components:
          - Salesforce FSC
          - Temenos Infinity
          - Agent Bricks
          - AI/BI
