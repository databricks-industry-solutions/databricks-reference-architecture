            url: https://www.databricks.com/blog/modern-bsaaml-compliance-databricks
      - name: Credit Early Warning
        short: Risk
        icon: chart
        summary: Commercial deterioration flagged before covenant breach.
        problem: Commercial borrowers deteriorate months before a covenant breach, but early signals sit in separate risk, transaction and market systems, so managers see trouble only once it is on the books.
        who_benefits: Commercial Banking
        how_built: Exposure, rating and transaction features are engineered in Feature Store and scored by early-warning models in Model Serving, with runs tracked in MLflow and alerts surfaced in the RM Workbench.
        components:
          - RM Workbench
          - Moody's RiskCalc
          - Model Serving
          - MLflow
          - Feature Store
