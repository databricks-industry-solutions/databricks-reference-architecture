          - title: Capital One powers faster credit decisions
            url: https://www.databricks.com/customers/capital-one
      - name: Customer 360
        short: Retail
        icon: custlake
        summary: Household view across deposits, loans, cards and digital.
        problem: A household's deposits, loans, cards and digital activity live in separate core and channel systems, so nobody sees the whole relationship and the same customer looks like a stranger in every silo.
        who_benefits: Retail Banking
        how_built: Core, card and channel feeds are resolved into golden customer and account records on Delta Lake under Unity Catalog, and the household view is served to bankers through AI/BI and Salesforce FSC.
