agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Campaign Performance Agent
        icon: genie
        summary: Ask about spend, delivery and ROAS across every active flight in plain language.
        feeds:
          - Google Campaign Manager
          - The Trade Desk
          - Meta Ads Manager
          - ROAS, reach and attribution
        teams:
          - Performance Marketing
          - Media Planning
          - Data Scientists
        questions:
          - Which flights will miss their guarantee before the IO closes?
          - What is ROAS by channel this quarter versus last?
          - Which campaigns are over-pacing right now?
          - Where is working media leaking across platforms?
          - Which creatives are driving the best CPA this week?
      - name: Audience & Identity Agent
        icon: genie
        summary: Explore segments, overlap and match rates on governed first-party data.
        feeds:
          - Adobe Experience Platform
          - LiveRamp RampID
          - LiveRamp Data Clean Room
          - Conformed campaigns and audiences
        teams:
          - Performance Marketing
          - Media Planning
          - Data Engineers
        questions:
          - What is our match rate with each retail media partner?
          - Which lookalike segments convert best right now?
          - How much audience overlap exists across our top campaigns?
          - Which segments should be suppressed to cut waste?
          - What consent state applies to each activation audience?
      - name: Brand Safety & Fraud Agent
        icon: genie
        summary: Answer viewability, IVT and suitability questions on live delivery data.
        feeds:
          - IAS Brand Safety
          - IAB Tech Lab OpenRTB
          - AppsFlyer MMP
          - ROAS, reach and attribution
        teams:
          - Brand Safety
          - Performance Marketing
          - Data Scientists
        questions:
          - What is our invalid-traffic rate by exchange today?
          - Which placements breached brand-suitability thresholds?
          - Where is viewability below the campaign floor?
          - Which publishers show spoofed-inventory patterns?
          - What spend is exposed to unsafe inventory right now?
      - name: Finance & Reconciliation Agent
        icon: genie
        summary: Ask about pacing, makegoods and margin against contracted IO terms.
        feeds:
          - Finance & Billing Mart
          - Google Campaign Manager
          - Comscore Campaign Ratings
          - ROAS, reach and attribution
        teams:
          - Finance & Billing
          - CMO & CFO Office
          - Media Planning
        questions:
          - Which campaigns are over-pacing against the IO?
          - What makegood liability is accruing this quarter?
          - How do agency rebate accruals compare to plan?
          - Where is margin leaking on booked media?
          - What is variance to plan by client this month?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Cross-Channel Attribution
        short: Measurement
        icon: chart
        summary: Credit assigned across linear, digital and retail touchpoints using governed identity graphs.
        problem: Every platform claims the same conversion, so credit is double-counted and last-click still wins, and no one sees the true contribution of each touch across linear, digital and retail.
        who_benefits: CMO & CFO Office
        how_built: Impression, click and conversion events land through Lakeflow, identity is resolved on a governed graph, and multi-touch credit is scored in Model Serving and read in the Campaign Command Center.
        components:
          - Campaign Command Center
          - LiveRamp RampID
          - Unity Catalog
          - AI/BI
          - Model Serving
        stories:
          - title: Comcast Advertising powers ad campaign success with predictive insights
            url: https://www.databricks.com/customers/comcast/databricks-apps
      - name: Programmatic Bid Optimization
        short: Performance
        icon: market
        summary: Bids adjusted in real time against CPA, ROAS and incrementality targets.
        problem: Bids are set on stale rules and yesterday's reports, so budget floods low-value inventory and CPA and ROAS targets slip while the auction has already moved on.
        who_benefits: Performance Marketing
        how_built: OpenRTB bid logs stream into Lakehouse//RT, propensity features come from Feature Store, and bid modifiers are scored in Model Serving and pushed to The Trade Desk through the DSP integration at its supported decision cadence.
        components:
          - The Trade Desk
          - IAB Tech Lab OpenRTB
          - Model Serving
          - Lakehouse//RT
          - Feature Store
        stories:
          - title: The Trade Desk scales contextual targeting NLP with Databricks
            url: https://www.databricks.com/customers/thetradedesk/data-science
          - title: Agentic AI and the future of advertising
            url: https://www.databricks.com/blog/agentic-ai-and-future-advertising-why-next-frontier-runs-unified-data
      - name: Audience Propensity
        short: Targeting
        icon: custlake
        summary: Lookalike and suppression audiences scored from first-party and partner signals.
        problem: First-party signals sit in disconnected CRM, web and loyalty stores, so lookalike and suppression audiences are built from stale exports and miss the people most likely to convert.
        who_benefits: Performance Marketing
        how_built: CRM and web signals conform on Delta Lake, features land in Feature Store, and propensity and lookalike models scored in Model Serving compose segments in the Audience Studio for activation.
        components:
          - Audience Studio
          - Adobe Experience Platform
          - LiveRamp RampID
          - Feature Store
          - Model Serving
        stories:
          - title: Conde Nast unifies data for personalized experiences
            url: https://www.databricks.com/customers/conde_nast
          - title: Publicis Groupe delivers real-time personalized campaigns
            url: https://www.databricks.com/customers/publicis-groupe
      - name: Brand Lift Measurement
        short: Brand
        icon: ztarget
        summary: Exposed versus control cohorts tied to survey lift and delivery logs.
        problem: Exposed and control cohorts are stitched by hand from survey vendors and delivery logs, so brand lift lands weeks late and cannot be tied cleanly to who actually saw the campaign.
        who_benefits: CMO & CFO Office
        how_built: Delivery logs and survey panels conform under Unity Catalog, exposed versus control cohorts are matched, and lift is estimated in Model Serving and read in the Media Mix Workbench.
        components:
          - Media Mix Workbench
          - Kantar Brand Lift
          - Nielsen ONE
          - Model Serving
          - AI/BI
      - name: Frequency Management
        short: Reach
        icon: stream
        summary: Cross-platform frequency measured and caps applied through participating platforms before waste accumulates.
        problem: Each platform caps frequency only against its own impressions, so the same household is hit far past the point of return and spend is wasted on people already saturated.
        who_benefits: Media Planning
        how_built: Cross-platform delivery lands through Lakeflow, identity is unified on a graph, household frequency is reconciled on Delta Lake, and caps are applied through participating platforms from the Campaign Command Center.
        components:
          - Campaign Command Center
          - The Trade Desk
          - LiveRamp RampID
          - Lakehouse//RT
          - Delta Lake
        stories:
          - title: Agentic AI and the future of advertising
            url: https://www.databricks.com/blog/agentic-ai-and-future-advertising-why-next-frontier-runs-unified-data
      - name: Retail Media Activation
        short: Commerce
        icon: product
        summary: Sponsored search and display tuned against on-shelf availability.
        problem: Retail media runs in walled gardens, so brands buy sponsored placements blind to on-shelf availability and cannot tie the spend back to the sales it actually moved.
        who_benefits: Media Planning
        how_built: Retailer and sales signals join first-party data on Delta Lake, product-location availability suppresses unavailable offers and reallocates spend, segments are built in Audience Studio, and audiences are shared to Amazon Ads via clean rooms with results read in AI/BI.
        components:
          - Audience Studio
          - Amazon Ads
          - LiveRamp Data Clean Room
          - OpenSharing
          - AI/BI
        stories:
          - title: Magnite and Databricks transform ad data activation
            url: https://www.databricks.com/blog/magnite-and-databricks-announce-new-partnership-transform-ad-data-activation
      - name: Creative DCO
        short: Creative
        icon: apps
        summary: Dynamic elements swapped by audience segment and performance.
        problem: Creative variants multiply faster than anyone can test them, so winning combinations are guessed at and underperforming assets keep serving long after the data would have killed them.
        who_benefits: Performance Marketing
        how_built: Creative and performance-by-element data conform on Delta Lake, and AI Functions and Model Serving rank variants by segment so the best combinations rotate to the ad server.
        components:
          - Celtra Creative
          - Bynder DAM
          - Model Serving
          - AI Functions
          - Feature Store
        stories:
          - title: 'Generative AI In Advertising: Custom Ad Images from Segmentation'
            url: https://www.databricks.com/blog/generative-ai-advertising-custom-ad-images-segmentation
      - name: Fraud & IVT Detection
        short: Quality
        icon: gavel
        summary: Suspected invalid traffic flagged and confirmed IVT excluded from eligible billing and attribution.
        problem: Invalid traffic and spoofed inventory drain budgets and poison attribution, and by the time verification reports flag it the money is spent and the models are already skewed.
        who_benefits: Brand Safety
        how_built: OpenRTB and delivery events stream into Lakehouse//RT, anomaly models score traffic in Model Serving, and confirmed IVT is filtered and surfaced by severity in the Brand Safety Console.
        components:
          - Brand Safety Console
          - IAS Brand Safety
          - IAB Tech Lab OpenRTB
          - Model Serving
          - Lakehouse//RT
        stories:
          - title: How T-Mobile Marketing Uses Spark and MLflow to Detect Ad Fraud
            url: https://www.databricks.com/blog/2021/03/17/advertising-fraud-detection-at-scale-at-t-mobile.html
      - name: Agency Reconciliation
        short: Finance
        icon: erp
        summary: Delivery, makegoods and rebates reconciled to contracted IO terms.
        problem: Delivery, makegoods and rebates are reconciled to insertion orders across spreadsheets and exports, so billing disputes drag on and margin leaks through over-pacing no one caught.
        who_benefits: Finance & Billing
        how_built: Delivery and spend from ad servers conform under Unity Catalog, are reconciled to contracted IO terms on Delta Lake, and variance is questioned in Genie One and tracked in AI/BI.
        components:
          - Campaign Command Center
          - Google Campaign Manager
          - Genie One
          - AI/BI
          - Unity Catalog
      - name: Privacy-Safe Clean Rooms
        short: Identity
        icon: partner
        summary: Overlap and attribution computed through clean-room controls that share approved aggregates, not raw PII.
        problem: Overlap and attribution with retailers and publishers need matched records, but neither side will hand over raw PII, so measurement stalls in legal review and manual file swaps.
        who_benefits: Performance Marketing
        how_built: First-party data stays governed under Unity Catalog while overlap and attribution run in Audience Studio against partner data over OpenSharing, with disclosure governed by clean-room access policies and approved aggregate outputs.
        components:
          - Audience Studio
          - LiveRamp Data Clean Room
          - Unity Catalog
          - OpenSharing
          - Delta Lake
        stories:
          - title: 'The Trade Desk and Databricks: secure identity collaboration in clean rooms'
            url: https://www.databricks.com/blog/accelerating-secure-interoperable-identity-collaboration-trade-desk-and-databricks-partnership
medallion:
  Bronze:
    short: Raw ad server and partner logs
    summary: Impression, click, conversion and spend events from DSPs, ad servers and clean rooms, landed exactly as received so a bid or a view can be replayed for audit.
  Silver:
    short: Conformed campaigns and audiences
    summary: Campaigns, line items, creatives and audience segments resolved into single entities across platforms, with identity graphs stitched and frequency caps reconciled.
  Gold:
    short: ROAS, reach and attribution
    summary: 'Contracted products the media and finance teams run on: ROAS and CPA by channel, incremental lift, reach and frequency, and brand safety incident rates.'
