pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: CMO & CFO Office
        mark: Genie One
        summary: The CMO on brand share, working-media ratio and ROAS by channel; the CFO on agency fee efficiency and cost per acquisition.
        uses:
          - - Genie One
            - Ask what last quarter's ROAS was by channel without booking analyst time.
          - - AI/BI
            - Reach, frequency and ROAS on certified Metric Views.
          - - Unity Catalog
            - One definition of spend and conversion across platforms.
        sub:
          - name: CMO
            cares: brand share, working-media ratio and whether ROAS is improving quarter on quarter.
          - name: CFO
            cares: agency fee efficiency, cost per acquisition and where working media is leaking.
          - name: VP Marketing Analytics
            cares: one certified read on spend, reach and conversion across every platform.
        ucs:
          - Cross-Channel Attribution
          - Brand Lift Measurement
          - Agency Reconciliation
      - name: Media Planning
        mark: AI/BI
        summary: Channel mix, flighting and budget allocation across linear, digital and retail media, judged on reach, effective CPM and incremental lift.
        uses:
          - - Media Mix Workbench
            - Scenario planning on incremental lift by channel.
          - - AI/BI
            - Reach curves and budget pacing on governed data.
        sub:
          - name: Media Planning Director
            cares: the channel mix and flighting that hit reach and lift at the lowest effective CPM.
          - name: Investment Lead
            cares: upfront commitments, guarantees and the trade between reach and frequency.
          - name: Retail Media Strategist
            cares: where retail media budget moves sales versus subsidising the retailer.
        ucs:
          - Frequency Management
          - Retail Media Activation
          - Cross-Channel Attribution
      - name: Performance Marketing
        core: true
        mark: Model Serving
        summary: Bid management, audience targeting and creative testing across programmatic and paid social, held to CPA, ROAS and viewability targets.
        uses:
          - - Programmatic Bid Optimization
            - Real-time bid adjustments against CPA and ROAS targets.
          - - Model Serving
            - Conversion propensity scored in the bid path.
        sub:
          - name: Programmatic Trader
            cares: bid modifiers, pacing and viewability against CPA and ROAS targets.
          - name: Paid Social Lead
            cares: creative testing and audience matching across Meta and social channels.
          - name: Audience Ops
            cares: segment build, suppression and privacy-safe matching for activation.
        ucs:
          - Programmatic Bid Optimization
          - Audience Propensity
          - Creative DCO
      - name: Brand Safety
        mark: Lakehouse//RT
        summary: Suitability monitoring, invalid-traffic filtering and blocklists, tracked on IVT rate, viewability and brand-safety incident rate.
        uses:
          - - Brand Safety Console
            - Incidents flagged before scale is reached.
          - - Lakehouse//RT
            - Live suitability scores at auction latency.
        sub:
          - name: Brand Safety Lead
            cares: suitability, blocklists and keeping the brand off unsafe inventory.
          - name: Ad Verification Analyst
            cares: viewability, IVT rate and the incidents that reach scale.
          - name: Fraud Operations
            cares: spoofed inventory and bot traffic before it bills or skews models.
        ucs:
          - Fraud & IVT Detection
          - Programmatic Bid Optimization
      - name: Finance & Billing
        mark: AI/BI
        summary: Agency reconciliation, makegoods and client billing, watching over-pacing, rebate accruals and margin on booked media.
        uses:
          - - AI/BI
            - Spend reconciliation and variance to plan.
          - - Genie One
            - Ask which campaigns are over-pacing without a finance pull.
        sub:
          - name: Billing Manager
            cares: client invoicing, makegoods and reconciling delivery to the IO.
          - name: Rebate Analyst
            cares: agency rebate accruals and volume commitments across platforms.
          - name: Revenue Controller
            cares: over-pacing, margin on booked media and variance to plan.
        ucs:
          - Agency Reconciliation
          - Cross-Channel Attribution
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land the DSP bid stream, ad-server impression logs, clean-room overlaps and CRM audiences; own Bronze to Silver and the pager when pacing tables stall.
        uses:
          - - Lakeflow Connect
            - Managed connectors for ad servers, DSPs and SaaS marketing sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on impression and conversion feeds.
          - - Lakewatch
            - Freshness on the pacing tables planners refresh through the day.
        sub:
          - name: Pipeline Engineer
            cares: Bronze-to-Silver on the bid stream, impression logs and CRM audiences.
          - name: Streaming Ingest
            cares: the DSP and ad-server feeds that must not drop during a flight.
          - name: DataOps On-call
            cares: the pager when the pacing tables planners refresh all day stall.
        ucs:
          - Programmatic Bid Optimization
          - Cross-Channel Attribution
          - Privacy-Safe Clean Rooms
      - name: Data Scientists
        mark: MLflow
        summary: Bid-optimisation, conversion-propensity, lookalike and media-mix models, and whether they still hold once cookies deprecate and channels shift.
        uses:
          - - Feature Store
            - Audience and context features read identically in training and the bidder.
          - - MLflow
            - Every bid and lift experiment tracked for audit and reproduction.
          - - Model Serving
            - Bid and propensity models scored inside the auction path.
        sub:
          - name: Bid & Propensity Modeler
            cares: conversion propensity and bid models that hold in the auction.
          - name: Media Mix Scientist
            cares: incremental lift and budget allocation across channels.
          - name: MLOps
            cares: reproducible training and serving as cookies deprecate and channels shift.
        ucs:
          - Programmatic Bid Optimization
          - Audience Propensity
          - Brand Lift Measurement
      - name: App Developers
        mark: Apps
        summary: Ship the campaign command, audience-studio and brand-safety apps the media and finance teams work in, hosted next to governed delivery data.
        uses:
          - - Apps
            - Pacing and audience screens with no separate web tier to secure.
          - - Lakebase
            - Serverless Postgres for pacing state and blocklist writes.
          - - Agent Bricks
            - Agents that draft budget shifts against governed tools.
        sub:
          - name: Full-stack App Dev
            cares: the pacing, audience and brand-safety screens teams work in.
          - name: Frontend Engineer
            cares: fast, governed views over delivery and audience data.
          - name: Platform DevOps
            cares: hosting apps next to governed data with no separate web tier.
        ucs:
          - Fraud & IVT Detection
          - Audience Propensity
          - Agency Reconciliation
