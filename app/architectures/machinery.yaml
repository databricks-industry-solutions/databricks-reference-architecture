      - name: Quality Event Root Cause Analysis
        short: Machining defect RCA
        icon: observ
        summary: Quality events, non-conformances and machining defects joined to tool, parameter and supplier lot so the shared root cause is found, not just the symptom.
        problem: Quality events, non-conformances and machining defects are dispositioned in isolation, so the shared root cause across tool, parameter set, supplier lot and process is never found and the same failure recurs.
