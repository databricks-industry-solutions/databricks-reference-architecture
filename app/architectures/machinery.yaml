          - title: What is predictive maintenance on the Databricks platform
            url: https://www.databricks.com/blog/what-is-predictive-maintenance
      - name: Incident & Field Service Assistant
        short: Field service copilot
        icon: apps
        summary: Technicians and dispatchers assisted with the right diagnosis, part and history for a deployed machine before the truck rolls.
        problem: A technician arrives without the machine's history, the likely fault or the right part, so first-time-fix suffers and a second visit costs the customer uptime and the OEM margin.
        who_benefits: Aftermarket & Service
        how_built: Telemetry, ServiceMax history and PLM service data are governed under Unity Catalog, and Agent Bricks drafts a diagnosis, part list and work order in the Fleet Service Hub against governed tools.
