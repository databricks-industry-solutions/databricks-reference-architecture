        short: Machine & parts demand
        icon: market
        summary: Configured-machine and aftermarket-parts demand forecast from order history, installed base and pipeline rather than a static annual plan.
        problem: Demand for configured machines and service parts is planned from last year's numbers and sales gut feel, so long-lead builds and parts stock are set to the wrong signal and the plant swings between shortage and excess.
        who_benefits: Finance & Supply Chain
        how_built: SAP S/4HANA orders, Salesforce pipeline and Connected Machine Telemetry usage conform on Delta Lake and feed forecast models tracked in MLflow and scored in Model Serving, so demand reads against Kinaxis planning on certified AI/BI Metric Views and Genie One.
