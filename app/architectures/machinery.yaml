      - name: Predictive Maintenance & Asset Health
        short: Fleet asset health
        icon: iot
        summary: Deployed machines scored on telemetry so a field failure is predicted from load and fault signals before it stops the customer.
        problem: Machines in the field fail between service visits, and the load, vibration and fault-code signals that would have warned days earlier sit unused in telemetry nobody queries.
        who_benefits: Aftermarket & Service
        how_built: Connected-machine telemetry streams into Lakehouse//RT and feeds remaining-life and anomaly models tracked in MLflow and scored in Model Serving, raising a service work order from the Fleet Service Hub before the machine stops.
