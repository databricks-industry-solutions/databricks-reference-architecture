        short: Field-informed design
        icon: network
        summary: Design trade-offs on weight, durability and cost ranked against real field-reliability and duty-cycle evidence, so the next revision is grounded in how machines actually perform rather than assumption.
        problem: Design decisions are made on engineering judgement and last program's numbers, and the field-reliability and duty-cycle evidence that would show which design choices cut warranty and downtime sits unused in telemetry and service history.
        who_benefits: Engineering & Programs
        how_built: Teamcenter and Windchill design and change data conform on Delta Lake with Connected Machine Telemetry and ServiceMax field-reliability history under Unity Catalog, so design trade-offs are ranked against how deployed machines actually perform in the field and feed the next revision, with reliability models tracked in MLflow.
        components:
