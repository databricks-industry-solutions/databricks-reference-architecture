        summary: Contract, spot and accessorial rates before tender and audit.
      - name: Driver Mobile Hub
        icon: apps
        short: Last mile
        summary: Stop sequence, POD capture and exception codes on driver devices.
  - name: AI/BI Dashboards
    icon: aibi
    tiles:
      - name: OTIF & Service Performance
        icon: aibi
        summary: On-time-in-full, dwell and exception rates across lanes and customers.
        kpis:
          - OTIF
          - On-time %
          - Dwell time
          - Exception rate
          - Appointment compliance
        teams:
          - Transportation Ops
          - CEO & Network Office
          - In-Transit Exceptions
      - name: Cost per Mile & Freight Spend
        icon: aibi
        summary: Freight spend, cost per mile and accessorials with fuel surcharge recovery.
        kpis:
          - Cost per mile
          - Freight spend
          - Accessorial spend
          - Empty miles
          - Fuel surcharge recovery
        teams:
          - Commercial & Pricing
          - Finance & Claims
          - CEO & Network Office
      - name: Warehouse Productivity
        icon: aibi
        summary: Pick rate, dock utilisation, labour and yard turns across the DC network.
        kpis:
          - Pick rate
          - Dock utilisation
          - Labour hours per unit
          - Wave completion
          - Yard turns
        teams:
          - Warehouse Ops
          - DC Manager
          - Yard & Dock
      - name: Carrier Scorecards
        icon: aibi
        summary: Carrier OTIF, tender acceptance, claims and cost variance per lane.
        kpis:
          - Carrier OTIF
          - Tender acceptance
          - Claims rate
          - Cost variance
          - Capacity commitment
        teams:
          - Commercial & Pricing
          - Carrier Procurement
          - Bid & Sales
  - name: Agent Harnesses
    icon: agents
    tiles:
      - name: Omnigent OSS
        icon: omni
        short: Databricks, open source
        summary: Open-source meta-harness above existing agent frameworks, enabling agent composition, collaboration and centralised governance from one interface.
        capabilities:
          - Build
          - Deploy
          - Optimize
          - Govern
        related:
          - Agent Bricks
          - Unity Gateway
      - name: Claude Code
        core: true
        icon: code
        short: 3rd-party harness
        summary: Anthropic's coding harness working against the platform through MCP, with spend, routing and policy governed by Unity Gateway.
      - name: OpenAI Codex
        core: true
        icon: code
        short: 3rd-party harness
        summary: OpenAI's coding harness connected over MCP, governed at runtime by Unity Gateway rather than trusted by configuration.
      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Shipment Tracking & Routing Agent
        icon: genie
        summary: Track where a load is, why it is late, which shipments are at ETA risk and which drivers are flagged for safety.
        feeds:
          - project44 Visibility
          - FourKites
          - Samsara Fleet
          - Conformed shipment, leg, asset
        teams:
          - Transportation Ops
          - Dispatch
          - In-Transit Exceptions
        questions:
          - Which shipments are at risk of missing their delivery appointment today?
          - What is our on-time delivery rate by lane this week versus last?
          - Which in-transit incidents or breakdowns need a re-route and customer update right now?
          - Which drivers show the most unsafe-driving or fatigue events this week?
          - How accurate has our predicted ETA been against actual arrival by carrier?
      - name: Fleet & Carrier Agent
        icon: genie
        summary: Price lanes, forecast freight demand and predict fleet failures across carriers and modes.
        feeds:
          - MercuryGate TMS
          - Samsara Fleet
          - Geotab Fleet
          - OTIF, cost per mile
        teams:
          - Commercial & Pricing
          - Carrier Procurement
          - Transportation Ops
        questions:
          - Which lanes are running above contract rate on the spot market?
          - How should we price this lane given live demand, capacity and fuel?
          - Which tractors and trailers are most likely to fail before their next scheduled service?
          - What is forecast freight volume by lane and week for next quarter?
          - Which carriers have the best OTIF and lowest cost per mile on our top lanes?
      - name: Warehouse & Yard Agent
        icon: genie
        summary: Run DC inventory, order and tender processing and yard flow across the network.
        feeds:
          - Manhattan Active WMS
          - SAP EWM
          - EDI X12 214/210
          - Transporeon
        teams:
          - Warehouse Ops
          - DC Manager
          - Yard & Dock
        questions:
          - Which SKUs are at risk of stockout versus overstock by DC this week?
          - Where is safety stock tying up capital against actual demand and lead time?
          - How many inbound orders and tenders processed automatically without manual keying today?
          - Which tenders or orders are stuck on validation errors right now?
          - What is pick rate by DC and shift against the outbound cut-off?
      - name: Network Planning & Scenario Agent
        icon: genie
        summary: Simulate lane, capacity and cost scenarios so the network office can test commitments before making them.
        feeds:
          - Oracle OTM
          - Blue Yonder TMS
          - FourKites
          - OTIF, cost per mile
        teams:
          - CEO & Network Office
          - Network Strategy
          - Commercial & Pricing
        questions:
          - How would shifting these lanes to intermodal change cost and service?
          - What is the margin and OTIF impact if freight volume rises 15% next quarter?
          - Where should we add DC or lane capacity given the demand forecast?
          - What is forecast freight volume and required capacity by region next quarter?
          - Which network changes would cut empty miles without hurting service?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Distribution & Logistics Optimization
        short: Network routing
        icon: sheet
        summary: Multi-stop routes and network flows optimised for miles, HOS and appointment windows.
        problem: Multi-stop routes and lane assignments are built by hand against static maps, so miles, driver-hour limits and appointment windows never line up and every re-plan after a disruption is slow guesswork.
        who_benefits: Transportation Ops
        how_built: TMS orders land through Lakeflow onto Delta Lake, distance and time matrices are built with Apache Spark, and optimised stop sequences and network flows are scored in Model Serving and pushed to the Control Tower.
        components:
          - Control Tower
          - Oracle OTM
          - Apache Spark
          - Model Serving
