            url: https://www.databricks.com/blog/announcing-public-preview-zerobus-ingest
          - title: Introducing the Data + AI Platform for Energy
            url: https://www.databricks.com/blog/introducing-data-intelligence-platform-energy
        short: Roadside response
        icon: globe
        summary: An agent that pulls the accident, breakdown or exception together and drafts the roadside response, re-route and customer update.
        problem: When a truck is in an accident, breakdown or exception, dispatch pieces the story together from phone calls and disparate systems, so the right roadside response, re-route and customer update all lag the event.
        who_benefits: Transportation Ops
        how_built: Dashcam, ELD and visibility exception events land in Lakehouse//RT, and an agent built on Agent Bricks, grounded on governed shipment and asset data, drafts the roadside response, re-route and customer notification in the Control Tower.
        components:
          - Control Tower
          - Samsara Fleet
          - Omnitracs ELD
          - project44 Visibility
          - Agent Bricks
          - Lakehouse//RT
      - name: Scenario Planning & Business Simulation
        stories:
          - title: Stress Testing Supply Chain Networks at Scale on Databricks
            url: https://www.databricks.com/blog/stress-testing-supply-chain-networks-scale-databricks
          - title: "Solution Accelerator: Supply Chain Stress Testing with Digital Twins"
            url: https://github.com/databricks-industry-solutions/supply-chain-stress-test
        short: Network simulation
        icon: network
        summary: Network, capacity and cost scenarios simulated across lanes and modes so the network office can test commitments before they are made.
        problem: Big decisions on lane commitments, DC placement and mode shifts are made in spreadsheets that cannot model how demand swings, fuel and capacity interact, so the network is redesigned on gut feel and reacts late to disruption.
        who_benefits: CEO & Network Office
        how_built: Conformed shipment, cost and capacity data on Delta Lake feed network-flow and what-if simulations built with Apache Spark, scored in Model Serving and explored with Genie and AI/BI so planners compare scenarios on margin and service.
        components:
          - Oracle OTM
          - Apache Spark
          - Model Serving
          - AI/BI
          - Genie One
          - Delta Lake
medallion:
  Bronze:
    short: Raw shipment and fleet feeds
    summary: TMS orders, WMS moves, ELD logs, carrier EDI and shipper tender events, landed exactly as received so a detention charge or a missed appointment can always be replayed.
  Silver:
    short: Conformed shipment, leg, asset
    summary: Shipments, legs, stops and assets resolved into single conformed entities across TMS, WMS and telematics, with multi-stop routes stitched to one delivery.
  Gold:
    short: OTIF, cost per mile
    summary: 'Contracted products operations and finance run on: on-time-in-full by lane, cost per mile, warehouse pick rate, detention and fuel surcharge recovery.'
