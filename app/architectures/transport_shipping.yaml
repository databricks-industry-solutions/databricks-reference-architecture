      - name: Workforce Safety
        stories:
          - title: StrongArm Tech cuts workplace injuries with IoT and ML on Databricks
            url: https://www.databricks.com/customers/strongarm
        short: Driver safety
        icon: gavel
        summary: Unsafe driving and fatigue surfaced from dashcam, harsh-driving and HOS signals to prioritise driver coaching and reduce incident risk.
        problem: Unsafe driving and fatigue surface only after a crash or a CSA score hit, while the dashcam, harsh-driving and hours-of-service signals that predict them sit unaggregated across telematics and ELD systems.
        who_benefits: Transportation Ops
        how_built: Samsara dashcam, Geotab harsh-driving and Omnitracs HOS signals conform on Delta Lake, and risk models in Model Serving prioritise drivers and behaviours for coaching in AI/BI, while FMCSA status stays separate carrier-onboarding context.
        components:
          - Samsara Fleet
          - Geotab Fleet
          - Omnitracs ELD
          - FMCSA SAFER Feed
