      - name: Predictive Maintenance & Asset Health
        stories:
          - title: What Separates the Winners and Losers in the Connected Vehicle Data Revolution
            url: https://www.databricks.com/blog/what-separates-winners-and-losers-connected-vehicle-data-revolution
          - title: Predictive maintenance on the Databricks Lakehouse
            url: https://www.databricks.com/blog/what-is-predictive-maintenance
        short: Fleet asset health
        icon: iot
        summary: Tractor and trailer failures predicted from engine and fault signals before they strand a load.
        problem: Tractors and trailers break down on the road with no warning, so a failure strands a load, triggers an emergency roadside repair and blows the delivery window, while engine and fault signals sit unused in telematics.
        who_benefits: Transportation Ops
        how_built: Samsara engine diagnostics, Geotab maintenance alerts and Omnitracs signals stream into Lakehouse//RT and conform on Delta Lake, and remaining-life and fault models tracked in MLflow score in Model Serving so failures become scheduled shop visits.
        components:
          - Samsara Fleet
          - Geotab Fleet
          - Omnitracs ELD
          - Lakehouse//RT
          - Model Serving
          - MLflow
      - name: Dynamic Pricing
        stories:
          - title: Data and AI in action across the energy industry
            url: https://www.databricks.com/blog/powering-future-data-and-ai-action-across-energy-industry
        short: Lane pricing
        icon: market
        summary: Lane rates, accessorials and fuel surcharges priced against live demand, capacity and cost so bids win on margin, not just volume.
        problem: Lane rates are quoted from static contract sheets and last quarter's spot averages, so bids are won at prices that no longer reflect live demand, capacity or fuel, and margin leaks on every mispriced load.
        who_benefits: Commercial & Pricing
        how_built: MercuryGate rating, tender history and fuel indices conform on Delta Lake, and demand- and cost-aware pricing models tracked in MLflow score each lane through Model Serving, surfaced in the Rate Engine Workbench before a quote or tender.
        components:
          - Rate Engine Workbench
          - MercuryGate TMS
          - Model Serving
          - MLflow
          - Fuel Index APIs
          - Delta Lake
      - name: Cyber Threat Monitoring & Detection
        short: Fleet cyber defense
        icon: zshield
        summary: Threats to TMS, telematics and EDI systems detected from access and network logs before they divert freight or payments.
        problem: TMS, WMS and telematics logins, API calls and EDI exchanges throw off security signals that sit unwatched across systems, so a compromised carrier account or a hijacked tender feed is caught only after freight or payments are already diverted.
        who_benefits: Data Engineers
        how_built: TMS, telematics and EDI access and network logs land through Lakeflow on Delta Lake, and anomaly-detection models tracked in MLflow score in Model Serving under Unity Catalog to flag account takeover, tender spoofing and data exfiltration for review.
        components:
          - Lakeflow
          - Delta Lake
          - Model Serving
          - MLflow
          - Unity Catalog
