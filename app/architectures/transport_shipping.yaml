          - AI/BI
      - name: Inventory Optimization
        stories:
          - title: Supply Chain Distribution Optimization
            url: https://www.databricks.com/solutions/accelerators/supply-chain-distribution-optimization
          - title: "Smarter Supply Chains With Data and AI: Why It’s Time to Rethink Inventory Management"
            url: https://www.databricks.com/blog/smarter-supply-chains-data-and-ai-why-its-time-rethink-inventory-management
        short: DC inventory
        icon: db
        summary: Warehouse stock positioned and replenished against demand and velocity so DCs hold the right SKUs without tying up capital.
        problem: Stock is positioned across DCs by static min-max rules, so fast movers stock out while slow movers clog prime slots, and safety stock is set by habit rather than demand and lead-time variability.
        who_benefits: Warehouse Ops
        how_built: Manhattan and SAP EWM movements conform on Delta Lake, demand and lead-time features are read from Feature Store, and inventory and slotting models tracked in MLflow score in Model Serving, surfaced in Warehouse Pulse and AI/BI.
        components:
          - Warehouse Pulse
          - Manhattan Active WMS
          - SAP EWM
          - Feature Store
          - Model Serving
          - AI/BI
      - name: Order Processing Automation
        stories:
          - title: What is Intelligent Document Processing?
            url: https://www.databricks.com/blog/intelligent-document-processing
          - title: Document Intelligence on Databricks
            url: https://www.databricks.com/product/artificial-intelligence/document-intelligence
        short: Tender automation
        icon: stream
        summary: Inbound orders and carrier tenders parsed, validated and actioned automatically from EDI and TMS so loads move without manual keying.
        problem: Orders and tenders arrive as EDI messages, portal entries and emails that clerks re-key into the TMS, so mismatched references, missing accessorials and slow acknowledgements delay tendering and invite errors downstream.
        who_benefits: Transportation Ops
        how_built: EDI 204/214 messages and TMS orders land through Lakeflow on Delta Lake, AI Functions extract and validate order and tender fields under Unity Catalog, and clean loads are written back to Oracle OTM through governed apps.
        components:
          - Oracle OTM
          - EDI VAN (Cleo)
          - Lakeflow
          - AI Functions
          - Unity Catalog
          - Delta Lake
      - name: Incident & Field Service Assistant
        stories:
