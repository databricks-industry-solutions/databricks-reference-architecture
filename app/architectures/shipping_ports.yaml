medallion:
  Bronze:
    short: Raw port and vessel feeds
    summary: TOS moves, AIS position reports, berth plans, customs declarations and gate transactions, landed exactly as received so a dwell time or a crane move can always be replayed.
  Silver:
    short: Conformed vessel, visit, unit
    summary: Vessels, port calls, containers and bills of lading resolved into single conformed entities across TOS, PCS and carrier systems, with voyage legs stitched to one visit and tonnage or stockpile measures as bulk-terminal adaptations.
  Gold:
    short: Throughput, dwell, crane rate
    summary: 'Contracted products terminal and port authority teams run on: crane moves per hour, truck turnaround, vessel berth productivity, container dwell and demurrage exposure.'
