  - name: Regulatory & Reporting
    icon: gavel
    tiles:
      - name: Port Authority KPIs
        icon: gavel
        summary: Throughput and environmental metrics filed to the port authority.
        citations:
          - pcs
      - name: Customs Audit Trail
        core: true
        icon: share
        summary: Declaration and inspection evidence from contracted Gold products.
  - name: Published Products
    icon: product
    tiles:
      - name: Data Products
        icon: product
        summary: Terminal performance products in Unity Catalog Domains.
      - name: Sharing Recipients
        core: true
        icon: share
        summary: Carriers and shippers reading live dwell and berth data via Delta Sharing.
  - name: Databricks Apps
    icon: apps
    simplified: 2
    tiles:
      - name: Berth Planner
        icon: gauge
        short: Vessel scheduling
        summary: Berth and crane plans scored against AIS ETA, yard density and labour availability.
      - name: Gate Optimizer
        icon: stream
        short: Truck appointments
        summary: Appointment slots and gate lanes matched to yard capacity and vessel cut-off.
      - name: Yard Density Map
        icon: iot
        short: Slot utilisation
        summary: Live yard occupancy and rehandle risk before the vessel gang lands.
      - name: Customs Hold Console
        icon: gavel
        short: Clearance status
        summary: Declaration holds, inspections, release milestones and security and dangerous-goods incident triage in one operations view.
  - name: AI/BI Dashboards
    icon: aibi
    tiles:
      - name: Vessel & Berth Productivity
        icon: aibi
        summary: Crane moves per hour, berth utilisation and vessel ETA reliability.
        kpis:
          - Crane moves per hour
          - Berth utilisation
          - Berth idle time
          - Vessel ETA accuracy
          - Gang productivity
        teams:
          - Terminal Operations
          - Port Director Office
          - Berth Planner
      - name: Container Dwell & Demurrage
        icon: aibi
        summary: Dwell days, demurrage exposure and yard density across the terminal, with tonnage and stockpile measures as bulk adaptations.
        kpis:
          - Container dwell
          - Demurrage exposure
          - Yard density
          - Rehandle rate
          - Customs hold count
        teams:
          - Landside Logistics
          - Yard Controller
          - Commercial & Tariffs
      - name: Gate Turnaround & Intermodal
        icon: aibi
        summary: Truck turnaround, gate queues and rail loading performance.
        kpis:
          - Truck turnaround
          - Gate queue length
          - Appointment compliance
          - Rail utilisation
          - Drayage slot compliance
        teams:
          - Landside Logistics
          - Gate Manager
          - Intermodal Planner
      - name: Tariff & Storage Revenue
        icon: aibi
        summary: Handling and storage revenue reconciled to actual moves with leakage.
        kpis:
          - Handling revenue
          - Storage revenue
          - Revenue leakage
          - Rebate accuracy
          - Revenue per call
        teams:
          - Commercial & Tariffs
          - Tariff Manager
          - Revenue Assurance
  - name: Agent Harnesses
    icon: agents
    tiles:
      - name: Omnigent OSS
        icon: omni
        short: Databricks, open source
        summary: Open-source meta-harness above existing agent frameworks, enabling agent composition, collaboration and centralised governance from one interface.
        capabilities:
          - Build
          - Deploy
          - Optimize
          - Govern
        related:
          - Agent Bricks
          - Unity Gateway
      - name: Claude Code
        core: true
        icon: code
        short: 3rd-party harness
        summary: Anthropic's coding harness working against the platform through MCP, with spend, routing and policy governed by Unity Gateway.
      - name: OpenAI Codex
        core: true
        icon: code
        short: 3rd-party harness
        summary: OpenAI's coding harness connected over MCP, governed at runtime by Unity Gateway rather than trusted by configuration.
      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Berth & Vessel Agent
        icon: genie
        summary: Plan crane productivity, berth idle time, vessel arrival reliability and quay safety.
        feeds:
          - Navis N4 TOS
          - Kalmar Insight
          - AIS Vessel Tracking
          - SICK Yard Automation
          - Throughput, dwell, crane rate
        teams:
          - Terminal Operations
          - Berth Planner
          - Shift Manager
        questions:
          - Which approaching vessels have the least reliable declared ETA versus AIS?
          - What were crane moves per hour by vessel and berth on the last shift?
          - Which cranes and yard equipment are trending toward failure this week?
          - What container and vessel volume should we forecast by service next week?
          - Which equipment-proximity near-misses or high-risk zones were flagged on the quay this shift?
      - name: Dwell & Yard Agent
        icon: genie
        summary: Manage dwell days, yard density, customs release and terminal storage demurrage exposure across the stacks.
        feeds:
          - CyberLogitec OPUS
          - Identec RFID Gates
          - Descartes Customs
          - INTTRA eBL
          - Conformed vessel, visit, unit
        teams:
          - Landside Logistics
          - Yard Controller
          - Terminal Operations
        questions:
          - Which containers are about to breach free-dwell and accrue demurrage?
          - Which yard blocks are most congested and driving rehandles?
          - How many units are held by customs and blocking their slots for release?
          - How many bookings, bills of lading and customs releases cleared automatically versus held for manual document rework?
          - If volume grows 15% next quarter, where does yard capacity break first?
      - name: Gate & Rail Agent
        icon: genie
        summary: Flow truck turnaround, gate queues, intermodal handoffs and field incidents across landside.
        feeds:
          - Identec RFID Gates
          - SAP TM for Ports
          - Navis N4 TOS
          - Throughput, dwell, crane rate
        teams:
          - Landside Logistics
          - Gate Manager
          - Intermodal Planner
        questions:
          - What is average truck turnaround time by gate and hour today?
          - Which stage of the gate process is the current bottleneck?
          - How does appointment compliance compare to actual arrivals?
          - Which rail consists are at risk of going out light this window?
          - What open gate or equipment incidents need a field-service response now?
          - Which TOS access or gate-automation anomalies suggest a compromised account or spoofed gate transaction this shift?
      - name: Tariff & Revenue Agent
        icon: genie
        summary: Price tariffs and storage, and assure handling revenue, rebates and billed-versus-actual moves.
        feeds:
          - Jade Master Terminal
          - Tideworks Mainsail
          - Navis N4 TOS
          - Throughput, dwell, crane rate
        teams:
          - Commercial & Tariffs
          - Tariff Manager
          - Revenue Assurance
        questions:
          - Which lanes and services should we reprice given current demand and yard congestion?
          - Which customers exceeded free dwell and should move to a higher storage rate?
          - Where do billed moves diverge from actual crane and gate events?
          - What is revenue per vessel call by line this quarter?
