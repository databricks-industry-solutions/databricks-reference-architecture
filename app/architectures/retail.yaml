      - name: Store Performance & Workforce
        short: Store
        icon: people
        summary: Labour, traffic and conversion aligned so the right staff meet peak demand.
        problem: Labour is scheduled to a fixed template while traffic and conversion swing by daypart, so peak hours are understaffed, slow hours overstaffed and sales per labour hour never recovers.
        who_benefits: Store Operations
        how_built: NCR Voyix POS transactions are joined to footfall and workforce events in Lakehouse//RT and conformed on Delta Lake, so the Store Command Centre matches staffing to forecast demand and computes conversion against store visitor counts on certified AI/BI Metric Views.
        components:
