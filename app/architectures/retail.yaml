      - name: In-Stock Optimisation
        short: Availability
        icon: gauge
        summary: Safety stock and replenishment tuned to actual demand variability.
        problem: Safety stock is set once by rule of thumb, so demand variability shows up as empty shelves on the fastest sellers and cash tied up in the slow ones, and nobody sees a stockout spread.
        who_benefits: Store Operations
        how_built: POS and inventory positions stream into Lakehouse//RT and replenishment models in Model Serving tune min-max by SKU and door, raising Replenishment Orders before a shelf goes empty.
