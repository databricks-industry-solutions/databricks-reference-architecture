        problem: Assortments and replenishment lean on flat size curves and one national plan, so the wrong ranges and sizes land in the wrong doors and stores trade around the buy instead of to it.
        who_benefits: Planning & Allocation
        how_built: Demand signals and door profiles from Oracle Retail Merch scored in Model Serving drive assortment and size curves in the Allocation Optimizer, and door-level allocations release to Blue Yonder WMS through Allocation Releases.
