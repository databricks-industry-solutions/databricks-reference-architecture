      - name: Household Identity Resolution
        short: Customer 360
        icon: custlake
        summary: Fragmented web, loyalty and POS records resolved to one person, then linked through governed household relationships.
        problem: The same shopper appears as separate records in commerce, loyalty and POS, so offers double-count, journeys break across channels and no one can see the household behind the transactions.
        who_benefits: Digital & CRM
        how_built: Adobe Experience Platform, Salesforce Loyalty and NCR Voyix POS identities are conformed in CustomerLake on Delta Lake under Unity Catalog, resolving cross-channel person identities first and then linking them through governed household relationships, preserving individual records and consent without copying customer data off-platform.
        components:
