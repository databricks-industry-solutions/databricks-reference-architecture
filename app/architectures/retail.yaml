      - name: Agentic Commerce
        short: Digital
        icon: genie
        summary: Conversational shopping and agent-assisted checkout on governed catalogue and stock.
        problem: Shoppers increasingly arrive through chat and third-party AI agents, but the catalogue, price and live stock those agents need sit behind brittle APIs with no governed real-time source of truth.
