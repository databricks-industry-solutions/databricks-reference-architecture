          - Lakehouse//RT
          - NCR Voyix POS
          - AI/BI
          - Delta Lake
      - name: Customer Lifetime Value
        short: Retention
        icon: people
        summary: Household lifetime value and churn risk scored to protect the best customers.
        problem: Marketing spends the same on every shopper because lifetime value and churn risk are never scored, so the highest-value households churn quietly while budget chases one-time buyers.
        who_benefits: Merchant Leadership
        how_built: Salesforce Loyalty, POS and web signals conformed in CustomerLake feed lifetime-value and churn models in Model Serving tracked in MLflow, surfaced on certified AI/BI Metric Views the CMO reviews.
