medallion:
  Bronze:
    short: Raw sales and stock
    summary: POS transactions, e-commerce orders, inventory snapshots, markdown events and loyalty interactions, landed exactly as received so a basket or a stock position can always be replayed as it stood.
  Silver:
    short: Conformed SKU, store
    summary: SKUs, stores, customers and channels resolved into single conformed entities across ERP, commerce and WMS, with returns reconciled and omnichannel orders stitched to one fulfillment record.
  Gold:
    short: Comp, margin, in-stock
    summary: 'Contracted products merchandising and finance run on: comparable sales, gross margin after markdowns, in-stock rate and inventory turns.'
