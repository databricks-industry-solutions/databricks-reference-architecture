  - name: Databricks Apps
    icon: apps
    simplified: 2
    tiles:
      - name: Attribution Hub
        icon: chart
        short: Marketing mix
        summary: Multi-touch attributed credit across paid, owned and marketplace channels, distinguished from causal incrementality.
      - name: Pricing Workbench
        icon: market
        short: Elasticity
        summary: Price gaps and elasticity scenarios before changes go live.
      - name: Fulfillment Command
        icon: gauge
        short: Delivery SLA
        summary: Freshness-qualified ATP visibility and promise vs actual ship and delivery by node and carrier.
      - name: CX Console
        icon: custlake
        short: Customer health
        summary: CSAT, returns and repeat rate by cohort and segment.
  - name: AI/BI Dashboards
    icon: aibi
    tiles:
      - name: Growth & Conversion
        icon: aibi
        summary: Conversion, AOV, revenue and channel performance on certified Metric Views.
        kpis:
          - Conversion rate
          - AOV
          - GMV
          - Blended CAC
          - Return on ad spend
        teams:
          - Growth Marketing
          - CEO & Growth CFO
          - Merchandising
      - name: Fulfillment & SLA
        icon: aibi
        summary: On-time delivery, fill rate and cost to serve across nodes and carriers.
        kpis:
          - On-time delivery
          - Fill rate
          - Cost to serve
          - Split-shipment rate
          - ATP accuracy
        teams:
          - Operations
          - Customer Experience
          - Growth Marketing
      - name: Payments & Fraud
        icon: aibi
        summary: Authorization rate, chargebacks and fraud loss across processors.
        kpis:
          - Authorization rate
          - Chargeback rate
          - Fraud loss rate
          - Dispute volume
          - False-positive rate
        teams:
          - CEO & Growth CFO
          - Operations
          - Customer Experience
      - name: Retention & LTV
        icon: aibi
        summary: Repeat rate, lifetime value and CX health across cohorts.
        kpis:
          - Repeat rate
          - Customer lifetime value
          - Return rate
          - CSAT
          - Churn risk
        teams:
          - Customer Experience
          - Growth Marketing
          - CEO & Growth CFO
  - name: Agent Harnesses
    icon: agents
    tiles:
      - name: Omnigent OSS
        icon: omni
        short: Databricks, open source
        summary: Open-source meta-harness above existing agent frameworks, enabling agent composition, collaboration and centralised governance from one interface.
        capabilities:
          - Build
          - Deploy
          - Optimize
          - Govern
        related:
          - Agent Bricks
          - Unity Gateway
      - name: Claude Code
        core: true
        icon: code
        short: 3rd-party harness
        summary: Anthropic's coding harness working against the platform through MCP, with spend, routing and policy governed by Unity Gateway.
      - name: OpenAI Codex
        core: true
        icon: code
        short: 3rd-party harness
        summary: OpenAI's coding harness connected over MCP, governed at runtime by Unity Gateway rather than trusted by configuration.
      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Growth & Conversion Agent
        icon: genie
        summary: Ask about conversion, revenue, CAC and channel performance in plain language.
        feeds:
          - Shopify Plus
          - Google Analytics 4
          - Klaviyo
          - Conversion, AOV, LTV
        teams:
          - Growth Marketing
          - CEO & Growth CFO
          - Merchandising
        questions:
          - What was yesterday's conversion rate by channel?
          - What is blended CAC and LTV-to-CAC by acquisition channel?
          - Which campaigns drove the most attributed revenue, and where does incrementality differ?
          - How is AOV trending across paid, owned and marketplace?
          - What is return on ad spend by channel and campaign?
      - name: Fulfillment & Delivery Agent
        icon: genie
        summary: Explore delivery SLA, available-to-promise and cost to serve across nodes.
        feeds:
          - Manhattan Active Omni
          - ShipBob WMS
          - Flexport Logistics
          - Conformed customers and orders
        teams:
          - Operations
          - Customer Experience
          - Growth Marketing
        questions:
          - What is on-time delivery by node and carrier right now?
          - Where is available-to-promise drifting from actual stock?
          - What is cost to serve per order by fulfillment node?
          - Which orders are at risk of missing the promise date?
          - Which nodes have the highest split-shipment rate?
      - name: Payments & Fraud Agent
        icon: genie
        summary: Answer questions on payment success, disputes and checkout fraud.
        feeds:
          - Stripe Payments
          - Adyen Platform
          - Manhattan Active Omni
        teams:
          - CEO & Growth CFO
          - Operations
          - Customer Experience
        questions:
          - What is our payment authorization rate by processor?
          - How is the chargeback rate trending this month?
          - Which fraud patterns are driving the most declines?
          - What is dispute volume by reason code and market?
          - Where are false-positive declines costing us good orders?
      - name: Retention & Loyalty Agent
        icon: genie
        summary: Ask about retention, LTV segments and CX health across cohorts.
        feeds:
          - Klaviyo
          - Braze
          - Narvar Post-Purchase
        teams:
          - Customer Experience
          - Growth Marketing
          - CEO & Growth CFO
        questions:
          - What is repeat purchase rate by acquisition cohort?
          - Which LTV segments respond best to lifecycle journeys?
          - What is our return rate by category and reason?
          - How does CSAT compare across support channels?
          - Which cohorts are at highest churn risk right now?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Personalization
        short: Growth
        icon: custlake
        summary: Product recommendations and content ranked per visitor.
        problem: Every visitor sees the same merchandising, so relevant products stay buried and conversion leaks, and the signals to rank per shopper sit split across web, CRM and order systems.
        who_benefits: Growth Marketing
        how_built: Clickstream and order features are engineered in Feature Store and scored through Model Serving in the storefront path, so recommendations rank per visitor at page latency.
        components:
          - Model Serving
          - Feature Store
          - MLflow
          - AI Functions
          - Klaviyo
        stories:
          - title: Flaconi delivers real-time recommendations that lift conversion
            url: https://www.databricks.com/customers/flaconi
          - title: Myntra powers personalized shopping for 70M monthly users
            url: https://www.databricks.com/customers/myntra
          - title: Pandora scales personalized email recommendations across markets
            url: https://www.databricks.com/customers/pandora
      - name: Conversational Shopping
        short: Discovery
        icon: genie
        summary: A shopping assistant that answers, compares and builds the cart in natural language.
        problem: Shoppers describe what they want in their own words, but faceted filters and keyword search cannot answer intent, so they bounce before finding the product that fits.
        who_benefits: Customer Experience
        how_built: Shopify Plus catalogue and order history are grounded in Genie and in agents built on Agent Bricks running on Databricks Apps, so shoppers ask, compare and build a cart against one governed product model.
        components:
          - Agent Bricks
          - Genie
          - Databricks Apps
          - Shopify Plus
          - Unity Catalog
      - name: Dynamic Pricing
        short: Merchandising
        icon: market
        summary: Prices adjusted to elasticity and competitive signals.
        problem: Prices are set on cost-plus rules and stale competitor checks, so margin leaks on some SKUs and demand is left on the table on others while true elasticity goes unmeasured.
        who_benefits: Merchandising
        how_built: Demand, inventory and competitive signals feed elasticity models in Pricing Workbench, scored with Model Serving and pushed to the storefront and marketplaces.
        components:
          - Pricing Workbench
          - Model Serving
          - AI Functions
          - Delta Lake
          - Unity Catalog
        stories:
          - title: Seven ways AI reshapes retail pricing and operations
            url: https://www.databricks.com/blog/top-7-ways-ai-retail-enhances-customer-experience-and-operations
      - name: Inventory ATP
        short: Operations
        icon: stream
        summary: Freshness-qualified available-to-promise visibility at add-to-cart, with OMS holding reservation authority.
        problem: Available-to-promise is computed from a nightly snapshot, so the cart shows stock that is already gone and oversells trigger cancellations, split shipments and refunds.
        who_benefits: Operations
        how_built: OMS and WMS events stream through Zerobus into Lakehouse//RT, and Fulfillment Command serves a freshness-qualified ATP position at add-to-cart across nodes, with OMS retaining reservation authority.
        components:
          - Fulfillment Command
          - Lakehouse//RT
          - Zerobus
          - Manhattan Active Omni
          - Delta Lake
        stories:
          - title: Walgreens right-sizes inventory across 9,000 stores on Databricks
            url: https://www.databricks.com/customers/walgreens
      - name: Fraud Prevention
        short: Payments
        icon: gavel
        summary: Checkout fraud scored before capture.
        problem: Checkout fraud and chargebacks eat margin, but rules-only screening blocks good customers and misses new patterns, and the score has to land before capture in milliseconds.
        who_benefits: CEO & Growth CFO
        how_built: Per-card velocity features are served from Lakebase and scored by Model Serving in the checkout path, with every model tracked in MLflow for audit and dispute defense.
        components:
          - Model Serving
          - Feature Store
          - MLflow
          - Lakebase
          - Stripe Payments
        stories:
          - title: Real-time fraud detection with Spark Real-Time Mode and Lakebase
            url: https://www.databricks.com/blog/how-build-real-time-fraud-detection-using-spark-real-time-mode-and-lakebase
      - name: Product Discovery & Search
        short: Discovery
        icon: observ
        summary: Query understanding, ranking and recommendations tuned to conversion.
        problem: On-site search misreads intent and synonyms, so shoppers land on empty or irrelevant results and bounce, and merchandisers cannot see which queries quietly lose the sale.
        who_benefits: Merchandising
        how_built: Query and catalog embeddings in AI Search rank and recommend with Model Serving, and AI/BI surfaces zero-result and low-conversion queries merchandisers tune against.
        components:
          - AI Search
          - Model Serving
          - AI Functions
          - Feature Store
          - AI/BI
      - name: Identity Resolution & CDP
        short: Customer data
        icon: custlake
        summary: Anonymous, guest and account identities stitched into one governed profile.
        problem: The same shopper appears as separate identities across storefront, marketplace and CRM, so audiences double-count, journeys break across devices and consent is impossible to enforce.
        who_benefits: Growth Marketing
        how_built: Google Analytics 4 web behaviour, Shopify Plus orders and Klaviyo engagement are conformed on Delta Lake under Unity Catalog, resolving one consented customer profile without copying data off-platform.
        components:
          - Delta Lake
          - Unity Catalog
          - Google Analytics 4
          - Klaviyo
          - AI Functions
      - name: Demand Forecasting
        short: Planning
        icon: chart
        summary: SKU-level demand forecast from clickstream, orders and channel signals.
        problem: Buys and safety stock lean on last year's totals, so hero SKUs sell out mid-campaign while slow movers tie up cash, and no one sees demand shift until the stockout lands.
        who_benefits: Operations
        how_built: Shopify Plus orders and Google Analytics 4 demand signals land through Lakeflow, features are engineered in Feature Store, and SKU models scored in Model Serving drive buy and replenishment plans.
        components:
          - Lakeflow
          - Feature Store
          - Model Serving
          - Shopify Plus
          - Delta Lake
      - name: Customer 360 & LTV
        short: CRM
        icon: custlake
        summary: A unified customer view scoring lifetime value, cohorts and churn.
        problem: Campaigns target broad lists because there is no single customer view and lifetime value is guessed from last purchase, so budget chases one-time buyers while high-value cohorts get the same generic offer.
        who_benefits: Growth Marketing
        how_built: Purchase, engagement and margin features in Feature Store drive lifetime-value, cohort and churn models in Model Serving on one governed profile, and Klaviyo activates the scored cohorts for retention and upsell.
        components:
          - Model Serving
          - Feature Store
          - MLflow
          - Klaviyo
          - AI/BI
        stories:
          - title: Skechers lifts CTR 324% with customer segmentation and LTV
            url: https://www.databricks.com/customers/skechers
      - name: Agent-to-Agent Transactions
        short: Agentic
        icon: network
        summary: Machine shoppers and AI agents operating against governed catalogue and delegated checkout, with commerce and payment systems holding order-commitment authority.
        problem: Third-party AI agents are starting to browse, negotiate and buy on a shopper's behalf, but the storefront exposes no governed, real-time interface for them, so the brand loses control of price, stock and the relationship.
        who_benefits: CEO & Growth CFO
        how_built: Agents built on Agent Bricks expose catalogue, price and available-to-promise from Manhattan Active Omni through governed tools on Databricks Apps and Lakebase, so external agents transact against one governed model under delegated checkout authorization, with commerce and payment systems committing the order and Stripe Payments settling it.
        components:
          - Agent Bricks
          - Databricks Apps
          - Lakebase
          - Manhattan Active Omni
          - Stripe Payments
