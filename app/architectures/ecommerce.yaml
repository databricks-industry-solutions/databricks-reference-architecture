name: E-Commerce
description: 'For a digital-first retailer: catalog, discovery, orders, fulfillment, personalization and marketplace operations across DTC and marketplace channels.'
sources:
  - name: Commerce Platform
    icon: apps
    simplified: 3
    tiles:
      - name: Shopify Plus
        icon: apps
        summary: Catalog, carts, checkouts and customer accounts.
        citations:
          - shopify-ec
        category: E-Commerce Platform
        what_it_is: Runs the catalog, carts, checkouts and customer accounts, emitting the clickstream and order events behind the storefront.
        who_uses_it: E-commerce, Growth Marketing and Merchandising teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 5-20k events/sec at peak
            interval: Continuous clickstream + orders
      - name: Salesforce Commerce Cloud
        icon: partner
        summary: B2C and B2B storefronts with promotions.
        citations:
          - sfcc
        category: E-Commerce Platform
        what_it_is: Powers B2C and B2B storefronts with promotions and catalog, capturing browse, cart and order events across sites.
        who_uses_it: E-commerce, Merchandising and B2B Sales teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Hourly order sync
          stream:
            types:
              - semi-structured
            volume: thousands of events/sec
            interval: Continuous clickstream
      - name: Adobe Commerce
        icon: product
        summary: Magento catalog, pricing and multi-site config.
        citations:
          - adobe-commerce
        category: E-Commerce Platform
        what_it_is: Magento-based catalog, pricing and multi-site configuration, emitting product, price and order data across storefronts.
        who_uses_it: Merchandising, E-commerce and Site Operations teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-4 GB/day
            interval: Hourly / nightly sync
  - name: OMS & Payments
    icon: erp
    simplified: 3
    tiles:
      - name: Manhattan Active Omni
        icon: erp
        summary: Order orchestration, promising and returns.
        citations:
          - manhattan
        category: Order Management System (OMS)
        what_it_is: Orchestrates orders, order promising and returns across nodes, emitting the fulfillment and ATP events behind the promise.
        who_uses_it: Operations, Fulfillment and Customer Experience teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds-thousands of order events/sec
            interval: Continuous orchestration events
      - name: Stripe Payments
        core: true
        icon: market
        summary: Payment intents, disputes and payout reconciliation.
        citations:
          - stripe
        category: Payment Gateway / Processor
        what_it_is: Captures payment intents, disputes and payouts, returning the transaction and chargeback data behind revenue and fraud.
        who_uses_it: Finance, Fraud & Risk and Growth teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-3 GB/day payouts
            interval: Daily reconciliation
          stream:
            types:
              - semi-structured
            volume: hundreds of events/sec
            interval: Continuous (API / webhook)
      - name: Adyen Platform
        icon: partner
        summary: Global acquiring, risk and settlement.
        citations:
          - adyen
        category: Payment Gateway / Processor
        what_it_is: Provides global acquiring, risk scoring and settlement, emitting authorization, capture and settlement events across markets.
        who_uses_it: Finance, Payments and Fraud & Risk teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-3 GB/day settlement
            interval: Daily settlement files
          stream:
            types:
              - semi-structured
            volume: hundreds of events/sec
            interval: Continuous (API)
  - name: Fulfillment & WMS
    icon: stream
    simplified: 2
    tiles:
      - name: ShipBob WMS
        icon: stream
        summary: Pick, pack and carrier manifests.
        citations:
          - shipbob
        category: Warehouse Management System (WMS)
        what_it_is: Runs pick, pack and carrier manifesting across fulfillment centres, emitting shipment and inventory movement events.
        who_uses_it: Fulfillment Operations and Logistics teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds of events/sec
            interval: Continuous fulfillment events
      - name: Flexport Logistics
        icon: globe
        summary: Inbound containers, customs and drayage.
        citations:
          - flexport
        category: Freight Forwarding / Logistics Platform
        what_it_is: Tracks inbound containers, customs and drayage so planners see landed inventory and inbound delays before they hit stock.
        who_uses_it: Supply Chain, Inventory Planning and Logistics teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: GBs/day
            interval: Daily + milestone events
      - name: Narvar Post-Purchase
        icon: partner
        summary: Tracking, returns and WISMO experiences.
        citations:
          - narvar
        category: Post-Purchase Experience Platform
        what_it_is: Manages tracking, returns and where-is-my-order experiences, emitting delivery and return events tied to the order.
        who_uses_it: Customer Experience, Returns and Logistics teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: tens-hundreds of events/sec
            interval: Continuous tracking events
  - name: Marketing & CRM
    icon: custlake
    tiles:
      - name: Klaviyo
        icon: custlake
        summary: Email, SMS and lifecycle segments.
        citations:
          - klaviyo
        category: Marketing Automation / CRM Platform
        what_it_is: Runs email, SMS and lifecycle journeys on segments, emitting send, open, click and conversion events for lifecycle analytics.
        who_uses_it: Lifecycle & CRM and Growth Marketing teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-4 GB/day
            interval: Hourly sync
          stream:
            types:
              - semi-structured
            volume: hundreds of events/sec
            interval: Continuous engagement events
      - name: Braze
        icon: partner
        summary: Cross-channel campaigns and canvas journeys.
        citations:
          - braze
        category: Customer Engagement Platform
        what_it_is: Orchestrates cross-channel campaigns and canvas journeys across push, email and in-app, emitting engagement and conversion events.
        who_uses_it: Lifecycle & CRM and Growth Marketing teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds of events/sec
            interval: Continuous campaign events
      - name: Google Analytics 4
        core: true
        icon: observ
        summary: Session, funnel and attribution events.
        citations:
          - ga4
        category: Web / Digital Analytics Platform
        what_it_is: Captures session, funnel and attribution events across web and app for traffic, conversion and channel-mix analytics.
        who_uses_it: Growth Marketing, SEO and Analytics teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 5-20k events/sec at peak
            interval: Continuous event stream
  - name: Marketplaces
    icon: market
    simplified: 2
    tiles:
      - name: Amazon Seller Central
        icon: market
        summary: Marketplace orders, fees and advertising.
        citations:
          - amazon-sc
        category: Marketplace Seller Platform
        what_it_is: Provides marketplace orders, fees and advertising data so teams can reconcile price, stock and per-channel profit on Amazon.
        who_uses_it: Marketplace, Merchandising and Finance teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 1-5 GB/day
            interval: Daily reports + hourly orders
      - name: eBay Managed Payments
        icon: partner
        summary: Third-party marketplace transactions.
        citations:
          - ebay
        category: Marketplace Seller Platform
        what_it_is: Supplies third-party marketplace transactions and payouts, feeding per-channel order, fee and settlement reconciliation.
        who_uses_it: Marketplace and Finance teams.
        data_out:
          batch:
            types:
              - structured
            volume: GBs/day
            interval: Daily order + payout feed
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Finance Revenue Mart
        icon: fed
        summary: Revenue recognition marts queried in place under Unity Catalog.
        category: Enterprise Data Warehouse
        what_it_is: Revenue-recognition marts kept in the incumbent warehouse and queried in place through federation instead of being copied.
        who_uses_it: Finance and Revenue Operations analysts.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale historical marts
            interval: Queried on demand (federated)
  - name: Data Formats
    icon: zbraces
    simplified: 2
    tiles:
      - name: 'UBL'
        icon: zbraces
        fmt: 'UBL'
        summary: 'OASIS Universal Business Language XML for orders, invoices and dispatch documents.'
        spec_url: https://docs.oasis-open.org/ubl/UBL-2.1.html
      - name: 'EANCOM'
        icon: zbraces
        fmt: 'EANC'
        summary: 'GS1 EDIFACT subset for order-to-cash messaging with suppliers.'
        spec_url: https://www.gs1.org/standards/edi
      - name: 'GS1 XML'
        icon: zbraces
        fmt: 'GS1X'
        summary: 'GS1 XML business messages for orders, shipments and product data.'
        spec_url: https://www.gs1.org/standards/edi-xml
        spark_connector: 'spark-xml'
        spark_repo: https://github.com/databricks/spark-xml
        databricks_resource: https://docs.databricks.com/aws/en/query/formats/xml
        source_systems:
          - 'SAP'
          - '1WorldSync'
          - 'GS1 GDSN'
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    tiles:
      - name: Similarweb Digital
        icon: observ
        summary: Competitive traffic and channel mix benchmarks.
        citations:
          - similarweb
        category: Digital Market Intelligence Provider
        what_it_is: Supplies competitive traffic and channel-mix benchmarks so growth teams can size their share against competitors.
        who_uses_it: Growth Marketing, SEO and Strategy teams.
        data_out:
          batch:
            types:
              - structured
            volume: MBs-GBs/week
            interval: Weekly benchmark feed
      - name: Jungle Scout
        icon: market
        summary: Marketplace share and keyword intelligence.
        citations:
          - jungle-scout
        category: Marketplace Intelligence Provider
        what_it_is: Provides marketplace share and keyword intelligence used to tune Amazon listings, price and ad spend.
        who_uses_it: Marketplace and Merchandising teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: MBs-GBs/day
            interval: Daily feed
      - name: ShipStation Rates
        icon: api
        summary: Carrier rate shopping and delivery promises.
        citations:
          - shipstation
        category: Shipping / Rate Shopping API
        what_it_is: Returns carrier rate shopping and delivery promises consumed inbound to route orders to the lowest-cost node that meets SLA.
        who_uses_it: Operations, Fulfillment and Logistics teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds of API calls/sec
            interval: Continuous (API)
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: CEO & Growth CFO
        mark: Genie One
        summary: The CEO on GMV and contribution margin; the CMO on CAC and LTV, watching conversion rate, AOV and repeat rate by channel.
        uses:
          - - Genie One
            - Ask what yesterday's conversion rate was by channel.
          - - AI/BI
            - Revenue and margin on certified Metric Views.
          - - Unity Catalog
            - One customer ID across storefront and CRM.
        sub:
          - name: CEO
            cares: GMV, contribution margin and the growth-versus-profit trade across channels.
          - name: Growth CFO
            cares: cash, CAC payback and the margin behind every discount and promotion.
          - name: Chief Marketing Officer
            cares: blended CAC, LTV-to-CAC and return on ad spend across paid and owned.
        ucs:
          - Agent-to-Agent Transactions
          - Dynamic Pricing
          - Customer 360 & LTV
          - Fraud Prevention
      - name: Growth Marketing
        mark: Model Serving
        summary: Paid acquisition, SEO and lifecycle campaigns, judged on blended CAC, LTV-to-CAC and return on ad spend against payback period by channel.
        uses:
          - - Attribution Hub
            - Multi-touch credit across paid and owned.
          - - Model Serving
            - Propensity models in the campaign path.
        sub:
          - name: Paid Acquisition
            cares: blended CAC, ROAS and payback period by channel and campaign.
          - name: Lifecycle & CRM
            cares: email, SMS and push journeys judged on repeat rate and retention.
          - name: SEO & Content
            cares: organic traffic, landing-page conversion and content-driven discovery.
        ucs:
          - Personalization
          - Customer 360 & LTV
          - Identity Resolution & CDP
      - name: Merchandising
        core: true
        mark: AI/BI
        summary: Assortment, pricing, bundles and on-site search relevance, tracked on attach rate, gross margin and competitive price gap.
        uses:
          - - Pricing Workbench
            - Elasticity and competitive price gaps.
          - - AI/BI
            - Basket and attach rate on governed orders.
        sub:
          - name: Category Managers
            cares: assortment, gross margin and attach rate by category.
          - name: Pricing & Promotions
            cares: elasticity, competitive price gap and promotion lift.
          - name: Site Search & Discovery
            cares: on-site search relevance and conversion from query to cart.
        ucs:
          - Dynamic Pricing
          - Product Discovery & Search
          - Conversational Shopping
      - name: Operations
        mark: Lakehouse//RT
        summary: Fulfillment SLA, inventory and returns processing, run on on-time delivery, fill rate and cost to serve per order.
        uses:
          - - Fulfillment Command
            - Promise vs actual delivery by node.
          - - Lakehouse//RT
            - Inventory ATP at cart latency.
        sub:
          - name: Fulfillment Ops
            cares: on-time delivery, fill rate and cost to serve per order.
          - name: Inventory Planning
            cares: available-to-promise accuracy and safety stock across nodes.
          - name: Returns & Reverse Logistics
            cares: return rate, processing cost and restock speed.
        ucs:
          - Inventory ATP
          - Demand Forecasting
          - Agent-to-Agent Transactions
      - name: Customer Experience
        mark: Apps
        summary: Support, reviews and loyalty program health, measured on CSAT, NPS and repeat purchase against return rate and contact rate by cohort.
        uses:
          - - CX Console
            - CSAT, NPS and repeat purchase by cohort.
          - - Apps
            - Support tools on governed order history.
        sub:
          - name: Customer Support
            cares: contact rate, first-contact resolution and CSAT by channel.
          - name: Loyalty & Retention
            cares: repeat purchase, NPS and program engagement by cohort.
          - name: Reviews & Community
            cares: review volume, sentiment and their lift on conversion.
        ucs:
          - Conversational Shopping
          - Customer 360 & LTV
          - Identity Resolution & CDP
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land web clickstream, OMS orders, payment captures and WMS shipments; own Bronze to Silver and the pager when the revenue and ATP tables stall.
        uses:
          - - Lakeflow Connect
            - Managed connectors for commerce, OMS and payment sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on clickstream and order feeds.
          - - Lakewatch
            - Freshness on the revenue and conversion tables growth reads at standup.
        sub:
          - name: Ingestion Engineers
            cares: clickstream, OMS, payment and WMS connectors landing on time.
          - name: Pipeline Owners
            cares: Bronze-to-Silver reliability and the revenue and ATP table SLAs.
          - name: Platform On-Call
            cares: freshness and the pager when conversion or inventory tables stall.
        ucs:
          - Inventory ATP
          - Fraud Prevention
          - Identity Resolution & CDP
      - name: Data Scientists
        mark: MLflow
        summary: Recommendation, propensity, dynamic-pricing and checkout-fraud models, and whether they still hold across a peak season and channel mix shift.
        uses:
          - - Feature Store
            - Customer and session features read identically in training and serving.
          - - MLflow
            - Every recommendation and fraud model tracked for audit and reproduction.
          - - Model Serving
            - Recommendation and fraud models scored in the checkout path.
        sub:
          - name: Recommendation & Ranking
            cares: recommender and search-ranking models and their conversion lift.
          - name: Pricing & Propensity
            cares: elasticity, propensity and lifetime-value models across the mix.
          - name: Fraud & Risk
            cares: checkout-fraud models and how they hold through peak season.
        ucs:
          - Personalization
          - Dynamic Pricing
          - Fraud Prevention
          - Product Discovery & Search
      - name: App Developers
        mark: Apps
        summary: Ship the attribution hub, pricing workbench, fulfillment command and CX console apps growth and operations work in, next to governed order data.
        uses:
          - - Apps
            - Growth and operations screens with no separate web tier to secure.
          - - Lakebase
            - Serverless Postgres for cart-recovery and inventory-hold state.
          - - Agent Bricks
            - Agents that draft pricing and recovery moves against governed tools.
        sub:
          - name: App Engineers
            cares: the attribution, pricing, fulfillment and CX consoles growth and ops work in.
          - name: Backend & State
            cares: cart-recovery and inventory-hold state on serverless Postgres.
          - name: Agent Builders
            cares: agents that draft pricing and recovery moves against governed tools.
        ucs:
          - Conversational Shopping
          - Dynamic Pricing
          - Agent-to-Agent Transactions
consumers:
