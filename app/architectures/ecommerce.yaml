      - name: Notebooks & IDEs
        icon: notebook
        summary: Analyst notebooks on governed clickstream.
  - name: Channels & Partners
    icon: partner
    tiles:
      - name: Marketplace Listings
        icon: api
        summary: Inventory and price sync to Amazon and eBay.
