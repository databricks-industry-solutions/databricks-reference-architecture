        summary: Published, contracted products discoverable in Unity Catalog Domains and shared over OpenSharing.
      - name: Sharing Recipients
        core: true
        icon: share
        summary: JV partners, regulators and marketers reading live tables with no copy.
  - name: Databricks Apps
    icon: apps
    tiles:
      - name: Production Control
        icon: gauge
        short: Deferment live
        summary: Well uptime, deferment pareto and lift setpoints on Databricks Apps over Lakebase.
      - name: Reservoir Workbench
        icon: network
        short: Depletion view
        summary: Interpreted subsurface, simulation runs and depletion beside actual production.
      - name: Trading Workbench
        icon: market
        short: Netback view
        summary: Physical and paper positions marked to benchmark on one surface.
      - name: HSE Dashboard
        icon: gavel
        short: Emissions live
        summary: Flare, leak and permit exceedances before inspections and board review.
  - name: AI/BI Dashboards
    icon: aibi
    tiles:
      - name: Production & Reliability
        icon: aibi
        summary: Net production, deferment, well uptime and rotating-equipment health on certified operations Metric Views.
        kpis:
          - Net production
          - Deferment volume
          - Well uptime
          - Hydrocarbon loss rate
          - Equipment availability
        teams:
          - Field & Production Operations
          - Corporate & Asset Leaders
          - Reliability Engineer
      - name: Subsurface & Reserves
        icon: aibi
        summary: Depletion, recovery factor, reserves reconciliation and forecast versus actual across the field.
        kpis:
          - Recovery factor
          - Decline rate
          - Reserves replacement
          - Forecast versus actual
          - Water cut
        teams:
          - Subsurface & Reservoir
          - Reservoir Engineer
          - Corporate & Asset Leaders
      - name: Marketing & Margin
        icon: aibi
        summary: Netback, exposure, hedge effectiveness and unit lifting cost across the marketing book.
        kpis:
          - Crude netback
          - Unit lifting cost
          - Exposure vs limit
          - Hedge effectiveness
          - Materials on-time rate
        teams:
          - Commercial & Supply
          - Risk & Middle Office
          - Corporate & Asset Leaders
      - name: HSE & Emissions
        icon: aibi
        summary: Flare and vent volumes, permit compliance, leaks and safety indicators.
        kpis:
          - Flare volume
          - GHG emissions
          - Permit exceedances
          - Open leaks
          - TRIR
        teams:
          - HSE & Compliance
          - Environmental & Emissions
          - Process Safety
  - name: Agent Harnesses
    icon: agents
    tiles:
      - name: Omnigent OSS
        icon: omni
        short: Databricks, open source
        summary: Open-source meta-harness above existing agent frameworks, enabling agent composition, collaboration and centralised governance from one interface.
        capabilities:
          - Build
          - Deploy
          - Optimize
          - Govern
        related:
          - Agent Bricks
          - Unity Gateway
      - name: Claude Code
        core: true
        icon: code
        short: 3rd-party harness
        summary: Anthropic's coding harness working against the platform through MCP, with spend, routing and policy governed by Unity Gateway.
      - name: OpenAI Codex
        core: true
        icon: code
        short: 3rd-party harness
        summary: OpenAI's coding harness connected over MCP, governed at runtime by Unity Gateway rather than trusted by configuration.
      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Production Optimization Agent
        icon: genie
        summary: Ask about net production, deferment, artificial lift and well surveillance across assets in plain language.
        feeds:
          - AVEVA PI System
          - SLB OFM
          - SLB Petrel
          - Emerson Zedi
          - Conformed well, cargo
        teams:
          - Field & Production Operations
          - Subsurface & Reservoir
          - Production Engineer
        questions:
          - What was net production by asset yesterday versus plan?
          - Which wells are deferring the most volume right now, and why?
          - Where does the latest seismic interpretation and reservoir characterisation see the best remaining subsurface potential?
          - Which wells are diverging most from the reservoir simulation forecast?
          - When a well or facility trips, what is the likely cause and the next step from asset history?
          - What is our hydrocarbon loss rate by asset this quarter?
      - name: Asset Reliability Agent
        icon: genie
        summary: Explore rotating-equipment health, predicted failures and maintenance backlog across facilities.
        feeds:
          - AVEVA PI System
          - IBM Maximo
          - Sphera Risk Mgmt
          - Conformed well, cargo
        teams:
          - Field & Production Operations
          - Reliability Engineer
          - Corporate & Asset Leaders
        questions:
          - Which compressors and ESPs are trending toward failure this month?
          - What is the maintenance backlog by facility and asset class?
          - How much deferred production traces back to equipment trips?
          - Which work orders are overdue against their planned window?
      - name: Crude Marketing Agent
        icon: genie
        summary: Answer questions on offtake demand, crude and materials logistics, materials supply and portfolio and capital scenarios.
        feeds:
          - ION Openlink Endur
          - Platts Price Assess
          - SAP IS-Oil
          - SAP Ariba
          - SAP S/4HANA
          - Production, margin, loss
        teams:
          - Commercial & Supply
          - Risk & Middle Office
          - Corporate & Asset Leaders
        questions:
          - How does the portfolio programme re-plan across our latest price and production scenarios?
          - Which development and capital options rank best across our price, cost and production scenarios?
          - What is the forecast offtake demand by crude and gas stream this month?
          - Which crude liftings and field movements are at risk of demurrage or short delivery against the plan?
          - Which materials and long-lead spares are short against planned field work?
      - name: HSE & Emissions Agent
        icon: genie
        summary: Ask about emissions, flare volumes, permits and safety incidents across facilities.
        feeds:
          - Enablon EHS
          - Sphera Risk Mgmt
          - FLIR Optical Gas Img
          - EPA GHGRP Templates
        teams:
          - HSE & Compliance
          - Environmental & Emissions
          - Process Safety
        questions:
          - Which wells and facilities carry the highest regulatory and environmental risk ahead of the next review?
          - Which permits are closest to their limit right now?
          - How many leaks were detected and how many are still open?
          - Is the evidence trail complete for the filings and reviews that are due?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Predictive Maintenance & Asset Health
        short: Rotating equipment health
        icon: gauge
        summary: Compressor, ESP and rotating-equipment failures predicted from sensor drift before production is deferred.
