  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Improper Payments
        short: Payment integrity
        icon: gauge
        summary: Scoring eligibility, identity and payment signals together so high-risk payments are held for review before disbursement, not chased after the money is gone.
        problem: Benefits are optimised to pay quickly, so integrity checks run after the money is out the door and improper payments are chased through pay-and-chase rather than prevented.
        who_benefits: Program Directors
        how_built: Eligibility, claims and payment feeds land in Lakehouse//RT; entity resolution and risk models score each claim in Model Serving so high-risk payments are held for review under applicable agency rules before disbursement, with suspected risk kept distinct from adjudicated determinations.
        components:
          - Improper Payment Radar
          - Lakehouse//RT
          - Model Serving
          - Merative Cúram SPM
          - Unity Catalog
        stories:
          - title: Bringing real-time fraud prevention to government benefits
            url: https://www.databricks.com/blog/bringing-real-time-fraud-prevention-government-benefits
          - title: Operationalizing AI for public sector fraud prevention
            url: https://www.databricks.com/blog/operationalizing-ai-public-sector-fraud-prevention
      - name: Constituent 360
        short: Whole-person view
        icon: custlake
        summary: Resolving a resident's records across benefits, tax, permitting and 311 into one governed profile so caseworkers and services see the whole person.
        problem: A resident's records are scattered across benefits, tax, permitting and 311 systems, so no caseworker or service ever sees the whole person.
        who_benefits: Constituent Services
        how_built: Records from the case, benefits and 311 systems are conformed and resolved in CustomerLake, giving caseworkers one governed profile per constituent.
        components:
          - Constituent 360 Hub
          - CustomerLake
          - Salesforce Pub Sector
          - SeeClickFix 311
          - Unity Catalog
        stories:
          - title: State of Washington builds data-driven government
            url: https://www.databricks.com/customers/state-of-washington
          - title: GovTech Singapore unlocks nationwide data insights
            url: https://www.databricks.com/customers/govtech
      - name: Program Outcomes
        short: Evidence & impact
        icon: chart
        summary: Linking service records to downstream results across agency silos so programs are judged on outcomes for residents, not activity counts.
        problem: Programs report activity, not outcomes, because linking service records to downstream results means crossing agency silos that rarely share data.
        who_benefits: Program Directors
        how_built: Cross-agency records are linked under Unity Catalog and shared via OpenSharing; outcome cohorts are built in AI/BI on certified Metric Views.
        components:
          - Program Outcome Studio
          - AI/BI
          - Unity Catalog
          - OpenSharing
          - Genie One
        stories:
          - title: DC OCTO links education and workforce data for outcomes
            url: https://www.databricks.com/customers/dc-octo
      - name: Tax Compliance & Audit
        short: Revenue integrity
        icon: market
        summary: Targeting audit effort at the highest-risk returns with anomaly models rather than fixed rules, so underreporting and refund fraud are caught before refunds are paid.
        problem: Underreporting and refund fraud slip through fixed rules, and auditors work returns after refunds are already paid out.
        who_benefits: Budget & Finance
        how_built: Filing, payment and third-party data are conformed in the lakehouse; anomaly models score returns in Model Serving so audit effort targets the highest-risk cases.
        components:
          - FAST GenTax
          - Model Serving
          - AI/BI
          - MLflow
          - Unity Catalog
        stories:
          - title: Operationalizing AI for public sector fraud prevention
            url: https://www.databricks.com/blog/operationalizing-ai-public-sector-fraud-prevention
      - name: Permit & Licensing
        short: Throughput
        icon: stream
        summary: Making the permit and licence backlog visible across departments so reviews are re-sequenced and cycle time falls before deadlines are missed.
        problem: Permit and licence applications stall between departments with no visibility into where the backlog sits or which reviews are late.
        who_benefits: Constituent Services
        how_built: Accela and EnerGov application events stream into Lakehouse//RT; cycle-time and bottleneck analytics surface in AI/BI so reviews are re-sequenced before deadlines slip.
        components:
          - Permit Throughput
          - Accela Civic Platform
          - Tyler EnerGov
          - Lakehouse//RT
          - AI/BI
        stories:
          - title: Data governance and AI drive better living in Amsterdam
            url: https://www.databricks.com/customers/gemeente-amsterdam
      - name: Open Data Platform
        short: Transparency
        icon: globe
        summary: Publishing certified open data and answering the public from the governed source, so governed refreshes reduce portal drift from the numbers the agency runs on.
        problem: Publishing open data means hand-built extracts that go stale, and the public portal drifts from the governed source it was copied from.
        who_benefits: Chief Data Officer
        how_built: Curated Gold tables are published as data products and served to the portal and to residents through Genie and OpenSharing, governed by Unity Catalog.
        components:
          - Socrata Open Data
          - Data Products
          - Genie One
          - Unity Catalog
          - OpenSharing
        stories:
          - title: How World Bank Group uses Databricks to share knowledge
            url: https://www.databricks.com/blog/how-world-bank-group-uses-databricks-eradicate-poverty-through-shared-knowledge
      - name: Workforce Analytics
        short: Hiring & people
        icon: people
        summary: Making the hiring pipeline visible end to end so leadership sees where candidates stall and vacancies that put services at risk.
        problem: Hiring drags for months and leadership cannot see where in the pipeline candidates stall or which vacancies put services at risk.
        who_benefits: Agency Leadership
        how_built: Workday and applicant-tracking data are unified and analysed in AI/BI so hiring bottlenecks and vacancy risk are visible by department.
        components:
          - Workday HCM
          - AI/BI
          - Genie One
          - Unity Catalog
        stories:
          - title: LA County modernises hiring with Databricks
            url: https://www.databricks.com/customers/la-county
      - name: Emergency Response
        short: Live common picture
        icon: gauge
        summary: Building a live common operating picture from sensor, GIS and operational feeds so responders act on current ground truth rather than a hand-stitched view.
        problem: In a disaster the operational picture is stitched together by hand from feeds that arrive too late to act on.
        who_benefits: Agency Leadership
        how_built: Sensor, GIS and operational feeds stream into Lakehouse//RT and are mapped against Esri layers so responders act on a live common picture.
        components:
          - Lakehouse//RT
          - Esri ArcGIS
          - Model Serving
          - AI/BI
          - Lakeflow
        stories:
          - title: U.S. Department of Transportation delivers real-time insight
            url: https://www.databricks.com/customers/us-department-of-transportation
      - name: Grants Management
        short: Awards & compliance
        icon: docs
        summary: Centralising grant, subrecipient and spend data so compliance reporting is automated and anomalies surface before closeout, not after.
        problem: Grant, subrecipient and spend data live in spreadsheets, so compliance reporting is slow and anomalies surface late in the award cycle.
        who_benefits: Budget & Finance
        how_built: Grant, finance and performance data are centralised in the lakehouse; AmpliFund and finance feeds are conformed for automated compliance reporting and anomaly alerts.
        components:
          - AmpliFund Grants
          - AI/BI
          - Unity Catalog
          - Lakeflow
          - Genie One
        stories:
          - title: Data and AI solutions for federal government
            url: https://www.databricks.com/solutions/industries/federal-government
      - name: Digital Services
        short: Self-service delivery
        icon: apps
        summary: Building constituent-facing services on governed data so residents complete online what used to need a counter visit, with plain-language help.
        problem: Residents drop out of online services that are slow, fragmented and disconnected from the data behind them.
        who_benefits: Constituent Services
        how_built: Constituent-facing services are built as Databricks Apps over Lakebase next to governed data, using a permission-scoped resident view of Constituent 360 Hub separate from the caseworker workspace, with Genie answering resident questions in plain language.
        components:
          - Constituent 360 Hub
          - Apps
          - Lakebase
          - Genie One
          - ServiceNow Gov
        stories:
          - title: GovTech Singapore improves nationwide services
            url: https://www.databricks.com/customers/govtech
          - title: Reinventing government with the Databricks platform
            url: https://www.databricks.com/blog/reinventing-government-databricks-data-intelligence-platform
medallion:
  Bronze:
    short: Raw agency system feeds
    summary: Eligibility determinations, tax filings, permit applications, case notes and GIS parcels landed exactly as received from the systems of record, so a determination or a filing can always be replayed as it stood for audit and appeal.
  Silver:
    short: Conformed constituent, case, parcel
    summary: Constituents, cases, parcels and programs resolved into single conformed entities across the eligibility, tax, permitting and case estates, with identifiers reconciled and duplicate records matched across agencies under one governance model.
  Gold:
    short: Outcomes, integrity, service metrics
    summary: 'Contracted products the program and finance teams run on: improper-payment rate and program outcomes by cohort, permit cycle time, tax compliance yield, and constituent service level by channel.'
