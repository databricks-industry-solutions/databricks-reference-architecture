medallion:
  Bronze:
    short: Raw field and market
    summary: SCADA and historian tags, nomination and allocation records, in-line inspection runs and deal capture tickets, landed exactly as received so a flow or a pressure reading can always be replayed as it stood.
  Silver:
    short: Conformed segment, cargo
    summary: Segments, stations, meters and cargoes resolved into single conformed entities across control, integrity and commercial systems, with allocation balances reconciled and nomination schedules stitched to one logistics record.
  Gold:
    short: Throughput, margin, loss
    summary: 'Contracted products operations and commercial run on: throughput and utilisation, capacity revenue and working capital, integrity risk and hydrocarbon loss rates.'
