name: Oil & Gas Midstream
description: 'Midstream pipeline and storage operators: pipeline integrity and in-line inspection, compressor and pump-station reliability, linepack and throughput control, nominations and scheduling, capacity marketing and regulatory reporting across gathering, transmission and storage.'
sources:
  - name: Pipeline SCADA & DataOps
    icon: iot
    tiles:
      - name: AVEVA PI System
        icon: iot
        summary: Line pressures, flow rates and compressor-station tags from the pipeline historian.
        citations:
          - aveva-pi
        category: Process / Time-Series Historian
        what_it_is: Stores high-frequency line pressure, flow and compressor and pump-station tags across the pipeline network as the operational time-series system of record.
        who_uses_it: Pipeline controllers, reliability engineers and integrity teams.
        data_out:
          batch:
            types:
              - structured
            volume: 20-80 GB/day tag history
            interval: Hourly / daily aggregates
          stream:
            types:
              - semi-structured
            volume: 50-500k tags/sec at peak
            interval: Continuous (sub-second sampling)
      - name: Emerson Ovation
        core: true
        icon: gauge
        summary: Control-room setpoints, station sequences and alarms from the pipeline control system.
        citations:
          - emerson-ovation
        category: SCADA / Pipeline Control System
        what_it_is: Runs the pipeline and station control system in real time and emits the setpoints, station sequences and alarms that describe how the network is operating.
        who_uses_it: Pipeline controllers, control-room operators and station engineers.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 10-100k signals/sec
            interval: Continuous (sub-second)
      - name: Cognite Data Fusion
        icon: stream
        summary: Contextualised equipment, sensor and document data unified across stations and assets.
        citations:
          - cognite
        category: Industrial DataOps Platform
        what_it_is: Contextualises equipment, sensor, maintenance and document data into a unified industrial model across pipeline stations and assets.
        who_uses_it: Reliability engineers, integrity teams and Industrial DataOps.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 5-30 GB/day contextualised
            interval: Continuous + periodic model updates
      - name: Dragos Platform
        icon: observ
        summary: OT and ICS threat detection across pipeline SCADA, controllers and station networks.
        citations:
          - dragos
        category: OT/ICS Cybersecurity Platform
        what_it_is: Monitors pipeline SCADA, controllers and station networks for OT and ICS threats, emitting asset inventory, vulnerability and threat-detection telemetry for the security operations team.
        who_uses_it: OT security, SOC analysts and controls engineers.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 100s-1000s of events/sec
            interval: Continuous threat telemetry
  - name: Commercial & Scheduling
    icon: market
    tiles:
      - name: Quorum PGAS
        icon: erp
        summary: Pipeline nominations, allocations and imbalance statements.
        citations:
          - quorum-pgas
        category: Pipeline Nomination & Allocation System
        what_it_is: Manages pipeline nominations, scheduling, allocations and imbalance statements across gathering and transmission systems.
        who_uses_it: Pipeline schedulers, gas controllers and commercial operations.
        data_out:
          batch:
            types:
              - structured
            volume: 1-4 GB/day
            interval: Multiple nomination cycles daily
      - name: ION Openlink Endur
        icon: market
        summary: Transport and capacity deals, hedges and mark-to-market for the commercial desk.
        citations:
          - ion-endur
        category: Energy Trading & Risk Management (ETRM)
        what_it_is: Captures transport, capacity and storage deals, hedges and mark-to-market for the commercial and risk desks.
        who_uses_it: Capacity marketers, middle office and risk teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day deals + positions
            interval: Intraday + end-of-day marks
      - name: Platts Price Assess
        icon: chart
        summary: Benchmark curves, basis and transport differentials the commercial desk marks to.
        citations:
          - platts
        category: Commodity Price Benchmark Provider
        what_it_is: Supplies benchmark price assessments, basis and transport differentials the commercial and risk desks mark capacity and storage positions to.
        who_uses_it: Capacity marketing, supply analysts and risk teams.
        data_out:
          batch:
            types:
              - structured
            volume: MBs-GBs reference data
            interval: Daily assessment publication
  - name: Integrity & GIS
    icon: globe
    tiles:
      - name: ROSEN ILI
        icon: observ
        summary: In-line inspection runs, metal-loss features and dig verification for the integrity program.
        citations:
          - rosen
        category: In-Line Inspection (ILI) Provider
        what_it_is: Delivers in-line inspection runs, metal-loss and crack features and dig-verification results the pipeline integrity program manages risk from.
        who_uses_it: Integrity engineers, corrosion specialists and reliability teams.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: 10s-100s of GB per run
            interval: Per-inspection (periodic runs)
      - name: Esri ArcGIS
        core: true
        icon: globe
        summary: Pipeline centrelines, class locations, HCAs and right-of-way layers on a spatial system of record.
        citations:
          - esri-arcgis
        category: Geographic Information System (GIS)
        what_it_is: Maintains pipeline centrelines, class locations, high-consequence areas and right-of-way layers as the operator spatial system of record.
        who_uses_it: Integrity, land and field operations teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: GBs of spatial layers
            interval: On change + periodic refresh
  - name: Enterprise & Assets
    icon: erp
    tiles:
      - name: SAP S/4HANA
        icon: erp
        summary: Finance postings, materials master and cost objects for the pipeline organisation.
        citations:
          - sap-s4
        category: Enterprise Resource Planning (ERP)
        what_it_is: Runs finance postings, the materials master, cost objects and purchasing the back office and operations transact on.
        who_uses_it: Finance, materials management and cost controllers.
        data_out:
          batch:
            types:
              - structured
            volume: 10-50 GB/day
            interval: Nightly batch + hourly deltas
      - name: IBM Maximo
        core: true
        icon: gauge
        summary: Asset registers, work orders and maintenance history for stations, valves and rotating equipment.
        citations:
          - ibm-maximo
        category: Enterprise Asset Management (EAM)
        what_it_is: Manages asset registers, preventive and corrective work orders and maintenance history for compressor and pump stations, valves and rotating equipment.
        who_uses_it: Maintenance planners, reliability engineers and station operations.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day work orders
            interval: Hourly / event-driven
      - name: SAP Ariba
        icon: sheet
        summary: Requisitions, supplier catalogues and materials sourcing for station and field work.
        citations:
          - sap-ariba
        category: Procurement & Supply Management
        what_it_is: Handles requisitions, supplier catalogues, sourcing events and materials commitments that keep station and field work supplied.
        who_uses_it: Procurement, materials planning and supply chain teams.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-2 GB/day
            interval: Continuous + nightly batch
  - name: Safety & Environment
    icon: gavel
    tiles:
      - name: Sphera Risk Mgmt
        icon: gavel
        summary: Process safety, management-of-change and incident investigations tied to stations and pipelines.
        citations:
          - sphera
        category: Process Safety & Operational Risk Platform
        what_it_is: Manages process safety, management-of-change and incident investigations tied to stations, pipelines and barriers.
        who_uses_it: Process safety, HSE and integrity engineers.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 0.5-2 GB/day cases + events
            interval: Hourly / daily
      - name: Enablon EHS
        icon: observ
        summary: Emissions events, blowdown logs and regulatory permit limits.
        citations:
          - enablon
        category: EHS & Emissions Management System
        what_it_is: Records emissions events, blowdown and vent logs and regulatory permit limits for environmental compliance.
        who_uses_it: Environmental and emissions teams and Regulatory compliance.
        data_out:
          batch:
            types:
              - structured
            volume: 1-4 GB/day events + logs
            interval: Hourly / daily
      - name: FLIR Optical Gas Img
        icon: iot
        summary: Leak detection surveys and repair verification imagery along the right-of-way and at stations.
        category: Optical Gas Imaging / Leak Detection
        what_it_is: Produces optical-gas imaging surveys and repair-verification imagery used to detect and confirm fugitive hydrocarbon leaks along the right-of-way and at stations.
        who_uses_it: LDAR survey crews, integrity and environmental teams.
        data_out:
          batch:
            types:
              - unstructured
            volume: 10s-100s of GB/survey
            interval: Per-survey (periodic campaigns)
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Corporate Treasury Mart
        icon: fed
        summary: Hedge effectiveness and working-capital marts queried in place under Unity Catalog.
        category: Enterprise Data Warehouse
        what_it_is: Corporate treasury hedge-effectiveness and working-capital marts kept in the incumbent warehouse and queried in place through federation rather than copied.
        who_uses_it: Treasury, Finance and Risk analysts.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale historical marts
            interval: Queried on demand (federated)
  - name: Data Formats
    icon: zbraces
    tiles:
      - name: 'PODS'
        icon: zbraces
        fmt: 'PODS'
        summary: 'Pipeline Open Data Standard model for pipeline integrity and asset data.'
        spec_url: https://pods.org/
      - name: 'NAESB Nominations'
        core: true
        icon: zbraces
        fmt: 'NAESB'
        summary: 'NAESB standards for natural-gas nominations, scheduling and capacity.'
        spec_url: https://www.naesb.org/
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    simplified: 2
    tiles:
      - name: OPC-UA Pipeline Gateway
        icon: iot
        summary: Field protocol bridges normalising RTU and PLC station telemetry on ingest before historian landing.
        citations:
          - opc-ua
        category: OT Protocol Gateway
        what_it_is: Bridges field OPC-UA, RTU and PLC protocols and normalises station and valve telemetry on ingest before historian landing.
        who_uses_it: Controls engineers, OT/IT integration and Streaming data engineers.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 5-50k tags/sec
            interval: Continuous OT telemetry
      - name: EPA GHGRP Templates
        icon: gavel
        summary: Greenhouse gas reporting layouts validated on ingest before filing windows.
        citations:
          - epa-ghgrp
        category: Regulatory Reporting Schema
        what_it_is: Greenhouse-gas reporting layouts and factors validated on ingest so emissions data conforms before filing windows.
        who_uses_it: Environmental reporting and Regulatory compliance teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: MBs (templates + factors)
            interval: Annual + periodic updates
      - name: Weather & Metocean Data
        icon: stream
        summary: Storm, flood and temperature feeds for right-of-way risk and demand forecasting.
        category: Weather & Metocean Provider
        what_it_is: Storm, flood and temperature forecasts used to anticipate right-of-way risk, throughput demand and cold-weather station load.
        who_uses_it: Integrity, control-room and commercial teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: GBs/day gridded forecasts
            interval: Multiple forecast cycles daily
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Corporate & Network Leaders
        mark: Genie One
        summary: The CEO on throughput and utilisation; the CFO on capacity revenue and working capital when basis and transport differentials move.
        uses:
          - - Genie One
            - Ask what yesterday throughput and utilisation were by system without waiting on operations reporting.
          - - AI/BI
            - Throughput, revenue and utilisation on one certified set of Metric Views.
          - - Unity Catalog
            - Certification so throughput means one thing across SCADA and accounting.
        sub:
          - name: CEO
            cares: throughput, network utilisation and the growth and energy-transition case.
          - name: CFO & Treasury
            cares: capacity revenue, working capital and cash flow across the network.
          - name: Chief Operating Officer
            cares: uptime, integrity risk and the HSE and compliance record across the system.
        ucs:
          - Production Monitoring
          - Commodity & Energy Trading
          - Cyber Threat Monitoring & Detection
      - name: Pipeline Control & Operations
        mark: Lakehouse//RT
        summary: Controllers on linepack, nominations and station load when schedules slip, protecting throughput and hydrocarbon loss rate.
        uses:
          - - Control Room
            - Linepack and nomination positions before gate close.
          - - Lakehouse//RT
            - Live SCADA state at the latency an upset occurs at.
          - - AI/BI
            - Throughput and loss on governed definitions.
        sub:
          - name: Pipeline Controller
            cares: linepack, nominations and imbalance before gate close.
          - name: Station Operations
            cares: compressor and pump load and the setpoints that hold the schedule.
          - name: Gas Control
            cares: system balance and the response when a delivery point swings.
        ucs:
          - Production Monitoring
          - Distribution & Logistics Optimization
          - Predictive Maintenance & Asset Health
      - name: Integrity & Reliability
        core: true
        mark: AI/BI
        summary: Integrity and reliability engineers on metal loss, corrosion rate and station health, prioritising digs and work before a threat becomes a leak.
        uses:
          - - Integrity Console
            - In-line inspection features and corrosion rate beside historian data.
          - - AI/BI
            - Integrity risk and reliability on governed definitions.
          - - Genie One
            - Ask which segments are closest to their next assessment interval.
        sub:
          - name: Integrity Engineer
            cares: metal loss, corrosion rate and the assessment intervals on the system.
          - name: Reliability Engineer
            cares: compressor and pump health and the failures that curtail throughput.
          - name: Corrosion Specialist
            cares: coupon and inspection data reconciled to the actual corrosion picture.
        ucs:
          - Prescriptive Maintenance
          - Predictive Maintenance & Asset Health
      - name: Commercial & Scheduling
        mark: Model Serving
        summary: Capacity marketing and scheduling on transport deals, exposure and network plans, marking positions to basis and transport differentials.
        uses:
          - - Trading Workbench
            - Transport and capacity positions marked consistently.
          - - Model Serving
            - Optimisation and scenario models scored on live nominations.
          - - Unity Catalog
            - One capacity definition across ops and finance.
        sub:
          - name: Capacity Marketing
            cares: transport and storage deals marked to basis and transport differentials.
          - name: Scheduler
            cares: nominations, cuts and confirmations across the scheduling cycle.
          - name: Risk & Middle Office
            cares: exposure limits, mark-to-market and hedge effectiveness across the book.
        ucs:
          - Commodity & Energy Trading
          - Distribution & Logistics Optimization
      - name: HSE & Compliance
        mark: Unity Catalog
        summary: Process safety and environmental teams on emissions, permits and incident trends, tracked on TRIR and blowdown volumes before regulator inspections.
        uses:
          - - HSE Dashboard
            - Blowdown and leak trends before regulator inspections.
          - - Unity Catalog
            - Lineage from sensor to regulatory filing.
          - - AI/BI
            - TRIR and emissions on governed definitions.
        sub:
          - name: Process Safety
            cares: management-of-change, incident trends and the barriers behind a safe envelope.
          - name: Environmental & Emissions
            cares: blowdown, vent and greenhouse filings from governed sensor lineage.
          - name: Regulatory Compliance
            cares: permit limits and the evidence trail before regulator inspections.
        ucs:
          - Workforce Safety
          - Regulation Compliance, & External Reporting
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land the SCADA, nomination, in-line inspection and deal-capture feeds; own the Bronze to Silver path and the pager when a network pipeline breaks.
        uses:
          - - Lakeflow Connect
            - Managed connectors for historian, ETRM and accounting sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on SCADA and allocation feeds.
          - - Lakewatch
            - Freshness on the throughput and integrity tables operations reads.
        sub:
          - name: Historian & SCADA Eng
            cares: high-volume tag ingestion from PI and pipeline SCADA into governed tables.
          - name: Pipeline Reliability
            cares: the Bronze to Silver path and the pager when a network feed breaks.
          - name: Integrity & Accounting Eng
            cares: in-line inspection, allocation and imbalance feeds landed for integrity and finance.
        ucs:
          - Production Monitoring
          - Prescriptive Maintenance
          - Regulation Compliance, & External Reporting
      - name: Data Scientists
        mark: MLflow
        summary: Corrosion-rate, station-failure, throughput and scenario models, and whether they still hold six months after deployment across the network.
        uses:
          - - Feature Store
            - Historian and inspection features read identically in training and serving.
          - - MLflow
            - Every corrosion and failure run tracked for audit and reproduction.
          - - Model Serving
            - Optimisation and failure models scored in the operational path.
        sub:
          - name: Integrity DS
            cares: corrosion-rate and remaining-life models against inspection and historian data.
          - name: Reliability DS
            cares: compressor and pump-failure models and whether they still hold.
          - name: Optimisation DS
            cares: throughput, linepack and scenario models across live nominations.
        ucs:
          - Predictive Maintenance & Asset Health
          - Prescriptive Maintenance
      - name: App Developers
        mark: Apps
        summary: Ship the control-room, scheduling and integrity applications control and desk teams work in, hosted next to governed network data.
        uses:
          - - Apps
            - Operational screens with no separate web tier to run or secure.
          - - Lakebase
            - Serverless Postgres for nomination and work-order state and governed writes.
          - - Agent Bricks
            - Agents that draft an incident response against governed tools.
        sub:
          - name: Operations App Dev
            cares: control-room and scheduling screens control teams work in.
          - name: Commercial App Dev
            cares: the exposure and capacity surfaces the commercial desk marks books on.
          - name: Writeback & Integration
            cares: nomination and setpoint writeback into SCADA and pipeline systems.
        ucs:
          - Distribution & Logistics Optimization
          - Commodity & Energy Trading
consumers:
  - name: BI & Productivity
    icon: chart
    from: bi
    tiles:
      - name: Tableau / Qlik / ThoughtSpot
        icon: chart
        summary: External BI against SQL warehouses, with Unity Catalog permissions enforced end to end.
      - name: Microsoft Teams
        icon: chat
        summary: Genie in Teams for governed answers and control-room updates in the channel operations already works in.
      - name: Notebooks & IDEs
        icon: notebook
        summary: Notebooks, VS Code and JetBrains against governed data and Genie Code.
  - name: Operations Writeback
    icon: opdb
    tiles:
      - name: SCADA Setpoint Push
        icon: stream
        summary: Approved station and pressure targets written back within safe envelopes.
        citations:
          - emerson-ovation
      - name: Maximo Work Orders
        core: true
        icon: erp
        summary: Maintenance and dig work orders raised from predicted integrity and equipment risk.
        citations:
          - ibm-maximo
      - name: Nomination Updates
        icon: erp
        summary: Revised nominations and confirmations posted before gate close.
        citations:
          - quorum-pgas
  - name: Customers & Partners
    icon: partner
    tiles:
      - name: Shipper Portal
        icon: api
        summary: Nominations, confirmations and imbalance statements served to shippers from governed lineage.
        citations:
          - quorum-pgas
      - name: Interconnect Feed
        core: true
        icon: globe
        summary: Delivery and receipt positions exchanged with connecting pipelines without spreadsheet reconciliation.
        citations:
