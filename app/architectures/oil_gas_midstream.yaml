  - name: Published Products
    icon: product
    tiles:
      - name: Data Products
        icon: product
        summary: Published, contracted products discoverable in Unity Catalog Domains and shared over OpenSharing.
      - name: Sharing Recipients
        core: true
        icon: share
        summary: Shippers, regulators and connecting pipelines reading live tables with no copy.
  - name: Databricks Apps
    icon: apps
    simplified: 2
    tiles:
      - name: Control Room
        icon: gauge
        short: Linepack live
        summary: Linepack, nominations and station load plus incident triage, scenario and security-investigation views on Databricks Apps over Lakebase.
      - name: Integrity Console
        icon: network
        short: Metal loss view
        summary: In-line inspection features, corrosion rate and dig priority on one surface.
      - name: Trading Workbench
        icon: market
        short: Capacity view
        summary: Transport and capacity positions marked to benchmark on one surface.
      - name: HSE Dashboard
        icon: gavel
        short: Emissions live
        summary: Blowdown, leak and permit exceedances before inspections and board review.
  - name: AI/BI Dashboards
    icon: aibi
    tiles:
      - name: Throughput & Linepack
        icon: aibi
        summary: Throughput, linepack, imbalance and utilisation across the network on certified operations Metric Views.
        kpis:
          - Throughput
          - Linepack
          - Pipeline imbalance
          - Network utilisation
          - Hydrocarbon loss rate
        teams:
          - Pipeline Control & Operations
          - Corporate & Network Leaders
          - Gas Control
      - name: Integrity & Reliability
        icon: aibi
        summary: Metal loss, corrosion rate, station health and predicted failures across the system.
        kpis:
          - Metal-loss features
          - Corrosion rate
          - Assessment compliance
          - Station availability
          - Predicted failures
        teams:
          - Integrity & Reliability
          - Integrity Engineer
          - Reliability Engineer
      - name: Capacity & Margin
        icon: aibi
        summary: Capacity revenue, exposure, hedge effectiveness and working capital across the commercial book.
        kpis:
          - Capacity revenue
          - Exposure vs limit
          - Hedge effectiveness
          - Working capital
          - Nomination fill rate
        teams:
          - Commercial & Scheduling
          - Risk & Middle Office
          - Corporate & Network Leaders
      - name: HSE & Emissions
        icon: aibi
        summary: Blowdown and vent volumes, permit compliance, leaks and safety indicators.
        kpis:
          - Blowdown volume
          - GHG emissions
          - Permit exceedances
          - Open leaks
          - TRIR
        teams:
          - HSE & Compliance
          - Environmental & Emissions
          - Process Safety
  - name: Agent Harnesses
    icon: agents
    tiles:
      - name: Omnigent OSS
        icon: omni
        short: Databricks, open source
        summary: Open-source meta-harness above existing agent frameworks, enabling agent composition, collaboration and centralised governance from one interface.
        capabilities:
          - Build
          - Deploy
          - Optimize
          - Govern
        related:
          - Agent Bricks
          - Unity Gateway
      - name: Claude Code
        core: true
        icon: code
        short: 3rd-party harness
        summary: Anthropic's coding harness working against the platform through MCP, with spend, routing and policy governed by Unity Gateway.
      - name: OpenAI Codex
        core: true
        icon: code
        short: 3rd-party harness
        summary: OpenAI's coding harness connected over MCP, governed at runtime by Unity Gateway rather than trusted by configuration.
      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Pipeline Integrity Agent
        icon: genie
        summary: Ask about metal loss, corrosion rate, station health and predicted failures across the network in plain language.
        feeds:
          - ROSEN ILI
          - AVEVA PI System
          - IBM Maximo
          - Conformed segment, cargo
        teams:
          - Integrity & Reliability
          - Integrity Engineer
          - Reliability Engineer
        questions:
          - Which segments are closest to their next assessment interval?
          - Where are metal-loss features growing fastest against last run?
          - Which compressors and pumps are trending toward failure this month?
          - How much throughput is at risk from the current integrity threats?
          - Which digs should we prioritise this quarter, and why?
      - name: Network Operations Agent
        icon: genie
        summary: Explore linepack, throughput, nominations, fuel-gas efficiency and OT-security signals across the pipeline network.
        feeds:
          - Quorum PGAS
          - Emerson Ovation
          - Cognite Data Fusion
          - Dragos Platform
          - Conformed segment, cargo
        teams:
          - Pipeline Control & Operations
          - Commercial & Scheduling
          - Gas Control
        questions:
          - Which segments are running the largest imbalances today?
          - How does linepack compare to nominations across the system?
          - Which delivery points are constraining throughput this week?
          - Where is compressor fuel gas per unit of throughput drifting highest?
          - Which pipeline SCADA or control-system anomalies need OT-security investigation now?
      - name: Capacity Trading Agent
        icon: genie
        summary: Answer questions on capacity positions, exposure, hedge effectiveness and working capital.
        feeds:
          - ION Openlink Endur
          - Platts Price Assess
          - SAP S/4HANA
          - Throughput, margin, loss
        teams:
          - Commercial & Scheduling
          - Risk & Middle Office
          - Corporate & Network Leaders
        questions:
          - What is our capacity revenue by system today?
          - Which desks are closest to their exposure limits right now?
          - How effective are our current hedges against basis moves?
          - What is our working-capital position across the network this month?
          - Which contracts are up for renewal against current basis?
      - name: Safety & Compliance Agent
        icon: genie
        summary: Ask about workforce safety, emissions, blowdown volumes, permits and regulatory risk across the system.
        feeds:
          - Enablon EHS
          - Sphera Risk Mgmt
          - FLIR Optical Gas Img
          - EPA GHGRP Templates
        teams:
          - HSE & Compliance
          - Environmental & Emissions
          - Process Safety
        questions:
          - What are our blowdown and vent volumes by station this month?
          - Which permits are closest to their limit right now?
          - How many leaks were detected and how many are still open?
          - What is our TRIR trend across the network this year?
          - Which segments carry the highest regulatory and integrity risk ahead of the next review?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Predictive Maintenance & Asset Health
        short: Compressor & pump health
        icon: gauge
        summary: Compressor and pump-station failures predicted from sensor drift before throughput is curtailed.
