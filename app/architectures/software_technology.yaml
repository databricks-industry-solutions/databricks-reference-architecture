medallion:
  Bronze:
    short: Raw product and billing events
    summary: Product telemetry from the CDP and behavioural stack, Stripe and Zuora billing and metering records, CRM opportunities, support tickets and Git and CI events, landed exactly as received so a usage spike or an invoice can always be replayed as it stood.
  Silver:
    short: Conformed account, user, subscription
    summary: Accounts, users, subscriptions and product entities resolved into single conformed entities across the CRM, billing and telemetry estates, with anonymous device ids stitched to known users and free and paid workspaces reconciled to one customer hierarchy.
  Gold:
    short: NRR, activation, health, margin
    summary: 'Contracted products the revenue and product teams run on: net revenue retention and churn by cohort, PLG activation and conversion funnels, customer health scores, usage-based revenue and metering accuracy, and cloud cost of goods and gross margin by product.'
