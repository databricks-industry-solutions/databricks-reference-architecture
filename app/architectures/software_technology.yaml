        what_it_is: Repositories, pipelines and merge requests where the delivery motion runs on a single DevOps platform.
        who_uses_it: Engineering and platform teams.
        data_out:
          batch:
            types:
              - semi-structured
            volume: 0.2-1 GB/day
            interval: Daily + webhook
      - name: Jira Software
        core: true
        icon: sheet
        summary: Issues, sprints and cycle time, the planning system of record joined to delivery and incident data.
        citations:
          - jira
        category: Project / Issue Tracking
        what_it_is: Issues, sprints and cycle time, the planning system of record joined to delivery and incident data.
        who_uses_it: Engineering, product and program management.
        data_out:
          batch:
            types:
