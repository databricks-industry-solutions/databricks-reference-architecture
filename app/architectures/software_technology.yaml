        category: Incident Management / On-Call
        what_it_is: Incidents, on-call and escalation events, the source of reliability and mean-time-to-resolve measurement.
        who_uses_it: SRE, platform engineering and on-call teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: tens of events/sec
            interval: Continuous (webhook)
  - name: Support & Back Office
    icon: chat
    tiles:
      - name: Zendesk Support
        icon: chat
        summary: Support tickets, CSAT and macros, a leading signal for churn risk and the corpus behind support deflection.
        citations:
          - zendesk
        category: Customer Support / Ticketing
        what_it_is: Support tickets, CSAT and macros, a leading signal for churn risk and the corpus behind support deflection.
        who_uses_it: Support, customer success and product teams.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: 0.5-2 GB/day
            interval: Hourly
          stream:
            types:
              - semi-structured
            volume: tens of events/sec
            interval: Continuous (webhook)
      - name: Intercom
        icon: dial
        summary: In-product messaging, conversations and resolution data across the onboarding and support journey.
        citations:
          - intercom
        category: In-Product Messaging / Support
        what_it_is: In-product messaging, conversations and resolution data across the onboarding and support journey.
        who_uses_it: Support, growth and lifecycle teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 100s of events/sec
