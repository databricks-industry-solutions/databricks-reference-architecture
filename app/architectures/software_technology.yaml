      - name: Outreach Engagement
        icon: market
        summary: Sales sequences, activity and reply data feeding rep productivity and pipeline-generation analysis.
        citations:
          - outreach
        category: Sales Engagement Platform
        what_it_is: Sales sequences, activity and reply data feeding rep productivity and pipeline-generation analysis.
        who_uses_it: Sales development, RevOps and Enablement.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-2 GB/day
            interval: Hourly
  - name: Billing & Metering
    icon: market
    simplified: 2
    tiles:
      - name: Stripe Billing
        icon: market
        summary: Subscriptions, invoices, usage records and payment events, the source of MRR, ARR and collected revenue.
        citations:
          - stripe
        category: Subscription Billing & Payments
        what_it_is: Subscriptions, invoices, usage records and payment events, the source of MRR, ARR and collected revenue.
        who_uses_it: Finance, RevOps and billing teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Daily billing runs
          stream:
            types:
              - semi-structured
            volume: 100s of events/sec
            interval: Continuous (webhook)
      - name: Zuora Billing
        icon: erp
        summary: Recurring and usage-based billing, rating and revenue schedules for the enterprise subscription estate.
        citations:
          - zuora
        category: Recurring / Usage-Based Billing
        what_it_is: Recurring and usage-based billing, rating and revenue schedules for the enterprise subscription estate.
        who_uses_it: Finance, revenue accounting and RevOps.
        data_out:
          batch:
            types:
              - structured
            volume: 1-3 GB/day
