name: Software & Technology
description: 'B2B and SaaS software: product-led activation and conversion, usage-based billing and metering, customer health and churn, developer velocity, and cloud cost and margin.'
sources:
  - name: CRM & Sales
    icon: crm
    simplified: 3
    tiles:
      - name: Salesforce Sales Cloud
        icon: crm
        summary: The system of record for accounts, opportunities and the pipeline, and the source of the customer hierarchy every revenue metric rolls up to.
        citations:
          - salesforce
        category: CRM / Sales Force Automation
        what_it_is: System of record for accounts, opportunities and pipeline, and the customer hierarchy every revenue metric rolls up to.
        who_uses_it: Sales, RevOps and Finance teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Hourly / nightly sync
          stream:
            types:
              - semi-structured
            volume: tens of events/sec
            interval: Continuous CDC
      - name: HubSpot CRM
        icon: custlake
        summary: Contacts, deals and marketing engagement for the self-serve and mid-market motion, joined to product signups.
        citations:
          - hubspot
        category: CRM / Marketing Automation
        what_it_is: Contacts, deals and marketing engagement for the self-serve and mid-market motion, joined to product signups.
        who_uses_it: Marketing, self-serve sales and RevOps.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-2 GB/day
            interval: Hourly sync
          stream:
            types:
              - semi-structured
            volume: tens of events/sec
            interval: Continuous (webhook)
      - name: Gong Revenue AI
        icon: dial
        summary: Conversation intelligence on sales and renewal calls, the signal for deal risk and competitive mentions.
        citations:
          - gong
        category: Conversation Intelligence
        what_it_is: Records and analyzes sales and renewal calls, surfacing deal risk and competitive mentions.
        who_uses_it: Sales leadership, RevOps and Enablement.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: 1-4 GB/day (transcripts + metadata)
