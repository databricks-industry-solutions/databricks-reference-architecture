      - name: Chargebee
        icon: product
        summary: Subscription lifecycle, dunning and revenue operations for the self-serve and PLG billing motion.
        citations:
          - chargebee
        category: Subscription Management
        what_it_is: Subscription lifecycle, dunning and revenue operations for the self-serve and PLG billing motion.
        who_uses_it: RevOps, finance and growth billing teams.
        data_out:
