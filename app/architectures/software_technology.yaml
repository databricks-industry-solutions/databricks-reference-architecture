  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Software Development Lifecycle
        short: DORA & CI/CD
        icon: code
        summary: Commit, pull-request, build and incident data joined into one view of developer velocity and delivery health, so engineering leadership manages the SDLC on evidence.
        problem: Delivery signals are scattered across Git, CI, issue tracking and on-call tools, so no one can measure deployment frequency, change-failure rate or MTTR consistently across teams.
        who_benefits: Platform & Security
        how_built: GitHub, GitLab, Jira Software and PagerDuty events land through Lakeflow and are conformed to certified Metric Views; DORA and cycle-time metrics are read in AI/BI on the Engineering Delivery dashboard under Unity Catalog.
        components:
          - GitHub
          - GitLab
          - Jira Software
          - PagerDuty
          - AI/BI
          - Unity Catalog
        stories:
          - title: Announcing GA of Databricks Assistant and AI-Generated Comments
            url: https://www.databricks.com/blog/announcing-general-availability-databricks-assistant-and-ai-generated-comments
          - title: Use Databricks Assistant (Databricks documentation)
            url: https://docs.databricks.com/aws/en/notebooks/use-databricks-assistant
      - name: Customer 360
        short: Unified profile
        icon: custlake
        summary: A single conformed customer record resolved across CRM, billing, support and product so every team acts on the same account, contacts and history.
        problem: Customer data is fragmented across Salesforce, Stripe, Zendesk and the product, so accounts, users and subscriptions never reconcile into one trustworthy profile.
        who_benefits: Revenue & Sales
        how_built: Salesforce, Stripe and Segment records are conformed into single account, user and subscription entities in the lakehouse, assembled in the Feature Store and governed in Unity Catalog, then written back to the CRM through CRM Health Writeback.
        components:
          - Salesforce Sales Cloud
          - Segment CDP
          - Feature Store
          - CRM Health Writeback
          - Unity Catalog
        stories:
          - title: Calculate Customer Lifetime Value
            url: https://www.databricks.com/solutions/accelerators/customer-lifetime-value
      - name: AI-Driven Product Design and Prototyping
        short: Design & prototyping
        icon: ztarget
        summary: Product and behavioural signals turned into design and prototype decisions, with GenAI accelerating concept generation and experiment readouts.
        problem: Product design runs on opinion and delayed analytics, so teams prototype features that never move adoption and learn it only after they ship.
        who_benefits: Growth & Analytics
        how_built: Amplitude, Snowplow and Segment events are conformed to certified Metric Views; concept generation and experiment analysis run on Agent Bricks and AI Functions with runs tracked in MLflow, surfaced from the Growth Command Center.
        components:
          - Amplitude Analytics
          - Snowplow Behavioral
          - Agent Bricks
          - AI Functions
          - MLflow
          - Growth Command Center
        stories:
          - title: Statsig runs experimentation at scale on Databricks
            url: https://www.databricks.com/customers/statsig
      - name: Customer Health & Journey Assistant
        short: Churn & NRR
        icon: people
        summary: Predicting churn and net revenue retention from product, support and billing signals so the save happens before the renewal, not at it.
        problem: Churn surfaces in the renewal number when it is too late to act, while the leading signals sit unjoined across product usage, support tickets and billing.
        who_benefits: Exec & Product
        how_built: Usage, support and billing features feed churn and expansion models tracked in MLflow and scored in Model Serving; risk and journey stage surface in the Customer Health Hub for the owning team.
        components:
          - Segment CDP
          - Model Serving
          - Feature Store
          - Customer Health Hub
          - MLflow
        stories:
          - title: Reonomy accelerates ML to improve customer engagement and retention on Databricks
            url: https://www.databricks.com/customers/reonomy
      - name: Generative Code Assistance
        short: AI pair programming
        icon: code
        summary: Governed AI coding assistants working against the platform through MCP, with spend, routing and policy controlled centrally so developers ship faster safely.
        problem: Coding assistants proliferate across IDEs with no control of spend, model routing or data access, so productivity gains come with ungoverned risk.
        who_benefits: Platform & Data Eng
        how_built: Claude Code, OpenAI Codex and any MCP harness connect over MCP and are admitted, scoped and metered at runtime by Unity Gateway, with models served through Model Serving under Unity Catalog.
        components:
          - Claude Code
          - OpenAI Codex
          - Any MCP Harness
          - Unity Gateway
          - Model Serving
        stories:
          - title: Introducing Databricks Assistant, a context-aware AI assistant
            url: https://www.databricks.com/blog/introducing-databricks-assistant
          - title: Introducing Databricks Assistant Data Science Agent
            url: https://www.databricks.com/blog/introducing-databricks-assistant-data-science-agent
      - name: Cross-Selling & Upsell Recommender
        short: Expansion recommender
        icon: market
        summary: Product-usage, billing and conversation signals scored into ranked cross-sell and upsell recommendations pushed to the reps and the product.
        problem: Expansion is left to rep intuition and generic campaigns, so the accounts most ready to buy more are missed while the wrong ones get pushed.
        who_benefits: Revenue & Sales
        how_built: Salesforce, Stripe and Gong signals are conformed and scored for expansion propensity in Model Serving; ranked recommendations are written back through Reverse ETL to CDP and read in the Revenue Cockpit on AI/BI.
        components:
          - Salesforce Sales Cloud
          - Gong Revenue AI
          - Model Serving
          - Reverse ETL to CDP
          - Revenue Cockpit
        stories:
          - title: Iterable activates lifecycle journeys on Databricks
            url: https://www.databricks.com/customers/iterable
          - title: Zapier powers real-time customer experiences
            url: https://www.databricks.com/customers/zapier
      - name: Customer Lifetime Value
        short: CLV modeling
        icon: gauge
        summary: Predicted lifetime value per customer and cohort from billing, usage and retention signals, so acquisition and retention spend follows the value.
        problem: Teams optimize for signups and short-term revenue because lifetime value is never modeled on joined billing, usage and churn data, so spend chases the wrong customers.
        who_benefits: Finance & RevOps
        how_built: Stripe and Zuora billing, Segment usage and retention features are assembled in the Feature Store and scored for lifetime value in Model Serving; CLV by segment is served in AI/BI under Unity Catalog.
        components:
          - Stripe Billing
          - Segment CDP
          - Feature Store
          - Model Serving
          - AI/BI
        stories:
          - title: Calculate customer lifetime value on Databricks
            url: https://www.databricks.com/solutions/accelerators/customer-lifetime-value
      - name: Next Best Action Guidance
        short: Guided selling
        icon: ztarget
        summary: The next best action for each account recommended from pipeline, usage and conversation signals, so reps and CSMs act on the highest-value move.
        problem: Reps and CSMs work long account lists with no ranking, so effort goes to whoever shouts loudest rather than the action most likely to move the number.
        who_benefits: Revenue & Sales
        how_built: Salesforce pipeline and Gong conversation data are conformed and scored for win, expansion and risk propensity in Model Serving; ranked next actions surface in the Revenue Cockpit on AI/BI and write back to the CRM.
        components:
