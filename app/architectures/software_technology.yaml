      - name: Workday HCM
        icon: people
        summary: Headcount, roles and cost centres, the reference for engineering capacity and cost-of-delivery analysis.
        citations:
          - workday
        category: Human Capital Management (HCM)
        what_it_is: Headcount, roles and cost centres, the reference for engineering capacity and cost-of-delivery analysis.
        who_uses_it: Finance, People and engineering leadership.
        data_out:
          batch:
            types:
              - structured
            volume: 0.1-0.5 GB/day
