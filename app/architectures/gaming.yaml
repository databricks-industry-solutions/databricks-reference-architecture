  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Player Churn Prediction
        short: Retention
        icon: gauge
        summary: Identifying players likely to lapse from session decay and economy frustration before they uninstall.
        problem: Session frequency and spend decay quietly, and by the time a dashboard shows a title bleeding players the churn has happened and winning them back costs far more than keeping them.
        who_benefits: Live Ops & Product
        how_built: Session, economy and payment signals land through Lakeflow and feed churn models in Feature Store and Model Serving, so at-risk cohorts surface in the Live Ops Console before they lapse.
        components:
          - Live Ops Console
          - Model Serving
          - Feature Store
          - MLflow
          - Custom Game Servers
          - Lakeflow
        stories:
          - title: Changing the game in player retention (SEGA Europe)
            url: https://www.databricks.com/customers/sega
          - title: FunPlus gains new player insights to optimize gaming
            url: https://www.databricks.com/customers/funplus
      - name: LTV & Monetisation
        short: Revenue
        icon: market
        summary: Cohort lifetime value and payer conversion scored per acquisition channel and title.
        problem: Acquisition is bought on installs, not value, so spend chases cheap users who never pay while genuinely high-value players go underbid and the payback on each channel stays a guess.
        who_benefits: Marketing & UA
        how_built: Cohort spend and behaviour are engineered in Feature Store and scored in Model Serving, and predicted LTV lands in the UA Optimiser and AI/BI so bids and offers align to value per channel.
        components:
          - UA Optimiser
          - Model Serving
          - Feature Store
          - AI/BI
          - AppsFlyer Attribution
          - Adyen Payments
        stories:
          - title: Personalizing players' experiences with recommendation systems
            url: https://www.databricks.com/blog/personalizing-players-experiences-recommendation-systems
          - title: Creating a player centric experience in games
            url: https://www.databricks.com/blog/creating-player-centric-experience-games
      - name: Live Ops Balancing
        short: Economy
        icon: sheet
        summary: Sink and source tuning tested against simulated economy health before patches ship.
        problem: 'Economy tuning ships on instinct: a drop-rate or price change can drain a currency sink or wreck retention, and the feedback only lands days later once the patch is already live.'
        who_benefits: Live Ops & Product
        how_built: Session and economy events stream into Lakehouse//RT on Delta Lake, so sinks and sources are simulated in the Live Ops Console and balanced against cohort impact before a patch ships.
        components:
          - Live Ops Console
          - Lakehouse//RT
          - Delta Lake
          - AI/BI
          - PlayFab Backend
          - Apache Spark
        stories:
          - title: Sega delivers real-time gaming insights with Spark Declarative Pipelines
            url: https://www.databricks.com/customers/sega/spark-declarative-pipelines
          - title: Supercell masters the art and science of ForeverGames
            url: https://www.databricks.com/customers/supercell
      - name: Fraud & Bonus Abuse
        short: Risk
        icon: stream
        summary: Multi-accounting, collusion and promo abuse detected from device, payment and play graphs.
        problem: Multi-accounting, collusion and promo abuse hide across device, payment and play data, and siloed rules miss coordinated rings until the bonus and chargeback losses are already gone.
        who_benefits: Risk & Compliance
        how_built: Device, payment and session graphs are conformed on Delta Lake and scored in Model Serving, so velocity and collusion clusters surface in the Fraud Command Centre before refunds or chargebacks settle.
        components:
          - Fraud Command Centre
          - Model Serving
          - SEON Fraud Prevention
          - Adyen Payments
          - Delta Lake
          - Feature Store
        stories:
          - title: Managing and analyzing game data at scale
            url: https://www.databricks.com/blog/managing-analyzing-game-data-scale
      - name: Anti-Cheat & Toxicity
        short: Integrity
        icon: gauge
        summary: Cheating, collusion and toxic voice and chat detected in session to protect fair play.
        problem: Cheating, botting and toxic voice and chat drive honest players away, but the signals sit across game servers and moderation tools and manual review never keeps pace with live matches.
        who_benefits: Player Experience
        how_built: Server, chat and voice signals from Modulate and the game servers are scored in Model Serving and with AI Functions, so cheating and toxicity are flagged in session and actioned from the Fraud Command Centre.
        components:
          - Fraud Command Centre
          - Modulate / Quago Integrity
          - Model Serving
          - AI Functions
      - name: Player Journey Analytics
        short: Funnels
        icon: chart
        summary: Onboarding, progression and funnel drop-off analysed across the full player journey.
        problem: Onboarding and progression funnels are pieced together from product-analytics exports per tool, so studios cannot see where players stall, rage-quit or convert across the full journey.
        who_benefits: Live Ops & Product
        how_built: Telemetry and product-analytics events from Amplitude and the game backends are conformed on Delta Lake through Lakeflow, so onboarding, progression and funnel drop-off read per cohort in AI/BI.
        components:
          - Amplitude / Mixpanel
          - Unity Gaming Services
          - Delta Lake
          - Lakeflow
          - AI/BI
      - name: Content Personalisation
        short: Live ops
        icon: custlake
        summary: Offers and events targeted per player segment from in-game behaviour, not batch exports.
        problem: Offers and events are batched to broad segments from stale exports, so a player sees content that ignores what they just did in-game and the moment to convert or re-engage has passed.
        who_benefits: Player Experience
        how_built: In-game behaviour is resolved in CustomerLake and scored in Model Serving, so per-segment offers and events trigger through Braze Lifecycle from governed data without nightly exports.
        components:
          - Player 360
          - CustomerLake
          - Model Serving
          - Braze Lifecycle
          - AI Functions
          - Salesforce Gaming CRM
        stories:
          - title: Announcing Heroic Labs Satori integration with Databricks
            url: https://www.databricks.com/blog/announcing-heroic-labs-satori-integration-databricks
          - title: Creating a player centric experience in games
            url: https://www.databricks.com/blog/creating-player-centric-experience-games
      - name: In-Game Purchase Optimization
        short: Monetisation
        icon: market
        summary: Store offers, bundles and pricing tuned per player segment to lift payer conversion.
        problem: Store offers and bundles are the same for everyone, so a whale sees a starter pack and a new player sees a price that scares them off, and monetisation leaves conversion and revenue on the table.
        who_benefits: Live Ops & Product
        how_built: Spend and behaviour features from the backends are scored in Model Serving against Feature Store, so per-segment store offers, bundles and price points are served and read in the Live Ops Console.
        components:
          - Live Ops Console
          - Unity Gaming Services
          - Model Serving
          - Feature Store
          - AI/BI
      - name: Game Health & Stability
        short: Telemetry
        icon: stream
        summary: Crash, latency and performance telemetry triaged to protect the live player experience.
        problem: Crashes, frame drops and latency spikes surface in store reviews and churn long before engineering connects them to a build, device or region, because telemetry is sampled and scattered.
        who_benefits: Live Ops & Product
        how_built: Unity and Unreal crash and performance telemetry stream into Lakehouse//RT on Delta Lake, so stability regressions are triaged by build, device and region in AI/BI before they spread.
        components:
          - Unity Client Telemetry
          - Unreal Engine Telemetry
          - Lakehouse//RT
          - Delta Lake
          - AI/BI
      - name: UA & Ad Attribution
        short: Acquisition
        icon: market
        summary: Install and in-app-event attribution tied to spend and predicted value per channel.
        problem: User-acquisition spend is judged on installs from each network's own dashboard, so channels claim the same install, ad revenue is double-counted and budget chases volume over value.
        who_benefits: Marketing & UA
        how_built: AppsFlyer attribution and AppLovin ad-revenue feeds are conformed on Delta Lake and scored against predicted value in Model Serving, so ROAS and payback by channel read in the UA Optimiser.
        components:
          - UA Optimiser
          - AppsFlyer Attribution
          - AppLovin / Unity Ads
          - Model Serving
          - AI/BI
medallion:
  Bronze:
    short: Raw event streams
    summary: Client telemetry, payment authorisations, identity and age checks, game server events and marketing sends, landed exactly as received so a session or a purchase can always be replayed.
  Silver:
    short: Conformed player, session
    summary: Players, devices, sessions and titles resolved into single conformed entities across platform, payments and CRM, with cross-device identity stitched to one profile.
  Gold:
    short: ARPDAU, LTV, churn
    summary: 'Contracted products product and finance run on: ARPDAU and payer conversion, cohort LTV, churn and reactivation, and fraud loss rate.'
