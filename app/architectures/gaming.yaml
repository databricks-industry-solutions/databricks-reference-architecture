      - name: Live Ops & Engagement Agent
        icon: genie
        summary: Ask about ARPDAU, retention, funnels and economy health per title in plain language.
        feeds:
          - Unity Gaming Services
          - PlayFab Backend
          - Custom Game Servers
          - ARPDAU, LTV, churn
        teams:
          - Live Ops & Product
          - Live Ops Manager
          - Economy Designer
        questions:
          - What was ARPDAU by title yesterday versus last week?
          - Which cohorts are dropping off fastest after the last content release?
          - How did the latest event move retention and spend?
          - Which currency sinks and sources are out of balance right now?
          - What is payer conversion by title and platform this week?
      - name: Player 360 & CRM Agent
        icon: genie
        summary: Explore player spend, support history and lifecycle across the base.
        feeds:
          - Salesforce Gaming CRM
          - Braze Lifecycle
