      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Line Performance Agent
        icon: genie
        summary: Ask about recipe and formulation control, ingredient giveaway and quality and contamination root cause by line and shift in plain language.
        feeds:
          - Rockwell FactoryTalk
          - Siemens Opcenter MES
          - LabWare LIMS
        teams:
          - Plant Operations
          - Quality & Food Safety
          - CEO & COO
        questions:
          - Which recipes are drifting from setpoint, and what recipe or setpoint move holds spec at lowest cost?
          - Where is ingredient giveaway highest, and which formulations overuse costly inputs to hold spec?
          - Which open quality holds or contamination events rank highest by likely root cause across changeover, cleaning and shared lines?
          - Which lines are losing OEE to downtime or changeover, and where is line yield below target by shift?
          - Which lot assay results are drifting out of spec against LIMS limits?
      - name: Food Safety Agent
        icon: genie
        summary: Explore hold rate, deviations, traceability and recall readiness across sites.
        feeds:
          - Siemens Opcenter MES
          - SafetyChain Plant Mgmt
          - LabWare LIMS
          - GS1 EPCIS Events
        teams:
          - Quality & Food Safety
          - Plant Operations
          - CEO & COO
        questions:
          - What is the quality hold rate by plant and SKU?
          - Which lots are affected by a supplier ingredient alert?
          - How many deviations are open past their CAPA SLA?
          - Where are allergen cross-contact risks by changeover?
          - How fast can we build a recall list for a given lot?
      - name: Service & Cold Chain Agent
        icon: genie
        summary: Answer demand, OTIF, inventory and cold-chain questions across the network.
        feeds:
          - NielsenIQ POS
          - Blue Yonder TMS
          - Sensitech TempTale
          - Manhattan WMS
        teams:
          - Supply Chain
          - Sales & Marketing
          - Plant Operations
        questions:
          - What is OTIF and cold-chain excursion risk by customer and lane this week?
          - Where is forecast bias worst by SKU-location?
          - What is days of supply and short-dated risk by SKU?
          - Which co-pack sites are short on capacity or materials?
          - Which S&OP scenario best balances service, cost and inventory before the plan locks?
      - name: Commercial & Customer Agent
        icon: genie
        summary: Ask about demand, promotion ROI and shopper segments across the commercial book.
        feeds:
          - NielsenIQ POS
          - Circana / IRI Panel
          - Trade Promotion Mgmt
          - Weather & Commodity
        teams:
          - Sales & Marketing
          - Supply Chain
          - CEO & COO
        questions:
          - Which promotions drove incremental volume versus base?
          - What is our category share by banner and geography?
          - Which SKUs lost distribution last month?
          - Which shopper and consumer segments are we winning or losing across syndicated POS and household panel?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Quality Event Root Cause Analysis
        short: Contamination root-cause
        icon: gavel
        summary: Quality and contamination events ranked by likely cause across changeover, cleaning and shared-line evidence for food-safety review.
        problem: When a quality hold or contamination event hits, the cause is buried across production scheduling, cleaning records and shared-equipment genealogy, so root-cause takes days and the same cross-contact failure recurs on the next run.
        who_benefits: Quality & Food Safety
        how_built: MES scheduling, sanitation and lot-genealogy data are conformed under Unity Catalog and scored with AI Functions in the Quality Hold Dashboard to rank causal hypotheses and surface trace evidence for qualified food-safety review, flagging cross-contact risk ahead of the next changeover.
        components:
          - Quality Hold Dashboard
          - Siemens Opcenter MES
          - SafetyChain Plant Mgmt
          - Unity Catalog
          - AI Functions
        stories:
          - title: Barilla streamlines food manufacturing operations with Databricks
            url: https://www.databricks.com/customers/barilla
      - name: Product & Process Traceability
        short: Farm-to-fork recall
        icon: gauge
        summary: Lot genealogy and distribution lists produced in minutes, not days, when a supplier alert arrives.
        problem: Lot genealogy is scattered across MES, ERP and warehouse systems, so a supplier alert means days of manual spreadsheet tracing while suspect product still sits on retail shelves.
        who_benefits: Quality & Food Safety
        how_built: EPCIS, MES and shipment feeds are conformed on Delta Lake under Unity Catalog, and the Batch Genealogy Console walks lot links forward and backward to build recall lists in minutes.
        components:
