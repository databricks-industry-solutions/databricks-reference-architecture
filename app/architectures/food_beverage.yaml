      - name: Distribution & Logistics Optimization
        short: Cold-chain routing
        icon: stream
        summary: Cold-chain excursion risk and route service flagged with recommended logistics intervention before product is compromised.
        problem: Temperature excursions in transit are found on arrival when product is already compromised, because logger readings sit in a carrier portal cut off from the shipment and the order.
        who_benefits: Supply Chain
        how_built: Sensitech logger and TMS feeds land through Lakeflow into Lakehouse//RT, where excursion models in Model Serving flag at-risk loads for reroute before quality is lost.
        components:
          - Sensitech TempTale
          - Blue Yonder TMS
          - Lakehouse//RT
          - Model Serving
          - Lakeflow
        stories:
          - title: Grip ships perishable goods reliably with cold-chain analytics on Databricks
            url: https://www.databricks.com/customers/grip
      - name: Supply & Materials Planning
        short: Co-pack network
        icon: partner
        summary: Co-packer capacity, material supply and what-if scenarios planned across the internal and co-pack network.
        problem: Co-packer production status, material supply and inventory arrive by email and spreadsheet, so planners balance the internal-versus-co-pack network by hand and the supply plan is stale before it is agreed.
        who_benefits: Supply Chain
        how_built: Co-manufacturer inventory is queried in place through Unity Catalog federation and reconciled with WMS and production orders in the Demand Planning Workbench, where scenario models in Model Serving simulate service, cost and inventory before the plan locks.
        components:
          - Co-manufacturer Inventory
          - Manhattan WMS
          - SAP S/4HANA PP
          - Demand Planning Workbench
