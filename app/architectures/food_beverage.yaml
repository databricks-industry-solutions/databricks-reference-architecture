    short: Raw plant and ERP
    summary: MES batch records, ERP production orders, quality lab results, warehouse movements and retailer POS feeds, landed exactly as received so a lot code or a fill weight can always be replayed.
  Silver:
    short: Conformed SKU, batch
    summary: SKUs, batches, plants and distribution nodes resolved into single conformed entities across ERP, MES and WMS, with lot genealogy reconciled from raw material to finished case.
  Gold:
    short: Yield, OTIF, quality
    summary: 'Contracted products operations and sales run on: line yield and scrap, OTIF to retail customers, quality hold rates, and trade promotion ROI.'
