      - name: Demand Forecasting
        short: Promo & seasonal
        icon: sheet
        summary: SKU-location demand forecast from syndicated POS, promotions, seasonality and plant capacity constraints.
        problem: SKU-location demand is forecast from aggregate history in legacy tools, so promotions, seasonality and plant capacity are missed and the plan is stale before S&OP even locks.
        who_benefits: Supply Chain
        how_built: Syndicated POS, promotion, seasonality and capacity features are engineered in Feature Store and scored through Model Serving into the Demand Planning Workbench for the S&OP consensus.
        components:
