      - name: Production Monitoring
        short: OEE & line yield
        icon: iot
        summary: Live line performance, OEE, yield and downtime monitored against targets on every shift.
        problem: Line performance is read from end-of-shift reports and whiteboards, so OEE loss, filler drift and downtime causes surface only after the run and the same losses repeat on the next shift.
        who_benefits: Plant Operations
        how_built: Rockwell FactoryTalk line telemetry and Siemens Opcenter MES batch execution stream into Lakehouse//RT, where yield and downtime models in Model Serving surface OEE, scrap and changeover in AI/BI for line leads to steer the run in flight.
        components:
          - Rockwell FactoryTalk
          - Siemens Opcenter MES
