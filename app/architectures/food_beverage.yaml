            url: https://www.databricks.com/blog/managing-recalls-barcode-traceability-delta-lake
          - title: 'The EU Digital Product Passport: a traceability deadline'
            url: https://www.databricks.com/blog/eu-digital-product-passport-traceability-deadline
      - name: Scenario Planning & Business Simulation
        short: S&OP what-if
        icon: chart
        summary: Demand, supply, capacity and margin scenarios simulated end to end so S&OP tests a promotion, a shortage or a co-pack shift before it commits.
        problem: Demand, supply and finance plan in separate spreadsheets, so a promotion swing, an ingredient shortage or a co-pack change is absorbed reactively and no one can see how a scenario flows from shelf demand through plant and co-pack capacity to service, cost and margin.
        who_benefits: Supply Chain
        how_built: SAP S/4HANA PP orders and NielsenIQ POS demand are scored in Model Serving, so S&OP scenarios run against demand, capacity and cost in the Demand Planning Workbench and surface for commercial and operations leadership in AI/BI.
        components:
