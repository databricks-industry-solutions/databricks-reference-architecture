      - name: Customer 360
        short: Shopper & D2C
        icon: market
        summary: Shopper and D2C signals unified across syndicated POS, panel and loyalty for segmentation and activation.
        problem: Consumer signals are scattered across syndicated POS, household panel, D2C and loyalty systems, so a manufacturer that rarely owns the shopper cannot build a single consumer view or measure who actually buys and repeats.
        who_benefits: Sales & Marketing
        how_built: POS, panel, D2C and loyalty data are resolved into governed consumer entities in CustomerLake under Unity Catalog and scored with Model Serving for segmentation and lifetime value in AI/BI.
