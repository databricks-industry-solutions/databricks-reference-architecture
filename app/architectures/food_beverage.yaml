      - name: Feedstock, Formulation, & Recipe Control
        short: Clean-label reformulation
        icon: sheet
        summary: Batch recipes and process setpoints tuned for cost, yield and consistency as feedstock quality varies lot to lot.
        problem: Ingredient cost and quality swing from lot to lot, but recipes and setpoints are fixed in the MES and nudged by tribal knowledge, so formulators overuse expensive ingredients to hold spec and product consistency drifts run to run.
        who_benefits: Plant Operations
        how_built: MES batch records, LIMS assay results and ERP ingredient costs are conformed on Delta Lake, and formulation models tracked in MLflow and scored through Model Serving recommend recipe and setpoint moves that hold spec at lowest cost for the line to confirm.
        components:
          - Siemens Opcenter MES
          - LabWare LIMS
          - Model Serving
          - MLflow
          - Delta Lake
