      - name: Operations Resource Efficiency
        short: Energy per barrel
        icon: stream
        summary: Fuel gas, steam and power intensity modelled by unit for cost and carbon reduction.
        problem: Energy is billed at the site and the meter, not the unit or the utility, so nobody can see fuel, steam and power intensity by unit or act on the biggest offenders for cost or carbon reduction.
        who_benefits: Operations & Process
