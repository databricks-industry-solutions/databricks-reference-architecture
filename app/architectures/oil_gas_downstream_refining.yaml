medallion:
  Bronze:
    short: Raw plant and market
    summary: DCS and historian tags, laboratory assays, blend plans and deal capture tickets, landed exactly as received so a yield or a lab result can always be replayed as it stood.
  Silver:
    short: Conformed unit, batch
    summary: Units, streams, tanks and batches resolved into single conformed entities across control, laboratory and commercial systems, with blend recipes reconciled and assay results stitched to one product definition.
  Gold:
    short: Yield, margin, energy
    summary: 'Contracted products operations and commercial run on: unit yields and giveaway, crack-spread margin, energy intensity and off-spec rates.'
