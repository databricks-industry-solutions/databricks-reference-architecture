name: Travel & Hospitality
description: 'For a hotel, resort or travel operator: property management, central reservations, revenue management, guest loyalty and distribution across direct and OTA channels.'
sources:
  - name: PMS & Operations
    icon: erp
    simplified: 3
    tiles:
      - name: Oracle OPERA Cloud
        icon: erp
        summary: 'Property management: reservations, housekeeping, folios and night audit.'
        citations:
          - opera-cloud
        category: Property Management System (PMS)
        what_it_is: System-of-record for reservations, room inventory, housekeeping status and guest folios, and runs the night-audit cycle that closes each business day.
        who_uses_it: Front office, Housekeeping, Night audit and Revenue teams.
        data_out:
          batch:
            types:
              - structured
            volume: 5-30 GB/day
            interval: Night audit + hourly deltas
          stream:
            types:
              - semi-structured
            volume: tens-hundreds of events/sec
            interval: Continuous CDC (reservations, status)
      - name: Mews PMS
        icon: apps
        summary: Cloud PMS for boutique and multi-property groups with open APIs.
        citations:
          - mews
        category: Property Management System (PMS)
        what_it_is: Cloud-native PMS for boutique and multi-property groups, exposing reservations, folios and guest profiles over open APIs.
        who_uses_it: Front office and Operations teams at boutique and independent groups.
        data_out:
          stream:
            types:
              - semi-structured
            volume: tens of events/sec
            interval: Continuous (API / webhook)
      - name: Infor HMS
        icon: db
        summary: Hotel operations, group blocks and event catering for full-service properties.
        citations:
          - infor-hms
        category: Property Management System (PMS)
        what_it_is: Full-service hotel operations platform covering reservations, group blocks and event catering for larger properties.
        who_uses_it: Front office, Group sales and Catering operations teams.
        data_out:
          batch:
            types:
              - structured
            volume: 2-15 GB/day
            interval: Nightly batch + intraday deltas
  - name: CRS & Distribution
    icon: market
    simplified: 2
    tiles:
      - name: Amadeus iHotelier
        icon: globe
        summary: Central reservations, rate distribution and channel management.
        citations:
          - amadeus-ihotelier
        category: Central Reservation System (CRS)
        what_it_is: Holds central availability and rates, distributes them to channels and captures bookings from web, GDS and voice.
        who_uses_it: Central reservations, Distribution and Revenue management teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds of booking msgs/sec at peak
            interval: Continuous (booking notifications)
      - name: Sabre SynXis
        icon: partner
        summary: CRS, booking engine and GDS connectivity for hotel brands.
        citations:
          - sabre-synxis
        category: Central Reservation System (CRS)
        what_it_is: Central reservation and booking-engine platform connecting brand websites and GDS to a single availability pool.
        who_uses_it: Distribution, E-commerce and Brand reservations teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds of events/sec
            interval: Continuous (reservation events)
      - name: SiteMinder Channel
        icon: api
        summary: OTA and metasearch connectivity with parity monitoring.
        citations:
          - siteminder
        category: Channel Manager
        what_it_is: Pushes rates and availability to OTAs and metasearch and pulls bookings back, monitoring rate parity across channels.
        who_uses_it: Distribution and Revenue management teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: tens-hundreds of ARI + booking msgs/sec
            interval: Continuous (ARI + bookings)
  - name: Revenue Management
    icon: chart
    simplified: 2
    tiles:
      - name: IDeaS G3 RMS
        icon: market
        summary: Forecasting, price recommendations and length-of-stay controls.
        citations:
          - ideas-rms
        category: Revenue Management System (RMS)
        what_it_is: Forecasts demand and recommends optimal rates and length-of-stay controls by segment for each property.
        who_uses_it: Revenue management and Pricing teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day forecasts + recommendations
            interval: Multiple optimisation runs daily
      - name: Duetto GameChanger
        icon: sheet
        summary: Open pricing and segment-level optimisation for casinos and resorts.
        citations:
          - duetto
        category: Revenue Management System (RMS)
        what_it_is: Open-pricing revenue platform optimising rate by segment and channel, tuned for casino and resort demand patterns.
        who_uses_it: Revenue management and Casino marketing teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-4 GB/day
            interval: Continuous optimisation cycles
      - name: Lighthouse
        icon: observ
        summary: Competitive rate shopping and hotel market demand intelligence.
        citations:
          - ota-insight
        category: Rate Shopping & Market Intelligence
        what_it_is: Shops competitor rates and market demand signals to benchmark the property's price position against the compset.
        who_uses_it: Revenue management and Commercial strategy teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: GBs of rate + demand data
            interval: Multiple shops daily
  - name: Guest & Loyalty
    icon: custlake
    simplified: 2
    tiles:
      - name: Salesforce Loyalty
        icon: custlake
        summary: Tier status, points accrual and partner earn across the portfolio.
        citations:
          - sf-loyalty
        category: Loyalty Management Platform
        what_it_is: Manages member tiers, points accrual and redemption and partner-earn transactions across the portfolio.
        who_uses_it: Loyalty, CRM and Marketing teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Hourly / nightly sync
          stream:
            types:
              - semi-structured
            volume: tens of events/sec
            interval: Continuous (accrual events)
      - name: Medallia Guest
        icon: partner
        summary: Post-stay surveys, sentiment and recovery workflows.
        citations:
          - medallia-guest
        category: Guest Experience & Survey Platform
        what_it_is: Collects post-stay surveys and sentiment and drives service-recovery workflows tied to the guest and stay.
        who_uses_it: Guest experience, Front office and Operations teams.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: GBs of survey + verbatim text
            interval: Continuous / daily
      - name: SevenRooms CRM
        icon: product
        summary: Restaurant reservations and guest preferences for F&B outlets.
        citations:
          - sevenrooms
        category: Restaurant Reservation & Guest CRM
        what_it_is: Manages outlet reservations, waitlists and guest preferences for F&B venues within the property.
        who_uses_it: F&B operations and Restaurant management teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: tens of events/sec
            interval: Continuous (reservation events)
  - name: Spa & Ancillary
    icon: product
    tiles:
      - name: Book4Time Spa
        icon: apps
        summary: Spa and activity scheduling, therapist utilisation and retail attach.
        citations:
          - book4time
        category: Spa & Activity Management System
        what_it_is: Schedules spa, wellness and activity appointments, tracks therapist utilisation and retail attach to the stay.
        who_uses_it: Spa operations, Wellness and Ancillary revenue teams.
        data_out:
          batch:
            types:
              - structured
            volume: sub-GB/day
            interval: Hourly / nightly sync
      - name: Agilysys InfoGenesis
        core: true
        icon: erp
        summary: Outlet POS for restaurants, bars and room charges to folio.
        citations:
          - agilysys-pos
        category: Food & Beverage POS
        what_it_is: Point-of-sale for restaurants, bars and outlets, posting F&B checks and room charges back to the guest folio.
        who_uses_it: F&B operations, Outlet managers and Front office (room charges).
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds of checks/sec at peak
            interval: Continuous (POS transactions)
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Ownership Group Marts
        icon: fed
        summary: Owner reporting and STR benchmark marts queried in place under Unity Catalog.
        category: Owner Reporting Data Warehouse
        what_it_is: Owner-reporting and STR benchmark marts kept in the incumbent warehouse and queried in place through federation rather than copied.
        who_uses_it: Asset management, Owner relations and Finance teams.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale historical marts
            interval: Queried on demand (federated)
  - name: Data Formats
    icon: zbraces
    simplified: 2
    tiles:
      - name: 'OpenTravel XML'
        icon: zbraces
        fmt: 'OTA'
        summary: 'OpenTravel Alliance XML messages for travel and hospitality distribution.'
        spec_url: https://opentravel.org/
        spark_connector: 'spark-xml'
        spark_repo: https://github.com/databricks/spark-xml
        databricks_resource: https://docs.databricks.com/aws/en/query/formats/xml
        source_systems:
          - 'Amadeus'
          - 'Sabre'
          - 'SiteMinder'
      - name: 'OpenTravel 2.0'
        icon: zbraces
        fmt: 'OTA2'
        summary: 'OpenTravel 2.0 model-based message suite for modern travel integrations.'
        spec_url: https://opentravel.org/
      - name: 'HTNG Open Payments'
        icon: zbraces
        fmt: 'HTNG'
        summary: 'Hospitality Technology open payments messaging for hotel systems.'
        spec_url: https://www.htng.org/
      - name: 'PNR'
        icon: zbraces
        fmt: 'PNR'
        summary: 'Passenger Name Record data shared across travel booking and itinerary systems.'
        spec_url: https://www.iata.org/en/programs/passenger/
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    tiles:
      - name: STR Benchmark Feed
        icon: chart
        summary: Smith Travel Research comp set occupancy and rate benchmarks.
        citations:
          - str
        category: Hotel Benchmarking Data
        what_it_is: Provides comp-set occupancy, ADR and RevPAR index benchmarks used to position the property against its competitive market.
        who_uses_it: Revenue management, Commercial strategy and Owner reporting teams.
        data_out:
          batch:
            types:
              - structured
            volume: sub-GB/day
            interval: Weekly + monthly benchmark files
      - name: GDS Booking Messages
        core: true
        icon: stream
        summary: Amadeus and Sabre hotel booking notifications parsed on arrival.
        citations:
          - amadeus-ihotelier
        category: Global Distribution System (GDS)
        what_it_is: Carries hotel booking, modification and cancellation notifications from travel-agency GDS channels, parsed on arrival.
        who_uses_it: Distribution and Central reservations teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds of msgs/sec at peak
            interval: Continuous message flow
      - name: Review Aggregator APIs
        icon: observ
        summary: TripAdvisor and Google review feeds for reputation monitoring.
        citations:
          - medallia-guest
        category: Online Reputation & Review Data
        what_it_is: Aggregates public reviews and ratings from TripAdvisor, Google and OTAs for reputation monitoring and recovery.
        who_uses_it: Guest experience, Marketing and Front office teams.
        data_out:
          batch:
            types:
              - semi-structured
              - unstructured
            volume: GBs of review text
            interval: Continuous / daily pulls
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: CEO & Brand Office
        mark: Genie One
        summary: The CEO on RevPAR and gross operating profit; the COO on guest satisfaction and labour productivity across the property portfolio.
        uses:
          - - Genie One
            - Ask what last weekend's RevPAR was without analyst delay.
          - - AI/BI
            - RevPAR and occupancy on certified Metric Views.
          - - Unity Catalog
            - One room night definition across PMS and finance.
        sub:
          - name: CEO
            cares: portfolio RevPAR and gross operating profit, and the trade between growth and margin.
          - name: COO
            cares: guest satisfaction, labour productivity and service consistency across properties.
          - name: Brand & Development
            cares: brand standards, franchisee performance and the pipeline of new properties.
        ucs:
          - Open Pricing
          - Guest 360
          - Loyalty Tier Migration
      - name: Revenue Management
        mark: Model Serving
        summary: Revenue managers on price ladders, overrides and group displacement, defending ADR and occupancy against the compset before rates publish.
        uses:
          - - RMS Workbench
            - Forecast, compset and recommendation history before override.
          - - Model Serving
            - Pricing models scored in the distribution path.
        sub:
          - name: Director of Revenue
            cares: ADR, occupancy and RevPAR against the compset and the forecast.
          - name: Pricing & Distribution
            cares: rate ladders, channel mix and parity across OTA and direct.
          - name: Group Revenue
            cares: block pricing and displacement against transient demand.
        ucs:
          - Open Pricing
          - Conversational Booking
          - Disruption Response
      - name: Front Office & Ops
        core: true
        mark: Lakehouse//RT
        summary: GMs and front office on arrivals, housekeeping turn and service recovery, clearing rooms and VIP flags before the guest reaches the desk.
        uses:
          - - Property Command
            - Arrivals, VIP flags and housekeeping status on one screen.
          - - Lakehouse//RT
            - Room and task state at front-desk latency.
        sub:
          - name: General Manager
            cares: arrivals, service recovery and the property's guest score.
          - name: Front Office
            cares: check-in flow, VIP flags and room readiness at the desk.
          - name: Housekeeping & F&B Ops
            cares: room turn, outlet covers and labour matched to forecast.
        ucs:
          - Labour Scheduling
          - Predictive Maintenance
          - 24/7 AI Concierge
      - name: Sales & Groups
        mark: AI/BI
        summary: Sales directors on group blocks, catering revenue and conversion, watching pickup pace and wash against the block before the cutoff date.
        uses:
          - - AI/BI
            - Group pace and wash on certified views.
          - - Genie One
            - Ask which groups are below pickup pace.
        sub:
          - name: Director of Sales
            cares: group pipeline, conversion and negotiated corporate rates.
          - name: Group & Events
            cares: block pickup, catering revenue and wash before the cutoff.
          - name: Catering & Banquets
            cares: event-space yield and F&B attach on group business.
        ucs:
          - Next Best Offer
          - Conversational Booking
          - Ancillary Attach
      - name: Marketing & Loyalty
        mark: CustomerLake
        summary: CRM teams on campaigns, tier economics and personalisation, scoring offer propensity and tier migration across the guest portfolio.
        uses:
          - - Loyalty Console
            - Offer propensity and tier migration by segment.
          - - CustomerLake
            - Guest profiles without copying into a separate CDP.
        sub:
          - name: CRM & Loyalty
            cares: tier economics, points liability and member retention.
          - name: Guest Marketing
            cares: segmentation, campaigns and pre-arrival personalisation.
          - name: Ancillary & Partnerships
            cares: spa, dining and partner-earn attach across the stay.
        ucs:
          - Guest 360
          - Loyalty Tier Migration
          - Ancillary Attach
          - Next Best Offer
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land PMS reservations, CRS availability, POS folios and loyalty transactions; own Bronze to Silver and the pager when a RevPAR table stalls.
        uses:
          - - Lakeflow Connect
            - Managed connectors for PMS, CRS and loyalty sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on reservation and folio feeds.
          - - Lakewatch
            - Freshness on the RevPAR tables the revenue meeting reads.
        sub:
          - name: Ingestion Engineering
            cares: PMS, CRS, POS and loyalty connectors and the Bronze-to-Silver path.
          - name: Pipeline Reliability
            cares: freshness and the pager when a RevPAR table stalls.
          - name: Data Quality
            cares: expectations on reservation and folio feeds before Gold publishes.
        ucs:
          - Open Pricing
          - Guest 360
          - Predictive Maintenance
      - name: Data Scientists
        mark: MLflow
        summary: Demand-forecast, dynamic-pricing, personalisation and group-displacement models, and whether they still hold as compset and channel mix shift.
        uses:
          - - Feature Store
            - Guest and rate features read identically in training and serving.
          - - MLflow
            - Every forecast and pricing experiment tracked for audit.
          - - Model Serving
            - Pricing and offer models scored in the distribution path.
        sub:
          - name: Revenue Science
            cares: demand-forecast and dynamic-pricing models against compset and mix.
          - name: Personalisation Science
            cares: offer-propensity and tier-migration models across the guest base.
          - name: MLOps
            cares: training-serving parity and whether a model still holds in season.
        ucs:
          - Open Pricing
          - Guest 360
          - Loyalty Tier Migration
          - Next Best Offer
      - name: App Developers
        mark: Apps
        summary: Ship the Property Command, RMS Workbench and Loyalty Console apps revenue and front-office teams work in, next to governed PMS data.
        uses:
          - - Apps
            - Property screens with no separate web tier to secure.
          - - Lakebase
            - Serverless Postgres for arrival and offer state writes.
          - - Agent Bricks
            - Agents that draft rate moves against governed tools.
        sub:
          - name: Front-of-House Apps
            cares: Property Command arrivals, VIP and housekeeping screens.
          - name: Commercial Apps
            cares: RMS Workbench and Group Sales Hub for revenue and sales teams.
          - name: Guest & Loyalty Apps
            cares: Loyalty Console offers and stay history on governed data.
        ucs:
          - 24/7 AI Concierge
          - Conversational Booking
          - Ancillary Attach
