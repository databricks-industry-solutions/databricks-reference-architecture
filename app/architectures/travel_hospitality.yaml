        summary: Open-source meta-harness above existing agent frameworks, enabling agent composition, collaboration and centralised governance from one interface.
        capabilities:
          - Build
          - Deploy
          - Optimize
          - Govern
        related:
          - Agent Bricks
          - Unity Gateway
      - name: Claude Code
        core: true
        icon: code
        short: 3rd-party harness
        summary: Anthropic's coding harness working against the platform through MCP, with spend, routing and policy governed by Unity Gateway.
      - name: OpenAI Codex
        core: true
        icon: code
        short: 3rd-party harness
        summary: OpenAI's coding harness connected over MCP, governed at runtime by Unity Gateway rather than trusted by configuration.
      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Pricing & Distribution Agent
        icon: genie
        summary: Ask about RevPAR, ADR, pace and channel mix across properties in plain language.
        feeds:
          - IDeaS G3 RMS
          - SiteMinder Channel
          - Amadeus iHotelier
          - RevPAR, ADR, occupancy
        teams:
          - Revenue Management
          - Director of Revenue
          - Pricing & Distribution
        questions:
          - What was RevPAR by property and segment last weekend versus the same weekend last year?
          - Which channels are driving the most bookings this week, and at what net ADR?
          - Where is booking pace behind the forecast for the next 30 days?
          - Which properties show rate-parity breaches across our own distribution channels right now?
          - What is our rate gap or index against the competitive set by property?
          - How does length-of-stay mix compare to the same period last year?
      - name: Guest 360 Agent
        icon: genie
        summary: Explore guest profiles, loyalty tiers and stay history across the portfolio.
        feeds:
          - Salesforce Loyalty
          - Oracle OPERA Cloud
          - SevenRooms CRM
          - Conformed guest, stay, room
        teams:
          - Marketing & Loyalty
          - CRM & Loyalty
          - Guest Marketing
        questions:
          - What is the total stay value of this guest across every property in the portfolio?
          - Which loyalty members are at risk of tier downgrade before their renewal?
          - Which high-value guests have an upcoming arrival with no upsell offered?
          - What is points liability by tier and how has it moved this quarter?
          - Which guests have strong ancillary attach but no spa booking on their next stay?
      - name: Property Operations Agent
        icon: genie
        summary: Answer questions on arrivals, housekeeping, service recovery and outlet performance.
        feeds:
          - Oracle OPERA Cloud
          - Agilysys InfoGenesis
          - Medallia Guest
          - Conformed guest, stay, room
        teams:
          - Front Office & Ops
          - General Manager
          - Housekeeping & F&B Ops
        questions:
          - How many VIP arrivals are due today and are their rooms ready?
          - Which properties have the longest housekeeping turn times this week?
          - What are the top guest-complaint drivers by property this month?
          - How is outlet F&B revenue tracking against covers by daypart?
          - Which detractor surveys are still open past their recovery SLA?
      - name: Owner Reporting Agent
        icon: genie
        summary: Ask about owner statements and NOI, operator GOP and market STR index position across the estate, each a distinct measure.
        feeds:
          - Ownership Group Marts
          - STR Benchmark Feed
          - RevPAR, ADR, occupancy
        teams:
          - CEO & Brand Office
          - Brand & Development
          - Revenue Management
        questions:
          - How does each property's RevPAR index compare to its compset this month?
          - What is gross operating profit by property versus budget?
          - Which owned assets are underperforming their STR fair-share?
          - How has ancillary revenue per available room trended this year?
          - What is portfolio occupancy forecast against target for the next quarter?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Open Pricing
        short: Revenue
        icon: market
        summary: Open pricing by segment and channel rather than fixed BAR ladders.
        problem: Rates move on fixed BAR ladders set days ahead, so when demand or the compset shifts the price is already wrong and revenue managers chase it with manual overrides.
        who_benefits: Revenue Management
        how_built: Booking pace, PMS demand and rate-shopping feeds land in Delta Lake, are scored for optimal open pricing in Model Serving, and publish from the RMS Workbench to the channel.
        components:
          - RMS Workbench
          - IDeaS G3 RMS
          - Lighthouse
          - Model Serving
          - Delta Lake
        stories:
          - title: easyJet modernises airline revenue management on Databricks
            url: https://www.databricks.com/customers/easyjet/lakebase
          - title: Amadeus optimizes travel pricing and personalization
            url: https://www.databricks.com/customers/amadeus
      - name: Conversational Booking
        short: Direct channel
        icon: genie
        summary: A natural-language assistant that searches, quotes and books direct.
        problem: Guests plan trips in their own words but the direct site answers only rigid date-and-room forms, so they defect to OTAs and the brand pays commission on demand it already had.
        who_benefits: Revenue Management
        how_built: Live availability and rates from Amadeus iHotelier are grounded in Genie and in agents built on Agent Bricks running on Databricks Apps, so guests search, compare and book direct against one governed rate and inventory model.
        components:
          - Agent Bricks
          - Genie
          - Databricks Apps
          - Amadeus iHotelier
          - Unity Catalog
      - name: Guest 360
        short: Customer 360
        icon: custlake
        summary: Booking, stay, spend and preference unified into one portfolio-wide guest profile.
        problem: Booking, stay, spend and preference data sit in separate systems, so the guest is a stranger at every property in the portfolio and no team can see the full relationship.
        who_benefits: Marketing & Loyalty
        how_built: Guest identities from Oracle OPERA Cloud, Salesforce Loyalty and SevenRooms CRM are unified in CustomerLake under Unity Catalog, giving one governed guest profile every property and channel reads.
        components:
          - CustomerLake
          - Oracle OPERA Cloud
          - Salesforce Loyalty
          - SevenRooms CRM
          - Unity Catalog
        stories:
          - title: Hotels.com personalizes recommendations at scale
            url: https://www.databricks.com/customers/hotels-com
          - title: Hilton Grand Vacations unifies guest data for personalization
            url: https://www.databricks.com/customers/hilton-grand-vacations
      - name: Disruption Response
        short: Operations
        icon: network
        summary: Overbooking, walks and weather disruptions resolved with next-best actions.
        problem: When a property oversells or weather strands arrivals, staff scramble across PMS, CRS and phone lines to rebook and rebalance, so guests wait and the recovery cost lands unmanaged.
        who_benefits: Front Office & Ops
        how_built: Reservation, availability and disruption signals stream into Lakehouse//RT where agents built on Agent Bricks propose rebooking and walk decisions grounded in Oracle OPERA Cloud, actioned in Property Command.
        components:
          - Property Command
          - Agent Bricks
          - Oracle OPERA Cloud
          - Lakehouse//RT
          - Model Serving
      - name: Labour Scheduling
        short: Operations
        icon: people
        summary: Housekeeping and F&B labour matched to forecast occupancy.
        problem: Housekeeping and F&B rosters are built on static templates, so a demand swing leaves rooms unturned and outlets over- or understaffed, driving overtime and slow service recovery.
        who_benefits: Front Office & Ops
        how_built: Forecast occupancy and outlet covers from operations feeds are scored in Model Serving against labour standards, and the resulting shift plan is read in Property Command and AI/BI.
        components:
          - Property Command
          - Oracle OPERA Cloud
          - Agilysys InfoGenesis
          - Model Serving
          - AI/BI
      - name: Predictive Maintenance
        short: Engineering
        icon: iot
        summary: HVAC, elevator and guestroom faults predicted before they hit the guest.
        problem: Building and guestroom equipment is fixed only after it fails, so an out-of-order elevator or a failed HVAC unit becomes a guest complaint and an emergency callout at premium cost.
        who_benefits: Front Office & Ops
        how_built: Building-management and work-order signals land in Lakehouse//RT, and remaining-life models tracked in MLflow score in Model Serving to raise preventive work orders in Property Command before failure.
        components:
          - Property Command
          - Lakehouse//RT
          - Model Serving
          - MLflow
          - Delta Lake
      - name: Next Best Offer
        short: CRM
        icon: market
        summary: The single best offer for each guest ranked across room, F&B and experiences.
        problem: Marketing blasts the same promotion to everyone, so a spa guest gets a golf offer and the moment to convert the right add-on at the right price passes unused.
        who_benefits: Marketing & Loyalty
        how_built: Guest 360 signals feed next-best-offer models in Model Serving with features in Feature Store, so the Loyalty Console ranks the single best room, dining or experience offer per guest.
        components:
          - Loyalty Console
          - CustomerLake
          - Model Serving
          - Feature Store
          - Salesforce Loyalty
      - name: Ancillary Attach
        short: F&B
        icon: product
        summary: Spa, dining and experience attach scored at booking and check-in.
        problem: Spa, dining and experience revenue is left to chance at the desk, so high-intent guests are never offered the add-on that fits and ancillary spend trails the property's real potential.
        who_benefits: Marketing & Loyalty
        how_built: Stay and preference data feed attach-propensity features in Feature Store, scored by Model Serving to surface the right spa or dining offer in the Loyalty Console at check-in.
        components:
          - Loyalty Console
          - Book4Time Spa
          - SevenRooms CRM
          - Model Serving
          - Feature Store
        stories:
          - title: 'From booking to bon voyage: dynamic offers across the guest journey'
            url: https://www.databricks.com/blog/booking-bon-voyage-how-ai-redefining-travel-hospitality-experience
      - name: Loyalty Tier Migration
        short: Loyalty
        icon: custlake
        summary: Tier upgrade and churn risk scored before renewal windows.
        problem: Loyalty tiers are reviewed in slow batch cycles, so members drift toward downgrade or churn before anyone notices and high-value guests get the same generic nudge as everyone else.
        who_benefits: Marketing & Loyalty
        how_built: Accrual, stay and engagement data unify in CustomerLake, and tier-migration and churn models tracked in MLflow are scored by Model Serving into the Loyalty Console before the renewal window.
        components:
          - Loyalty Console
          - Salesforce Loyalty
          - CustomerLake
          - Model Serving
          - MLflow
        stories:
          - title: How AI redefines loyalty engagement in travel and hospitality
            url: https://www.databricks.com/blog/booking-bon-voyage-how-ai-redefining-travel-hospitality-experience
          - title: MakeMyTrip achieves millisecond personalization at scale
            url: https://www.databricks.com/blog/how-makemytrip-achieved-millisecond-personalization-scale-databricks
      - name: 24/7 AI Concierge
        short: Guest service
        icon: genie
        summary: A round-the-clock assistant answering guest requests and booking services.
        problem: Guest questions and service requests arrive at all hours across chat, app and phone, but staff cannot cover every channel overnight, so requests queue and the experience slips exactly when it should feel effortless.
        who_benefits: Front Office & Ops
        how_built: Agents built on Agent Bricks and grounded in Genie answer guest requests, booking spa through Book4Time Spa and dining through SevenRooms CRM while routing room-service requests to the property workflow, grounded in governed Oracle OPERA Cloud data through Databricks Apps and escalating to staff when needed.
        components:
          - Agent Bricks
          - Genie
          - Databricks Apps
          - Oracle OPERA Cloud
          - SevenRooms CRM
          - Book4Time Spa
medallion:
  Bronze:
    short: Raw guest and booking feeds
    summary: PMS reservations, CRS availability, POS folios, loyalty transactions and OTA bookings, landed exactly as received so a rate or a stay can always be replayed.
  Silver:
    short: Conformed guest, stay, room
    summary: Guests, stays, room nights and rate plans resolved into single conformed entities across PMS, CRS and loyalty, with multi-property journeys stitched to one profile.
  Gold:
    short: RevPAR, ADR, occupancy
    summary: 'Contracted products commercial and operations teams run on: RevPAR and ADR by segment, occupancy forecast, guest satisfaction and ancillary attach rate.'
