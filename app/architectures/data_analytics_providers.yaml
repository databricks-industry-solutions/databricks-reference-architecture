pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Vendor Exec
        mark: Genie One
        summary: The CEO on the growth of the data and analytics franchise; the CFO on subscription revenue against the cost of acquiring and producing data; the Chief Commercial Officer on how signal, factor and index products are packaged, priced and sold.
        uses:
          - - Genie One
            - Ask what subscription revenue did last quarter, or which client is at risk of churn, without booking an analyst.
          - - AI/BI
            - Subscription revenue, active subscribers and product adoption on one certified set of Metric Views.
          - - Unity Catalog
            - One governed glossary, so "billable usage" and "active subscriber" mean one thing across the group.
        sub:
          - name: CEO
            cares: the growth of the data and analytics franchise.
          - name: CFO
            cares: subscription revenue against the cost of acquiring and producing data.
          - name: Chief Commercial Officer
            cares: how signal, factor and index products are packaged, priced and sold.
        ucs:
          - Factor & Alt-Data Packages
          - Usage & Licensing
          - Client Intelligence & Churn
      - name: Content & Signals
        mark: Model Serving
        summary: Data scientists building sentiment and event signals from news and content; quants engineering factor and alternative-data packages; the ESG and climate team scoring issuers for sustainable-investing products.
        uses:
          - - Model Serving
            - Sentiment, event and factor models scored across the coverage universe.
          - - MLflow
            - Every signal and factor model tracked for audit and reproduction.
          - - AI Functions
            - News and content screened for entities, sentiment and events at scale.
        sub:
          - name: Signals data science
            cares: sentiment and event signals from news and content.
          - name: Factor quants
            cares: factor and alternative-data packages engineered across the universe.
          - name: ESG & climate
            cares: issuer ESG and climate scores for sustainable-investing products.
        ucs:
          - Sentiment & Event Signals
          - Factor & Alt-Data Packages
          - ESG & Climate Analytics
      - name: Data Business
        mark: Data Products
        summary: The Chief Data Officer on the data and analytics catalogue; data product managers packaging signal, factor and index feeds; the licensing and entitlements team metering consumption and billing subscribers for what they actually use.
        uses:
          - - Data Products
            - Signal, factor, reference and index datasets published as contracted, discoverable products.
          - - OpenSharing
            - Live datasets delivered to subscribers through governed sharing that reduces bespoke exports.
          - - Unity Catalog
            - Entitlements, lineage and usage governed from the same catalogue the products live in.
        sub:
          - name: Chief Data Officer
            cares: the data and analytics catalogue end to end.
          - name: Data product managers
            cares: packaging signal, factor and index datasets.
          - name: Licensing & entitlements
            cares: metering consumption and billing subscribers for actual use.
        ucs:
          - Usage & Licensing
          - Feed Latency Optimization
          - Client Intelligence & Churn
      - name: Index Products
        mark: AI/BI
        summary: Index product managers launching and maintaining benchmarks; the index calculation team running real-time and end-of-day levels and rebalances; benchmark governance evidencing methodology, restatements and supporting IOSCO compliance to regulators and licensees.
        uses:
          - - AI/BI
            - Index levels, constituent weights and rebalance impact on one certified set of Metric Views.
          - - MLflow
            - Every index restatement and methodology change tracked for audit and reproduction.
          - - Unity Catalog
            - Constituent data and methodology governed with lineage from source to published level.
        sub:
          - name: Index product managers
            cares: launching and maintaining benchmarks and custom indices.
          - name: Index calculation
            cares: real-time and end-of-day levels and rebalances.
          - name: Benchmark governance
            cares: methodology, restatements and IOSCO compliance.
        ucs:
          - Custom Index Creation
          - ESG & Climate Analytics
          - Entity Resolution & MDM
      - name: Data Quality & Governance
        core: true
        mark: AI Functions
        summary: Data-quality engineers validating and reconciling incoming feeds; the MDM team resolving instruments, issuers and entities; the governance team proving lineage, provenance and benchmark compliance to subscribers and regulators.
        uses:
          - - AI Functions
            - Feeds screened for bad ticks, gaps and outliers across the catalogue at scale.
          - - Unity Catalog
            - Column-level lineage and provenance from source feed to published product.
          - - Genie One
            - Analysts ask where a published value came from in plain language.
        sub:
          - name: Data quality
            cares: validation, cleaning and reconciliation of incoming feeds.
          - name: MDM
            cares: resolving instruments, issuers and entities across feeds.
          - name: Governance
            cares: lineage, provenance and benchmark compliance.
        ucs:
          - Automated Data Cleaning
          - Entity Resolution & MDM
          - Lineage & Provenance
  - name: Technical
    icon: code
    tiles:
      - name: Feed Engineers
        mark: Lakeflow
        summary: Capture ITCH multicast, OPRA and consolidated-tape feeds and vendor feed handlers off Kafka, curate the depth and trade tables, and keep every tick feed fresh for calculation and distribution.
        uses:
          - - Lakeflow Connect
            - Managed connectors for matching-engine, reference and vendor sources.
          - - Auto Loader
            - Continuous ingestion of multicast and file feeds into Bronze with schema evolution.
          - - Lakewatch
            - Freshness on the tick and reference tables every desk and subscriber depends on.
        sub:
          - name: Ingestion Engineers
            cares: ITCH multicast, OPRA and consolidated-tape feeds captured off the wire on time.
          - name: Pipeline Engineers
            cares: depth and trade tables conformed with expectations on every tick feed.
          - name: Platform Reliability
            cares: freshness of the tick and reference tables every desk and subscriber depends on.
      - name: Index Quants
        mark: MLflow
        summary: Turn index methodology in Python and kdb+/q into production calculation, rebalancing and backtests, and own the libraries the index and benchmark teams run against.
        uses:
          - - Feature Store
            - Constituent and factor features defined once and read identically in research and calculation.
          - - MLflow
            - Every index calculation, restatement and backtest versioned and reproducible for audit.
          - - Model Serving
            - Index levels and rebalance impact computed in the live calculation path.
        sub:
          - name: Calculation Engineers
            cares: index methodology turned into production calculation and rebalancing.
          - name: Backtest Engineers
            cares: index restatements and backtests versioned and reproducible for audit.
          - name: Reference Data Engineers
            cares: constituent, identifier and corporate-actions data conformed for calculation.
      - name: App Developers
        mark: Apps
        summary: Ship the signal-studio, feed-operations, index and data-quality applications the data business works in, hosted next to governed data.
        uses:
          - - Apps
            - Operational screens with no separate web tier to run or secure.
          - - Lakebase
            - Serverless Postgres for entitlement, case and index-publication state with governed writes.
          - - Agent Bricks
            - Agents that draft a data-quality case or a feed-outage summary against governed tools.
        sub:
          - name: Full-Stack Engineers
            cares: the signal-studio, feed-operations and index screens the data business works in.
          - name: Agent Developers
            cares: agents that draft a data-quality case or feed-outage summary on governed tools.
          - name: Integration Engineers
            cares: entitlement, case and index-publication writeback into vendor systems.
