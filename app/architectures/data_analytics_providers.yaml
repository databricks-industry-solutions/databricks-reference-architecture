    tiles:
      - name: Multicast Feed Bus
        icon: stream
        summary: Exchange multicast market-data channels (ITCH and vendor feeds) captured off the wire and landed as structured depth and trade events.
        citations:
          - itch
        category: Streaming Market Data Bus
        what_it_is: Exchange multicast market-data channels (ITCH and vendor feeds) captured off the wire and landed as structured depth and trade events.
        who_uses_it: Feed engineering and platform reliability.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 1-5M messages/sec at peak
            interval: Continuous (sub-millisecond)
      - name: FIX / FAST Gateways
        icon: api
        summary: FAST-encoded market-data sessions with vendors parsed on arrival and landed as structured events; FIX order-entry from members is an exchange-affiliated optional variant.
        citations:
