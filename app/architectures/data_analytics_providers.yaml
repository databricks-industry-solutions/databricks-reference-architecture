agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Signals & Content Agent
        icon: genie
        summary: Ask about sentiment, event and factor signals and their coverage in plain language.
        feeds:
          - RavenPack
          - Dow Jones Newswires
          - Signals, index, usage, quality
        teams:
          - Content & Signals
          - Vendor Exec
          - Data Business
        questions:
          - Which securities show the strongest sentiment shift this week?
          - Which event signals fired across the coverage universe today?
          - How complete is our factor coverage across the universe?
          - Which alternative datasets add the most signal right now?
          - Where is signal quality degrading and why?
      - name: Data Revenue & Entitlements Agent
        icon: genie
        summary: Explore data-subscription revenue, usage and entitlement coverage.
        feeds:
          - Market Data Billing
          - LSEG Real-Time
          - Signals, index, usage, quality
        teams:
          - Data Business
          - Vendor Exec
          - Licensing & entitlements
        questions:
          - What did data-subscription revenue do last quarter by product?
          - Which subscribers consume the most billable usage right now?
          - Where is usage exceeding entitlement, and by how much?
          - Which feeds have the strongest adoption this year?
          - Which clients recently churned from a feed and what did they consume?
      - name: Index & Benchmarks Agent
        icon: genie
        summary: Ask about index levels, constituent weights and rebalance impact.
        feeds:
          - S&P DJI Indices
          - FTSE Russell
          - MSCI Indexes
          - Conformed feeds, entities, indices
        teams:
          - Index Products
          - Index calculation
          - Benchmark governance
        questions:
          - What are today's levels and the largest movers across our indices?
          - What is the projected turnover for the next rebalance?
          - Which constituents drive the most weight change this review?
          - How many restatements occurred this quarter and why?
          - Are all index calculations meeting their publication SLA?
      - name: Data Quality & Lineage Agent
        icon: genie
        summary: Investigate data cleaning, entity resolution and lineage across the catalogue.
        feeds:
          - SIX Reference Data
          - GLEIF LEI
          - Conformed feeds, entities, indices
        teams:
          - Data Quality & Governance
          - Data Business
          - Content & Signals
        questions:
          - Which datasets failed cleaning or reconciliation checks today?
          - Which entities are unresolved or duplicated across feeds?
          - What is the lineage of this published field back to source?
          - Which products are missing provenance for a client audit?
          - Where did a corporate action break a downstream feed?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Feed Latency Optimization
        short: Distribution
        icon: stream
        summary: Monitoring and optimizing tick, reference and signal feed delivery for latency and sequence gaps, distinguishing the wire dissemination plant from governed analytical products.
        problem: Feeds land in a low-latency plant that analytics cannot touch, so delivery latency and gaps are debugged from partial logs and subscribers hit drops before the vendor sees them.
        who_benefits: Data Business
        how_built: ITCH, OPRA and SIP feeds land through the Multicast Feed Bus and Zerobus into Lakehouse//RT; delivery latency and sequence gaps are computed to Gold and watched in Feed Ops Monitor, with analytical products served over Delta Sharing Feeds separately from wire dissemination.
        components:
          - Feed Ops Monitor
          - Multicast Feed Bus
          - Lakehouse//RT
          - Delta Sharing Feeds
          - Zerobus
        stories:
          - title: Nasdaq reinvents finance with Databricks
            url: https://www.databricks.com/customers/nasdaq
          - title: 'The boom of SOON: Coinbase streaming ingestion'
            url: https://www.databricks.com/customers/coinbase/streaming
      - name: Automated Data Cleaning
        short: Data quality
        icon: cdc
        summary: Automatically validating, deduplicating and reconciling incoming feeds against expectations so bad ticks, gaps and stale values are caught and corrected before they reach a product.
        problem: Data cleaning runs as brittle scripts per feed, so bad ticks, gaps and outliers slip into published products and clients find the errors before the vendor does.
        who_benefits: Data Quality & Governance
        how_built: Feeds land in Lakehouse//RT with declarative expectations; cleaning, outlier and reconciliation checks run in Lakeflow and AI Functions, with exceptions routed to the Data Quality Console.
        components:
          - Data Quality Console
          - Lakeflow
          - AI Functions
          - Lakehouse//RT
          - Unity Catalog
        stories:
          - title: Modernizing investment data platforms
            url: https://www.databricks.com/blog/2021/01/29/strategies-for-modernizing-investment-data-platforms.html
      - name: Custom Index Creation
        short: Benchmarks
        icon: chart
        summary: Designing, calculating and maintaining custom and thematic benchmarks, illustratively at the scale of thousands of indices, with a methodology audit trail for restatements.
        problem: Custom index launches run in bespoke engines that cannot scale to thousands of client benchmarks or replay a methodology change, so launches are slow and restatements are hard to defend.
        who_benefits: Index Products
        how_built: Constituent, pricing and corporate-actions data are conformed in the lakehouse; levels and rebalance impact are computed in Model Serving and signed off in the Index Cockpit against certified Metric Views.
        components:
          - Index Cockpit
          - Solactive
          - Model Serving
          - AI/BI
          - Index Publication
        stories:
          - title: Nasdaq reinvents finance with Databricks
            url: https://www.databricks.com/customers/nasdaq
          - title: S&P Global unifies data intelligence
            url: https://www.databricks.com/customers/sp-global
      - name: Sentiment & Event Signals
        short: Signals
        icon: aisvc
        summary: Turning news, filings and social content into governed sentiment and event signals mapped to securities and sectors, packaged as a product for subscribers.
        problem: Content arrives as unstructured text in many languages and formats, so building timely, deduplicated sentiment and event signals is slow and the mapping to securities is inconsistent.
        who_benefits: Content & Signals
        how_built: News and alternative content are ingested and grounded on entities in the lakehouse; Agent Bricks and AI Functions extract sentiment and events tracked in MLflow and served in the Signal Studio.
        components:
          - Signal Studio
          - RavenPack
          - AI Functions
          - MLflow
          - Model Serving
        stories:
          - title: LSEG and Databricks partner on AI-ready data via Delta Sharing
            url: https://www.lseg.com/en/media-centre/press-releases/2025/lseg-databricks-partner-bring-ai-ready-financial-data-natively-analytics-ai-apps-agents
          - title: S&P Global unifies data intelligence
            url: https://www.databricks.com/customers/sp-global
      - name: Factor & Alt-Data Packages
        short: Packages
        icon: product
        summary: Packaging factor, alternative-data and signal datasets as contracted products and delivering them to subscribers over sharing and marketplaces instead of bespoke file feeds.
        problem: Every new data package is a custom extract-and-FTP build, so time-to-launch is long, copies proliferate, and the vendor cannot see who consumes what or prove entitlement.
        who_benefits: Vendor Exec
        how_built: Curated factor and alt-data are published as contracted Data Products, discoverable in Unity Catalog and delivered over OpenSharing and Cloud Marketplaces to entitled Sharing Recipients, reducing bespoke file exports.
        components:
          - Data Products
          - Sharing Recipients
          - OpenSharing
          - Cloud Marketplaces
          - Unity Catalog
        stories:
          - title: LSEG and Databricks partner on AI-ready data via Delta Sharing
            url: https://www.lseg.com/en/media-centre/press-releases/2025/lseg-databricks-partner-bring-ai-ready-financial-data-natively-analytics-ai-apps-agents
          - title: S&P Global unifies data intelligence
            url: https://www.databricks.com/customers/sp-global
      - name: Usage & Licensing
        short: Licensing
        icon: identity
        summary: Metering exactly which subscriber consumed which dataset and republishing usage into billing, so data revenue is accurate and reporting to licensees is defensible.
        problem: Usage is reconstructed from delivery logs weeks after the fact, so under-reporting and over-entitlement go undetected and data revenue leaks between the feed and the invoice.
        who_benefits: Data Business
        how_built: Delivery and access events are conformed against entitlements in Unity Catalog; consumption is metered to Gold, reconciled against Market Data Billing and written back through Entitlement Writeback.
        components:
          - Entitlement Writeback
          - Unity Catalog
          - Subscriber APIs
          - AI/BI
          - Market Data Billing
        stories:
          - title: Governing B-PIPE entitlements on Databricks (industry solution)
            url: https://github.com/databricks-industry-solutions/bpipe-spark
      - name: ESG & Climate Analytics
        short: Sustainability
        icon: gavel
        summary: Producing ESG, carbon and climate-risk analytics mapped to issuers and instruments, packaged as a governed product for asset-manager and bank subscribers.
        problem: ESG and climate data arrive from many providers on different taxonomies, so issuer-level scores are inconsistent, hard to map to holdings and hard to defend to subscribers and regulators.
        who_benefits: Content & Signals
        how_built: MSCI ESG, climate and reference data are conformed against one entity master in the lakehouse; scores and climate metrics are computed to Gold and served over Delta Sharing and AI/BI.
        components:
          - MSCI ESG Research
          - GLEIF LEI
          - AI/BI
          - Delta Sharing Feeds
          - Unity Catalog
        stories:
          - title: S&P Global unifies data intelligence
            url: https://www.databricks.com/customers/sp-global
      - name: Entity Resolution & MDM
        short: MDM
        icon: db
        summary: Mastering typed instruments, issuers, indices and subscribers across FIGI, ISIN, LEI and internal symbols so every feed, index and product resolves to the right entity.
        problem: Vendor, venue and internal symbologies disagree, so the same instrument appears under many keys and joins across feeds, indices and products break in ways nobody can trace.
        who_benefits: Data Quality & Governance
        how_built: Typed instrument, issuer, index, subscriber and content masters are conformed with explicit relationships in Delta Lake, with Unity Catalog lineage and FIGI, ISIN and LEI scoped to the entities they identify.
        components:
          - GLEIF LEI
          - ANNA DSB ISIN/UPI
          - Bloomberg FIGI
          - Unity Catalog
          - Delta Lake
        stories:
          - title: S&P Global unifies data intelligence
            url: https://www.databricks.com/customers/sp-global
          - title: Investment management reference architecture
            url: https://www.databricks.com/resources/architectures/financial-services-investment-management-reference-architecture
      - name: Lineage & Provenance
        short: Provenance
        icon: network
        summary: Tracking captured lineage and source and version provenance across supported paths from source feed through transformation to product, so subscribers and auditors can trace the data.
        problem: Provenance lives in tribal knowledge and scattered scripts, so when a subscriber or auditor asks where a value came from, the vendor cannot show the path from source to product.
        who_benefits: Data Quality & Governance
        how_built: Feeds and transformations are governed in Unity Catalog with column-level lineage on Delta Lake, so captured provenance for supported published fields is queried and shared with subscribers on demand.
        components:
          - Unity Catalog
          - Delta Lake
          - Data Products
          - AI/BI
          - Data Quality Console
        stories:
          - title: S&P Global unifies data intelligence
            url: https://www.databricks.com/customers/sp-global
      - name: Client Intelligence & Churn
        short: Retention
        icon: chart
        summary: Analyzing subscriber usage, engagement and support signals to predict churn and find upsell so the commercial team acts before a client leaves.
        problem: Churn is noticed at renewal from anecdote, and the usage, engagement and support signals that would have flagged an at-risk client weeks earlier sit unused across systems.
        who_benefits: Vendor Exec
        how_built: Usage, delivery and CRM signals are conformed to Gold; churn and propensity models are scored in Model Serving and read in AI/BI and Genie so the commercial team acts early.
        components:
          - Salesforce CRM
          - Market Data Billing
          - Model Serving
          - AI/BI
          - Genie
medallion:
  Bronze:
    short: Raw feeds and content
    summary: OPRA and consolidated-tape ticks, news and alternative-data content, reference and corporate-actions announcements and index constituent files, landed exactly as received so a print or a signal can always be replayed as it stood.
  Silver:
    short: Conformed feeds, entities, indices
    summary: Ticks, instruments, issuers, indices, subscribers and content resolved into typed conformed entities across the feed, reference and index estates, with FIGI, ISIN and LEI identifiers reconciled and related through explicit relationships.
  Gold:
    short: Signals, index, usage, quality
    summary: 'Contracted products the data business runs on: sentiment and factor signals, custom index levels and rebalance impact, market-data consumption by subscriber and entitlement, and data-quality and lineage metrics.'
