name: Insurance (P&C)
description: 'Property and casualty carriers: underwriting and rating, policy administration and billing, first notice of loss and claims, catastrophe exposure, fraud, and loss reserving.'
sources:
  - name: Policy Administration
    icon: erp
    simplified: 3
    tiles:
      - name: Guidewire PolicyCenter
        icon: erp
        summary: 'The policy administration system of record: submissions, quotes, endorsements and renewals across personal and commercial lines, and the source of the policy and coverage.'
        citations:
          - guidewire-pc
        category: P&C Core / Policy Admin System
        what_it_is: Holds the system-of-record for submissions, quotes, endorsements and renewals across personal and commercial lines, and emits every policy and coverage transaction.
        who_uses_it: Underwriting Office, policy operations and Distribution & Agency teams.
        data_out:
          batch:
            types:
              - structured
            volume: 20-80 GB/day
            interval: Nightly batch + intraday deltas
          stream:
            types:
              - semi-structured
            volume: hundreds of transactions/sec at peak
            interval: Continuous CDC (near real-time)
      - name: Duck Creek Policy
        icon: erp
        summary: Cloud policy administration for rating, product configuration and policy lifecycle, the incumbent core where Guidewire is not.
        citations:
          - duck-creek
        category: P&C Core / Policy Admin System
        what_it_is: Cloud-based policy administration for rating, product configuration and the policy lifecycle, feeding the same policy and coverage entities where Duck Creek is the core.
        who_uses_it: Underwriting Office, product configuration and policy operations teams.
        data_out:
          batch:
            types:
              - structured
            volume: 10-50 GB/day
            interval: Nightly batch
          stream:
            types:
              - semi-structured
            volume: tens of transactions/sec
            interval: Continuous CDC
      - name: Majesco P&C Core
        icon: erp
        summary: P&C core suite for policy, billing and claims used by carriers and MGAs, feeding the same policy and coverage entities.
        citations:
          - majesco
        category: P&C Core / Policy Admin System
        what_it_is: P&C core suite covering policy, billing and claims for carriers and MGAs, emitting policy, coverage and premium transactions into the estate.
        who_uses_it: Policy operations, MGA program managers and Finance & Reinsurance teams.
        data_out:
          batch:
            types:
              - structured
            volume: 5-30 GB/day
            interval: Nightly batch
      - name: Earnix Rating
        icon: market
        summary: Rating and pricing engine where rate plans, algorithms and price optimisation are configured and served into the quote path.
        citations:
          - earnix
        category: Rating & Price Optimization Engine
        what_it_is: Configures and serves rate plans, rating algorithms and price-optimisation factors into the quote path, and emits the rate and factor tables behind each price.
        who_uses_it: Actuarial & Pricing, pricing analytics and Underwriting Office teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day rate tables + factors
            interval: Daily / on rate change
  - name: Claims Systems
    icon: opdb
    simplified: 2
    tiles:
      - name: Guidewire ClaimCenter
        icon: erp
        summary: 'The claims system of record: first notice of loss, adjuster notes, reserves and payments across the claim lifecycle.'
        citations:
          - guidewire-cc
        category: Claims Management System
        what_it_is: 'System of record for the claim lifecycle: first notice of loss, adjuster notes, reserves and payments, emitting claim, reserve and payment transactions.'
        who_uses_it: Claims Leadership, field adjusters and SIU & Fraud teams.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: 15-60 GB/day incl. notes
            interval: Nightly batch + intraday deltas
          stream:
            types:
              - semi-structured
            volume: hundreds of events/sec at peak
            interval: Continuous CDC
      - name: Duck Creek Claims
        icon: erp
        summary: Claims management for intake, assignment and settlement used where Duck Creek is the incumbent core.
        citations:
          - duck-creek-claims
        category: Claims Management System
        what_it_is: Handles claim intake, assignment and settlement where Duck Creek is the incumbent core, feeding claim, reserve and payment records.
        who_uses_it: Claims Leadership, field adjusters and claims operations teams.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: 5-30 GB/day incl. notes
            interval: Nightly batch
          stream:
            types:
              - semi-structured
            volume: tens of events/sec
            interval: Continuous CDC
      - name: CCC Intelligent Sol.
        core: true
        icon: product
        summary: Auto physical-damage estimating, repair network and total-loss valuation feeding claim severity and cycle time.
        citations:
          - ccc
        category: Auto Physical-Damage Estimating Platform
        what_it_is: Produces auto physical-damage estimates, repair-network assignments and total-loss valuations that drive claim severity and cycle time.
        who_uses_it: Claims Leadership, auto adjusters and material-damage teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 2-10 GB/day estimates + photos
            interval: Daily feed
          stream:
            types:
              - semi-structured
            volume: tens of estimates/sec
            interval: Continuous (API)
      - name: Snapsheet Claims
        icon: apps
        summary: 'Virtual and self-service claims: mobile FNOL, photo estimating and digital payments across the claim journey.'
        citations:
          - snapsheet
        category: Virtual Claims / Digital FNOL Platform
        what_it_is: Runs virtual and self-service claims with mobile first-notice-of-loss, photo estimating and digital payments, emitting FNOL, photo and payment events.
        who_uses_it: Claims Leadership, digital claims and customer-experience teams.
        data_out:
          stream:
            types:
              - semi-structured
              - unstructured
            volume: hundreds of events/sec incl. photos
            interval: Continuous (mobile / API)
  - name: Billing & Distribution
    icon: custlake
    simplified: 2
    tiles:
      - name: Guidewire Billing
        icon: erp
        summary: 'BillingCenter: direct and agency bill, invoicing, commissions and delinquency across the book.'
        citations:
          - guidewire-bc
        category: Insurance Billing System
        what_it_is: Runs direct and agency billing, invoicing, commissions and delinquency across the book, emitting billing, payment and commission transactions.
        who_uses_it: Finance & Reinsurance, billing operations and Distribution & Agency teams.
        data_out:
          batch:
            types:
              - structured
            volume: 5-20 GB/day
            interval: Nightly billing cycle + intraday deltas
      - name: Salesforce FSC
        icon: crm
        summary: Financial Services Cloud for policyholder and agency relationships, service cases and next-best-action.
        citations:
          - salesforce-fsc
        category: Insurance CRM
        what_it_is: Holds policyholder and agency relationships, service cases and next-best-action across channels, emitting account, case and activity events.
        who_uses_it: Distribution & Agency, service teams and Marketing teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-4 GB/day
            interval: Hourly / nightly sync
          stream:
            types:
              - semi-structured
            volume: tens of events/sec
            interval: Continuous CDC
      - name: Vertafore AMS360
        icon: sheet
        summary: Agency management system carrying agency-side policies, downloads and commissions into the carrier estate.
        citations:
          - vertafore
        category: Agency Management System
        what_it_is: Agency-side management system carrying policies, carrier downloads and commissions into the carrier estate, feeding agency book-of-business data.
        who_uses_it: Distribution & Agency, agency operations and commission-accounting teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-3 GB/day
            interval: Daily agency downloads
      - name: Applied Epic
        icon: sheet
        summary: Agency and brokerage management platform feeding submissions, bind requests and book-of-business data.
        citations:
          - applied-epic
        category: Agency Management System
        what_it_is: Agency and brokerage management platform feeding submissions, bind requests and book-of-business data into the carrier estate.
        who_uses_it: Distribution & Agency, brokerage operations and new-business teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-3 GB/day
            interval: Daily agency downloads
  - name: Risk & External Data
    icon: market
    tiles:
      - name: Verisk ISO
        icon: market
        summary: Industry statistical, loss-cost and policy-form reference against which rate plans and coverage language are built and validated.
        citations:
          - verisk
        category: Insurance Statistical & Loss-Cost Bureau
        what_it_is: Supplies industry statistical data, advisory loss costs and standard policy forms against which rate plans and coverage language are built and validated.
        who_uses_it: Actuarial & Pricing, product filing and Underwriting Office teams.
        data_out:
          batch:
            types:
              - structured
            volume: GBs (reference + loss costs)
            interval: Periodic circular / on release
      - name: LexisNexis Risk
        core: true
        icon: partner
        summary: Motor vehicle records, prior claims, credit-based insurance scores and identity signals used at quote and renewal.
        citations:
          - lexisnexis
        category: Insurance Risk Data & Scoring Provider
        what_it_is: Provides motor vehicle records, prior-claims history, credit-based insurance scores and identity signals used at quote and renewal.
        who_uses_it: Underwriting Office, Actuarial & Pricing and SIU & Fraud teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 1-3 GB/day
            interval: Daily + on-demand pulls
          stream:
            types:
              - semi-structured
            volume: 100s of API calls/sec
            interval: Continuous (API at quote)
      - name: ISO ClaimSearch
        icon: gavel
        summary: The contributory P&C claims database and fraud-scoring network SIU and adjusters check every loss against.
        citations:
          - iso-claimsearch
        category: Contributory Claims Database & Fraud Network
        what_it_is: Contributory P&C claims database and fraud-scoring network every loss is matched against for prior-claims links and organised-fraud detection.
        who_uses_it: SIU & Fraud, Claims Leadership and special-investigation teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 1-4 GB/day matches + scores
            interval: Daily + on-demand
          stream:
            types:
              - semi-structured
            volume: tens of match calls/sec
            interval: Continuous (API at FNOL)
  - name: Catastrophe Models
    icon: iot
    simplified: 2
    tiles:
      - name: Moody's RMS
        icon: iot
        summary: 'Catastrophe models for hurricane, earthquake and flood: event sets, exceedance curves and PML by peril and region.'
        citations:
          - moodys-rms
        category: Catastrophe Modeling Platform
        what_it_is: Runs catastrophe models for hurricane, earthquake and flood, producing event sets, exceedance curves and PML by peril and region.
        who_uses_it: Underwriting Office, cat modelling and Finance & Reinsurance teams.
        data_out:
          batch:
            types:
              - structured
            volume: 10-100 GB/model run
            interval: Periodic model runs + on-event
      - name: Verisk Touchstone
        icon: market
        summary: Catastrophe risk modelling platform for exposure, loss estimation and portfolio accumulation across perils.
        citations:
          - verisk-touchstone
        category: Catastrophe Modeling Platform
        what_it_is: Models exposure, loss estimation and portfolio accumulation across perils, producing modelled losses and accumulation views for the book.
        who_uses_it: Underwriting Office, cat modelling and portfolio management teams.
        data_out:
          batch:
            types:
              - structured
            volume: 10-80 GB/model run
            interval: Periodic model runs + on-event
      - name: CoreLogic Hazard
        icon: globe
        summary: Property characteristics and peril hazard data used to underwrite exposure at the address and geocode level.
        citations:
          - corelogic
        category: Property & Hazard Data Provider
        what_it_is: Supplies property characteristics and peril hazard data used to underwrite exposure at the address and geocode level.
        who_uses_it: Underwriting Office, cat modelling and property-underwriting teams.
        data_out:
          batch:
            types:
              - structured
            volume: GBs (property + hazard reference)
            interval: Periodic refresh + on-demand
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Actuarial & Reserving
        icon: fed
        summary: Reserving triangles, actuarial marts and reinsurance bordereaux left where they are and queried in place under Unity Catalog, which avoids a second copy of the booked reserves.
        category: Actuarial Data Warehouse
        what_it_is: Legacy reserving triangles, actuarial marts and reinsurance bordereaux kept in the incumbent warehouse and queried in place through federation instead of being copied.
        who_uses_it: Actuarial & Pricing, reserving actuaries and Finance & Reinsurance teams.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale historical marts
            interval: Queried on demand (federated)
  - name: Data Formats
    icon: zbraces
    tiles:
      - name: 'ACORD P&C XML'
        icon: zbraces
        fmt: 'ACORD'
        summary: 'ACORD Property & Casualty XML standards for policy, claims and billing data.'
        spec_url: https://www.acord.org/standards-architecture/acord-data-standards
        spark_connector: 'spark-xml'
        spark_repo: https://github.com/databricks/spark-xml
        databricks_resource: https://docs.databricks.com/aws/en/query/formats/xml
        source_systems:
          - 'Guidewire'
          - 'Duck Creek'
          - 'Majesco'
      - name: 'ACORD AL3'
        icon: zbraces
        fmt: 'AL3'
        summary: 'Legacy ACORD flat-file standard for agency-carrier P&C data interchange.'
        spec_url: https://www.acord.org/standards-architecture/acord-data-standards
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    tiles:
      - name: CMT Telematics
        icon: iot
        summary: 'Streaming driving events from the telematics provider: trips, hard-braking and mileage powering usage-based rate and claims reconstruction.'
        citations:
          - cmt
        category: Telematics Data Provider
        what_it_is: Streams driving events from the telematics provider, trips, hard-braking and mileage, powering usage-based rate and claims reconstruction.
        who_uses_it: Actuarial & Pricing, telematics/UBI and Claims Leadership teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 2-10k trip events/sec at peak
            interval: Continuous trip stream
      - name: NOAA Weather Data
        icon: stream
        summary: Storm events, radar and peril feeds joined to exposure for catastrophe response and parametric triggers.
        citations:
          - noaa
        category: Weather & Peril Data Feed
        what_it_is: Supplies storm events, radar and peril feeds joined to exposure for catastrophe response and parametric trigger evaluation.
        who_uses_it: Underwriting Office, cat response and Claims Leadership teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 100s of events/sec during events
            interval: Continuous feed (event-driven)
      - name: Xactimate Estimating
        core: true
        icon: product
        summary: Property loss and restoration estimates from the industry estimating standard, feeding claim severity and reserves.
        citations:
          - xactware
        category: Property Claims Estimating Platform
        what_it_is: Produces property loss and restoration estimates from the industry estimating standard, feeding claim severity and reserve setting.
        who_uses_it: Claims Leadership, property adjusters and reserving teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 1-5 GB/day estimates
            interval: Daily feed
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Underwriting Office
        mark: Genie One
        summary: The Chief Underwriting Officer on portfolio mix, rate adequacy and the combined ratio; the head of portfolio management on accumulation and appetite; the reinsurance buyer on ceded structure and PML.
        uses:
          - - Genie One
            - Ask what a segment's loss ratio or PML is this quarter without booking analyst time.
          - - AI/BI
            - Combined ratio, rate adequacy and exposure on one certified set of Metric Views.
          - - Unity Catalog
            - Certification and the business glossary, so "combined ratio" and "exposure" mean one thing across the carrier.
        sub:
          - name: Chief Underwriting Officer
            cares: portfolio mix, rate adequacy and the combined ratio.
          - name: Portfolio Management
            cares: accumulation, appetite and line-of-business steering.
          - name: Reinsurance Buyer
            cares: ceded structure, PML and treaty economics.
        ucs:
          - Underwriting Triage
          - Catastrophe Risk
          - Pricing & Rating
      - name: Claims Leadership
        mark: Lakehouse//RT
        summary: The VP of claims on cycle time, leakage and loss-adjustment expense; the SIU and fraud lead on referral quality and recovery; field adjusting on assignment, severity and reserve accuracy.
        uses:
          - - Claims Command Center
            - Severity and fraud scores on a claim before it is assigned.
          - - Lakehouse//RT
            - Live claim, telematics and photo state at the latency a claim moves at.
          - - Model Serving
            - Severity and fraud models scored inside the claims path.
        sub:
          - name: VP Claims
            cares: cycle time, leakage and loss-adjustment expense.
          - name: SIU & Fraud
            cares: referral quality, recovery and organised-fraud rings.
          - name: Field Adjusting
            cares: assignment, severity and reserve accuracy.
        ucs:
          - Claims Automation
          - Fraud Detection (SIU)
          - Subrogation Recovery
      - name: Actuarial & Pricing
        core: true
        mark: Model Serving
        summary: Pricing actuaries setting rate plans against ISO loss costs and the filed rate; reserving actuaries booking IBNR and case reserves; the telematics team turning driving behaviour into usage-based rate.
        uses:
          - - Earnix Rating
            - Rate adequacy and loss-cost trend before a rate change is filed.
          - - Model Serving
            - GLM and approved rating models scored in the quote path; exploratory willingness-to-pay analysis kept separate until filed and permitted.
          - - MLflow
            - Every rate and reserving model versioned for the filing and audit.
        sub:
          - name: Chief Actuary
            cares: rate adequacy, reserve strength and the filed rate plan.
          - name: Pricing Actuary
            cares: segment rate, loss cost and competitive position.
          - name: Reserving Actuary
            cares: IBNR, case reserves and development triangles.
        ucs:
          - Pricing & Rating
          - Loss Reserving
          - Catastrophe Risk
      - name: Distribution & Agency
        mark: AI/BI
        summary: The chief distribution officer on agency production and mix; agency managers on quote-to-bind, retention and loss ratio by agent; the direct and digital team on quote conversion and customer lifetime value.
        uses:
          - - AI/BI
            - Production, quote-to-bind and retention on certified Metric Views.
          - - Genie One
            - Ask which agencies are growing off-appetite this month without a report pull.
          - - Model Serving
            - Retention and cross-sell propensity scored per policyholder.
        sub:
          - name: Chief Distribution Officer
            cares: agency production, mix and channel economics.
          - name: Agency Managers
            cares: quote-to-bind, retention and loss ratio by agent.
          - name: Direct & Digital
            cares: quote conversion and customer lifetime value.
        ucs:
          - Customer 360
          - Distribution & Producer Analytics
          - Contact-Center AI
      - name: Finance & Reinsurance
        mark: AI/BI
        summary: The CFO on combined ratio, capital and investor reporting; the ceded-reinsurance team on treaty recoveries and bordereaux; investor reporting on statutory, IFRS 17 and solvency results.
        uses:
          - - AI/BI
            - Combined ratio, capital and ceded recoveries on certified views.
          - - Genie One
            - Ask what ceded recoveries are outstanding this quarter without a finance pull.
          - - Unity Catalog
            - One definition of premium, loss and reserve across finance and actuarial.
        sub:
          - name: CFO
            cares: combined ratio, capital and the investor story.
          - name: Ceded Reinsurance
            cares: treaty recoveries, bordereaux and reinstatement.
          - name: Investor Reporting
            cares: statutory, IFRS 17 and solvency results.
        ucs:
          - Loss Reserving
          - Catastrophe Risk
  - name: Technical
    icon: code
    tiles:
      - name: Actuarial Engineering
        mark: Lakeflow
        summary: Land policy, claims, billing and bordereaux extracts from Guidewire and Duck Creek, build loss-development triangles and exposure tables; own Bronze to Silver and the pager when the reserving and pricing tables stall.
        uses:
          - - Lakeflow Connect
            - Managed connectors for policy admin, claims and billing cores.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on premium and loss feeds.
          - - Lakewatch
            - Freshness on the triangles and exposure tables actuaries read each close.
      - name: Claims ML Engineers
        mark: MLflow
        summary: Severity, fraud-propensity and image-damage models built from ClaimSearch, telematics and loss photos through CCC and Snapsheet; whether they still hold as fraud patterns and repair costs shift.
        uses:
          - - Feature Store
            - Claim, party and telematics features read identically in training and serving.
          - - MLflow
            - Every severity and fraud model tracked for audit and reproduction.
          - - Model Serving
            - Severity and fraud models scored inside the claims path.
      - name: Pricing Analytics
        mark: Model Serving
        summary: GLM and gradient-boosted pricing models built in the lakehouse and pushed into the Earnix rating engine, tested against ISO loss costs and the filed rate plan before a rate change is bound.
        uses:
          - - Model Serving
            - Rating models scored in the quote path using approved, jurisdiction-permitted factors, with willingness-to-pay analysis kept exploratory.
          - - MLflow
            - Every rate model versioned against the filed plan for audit.
          - - AI/BI
            - Rate adequacy and loss-cost trends on certified Metric Views.
consumers:
  - name: BI & Productivity
    icon: chart
    from: bi
    tiles:
      - name: Tableau / Power BI
        icon: chart
        summary: Underwriting, claims and finance dashboards against SQL warehouses with Unity Catalog permissions enforced end to end.
      - name: Microsoft Teams
        icon: chat
        summary: Genie in Teams for governed answers on loss ratio, reserves and cat exposure in the channel the business already works in.
      - name: Notebooks & IDEs
        icon: notebook
        summary: Actuarial and data-science notebooks and IDEs against governed policy, claim and exposure data.
  - name: Distribution & Partners
    icon: partner
    tiles:
      - name: Agent & Broker Portal
        icon: api
        summary: Quote status, appetite and book-of-business insight served to agencies and brokers over governed APIs.
      - name: Reinsurer Data Sharing
        core: true
        icon: share
        summary: Exposure, bordereaux and loss data shared to reinsurers and brokers over Delta Sharing rather than file exchange.
      - name: Salesforce Activation
        icon: crm
        summary: Retention and cross-sell signals written back to Financial Services Cloud for service and sales action.
        citations:
          - salesforce-fsc
  - name: Operational Writeback
    icon: opdb
    tiles:
      - name: PolicyCenter Writeback
        icon: erp
        summary: Rating, renewal and appetite decisions written back into the policy admin system so the answer reaches the quote path.
        citations:
          - guidewire-pc
      - name: ClaimCenter Writeback
        core: true
        icon: erp
        summary: Severity, fraud and reserve recommendations written into the claims system engineering already works in.
        citations:
          - guidewire-cc
      - name: Rating Engine Sync
        icon: market
        summary: Approved, jurisdiction-permitted rating factors synced into the rating engine behind the quote, separate from exploratory price-optimisation analysis.
        citations:
          - earnix
  - name: Regulatory & Reporting
    icon: gavel
    tiles:
      - name: Statutory & NAIC
        icon: gavel
        summary: Statutory statements and state rate and market-conduct filings produced from the same governed tables the carrier runs on.
      - name: IFRS 17 & Solvency
        core: true
        icon: sheet
        summary: Reserving, solvency and IFRS 17 reporting filed from contracted Gold products.
  - name: Published Products
    icon: product
    tiles:
      - name: Data Products
        icon: product
        summary: Published, contracted products discoverable in Unity Catalog Domains and shared over OpenSharing.
      - name: Sharing Recipients
        core: true
        icon: share
        summary: Reinsurers, MGAs and audit partners reading governed live tables that reduce routine file duplication.
  - name: Databricks Apps
    icon: apps
    tiles:
      - name: Claims Command Center
        icon: gauge
        short: Triage & severity
        summary: 'The screen the claims desk runs the day from: severity, fraud and subrogation scores on every open claim, next-best-action and reserve guidance, on Databricks Apps over Lakebase.'
      - name: Underwriting Workbench
        icon: market
        short: Submission triage
        summary: Where underwriters see the submission scored against appetite, prior claims and exposure before they quote, with ISO and hazard data joined in one view.
      - name: Cat Response Console
        icon: iot
        short: Event exposure
        summary: Live catastrophe exposure by peril and geography as a storm tracks, so claims, reinsurance and customer teams mobilise against the book actually in the footprint.
      - name: Fraud & SIU Console
        icon: gavel
        short: Investigations
        summary: Referrals ranked by fraud score with the ClaimSearch and network links that support them, so SIU works the strongest cases first.
  - name: AI/BI Dashboards
    icon: aibi
    tiles:
      - name: Combined Ratio & Rate Adequacy
        icon: aibi
        summary: Loss and combined ratio, rate adequacy and premium on certified underwriting Metric Views.
        kpis:
          - Loss ratio
          - Combined ratio
          - Rate adequacy
          - Written premium
          - Retention rate
        teams:
          - Underwriting Office
          - Actuarial & Pricing
          - Finance & Reinsurance
      - name: Claims Performance
        icon: aibi
        summary: Cycle time, loss-adjustment expense, leakage and reserve accuracy across the claims book.
        kpis:
          - Cycle time
          - Loss-adjustment expense
          - Leakage
          - Claim severity
          - Reserve accuracy
        teams:
          - Claims Leadership
          - Field Adjusting
          - SIU & Fraud
      - name: Catastrophe Exposure & PML
        icon: aibi
        summary: Modelled PML, accumulation, modeled treaty recoveries and booked outstanding recoverables by peril and treaty.
        kpis:
          - Gross PML
          - Net PML
          - Accumulation
          - Ceded recoveries
          - Reinstatement cost
        teams:
          - Underwriting Office
          - Finance & Reinsurance
          - Reinsurance Buyer
      - name: Distribution & Growth
        icon: aibi
        summary: Agency production, quote-to-bind, retention and loss ratio by agent.
        kpis:
          - Quote-to-bind
          - Retention rate
          - Loss ratio by agent
          - New business premium
          - Customer lifetime value
        teams:
          - Distribution & Agency
          - Agency Managers
          - Chief Distribution Officer
  - name: Agent Harnesses
    icon: agents
    simplified: 4
    tiles:
      - name: Omnigent OSS
        icon: omni
        short: Databricks, open source
        summary: Open-source meta-harness above existing agent frameworks, enabling agent composition, collaboration and centralised governance from one interface.
        capabilities:
          - Build
          - Deploy
          - Optimize
          - Govern
        related:
          - Agent Bricks
          - Unity Gateway
      - name: Claude Code
        core: true
        icon: code
        short: 3rd-party harness
        summary: Anthropic's coding harness working against the platform through MCP, with spend, routing and policy governed by Unity Gateway.
      - name: OpenAI Codex
        core: true
        icon: code
        short: 3rd-party harness
        summary: OpenAI's coding harness connected over MCP, governed at runtime by Unity Gateway rather than trusted by configuration.
      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Underwriting & Pricing Agent
        icon: genie
        summary: Ask about portfolio mix, rate adequacy and loss ratio by segment in plain language.
        feeds:
          - Guidewire PolicyCenter
          - Earnix Rating
          - Verisk ISO
          - Loss ratio, reserves, cat PML
        teams:
          - Underwriting Office
          - Actuarial & Pricing
          - Chief Underwriting Officer
        questions:
          - What is our loss ratio by line of business and segment this quarter?
          - Which segments are showing the weakest rate adequacy right now?
          - How has written premium grown by product versus last year?
          - Which agencies are binding business off our stated appetite?
          - What is the combined ratio trend by line over the last four quarters?
      - name: Claims & SIU Agent
        icon: genie
        summary: Explore cycle time, severity, leakage and SIU referrals across the claims book.
        feeds:
          - Guidewire ClaimCenter
          - CCC Intelligent Sol.
          - ISO ClaimSearch
          - Conformed policy, claim, party
        teams:
          - Claims Leadership
          - SIU & Fraud
          - Field Adjusting
        questions:
          - What is average claim cycle time by line and severity band?
          - Which open claims have the highest fraud score right now?
          - Where is leakage running above target across the book?
          - How accurate are our initial reserves versus final paid by line?
          - Which claims have ClaimSearch links to prior losses on other policies?
      - name: Catastrophe & Reinsurance Agent
        icon: genie
        summary: Ask about exposure, PML and ceded recoveries by peril and treaty, distinguishing modeled treaty recoveries from booked outstanding recoverables.
        feeds:
          - Moody's RMS
          - Verisk Touchstone
          - CoreLogic Hazard
          - Loss ratio, reserves, cat PML
        teams:
          - Underwriting Office
          - Finance & Reinsurance
          - Reinsurance Buyer
        questions:
          - What is our gross and net PML by peril and region today?
          - Which counties drive the most hurricane accumulation in the book?
          - How much ceded recovery is outstanding on the last cat event?
          - What is our net position after the current reinsurance program?
          - Where has exposure grown fastest against appetite this year?
      - name: Distribution & Agency Agent
        icon: genie
        summary: Answer agency production, quote-to-bind and retention questions across channels.
        feeds:
          - Salesforce FSC
          - Applied Epic
          - Guidewire Billing
          - Conformed policy, claim, party
        teams:
          - Distribution & Agency
          - Agency Managers
          - Direct & Digital
        questions:
          - What is quote-to-bind by agency and product this month?
          - Which agencies have the best retention and loss ratio combined?
          - Where are policies lapsing for billing or delinquency reasons?
          - Which policyholders look like cross-sell candidates by segment?
          - What is quote conversion in the direct and digital channel?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Claims Automation
        short: Claims
        icon: gauge
        summary: Straight-through intake, triage and assignment for eligible low-complexity claims with severity scoring, next-best-action and reserve recommendations, so adjusters spend their time on the claims that need them.
        problem: Claims arrive as FNOL calls, photos, PDFs and telematics across different systems; triaged by hand, simple claims wait behind complex ones and leakage and cycle time run away.
        who_benefits: Claims Leadership
        how_built: Policy, claim and telematics feeds land through Lakeflow; severity is scored in Model Serving and documents parsed with Document Intelligence, and the Claims Command Center on Lakebase drives assignment and reserves.
        components:
          - Claims Command Center
          - Guidewire ClaimCenter
          - AI Functions
          - Model Serving
          - Lakebase
        stories:
          - title: 'Smart Claims: automating P&C claims on Databricks'
            url: https://www.databricks.com/solutions/accelerators/smart-claims-for-insurance
          - title: Smart Claims end-to-end processing demo
            url: https://www.databricks.com/resources/demos/tutorials/lakehouse-platform/dbdemos-fsi-smart-claims
      - name: Fraud Detection (SIU)
        short: Fraud
        icon: gavel
        summary: Scoring every loss against contributory claims history and network links so organised and opportunistic fraud is referred to SIU early, not after it is paid.
        problem: Fraud is caught late or by intuition; without checking each loss against the industry claims network and party links, rings pay out before a referral is ever raised.
        who_benefits: Claims Leadership
        how_built: Claims are matched against ISO ClaimSearch and LexisNexis signals in the lakehouse; fraud-propensity models score referrals in Model Serving and Lakehouse//RT feeds the Fraud & SIU Console.
        components:
          - Fraud & SIU Console
          - ISO ClaimSearch
          - LexisNexis Risk
          - Model Serving
          - Lakehouse//RT
        stories:
          - title: 'Smart Claims: fraud scoring for insurers on Databricks'
            url: https://www.databricks.com/solutions/accelerators/smart-claims-for-insurance
      - name: Underwriting Triage
        short: Underwriting
        icon: market
        summary: Scoring submissions against appetite, prior claims and exposure before quote, so underwriters spend time on the risks worth writing.
        problem: Submissions come in faster than they can be worked, and prior-claims, MVR and exposure context sits in separate systems, so good risks are missed and off-appetite risks bound.
        who_benefits: Underwriting Office
        how_built: PolicyCenter submissions are enriched with Verisk ISO and hazard data in the lakehouse; appetite and win-propensity are scored with AI Functions and Model Serving in the Underwriting Workbench.
        components:
          - Underwriting Workbench
          - Guidewire PolicyCenter
          - Verisk ISO
          - AI Functions
          - Model Serving
        stories:
          - title: Gjensidige advances underwriting precision with Databricks
            url: https://www.databricks.com/customers/gjensidige
      - name: Pricing & Rating
        short: Pricing
        icon: chart
        summary: Moving from static annual rate tables to segmented, model-driven rate served into the quote, tested against loss costs and the filed plan.
        problem: Static rate plans cannot express true risk, so rate is inadequate on some segments and uncompetitive on others, and every change waits on a slow filing cycle.
        who_benefits: Actuarial & Pricing
        how_built: ISO loss costs and internal experience are conformed in the lakehouse; GLM and gradient-boosted models tracked in MLflow score through Model Serving into the Earnix rating engine using only approved, jurisdiction-permitted factors, on definitions certified in Unity Catalog.
        components:
          - Earnix Rating
          - Model Serving
          - MLflow
          - AI/BI
          - Unity Catalog
        stories:
          - title: Gjensidige runs one common pricing platform on Databricks
            url: https://www.databricks.com/customers/gjensidige
      - name: Catastrophe Risk
        short: Exposure
        icon: iot
        summary: Portfolio exposure and PML by peril from cat models and hazard data, so accumulation and reinsurance are managed before the season, not after the event.
        problem: Exposure sits in modelling silos and stale extracts; accumulation and PML cannot be seen across the live book, so the carrier learns its concentration only when the storm lands.
        who_benefits: Underwriting Office
        how_built: Moody's RMS and Verisk Touchstone event sets and CoreLogic hazard are joined to the live exposure in the lakehouse; PML and accumulation are explored in AI/BI and surfaced in the Cat Response Console.
        components:
          - Cat Response Console
          - Moody's RMS
          - Verisk Touchstone
          - CoreLogic Hazard
          - AI/BI
        stories:
          - title: Catastrophe modeling reference architecture for insurance
            url: https://www.databricks.com/resources/architectures/catastrophe-modeling-reference-architecture-for-insurance
      - name: Contact-Center AI
        short: Service
        icon: chat
        summary: FNOL call summarization, agent assist and self-service deflection across the policyholder contact center.
        problem: Contact-center staff switch between policy, billing and claims screens to take a first notice of loss or answer a policyholder, so handle time is long, wrap-up is manual and callers repeat themselves.
        who_benefits: Claims Leadership
        how_built: Call transcripts and case data conform under Unity Catalog, agents built on Agent Bricks summarize calls and draft next steps against governed policy and claim data, and deflection is served through Databricks Apps.
        components:
          - Snapsheet Claims
          - Salesforce FSC
          - Agent Bricks
          - AI/BI
      - name: Loss Reserving
        short: Actuarial
        icon: sheet
        summary: Building development triangles and IBNR from conformed claims and premium, so reserves are strengthened or released on current data, not a quarter-old extract.
        problem: Reserving runs on hand-built triangles from stale extracts; by the time IBNR is booked the picture has moved, and the working is hard to audit or reproduce.
        who_benefits: Actuarial & Pricing
        how_built: Claims and premium are conformed to certified Gold; triangles and IBNR models tracked in MLflow run against the Actuarial & Reserving marts and are published through AI/BI on Unity Catalog definitions.
        components:
          - Actuarial & Reserving
          - MLflow
          - AI/BI
          - Unity Catalog
          - Model Serving
        stories:
          - title: Milliman accelerates actuarial modeling on Databricks
            url: https://www.databricks.com/customers/milliman
      - name: Subrogation Recovery
        short: Recovery
        icon: partner
        summary: Finding the claims where a third party is liable and pursuing recovery, before the subrogation window closes and the money is lost.
        problem: Subrogation opportunities hide in adjuster notes and documents; identified late or missed, recoverable dollars are written off and never pursued.
        who_benefits: Claims Leadership
        how_built: Claim notes and documents are parsed with Document Intelligence and AI Functions; a recovery-propensity model scores each claim in Model Serving and flags candidates in the claims workflow on Lakebase.
        components:
          - Guidewire ClaimCenter
          - Agent Bricks
          - AI Functions
          - Model Serving
          - Lakebase
      - name: Customer 360
        short: Retention
        icon: custlake
        summary: One governed view of the policyholder across policy, billing, claims and service, so retention and cross-sell are proactive rather than guesswork.
        problem: Customer data is siloed across policy admin, billing, claims and CRM, so churn prediction is unreliable, service is reactive, and cross-sell is a guess.
        who_benefits: Distribution & Agency
        how_built: Policy, claim and service data are unified through CustomerLake without a separate CDP; retention and cross-sell propensity are scored in Model Serving and activated into Salesforce FSC, explored in AI/BI and Genie One.
        components:
          - CustomerLake
          - Salesforce FSC
          - Model Serving
          - AI/BI
          - Genie One
        stories:
          - title: Allianz Direct improves customer satisfaction with Databricks
            url: https://www.databricks.com/customers/allianz-direct
          - title: Storebrand unifies customer data on Databricks
            url: https://www.databricks.com/customers/storebrand
          - title: Nationwide transforms data into member value
            url: https://www.databricks.com/customers/nationwide
      - name: Distribution & Producer Analytics
        short: Distribution
        icon: share
        summary: Agency and producer performance, quote-to-bind and appetite adherence measured across every channel.
        problem: Production, quote-to-bind and loss ratio by agent live in agency-management and CRM silos, so growing agencies writing off-appetite business are spotted late and channel economics are guesswork.
        who_benefits: Distribution & Agency
        how_built: Applied Epic and Vertafore book-of-business feeds conform with Salesforce FSC on the lakehouse under Unity Catalog, and producer production, retention and appetite adherence are scored in Model Serving and analysed in AI/BI.
        components:
          - Applied Epic
          - Vertafore AMS360
          - Salesforce FSC
          - Model Serving
          - AI/BI
medallion:
  Bronze:
    short: Raw policy, claims, telematics
    summary: Policy transactions from PolicyCenter and Duck Creek, first notice of loss and claim notes from ClaimCenter, telematics trips, ISO loss costs and cat-model exposure files, landed exactly as received so a rate or a reserve can always be replayed as it stood.
  Silver:
    short: Conformed policy, claim, party
    summary: Policies, claims, coverages, exposures and parties resolved into single conformed entities across policy admin, claims and billing, with agents, insureds and third parties matched and coverage terms reconciled to one policy version.
  Gold:
    short: Loss ratio, reserves, cat PML
    summary: 'Contracted products underwriting, actuarial and finance run on: loss and combined ratio by line and segment, IBNR and case reserves, catastrophe exposure and PML, and subrogation recovery.'
