name: Medical Devices
description: 'A MedTech manufacturer designing, manufacturing and supporting regulated medical devices: PLM and requirements, MES and quality, complaint and post-market surveillance, connected-device and CGM telemetry, manufacturing reliability, clinical evidence, and supply and demand across the device fleet.'
sources:
  - name: PLM & Engineering
    icon: dev
    simplified: 2
    tiles:
      - name: PTC Windchill
        icon: dev
        summary: 'Product lifecycle management: the system of record for device design, BOMs, change orders and the design history file.'
        citations:
          - windchill
        category: Product Lifecycle Management (PLM)
        what_it_is: The system of record for device design, BOMs, change orders and the design history file across the product's lifecycle.
        who_uses_it: Design & systems eng, Verification & validation and Regulatory affairs.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: 1-5 GB/day
            interval: Nightly batch + on change order
      - name: Siemens Teamcenter
        icon: erp
        summary: PLM for BOM, requirements and change control where Teamcenter is the incumbent design backbone.
        citations:
          - teamcenter
        category: Product Lifecycle Management (PLM)
        what_it_is: PLM for BOM, requirements and change control where Teamcenter is the incumbent design backbone for the device portfolio.
        who_uses_it: Design & systems eng, Reliability engineering and Supply chain.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: 1-5 GB/day
            interval: Nightly batch + on change
      - name: Jama Connect
        icon: docs
        summary: Requirements, verification and validation traceability from design inputs to test evidence for regulated products.
        citations:
          - jama
        category: Requirements Management / ALM
        what_it_is: Traces requirements, verification and validation from design inputs to test evidence for regulated products.
        who_uses_it: Verification & validation, Design & systems eng and Compliance & audit.
        data_out:
          batch:
            types:
              - structured
            volume: 0.2-1 GB/day
            interval: Nightly sync
  - name: Quality & Reg
    icon: gavel
    simplified: 2
    tiles:
      - name: MasterControl QMS
        icon: gavel
        summary: 'Quality management: document control, training, nonconformances, CAPA and audit trails under 21 CFR Part 11.'
        citations:
          - mastercontrol
        category: Quality Management System (QMS)
        what_it_is: Manages document control, training, nonconformances, CAPA and audit trails under 21 CFR Part 11 across the quality system.
        who_uses_it: Head of quality, Compliance & audit and Line quality.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: 0.5-3 GB/day
            interval: Nightly + event-driven
      - name: Veeva Vault Quality
        icon: gavel
        summary: Cloud QMS and QualityDocs for complaint, deviation and CAPA workflows across sites.
        citations:
          - veeva
        category: Quality Management System (QMS)
        what_it_is: Cloud QMS and QualityDocs running complaint, deviation and CAPA workflows and controlled content across sites.
        who_uses_it: Head of quality, Regulatory affairs and Compliance & audit.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: 0.5-2 GB/day
            interval: Nightly + on approval
      - name: TrackWise Digital
        icon: gavel
        summary: 'Complaint management and CAPA of record: intake, MDR decisioning and adverse-event workflows.'
        citations:
          - trackwise
        category: Complaint & CAPA Management (QMS)
        what_it_is: 'The complaint and CAPA system of record: complaint intake, MDR decisioning and adverse-event workflows for the device portfolio.'
        who_uses_it: Post-market surveillance, Head of quality and Regulatory affairs.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: 0.5-3 GB/day complaints + narratives
            interval: Hourly / daily intake
      - name: ETQ Reliance
        icon: gavel
        summary: Quality and EHS management for nonconformance, supplier quality and CAPA where ETQ is the incumbent.
        citations:
          - etq
        category: Quality & EHS Management (QMS)
        what_it_is: Manages nonconformance, supplier quality and CAPA (and EHS) where ETQ Reliance is the incumbent quality platform.
        who_uses_it: Line quality, Supply chain and Compliance & audit.
        data_out:
          batch:
            types:
              - structured
            volume: 0.2-1 GB/day
            interval: Nightly + event-driven
  - name: Manufacturing & MES
    icon: compute
    simplified: 2
    tiles:
      - name: Siemens Opcenter MES
        icon: compute
        summary: 'Manufacturing execution: electronic batch records, work orders, genealogy and in-line quality on the line.'
        citations:
          - opcenter
        category: Manufacturing Execution System (MES)
        what_it_is: Runs electronic batch records, work orders, genealogy and in-line quality on the line, the system of record for how a device was built.
        who_uses_it: Process & plant eng, Line quality and Supply chain.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 5-30 GB/day
            interval: Per-lot + shift batch
          stream:
            types:
              - semi-structured
            volume: line events at process latency
            interval: Continuous on the line
      - name: Rockwell Plex MES
        icon: compute
        summary: Cloud MES for production tracking, quality and genealogy across discrete device manufacturing.
        citations:
          - plex
        category: Manufacturing Execution System (MES)
        what_it_is: Cloud MES for production tracking, quality and genealogy across discrete device manufacturing.
        who_uses_it: Process & plant eng, Line quality and Supply chain.
        data_out:
          batch:
            types:
              - structured
            volume: 2-15 GB/day
            interval: Per-lot + shift batch
          stream:
            types:
              - semi-structured
            volume: production events on the line
            interval: Continuous
      - name: Tulip Frontline Ops
        icon: apps
        summary: Composable frontline operations and digital work instructions on the manufacturing floor.
        citations:
          - tulip
        category: Frontline Operations / Digital Work Instructions
        what_it_is: Composable frontline operations and digital work instructions on the manufacturing floor, capturing operator steps and station data.
        who_uses_it: Line quality, Process & plant eng and Application Engineers.
        data_out:
          stream:
            types:
              - semi-structured
            volume: station events as steps complete
            interval: Continuous during shifts
      - name: AVEVA PI Historian
        icon: iot
        summary: 'Process historian: equipment and process time-series that underpins SPC, OEE and anomaly detection.'
        citations:
          - avevapi
        category: Process Historian (Time-Series)
        what_it_is: Process historian holding equipment and process time-series that underpins SPC, OEE and anomaly detection on the line.
        who_uses_it: Process & plant eng, Quality DS and Reliability engineering.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 1000s of tags/sec
            interval: Continuous time-series
  - name: ERP, Service & CRM
    icon: erp
    tiles:
      - name: SAP S/4HANA
        icon: erp
        summary: The ERP of record for procurement, inventory, production orders and finance across the device business.
        citations:
          - sap
        category: ERP
        what_it_is: The ERP of record for procurement, inventory, production orders and finance across the device business.
        who_uses_it: Supply chain, Process & plant eng and Finance.
        data_out:
          batch:
            types:
              - structured
            volume: 10-50 GB/day
            interval: Nightly batch + hourly deltas
      - name: ServiceMax
        core: true
        icon: orch
        summary: 'Field service management: installed base, service contracts, work orders and parts for the device fleet.'
        citations:
          - servicemax
        category: Field Service Management (FSM)
        what_it_is: Manages the installed base, service contracts, work orders and parts for the device fleet in the field.
        who_uses_it: Field service, Customer success and Sales & marketing.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Nightly sync + intraday
      - name: Salesforce
        core: true
        icon: crm
        summary: Commercial CRM for accounts, orders and device utilisation across sales and customer success.
        citations:
          - salesforce
        category: CRM
        what_it_is: Commercial CRM for accounts, orders and device utilisation across sales and customer success.
        who_uses_it: Sales & marketing, Customer success and Field service.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Nightly sync
          stream:
            types:
              - semi-structured
            volume: engagement events as they occur
            interval: Continuous CDC
      - name: LabWare LIMS
        icon: db
        summary: 'Laboratory information management: test results, specifications and out-of-spec dispositions for release.'
        citations:
          - labware
        category: Laboratory Information Management System (LIMS)
        what_it_is: Holds test results, specifications and out-of-spec dispositions that gate device and component release.
        who_uses_it: Line quality, Process & plant eng and Head of quality.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-3 GB/day
            interval: Nightly batch + result release
  - name: Regulatory & Telemetry
    icon: iot
    tiles:
      - name: FDA GUDID / UDI
        icon: gavel
        summary: Unique Device Identification records and the Global UDI Database, the reference for device identity and labelling.
        citations:
          - gudid
        category: Device Identification Registry (UDI)
        what_it_is: Unique Device Identification records and the Global UDI Database, the reference for device identity and labelling.
        who_uses_it: Regulatory affairs, Compliance & audit and Supply chain.
        data_out:
          batch:
            types:
              - structured
            volume: MBs-GBs (UDI records)
            interval: On registration + periodic sync
      - name: FDA MAUDE Events
        icon: gavel
        summary: Manufacturer and User Facility Device Experience adverse-event reports, the public post-market safety record.
        citations:
          - maude
        category: Public Adverse-Event Database (Devices)
        what_it_is: Manufacturer and User Facility Device Experience adverse-event reports, the public post-market safety record used for signal benchmarking.
        who_uses_it: Post-market surveillance, Medical affairs and Regulatory affairs.
        data_out:
          batch:
            types:
              - semi-structured
            volume: GBs (periodic event files)
            interval: Monthly reference releases
      - name: Device Telemetry
        core: true
        icon: iot
        summary: 'Connected-device and IoMT telemetry from the installed base: usage, alarms and sensor streams from every unit.'
        category: Connected-Device / IoMT Telemetry
        what_it_is: 'Connected-device and IoMT telemetry from the installed base: usage, alarms and sensor streams from every unit in the field.'
        who_uses_it: Telemetry Eng, Field service and Reliability engineering.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 10s-100s of GB/day at fleet scale
            interval: Continuous (MQTT / Kafka)
      - name: HL7 FHIR Feeds
        icon: api
        summary: Interoperability feeds carrying device, observation and outcome resources to and from clinical systems.
        citations:
          - fhir
        category: Clinical Interoperability Standard (FHIR)
        what_it_is: Interoperability feeds carrying device, observation and outcome resources to and from clinical systems for real-world data.
        who_uses_it: Clinical Affairs, Medical affairs and Application Engineers.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 10s-100s of resources/sec
            interval: Continuous (API / event)
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Complaint & RWE Marts
        icon: fed
        summary: Historical complaint, clinical and real-world evidence marts left where they are and queried in place under Unity Catalog, which avoids a second copy of the audited numbers.
        category: Complaint & Real-World Evidence Warehouse
        what_it_is: Historical complaint, clinical and real-world evidence marts kept in the incumbent warehouse and queried in place through federation, avoiding a second copy of the audited numbers.
        who_uses_it: Clinical Affairs, Post-market surveillance and Health economics.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale historical marts
            interval: Queried on demand (federated)
  - name: Data Formats
    icon: zbraces
    tiles:
      - name: 'ISO/IEEE 11073'
        icon: zbraces
        fmt: '11073'
        summary: 'Standards for personal and point-of-care medical device communication.'
        spec_url: https://www.iso.org/committee/6796745.html
      - name: 'IHE PCD'
        icon: zbraces
        fmt: 'PCD'
        summary: 'IHE Patient Care Device profiles for device-to-enterprise data flow.'
        spec_url: https://www.ihe.net/ihe_domains/patient_care_devices/
      - name: 'DICOM'
        core: true
        icon: zbraces
        fmt: 'DCM'
        summary: 'Standard for medical imaging data and device interoperability.'
        spec_url: https://www.dicomstandard.org/
        spark_connector: 'pixels'
        spark_repo: https://github.com/databricks-industry-solutions/pixels
        databricks_resource: https://www.databricks.com/blog/2023/03/16/building-lakehouse-healthcare-and-life-sciences-processing-dicom-images.html
        source_systems:
          - 'GE HealthCare'
          - 'Philips'
          - 'Canon Medical'
      - name: 'FHIR Device'
        icon: zbraces
        fmt: 'FHIR'
        summary: 'HL7 FHIR Device resources for representing devices in modern health APIs.'
        spec_url: https://www.hl7.org/fhir/device.html
        spark_connector: 'dbignite'
        spark_repo: https://github.com/databrickslabs/dbignite
        databricks_resource: https://www.databricks.com/solutions/accelerators/fhir
        source_systems:
          - 'Philips HealthSuite'
          - 'GE HealthCare'
          - 'Masimo'
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    tiles:
      - name: openFDA APIs
        icon: api
        summary: Device classification, recall and adverse-event data ingested from the FDA open data APIs for benchmarking.
        citations:
          - openfda
        category: Public Device Data API (openFDA)
        what_it_is: Device classification, recall and adverse-event data ingested from the FDA open data APIs for benchmarking and signal context.
        who_uses_it: Post-market surveillance, Regulatory affairs and Quality DS.
        data_out:
          batch:
            types:
              - semi-structured
            volume: GBs (API extracts)
            interval: Weekly / on-demand pulls
      - name: EU EUDAMED
        icon: gavel
        summary: European device registration, UDI and vigilance data exchanged with the EUDAMED database under EU MDR.
        citations:
          - eudamed
        category: EU Device Registration & Vigilance (EUDAMED)
        what_it_is: European device registration, UDI and vigilance data exchanged with the EUDAMED database under EU MDR.
        who_uses_it: Regulatory affairs, Compliance & audit and Post-market surveillance.
        data_out:
          batch:
            types:
              - structured
            volume: MBs-GBs (registration + vigilance)
            interval: On registration + periodic sync
      - name: Device Events
        icon: stream
        summary: MQTT and Kafka topics carrying connected-device telemetry, alarms and MES events, landed as structured events.
        category: Device Event Stream (MQTT / Kafka)
        what_it_is: MQTT and Kafka topics carrying connected-device telemetry, alarms and MES events, landed as structured events for real-time monitoring.
        who_uses_it: Telemetry Eng, Field service and Line quality.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 1-10k events/sec at fleet scale
            interval: Continuous (MQTT / Kafka)
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: R&D & Engineering
        mark: AI/BI
        summary: Design and systems engineering on product architecture and requirements in the design history file, verification and validation against design inputs, and reliability engineering turning field returns into design changes.
        uses:
          - - AI/BI
            - Design-verification coverage and field reliability on certified Metric Views.
          - - MLflow
            - Reliability and failure-mode models tracked for design reviews and audit.
          - - Unity Catalog
            - Requirements, design history and change control governed with lineage across the estate.
        sub:
          - name: Design & systems eng
            cares: product architecture and requirements in the DHF.
          - name: Verification & validation
            cares: test evidence against design inputs and requirements.
          - name: Reliability engineering
            cares: failure modes and field returns feeding design changes.
        ucs:
          - Device Digital Twin & Simulation
          - Connected-Device Product Analytics
          - Complaint & Post-Market Surveillance
      - name: Quality & Reg
        mark: Genie One
        summary: The head of quality on complaint and CAPA backlog and audit readiness; regulatory affairs on submissions, UDI registration and MDR timeliness; compliance and audit on QSR, ISO 13485 and recall exposure.
        uses:
          - - Genie One
            - Ask which lots and products drive this quarter's complaints without an analyst pull.
          - - AI/BI
            - Complaint rate, CAPA cycle time and submission status on one certified set of Metric Views.
          - - Unity Catalog
            - Audit trails and lineage supporting 21 CFR Part 11 and ISO 13485.
        sub:
          - name: Head of quality
            cares: complaint and CAPA backlog and audit readiness.
          - name: Regulatory affairs
            cares: submissions, UDI registration and MDR timeliness.
          - name: Compliance & audit
            cares: QSR, ISO 13485 and recall exposure.
        ucs:
          - Complaint & Post-Market Surveillance
          - Manufacturing Yield & OEE
          - Supply Risk Visibility
      - name: Manufacturing Ops
        core: true
        mark: Lakehouse//RT
        summary: Process and plant engineering on first-pass yield, OEE and process capability, line quality on nonconformance and disposition, and supply chain on component availability and supplier quality.
        uses:
          - - Yield & OEE Cockpit
            - Line yield and downtime flagged before a lot is at risk.
          - - Lakehouse//RT
            - Live MES and equipment state at the latency a line moves at.
          - - Model Serving
            - Defect and yield models scored against in-line inspection.
        sub:
          - name: Process & plant eng
            cares: first-pass yield, OEE and process capability.
          - name: Line quality
            cares: nonconformance, disposition and SPC at the line.
          - name: Supply chain
            cares: component availability and supplier quality.
        ucs:
          - Manufacturing Yield & OEE
          - Supply Risk Visibility
          - Production Predictive Maintenance
      - name: Commercial & Svc
        mark: AI/BI
        summary: Sales and marketing on territory attainment and device utilisation, the field service organisation on installed-base uptime and service contracts, and customer success on onboarding and consumable replenishment.
        uses:
          - - AI/BI
            - Territory attainment, device utilisation and service SLAs on certified views.
          - - Model Serving
            - Service and churn models scored in the dispatch and account path.
          - - Genie One
            - Ask which accounts are below utilisation target this quarter.
        sub:
          - name: Sales & marketing
            cares: territory attainment and device utilisation.
          - name: Field service
            cares: installed-base uptime and service contracts.
          - name: Customer success
            cares: onboarding and consumable replenishment.
        ucs:
          - Device & Consumable Demand Forecasting
          - Connected-Device Product Analytics
          - Supply Risk Visibility
      - name: Clinical Affairs
        mark: Model Serving
        summary: Medical affairs on real-world evidence and clinical value, post-market surveillance on complaint and adverse-event signal, and health economics on outcomes and value evidence.
        uses:
          - - Model Serving
            - Safety-signal and outcome models scored across complaint, RWD and registry data.
          - - AI Functions
            - Adverse-event narratives and literature classified at scale from unstructured text.
          - - AI/BI
            - Signal trends and real-world outcomes on governed, certified views.
        sub:
          - name: Medical affairs
            cares: real-world evidence and clinical value.
          - name: Post-market surveillance
            cares: complaint and adverse-event signal.
          - name: Health economics
            cares: outcomes and value evidence.
        ucs:
          - Clinical-Trial Site Selection
          - Surgical Video & Image Analytics
          - Connected CGM & Pump Analytics
          - Complaint & Post-Market Surveillance
  - name: Technical
    icon: code
    tiles:
      - name: Telemetry Eng
        mark: Lakeflow
        summary: Land connected-device and IoMT telemetry over MQTT and Kafka, complaint intake and MES events; own the Bronze to Silver path and the pager when the device-fleet tables stall.
        uses:
          - - Lakeflow Connect
            - Managed connectors for QMS, PLM, ERP and MES sources.
          - - Auto Loader
            - Device event and log files landed incrementally into Bronze.
          - - Lakewatch
            - Freshness on the fleet and complaint tables quality reads each morning.
      - name: Quality DS
        mark: MLflow
        summary: Complaint text classification, adverse-event coding, anomaly detection on process and telemetry, and reliability models, and whether they still hold as products and processes change.
        uses:
          - - Feature Store
            - Device, lot and complaint features read identically in training and serving.
          - - MLflow
            - Every classifier and reliability model tracked for audit and reproduction.
          - - Model Serving
            - Complaint triage and anomaly models scored in the quality path.
      - name: Application Engineers
        mark: Apps
        summary: Ship the CAPA Command Center, Device Fleet Monitor and Submission Workbench apps quality and service teams work in, hosted next to governed device data.
        uses:
          - - Apps
            - Device-connectivity and complaint-handling screens with no separate web tier to secure.
          - - Lakebase
            - Serverless Postgres for CAPA state and disposition writes.
          - - Agent Bricks
            - Agents that draft complaint summaries against governed tools.
consumers:
  - name: BI & Productivity
    icon: chart
    from: bi
    tiles:
      - name: Tableau / Power BI
        icon: chart
        summary: Executive and quality dashboards against SQL warehouses with Unity Catalog permissions.
      - name: Microsoft Teams
        icon: chat
        summary: Genie in Teams for complaint and yield answers in the channel quality already works in.
      - name: Notebooks & IDEs
        icon: notebook
        summary: Engineering and data-science notebooks against governed device and quality data.
  - name: Providers & Partners
    icon: partner
    simplified: 2
    tiles:
      - name: Provider FHIR Exchange
        icon: api
        summary: Device and outcome data exchanged with hospital systems over HL7 FHIR.
        citations:
          - fhir
      - name: Distributor Portals
        icon: globe
        summary: Inventory, UDI and field-action status shared to distributors and GPOs.
      - name: Contract Mfg Sharing
        icon: share
        summary: CMOs and suppliers reading live quality and demand tables over Delta Sharing.
  - name: Operational Writeback
    icon: opdb
    tiles:
      - name: QMS CAPA Writeback
        icon: gavel
        summary: CAPAs and dispositions written back into the QMS so the action reaches the system quality works in.
        citations:
          - mastercontrol
      - name: MES Disposition
        icon: compute
        summary: Lot hold, release and rework decisions written back to the MES at the line.
        citations:
          - opcenter
      - name: Field Service Orders
        core: true
        icon: orch
        summary: Predicted service dispatch raised in the field-service system against the installed base.
        citations:
          - servicemax
  - name: Regulatory & Reporting
    icon: gavel
    tiles:
      - name: FDA UDI & MDR Filing
        icon: gavel
        summary: UDI records registered to GUDID and MDR packages prepared for authorized submission from governed device tables, with MAUDE read as a public adverse-event reference.
        citations:
          - gudid
      - name: EU MDR / EUDAMED
        core: true
        icon: share
        summary: Registration and vigilance reporting filed to EUDAMED under EU MDR from certified Gold.
        citations:
          - eudamed
  - name: Published Products
    icon: product
    tiles:
      - name: Data Products
        icon: product
        summary: Published, contracted device and quality products discoverable in Unity Catalog Domains.
      - name: Sharing Recipients
        core: true
        icon: share
        summary: Suppliers, CMOs and registries reading live tables with no copy and no egress duplication.
  - name: Databricks Apps
    icon: apps
    tiles:
      - name: CAPA Command Center
        icon: gavel
        short: Complaint & CAPA
        summary: Complaints, nonconformances and CAPAs triaged by risk with root-cause evidence assembled from QMS, MES and complaint text, on Databricks Apps over Lakebase.
      - name: Device Fleet Monitor
        icon: iot
        short: Connected-device health
        summary: Installed-base telemetry by device and site, flagging units trending to failure so service is dispatched before a field event.
      - name: Yield & OEE Cockpit
        icon: gauge
        short: Line performance
        summary: Live first-pass yield, downtime and SPC against the shift target, flagging lots and lines at risk before disposition.
      - name: Submission Workbench
        icon: docs
        short: Regulatory & UDI
        summary: Where regulatory affairs assembles UDI, 510(k) and MDR submissions from governed device, design-history and complaint tables.
  - name: AI/BI Dashboards
    icon: aibi
    tiles:
      - name: Complaint & CAPA
        icon: aibi
        summary: Complaint and MDR rates, CAPA cycle time and backlog on certified Metric Views.
        kpis:
          - Complaint rate
          - MDR rate
          - CAPA cycle time
          - CAPA backlog
          - Repeat complaints
        teams:
          - Quality & Reg
          - Clinical Affairs
          - Head of quality
      - name: Manufacturing Yield & OEE
        icon: aibi
        summary: First-pass yield, OEE and nonconformance across the lines.
        kpis:
          - First-pass yield
          - OEE
          - Scrap rate
          - Nonconformance rate
          - Line downtime
        teams:
          - Manufacturing Ops
          - Quality & Reg
          - Process & plant eng
      - name: Field Service & Reliability
        icon: aibi
        summary: Installed-base uptime, reliability and service SLAs across the fleet.
        kpis:
          - Installed-base uptime
          - MTBF
          - Unplanned service calls
          - SLA attainment
          - Device utilisation
        teams:
          - Commercial & Svc
          - R&D & Engineering
          - Field service
      - name: Regulatory & Vigilance
        icon: aibi
        summary: Submission status, UDI coverage and MDR timeliness across regions.
        kpis:
          - Submission status
          - UDI registration coverage
          - MDR timeliness
          - Recall exposure
          - Signal count
        teams:
          - Quality & Reg
          - Clinical Affairs
          - Regulatory affairs
  - name: Agent Harnesses
    icon: agents
    tiles:
      - name: Omnigent OSS
        icon: omni
        short: Databricks, open source
        summary: Open-source meta-harness above existing agent frameworks, enabling agent composition, collaboration and centralised governance from one interface.
        capabilities:
          - Build
          - Deploy
          - Optimize
          - Govern
        related:
          - Agent Bricks
          - Unity Gateway
      - name: Claude Code
        core: true
        icon: code
        short: 3rd-party harness
        summary: Anthropic's coding harness working against the platform through MCP, with spend, routing and policy governed by Unity Gateway.
      - name: OpenAI Codex
        core: true
        icon: code
        short: 3rd-party harness
        summary: OpenAI's coding harness connected over MCP, governed at runtime by Unity Gateway rather than trusted by configuration.
      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Quality & Safety Agent
        icon: genie
        summary: Ask which products and lots drive complaints and where CAPA is aging, in plain language.
        feeds:
          - TrackWise Digital
          - MasterControl QMS
          - FDA MAUDE Events
          - Yield, complaint rate, CAPA
        teams:
          - Quality & Reg
          - Head of quality
          - Compliance & audit
        questions:
          - Which products and lots drive this quarter's complaints?
          - What is the complaint and MDR rate by device family?
          - Which CAPAs are open past their target closure date?
          - Where are complaints repeating across sites and products?
          - What are peer MAUDE report counts and patterns, noting reporting-population limitations?
      - name: Device Manufacturing Agent
        icon: genie
        summary: Explore first-pass yield, OEE and nonconformance across the lines.
        feeds:
          - Siemens Opcenter MES
          - AVEVA PI Historian
          - LabWare LIMS
          - Conformed device, lot, complaint
        teams:
          - Manufacturing Ops
          - Process & plant eng
          - Line quality
        questions:
          - What is first-pass yield by line and product this week?
          - Which lines have the most downtime and why?
          - Where is process capability drifting toward a limit?
          - Which lots are held by out-of-spec LIMS results?
          - What is the nonconformance rate by station?
      - name: Installed Base Service Agent
        icon: genie
        summary: Answer uptime, utilisation and service questions across the installed base.
        feeds:
          - Device Telemetry
          - ServiceMax
          - HL7 FHIR Feeds
          - Conformed device, lot, complaint
        teams:
          - Commercial & Svc
          - Field service
          - Telemetry Eng
        questions:
          - Which units are trending toward a field failure?
          - What is installed-base uptime by device and site?
          - Which accounts are below device-utilisation target?
          - How many service calls were unplanned this month?
          - Which consumables need replenishment across the fleet?
      - name: Clinical Evidence Agent
        icon: genie
        summary: Ask about emerging safety signals and real-world outcomes across complaints and telemetry.
        feeds:
          - FDA MAUDE Events
          - Complaint & RWE Marts
          - Device Telemetry
          - Yield, complaint rate, CAPA
        teams:
          - Clinical Affairs
          - Post-market surveillance
          - Medical affairs
        questions:
          - Which device families show an emerging safety signal?
          - What is the real-world failure rate versus the label?
          - Which complaints correlate with telemetry anomalies?
          - How is device performance trending by indication?
          - Which signals are approaching a reportable threshold?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Complaint & Post-Market Surveillance
        short: Safety
        icon: gavel
        summary: Complaints, adverse events and device telemetry triaged by severity and probable cause, with CAPA opened and emerging safety signal caught before field exposure grows.
        problem: Complaints, MDR events, registries and device telemetry sit in separate systems, so severity is judged inconsistently, an emerging signal clears a manual review only after exposure has grown, and CAPA backlog ages toward the next audit.
        who_benefits: Quality & Reg
        how_built: Complaint intake, MES nonconformances, adverse-event and telemetry feeds conform to Gold; text and signal models triage severity and detect emerging trends in Model Serving and open CAPAs from the CAPA Command Center on Lakebase.
        components:
          - CAPA Command Center
          - TrackWise Digital
          - FDA MAUDE Events
          - Model Serving
          - AI Functions
        stories:
          - title: Databricks for Healthcare and Life Sciences
            url: https://www.databricks.com/solutions/industries/healthcare-and-life-sciences
          - title: Real-World Evidence Solution Accelerator
            url: https://www.databricks.com/solutions/accelerators/real-world-evidence
      - name: Surgical Video & Image Analytics
        short: Imaging
        icon: observ
        summary: Surgical video and device imaging scored with vision models to surface events, quality and outcomes clinicians cannot review by hand.
        problem: Surgical video and device imaging pile up faster than clinical and engineering teams can review them, so procedural events, image quality and outcome signals stay locked in unstructured video no one queries.
        who_benefits: Clinical Affairs
        how_built: Device imaging and video conform on the lakehouse under Unity Catalog; vision models score events and quality in Model Serving with AI Functions, surfacing outcomes for clinical and design teams.
        components:
          - Device Telemetry
          - HL7 FHIR Feeds
          - Model Serving
          - AI Functions
          - MLflow
      - name: Connected-Device Product Analytics
        short: Product
        icon: iot
        summary: Real-time analytics on how the connected installed base performs and is used, so product and service act on live signal not quarterly reports.
        problem: Connected devices stream usage, health and alarms, but the signal sits unused, so product sees adoption late, service reacts to failures instead of predicting them, and no one sees how the fleet is really used.
        who_benefits: Commercial & Svc
        how_built: IoMT telemetry streams into Lakehouse//RT and conforms under Unity Catalog, so device usage, health and utilisation are read live in the Device Fleet Monitor and certified AI/BI Metric Views across the installed base.
        components:
          - Device Fleet Monitor
          - Device Telemetry
          - Lakehouse//RT
          - AI/BI
          - Unity Catalog
        stories:
          - title: Insulet modernizes data with Lakeflow Connect on Databricks
            url: https://www.databricks.com/customers/insulet/lakeflow-connect
          - title: GE Healthcare builds device and patient views on Databricks
            url: https://www.databricks.com/company/newsroom/press-releases/databricks-introduces-lakehouse-for-the-healthcare-and-life-sciences-industries-to-drive-transformation-across-healthcare-ecosystem
      - name: Manufacturing Yield & OEE
        short: Manufacturing
        icon: gauge
        summary: First-pass yield, OEE and scrap attacked at the line with in-line defect scoring rather than at final inspection.
        problem: First-pass yield, OEE and scrap are reviewed after the lot, so a drifting process is caught at final inspection or in the field instead of at the line.
        who_benefits: Manufacturing Ops
        how_built: MES, historian and inspection data are conformed to certified Metric Views; defect and yield models score in-line in Model Serving and the Yield & OEE Cockpit flags lots at risk before disposition.
        components:
          - Yield & OEE Cockpit
          - Siemens Opcenter MES
          - AVEVA PI Historian
          - Model Serving
          - AI/BI
        stories:
          - title: Insulet modernizes data with Lakeflow Connect on Databricks
            url: https://www.databricks.com/customers/insulet/lakeflow-connect
      - name: Supply Risk Visibility
        short: Supply chain
        icon: partner
        summary: Supplier and component exposure scored so shortages and bad lots are moved before they stop a build or reach a device.
        problem: Single-source components and opaque supplier quality mean a shortage or a bad lot is discovered at the line, after it has already stopped a build or reached a device.
        who_benefits: Manufacturing Ops
        how_built: ERP, supplier and MES feeds are joined in the lakehouse; risk models score supplier and component exposure so buffers and qualifications are moved before a shortage or nonconformance lands.
        components:
          - SAP S/4HANA
          - Genie
          - Model Serving
          - AI/BI
          - Lakeflow
        stories:
          - title: Integra Life Sciences gains a global supply and demand view
            url: https://www.databricks.com/customers/integra-life-sciences
      - name: Production Predictive Maintenance
        short: Manufacturing
        icon: stream
        summary: Production line and equipment failures predicted from historian signals before they stop a lot or a line.
        problem: Production equipment fails between planned maintenance, and the historian signals that would have warned days earlier sit unused, so a line stops mid-lot on a regulated build instead of being serviced on plan.
        who_benefits: Manufacturing Ops
        how_built: Opcenter MES and PI Historian signals stream into Lakehouse//RT and feed remaining-life models tracked in MLflow and scored in Model Serving, raising maintenance before the line stops.
        components:
          - AVEVA PI Historian
          - Siemens Opcenter MES
          - Lakehouse//RT
          - Model Serving
          - MLflow
        stories:
          - title: What is predictive maintenance on the Databricks platform
            url: https://www.databricks.com/blog/what-is-predictive-maintenance
      - name: Device & Consumable Demand Forecasting
        short: Commercial
        icon: market
        summary: Device and consumable demand forecast from utilisation, orders and installed-base signal so supply is planned to real demand.
        problem: Demand is forecast from orders and history blind to how the installed base is actually used, so consumables and devices are over- or under-built and either stock out or age in inventory.
        who_benefits: Commercial & Svc
        how_built: CRM, order and device-utilisation data conform to Gold and are scored in Model Serving, so device and consumable demand is forecast in AI/BI on the definitions the commercial team already reports.
        components:
          - Salesforce
          - SAP S/4HANA
          - Model Serving
          - AI/BI
          - Unity Catalog
      - name: Clinical-Trial Site Selection
        short: Clinical
        icon: chart
        summary: Trial protocol feasibility and site and investigator selection grounded in real-world device, registry and outcome data.
        problem: Trial protocols and site selection are decided from static feasibility surveys and relationships, so enrolment stalls, sites underperform and the real-world evidence that would target the right sites is never brought to bear.
        who_benefits: Clinical Affairs
        how_built: Real-world data from registries, claims and device telemetry conforms on the lakehouse using the RWE accelerator; feasibility and site-performance models score candidate sites in Model Serving for protocol and site selection.
        components:
          - HL7 FHIR Feeds
          - Complaint & RWE Marts
          - Model Serving
          - AI Functions
          - AI/BI
        stories:
          - title: Real-World Evidence Solution Accelerator
            url: https://www.databricks.com/solutions/accelerators/real-world-evidence
          - title: Integra Life Sciences unifies data for patient care
            url: https://www.databricks.com/customers/integra-life-sciences
      - name: Connected CGM & Pump Analytics
        short: Connected therapy
        icon: product
        summary: Continuous glucose monitor and insulin-pump data turned into real-world therapy and device insight for patients, clinicians and product teams.
        problem: CGM and pump data streams from every patient, but it lands in device silos, so therapy adherence, real-world performance and the signals that guide the next product update are never assembled.
        who_benefits: Clinical Affairs
        how_built: Connected CGM and pump telemetry streams into Lakehouse//RT and conforms under Unity Catalog, so real-world therapy, adherence and device-performance insight is read in AI/BI and served to clinical and product teams.
        components:
          - Device Telemetry
          - HL7 FHIR Feeds
          - Lakehouse//RT
          - AI/BI
          - Unity Catalog
        stories:
          - title: Insulet modernizes data with Lakeflow Connect on Databricks
            url: https://www.databricks.com/customers/insulet/lakeflow-connect
      - name: Device Digital Twin & Simulation
        short: Engineering
        icon: network
        summary: A live virtual model of the device built from design, test and field telemetry, so a design or reliability change is simulated before it ships.
        problem: Design and reliability changes are trialled on physical prototypes and field returns reach engineering as quarterly summaries, so there is no governed live model of the device to simulate a change against before the next design freeze.
        who_benefits: R&D & Engineering
        how_built: Requirements, design history and field telemetry conform on the lakehouse and are mirrored in a digital twin, and physics-plus-ML models in Model Serving tracked in MLflow simulate reliability and performance before a change ships.
        components:
          - PTC Windchill
          - Jama Connect
          - Device Telemetry
          - Model Serving
          - MLflow
          - Feature Store
medallion:
  Bronze:
    short: Raw device and quality feeds
    summary: Complaint intake and MDR events, MES lot and process records, PLM change orders, LIMS results and connected-device telemetry, landed exactly as received so a complaint or a batch record can be replayed as it stood.
  Silver:
    short: Conformed device, lot, complaint
    summary: Devices, lots, components and complaints resolved into single conformed entities across PLM, MES, QMS and field systems, with UDI-DI reconciled and device history stitched from component to finished good.
  Gold:
    short: Yield, complaint rate, CAPA
    summary: 'Contracted products the quality and operations teams run on: first-pass yield and OEE by line, complaint and MDR rates by product and lot, CAPA cycle time, and field reliability by device family.'
