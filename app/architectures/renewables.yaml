      - name: Watershed Carbon
        icon: globe
        summary: 'Carbon and emissions accounting: avoided-emissions, Scope reporting and ESG disclosure records built from measured production.'
        citations:
          - watershed
        category: Carbon & ESG Accounting Platform
        what_it_is: Carbon and emissions accounting for avoided-emissions, Scope reporting and ESG disclosure records built from measured production and stated methodologies.
        who_uses_it: Chief Sustainability Office, ESG reporting and finance teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: MBs-GBs emissions data
            interval: Monthly / quarterly reporting
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Project Finance
        icon: fed
        summary: Project-finance models, asset ledgers and tax-equity and debt marts left where they are and queried in place under Unity Catalog, which avoids a second copy of the audited returns.
        category: Enterprise Data Warehouse
        what_it_is: Project-finance models, asset ledgers and tax-equity and debt marts kept in the incumbent finance warehouse and queried in place through federation rather than copied.
        who_uses_it: CFO & treasury, project finance and portfolio analysts.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale historical marts
            interval: Queried on demand (federated)
  - name: Data Formats
    icon: zbraces
    tiles:
      - name: 'SunSpec Modbus'
        icon: zbraces
        fmt: 'SUN'
        summary: 'SunSpec Modbus device models for solar inverters and DER interoperability.'
        spec_url: https://sunspec.org/sunspec-modbus-specifications/
      - name: 'IEC 61400-25'
        core: true
        icon: zbraces
        fmt: '61400'
        summary: 'IEC standard for wind power plant monitoring and control communications.'
        spec_url: https://webstore.iec.ch/en/publication/5433
      - name: 'IEC 61850 DER'
        icon: zbraces
