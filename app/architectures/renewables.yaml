name: Renewables & Cleantech
description: 'Renewable independent power producers across solar, wind, storage and green hydrogen: asset performance and SCADA, generation forecasting and energy trading, electrolyser and plant optimisation, repowering and decommissioning, and ESG and carbon reporting.'
sources:
  - name: SCADA & Historian
    icon: iot
    tiles:
      - name: AVEVA PI System
        icon: iot
        summary: 'The operational historian of record: high-frequency SCADA and PPC time-series from every turbine, inverter and plant controller, the source of availability and performance signals.'
        citations:
          - pi
        category: Process / Time-Series Historian
        what_it_is: Stores high-frequency SCADA and plant-controller time-series from every turbine, inverter and site controller as the operational system of record for availability and performance.
        who_uses_it: Performance engineers, reliability engineers and production analysts.
        data_out:
          batch:
            types:
              - structured
            volume: 20-100 GB/day tag history
            interval: Hourly / daily aggregates
          stream:
            types:
              - semi-structured
            volume: 50-500k tags/sec at peak
            interval: Continuous (sub-second sampling)
      - name: GE Vernova SCADA
        core: true
        icon: iot
        summary: 'Wind turbine SCADA and controls from the OEM: nacelle, drivetrain and pitch telemetry, alarms and availability states against each unit.'
        citations:
          - ge-vernova
        category: Turbine SCADA / OEM Control System
        what_it_is: OEM wind-turbine SCADA and controls emitting nacelle, drivetrain and pitch telemetry, alarms and availability states for each unit.
        who_uses_it: Reliability engineers, performance engineers and O&M teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 10-100k signals/sec
            interval: Continuous (sub-second)
      - name: Power Factors APM
        core: true
        icon: gauge
        summary: 'Renewable asset performance management: production, availability and loss accounting across mixed-OEM solar, wind and storage fleets.'
        citations:
          - powerfactors
        category: Asset Performance Management (APM)
        what_it_is: Renewable asset performance management aggregating production, availability and loss accounting across mixed-OEM solar, wind and storage fleets.
        who_uses_it: Performance engineers, production analysts and asset managers.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Hourly / daily performance rollups
      - name: Huawei FusionSolar
        icon: iot
        summary: 'String-level inverter and PV plant monitoring: DC and AC yield, string faults and soiling signals feeding solar performance analysis.'
        citations:
          - fusionsolar
        category: Solar Inverter Monitoring Platform
        what_it_is: String-level inverter and PV plant monitoring emitting DC/AC yield, string faults and soiling signals for solar performance analysis.
        who_uses_it: Solar performance engineers and O&M technicians.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: 15-minute / hourly yield reads
          stream:
            types:
              - semi-structured
            volume: 1-10k readings/sec
            interval: Continuous inverter telemetry
  - name: Trading & Markets
    icon: market
    simplified: 3
    tiles:
      - name: ERCOT / CAISO
        icon: market
        summary: 'ISO and RTO market participation: nodal prices, dispatch instructions and settlement, the systems bids, schedules and imbalance settle against.'
        citations:
          - ercot
          - caiso
        category: ISO/RTO Market Operator
        what_it_is: 'ISO and RTO market participation feeds: nodal prices, dispatch instructions and settlement that bids, schedules and imbalance are cleared against.'
        who_uses_it: Power traders, battery schedulers and grid compliance teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day price + settlement
            interval: Settlement cycles daily
          stream:
            types:
              - semi-structured
            volume: 100s-1000s of signals/sec
            interval: Continuous (5-minute dispatch)
      - name: ION Commodities ETRM
        core: true
        icon: erp
        summary: 'Energy trading and risk management for power and PPA positions: deal capture, position, mark-to-market and settlement across the trading book.'
        citations:
          - ion
        category: Energy Trading & Risk Management (ETRM)
        what_it_is: Captures power and PPA deals, positions, mark-to-market and settlement across the trading book.
        who_uses_it: Power traders, PPA originators and risk/middle office.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day deals + positions
            interval: Intraday + end-of-day marks
      - name: Molecule ETRM
        icon: market
        summary: Cloud ETRM for power and renewables portfolios where lighter-weight position, PnL and risk reporting is the incumbent.
        citations:
          - molecule
        category: Energy Trading & Risk Management (ETRM)
        what_it_is: Cloud ETRM providing position, PnL and risk reporting for power and renewables portfolios where a lighter-weight incumbent is in place.
        who_uses_it: Power traders, portfolio managers and risk teams.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-2 GB/day
            interval: Intraday + end-of-day
      - name: ICE Power Markets
        icon: market
        summary: Forward power, gas and carbon curves and exchange-traded prices, the market reference PPA valuation and hedging are marked against.
        citations:
          - ice
        category: Commodity Exchange & Price Reference
        what_it_is: Forward power, gas and carbon curves and exchange-traded prices used as the market reference for PPA valuation and hedging.
        who_uses_it: Traders, PPA origination and risk teams.
        data_out:
          batch:
            types:
              - structured
            volume: MBs-GBs reference curves
            interval: Daily settlement + intraday
  - name: O&M & Field Service
    icon: erp
    simplified: 2
    tiles:
      - name: IBM Maximo EAM
        icon: erp
        summary: 'Enterprise asset management: work orders, component lifing, spares and preventive maintenance schedules against every turbine and inverter.'
        citations:
