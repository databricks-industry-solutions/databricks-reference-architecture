pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Executive Office
        mark: Genie One
        summary: The CEO on portfolio returns and the build-out pipeline; the CFO and treasury on project finance, tax equity and the cost of capital; the Chief Sustainability Officer on carbon, RECs and the disclosure the board signs.
        uses:
          - - Genie One
            - Ask what a portfolio's availability or PPA settlement was last month without booking analyst time.
          - - AI/BI
            - Portfolio returns, availability and carbon on one certified set of Metric Views.
          - - Unity Catalog
            - Certification and the business glossary, so "availability" and "avoided emissions" mean one thing across the fleet.
        sub:
          - name: CEO
            cares: portfolio returns and the development pipeline.
          - name: CFO & Treasury
            cares: project finance, tax equity and cost of capital.
          - name: Chief Sustainability
            cares: carbon, RECs and audited ESG disclosure.
        ucs:
          - Capital Investment Simulation
          - Sustainability & Circular Economy
          - Demand Forecasting
      - name: Asset Ops
        mark: AI/BI
        summary: Asset performance engineers on availability, performance ratio and loss accounting; reliability engineers on component health across the fleet; performance analysts closing the gap to the P50 production case.
        uses:
          - - APM Control Room
            - Availability, PR and underperformance by site and asset before the morning call.
          - - AI/BI
            - Loss accounting and production-to-plan on the same definitions finance reads.
          - - Model Serving
            - Underperformance and anomaly models scored against live SCADA.
        sub:
          - name: Performance Engineers
            cares: availability, performance ratio and loss accounting.
          - name: Reliability Engineers
            cares: component health and failure modes across the fleet.
          - name: Production Analysts
            cares: the gap to the P50 case, site by site.
        ucs:
          - Production Monitoring
          - Predictive Maintenance & Asset Health
          - Scenario Planning & Business Simulation
      - name: Energy Trading
        mark: Model Serving
        summary: Power traders scheduling and hedging generation into the ISO; PPA originators structuring offtake and shape risk; battery schedulers arbitraging price and ancillary markets.
        uses:
          - - Trading & Dispatch
            - Position, forecast and imbalance risk on a portfolio before a bid is placed.
          - - Model Serving
            - Price and generation forecasts scored inside the bidding path.
          - - Lakehouse//RT
            - Live price, dispatch and telemetry at the latency a battery cycles at.
        sub:
          - name: Power Traders
            cares: scheduling and hedging generation into the ISO.
          - name: PPA Origination
            cares: offtake structure, shape and imbalance risk.
          - name: Battery Schedulers
            cares: price and ancillary-market arbitrage.
        ucs:
          - Commodity & Energy Trading
          - Demand Forecasting
      - name: O&M & Field
        core: true
        mark: Lakeflow
        summary: O&M managers on truck-roll cost and mean-time-to-repair; field technicians on the work order in front of them; spares and logistics on the parts that keep the fleet turning.
        uses:
          - - O&M Work Planner
            - Predicted failures turned into scheduled work orders against the tail of assets.
          - - Lakeflow
            - SCADA, EAM and field feeds conformed for maintenance analytics.
          - - MLflow
            - Remaining-useful-life models tracked for audit and reproduction.
        sub:
          - name: O&M Managers
            cares: truck-roll cost and mean-time-to-repair.
          - name: Field Technicians
            cares: the scheduled and corrective work order at the site.
          - name: Spares & Logistics
            cares: component availability and warranty recovery.
        ucs:
          - Predictive Maintenance & Asset Health
          - Prescriptive Maintenance
          - Production Monitoring
      - name: Grid Ops
        mark: Lakehouse//RT
        summary: Interconnection engineers on queue position and grid-code compliance; grid compliance on curtailment reporting and settlement; plant controls on PPC setpoints and dispatch response.
        uses:
          - - Lakehouse//RT
            - Live dispatch, curtailment and telemetry at grid latency.
          - - AI/BI
            - Curtailment, availability-to-grid and compliance on certified views.
          - - Model Serving
            - Curtailment and setpoint recommendations scored against live signals.
        sub:
          - name: Interconnection Eng
            cares: queue position and grid-code compliance.
          - name: Grid Compliance
            cares: curtailment reporting and settlement accuracy.
          - name: Plant Controls
            cares: PPC setpoints and dispatch response.
        ucs:
          - Demand Forecasting
  - name: Technical
    icon: code
    tiles:
      - name: SCADA Data Eng
        mark: Lakeflow
        summary: Land the PI historian, GE and Huawei SCADA, Maximo and revenue-meter feeds; own the Bronze to Silver path and the pager when a performance table stalls before the morning call.
        uses:
          - - Lakeflow Connect
            - Managed connectors for the historian, EAM and metering sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on SCADA and meter feeds.
          - - Lakewatch
            - Freshness on the availability and production tables ops reads each morning.
      - name: Forecast ML
        mark: MLflow
        summary: Generation, price and remaining-useful-life models built from SCADA, weather and market history; whether they still hold as turbines age and price regimes shift.
        uses:
          - - Feature Store
            - Weather, telemetry and market features read identically in training and serving.
          - - MLflow
            - Every forecast and RUL model tracked for audit and reproduction.
          - - Model Serving
            - Generation, price and failure models scored in the operational path.
      - name: Controls & Apps
        mark: Apps
        summary: Ship the APM control room, trading desk and O&M planner the fleet works in, and write PPC setpoint recommendations and work orders back to the systems of record next to governed data, with existing plant controllers enforcing permissible actions.
        uses:
          - - Apps
            - Operational screens with no separate web tier to run or secure.
          - - Lakebase
            - Serverless Postgres for dispatch decisions and work-order writes.
          - - Agent Bricks
            - Agents that draft a work order or a curtailment note against governed tools.
