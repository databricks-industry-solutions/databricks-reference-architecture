  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Production Monitoring
        short: Availability & PR
        icon: gauge
        summary: Real-time availability, loss accounting and technology-appropriate yield across a mixed-OEM solar, wind and storage fleet, with performance ratio and soiling as solar measures, so underperformance is caught and closed against the production case.
        problem: Underperformance hides in per-OEM SCADA silos and monthly reports; by the time a soiling loss or a curtailment pattern is spotted, weeks of generation are already gone.
        who_benefits: Asset Ops
        how_built: SCADA and APM feeds are conformed to certified Gold; availability, PR and loss accounting are monitored in AI/BI and surfaced in the APM Control Room on definitions certified in Unity Catalog.
        components:
          - APM Control Room
          - Power Factors APM
          - AVEVA PI System
          - AI/BI
          - Unity Catalog
        stories:
          - title: E.ON advances asset management with Databricks
            url: https://www.databricks.com/customers/eon
          - title: Databricks for Energy
            url: https://www.databricks.com/solutions/industries/energy
      - name: Commodity & Energy Trading
        short: Power & PPA
        icon: market
        summary: Scheduling and hedging generation into the ISO and valuing PPA and offtake shape, so revenue is captured across price, imbalance and the contract structure.
        problem: Generation, price forecasts and PPA terms live in different systems, so bids are placed without the shape or the hedge in view and imbalance and offtake risk are settled after the fact.
        who_benefits: Energy Trading
        how_built: ETRM positions and ICE forward curves are conformed in the lakehouse; price and generation models score each schedule through Model Serving behind the Trading & Dispatch desk.
        components:
          - Trading & Dispatch
          - ION Commodities ETRM
          - ICE Power Markets
          - Model Serving
          - AI/BI
        stories:
          - title: 'Octopus Energy: data-powered clean energy on Databricks'
            url: https://www.databricks.com/customers/octopus-energy
          - title: SSE Energy Solutions lowers emissions with Databricks
            url: https://www.databricks.com/customers/sse
      - name: Operations Resource Efficiency
        short: Electrolyser & load
        icon: stream
        summary: Shifting flexible load such as electrolysers to the cheapest, most renewable hours and trimming operational energy waste under stack and eligibility constraints, so every MWh is used where it earns most.
        problem: Flexible load is run on flat schedules blind to price, curtailment and renewable availability, so power is consumed in expensive, higher-carbon hours and assets degrade faster than they earn.
        who_benefits: Grid Ops
        how_built: SCADA and stack telemetry land in Lakehouse//RT; a production model tracked in MLflow scores against live and forecast power prices in Model Serving, shifting load toward lower-cost, lower-carbon hours within stack and eligibility constraints.
        components:
          - AVEVA PI System
          - Lakehouse//RT
          - Model Serving
          - MLflow
          - ICE Power Markets
        stories:
          - title: Vattenfall Builds Real-Time Energy Intelligence
            url: https://www.databricks.com/customers/vattenfall/genie
      - name: Sustainability & Circular Economy
        short: RECs & carbon
        icon: gavel
        summary: Reconciling measured generation, registry-confirmed certificates and methodology-dependent avoided-emissions accounting into audit-supporting evidence for the board and offtakers.
        problem: RECs, guarantees of origin and carbon disclosure are stitched together from meter extracts and spreadsheets at reporting time, so issuance is late and the audit trail is fragile.
        who_benefits: Executive Office
        how_built: Metered generation is conformed to Gold and reconciled to REC Registries and Watershed Carbon; the ESG & REC Ledger publishes issuance and disclosure through AI/BI on Unity Catalog definitions.
        components:
          - ESG & REC Ledger
          - REC Registries
          - Watershed Carbon
          - AI/BI
          - Unity Catalog
        stories:
          - title: SSE Energy Solutions lowers carbon emissions with Databricks
            url: https://www.databricks.com/customers/sse
          - title: TotalEnergies powers cleaner energy with Databricks
            url: https://www.databricks.com/customers/totalenergies
      - name: Capital Investment Simulation
        short: IRR & repowering
        icon: sheet
        summary: Simulating portfolio returns, project-finance covenants and repowering cases against live generation and settlement, so capital follows the assets that earn.
        problem: Returns, debt covenants and repower-versus-build cases are modelled in spreadsheets against stale production, so the portfolio’s real performance and its best capital moves are only known at quarter close.
        who_benefits: Executive Office
        how_built: Generation, settlement and cost feeds are conformed against the Project Finance marts; returns, covenants and repowering cases are simulated in AI/BI and asked of Genie One, published as governed Data Products.
        components:
          - Project Finance
          - AI/BI
          - Genie One
          - Unity Catalog
          - Data Products
        stories:
          - title: TotalEnergies powers cleaner energy with Databricks
            url: https://www.databricks.com/customers/totalenergies
      - name: Predictive Maintenance & Asset Health
        short: Turbine & inverter
        icon: iot
        summary: Predicting component failure from SCADA, vibration and defect history so a gearbox or inverter fault becomes a planned visit, not an unplanned outage.
        problem: An unplanned turbine or inverter failure means lost generation and an emergency truck roll. Removals need predicting from actual condition, not a calendar, before the fault takes the asset offline.
        who_benefits: O&M & Field
        how_built: PI historian, GE and Huawei SCADA and Maximo defect history feed remaining-useful-life models tracked in MLflow and scored in Model Serving; predicted removals raise work orders from the O&M Work Planner.
        components:
          - O&M Work Planner
          - AVEVA PI System
          - MLflow
          - Model Serving
          - IBM Maximo EAM
        stories:
          - title: Transforming solar and wind maintenance reports with Genie and AI agents
            url: https://www.databricks.com/blog/transforming-solar-and-wind-maintenance-reports-genie-and-ai-agents
          - title: Predictive maintenance on the Databricks Lakehouse
            url: https://www.databricks.com/blog/what-is-predictive-maintenance
      - name: Prescriptive Maintenance
        short: Component-level actions
        icon: store
        summary: Turning a predicted turbine or inverter fault into the specific prescribed action, the component to change, the repair procedure and the maintenance window and crew, so O&M acts on a costed plan rather than a raw alert.
        problem: A failure prediction still lands on a planner who decides by hand which component to change, when to send a crew and which spare to pull, so the cheapest maintenance window is missed and truck rolls stack up.
        who_benefits: O&M & Field
        how_built: Remaining-useful-life and anomaly scores join Maximo work-order and spares history in the lakehouse; Model Serving prescribes the component action, part and window and the O&M Work Planner drafts the work order before the asset goes down.
        components:
          - O&M Work Planner
          - Power Factors APM
          - IBM Maximo EAM
          - Model Serving
          - MLflow
        stories:
          - title: What is predictive maintenance on the Databricks platform
            url: https://www.databricks.com/blog/what-is-predictive-maintenance
          - title: "Databricks and Shell: industrial time series analytics on the Lakehouse"
            url: https://www.databricks.com/blog/developing-time-series-lakehouse-shell
      - name: Demand Forecasting
        short: Production & weather
        icon: chart
        summary: Short and medium-term generation forecasts conditioned on weather, so schedules, hedges and imbalance are priced on what the fleet will actually produce.
        problem: Wind and solar output is intermittent; forecasts built on stale weather and disconnected telemetry are wrong at exactly the hours that price imbalance the hardest.
        who_benefits: Asset Ops
        how_built: Irradiance and wind forecasts join live telemetry in the lakehouse; generation models defined in Feature Store and tracked in MLflow score through Model Serving into the APM Control Room and the trading desk.
        components:
          - APM Control Room
          - Weather & Irradiance
          - Model Serving
          - Feature Store
          - MLflow
        stories:
          - title: Sympower scales forecasting and grid balancing on Databricks
            url: https://www.databricks.com/customers/sympower
          - title: Databricks for Energy
            url: https://www.databricks.com/solutions/industries/energy
      - name: Regulation Compliance, & External Reporting
        short: Grid-code & ESG
        icon: gavel
        summary: Producing grid-code, curtailment-settlement and environmental-certificate reporting from the same governed tables the fleet runs on, so filings to the ISO, regulators and offtakers are timely and audit-supporting.
        problem: Grid-code compliance, curtailment settlement and REC and emissions disclosure are assembled from meter extracts and spreadsheets under deadline, so reporting is late and the audit trail is fragile.
        who_benefits: Grid Ops
        how_built: Interconnection and grid-code obligations, revenue-meter and curtailment reads and REC and carbon positions are conformed to Gold and published through AI/BI on Unity Catalog definitions for external filing.
        components:
          - ISO Interconnection
          - Revenue Meters / MDM
          - REC Registries
          - AI/BI
          - Unity Catalog
        stories:
          - title: SSE Energy Solutions lowers emissions with Databricks
            url: https://www.databricks.com/customers/sse
          - title: Databricks for Energy
            url: https://www.databricks.com/solutions/industries/energy
      - name: Scenario Planning & Business Simulation
        short: Site & storage design
        icon: network
        summary: Simulating new-site, technology and storage-sizing scenarios and repower-versus-build cases against fleet performance and weather, so layout and portfolio choices are grounded in what actually generates.
        problem: New sites and portfolio moves are planned on vendor yield decks and static assumptions, so layout, technology and storage sizing are locked in before the fleet’s own performance history is ever brought to bear.
        who_benefits: Asset Ops
        how_built: Weather, irradiance and fleet performance history are conformed in the lakehouse; yield, layout and scenario models tracked in MLflow score design and portfolio options in Model Serving, read in AI/BI before commitment.
        components:
          - Weather & Irradiance
          - Power Factors APM
          - Model Serving
          - MLflow
          - AI/BI
        stories:
          - title: Stress Testing Supply Chain Networks at Scale on Databricks
            url: https://www.databricks.com/blog/stress-testing-supply-chain-networks-scale-databricks
          - title: "Solution Accelerator: Supply Chain Stress Testing with Digital Twins"
            url: https://github.com/databricks-industry-solutions/supply-chain-stress-test
medallion:
  Bronze:
    short: Raw asset & market feeds
    summary: SCADA and PPC time-series from the PI historian, turbine and inverter telemetry, revenue-meter reads, ISO market prices and dispatch signals, Maximo work orders and weather forecasts, landed exactly as received so a curtailment or a generation figure can always be replayed as it stood.
  Silver:
    short: Conformed asset, meter, PPA
    summary: Turbines, inverters, sites and meters resolved into single conformed entities across SCADA, asset management and metering, with plant hierarchy, availability states and PPA and offtake contracts reconciled to one asset register.
  Gold:
    short: Availability, PR, settlement
    summary: 'Contracted products operations, commercial and finance teams run on: availability and technology-appropriate performance measures, including solar performance ratio, by site and asset, production against P50 and P90, PPA settlement and imbalance, and ESG, carbon and REC positions.'
