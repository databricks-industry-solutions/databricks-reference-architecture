        category: Enterprise Asset Management (EAM)
        what_it_is: Manages work orders, component lifing, spares and preventive-maintenance schedules against every turbine and inverter.
        who_uses_it: O&M managers, reliability engineers and spares & logistics teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-4 GB/day
            interval: Nightly batch + intraday work orders
      - name: SAP Asset Mgmt
        icon: erp
        summary: Plant maintenance and enterprise asset management where SAP is the incumbent core, feeding the same work-order and asset-register entities.
        citations:
          - sap-eam
        category: Enterprise Asset Management (EAM)
        what_it_is: Plant maintenance and enterprise asset management on the incumbent SAP core, feeding the same work-order and asset-register entities.
        who_uses_it: Maintenance planning, asset management and Finance.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Nightly batch
      - name: Salesforce Field Svc
        icon: crm
        summary: 'Field service dispatch and scheduling: technician assignment, site visits and mobile job completion for O&M crews.'
        citations:
          - salesforce-fs
        category: Field Service Management (FSM)
        what_it_is: 'Field service dispatch and scheduling: technician assignment, site visits and mobile job completion for O&M crews.'
        who_uses_it: O&M dispatch, field technicians and service coordinators.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-2 GB/day
            interval: Hourly sync
          stream:
            types:
              - semi-structured
            volume: tens of events/sec
            interval: Continuous CDC
      - name: ServiceMax
        icon: product
        summary: 'Asset-centric field service for renewable O&M: warranty, entitlement and technician workflow tied to the installed base.'
        citations:
          - servicemax
        category: Field Service Management (FSM)
        what_it_is: Asset-centric field service for renewable O&M covering warranty, entitlement and technician workflow tied to the installed base.
        who_uses_it: O&M managers, warranty administrators and field technicians.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-2 GB/day
            interval: Hourly / nightly sync
  - name: Grid & Metering
    icon: network
    tiles:
      - name: Revenue Meters / MDM
        icon: db
        summary: Certified revenue-grade meter reads and the meter data management estate, the billed basis for generation, export and settlement.
        category: Revenue Metering / MDM
        what_it_is: Certified revenue-grade meter reads and the meter data management estate, the billed basis for generation, export and settlement.
        who_uses_it: Settlement analysts, commercial operations and finance.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day interval reads
            interval: Interval reads (5-15 min) + daily settle
      - name: ISO Interconnection
        icon: network
        summary: Interconnection queue, agreements and grid-code compliance data from the ISO, the constraints a project is energised and dispatched under.
        citations:
          - ferc
        category: Grid Interconnection Registry
        what_it_is: Interconnection queue, agreements and grid-code compliance data from the ISO defining the constraints a project is energised and dispatched under.
        who_uses_it: Interconnection engineers, grid compliance and development teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: MBs-GBs documents + status
            interval: Periodic (milestone-driven)
      - name: Itron MDM
        icon: db
        summary: Meter data management and grid-edge metering where Itron is the incumbent, feeding interval reads into settlement and loss analysis.
        citations:
          - itron
        category: AMI Meter Data Management (MDMS)
        what_it_is: Meter data management and grid-edge metering on the incumbent Itron estate, feeding interval reads into settlement and loss analysis.
        who_uses_it: Settlement analysts, metering operations and commercial teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-10 GB/day interval reads
            interval: Hourly / daily reads
  - name: ESG & Certificates
    icon: gavel
    tiles:
      - name: REC Registries
        icon: gavel
        summary: 'Renewable energy certificate and guarantee-of-origin registries (M-RETS and equivalents): issuance, transfer and retirement against metered generation.'
        citations:
          - mrets
        category: Environmental Certificate Registry
        what_it_is: Renewable energy certificate and guarantee-of-origin registries tracking issuance, transfer and retirement against metered generation.
        who_uses_it: ESG and sustainability teams, commercial and finance.
        data_out:
          batch:
            types:
              - structured
            volume: MBs-GBs certificates
