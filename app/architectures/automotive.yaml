name: Automotive
description: 'Automotive OEMs: vehicle design and simulation, plant manufacturing and quality, dealer networks and customer 360, connected services and aftersales across the tier supply base and mobility fleets.'
sources:
  - name: Engineering & PLM
    icon: product
    simplified: 3
    tiles:
      - name: Siemens Teamcenter
        icon: product
        summary: EBOM, change orders and variant configuration through SOP.
        citations:
          - teamcenter
        category: PLM System
        what_it_is: System of record for the engineering BOM, change orders and variant configuration carried through to start of production.
        who_uses_it: Vehicle engineering, change management and Configuration management.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 5-20 GB/day
            interval: On change release + nightly
      - name: Dassault 3DEXPERIENCE
        icon: product
        summary: CAD, simulation and manufacturing process definitions.
        citations:
          - 3dexperience
        category: CAD / PLM Platform
        what_it_is: Holds CAD geometry, simulation results and manufacturing process definitions for vehicle and component design.
        who_uses_it: Design engineers, CAE/simulation and Manufacturing engineering.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: GBs (CAD + simulation)
            interval: On design release
      - name: PTC Windchill
        icon: product
        summary: Part masters, effectivity and supplier packages.
        citations:
          - windchill
        category: PLM System
        what_it_is: Manages part masters, effectivity dates and supplier data packages across programs standardized on Windchill.
        who_uses_it: Component engineering, Supplier engineering and Configuration management.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: On change release + nightly
  - name: Procurement & ERP
    icon: erp
    simplified: 2
    tiles:
      - name: SAP S/4HANA
        icon: erp
        summary: ERP of record for procurement, inventory, production orders and finance.
        citations:
          - sap-s4auto
        category: Enterprise ERP
        what_it_is: System of record for procurement, inventory, production orders and finance across the automotive business, feeding cost, purchase-order and materials data to the plant.
        who_uses_it: Procurement, Production planning and Finance.
        data_out:
          batch:
            types:
              - structured
            volume: 20-80 GB/day
            interval: Nightly batch + hourly deltas
      - name: Ivalua
        icon: erp
        summary: Source-to-contract and procure-to-pay across raw, partial and assembled parts.
        citations:
          - ivalua
        category: Source-to-Pay / Procurement
        what_it_is: Runs source-to-contract and procure-to-pay across raw, partial and assembled parts, holding supplier contracts, purchase orders and lead-time commitments across the supply base.
        who_uses_it: Procurement, Supplier management and Materials planning.
        data_out:
          batch:
            types:
              - structured
            volume: 2-8 GB/day
            interval: Nightly + hourly deltas
  - name: Manufacturing MES
    icon: iot
    tiles:
      - name: Siemens Opcenter
        icon: iot
        summary: Line sequencing, torque traces, andon events by station.
        citations:
          - opcenter
        category: Manufacturing Execution System (MES)
        what_it_is: Runs line sequencing and captures torque traces, station cycle data and andon events across the assembly line.
        who_uses_it: Plant operations, production engineering and Quality.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 2-10k events/sec at peak
            interval: Continuous station events
      - name: Rockwell FactoryTalk
        icon: iot
        summary: PLC tags, quality checks and downtime reason codes.
        citations:
          - factorytalk
        category: Industrial Automation / SCADA
        what_it_is: Streams PLC tags, in-line quality checks and downtime reason codes from controlled assembly and body-shop assets.
        who_uses_it: Controls engineers, plant operations and Continuous improvement.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 5-20k tags/sec
            interval: Continuous high-frequency telemetry
      - name: Bosch Nexeed
        icon: stream
        summary: Tier-1 JIT sequencing and logistics for assembly plants.
        citations:
          - nexeed
        category: Manufacturing Operations / JIS-JIT
        what_it_is: Coordinates tier-1 just-in-sequence and just-in-time part sequencing and logistics feeding the assembly plant.
        who_uses_it: Plant logistics, materials management and Tier-1 suppliers.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds of events/sec
            interval: Continuous sequencing events
  - name: Dealer & Retail
    icon: market
    simplified: 2
    tiles:
      - name: CDK Global DMS
        icon: erp
        summary: Dealer inventory, deals, F&I and service ROs.
        citations:
          - cdk
        category: Dealer Management System (DMS)
        what_it_is: Runs dealer inventory, vehicle deals, F&I and service repair orders across the dealer network.
        who_uses_it: Dealer principals, sales and service managers and OEM Sales operations.
        data_out:
          batch:
            types:
              - structured
            volume: 2-8 GB/day
            interval: Nightly + hourly deltas
      - name: Reynolds ERA
        icon: erp
        summary: Retail, parts and service transactions across dealer groups.
        citations:
          - reynolds
        category: Dealer Management System (DMS)
        what_it_is: Processes retail, parts and service transactions across dealer groups on the Reynolds platform.
        who_uses_it: Dealer groups, parts and service operations and OEM Sales operations.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Nightly batch
      - name: VinSolutions CRM
        icon: custlake
        summary: Leads, appointments and sold-not-reported tracking.
        citations:
          - vinsolutions
        category: Automotive Retail CRM
        what_it_is: Tracks dealer leads, appointments and sold-not-reported activity across the sales funnel.
        who_uses_it: Dealer sales teams, BDC and OEM Marketing analytics.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-2 GB/day
            interval: Hourly sync
          stream:
            types:
              - semi-structured
            volume: tens of events/sec
            interval: Continuous lead events
  - name: Connected Vehicle
    icon: stream
    tiles:
      - name: OEM Telematics Gateway
        icon: iot
        summary: CAN signals, GPS and remote diagnostics from connected fleets.
        citations:
          - telematics
        category: Connected Vehicle Telematics
        what_it_is: Ingests CAN bus signals, GPS and remote diagnostics streamed from the connected vehicle fleet.
        who_uses_it: Connected-vehicle engineering, Aftersales and Data science.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 50-500k signals/sec (fleet)
            interval: Continuous vehicle telemetry
      - name: HERE HD Maps
        icon: globe
        summary: Lane-level map tiles for ADAS and navigation features.
        citations:
          - here-maps
        category: HD Mapping / Location Data
        what_it_is: Supplies lane-level HD map tiles and location data feeding ADAS and navigation features.
        who_uses_it: ADAS engineering, navigation and Connected-vehicle teams.
        data_out:
          batch:
            types:
              - semi-structured
            volume: GBs (map tiles)
            interval: Periodic map updates
      - name: Aptiv Smart Vehicle
        icon: zplug
        summary: Sensor fusion and software-defined feature telemetry.
        citations:
          - aptiv
        category: Vehicle Software / Sensor Platform
        what_it_is: Provides sensor-fusion output and software-defined vehicle feature telemetry from the vehicle architecture.
        who_uses_it: ADAS/software engineering and Connected-vehicle data teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 10-100k signals/sec
            interval: Continuous sensor telemetry
  - name: Aftersales & Parts
    icon: zplug
    tiles:
      - name: SAP Aftermarket
        icon: erp
        summary: Parts catalog, supersession and dealer ordering.
        citations:
          - sap-aftermarket
        category: Aftermarket / Parts ERP
        what_it_is: Manages the parts catalog, supersession chains and dealer parts ordering across the aftermarket.
        who_uses_it: Parts planning, aftersales operations and Dealer parts teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-4 GB/day
            interval: Nightly + hourly deltas
      - name: Mitchell Repair
        icon: product
        summary: Labor guides, TSBs and repair procedures.
        citations:
          - mitchell
        category: Repair Information System
        what_it_is: Provides labor time guides, technical service bulletins and repair procedures used in service.
        who_uses_it: Service technicians, warranty analysts and Aftersales engineering.
        data_out:
          batch:
            types:
              - semi-structured
              - unstructured
            volume: 100s of MB/day
            interval: Periodic content updates
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Finance & Warranty Mart
        icon: fed
        summary: Warranty accrual and revenue recognition marts queried in place under Unity Catalog.
        category: Enterprise Data Warehouse
        what_it_is: Warranty accrual and revenue-recognition marts kept in the incumbent warehouse and queried in place through federation rather than copied.
        who_uses_it: Finance, Warranty management and Revenue accounting.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale historical marts
            interval: Queried on demand (federated)
  - name: Data Formats
    icon: zbraces
    simplified: 2
    tiles:
      - name: 'ASAM MDF'
        icon: zbraces
        fmt: 'MDF'
        summary: 'ASAM Measurement Data Format for storing high-volume vehicle and test-bench measurement data.'
        spec_url: https://www.asam.net/standards/detail/mdf/
      - name: 'OpenDRIVE'
        icon: zbraces
        fmt: 'ODR'
        summary: 'ASAM logical road-network description for simulation and automated-driving development.'
        spec_url: https://www.asam.net/standards/detail/opendrive/
        spark_connector: 'spark-xml'
        spark_repo: https://github.com/databricks/spark-xml
        databricks_resource: https://docs.databricks.com/aws/en/query/formats/xml
        source_systems:
          - 'dSPACE'
          - 'IPG Automotive'
          - 'Vector'
      - name: 'OpenSCENARIO'
        icon: zbraces
        fmt: 'OSC'
        summary: 'ASAM standard describing dynamic driving scenarios for ADAS/AD verification.'
        spec_url: https://www.asam.net/standards/detail/openscenario/
      - name: 'ASAM OSI'
        icon: zbraces
        fmt: 'OSI'
        summary: 'Open Simulation Interface for sensor and environment data exchange in AD simulation.'
        spec_url: https://www.asam.net/standards/detail/osi/
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    tiles:
      - name: JD Power IQS/SSI
        icon: chart
        summary: Initial quality and sales satisfaction benchmarks by segment.
        citations:
          - jdpower
        category: Quality & Satisfaction Benchmarks
        what_it_is: Provides Initial Quality Study and Sales Satisfaction Index benchmarks by segment for competitive quality and CX analysis.
        who_uses_it: Quality engineering, Sales operations and Product planning.
        data_out:
          batch:
            types:
              - structured
            volume: 100s of MB (surveys)
            interval: Periodic study releases
      - name: Polk Registration
        core: true
        icon: market
        summary: Vehicle registration and conquest data by geography.
        citations:
          - polk
        category: Vehicle Registration Data
        what_it_is: Supplies vehicle registration, ownership and conquest data by geography for market share and targeting.
        who_uses_it: Sales & Marketing, incentive planning and Market analytics.
        data_out:
          batch:
            types:
              - structured
            volume: 1-3 GB/month
            interval: Monthly registration refresh
      - name: MQTT / DDS Telematics
        icon: iot
        summary: CAN and sensor signals streamed from connected vehicles over MQTT and DDS middleware, parsed on arrival into structured telematics events.
        category: Vehicle Telemetry Middleware
        what_it_is: Carries CAN and sensor signals streamed from connected vehicles over MQTT and DDS middleware, parsed on arrival into structured telematics events.
        who_uses_it: Connected-vehicle engineering and Streaming data teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 50-500k signals/sec (fleet)
            interval: Continuous vehicle telemetry
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: CEO & Mfg COO
        mark: Genie One
        summary: The CEO on market share and program ROI; the COO on plant OEE, first-time-through quality and defect PPM against the launch curve by line.
        uses:
          - - Genie One
            - Ask what last month's plant OEE was by line.
          - - AI/BI
            - Quality and throughput on certified Metric Views.
          - - Unity Catalog
            - One VIN definition across plant and dealer.
        sub:
          - name: CEO
            cares: market share, program ROI and the trade between growth and plant capacity.
          - name: Manufacturing COO
            cares: plant OEE, first-time-through quality and defect PPM against the launch curve.
          - name: Chief Strategy Officer
            cares: the EV transition, software revenue and where the vehicle portfolio is headed.
        ucs:
          - Defect Detection
          - Engineering Program Management & Bid Creation
          - Customer 360
          - Predictive Maintenance & Asset Health
      - name: Manufacturing
        mark: Lakehouse//RT
        summary: Line balancing, andon response and launch curve tracking, run on OEE, cycle time and bottleneck-station losses against takt, with design engineering leading vehicle design simulation.
        uses:
          - - Plant Cockpit
            - Live OEE and bottleneck stations on the floor.
          - - Lakehouse//RT
            - Torque and vision checks at line latency.
        sub:
          - name: Plant Manager
            cares: line OEE, andon response and hitting the daily build-to-plan.
          - name: Production Engineering
            cares: takt balance, station cycle time and bottleneck losses on the line.
          - name: Launch / Program Manager
            cares: the SOP ramp and closing quality gaps against the launch curve.
        ucs:
          - Defect Detection
          - Engineering Program Management & Bid Creation
          - Supply & Materials Planning
      - name: Quality Engineering
        core: true
        mark: AI/BI
        summary: Defect pareto, supplier PPM and containment across plants, tracked on warranty cost per vehicle, scrap rate and time-to-containment.
        uses:
          - - Quality Command
            - Emerging defect trends before field campaigns.
          - - AI/BI
            - PPM and scrap on governed inspection data.
        sub:
          - name: Quality Director
            cares: warranty cost per vehicle, field campaigns and time-to-containment.
          - name: Supplier Quality
            cares: incoming PPM and containment across the tier-1 supply base.
          - name: Field Quality
            cares: emerging defect clusters and the recall or OTA fix that follows.
        ucs:
          - Defect Detection
          - Predictive Maintenance & Asset Health
      - name: Sales & Marketing
        mark: Model Serving
        summary: Incentive planning, conquest targeting and digital lead scoring, judged on incentive spend per unit, conquest rate and margin.
        uses:
          - - Incentive Optimizer
            - Program spend against margin guardrails.
          - - Model Serving
            - Lead scores in the CRM routing path.
        sub:
          - name: CMO
            cares: conquest rate, brand demand and incentive spend per unit.
          - name: Incentive Planning
            cares: program spend against margin and residual guardrails.
          - name: Digital Marketing
            cares: lead scoring, conquest targeting and the dealer handoff.
        ucs:
          - Customer 360
      - name: Aftersales
        mark: Apps
        summary: Service retention, parts availability and warranty recovery, measured on retention rate, parts fill rate and chargeback recovery, with product security accountable for vehicle cyber threat monitoring and Aftersales collaborating.
        uses:
          - - Service Advisor App
            - Next-best service offers on governed vehicle history.
          - - Apps
            - Dealer tools hosted next to governed data.
        sub:
          - name: Service Operations
            cares: service retention, fix-first-visit and dealer capacity.
          - name: Parts & Supply
            cares: parts fill rate and days supply across DCs and dealers.
          - name: Warranty Management
            cares: chargeback recovery and warranty cost against accrual.
        ucs:
          - Demand Forecasting
          - Predictive Maintenance & Asset Health
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land MES torque traces, telematics CAN signals, dealer DMS and warranty claims; own Bronze to Silver and the pager when the OEE tables stall.
        uses:
          - - Lakeflow Connect
            - Managed connectors for MES, ERP and dealer DMS sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on line and telematics feeds.
          - - Lakewatch
            - Freshness on the OEE and quality tables the plant reads each shift.
        sub:
          - name: Streaming / Plant Data
            cares: MES torque traces and andon events at line latency.
          - name: Telematics Data
            cares: CAN signals and remote diagnostics off the connected fleet.
          - name: Dealer & Warranty Data
            cares: DMS, warranty claims and the finance mart feeds.
        ucs:
          - Defect Detection
          - Predictive Maintenance & Asset Health
      - name: Data Scientists
        mark: MLflow
        summary: Predictive-quality, remaining-useful-life, lead-scoring and incentive models, and whether they still hold across a model-year changeover.
        uses:
          - - Feature Store
            - VIN and station features read identically in training and serving.
          - - MLflow
            - Every quality and RUL model tracked for audit and reproduction.
          - - Model Serving
            - Quality and lead models scored in the line and CRM path.
        sub:
          - name: Quality & Reliability ML
            cares: predictive-quality and remaining-useful-life models by station and VIN.
          - name: Connected-Vehicle ML
            cares: fault prediction and battery state-of-health from telemetry.
          - name: Commercial ML
            cares: lead scoring, conquest and incentive optimisation models.
        ucs:
          - Defect Detection
          - Predictive Maintenance & Asset Health
      - name: App Developers
        mark: Apps
        summary: Ship the plant cockpit, quality command, incentive optimizer and service advisor apps operations and dealers work in, next to governed VIN data.
        uses:
          - - Apps
            - Plant and dealer screens with no separate web tier to secure.
          - - Lakebase
            - Serverless Postgres for line and service-advisor state.
          - - Agent Bricks
            - Agents that draft containment and work orders against governed tools.
        sub:
          - name: Plant Apps
            cares: the Plant Cockpit and Quality Command screens on the floor.
          - name: Dealer & Service Apps
            cares: the Service Advisor and incentive tools dealers work in.
          - name: Agent & Workflow
            cares: agents drafting containment and work orders on governed data.
        ucs:
          - Defect Detection
          - Customer 360
          - Predictive Maintenance & Asset Health
consumers:
  - name: BI & Productivity
    icon: chart
    from: bi
    tiles:
      - name: Tableau / Power BI
