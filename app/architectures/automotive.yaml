  - name: Databricks Apps
    icon: apps
    tiles:
      - name: Plant Cockpit
        icon: gauge
        short: Line OEE
        summary: Live throughput, andon state and bottleneck stations across assembly lines.
      - name: Quality Command
        icon: gavel
        short: Defect intelligence
        summary: Emerging defect clusters flagged before field campaigns are required.
      - name: Incentive Optimizer
        icon: market
        short: Program planning
        summary: Regional incentive spend modeled against margin and conquest targets.
      - name: Service Advisor App
        icon: custlake
        short: Aftersales
        summary: Next-best service and retention offers on governed vehicle history.
  - name: AI/BI Dashboards
    icon: aibi
    tiles:
      - name: Plant Quality & OEE
        icon: aibi
        summary: Line OEE, defect PPM and launch-curve tracking on certified Metric Views.
        kpis:
          - OEE
          - Defect PPM
          - First-time-through
          - Launch curve attainment
          - Andon downtime
        teams:
          - Manufacturing
          - Quality Engineering
          - Plant Manager
      - name: Warranty & Field Performance
        icon: aibi
        summary: Warranty cost, field failure trends and chargeback recovery.
        kpis:
          - Warranty cost per vehicle
          - Field failure rate
          - Time-to-containment
          - Chargeback recovery
          - Recall exposure
        teams:
          - Quality Engineering
          - Aftersales
          - Warranty Management
      - name: Dealer Inventory & Sales
        icon: aibi
        summary: Days supply, allocation, conquest and incentive efficiency across dealers.
        kpis:
          - Days supply
          - Allocation fill
          - Conquest rate
          - Incentive spend per unit
          - Lead conversion
        teams:
          - Sales & Marketing
          - Incentive Planning
          - Digital Marketing
      - name: Connected & Aftersales
        icon: aibi
        summary: Connected diagnostics, battery health, parts fill and service retention.
        kpis:
          - Service retention
          - Parts fill rate
          - Battery state-of-health
          - Proactive offer take rate
          - Fix-first-visit
        teams:
          - Aftersales
          - Service Operations
          - Parts & Supply
  - name: Agent Harnesses
    icon: agents
    tiles:
      - name: Omnigent OSS
        icon: omni
        short: Databricks, open source
        summary: Open-source meta-harness above existing agent frameworks, enabling agent composition, collaboration and centralised governance from one interface.
        capabilities:
          - Build
          - Deploy
          - Optimize
          - Govern
        related:
          - Agent Bricks
          - Unity Gateway
      - name: Claude Code
        core: true
        icon: code
        short: 3rd-party harness
        summary: Anthropic's coding harness working against the platform through MCP, with spend, routing and policy governed by Unity Gateway.
      - name: OpenAI Codex
        core: true
        icon: code
        short: 3rd-party harness
        summary: OpenAI's coding harness connected over MCP, governed at runtime by Unity Gateway rather than trusted by configuration.
      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Plant Quality & Throughput Agent
        icon: genie
        summary: Ask about OEE, defect PPM and launch-curve progress by line and station, and vehicle-program milestones and supplier bid packages.
        feeds:
          - Siemens Opcenter
          - Rockwell FactoryTalk
          - Bosch Nexeed
          - Siemens Teamcenter
          - Ivalua
          - Quality, throughput, loyalty
        teams:
          - Manufacturing
          - Quality Engineering
          - Plant Manager
          - Launch / Program Manager
        questions:
          - What was plant OEE by line and shift yesterday?
          - Which stations are driving defect PPM this week?
          - How is the launch curve tracking against SOP targets by week?
          - Which supplier lead-time risks threaten JIS/JIT builds this week?
          - Which andon events caused the most line downtime?
          - Which vehicle programs are slipping against their milestone plan and SOP dates?
          - How do open supplier bid packages and quotes compare across the tier-1 base?
      - name: Warranty & Field Quality Agent
        icon: genie
        summary: Explore warranty cost, field failures and supplier chargebacks across the fleet.
        feeds:
          - Finance & Warranty Mart
          - SAP Aftermarket
          - Mitchell Repair
          - Conformed vehicles and parts
        teams:
          - Quality Engineering
          - Aftersales
          - Supplier Quality
        questions:
          - What is warranty cost per vehicle by model and model year?
          - Which failure modes trace back to which supplier lots and stations?
          - Which supplier lots are linked to recoverable chargebacks?
          - Where is time-to-containment slipping by defect cluster?
          - Which VINs are candidates for an OTA fix versus a recall?
      - name: Dealer & Sales Agent
        icon: genie
        summary: Answer inventory, days-supply and conquest questions across the dealer network.
        feeds:
          - CDK Global DMS
          - VinSolutions CRM
          - Polk Registration
          - Quality, throughput, loyalty
        teams:
          - Sales & Marketing
          - Incentive Planning
          - Digital Marketing
        questions:
          - Which owners span multiple purchases, service and conquest across the network?
          - What is forecast parts and vehicle demand by market next quarter?
          - Which dealers carry the highest floorplan credit exposure right now?
          - What is our conquest rate against key competitors this quarter?
          - Which leads are highest-propensity and unassigned?
      - name: Connected Vehicle & Service Agent
        icon: genie
        summary: Ask about connected diagnostics, battery health and service retention.
        feeds:
          - OEM Telematics Gateway
          - Aptiv Smart Vehicle
          - VinSolutions CRM
          - Conformed vehicles and parts
        teams:
          - Aftersales
          - Service Operations
          - Connected-Vehicle ML
        questions:
          - Which VINs show fault or battery-health signatures predicting a failure soon?
          - What is EV battery state-of-health distribution by fleet?
          - Which repair, parts and labor operation should be prescribed for each at-risk VIN?
          - What is service retention rate by dealer and region?
          - Which connected faults should trigger a proactive service offer?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Predictive Maintenance & Asset Health
        short: EV battery + drivetrain
        icon: stream
        summary: Remote fault, battery and drivetrain health predicted so service happens before failure.
        problem: Faults and battery degradation are discovered when a warning light comes on or the vehicle is towed in, and the telemetry that would have predicted the failure sits unused in the connected-vehicle stream.
        who_benefits: Aftersales
        how_built: CAN signals, battery telemetry and remote diagnostics land in Lakehouse//RT; asset-health and remaining-useful-life models tracked in MLflow and served through Model Serving raise proactive service offers in the Service Advisor App.
        components:
          - Service Advisor App
          - OEM Telematics Gateway
          - Lakehouse//RT
          - Model Serving
          - MLflow
        stories:
          - title: Rivian improves vehicle health and performance with Databricks
            url: https://www.databricks.com/customers/rivian
          - title: Mercedes-Benz transforms the car experience with Databricks
            url: https://www.databricks.com/customers/mercedes-benz
          - title: What Separates the Winners and Losers in the Connected Vehicle Data Revolution
            url: https://www.databricks.com/blog/what-separates-winners-and-losers-connected-vehicle-data-revolution
      - name: Defect Detection
        short: Torque & vision checks
        icon: iot
        summary: Torque and vision anomalies detected at the station before vehicles move on.
        problem: Defects are caught at final inspection or in the field, long after the station that caused them, so scrap, rework and warranty cost are locked in before anyone sees the pattern.
        who_benefits: Manufacturing
        how_built: Torque and vision checks stream into Lakehouse//RT; station features in Feature Store feed Model Serving models that flag suspect builds on the Plant Cockpit before the station releases.
        components:
          - Plant Cockpit
          - Lakehouse//RT
          - Model Serving
          - Feature Store
          - Siemens Opcenter
        stories:
          - title: Predictive quality starts where defect detection stops
            url: https://www.databricks.com/blog/predictive-quality-starts-where-defect-detection-stops
          - title: Resolving Manufacturing Quality with Machine Vision and MLOps
            url: https://www.databricks.com/blog/resolving-manufacturing-quality-machine-vision-and-mlops
      - name: Demand Forecasting
        short: Parts & aftermarket demand
        icon: product
        summary: Parts and aftermarket demand forecast against failure curves and field signals.
        problem: Dealers stock out of the parts customers actually need while capital sits in slow movers, because parts planning ignores the failure curves and field signals that predict real demand.
        who_benefits: Aftersales
        how_built: Failure, telematics and parts data are conformed on Delta Lake and scored in Model Serving with runs tracked in MLflow, positioning dealer and DC stock against predicted failure curves.
        components:
          - Service Advisor App
          - SAP Aftermarket
          - Model Serving
          - MLflow
          - OEM Telematics Gateway
        stories:
          - title: Volvo Group increases inventory visibility with Databricks
            url: https://www.databricks.com/customers/volvo/lakeflow-declarative-pipelines
          - title: Part-level demand forecasting Solution Accelerator
            url: https://github.com/databricks-industry-solutions/parts-demand-forecasting
      - name: Prescriptive Maintenance
        short: Guided fleet repairs
        icon: iot
        summary: The specific repair, parts and labor operation prescribed for each at-risk vehicle.
        problem: Predicting a fault is not enough; technicians still guess which repair, parts and labor operations to schedule, so at-risk vehicles wait for a second visit and the wrong parts are ordered.
        who_benefits: Aftersales
        how_built: Fault predictions from OEM Telematics Gateway are joined with Mitchell Repair labor guides and parts data, scored in Model Serving with runs tracked in MLflow, so the Service Advisor App prescribes the repair, parts and labor operation for each VIN.
        components:
          - Service Advisor App
          - OEM Telematics Gateway
          - Mitchell Repair
          - Model Serving
          - MLflow
        stories:
          - title: What is predictive maintenance on the Databricks platform
            url: https://www.databricks.com/blog/what-is-predictive-maintenance
          - title: "Databricks and Shell: industrial time series analytics on the Lakehouse"
            url: https://www.databricks.com/blog/developing-time-series-lakehouse-shell
      - name: Supply & Materials Planning
        short: JIS/JIT materials supply
        icon: network
        summary: Supplier lead times and materials plans scored so JIS/JIT builds are not starved.
        problem: Just-in-sequence and just-in-time builds depend on parts landing to a tight window, but lead-time and PO commitments sit in procurement and ERP apart from plant sequencing, so a slipping supplier is discovered when the line starves.
        who_benefits: Manufacturing
        how_built: Ivalua contract and PO lead times and SAP S/4HANA materials data are conformed on Delta Lake and scored in Model Serving against Bosch Nexeed sequencing, flagging JIS/JIT risk on the Plant Cockpit before a shortage stops the build.
        components:
          - Ivalua
          - SAP S/4HANA
          - Bosch Nexeed
          - Model Serving
          - Plant Cockpit
        stories:
          - title: Supply chain and distribution optimization on Databricks
            url: https://www.databricks.com/solutions/accelerators/supply-chain-distribution-optimization
      - name: Production Monitoring
        short: Line OEE & andon
        icon: gauge
        summary: Live line OEE, andon state and bottleneck stations tracked in real time across plants.
        problem: Line losses show up in the next morning's report rather than on the floor, so a stalling station, andon event or takt slip is diagnosed after the shift has already lost throughput.
        who_benefits: Manufacturing
        how_built: Siemens Opcenter and Rockwell FactoryTalk events stream into Lakehouse//RT and surface on the Plant Cockpit and AI/BI as live OEE, cycle time and andon state so production engineering acts within the shift.
        components:
          - Plant Cockpit
          - Lakehouse//RT
          - Siemens Opcenter
          - Rockwell FactoryTalk
          - AI/BI
        stories:
          - title: Toyota uses Zerobus Ingest for real-time factory data
            url: https://www.databricks.com/customers/toyota/lakeflow-connect
      - name: Quality Event Root Cause Analysis
        short: Warranty & field RCA
        icon: erp
        summary: Field failures and warranty events traced to the responsible station, lot and supplier.
        problem: When a field failure or quality event spikes, linking it back to the responsible supplier lot, station and claim is manual, so root cause is found slowly and recoverable chargebacks are missed.
        who_benefits: Aftersales
        how_built: Warranty claims, parts and field failures are conformed under Unity Catalog and analysed in Quality Command and AI/BI, tracing quality events to supplier lots and stations so root cause is found and chargebacks recovered.
        components:
          - Quality Command
          - Finance & Warranty Mart
          - AI/BI
          - Unity Catalog
          - SAP Aftermarket
        stories:
          - title: Manufacturing Root Cause Analysis with Causal AI
            url: https://www.databricks.com/blog/manufacturing-root-cause-analysis-causal-ai
      - name: Customer 360
        short: Owner & dealer 360
        icon: custlake
        summary: One governed view of the owner and dealer across CRM, DMS and registration for sales and marketing.
        problem: The same customer shows up in the CRM, the DMS and registration data as three different records, so sales and marketing cannot see one owner across purchase, service and conquest and every campaign targets a fragment.
        who_benefits: Sales & Marketing
        how_built: VinSolutions leads, CDK deals and service history and Polk registration are resolved into linked customer, dealer and VIN entities with effective-dated ownership or usage under Unity Catalog, so a governed customer and dealer 360 is read in AI/BI and asked of Genie.
        components:
          - CDK Global DMS
          - VinSolutions CRM
          - Polk Registration
          - Unity Catalog
          - AI/BI
        stories:
          - title: Al-Futtaim becomes customer-centric with Databricks
            url: https://www.databricks.com/customers/al-futtaim
      - name: Credit Decisioning
        short: Auto finance & floorplan
        icon: market
        summary: Dealer floorplan and retail auto-finance decisions scored on governed customer, deal and inventory data.
        problem: Dealer floorplan lines and retail finance approvals rely on stale credit snapshots and manual review, so exposure to a struggling dealer or a risky deal is recognised late.
        who_benefits: Finance
        how_built: CDK Global DMS deals and SAP S/4HANA receivables are conformed under Unity Catalog and scored in Model Serving, so floorplan and auto-finance risk is decisioned and monitored in AI/BI.
        components:
          - CDK Global DMS
          - SAP S/4HANA
          - Model Serving
          - Unity Catalog
          - AI/BI
        stories:
          - title: Transforming data pipelines to power faster credit decisions
            url: https://www.databricks.com/customers/capital-one
      - name: Engineering Program Management & Bid Creation
        short: Vehicle program & bids
        icon: network
        summary: Vehicle-program milestones and supplier bid packages tracked against program cost-to-completion so sourcing and commitment calls are made on the current position, not stale estimates.
        problem: Program milestones, BOM cost and supplier bid packages sit across PLM, procurement and ERP, so program cost-to-completion and quote comparisons are assembled by hand and a program slips or overruns before the true position is visible.
        who_benefits: Launch / Program Manager
        how_built: Siemens Teamcenter program configuration and milestones, Ivalua supplier bids and PO commitments and SAP S/4HANA program cost are conformed under Unity Catalog, so program cost-to-completion and bid-package comparisons surface in AI/BI with Agent Bricks drafting bid narratives against governed data.
        components:
          - Siemens Teamcenter
          - Ivalua
          - SAP S/4HANA
          - AI/BI
          - Agent Bricks
        stories:
          - title: Databricks for Federal Government
            url: https://www.databricks.com/solutions/industries/federal-government
