  Silver:
    short: Conformed vehicles and parts
    summary: VINs, BOMs, dealers and service events resolved into single entities across engineering, plant and retail systems.
  Gold:
    short: Quality, throughput, loyalty
    summary: 'Contracted products operations and sales run on: plant OEE, defect PPM, days supply and service retention.'
