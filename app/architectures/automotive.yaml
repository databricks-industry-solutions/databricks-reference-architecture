        summary: Plant and regional sales dashboards on SQL warehouses.
      - name: Microsoft Teams
        icon: chat
        summary: Genie in Teams for quality and inventory in plant channels.
      - name: Notebooks & IDEs
        icon: notebook
        summary: Engineering notebooks against governed BOM and telemetry.
  - name: Dealer & Partners
    icon: partner
    tiles:
      - name: Dealer Inventory Feed
        icon: api
        summary: Days supply and allocation pushed to DMS nightly.
